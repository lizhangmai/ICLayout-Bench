code\u003e.\u003c/p\u003e\n\u003ch2 id=\"problem-inputs-and-interface\"\u003eInputs and Interface\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003ematerials/circuit.cdl\u003c/code\u003e is the authoritative physical netlist; \u003ccode\u003ematerials/circuit.spice\u003c/code\u003e is the same compact-device circuit for simulation. \u003ccode\u003ematerials/testbench.spice\u003c/code\u003e supplies the external fixture. Both source and extracted candidate use the exact same deck, bias, loads, excitation, initial-state procedure and measurement windows. Ordered ports: vdd (drain and divider supply), vout (source output), vss (body/divider return).\u003c/p\u003e\n\u003ch2 id=\"problem-operating-conditions\"\u003eOperating Conditions\u003c/h2\u003e\n\u003cp\u003eGF180 TT, 27 C. Supply is independently 1.2 or 1.5 V; output load is independently 100 kohm or 1 Mohm, in parallel with 10 pF. A 1 uA sink turns on at 2 us with a 20 ns edge and stays on throughout the 10 us run. Maximum step is 2 ns. The initial state has zero additional sink current and is computed by DC OP. A separate loaded DC OP with a 1 uA sink is compared with the 8–10 us transient endpoint. Supply power includes the divider, transistor and resistive load.\u003c/p\u003e\n\u003ch2 id=\"problem-physical-requirements\"\u003ePhysical Requirements\u003c/h2\u003e\n\u003cp\u003eUse GF180 native KLayout main rule deck and named-interface LVS; Magic RC extraction with its reviewed 10-way grid subdivision. No case-specific waivers. Candidate extraction must preserve every model, multiplicity, size, resistor value, connection and ordered port. The functional outline includes devices, wells, contacts and all routing layers declared in the public task; annotation and pin labels do not add area. Maximum outline: 5000 by 1000 um. Maximum GDS size: 10485760 bytes. Every device and resistor must be physical; no ideal internal macro or auxiliary servo may be added. External sources, probe loads and storage capacitors belong to the testbench.\u003c/p\u003e\n\u003ch2 id=\"problem-electrical-requirements-and-scoring\"\u003eElectrical Requirements and Scoring\u003c/h2\u003e\n\u003cp\u003ePhysical checks and declared functional bounds remain mandatory. Quality has no\nfixed allowed-degradation threshold. Each \u003ccode\u003esource_*\u003c/code\u003e job simulates the declared\nsource circuit with exactly the same testbench, model resources, parameters,\nload and measurement window as its paired extracted-candidate job. A source\nobservation is the 100-point electrical baseline; it is independent of the\nsubmitted GDS. All individual pairs are retained in the evaluation report.\u003c/p\u003e\n\u003cp\u003eFor a post-layout observation x and its source observation b:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eMaximize: q = x/b; minimize: q = b/x. When a numerical scale s is declared,\nuse (x+s)/(b+s) or its inverse. This handles zero-valued error measurements;\ns is a normalization floor, not an allowed degradation or pass threshold.\u003c/li\u003e\n\u003cli\u003eAmplitude dB: q = 10^((x-b)/20) for maximize, its inverse for minimize.\u003c/li\u003e\n\u003cli\u003eTarget: q = 1/(1+abs(x-b)/s), with a declared physical scale s. Signed and\nzero-valued operating points are never divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eScoring uses \u003ccode\u003elayout\u003c/code\u003e. A metric uses its worst paired quality q. The score is\nS = 100 * product(q_i ** w_i), including area quality\nq_area = area_reference / candidate_functional_area. The weights below sum to\none. Dimensions describe measurements but do not determine their weights.\nPhysical or functional rejection scores zero; missing or invalid measurements\nproduce an unknown score, including measurements with zero weight.\nSource-equivalent performance at the area reference scores 100; improvements\ncan exceed 100. A weight expresses a tradeoff, not a hard acceptance limit.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eDefinition\u003c/th\u003e\n\u003cth\u003eBound\u003c/th\u003e\n\u003cth\u003eQuality\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eDC loaded source-follower output\u003c/td\u003e\n\u003ctd\u003e0 to 1.5\u003c/td\u003e\n\u003ctd\u003ebias: target, target, scale=0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eDC power including internal 100k/100k divider\u003c/td\u003e\n\u003ctd\u003e0 to unbounded\u003c/td\u003e\n\u003ctd\u003esupply: ratio, minimize, scale=1e-12\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estep_shift_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eMean output at 8–10 us minus initial output\u003c/td\u003e\n\u003ctd\u003eunbounded to unbounded\u003c/td\u003e\n\u003ctd\u003eresponse: target, target, scale=0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eripple_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003ePeak-to-peak output over final 2 us\u003c/td\u003e\n\u003ctd\u003e0 to unbounded\u003c/td\u003e\n\u003ctd\u003ediagnostic / functional only\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eOnly output operating point, finite load-step shift and actual supply loss are scored. Late-window ripple is an unscored diagnostic; sub-nanovolt ripple is below numerical voltage resolution. No regulation accuracy, PSRR, dropout or loop-margin claim is made. The model guide includes 50 um width as a pseudo-device scaling boundary, not a directly measured width sample.\u003c/p\u003e\n\u003cp\u003eStatic output bounds are physical rail-domain checks, nonnegative power/error bounds establish measurement domains, and KCL guards reject inconsistent DC solutions. All required conditions must be valid. No advertised upstream performance is a hard gate. The metric table specifies each target scale and normalization floor. Floors prevent zero-error ratios; scales and floors are normalization units, not acceptance tolerances.\u003c/p\u003e\n\u003cp\u003eFor each metric take the worst same-condition source-paired quality. Target quality is \u003ccode\u003e1/(1+abs(candidate-source)/scale)\u003c/code\u003e; minimizing ratio quality is \u003ccode\u003e(source+scale)/(candidate+scale)\u003c/code\u003e.  Missing/nonfinite/invalid source or candidate measurements and tool failures yield an unknown score; completed physical/functional rejection yields zero. Bounds apply to every observation.\u003c/p\u003e\n\u003cp\u003eCompact area anchor: 1200 um2 = 50 × 6 um2 pass-device/contact envelope + 4 × 55 × 2 um2 resistor/contact/isolation envelopes + 460 um2 routing/guard-ring allowance. It is a compact engineering estimate independent of witness sparsity. Coefficient 3: local analog bias/transfer and controlled load response. The circuit and these anchors are fixed before participant evaluation.\u003c/p\u003e\n\u003ch3 id=\"problem-score-weights\"\u003eScore weights\u003c/h3\u003e\n\u003cp\u003eRegulator stub: loaded operating point 34%; load response 34%; power 17%; area 15%. Each objective's weight is divided equally among its metrics.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.15\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.340000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estep_shift_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.340000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.170000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch2 id=\"problem-tools-and-submission\"\u003eTools and Submission\u003c/h2\u003e\n\u003cp\u003eSolve budget: \u003cstrong\u003e6 hours\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eUse the runtime task/protocol and reviewed resource bundle to discover tools and feedback. Submit \u003ccode\u003e/workspace/output/final.gds\u003c/code\u003e explicitly through the protocol; merely writing it is not a submission. The reference and maintainer source records are excluded from solver inputs.\u003c/p\u003e\n12:T1269,\u003cp\u003ePhysical checks and declared functional bounds remain mandatory. Quality has no\nfixed allowed-degradation threshold. Each \u003ccode\u003esource_*\u003c/code\u003e job simulates the declared\nsource circuit with exactly the same testbench, model resources, parameters,\nload and measurement window as its paired extracted-candidate job. A source\nobservation is the 100-point electrical baseline; it is independent of the\nsubmitted GDS. All individual pairs are retained in the evaluation report.\u003c/p\u003e\n\u003cp\u003eFor a post-layout observation x and its source observation b:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eMaximize: q = x/b; minimize: q = b/x. When a numerical scale s is declared,\nuse (x+s)/(b+s) or its inverse. This handles zero-valued error measurements;\ns is a normalization floor, not an allowed degradation or pass threshold.\u003c/li\u003e\n\u003cli\u003eAmplitude dB: q = 10^((x-b)/20) for maximize, its inverse for minimize.\u003c/li\u003e\n\u003cli\u003eTarget: q = 1/(1+abs(x-b)/s), with a declared physical scale s. Signed and\nzero-valued operating points are never divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eScoring uses \u003ccode\u003elayout\u003c/code\u003e. A metric uses its worst paired quality q. The score is\nS = 100 * product(q_i ** w_i), including area quality\nq_area = area_reference / candidate_functional_area. The weights below sum to\none. Dimensions describe measurements but do not determine their weights.\nPhysical or functional rejection scores zero; missing or invalid measurements\nproduce an unknown score, including measurements with zero weight.\nSource-equivalent performance at the area reference scores 100; improvements\ncan exceed 100. A weight expresses a tradeoff, not a hard acceptance limit.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eDefinition\u003c/th\u003e\n\u003cth\u003eBound\u003c/th\u003e\n\u003cth\u003eQuality\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eDC loaded source-follower output\u003c/td\u003e\n\u003ctd\u003e0 to 1.5\u003c/td\u003e\n\u003ctd\u003ebias: target, target, scale=0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eDC power including internal 100k/100k divider\u003c/td\u003e\n\u003ctd\u003e0 to unbounded\u003c/td\u003e\n\u003ctd\u003esupply: ratio, minimize, scale=1e-12\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estep_shift_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eMean output at 8–10 us minus initial output\u003c/td\u003e\n\u003ctd\u003eunbounded to unbounded\u003c/td\u003e\n\u003ctd\u003eresponse: target, target, scale=0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eripple_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003ePeak-to-peak output over final 2 us\u003c/td\u003e\n\u003ctd\u003e0 to unbounded\u003c/td\u003e\n\u003ctd\u003ediagnostic / functional only\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eOnly output operating point, finite load-step shift and actual supply loss are scored. Late-window ripple is an unscored diagnostic; sub-nanovolt ripple is below numerical voltage resolution. No regulation accuracy, PSRR, dropout or loop-margin claim is made. The model guide includes 50 um width as a pseudo-device scaling boundary, not a directly measured width sample.\u003c/p\u003e\n\u003cp\u003eStatic output bounds are physical rail-domain checks, nonnegative power/error bounds establish measurement domains, and KCL guards reject inconsistent DC solutions. All required conditions must be valid. No advertised upstream performance is a hard gate. The metric table specifies each target scale and normalization floor. Floors prevent zero-error ratios; scales and floors are normalization units, not acceptance tolerances.\u003c/p\u003e\n\u003cp\u003eFor each metric take the worst same-condition source-paired quality. Target quality is \u003ccode\u003e1/(1+abs(candidate-source)/scale)\u003c/code\u003e; minimizing ratio quality is \u003ccode\u003e(source+scale)/(candidate+scale)\u003c/code\u003e.  Missing/nonfinite/invalid source or candidate measurements and tool failures yield an unknown score; completed physical/functional rejection yields zero. Bounds apply to every observation.\u003c/p\u003e\n\u003cp\u003eCompact area anchor: 1200 um2 = 50 × 6 um2 pass-device/contact envelope + 4 × 55 × 2 um2 resistor/contact/isolation envelopes + 460 um2 routing/guard-ring allowance. It is a compact engineering estimate independent of witness sparsity. Coefficient 3: local analog bias/transfer and controlled load response. The circuit and these anchors are fixed before participant evaluation.\u003c/p\u003e\n\u003ch3\u003eScore weights\u003c/h3\u003e\n\u003cp\u003eRegulator stub: loaded operating point 34%; load response 34%; power 17%; area 15%. Each objective's weight is divided equally among its metrics.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.15\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.340000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estep_shift_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.340000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.170000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n6:[\"$\",\"$8\",null,{\"fallback\":[\"$\",\"p\",null,{\"children\":\"Loading published evidence…\"}],\"children\":[\"$\",\"$L10\",null,{\"task\":{\"case_path\":\"tasks/gf180mcuD/analog-db/cases/ldo_006_stub/case.toml\",\"coefficient\":3,\"collection\":\"analog-db\",\"configuration_url\":\"/ICLayout-Bench/assets/3a47bf05ab107c1f351121652575a3e1687eb0ea83580f2ac8a13a35f0548534.txt\",\"description_html\":\"$11\",\"description_path\":\"tasks/gf180mcuD/analog-db/cases/ldo_006_stub/problem.md\",\"hours\":6,\"id\":\"gf180mcuD.analog-db.ldo_006_stub\",\"inputs\":{\"description\":{\"format\":\"text\",\"path\":\"problem.md\",\"sha256\":\ \":\"target\",\"id\":\"output_v\",\"lower\":0,\"normalization\":\"target\",\"observations\":[\"condition_0:output_v\",\"condition_1:output_v\",\"condition_2:output_v\",\"condition_3:output_v\"],\"scale\":0.1,\"unit\":\"V\",\"upper\":1.5},{\"aggregation\":\"max\",\"baseline\":[\"source_condition_0:power_w\",\"source_condition_1:power_w\",\"source_condition_2:power_w\",\"source_condition_3:power_w\"],\"category\":\"performance\",\"dimension\":\"supply\",\"direction\":\"minimize\",\"id\":\"power_w\",\"lower\":0,\"normalization\":\"ratio\",\"observations\":[\"condition_0:power_w\",\"condition_1:power_w\",\"condition_2:power_w\",\"condition_3:power_w\"],\"scale\":1e-12,\"unit\":\"W\"},{\"aggregation\":\"max\",\"baseline\":[\"source_condition_0:step_shift_v\",\"source_condition_1:step_shift_v\",\"source_condition_2:step_shift_v\",\"source_condition_3:step_shift_v\"],\"category\":\"performance\",\"dimension\":\"response\",\"direction\":\"target\",\"id\":\"step_shift_v\",\"normalization\":\"target\",\"observations\":[\"condition_0:step_shift_v\",\"condition_1:step_shift_v\",\"condition_2:step_shift_v\",\"condition_3:step_shift_v\"],\"scale\":0.1,\"unit\":\"V\"},{\"aggregation\":\"max\",\"category\":\"performance\",\"direction\":\"minimize\",\"id\":\"ripple_v\",\"lower\":0,\"observations\":[\"condition_0:ripple_v\",\"condition_1:ripple_v\",\"condition_2:ripple_v\",\"condition_3:ripple_v\"],\"unit\":\"V\"}],\"pdk\":\"gf180mcuD\",\"reader\":{\"category\":\"Amplifiers \u0026 RF\",\"summary\":\"Tracks an input bias with a divider-biased NMOS source follower.\",\"title\":\"Divider-Biased NMOS Source Follower\"},\"schematic_url\":\"/ICLayout-Bench/assets/2ae742ba538a1dd6c31b2d131f78895825123bf949cbdc1783a0f6f3f73aa571.svg\",\"scoring\":{\"area_metric\":\"functional_area\",\"area_target\":1200,\"method\":\"layout\",\"rationale\":\"Regulator stub: loaded operating point 34%; load response 34%; power 17%; area 15%. Each objective's weight is divided equally among its metrics.\",\"weights\":{\"functional_area\":0.15,\"output_v\":0.34,\"power_w\":0.17,\"step_shift_v\":0.34}},\"sections\":{\"Electrical Requirements and Scoring\":\"$12\",\"Objective\":\"\u003cp\u003eA single fixed 50/0.5 um nfet_03v3 (m=1) forms a source follower. Its drain connects to vdd, source to vout, body to vss, and gate to the midpoint of the internal 100 kohm/100 kohm supply divider. Each resistor uses two native ppolyf_u_1k segments, totaling 99995.18 ohm at TT/27 C. There is no control input, external reference, error amplifier or closed-loop regulator. Target top cell: \u003ccode\u003eldo_006_stub\u003c/code\u003e.\u003c/p\u003e\\n\",\"Operating Conditions\":\"\u003cp\u003eGF180 TT, 27 C. Supply is independently 1.2 or 1.5 V; output load is independently 100 kohm or 1 Mohm, in parallel with 10 pF. A 1 uA sink turns on at 2 us with a 20 ns edge and stays on throughout the 10 us run. Maximum step is 2 ns. The initial state has zero additional sink current and is computed by DC OP. A separate loaded DC OP with a 1 uA sink is compared with the 8–10 us transient endpoint. Supply power includes the divider, transistor and resistive load.\u003c/p\u003e\\n\",\"Physical Requirements\":\"\u003cp\u003eUse GF180 native KLayout main rule deck and named-interface LVS; Magic RC extraction with its reviewed 10-way grid subdivision. No case-specific waivers. Candidate extraction must preserve every model, multiplicity, size, resistor value, connection and ordered port. The functional outline includes devices, wells, contacts and all routing layers declared in the public task; annotation and pin labels do not add area. Maximum outline: 5000 by 1000 um. Maximum GDS size: 10485760 bytes. Every device and resistor must be physical; no ideal internal macro or auxiliary servo may be added. External sources, probe loads and storage capacitors belong to the testbench.\u003c/p\u003e\\n\"},\"source_url\":\"https://github.com/MacAnalog/spicexplorer-release/tree/263d0322f8900dc331536fbbe6c0e804514fc454/analog-db/circuits/ldo_006_stub\",\"status\":\"qualified\",\"title\":\"Divider-Biased NMOS Source Follower\"},\"catalog\":{\"boards\":[],\"contexts\":[],\"experiments\":[],\"runs\":[],\"tasks\":[]},\"evidenceError\":false}]}]\nc:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n13:I[27201,[\"/ICLayout-Bench/_next/static/chunks/3gll1ekbrh320.js\"],\"IconMark\"]\n9:null\ne:[[\"$\",\"title\",\"0\",{\"children\":\"ICLayout-Bench | Circuit layout intelligence\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Measured progress in AI-driven integrated circuit layout. Explore circuits, model conditions and reviewed experimental evidence.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/ICLayout-Bench/brand/iclayout-bench.svg\",\"type\":\"image/svg+xml\",\"sizes\":\"any\"}],[\"$\",\"$L13\",\"3\",{}]]\n"])</script></body></html>
