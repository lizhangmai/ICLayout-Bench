ction.\u003c/p\u003e\n\u003ch2 id=\"problem-inputs-and-interface\"\u003eInputs and Interface\u003c/h2\u003e\n\u003cp\u003eIn addition to this problem, the solver receives the following declared\nmaterials. The structured constraints\nand evaluation plan are also available at runtime through \u003ccode\u003e/protocol/task.json\u003c/code\u003e.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eInput\u003c/th\u003e\n\u003cth\u003ePurpose\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"/ICLayout-Bench/assets/0fe0279db5d2975dec32196670118a05d0dd9a240e7f70b642c94e0a7ec80a4c.txt\"\u003ematerials/circuit.cdl\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eAuthoritative LVS netlist for \u003ccode\u003eDIFF_COMPARATOR\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"/ICLayout-Bench/assets/daffa3508cb005a2a96651e48ec56909c94596208d48cbc099e24702f8f72221.txt\"\u003ematerials/circuit.spice\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003ePre-layout simulator netlist\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"/ICLayout-Bench/assets/61d8165d7b359539cebe3a94815dcbd22cede35ca87c393e345832523f3c4c8e.txt\"\u003ematerials/testbench.spice\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eClock stimulus and public measurement expressions\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eUse one distinct external conductor for each ordered port. Internal nodes must\nnot be exposed as ports.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003ePort\u003c/th\u003e\n\u003cth\u003eFunction\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003evdd\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003ePositive supply\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003egnd\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eGround and substrate reference\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eV+\u003c/code\u003e, \u003ccode\u003eV-\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDifferential input pair\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eclk\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDynamic latch clock\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eout-\u003c/code\u003e, \u003ccode\u003eout+\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eComplementary decision outputs\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003evbias\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eBias input\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eThe extraction port order is \u003ccode\u003evdd gnd V+ V- clk out- out+ vbias\u003c/code\u003e.\u003c/p\u003e\n\u003ch2 id=\"problem-operating-conditions\"\u003eOperating Conditions\u003c/h2\u003e\n\u003cp\u003eThe supplied deck evaluates the pre-layout and candidate-derived netlists with\nthe same model and stimulus definitions.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eParameter\u003c/th\u003e\n\u003cth\u003eSetting\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eProcess corner\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003emos_tt\u003c/code\u003e, \u003ccode\u003eres_typ\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eTemperature\u003c/td\u003e\n\u003ctd\u003e27 °C\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eSupply\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eVDD = 1.2 V\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eInput reference and bias\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eV- = vbias = 0.6 V\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eDifferential input\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eV+ − V- = −5, −3, +3, +5 mV\u003c/code\u003e, tested separately\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eClock\u003c/td\u003e\n\u003ctd\u003e100 MHz, 1.2 V swing, 500 ps rise and fall, 5 ns high time\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eOutput load\u003c/td\u003e\n\u003ctd\u003e50 fF on each output\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eTransient analysis\u003c/td\u003e\n\u003ctd\u003e100 ns duration, 10 ps maximum time step\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eMeasurements\u003c/td\u003e\n\u003ctd\u003eSkip the first two cycles and evaluate the next eight cycles\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eThe testbench excludes power consumed by the external clock, input, and bias\ndrivers from the reported supply-power measurement.\u003c/p\u003e\n\u003ch2 id=\"problem-physical-requirements\"\u003ePhysical Requirements\u003c/h2\u003e\n\u003cp\u003eSubmit a readable GDSII file with a nonempty \u003ccode\u003eDIFF_COMPARATOR\u003c/code\u003e top cell. The file\nmust be at most 10 MiB (10,485,760 bytes) and must contain the complete hierarchy\nneeded by the target cell.\u003c/p\u003e\n\u003cp\u003eThe evaluator runs the pinned SG13G2 main and additional maximal DRC rules in\ndeep mode, with density and antenna checks disabled and no waivers. LVS uses the\ncurrent \u003ccode\u003elvs-upstream.json\u003c/code\u003e profile and strict named-port matching against\n\u003ccode\u003ematerials/circuit.cdl\u003c/code\u003e; port names are matched case-insensitively, while every\ndeclared port must remain on its own conductor with the declared connectivity.\u003c/p\u003e\n\u003cp\u003eThe functional outline is the recursive bounding box of polygons on these\nSG13G2 datatype-0 layers, including child cells and the complete routing stack:\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003e1, 3, 5, 6, 7, 8, 10, 11, 13, 14, 19, 24, 26, 28, 29, 30, 31, 32, 33, 35, 36, 40, 44, 46, 49, 50, 51, 52, 53, 55, 58, 66, 67, 90, 101, 111, 125, 126, 128, 129, 133, 134, 139, 152\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eThe maximum width is 45 µm and the maximum height is\n45 µm, measured along the submitted X and Y axes.\nFunctional area is width multiplied by height. Text, annotation and filler\nlayers are excluded. The area score below uses this same functional footprint.\u003c/p\u003e\n\u003cp\u003eAfter the physical and geometry gates pass, Magic extracts distributed wire\nresistance and layout capacitance from the submitted GDS. Device merging and\nresistor-network simplification are disabled. The compact-device extraction\nboundary represents MOS bodies at ideal model rails; explicit taps remain part\nof physical LVS but are not emitted as extracted tap elements. Substrate sheet\nand tap resistance as extracted quantities, body coupling, and noise are outside\nthe declared scope. The source and post-layout runs use the same nominal\nstimuli and models; a finite-source-tap versus ideal-body calibration bounds this\nextraction choice.\u003c/p\u003e\n\u003ch2 id=\"problem-electrical-requirements-and-scoring\"\u003eElectrical Requirements and Scoring\u003c/h2\u003e\n\u003cp\u003ePhysical checks and declared functional bounds remain mandatory. Quality has no\nfixed allowed-degradation threshold. Each \u003ccode\u003esource_*\u003c/code\u003e job simulates the declared\nsource circuit with exactly the same testbench, model resources, parameters,\nload and measurement window as its paired extracted-candidate job. A source\nobservation is the 100-point electrical baseline; it is independent of the\nsubmitted GDS. All individual pairs are retained in the evaluation report.\u003c/p\u003e\n\u003cp\u003eFor a post-layout observation x and its source observation b:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eMaximize: q = x/b; minimize: q = b/x. When a numerical scale s is declared,\nuse (x+s)/(b+s) or its inverse. This handles zero-valued error measurements;\ns is a normalization floor, not an allowed degradation or pass threshold.\u003c/li\u003e\n\u003cli\u003eAmplitude dB: q = 10^((x-b)/20) for maximize, its inverse for minimize.\u003c/li\u003e\n\u003cli\u003eTarget: q = 1/(1+abs(x-b)/s), with a declared physical scale s. Signed and\nzero-valued operating points are never divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eScoring uses \u003ccode\u003elayout\u003c/code\u003e. A metric uses its worst paired quality q. The score is\nS = 100 * product(q_i ** w_i), including area quality\nq_area = area_reference / candidate_functional_area. The weights below sum to\none. Dimensions describe measurements but do not determine their weights.\nPhysical or functional rejection scores zero; missing or invalid measurements\nproduce an unknown score, including measurements with zero weight.\nSource-equivalent performance at the area reference scores 100; improvements\ncan exceed 100. A weight expresses a tradeoff, not a hard acceptance limit.\u003c/p\u003e\n\u003cp\u003eMeasurement definitions below use the supplied SPICE node/source names.\n\u003ccode\u003ev(n)\u003c/code\u003e is node voltage and \u003ccode\u003ei(V)\u003c/code\u003e is current into a voltage source; delivered\npower therefore uses a minus sign. \u003ccode\u003edb(z)=20*log10(abs(z))\u003c/code\u003e, \u003ccode\u003emag/abs\u003c/code\u003e\ndenote magnitude, and \u003ccode\u003ecph\u003c/code\u003e is continuous phase in radians. \u003ccode\u003efind\u003c/code\u003e, \u003ccode\u003ewhen\u003c/code\u003e,\n\u003ccode\u003efrom/to\u003c/code\u003e, and \u003ccode\u003erise/fall\u003c/code\u003e retain the deck's interpolation, window and\ncrossing conventions; SPICE suffixes p/n/u/m/meg/g mean pico/nano/micro/\nmilli/mega/giga. Nested \u003ccode\u003eavg\u003c/code\u003e, \u003ccode\u003emin\u003c/code\u003e, \u003ccode\u003emax\u003c/code\u003e, \u003ccode\u003evecmin/vecmax\u003c/code\u003e and \u003ccode\u003ederiv\u003c/code\u003e\nmean the stated window average, extrema and sampled derivative. All\ndeclared conditions are measured separately and paired with the same\nsource condition; a group uses its worst paired quality.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eDefinition / observations\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eQuality rule\u003c/th\u003e\n\u003cth\u003eFunctional bounds\u003c/th\u003e\n\u003cth\u003eScale\u003c/th\u003e\n\u003cth\u003eDimension\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eworst_delay\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eClock falling through 0.6 V to polarity-correct output difference reaching 1 V in cycles 2–9 (trigger delays 20–90 ns; target search starts 5.75 ns later). Every cycle and input condition is paired; the worst quality is scored.\u003c/td\u003e\n\u003ctd\u003es\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edecision_margin\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMinimum polarity*(V(OUTP)-V(OUTM)) in each 1 ns decision window, 28.75–29.75 ns through 98.75–99.75 ns; all eight cycles and four signed input conditions must pass.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003efunctional check\u003c/td\u003e\n\u003ctd\u003e1.0 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003efunctional check\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003esupply_power\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMean delivered VDD power, -V(VDD)*I(VDD), over 20–100 ns, independently for each signed input condition.\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003ctd\u003esupply\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eArea reference: \u003cstrong\u003e502.96 um2\u003c/strong\u003e. 24 expanded device instances; sum of device/contact envelopes 306.3377 um2, per-side envelope allowance 0.6 um, 50% routing allowance and total outer width/height allowance 1.2 um. Estimate = ceil(100 * (1.5 * envelope_sum + 2 * margin * sqrt(envelope_sum) + margin^2)) / 100. Here margin is the total allowance across two opposite sides; the envelope sum is displayed rounded to four decimals. MOS/passive envelopes use declared W/L (or resistor dimensions) and multiplicity; explicit tap areas and HBT emitter/contact envelopes are included. This is a frozen engineering estimate, not a foundry minimum or a feasibility claim.\u003c/p\u003e\n\u003cp\u003eThe capability coefficient remains \u003cstrong\u003e6\u003c/strong\u003e; it is independent of\nthe reference-relative task score.\u003c/p\u003e\n\u003ch3 id=\"problem-score-weights\"\u003eScore weights\u003c/h3\u003e\n\u003cp\u003eClocked comparators: decision delay 71.1%; supply power 18.9%; area 10%. Each objective's weight is divided equally among its metrics.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eworst_delay\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.710526315789\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003esupply_power\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.189473684211\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch2 id=\"problem-tools-and-submission\"\u003eTools and Submission\u003c/h2\u003e\n\u003cp\u003eSolve budget: \u003cstrong\u003e3 hours\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eThe runtime environment and support resources are declared in\n\u003ccode\u003e/protocol/resources.json\u003c/code\u003e and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e; the working directory is\n\u003ccode\u003e/workspace\u003c/code\u003e. KLayout performs artifact, DRC, LVS, and geometry checks; Magic\nperforms RC extraction; ngspice runs the supplied deck with the reviewed SG13G2\nmodels. The evaluator provides the tool and PDK resources named by the case\ntoolchain.\u003c/p\u003e\n\u003cp\u003eFor pre-layout simulation, use \u003ccode\u003ematerials/circuit.spice\u003c/code\u003e as \u003ccode\u003edut.spice\u003c/code\u003e\nbeside the supplied testbench and use the per-job values exposed in\n\u003ccode\u003e/protocol/task.json\u003c/code\u003e. For the submitted layout, the evaluator supplies the\nnetlist produced by candidate-derived RC extraction. If the harness declares\n\u003ccode\u003eprocess-feedback\u003c/code\u003e, the optional command is\n\u003ccode\u003epython -I /protocol/process_check.py\u003c/code\u003e; the final evaluation remains independent.\u003c/p\u003e\n\u003cp\u003eWrite the result to \u003ccode\u003e/workspace/output/final.gds\u003c/code\u003e, then run\n\u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e and wait for the submission receipt. Solver\nnetlists, waveforms, and measurements are not accepted as substitutes for the\nindependent evaluator inputs.\u003c/p\u003e\n12:T138e,\u003cp\u003ePhysical checks and declared functional bounds remain mandatory. Quality has no\nfixed allowed-degradation threshold. Each \u003ccode\u003esource_*\u003c/code\u003e job simulates the declared\nsource circuit with exactly the same testbench, model resources, parameters,\nload and measurement window as its paired extracted-candidate job. A source\nobservation is the 100-point electrical baseline; it is independent of the\nsubmitted GDS. All individual pairs are retained in the evaluation report.\u003c/p\u003e\n\u003cp\u003eFor a post-layout observation x and its source observation b:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eMaximize: q = x/b; minimize: q = b/x. When a numerical scale s is declared,\nuse (x+s)/(b+s) or its inverse. This handles zero-valued error measurements;\ns is a normalization floor, not an allowed degradation or pass threshold.\u003c/li\u003e\n\u003cli\u003eAmplitude dB: q = 10^((x-b)/20) for maximize, its inverse for minimize.\u003c/li\u003e\n\u003cli\u003eTarget: q = 1/(1+abs(x-b)/s), with a declared physical scale s. Signed and\nzero-valued operating points are never divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eScoring uses \u003ccode\u003elayout\u003c/code\u003e. A metric uses its worst paired quality q. The score is\nS = 100 * product(q_i ** w_i), including area quality\nq_area = area_reference / candidate_functional_area. The weights below sum to\none. Dimensions describe measurements but do not determine their weights.\nPhysical or functional rejection scores zero; missing or invalid measurements\nproduce an unknown score, including measurements with zero weight.\nSource-equivalent performance at the area reference scores 100; improvements\ncan exceed 100. A weight expresses a tradeoff, not a hard acceptance limit.\u003c/p\u003e\n\u003cp\u003eMeasurement definitions below use the supplied SPICE node/source names.\n\u003ccode\u003ev(n)\u003c/code\u003e is node voltage and \u003ccode\u003ei(V)\u003c/code\u003e is current into a voltage source; delivered\npower therefore uses a minus sign. \u003ccode\u003edb(z)=20*log10(abs(z))\u003c/code\u003e, \u003ccode\u003emag/abs\u003c/code\u003e\ndenote magnitude, and \u003ccode\u003ecph\u003c/code\u003e is continuous phase in radians. \u003ccode\u003efind\u003c/code\u003e, \u003ccode\u003ewhen\u003c/code\u003e,\n\u003ccode\u003efrom/to\u003c/code\u003e, and \u003ccode\u003erise/fall\u003c/code\u003e retain the deck's interpolation, window and\ncrossing conventions; SPICE suffixes p/n/u/m/meg/g mean pico/nano/micro/\nmilli/mega/giga. Nested \u003ccode\u003eavg\u003c/code\u003e, \u003ccode\u003emin\u003c/code\u003e, \u003ccode\u003emax\u003c/code\u003e, \u003ccode\u003evecmin/vecmax\u003c/code\u003e and \u003ccode\u003ederiv\u003c/code\u003e\nmean the stated window average, extrema and sampled derivative. All\ndeclared conditions are measured separately and paired with the same\nsource condition; a group uses its worst paired quality.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eDefinition / observations\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eQuality rule\u003c/th\u003e\n\u003cth\u003eFunctional bounds\u003c/th\u003e\n\u003cth\u003eScale\u003c/th\u003e\n\u003cth\u003eDimension\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eworst_delay\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eClock falling through 0.6 V to polarity-correct output difference reaching 1 V in cycles 2–9 (trigger delays 20–90 ns; target search starts 5.75 ns later). Every cycle and input condition is paired; the worst quality is scored.\u003c/td\u003e\n\u003ctd\u003es\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edecision_margin\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMinimum polarity*(V(OUTP)-V(OUTM)) in each 1 ns decision window, 28.75–29.75 ns through 98.75–99.75 ns; all eight cycles and four signed input conditions must pass.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003efunctional check\u003c/td\u003e\n\u003ctd\u003e1.0 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003efunctional check\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003esupply_power\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMean delivered VDD power, -V(VDD)*I(VDD), over 20–100 ns, independently for each signed input condition.\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003ctd\u003esupply\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eArea reference: \u003cstrong\u003e502.96 um2\u003c/strong\u003e. 24 expanded device instances; sum of device/contact envelopes 306.3377 um2, per-side envelope allowance 0.6 um, 50% routing allowance and total outer width/height allowance 1.2 um. Estimate = ceil(100 * (1.5 * envelope_sum + 2 * margin * sqrt(envelope_sum) + margin^2)) / 100. Here margin is the total allowance across two opposite sides; the envelope sum is displayed rounded to four decimals. MOS/passive envelopes use declared W/L (or resistor dimensions) and multiplicity; explicit tap areas and HBT emitter/contact envelopes are included. This is a frozen engineering estimate, not a foundry minimum or a feasibility claim.\u003c/p\u003e\n\u003cp\u003eThe capability coefficient remains \u003cstrong\u003e6\u003c/strong\u003e; it is independent of\nthe reference-relative task score.\u003c/p\u003e\n\u003ch3\u003eScore weights\u003c/h3\u003e\n\u003cp\u003eClocked comparators: decision delay 71.1%; supply power 18.9%; area 10%. Each objective's weight is divided equally among its metrics.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eworst_delay\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.710526315789\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003esupply_power\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.189473684211\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n13:T450,\u003cp\u003eThe supplied deck evaluates the pre-layout and candidate-derived netlists with\nthe same model and stimulus definitions.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eParameter\u003c/th\u003e\n\u003cth\u003eSetting\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eProcess corner\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003emos_tt\u003c/code\u003e, \u003ccode\u003eres_typ\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eTemperature\u003c/td\u003e\n\u003ctd\u003e27 °C\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eSupply\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eVDD = 1.2 V\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eInput reference and bias\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eV- = vbias = 0.6 V\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eDifferential input\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eV+ − V- = −5, −3, +3, +5 mV\u003c/code\u003e, tested separately\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eClock\u003c/td\u003e\n\u003ctd\u003e100 MHz, 1.2 V swing, 500 ps rise and fall, 5 ns high time\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eOutput load\u003c/td\u003e\n\u003ctd\u003e50 fF on each output\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eTransient analysis\u003c/td\u003e\n\u003ctd\u003e100 ns duration, 10 ps maximum time step\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eMeasurements\u003c/td\u003e\n\u003ctd\u003eSkip the first two cycles and evaluate the next eight cycles\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eThe testbench excludes power consumed by the external clock, input, and bias\ndrivers from the reported supply-power measurement.\u003c/p\u003e\n14:T773,\u003cp\u003eSubmit a readable GDSII file with a nonempty \u003ccode\u003eDIFF_COMPARATOR\u003c/code\u003e top cell. The file\nmust be at most 10 MiB (10,485,760 bytes) and must contain the complete hierarchy\nneeded by the target cell.\u003c/p\u003e\n\u003cp\u003eThe evaluator runs the pinned SG13G2 main and additional maximal DRC rules in\ndeep mode, with density and antenna checks disabled and no waivers. LVS uses the\ncurrent \u003ccode\u003elvs-upstream.json\u003c/code\u003e profile and strict named-port matching against\n\u003ccode\u003ematerials/circuit.cdl\u003c/code\u003e; port names are matched case-insensitively, while every\ndeclared port must remain on its own conductor with the declared connectivity.\u003c/p\u003e\n\u003cp\u003eThe functional outline is the recursive bounding box of polygons on these\nSG13G2 datatype-0 layers, including child cells and the complete routing stack:\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003e1, 3, 5, 6, 7, 8, 10, 11, 13, 14, 19, 24, 26, 28, 29, 30, 31, 32, 33, 35, 36, 40, 44, 46, 49, 50, 51, 52, 53, 55, 58, 66, 67, 90, 101, 111, 125, 126, 128, 129, 133, 134, 139, 152\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eThe maximum width is 45 µm and the maximum height is\n45 µm, measured along the submitted X and Y axes.\nFunctional area is width multiplied by height. Text, annotation and filler\nlayers are excluded. The area score below uses this same functional footprint.\u003c/p\u003e\n\u003cp\u003eAfter the physical and geometry gates pass, Magic extracts distributed wire\nresistance and layout capacitance from the submitted GDS. Device merging and\nresistor-network simplification are disabled. The compact-device extraction\nboundary represents MOS bodies at ideal model rails; explicit taps remain part\nof physical LVS but are not emitted as extracted tap elements. Substrate sheet\nand tap resistance as extracted quantities, body coupling, and noise are outside\nthe declared scope. The source and post-layout runs use the same nominal\nstimuli and models; a finite-source-tap versus ideal-body calibration bounds this\nextraction choice.\u003c/p\u003e\n6:[\"$\",\"$8\",null,{\"fallback\":[\"$\",\"p\",null,{\"children\":\"Loading published evidence…\"}],\"children\":[\"$\",\"$L10\",null,{\"task\":{\"case_path\":\"tasks/ihp-sg13g2/IHP-AnalogAcademy/cases/comparator/case.toml\",\"coefficient\":6,\"collection\":\"IHP-AnalogAcademy\",\"configuration_url\":\"/ICLayout-Bench/assets/d553f9e09dd960a229e184f1feff7247c57d2d7cc8ae117ad712cecabf6aae9b.txt\",\"description_html\":\"$11\",\"description_path\":\"tasks/ihp-sg13g2/IHP-AnalogAcademy/cases/comparator/problem.md\",\"hours\":3,\"id\":\"module_3_8_bit_SAR_ADC.part_5_analog_layout.comparator\",\"inputs\":{\"description\":{\"format\":\"text\",\"path\":\"problem.md\",\"sha256\":\"c15d95f6e71753ce74b456e4f0b8ff70ab3ebd15fb6b15f7bfe261f8358f653a\"},\"netlist\":{\"format\":\"spice\",\"path\":\"materials/circuit.cdl\",\"sha256\":\"0fe0279db5d2975dec32196670118a05d0dd9a240e7f70b642c94e0a7ec80a4c\",\"subcircuit\":\"DIFF_COMPARATOR\"},\"performance\":{\"format\":\"spice\",\"path\":\"materials/testbench.spice\",\"sha256\":\"61d8165d7b359539cebe3a94815dcbd22cede35ca87c393e345832523f3c4c8e\"},\"simulation\":{\"format\":\"spice\",\"path\":\"materials/circuit.spice\",\"sha256\":\"daffa3508cb005a2a96651e48ec56909c94596208d48cbc099e24702f8f72221\"}},\"licenses\":[{\"name\":\"LICENSE\",\"path\":\"ta
