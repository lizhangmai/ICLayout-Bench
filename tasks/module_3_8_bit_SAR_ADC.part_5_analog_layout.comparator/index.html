ey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L5\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[\"$L6\",[[\"$\",\"script\",\"script-0\",{\"src\":\"/ICLayout-Bench/_next/static/chunks/27jip_2vcvnd5.js\",\"async\":true,\"nonce\":\"$undefined\"}]],[\"$\",\"$L7\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.MetadataOutlet\",\"children\":\"$@9\"}]}]]}],{},null,false,null]},null,false,\"$a\"]},null,false,null],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Lb\",null,{\"children\":\"$Lc\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Ld\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.Metadata\",\"children\":\"$Le\"}]}]}],null]}],false]],\"m\":\"$undefined\",\"G\":[\"$f\",[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/ICLayout-Bench/_next/static/chunks/3sa54_ghi1h2h.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]]],\"S\":true,\"h\":null,\"r\":\"$undefined\",\"s\":\"$undefined\",\"a\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"2hqB741EA4j7xWQVg6hu-\"}\n10:I[1186,[\"/ICLayout-Bench/_next/static/chunks/2h60meymns2z5.js\",\"/ICLayout-Bench/_next/static/chunks/27jip_2vcvnd5.js\"],\"default\"]\na:C\n11:T410f,\u003ch1 id=\"problem-dynamic-comparator-layout-task\"\u003eDynamic Comparator Layout Task\u003c/h1\u003e\n\u003ch2 id=\"problem-objective\"\u003eObjective\u003c/h2\u003e\n\u003cp\u003eCreate an IHP SG13G2 layout for the \u003ccode\u003eDIFF_COMPARATOR\u003c/code\u003e dynamic differential\ncomparator. Preserve the topology, device parameters, explicit well and\nsubstrate connections, and eight-port interface in the authoritative materials.\nThe submitted GDS must pass the physical checks, fit the functional outline, and\nmeet the clocked decision requirements after candidate-derived RC extraction.\u003c/p\u003e\n\u003ch3 id=\"problem-optimization-objective\"\u003eOptimization objective\u003c/h3\u003e\n\u003cp\u003eMaximize the declared quality score within the solve budget while satisfying all physical and necessary functional requirements. The first passing DRC, LVS and required electrical checks establish a feasible baseline. Continue improving the scored metrics from that baseline; a passing check or \u003ccode\u003etask_success = true\u003c/code\u003e does not mean that the quality objectives have been achieved.\u003c/p\u003e\n\u003ch2 id=\"problem-inputs-and-interface\"\u003eInputs and Interface\u003c/h2\u003e\n\u003cp\u003eIn addition to this description, the solver receives the following declared materials. The runtime \u003ccode\u003e/protocol/task.json\u003c/code\u003e also supplies structured constraints and the evaluation plan.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eInput\u003c/th\u003e\n\u003cth\u003ePurpose\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"/ICLayout-Bench/assets/0fe0279db5d2975dec32196670118a05d0dd9a240e7f70b642c94e0a7ec80a4c.txt\"\u003ematerials/circuit.cdl\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eAuthoritative LVS netlist for \u003ccode\u003eDIFF_COMPARATOR\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"/ICLayout-Bench/assets/daffa3508cb005a2a96651e48ec56909c94596208d48cbc099e24702f8f72221.txt\"\u003ematerials/circuit.spice\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003ePre-layout simulator netlist\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"/ICLayout-Bench/assets/61d8165d7b359539cebe3a94815dcbd22cede35ca87c393e345832523f3c4c8e.txt\"\u003ematerials/testbench.spice\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eClock stimulus and public measurement expressions\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eUse one distinct external conductor for each ordered port. Internal nodes must\nnot be exposed as ports.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003ePort\u003c/th\u003e\n\u003cth\u003eFunction\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003evdd\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003ePositive supply\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003egnd\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eGround and substrate reference\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eV+\u003c/code\u003e, \u003ccode\u003eV-\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDifferential input pair\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eclk\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDynamic latch clock\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eout-\u003c/code\u003e, \u003ccode\u003eout+\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eComplementary decision outputs\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003evbias\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eBias input\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eThe extraction port order is \u003ccode\u003evdd gnd V+ V- clk out- out+ vbias\u003c/code\u003e.\u003c/p\u003e\n\u003ch2 id=\"problem-operating-conditions\"\u003eOperating Conditions\u003c/h2\u003e\n\u003cp\u003eThe supplied deck evaluates the pre-layout and candidate-derived netlists with\nthe same model and stimulus definitions.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eParameter\u003c/th\u003e\n\u003cth\u003eSetting\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eProcess corner\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003emos_tt\u003c/code\u003e, \u003ccode\u003eres_typ\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eTemperature\u003c/td\u003e\n\u003ctd\u003e27 °C\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eSupply\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eVDD = 1.2 V\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eInput reference and bias\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eV- = vbias = 0.6 V\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eDifferential input\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eV+ − V- = −5, −3, +3, +5 mV\u003c/code\u003e, tested separately\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eClock\u003c/td\u003e\n\u003ctd\u003e100 MHz, 1.2 V swing, 500 ps rise and fall, 5 ns high time\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eOutput load\u003c/td\u003e\n\u003ctd\u003e50 fF on each output\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eTransient analysis\u003c/td\u003e\n\u003ctd\u003e100 ns duration, 10 ps maximum time step\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eMeasurements\u003c/td\u003e\n\u003ctd\u003eSkip the first two cycles and evaluate the next eight cycles\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eThe testbench excludes power consumed by the external clock, input, and bias\ndrivers from the reported supply-power measurement.\u003c/p\u003e\n\u003ch2 id=\"problem-physical-requirements\"\u003ePhysical Requirements\u003c/h2\u003e\n\u003cp\u003eSubmit a readable GDSII file with a nonempty \u003ccode\u003eDIFF_COMPARATOR\u003c/code\u003e top cell. The file\nmust be at most 10 MiB (10,485,760 bytes) and must contain the complete hierarchy\nneeded by the target cell.\u003c/p\u003e\n\u003cp\u003eThe evaluator runs the pinned SG13G2 main and additional maximal DRC rules in\ndeep mode, with density and antenna checks disabled and no waivers. LVS uses the\ncurrent \u003ccode\u003elvs-upstream.json\u003c/code\u003e profile and strict named-port matching against\n\u003ccode\u003ematerials/circuit.cdl\u003c/code\u003e; port names are matched case-insensitively, while every\ndeclared port must remain on its own conductor with the declared connectivity.\u003c/p\u003e\n\u003cp\u003eThe functional outline is the recursive bounding box of polygons on the following SG13G2 datatype-0 layers, including child cells and every routing layer:\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003e1, 3, 5, 6, 7, 8, 10, 11, 13, 14, 19, 24, 26, 28, 29, 30, 31, 32, 33, 35, 36, 40, 44, 46, 49, 50, 51, 52, 53, 55, 58, 66, 67, 90, 101, 111, 125, 126, 128, 129, 133, 134, 139, 152\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eThe maximum width is 45 µm and the maximum height is\n45 µm, measured along the submitted X and Y axes.\nFunctional area is width multiplied by height. Text, annotation and filler\nlayers are excluded. The area score below uses this same functional footprint.\u003c/p\u003e\n\u003cp\u003eAfter the physical and geometry gates pass, Magic extracts distributed wire\nresistance and layout capacitance from the submitted GDS. Device merging and\nresistor-network simplification are disabled. The compact-device extraction\nboundary represents MOS bodies at ideal model rails; explicit taps remain part\nof physical LVS but are not emitted as extracted tap elements. Substrate sheet\nand tap resistance as extracted quantities, body coupling, and noise are outside\nthe declared scope. The source and post-layout runs use the same nominal\nstimuli and models; a finite-source-tap versus ideal-body calibration bounds this\nextraction choice.\u003c/p\u003e\n\u003ch2 id=\"problem-electrical-requirements-and-scoring\"\u003eElectrical Requirements and Scoring\u003c/h2\u003e\n\u003cp\u003eArtifact, geometry, DRC, LVS and declared functional requirements must pass. Parasitic extraction is also mandatory: it must produce a complete, electrically consistent netlist usable by the required post-layout simulations. A completed candidate rejection scores zero; infrastructure errors do not establish candidate failure.\u003c/p\u003e\n\u003cp\u003ePhysical checks and the declared functional bounds must pass. Quality scoring imposes no fixed degradation allowance. Each \u003ccode\u003esource_*\u003c/code\u003e job and its corresponding candidate extracted circuit use exactly the same testbench, model resources, parameters, loads and measurement windows. Independent source observations define the 100-point electrical baseline without depending on the submitted GDS; reports retain every paired result.\u003c/p\u003e\n\u003cp\u003eLet x be the post-layout measurement and b the source-circuit measurement under the same conditions:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eRatio normalization: maximize with q = x/b and minimize with q = b/x. When a numerical scale s is declared, use (x+s)/(b+s) and its reciprocal, respectively. The scale handles zero values as a normalization floor; it is neither an allowed degradation nor an acceptance bound.\u003c/li\u003e\n\u003cli\u003eAmplitude in dB: maximize with q = 10^((x-b)/20) and minimize with its reciprocal.\u003c/li\u003e\n\u003cli\u003eTarget normalization: q = 1/(1+abs(x-b)/s), where s is the declared physical scale. Signed or zero-valued operating points are not divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eUse \u003ccode\u003elayout\u003c/code\u003e scoring. Each metric takes its worst paired quality q, and the total score is S = 100 * product(min(1, q_i) ** w_i), with area quality q_area = area_reference / candidate_functional_area. The weights below sum to 1; metric dimensions describe measurements and do not determine weights. Physical, extraction, or functional rejection scores zero; other missing or invalid measurements leave the score unknown, and zero-weight observations must also be valid. Matching source-circuit performance at the reference area scores 100 points; each metric is capped at quality 1, so scores cannot exceed 100. Weights express quality tradeoffs rather than hard bounds.\u003c/p\u003e\n\u003cp\u003eThe measurements below use the supplied SPICE node and source names. \u003ccode\u003ev(n)\u003c/code\u003e is a node voltage; \u003ccode\u003ei(V)\u003c/code\u003e is current flowing into a voltage source, so delivered power uses a negative sign. \u003ccode\u003edb(z)=20*log10(abs(z))\u003c/code\u003e; \u003ccode\u003emag/abs\u003c/code\u003e denote magnitude, and \u003ccode\u003ecph\u003c/code\u003e denotes continuous phase in radians. \u003ccode\u003efind\u003c/code\u003e, \u003ccode\u003ewhen\u003c/code\u003e, \u003ccode\u003efrom/to\u003c/code\u003e and \u003ccode\u003erise/fall\u003c/code\u003e follow the deck's interpolation, window and crossing conventions. SPICE suffixes p/n/u/m/meg/g mean pico/nano/micro/milli/mega/giga. Nested \u003ccode\u003eavg\u003c/code\u003e, \u003ccode\u003emin\u003c/code\u003e, \u003ccode\u003emax\u003c/code\u003e, \u003ccode\u003evecmin/vecmax\u003c/code\u003e and \u003ccode\u003ederiv\u003c/code\u003e represent window averages, extrema and sampled derivatives. Measure each operating condition independently, pair it with the source result under that condition, and take the worst paired quality within each metric group.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eDefinition / observation\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eQuality normalization\u003c/th\u003e\n\u003cth\u003eFunctional range\u003c/th\u003e\n\u003cth\u003eScale\u003c/th\u003e\n\u003cth\u003eDimension\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eworst_delay\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eClock falling through 0.6 V to polarity-correct output difference reaching 1 V in cycles 2–9 (trigger delays 20–90 ns; target search starts 5.75 ns later). Every cycle and input condition is paired; the worst quality is scored.\u003c/td\u003e\n\u003ctd\u003es\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edecision_margin\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMinimum polarity*(V(OUTP)-V(OUTM)) in each 1 ns decision window, 28.75–29.75 ns through 98.75–99.75 ns; all eight cycles and four signed input conditions must pass.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003efunctional check\u003c/td\u003e\n\u003ctd\u003e1.0 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003efunctional check\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003esupply_power\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMean delivered VDD power, -V(VDD)*I(VDD), over 20–100 ns, independently for each signed input condition.\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003ctd\u003esupply\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eArea reference: \u003cstrong\u003e502.96 um2\u003c/strong\u003e. The expanded circuit has 24 device instances, a sum of device/contact envelopes 306.3377 um2, a one-sided envelope margin of 0.6 um, a routing allowance of 50%, and a total outer width/height allowance 1.2 um. Estimate = ceil(100 * (1.5 * envelope_sum + 2 * margin * sqrt(envelope_sum) + margin^2)) / 100. Here margin is the total allowance across both sides, and the envelope sum is displayed to four decimal places. MOS/passive envelopes use W/L (or resistor dimensions) and multiplicity, including explicit contacts and HBT emitter/contact envelopes. This is a frozen engineering estimate, not a process minimum or a proven achievable area.\u003c/p\u003e\n\u003cp\u003eThe capability coefficient is \u003cstrong\u003e6\u003c/strong\u003e, independent of this task's reference-normalized score.\u003c/p\u003e\n\u003ch3 id=\"problem-score-weights\"\u003eScore weights\u003c/h3\u003e\n\u003cp\u003eClocked comparator: decision delay 71.1%, supply power 18.9%, area 10%; each objective weight is divided equally among its metrics.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eworst_delay\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.710526315789\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003esupply_power\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.189473684211\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch2 id=\"problem-tools-and-submission\"\u003eTools and Submission\u003c/h2\u003e\n\u003cp\u003eSoft solve budget: \u003cstrong\u003e3 hours\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eThe runtime environment and support resources are declared in\nthe \u003ccode\u003eresources\u003c/code\u003e field of \u003ccode\u003e/protocol/task.json\u003c/code\u003e and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e; the working directory is\n\u003ccode\u003e/workspace\u003c/code\u003e. KLayout performs artifact, DRC, LVS, and geometry checks; Magic\nperforms RC extraction; ngspice runs the supplied deck with the reviewed SG13G2\nmodels. The evaluator provides the tool and PDK resources named by the case\ntoolchain.\u003c/p\u003e\n\u003cp\u003eFor pre-layout simulation, use \u003ccode\u003ematerials/circuit.spice\u003c/code\u003e as \u003ccode\u003edut.spice\u003c/code\u003e\nbeside the supplied testbench and use the per-job values exposed in\n\u003ccode\u003e/protocol/task.json\u003c/code\u003e. For the submitted layout, the evaluator supplies the\nnetlist produced by candidate-derived RC extraction. If the harness declares\n\u003ccode\u003eprocess-feedback\u003c/code\u003e, use the full-plan check command\n\u003ccode\u003epython -I /protocol/process_check.py\u003c/code\u003e; the final evaluation remains independent.\u003c/p\u003e\n\u003cp\u003eWrite the result to \u003ccode\u003e/workspace/output/final.gds\u003c/code\u003e, run \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e and wait for a submission receipt. Solver netlists, waveforms and measurements cannot replace independent evaluator inputs.\u003c/p\u003e\n\u003ch3 id=\"problem-solve-workflow\"\u003eSolve workflow\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eRead the declared circuit and materials, \u003ccode\u003e/protocol/task.json\u003c/code\u003e for paths, constraints and reviewed resources, and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e for capabilities and helper commands. Task inputs under \u003ccode\u003e/task\u003c/code\u003e and resources under \u003ccode\u003e/resources\u003c/code\u003e are read-only; construct the layout in \u003ccode\u003e/workspace\u003c/code\u003e with the declared tools. With layout MCP, paths and commands refer to the remote EDA workspace. Create your own implementation with real devices, interconnect and pins, using your own tool loop without delegating to other agents; reference layouts and author code are not solver inputs.\u003c/li\u003e\n\u003cli\u003eInspect \u003ccode\u003eresources.external\u003c/code\u003e before using external tools. Each command starts a fresh shell: when tool modules are declared, source \u003ccode\u003e/usr/share/Modules/init/bash\u003c/code\u003e and load the selected tool's modules; export its declared \u003ccode\u003etool_environment\u003c/code\u003e settings in that same command. Repeat as needed and use batch or headless operation. Local manuals, command references, and release notes may be available within the declared EDA installation and PDK resource directories. Locate these resources through \u003ccode\u003e/protocol/task.json\u003c/code\u003e and consult the documentation for the installed tool version when diagnosing unfamiliar syntax or tool failures.\u003c/li\u003e\n\u003cli\u003eGenerate an initial candidate and submit a snapshot early. When \u003ccode\u003eprocess-feedback\u003c/code\u003e is available, check the current GDS with layout MCP \u003ccode\u003echeck\u003c/code\u003e or \u003ccode\u003epython -I /protocol/process_check.py\u003c/code\u003e before the final submission. This runs the final evaluator's complete plan and returns engineering diagnostics and candidate measurements, without scores or normalized quality factors. Checks have no count limit and consume the same wall-clock budget. Inspect the physical and functional results and all scored metrics; successful tool execution alone does not establish requirement satisfaction. Read paginated diagnostics with \u003ccode\u003ereport\u003c/code\u003e when using MCP. Local exploratory checks do not replace this complete check.\u003c/li\u003e\n\u003cli\u003eUse the remaining time for measured improvements to the declared quality objectives. Identify the limiting scored metrics, make targeted layout changes, regenerate and check the candidate, and compare measurements with the previous candidate and the stated scoring targets and trade-offs. Preserve the best valid candidate and revert changes that worsen the overall objective. Repeat while time and useful improvements remain; passing validity checks alone is not a stopping condition.\u003c/li\u003e\n\u003cli\u003eStop optimization when the budget expires, all declared quality objectives are achieved, or measured trials support convergence. If stopping early, explain the changes tried, the metric comparisons and the remaining limitations. Track remaining time through session status. At soft-budget expiry, finish or cancel already-started work and submit immediately; do not start another command, check or optimization round. If an MCP execution is running, use \u003ccode\u003epoll\u003c/code\u003e with its \u003ccode\u003eexecution_id\u003c/code\u003e and the returned \u003ccode\u003enext_offset\u003c/code\u003e as \u003ccode\u003eoffset\u003c/code\u003e until completion, or cancel it and wait for it to stop.\u003c/li\u003e\n\u003cli\u003eFinish or cancel outstanding work, restore your best candidate to the declared output path, and explicitly submit it before ending the session. With layout MCP \u003ccode\u003esubmit\u003c/code\u003e, remove the \u003ccode\u003e/workspace/\u003c/code\u003e prefix from \u003ccode\u003eoutput.path\u003c/code\u003e; with the container interface, run \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e. Wait for the receipt: only the last accepted snapshot is judged, and writing a file alone is not submission. Acceptance confirms delivery; the framework independently evaluates validity and quality after the session.\u003c/li\u003e\n\u003c/ol\u003e\n12:T15b3,\u003cp\u003eArtifact, geometry, DRC, LVS and declared functional requirements must pass. Parasitic extraction is also mandatory: it must produce a complete, electrically consistent netlist usable by the required post-layout simulations. A completed candidate rejection scores zero; infrastructure errors do not establish candidate failure.\u003c/p\u003e\n\u003cp\u003ePhysical checks and the declared functional bounds must pass. Quality scoring imposes no fixed degradation allowance. Each \u003ccode\u003esource_*\u003c/code\u003e job and its corresponding candidate extracted circ ive sign. \u003ccode\u003edb(z)=20*log10(abs(z))\u003c/code\u003e; \u003ccode\u003emag/abs\u003c/code\u003e denote magnitude, and \u003ccode\u003ecph\u003c/code\u003e denotes continuous phase in radians. \u003ccode\u003efind\u003c/code\u003e, \u003ccode\u003ewhen\u003c/code\u003e, \u003ccode\u003efrom/to\u003c/code\u003e and \u003ccode\u003erise/fall\u003c/code\u003e follow the deck's interpolation, window and crossing conventions. SPICE suffixes p/n/u/m/meg/g mean pico/nano/micro/milli/mega/giga. Nested \u003ccode\u003eavg\u003c/code\u003e, \u003ccode\u003emin\u003c/code\u003e, \u003ccode\u003emax\u003c/code\u003e, \u003ccode\u003evecmin/vecmax\u003c/code\u003e and \u003ccode\u003ederiv\u003c/code\u003e represent window averages, extrema and sampled derivatives. Measure each operating condition independently, pair it with the source result under that condition, and take the worst paired quality within each metric group.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eDefinition / observation\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eQuality normalization\u003c/th\u003e\n\u003cth\u003eFunctional range\u003c/th\u003e\n\u003cth\u003eScale\u003c/th\u003e\n\u003cth\u003eDimension\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eworst_delay\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eClock falling through 0.6 V to polarity-correct output difference reaching 1 V in cycles 2–9 (trigger delays 20–90 ns; target search starts 5.75 ns later). Every cycle and input condition is paired; the worst quality is scored.\u003c/td\u003e\n\u003ctd\u003es\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edecision_margin\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMinimum polarity*(V(OUTP)-V(OUTM)) in each 1 ns decision window, 28.75–29.75 ns through 98.75–99.75 ns; all eight cycles and four signed input conditions must pass.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003efunctional check\u003c/td\u003e\n\u003ctd\u003e1.0 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003efunctional check\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003esupply_power\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMean delivered VDD power, -V(VDD)*I(VDD), over 20–100 ns, independently for each signed input condition.\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003ctd\u003esupply\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eArea reference: \u003cstrong\u003e502.96 um2\u003c/strong\u003e. The expanded circuit has 24 device instances, a sum of device/contact envelopes 306.3377 um2, a one-sided envelope margin of 0.6 um, a routing allowance of 50%, and a total outer width/height allowance 1.2 um. Estimate = ceil(100 * (1.5 * envelope_sum + 2 * margin * sqrt(envelope_sum) + margin^2)) / 100. Here margin is the total allowance across both sides, and the envelope sum is displayed to four decimal places. MOS/passive envelopes use W/L (or resistor dimensions) and multiplicity, including explicit contacts and HBT emitter/contact envelopes. This is a frozen engineering estimate, not a process minimum or a proven achievable area.\u003c/p\u003e\n\u003cp\u003eThe capability coefficient is \u003cstrong\u003e6\u003c/strong\u003e, independent of this task's reference-normalized score.\u003c/p\u003e\n\u003ch3\u003eScore weights\u003c/h3\u003e\n\u003cp\u003eClocked comparator: decision delay 71.1%, supply power 18.9%, area 10%; each objective weight is divided equally among its metrics.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eworst_delay\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.710526315789\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003esupply_power\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.189473684211\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n13:T66e,\u003cp\u003eIn addition to this description, the solver receives the following declared materials. The runtime \u003ccode\u003e/protocol/task.json\u003c/code\u003e also supplies structured constraints and the evaluation plan.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eInput\u003c/th\u003e\n\u003cth\u003ePurpose\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"/ICLayout-Bench/assets/0fe0279db5d2975dec32196670118a05d0dd9a240e7f70b642c94e0a7ec80a4c.txt\"\u003ematerials/circuit.cdl\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eAuthoritative LVS netlist for \u003ccode\u003eDIFF_COMPARATOR\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"/ICLayout-Bench/assets/daffa3508cb005a2a96651e48ec56909c94596208d48cbc099e24702f8f72221.txt\"\u003ematerials/circuit.spice\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003ePre-layout simulator netlist\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"/ICLayout-Bench/assets/61d8165d7b359539cebe3a94815dcbd22cede35ca87c393e345832523f3c4c8e.txt\"\u003ematerials/testbench.spice\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eClock stimulus and public measurement expressions\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eUse one distinct external conductor for each ordered port. Internal nodes must\nnot be exposed as ports.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003ePort\u003c/th\u003e\n\u003cth\u003eFunction\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003evdd\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003ePositive supply\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003egnd\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eGround and substrate reference\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eV+\u003c/code\u003e, \u003ccode\u003eV-\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDifferential input pair\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eclk\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDynamic latch clock\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eout-\u003c/code\u003e, \u003ccode\u003eout+\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eComplementary decision outputs\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003evbias\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eBias input\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eThe extraction port order is \u003ccode\u003evdd gnd V+ V- clk out- out+ vbias\u003c/code\u003e.\u003c/p\u003e\n14:T450,\u003cp\u003eThe supplied deck evaluates the pre-layout and candidate-derived netlists with\nthe same model and stimulus definitions.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eParameter\u003c/th\u003e\n\u003cth\u003eSetting\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eProcess corner\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003emos_tt\u003c/code\u003e, \u003ccode\u003eres_typ\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eTemperature\u003c/td\u003e\n\u003ctd\u003e27 °C\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eSupply\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eVDD = 1.2 V\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eInput reference and bias\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eV- = vbias = 0.6 V\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eDifferential input\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eV+ − V- = −5, −3, +3, +5 mV\u003c/code\u003e, tested separately\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eClock\u003c/td\u003e\n\u003ctd\u003e100 MHz, 1.2 V swing, 500 ps rise and fall, 5 ns high time\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eOutput load\u003c/td\u003e\n\u003ctd\u003e50 fF on each output\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eTransient analysis\u003c/td\u003e\n\u003ctd\u003e100 ns duration, 10 ps maximum time step\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eMeasurements\u003c/td\u003e\n\u003ctd\u003eSkip the first two cycles and evaluate the next eight cycles\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eThe testbench excludes power consumed by the external clock, input, and bias\ndrivers from the reported supply-power measurement.\u003c/p\u003e\n15:T774,\u003cp\u003eSubmit a readable GDSII file with a nonempty \u003ccode\u003eDIFF_COMPARATOR\u003c/code\u003e top cell. The file\nmust be at most 10 MiB (10,485,760 bytes) and must contain the complete hierarchy\nneeded by the target cell.\u003c/p\u003e\n\u003cp\u003eThe evaluator runs the pinned SG13G2 main and additional maximal DRC rules in\ndeep mode, with density and antenna checks disabled and no waivers. LVS uses the\ncurrent \u003ccode\u003elvs-upstream.json\u003c/code\u003e profile and strict named-port matching against\n\u003ccode\u003ematerials/circuit.cdl\u003c/code\u003e; port names are matched case-insensitively, while every\ndeclared port must remain on its own conductor with the declared connectivity.\u003c/p\u003e\n\u003cp\u003eThe functional outline is the recursive bounding box of polygons on the following SG13G2 datatype-0 layers, including child cells and every routing layer:\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003e1, 3, 5, 6, 7, 8, 10, 11, 13, 14, 19, 24, 26, 28, 29, 30, 31, 32, 33, 35, 36, 40, 44, 46, 49, 50, 51, 52, 53, 55, 58, 66, 67, 90, 101, 111, 125, 126, 128, 129, 133, 134, 139, 152\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eThe maximum width is 45 µm and the maximum height is\n45 µm, measured along the submitted X and Y axes.\nFunctional area is width multiplied by height. Text, annotation and filler\nlayers are excluded. The area score below uses this same functional footprint.\u003c/p\u003e\n\u003cp\u003eAfter the physical and geometry gates pass, Magic extracts distributed wire\nresistance and layout capacitance from the submitted GDS. Device merging and\nresistor-network simplification are disabled. The compact-device extraction\nboundary represents MOS bodies at ideal model rails; explicit taps remain part\nof physical LVS but are not emitted as extracted tap elements. Substrate sheet\nand tap resistance as extracted quantities, body coupling, and noise are outside\nthe declared scope. The source and post-layout runs use the same nominal\nstimuli and models; a finite-source-tap versus ideal-body calibration bounds this\nextraction choice.\u003c/p\u003e\n16:T13b0,\u003cp\u003eSoft solve budget: \u003cstrong\u003e3 hours\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eThe runtime environment and support resources are declared in\nthe \u003ccode\u003eresources\u003c/code\u003e field of \u003ccode\u003e/protocol/task.json\u003c/code\u003e and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e; the working directory is\n\u003ccode\u003e/workspace\u003c/code\u003e. KLayout performs artifact, DRC, LVS, and geometry checks; Magic\nperforms RC extraction; ngspice runs the supplied deck with the reviewed SG13G2\nmodels. The evaluator provides the tool and PDK resources named by the case\ntoolchain.\u003c/p\u003e\n\u003cp\u003eFor pre-layout simulation, use \u003ccode\u003ematerials/circuit.spice\u003c/code\u003e as \u003ccode\u003edut.spice\u003c/code\u003e\nbeside the supplied testbench and use the per-job values exposed in\n\u003ccode\u003e/protocol/task.json\u003c/code\u003e. For the submitted layout, the evaluator supplies the\nnetlist produced by candidate-derived RC extraction. If the harness declares\n\u003ccode\u003eprocess-feedback\u003c/code\u003e, use the full-plan check command\n\u003ccode\u003epython -I /protocol/process_check.py\u003c/code\u003e; the final evaluation remains independent.\u003c/p\u003e\n\u003cp\u003eWrite the result to \u003ccode\u003e/workspace/output/final.gds\u003c/code\u003e, run \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e and wait for a submission receipt. Solver netlists, waveforms and measurements cannot replace independent evaluator inputs.\u003c/p\u003e\n\u003ch3\u003eSolve workflow\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eRead the declared circuit and materials, \u003ccode\u003e/protocol/task.json\u003c/code\u003e for paths, constraints and reviewed resources, and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e for capabilities and helper commands. Task inputs under \u003ccode\u003e/task\u003c/code\u003e and resources under \u003ccode\u003e/resources\u003c/code\u003e are read-only; construct the layout in \u003ccode\u003e/workspace\u003c/code\u003e with the declared tools. With layout MCP, paths and commands refer to the remote EDA workspace. Create your own implementation with real devices, interconnect and pins, using your own tool loop without delegating to other agents; reference layouts and author code are not solver inputs.\u003c/li\u003e\n\u003cli\u003eInspect \u003ccode\u003eresources.external\u003c/code\u003e before using external tools. Each command starts a fresh shell: when tool modules are declared, source \u003ccode\u003e/usr/share/Modules/init/bash\u003c/code\u003e and load the selected tool's modules; export its declared \u003ccode\u003etool_environment\u003c/code\u003e settings in that same command. Repeat as needed and use batch or headless operation. Local manuals, command references, and release notes may be available within the declared EDA installation and PDK resource directories. Locate these resources through \u003ccode\u003e/protocol/task.json\u003c/code\u003e and consult the documentation for the installed tool version when diagnosing unfamiliar syntax or tool failures.\u003c/li\u003e\n\u003cli\u003eGenerate an initial candidate and submit a snapshot early. When \u003ccode\u003eprocess-feedback\u003c/code\u003e is available, check the current GDS with layout MCP \u003ccode\u003echeck\u003c/code\u003e or \u003ccode\u003epython -I /protocol/process_check.py\u003c/code\u003e before the final submission. This runs the final evaluator's complete plan and returns engineering diagnostics and candidate measurements, without scores or normalized quality factors. Checks have no count limit and consume the same wall-clock budget. Inspect the physical and functional results and all scored metrics; successful tool execution alone does not establish requirement satisfaction. Read paginated diagnostics with \u003ccode\u003ereport\u003c/code\u003e when using MCP. Local exploratory checks do not replace this complete check.\u003c/li\u003e\n\u003cli\u003eUse the remaining time for measured improvements to the declared quality objectives. Identify the limiting scored metrics, make targeted layout changes, regenerate and check the candidate, and compare measurements with the previous candidate and the stated scoring targets and trade-offs. Preserve the best valid candidate and revert changes that worsen the overall objective. Repeat while time and useful improvements remain; passing validity checks alone is not a stopping condition.\u003c/li\u003e\n\u003cli\u003eStop optimization when the budget expires, all declared quality objectives are achieved, or measured trials support convergence. If stopping early, explain the changes tried, the metric comparisons and the remaining limitations. Track remaining time through session status. At soft-budget expiry, finish or cancel already-started work and submit immediately; do not start another command, check or optimization round. If an MCP execution is running, use \u003ccode\u003epoll\u003c/code\u003e with its \u003ccode\u003eexecution_id\u003c/code\u003e and the returned \u003ccode\u003enext_offset\u003c/code\u003e as \u003ccode\u003eoffset\u003c/code\u003e until completion, or cancel it and wait for it to stop.\u003c/li\u003e\n\u003cli\u003eFinish or cancel outstanding work, restore your best candidate to the declared output path, and explicitly submit it before ending the session. With layout MCP \u003ccode\u003esubmit\u003c/code\u003e, remove the \u003ccode\u003e/workspace/\u003c/code\u003e prefix from \u003ccode\u003eoutput.path\u003c/code\u003e; with the container interface, run \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e. Wait for the receipt: only the last accepted snapshot is judged, and writing a file alone is not submission. Acceptance confirms delivery; the framework independently evaluates validity and quality after the session.\u003c/li\u003e\n\u003c/ol\u003e\n6:[\"$\",\"$8\",null,{\"fallback\":[\"$\",\"p\",null,{\"children\":\"Loading published evidence…\"}],\"children\":[\"$\",\"$L10\",null,{\"task\":{\"case_path\":\"tasks/ihp-sg13g2/IHP-AnalogAcademy/cases/comparator/case.toml\",\"coefficient\":6,\"collection\":\"IHP-AnalogAcademy\",\"configuration_url\":\"/ICLayout-Bench/asse
