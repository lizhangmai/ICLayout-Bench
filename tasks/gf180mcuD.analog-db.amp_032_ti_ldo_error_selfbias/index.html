ldren\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L5\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[\"$L6\",[[\"$\",\"script\",\"script-0\",{\"src\":\"/ICLayout-Bench/_next/static/chunks/27jip_2vcvnd5.js\",\"async\":true,\"nonce\":\"$undefined\"}]],[\"$\",\"$L7\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.MetadataOutlet\",\"children\":\"$@9\"}]}]]}],{},null,false,null]},null,false,\"$a\"]},null,false,null],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Lb\",null,{\"children\":\"$Lc\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Ld\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.Metadata\",\"children\":\"$Le\"}]}]}],null]}],false]],\"m\":\"$undefined\",\"G\":[\"$f\",[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/ICLayout-Bench/_next/static/chunks/3sa54_ghi1h2h.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]]],\"S\":true,\"h\":null,\"r\":\"$undefined\",\"s\":\"$undefined\",\"a\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"2hqB741EA4j7xWQVg6hu-\"}\n10:I[1186,[\"/ICLayout-Bench/_next/static/chunks/2h60meymns2z5.js\",\"/ICLayout-Bench/_next/static/chunks/27jip_2vcvnd5.js\"],\"default\"]\na:C\n11:T376e,\u003ch1 id=\"problem-self-biased-ldo-error-amplifier-layout-task\"\u003eSelf-Biased LDO Error Amplifier Layout Task\u003c/h1\u003e\n\u003ch2 id=\"problem-objective\"\u003eObjective\u003c/h2\u003e\n\u003cp\u003eImplement \u003ccode\u003eamp_032_ti_ldo_error_selfbias\u003c/code\u003e as a GF180MCU D layout. Eleven MOS devices form the fixed upstream two-stage amplifier, with a level-shifted PMOS mirror, its 500 kohm gate-rail tie, diode-connected self-bias and series Miller compensation. The fixed netlist uses a direct common-source output stage.\u003c/p\u003e\n\u003ch3 id=\"problem-optimization-objective\"\u003eOptimization objective\u003c/h3\u003e\n\u003cp\u003eMaximize the declared quality score within the solve budget while satisfying all physical and necessary functional requirements. The first passing DRC, LVS and required electrical checks establish a feasible baseline. Continue improving the scored metrics from that baseline; a passing check or \u003ccode\u003etask_success = true\u003c/code\u003e does not mean that the quality objectives have been achieved.\u003c/p\u003e\n\u003ch2 id=\"problem-inputs-and-interface\"\u003eInputs and Interface\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003ematerials/circuit.cdl\u003c/code\u003e is the authoritative physical circuit, \u003ccode\u003ematerials/circuit.spice\u003c/code\u003e its native simulation-model wrapper, and \u003ccode\u003ematerials/testbench.spice\u003c/code\u003e defines all measurements. Ordered ports are \u003ccode\u003evdd vout vinp vinn vss\u003c/code\u003e, respectively supply, output, differential positive/negative inputs and ground; no external bias current is needed. Preserve connectivity and total device sizes; equivalent parallel fingering is allowed, but the amplifier topology must not be replaced.\u003c/p\u003e\n\u003ch2 id=\"problem-operating-conditions\"\u003eOperating Conditions\u003c/h2\u003e\n\u003cp\u003eTypical native GF180 6 V MOS models, 3.3 V supply, 27 C, statistics disabled.\nInput common mode is 1.6 V. Both 1 pF and 10 pF output loads are evaluated.\nDC uses unity feedback. AC uses a 1 TH feedback inductor and 1 F input shunt\nfrom 1 Hz to 1 GHz, 100 points/decade. Transient replaces these fixture elements\nwith 1 pH and 1 aF: the input rises 10 mV at 1 us and falls at 3 us, each in\n10 ns. The simulation ends at 5 us, with a 1 ns requested step.\nThese ideal fixture elements are external test apparatus, outside the DUT.\u003c/p\u003e\n\u003ch2 id=\"problem-physical-requirements\"\u003ePhysical Requirements\u003c/h2\u003e\n\u003cp\u003eGDS database unit 0.001 um; maximum 10 MiB; top cell \u003ccode\u003eamp_032_ti_ldo_error_selfbias\u003c/code\u003e.\nNative standalone DRC includes geometry, connectivity, manufacturing grid,\ndummy fill and antenna rules; chip density and seal-ring closure are excluded.\nNative LVS must match devices, parameters and every named port. All device,\nwell, implant, contact, passive-marker and routing layers listed in the runtime\noutline form the functional bounding rectangle; text annotations are excluded.\nMaximum outline is 5000 by 1000 um. Labels belong on native Metal1 text.\u003c/p\u003e\n\u003cp\u003eMinimum channel lengths for 6 V devices are NMOS 0.70 um and PMOS 0.55 um. Upstream dimensions are rounded to 5 nm, increasing only lengths below minimum. Physical passives use 1 kohm/square poly and MIM-B between M4/M5 (2 fF/um2); long resistors are segmented in series and capacitors tiled in parallel. Geometry realizes nominal values; source/candidate use identical native models. The candidate determines MOS diffusion areas/perimeters and interconnect parasitics; Magic extracts nominal coupling capacitance and distributed resistance with zero omission threshold. Ideal well/substrate connections do not cover distributed substrate noise, and no inductance, RF/EM or statistical performance is claimed. Source/candidate observations must be finite and each operating point must pass functional checks; incomplete evaluation cannot establish success.\u003c/p\u003e\n\u003ch2 id=\"problem-electrical-requirements-and-scoring\"\u003eElectrical Requirements and Scoring\u003c/h2\u003e\n\u003cp\u003eArtifact, geometry, DRC, LVS and declared functional requirements must pass. Parasitic extraction is also mandatory: it must produce a complete, electrically consistent netlist usable by the required post-layout simulations. A completed candidate rejection scores zero; infrastructure errors do not establish candidate failure.\u003c/p\u003e\n\u003cp\u003ePhysical checks and the declared functional bounds must pass. Quality scoring imposes no fixed degradation allowance. Each \u003ccode\u003esource_*\u003c/code\u003e job and its corresponding candidate extracted circuit use exactly the same testbench, model resources, parameters, loads and measurement windows. Independent source observations define the 100-point electrical baseline without depending on the submitted GDS; reports retain every paired result.\u003c/p\u003e\n\u003cp\u003eLet x be the post-layout measurement and b the source-circuit measurement under the same conditions:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eRatio normalization: maximize with q = x/b and minimize with q = b/x. When a numerical scale s is declared, use (x+s)/(b+s) and its reciprocal, respectively. The scale handles zero values as a normalization floor; it is neither an allowed degradation nor an acceptance bound.\u003c/li\u003e\n\u003cli\u003eAmplitude in dB: maximize with q = 10^((x-b)/20) and minimize with its reciprocal.\u003c/li\u003e\n\u003cli\u003eTarget normalization: q = 1/(1+abs(x-b)/s), where s is the declared physical scale. Signed or zero-valued operating points are not divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eUse \u003ccode\u003elayout\u003c/code\u003e scoring. Each metric takes its worst paired quality q, and the total score is S = 100 * product(min(1, q_i) ** w_i), with area quality q_area = area_reference / candidate_functional_area. The weights below sum to 1; metric dimensions describe measurements and do not determine weights. Physical, extraction, or functional rejection scores zero; other missing or invalid measurements leave the score unknown, and zero-weight observations must also be valid. Matching source-circuit performance at the reference area scores 100 points; each metric is capped at quality 1, so scores cannot exceed 100. Weights express quality tradeoffs rather than hard bounds.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003etracking_error_v\u003c/code\u003e uses \u003ccode\u003esaturating_ratio\u003c/code\u003e: q = 2(b+s)/(b+x+2s), where x is candidate error, b is paired source error, and s is the positive scale below. Source-equivalent error gives q=1; improvement approaches the upper limit 2 with diminishing returns. s retains the declared units and numeric-floor meaning. Normalize each condition before taking the worst quality; other normalization and functional rules follow their own declarations.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eDefinition\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eDimension\u003c/th\u003e\n\u003cth\u003eNormalization\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC output voltage\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003ctd\u003etarget\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC supply power: -VDD*I(VDD)\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003esupply\u003c/td\u003e\n\u003ctd\u003eratio\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003egain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eOpen-loop magnitude at 10 Hz in dB\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003ctd\u003edb20\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eunity_hz\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eFirst falling unity-gain crossing\u003c/td\u003e\n\u003ctd\u003eHz\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003ctd\u003eratio\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ephase_margin\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e180 degrees plus unwrapped phase at unity crossing\u003c/td\u003e\n\u003ctd\u003edeg\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003ctd\u003etarget\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003etracking_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMean absolute unity-buffer tracking error over 1–5 us\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003ctd\u003esaturating_ratio\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estep_response_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMean output at 2–3 us minus mean output at 4–5 us; nonnegative sign-domain check (zero is allowed)\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003efunctional\u003c/td\u003e\n\u003ctd\u003eunscored\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eDC output must lie between the supply rails; power, absolute tracking error and signed output-step observations must be nonnegative, with zero allowed. These gates express physical domains and buffer function. Required measurements must be finite; missing or failed measurements are evaluation errors rather than low performance. Upstream datasheet targets are not gates; phase margin supports continuous comparison without upstream thresholds.\u003c/p\u003e\n\u003cp\u003ePair each quality observation with independent source simulation using exactly the same deck, load, supply, temperature and models. Output target scale is 3.3 V and phase scale 180 degrees; the power-ratio floor 1 pW and tracking-error floor 1 mV are normalization units, not tolerances.\u003c/p\u003e\n\u003cp\u003eArea target: \u003cstrong\u003e19112.51 um2\u003c/strong\u003e. Device/contact envelopes sum to 12143.285500 um2,\nusing \u003ccode\u003e(W+2)*(L+2)\u003c/code\u003e per expanded MOS, resistor segment and capacitor tile\nin micrometers. The estimate adds 50% routing plus a 2 um outer margin:\n\u003ccode\u003eceil(100*(1.5*envelope_sum+8*sqrt(envelope_sum)+16))/100\u003c/code\u003e.\nThis engineering anchor is independent of the witness footprint and is not a\nfoundry minimum. Coefficient \u003cstrong\u003e6\u003c/strong\u003e reflects a complete compensated two-stage\nloop with self-bias and load-dependent transient response.\u003c/p\u003e\n\u003ch3 id=\"problem-score-weights\"\u003eScore weights\u003c/h3\u003e\n\u003cp\u003eSelf-biased Miller buffer: tracking 36%, phase margin 22.5%, gain and bandwidth 18%, bias 4.5%, power 9%, area 10%; each objective weight is divided equally among its metrics.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003etracking_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.360000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ephase_margin\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.225000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003egain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.090000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eunity_hz\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.090000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.090000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch2 id=\"problem-tools-and-submission\"\u003eTools and Submission\u003c/h2\u003e\n\u003cp\u003eSoft solve budget: \u003cstrong\u003e3 hours\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eObtain the frozen task, reviewed PDK and protocol through \u003ccode\u003e/protocol/task.json\u003c/code\u003e (including its \u003ccode\u003eresources\u003c/code\u003e field) and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e. KLayout checks physical validity, Magic extracts the submitted layout, and ngspice measures it; use \u003ccode\u003eprocess-feedback\u003c/code\u003e if available. Write \u003ccode\u003e/workspace/output/final.gds\u003c/code\u003e, then explicitly submit with \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e.\u003c/p\u003e\n\u003ch3 id=\"problem-solve-workflow\"\u003eSolve workflow\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eRead the declared circuit and materials, \u003ccode\u003e/protocol/task.json\u003c/code\u003e for paths, constraints and reviewed resources, and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e for capabilities and helper commands. Task inputs under \u003ccode\u003e/task\u003c/code\u003e and resources under \u003ccode\u003e/resources\u003c/code\u003e are read-only; construct the layout in \u003ccode\u003e/workspace\u003c/code\u003e with the declared tools. With layout MCP, paths and commands refer to the remote EDA workspace. Create your own implementation with real devices, interconnect and pins, using your own tool loop without delegating to other agents; reference layouts and author code are not solver inputs.\u003c/li\u003e\n\u003cli\u003eInspect \u003ccode\u003eresources.external\u003c/code\u003e before using external tools. Each command starts a fresh shell: when tool modules are declared, source \u003ccode\u003e/usr/share/Modules/init/bash\u003c/code\u003e and load the selected tool's modules; export its declared \u003ccode\u003etool_environment\u003c/code\u003e settings in that same command. Repeat as needed and use batch or headless operation. Local manuals, command references, and release notes may be available within the declared EDA installation and PDK resource directories. Locate these resources through \u003ccode\u003e/protocol/task.json\u003c/code\u003e and consult the documentation for the installed tool version when diagnosing unfamiliar syntax or tool failures.\u003c/li\u003e\n\u003cli\u003eGenerate an initial candidate and submit a snapshot early. When \u003ccode\u003eprocess-feedback\u003c/code\u003e is available, check the current GDS with layout MCP \u003ccode\u003echeck\u003c/code\u003e or \u003ccode\u003epython -I /protocol/process_check.py\u003c/code\u003e before the final submission. This runs the final evaluator's complete plan and returns engineering diagnostics and candidate measurements, without scores or normalized quality factors. Checks have no count limit and consume the same wall-clock budget. Inspect the physical and functional results and all scored metrics; successful tool execution alone does not establish requirement satisfaction. Read paginated diagnostics with \u003ccode\u003ereport\u003c/code\u003e when using MCP. Local exploratory checks do not replace this complete check.\u003c/li\u003e\n\u003cli\u003eUse the remaining time for measured improvements to the declared quality objectives. Identify the limiting scored metrics, make targeted layout changes, regenerate and check the candidate, and compare measurements with the previous candidate and the stated scoring targets and trade-offs. Preserve the best valid candidate and revert changes that worsen the overall objective. Repeat while time and useful improvements remain; passing validity checks alone is not a stopping condition.\u003c/li\u003e\n\u003cli\u003eStop optimization when the budget expires, all declared quality objectives are achieved, or measured trials support convergence. If stopping early, explain the changes tried, the metric comparisons and the remaining limitations. Track remaining time through session status. At soft-budget expiry, finish or cancel already-started work and submit immediately; do not start another command, check or optimization round. If an MCP execution is running, use \u003ccode\u003epoll\u003c/code\u003e with its \u003ccode\u003eexecution_id\u003c/code\u003e and the returned \u003ccode\u003enext_offset\u003c/code\u003e as \u003ccode\u003eoffset\u003c/code\u003e until completion, or cancel it and wait for it to stop.\u003c/li\u003e\n\u003cli\u003eFinish or cancel outstanding work, restore your best candidate to the declared output path, and explicitly submit it before ending the session. With layout MCP \u003ccode\u003esubmit\u003c/code\u003e, remove the \u003ccode\u003e/workspace/\u003c/code\u003e prefix from \u003ccode\u003eoutput.path\u003c/code\u003e; with the container interface, run \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e. Wait for the receipt: only the last accepted snapshot is judged, and writing a file alone is not submission. Acceptance confirms delivery; the framework independently evaluates validity and quality after the session.\u003c/li\u003e\n\u003c/ol\u003e\n12:T179b,\u003cp\u003eArtifact, geometry, DRC, LVS and declared functional requirements must pass. Parasitic extraction is also mandatory: it must produce a complete, electrically consistent netlist usable by the required post-layout simulations. A completed candidate rejection scores zero; infrastructure errors do not establish candidate failure.\u003c/p\u003e\n\u003cp\u003ePhysical checks and the declared functional bounds must pass. Quality scoring imposes no fixed degradation allowance. Each \u003ccode\u003esource_*\u003c/code\u003e job and its corresponding candidate extracted circuit use exactly the same testbench, model resources, parameters, loads and measurement windows. Independent source observations define the 100-point electrical baseline without depending on the submitted GDS; reports retain every paired result.\u003c/p\u003e\n\u003cp\u003eLet x be the post-layout measurement and b the source-circuit measurement under the same conditions:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eRatio normalization: maximize with q = x/b and minimize with q = b/x. When a numerical scale s is declared, use (x+s)/(b+s) and its reciprocal, respectively. The scale handles zero values as a normalization floor; it is neither an allowed degradation nor an acceptance bound.\u003c/li\u003e\n\u003cli\u003eAmplitude in dB: maximize with q = 10^((x-b)/20) and minimize with its reciprocal.\u003c/li\u003e\n\u003cli\u003eTarget normalization: q = 1/(1+abs(x-b)/s), where s is the declared physical scale. Signed or zero-valued operating points are not divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eUse \u003ccode\u003elayout\u003c/code\u003e scoring. Each metric takes its worst paired quality q, and the total score is S = 100 * product(min(1, q_i) ** w_i), with area quality q_area = area_reference / candidate_functional_area. The weights below sum to 1; metric dimensions describe measurements and do not determine weights. Physical, extraction, or functional rejection scores zero; other missing or invalid measurements leave the score unknown, and zero-weight observations must also be valid. Matching source-circuit performance at the reference area scores 100 points; each metric is capped at quality 1, so scores cannot exceed 100. Weights express quality tradeoffs rather than hard bounds.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003etracking_error_v\u003c/code\u003e uses \u003ccode\u003esaturating_ratio\u003c/code\u003e: q = 2(b+s)/(b+x+2s), where x is candidate error, b is paired source error, and s is the positive scale below. Source-equivalent error gives q=1; improvement approaches the upper limit 2 with diminishing returns. s retains the declared units and numeric-floor meaning. Normalize each condition before taking the worst quality; other normalization and functional rules follow their own declarations.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eDefinition\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eDimension\u003c/th\u003e\n\u003cth\u003eNormalization\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC output voltage\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003ctd\u003etarget\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC supply power: -VDD*I(VDD)\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003esupply\u003c/td\u003e\n\u003ctd\u003eratio\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003egain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eOpen-loop magnitude at 10 Hz in dB\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003ctd\u003edb20\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eunity_hz\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eFirst falling unity-gain crossing\u003c/td\u003e\n\u003ctd\u003eHz\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003ctd\u003eratio\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ephase_margin\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e180 degrees plus unwrapped phase at unity crossing\u003c/td\u003e\n\u003ctd\u003edeg\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003ctd\u003etarget\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003etracking_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMean absolute unity-buffer tracking error over 1–5 us\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003ctd\u003esaturating_ratio\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estep_response_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMean output at 2–3 us minus mean output at 4–5 us; nonnegative sign-domain check (zero is allowed)\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003efunctional\u003c/td\u003e\n\u003ctd\u003eunscored\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eDC output must lie between the supply rails; power, absolute tracking error and signed output-step observations must be nonnegative, with zero allowed. These gates express physical domains and buffer function. Required measurements must be finite; missing or failed measurements are evaluation errors rather than low performance. Upstream datasheet targets are not gates; phase margin supports continuous comparison without upstream thresholds.\u003c/p\u003e\n\u003cp\u003ePair each quality observation with independent source simulation using exactly the same deck, load, supply, temperature and models. Output target scale is 3.3 V and phase scale 180 degrees; the power-ratio floor 1 pW and tracking-error floor 1 mV are normalization units, not tolerances.\u003c/p\u003e\n\u003cp\u003eArea target: \u003cstrong\u003e19112.51 um2\u003c/strong\u003e. Device/contact envelopes sum to 12143.285500 um2,\nusing \u003ccode\u003e(W+2)*(L+2)\u003c/code\u003e per expanded MOS, resistor segment and capacitor tile\nin micrometers. The estimate adds 50% routing plus a 2 um outer margin:\n\u003ccode\u003eceil(100*(1.5*envelope_sum+8*sqrt(envelope_sum)+16))/100\u003c/code\u003e.\nThis engineering anchor is independent of the witness footprint and is not a\nfoundry minimum. Coefficient \u003cstrong\u003e6\u003c/strong\u003e reflects a complete compensated two-stage\nloop with self-bias and load-dependent transient response.\u003c/p\u003e\n\u003ch3\u003eScore weights\u003c/h3\u003e\n\u003cp\u003eSelf-biased Miller buffer: tracking 36%, phase margin 22.5%, gain and bandwidth 18%, bias 4.5%, power 9%, area 10%; each objective weight is divided equally among its metrics.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003etracking_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.360000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ephase_margin\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.225000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003egain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.090000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eunity_hz\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.090000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.090000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n13:T596,\u003cp\u003eGDS database unit 0.001 um; maximum 10 MiB; top cell \u003ccode\u003eamp_032_ti_ldo_error_selfbias\u003c/code\u003e.\nNative standalone DRC includes geometry, connectivity, manufacturing grid,\ndummy fill and antenna rules; chip density and seal-ring closure are excluded.\nNative LVS must match devices, parameters and every named port. All device,\nwell, implant, contact, passive-marker and routing layers listed in the runtime\noutline form the functional bounding rectangle; text annotations are excluded.\nMaximum outline is 5000 by 1000 um. Labels belong on native Metal1 text.\u003c/p\u003e\n\u003cp\u003eMinimum channel lengths for 6 V devices are NMOS 0.70 um and PMOS 0.55 um. Upstream dimensions are rounded to 5 nm, increasing only lengths below minimum. Physical passives use 1 kohm/square poly and MIM-B between M4/M5 (2 fF/um2); long resistors are segmented in series and capacitors tiled in parallel. Geometry realizes nominal values; source/candidate use identical native models. The candidate determines MOS diffusion areas/perimeters and interconnect parasitics; Magic extracts nominal coupling capacitance and distributed resistance with zero omission threshold. Ideal well/substrate connections do not cover distributed substrate noise, and no inductance, RF/EM or statistical performance is claimed. Source/candidate observations must be finite and each operating point must pass functional checks; incomplete evaluation cannot establish success.\u003c/p\u003e\n14:T10cb,\u003cp\u003eSoft solve budget: \u003cstrong\u003e3 hours\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eObtain the frozen task, reviewed PDK and protocol through \u003ccode\u003e/protocol/task.json\u003c/code\u003e (including its \u003ccode\u003eresources\u003c/code\u003e field) and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e. KLayout checks physical validity, Magic extracts the submitted layout, and ngspice measures it; use \u003ccode\u003eprocess-feedback\u003c/code\u003e if available. Write \u003ccode\u003e/workspace/output/final.gds\u003c/code\u003e, then explicitly submit with \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e.\u003c/p\u003e\n\u003ch3\u003eSolve workflow\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eRead the declared circuit and materials, \u003ccode\u003e/protocol/task.json\u003c/code\u003e for paths, constraints and reviewed resources, and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e for capabilities and helper commands. Task inputs under \u003ccode\u003e/task\u003c/code\u003e and resources under \u003ccode\u003e/resources\u003c/code\u003e are read-only; construct the layout in \u003ccode\u003e/workspace\u003c/code\u003e with the declared tools. With layout MCP, paths and commands refer to the remote EDA workspace. Create your own implementation with real devices, interconnect and pins, using your own tool loop without delegating to other agents; reference layouts and author code are not solver inputs.\u003c/li\u003e\n\u003cli\u003eInspect \u003ccode\u003eresources.external\u003c/code\u003e before using external tools. Each command starts a fresh shell: when tool modules are declared, source \u003ccode\u003e/usr/share/Modules/init/bash\u003c/code\u003e and load the selected tool's modules; export its declared \u003ccode\u003etool_environment\u003c/code\u003e settings in that same command. Repeat as needed and use batch or headless operation. Local manuals, command references, and release notes may be available within the declared EDA installation and PDK resource directories. Locate these resources through \u003ccode\u003e/protocol/task.json\u003c/code\u003e and consult the documentation for the installed tool version when diagnosing unfamiliar syntax or tool failures.\u003c/li\u003e\n\u003cli\u003eGenerate an initial candidate and submit a snapshot early. When \u003ccode\u003eprocess-feedback\u003c/code\u003e is available, check the current GDS with layout MCP \u003ccode\u003echeck\u003c/code\u003e or \u003ccode\u003epython -I /protocol/process_check.py\u003c/code\u003e before the final submission. This runs the final evaluator's complete plan and returns engineering diagnostics and candidate measurements, without scores or normalized quality factors. Checks have no count limit and consume the same wall-clock budget. Inspect the physical and functional results and all scored metrics; successful tool execution alone does not establish requirement satisfaction. Read paginated diagnostics with \u003ccode\u003ereport\u003c/code\u003e when using MCP. Local exploratory checks do not replace this complete check.\u003c/li\u003e\n\u003cli\u003eUse the remaining time for measured improvements to the declared quality objectives. Identify the limiting scored metrics, make targeted layout changes, regenerate and check the candidate, and compare measurements with the previous candidate and the stated scoring targets and trade-offs. Preserve the best valid candidate and revert changes that worsen the overall objective. Repeat while time and useful improvements remain; passing validity checks alone is not a stopping condition.\u003c/li\u003e\n\u003cli\u003eStop optimization when the budget expires, all declared quality objectives are achieved, or measured trials support convergence. If stopping early, explain the changes tried, the metric comparisons and the remaining limitations. Track remaining time through session status. At soft-budget expiry, finish or cancel already-started work and submit immediately; do not start another command, check or optimization round. If an MCP execution is running, use \u003ccode\u003epoll\u003c/code\u003e with its \u003ccode\u003eexecution_id\u003c/code\u003e and the returned \u003ccode\u003enext_offset\u003c/code\u003e as \u003ccode\u003eoffset\u003c/code\u003e until completion, or cancel it and wait for it to stop.\u003c/li\u003e\n\u003cli\u003eFinish or cancel outstanding work, restore your best candidate to the declared output path, and explicitly submit it before ending the session. With layout MCP \u003ccode\u003esubmit\u003c/code\u003e, remove the \u003ccode\u003e/workspace/\u003c/code\u003e prefix from \u003ccode\u003eoutput.path\u003c/code\u003e; with the container interface, run \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e. Wait for the receipt: only the last accepted snapshot is judged, and writing a file alone is not submission. Acceptance confirms delivery; the framework independently evaluates validity and quality after the session.\u003c/li\u003e\n\u003c/ol\u003e\n6:[\"$\",\"$8\",null,{\"fallback\":[\"$\",\"p\",null,{\"children\":\"Loading published evidence…\"}],\"children\":[\"$\",\"$L10\",null,{\"task\":{\"case_path\":\"tasks/gf180mcuD/analog-db/cases/amp_032_ti_ldo_error_selfbias/case.toml\",\"coefficient\":6,\"collection\":\"analog-db\",\"configuration_url\":\"/ICLayout-Bench/assets/ee9457030e7a3d3ae2d93af1e737ef8684dd55de599914d72dea624ccb7a7e45.txt\",\"description_html\":\"$11\",\"description_path\":\"tasks/gf180mcuD/analog-db/cases/amp_032_ti_ldo_error_selfbias/problem.md\",\"hours\":3,\"id\":\"gf180mcuD.analog-db.amp_032_ti_ldo_error_selfbias\",\"inputs\":{\"description\":{\"format\":\"text\",\"path\":\"problem.md\",\"sha256\":\"6851a41882d7a133d3006e49938fa13acc877b2fe442b154615cf26551ae40ce\"},\"netlist\":{\"format\":\"spice\",\"path\":\"materials/circuit.cdl\",\"sha256\":\"9e9cb685378e09c43bf827a69c0189e83fb9ef47b6d96655c466e1bfa411b7d1\",\"subcircuit\":\"amp_032_ti_ldo_error_selfbias\"},\"performance\":{\"format\":\"spice\",\"path\":\"materials/testbench.spice\",\"sha256\":\"d8f2aa450ac372f7cbd4a8a1908519c15da8d0056377be0db40f9b72a83596f8\"},\"simulation\":{\"format\":\"spice\",\"path\":\"materials/circuit.spice\",\"sha256\":\"a4588c07e691e659295ea2c802bf5795511f4d5c17b5590ca0855de92c6e8a6d\"}},\"licenses\":[{\"name\":\"LICENSE\",\"path\":\"tasks/gf180mcuD/analog-db/LICENSE\",\"url\":\"/ICLayout-Bench/assets/d6c09a4fa902f192f05e697110788e520f294a97446ababab65986137c16fceb.txt\"},{\"name\":\"NOTICE\",\"path\":\"tasks/gf180mcuD/analog-db/NOTICE\",\"url\":\"/ICLayout-Bench/assets/75d61165620fd72b89f65e52c2b6c85b73d410bd293062873390bd20ab820a4 urce_condition_0:gain_db\",\"source_condition_1:gain_db\"],\"category\":\"performance\",\"dimension\":\"response\",\"direction\":\"maximize\",\"id\":\"gain_db\",\"normalization\":\"db20\",\"observations\":[\"condition_0:gain_db\",\"condition_1:gain_db\"],\"unit\":\"dB\"},{\"aggregation\":\"max\",\"baseline\":[\"source_condition_0:unity_hz\",\"source_condition_1:unity_hz\"],\"category\":\"performance\",\"dimension\":\"response\",\"direction\":\"maximize\",\"id\":\"unity_hz\",\"normalization\":\"ratio\",\"observations\":[\"condition_0:unity_hz\",\"condition_1:unity_hz\"],\"requirement\":{\"lower\":0,\"rationale\":\"The observed frequency or ordered-event interval has a nonnegative measurement domain; the required crossing must exist for a usable observation.\"},\"unit\":\"Hz\"},{\"aggregation\":\"max\",\"baseline\":[\"source_condition_0:phase_margin\",\"source_condition_1:phase_margin\"],\"category\":\"performance\",\"dimension\":\"response\",\"direction\":\"target\",\"id\":\"phase_margin\",\"normalization\":\"target\",\"observations\":[\"condition_0:phase_margin\",\"condition_1:phase_margin\"],\"scale\":180,\"unit\":\"deg\"},{\"aggregation\":\"max\",\"baseline\":[\"source_condition_0:tracking_error_v\",\"source_condition_1:tracking_error_v\"],\"category\":\"performance\",\"dimension\":\"response\",\"direction\":\"minimize\",\"id\":\"tracking_error_v\",\"normalization\":\"saturating_ratio\",\"observations\":[\"condition_0:tracking_error_v\",\"condition_1:tracking_error_v\"],\"requirement\":{\"lower\":0,\"rationale\":\"The absolute error, voltage span or magnitude has a nonnegative measurement domain; its positive value remains a continuously scored quality observation.\"},\"scale\":0.001,\"unit\":\"V\"},{\"aggregation\":\"min\",\"category\":\"performance\",\"direction\":\"maximize\",\"id\":\"step_response_v\",\"observations\":[\"condition_0:step_response_v\",\"condition_1:step_response_v\"],\"requirement\":{\"lower\":0,\"rationale\":\"A positive input step must produce a nonnegative output step under the declared follower fixture; a negative response reverses the required polarity.\"},\"unit\":\"V\"}],\"pdk\":\"gf180mcuD\",\"reader\":{\"category\":\"Amplifiers \u0026 RF\",\"summary\":\"Amplifies an error signal with a self-biased two-stage core, level-shifted mirror and Miller compensation.\",\"title\":\"Self-Biased LDO Error Amplifier\"},\"scoring\":{\"area_metric\":\"functional_area\",\"area_target\":19112.51,\"method\":\"layout\",\"rationale\":\"Self-biased Miller buffers: tracking 36%; phase margin 22.5%; gain and bandwidth 18%; bias 4.5%; power 9%; area 10%. Each objective's weight is divided equally among its metrics.\",\"weights\":{\"functional_area\":0.1,\"gain_db\":0.09,\"output_v\":0.045,\"phase_margin\":0.225,\"power_w\":0.09,\"tracking_error_v\":0.36,\"unity_hz\":0.09}},\"sections\":{\"Electrical Requirements and Scoring\":\"$12\",\"Inputs and Interface\":\"\u003cp\u003e\u003ccode\u003ematerials/circuit.cdl\u003c/code\u003e is the authoritative physical circuit, \u003ccode\u003ematerials/circuit.spice\u003c/code\u003e its native simulation-model wrapper, and \u003ccode\u003ematerials/testbench.spice\u003c/code\u003e defines all measurements. Ordered ports are \u003ccode\u003evdd vout vinp vinn vss\u003c/code\u003e, respectively supply, output, differential positive/negative inputs and ground; no external bias current is needed. Preserve connectivity and total device sizes; equivalent parallel fingering is allowed, but the amplifier topology must not be replaced.\u003c/p\u003e\\n\",\"Objective\":\"\u003cp\u003eImplement \u003ccode\u003eamp_032_ti_ldo_error_selfbias\u003c/code\u003e as a GF180MCU D layout. Eleven MOS devices form the fixed upstream two-stage amplifier, with a level-shifted PMOS mirror, its 500 kohm gate-rail tie, diode-connected self-bias and series Miller compensation. The fixed netlist uses a direct common-source output stage.\u003c/p\u003e\\n\u003ch3\u003eOptimization objective\u003c/h3\u003e\\n\u003cp\u003eMaximize the declared quality score within the solve budget while satisfying all physical and necessary functional requirements. The first passing DRC, LVS and required electrical checks establish a feasible baseline. Continue improving the scored metrics from that baseline; a passing check or \u003ccode\u003etask_success = true\u003c/code\u003e does not mean that the quality objectives have been achieved.\u003c/p\u003e\\n\",\"Operating Conditions\":\"\u003cp\u003eTypical native GF180 6 V MOS models, 3.3 V supply, 27 C, statistics disabled.\\nInput common mode is 1.6 V. Both 1 pF and 10 pF output loads are evaluated.\\nDC uses unity feedback. AC uses a 1 TH feedback inductor and 1 F input shunt\\nfrom 1 Hz to 1 GHz, 100 points/decade. Transient replaces these fixture elements\\nwith 1 pH and 1 aF: the input rises 10 mV at 1 us and falls at 3 us, each in\\n10 ns. The simulation ends at 5 us, with a 1 ns requested step.\\nThese ideal fixture elements are external test apparatus, outside the DUT.\u003c/p\u003e\\n\",\"Physical Requirements\":\"$13\",\"Tools and Submission\":\"$14\"},\"source_url\":\"https://github.com/MacAnalog/spicexplorer-release/tree/263d0322f8900dc331536fbbe6c0e804514fc454/analog-db/circuits/amp_032_ti_ldo_error_selfbias\",\"status\":\"qualified\",\"title\":\"Self-Biased LDO Error Amplifier\",\"core\":false},\"catalog\":{\"tasks\":[],\"runs\":[],\"experiments\":[],\"contexts\":[],\"boards\":[]},\"previewRun\":null,\"preview\":null,\"evidenceError\":false}]}]\nc:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n15:I[27201,[\"/ICLayout-Bench/_next/static/chunks/2h60meymns2z5.js\"],\"IconMark\"]\n9:null\ne:[[\"$\",\"title\",\"0\",{\"children\":\"ICLayout-Bench | Circuit layout intelligence\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Independent evaluation of AI for integrated circuit layout. Compare model scores, explore cir
