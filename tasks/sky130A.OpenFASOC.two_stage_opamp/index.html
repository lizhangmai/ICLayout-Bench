,\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L5\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[\"$L6\",[[\"$\",\"script\",\"script-0\",{\"src\":\"/ICLayout-Bench/_next/static/chunks/27jip_2vcvnd5.js\",\"async\":true,\"nonce\":\"$undefined\"}]],[\"$\",\"$L7\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.MetadataOutlet\",\"children\":\"$@9\"}]}]]}],{},null,false,null]},null,false,\"$a\"]},null,false,null],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Lb\",null,{\"children\":\"$Lc\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Ld\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.Metadata\",\"children\":\"$Le\"}]}]}],null]}],false]],\"m\":\"$undefined\",\"G\":[\"$f\",[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/ICLayout-Bench/_next/static/chunks/3sa54_ghi1h2h.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]]],\"S\":true,\"h\":null,\"r\":\"$undefined\",\"s\":\"$undefined\",\"a\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"2hqB741EA4j7xWQVg6hu-\"}\n10:I[1186,[\"/ICLayout-Bench/_next/static/chunks/2h60meymns2z5.js\",\"/ICLayout-Bench/_next/static/chunks/27jip_2vcvnd5.js\"],\"default\"]\na:C\n11:T289c,\u003ch1 id=\"problem-sky130-two-stage-miller-operational-amplifier-layout-task\"\u003eSKY130 Two-Stage Miller Operational Amplifier Layout Task\u003c/h1\u003e\n\u003ch2 id=\"problem-objective\"\u003eObjective\u003c/h2\u003e\n\u003cp\u003eImplement \u003ccode\u003eOPAMP_TWO_STAGE\u003c/code\u003e from the supplied transistor-level circuit, preserving topology, fixed device parameters, four-terminal body connections and the ordered interface. Submit a candidate GDS for electrical evaluation of its distributed RC extraction.\u003c/p\u003e\n\u003ch3 id=\"problem-optimization-objective\"\u003eOptimization objective\u003c/h3\u003e\n\u003cp\u003eMaximize the declared quality score within the solve budget while satisfying all physical and necessary functional requirements. The first passing DRC, LVS and required electrical checks establish a feasible baseline. Continue improving the scored metrics from that baseline; a passing check or \u003ccode\u003etask_success = true\u003c/code\u003e does not mean that the quality objectives have been achieved.\u003c/p\u003e\n\u003ch2 id=\"problem-inputs-and-interface\"\u003eInputs and Interface\u003c/h2\u003e\n\u003cp\u003eOrdered ports are \u003ccode\u003eVDD GND DIFFPAIR_BIAS VP VN CS_BIAS VOUT\u003c/code\u003e. Declared inputs include \u003ccode\u003eproblem.md\u003c/code\u003e, \u003ccode\u003ematerials/circuit.spice\u003c/code\u003e and \u003ccode\u003ematerials/testbench.spice\u003c/code\u003e. The runtime provides models and process resources; reference layouts, author code and qualification evidence are maintainer-only materials.\u003c/p\u003e\n\u003ch2 id=\"problem-operating-conditions\"\u003eOperating Conditions\u003c/h2\u003e\n\u003cp\u003eSupply 1.8 V, input common mode 0.9 V, and external input-stage/common-source-stage bias currents 20, 100 uA, respectively. Use output capacitances 0.1, 0.5, 1 pF and a 100 Mohm resistive load. Feedback 9 Mohm and reference 1 Mohm resistors set noise gain 10; external large inductance/capacitance closes DC feedback and breaks AC feedback, measuring loop bandwidth and phase margin where open-loop magnitude falls to 10. This fixture does not prove unity-gain stability. All electrical experiments use fixed TT models at 27 °C; delivered testbenches define interpolation, edges, loads, sweeps, observation times and power intervals.\u003c/p\u003e\n\u003ch2 id=\"problem-physical-requirements\"\u003ePhysical Requirements\u003c/h2\u003e\n\u003cp\u003eSubmit a nonempty GDS no larger than 10485760 bytes, with top cell \u003ccode\u003eOPAMP_TWO_STAGE\u003c/code\u003e. Functional geometry must fit within the 200 × 200 um envelope on the declared layer set. Pass complete Magic DRC without waivers and independent Netgen LVS checking named ports, models, dimensions, multiplicities and body/contact connections. After physical and geometric checks pass, extract the candidate's distributed interconnect resistance, capacitance and devices, then run every declared experiment.\u003c/p\u003e\n\u003ch2 id=\"problem-electrical-requirements-and-scoring\"\u003eElectrical Requirements and Scoring\u003c/h2\u003e\n\u003cp\u003eArtifact, geometry, DRC, LVS and declared functional requirements must pass. Parasitic extraction is also mandatory: it must produce a complete, electrically consistent netlist usable by the required post-layout simulations. A completed candidate rejection scores zero; infrastructure errors do not establish candidate failure.\u003c/p\u003e\n\u003cp\u003eOutput bias must be 0.3–1.5 V; phase margin at the specified crossing must lie on the stable-feedback branch within 0–180 degrees, and the crossing must exist. Gain, bandwidth and power are quality targets; no 40 dB, 100 kHz, 5 mW or 45 degree design-budget rejection thresholds are imposed. Power and absolute errors must be nonnegative; all required measurements must be complete, finite and in correct units.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eFunctional requirement or measurement domain\u003c/th\u003e\n\u003cth\u003eAggregation\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eScore weight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eNo fixed performance bound\u003c/td\u003e\n\u003ctd\u003emax\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e20%\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003egain_low\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eNo fixed performance bound\u003c/td\u003e\n\u003ctd\u003emin\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e30%\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eloop_bandwidth\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e0 … +∞ Hz\u003c/td\u003e\n\u003ctd\u003emin\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e30%\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003esupply_power\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e0 … +∞ W\u003c/td\u003e\n\u003ctd\u003emax\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e20%\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ephase_margin\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e0 … 180 deg\u003c/td\u003e\n\u003ctd\u003emin\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0%\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebias_voltage\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e0.3 … 1.5 V\u003c/td\u003e\n\u003ctd\u003emax\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0%\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003ePair electrical quality with independent source-netlist observations under exactly the same conditions, taking the worst paired quality for each metric. Gain in dB uses \u003ccode\u003e10^((x-b)/20)\u003c/code\u003e; target quantities use \u003ccode\u003e1/(1+abs(x-b)/s)\u003c/code\u003e; ratio quantities use \u003ccode\u003ex/b\u003c/code\u003e or \u003ccode\u003eb/x\u003c/code\u003e according to optimization direction; cost quantities declaring \u003ccode\u003esaturating_ratio\u003c/code\u003e use \u003ccode\u003e2*(b+s)/(b+x+2*s)\u003c/code\u003e. \u003ccode\u003ex\u003c/code\u003e is the candidate observation, \u003ccode\u003eb\u003c/code\u003e is the source observation and \u003ccode\u003es\u003c/code\u003e is the contract's physical normalization scale. These define no degradation allowance. Zero-weight observations still undergo measurement and functional checks.\u003c/p\u003e\n\u003cp\u003eArea quality is \u003ccode\u003e14329.60165 um² / candidate functional area\u003c/code\u003e; the area target is the original reference layout's functional-footprint soft target, and a separate envelope constraint controls functional bounds. Total score is \u003ccode\u003e100 × product(min(1, q_i)^w_i)\u003c/code\u003e, using the contract's \u003ccode\u003elayout\u003c/code\u003e method and original weights. Source-equivalent performance at target area scores 100, and each metric is capped at quality 1, so scores cannot exceed 100. Physical or functional invalidity scores zero; missing or unusable measurements make the score unknown. Capability coefficient \u003ccode\u003e3\u003c/code\u003e is independent of this quality score.\u003c/p\u003e\n\u003ch2 id=\"problem-tools-and-submission\"\u003eTools and Submission\u003c/h2\u003e\n\u003cp\u003eSoft solve budget: \u003cstrong\u003e8 hours\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eRead \u003ccode\u003e/protocol/task.json\u003c/code\u003e for input/output paths, constraints and the \u003ccode\u003eresources\u003c/code\u003e object; \u003ccode\u003e/protocol/harness.json\u003c/code\u003e describes the active check and submission interface.\u003c/p\u003e\n\u003cp\u003eUse the task information, tools and SKY130 resources provided by the runtime protocol. Write only the final GDS to \u003ccode\u003eoutput/final.gds\u003c/code\u003e and explicitly submit through the declared interface. Source simulation serves characterization; accepted results come from complete physical and RC electrical evaluation of the candidate GDS. Conclusions cover only the declared conditions, excluding PVT, mismatch, reliability and product signoff.\u003c/p\u003e\n\u003ch3 id=\"problem-solve-workflow\"\u003eSolve workflow\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eRead the declared circuit and materials, \u003ccode\u003e/protocol/task.json\u003c/code\u003e for paths, constraints and reviewed resources, and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e for capabilities and helper commands. Task inputs under \u003ccode\u003e/task\u003c/code\u003e and resources under \u003ccode\u003e/resources\u003c/code\u003e are read-only; construct the layout in \u003ccode\u003e/workspace\u003c/code\u003e with the declared tools. With layout MCP, paths and commands refer to the remote EDA workspace. Create your own implementation with real devices, interconnect and pins, using your own tool loop without delegating to other agents; reference layouts and author code are not solver inputs.\u003c/li\u003e\n\u003cli\u003eInspect \u003ccode\u003eresources.external\u003c/code\u003e before using external tools. Each command starts a fresh shell: when tool modules are declared, source \u003ccode\u003e/usr/share/Modules/init/bash\u003c/code\u003e and load the selected tool's modules; export its declared \u003ccode\u003etool_environment\u003c/code\u003e settings in that same command. Repeat as needed and use batch or headless operation. Local manuals, command references, and release notes may be available within the declared EDA installation and PDK resource directories. Locate these resources through \u003ccode\u003e/protocol/task.json\u003c/code\u003e and consult the documentation for the installed tool version when diagnosing unfamiliar syntax or tool failures.\u003c/li\u003e\n\u003cli\u003eGenerate an initial candidate and submit a snapshot early. When \u003ccode\u003eprocess-feedback\u003c/code\u003e is available, check the current GDS with layout MCP \u003ccode\u003echeck\u003c/code\u003e or \u003ccode\u003epython -I /protocol/process_check.py\u003c/code\u003e before the final submission. This runs the final evaluator's complete plan and returns engineering diagnostics and candidate measurements, without scores or normalized quality factors. Checks have no count limit and consume the same wall-clock budget. Inspect the physical and functional results and all scored metrics; successful tool execution alone does not establish requirement satisfaction. Read paginated diagnostics with \u003ccode\u003ereport\u003c/code\u003e when using MCP. Local exploratory checks do not replace this complete check.\u003c/li\u003e\n\u003cli\u003eUse the remaining time for measured improvements to the declared quality objectives. Identify the limiting scored metrics, make targeted layout changes, regenerate and check the candidate, and compare measurements with the previous candidate and the stated scoring targets and trade-offs. Preserve the best valid candidate and revert changes that worsen the overall objective. Repeat while time and useful improvements remain; passing validity checks alone is not a stopping condition.\u003c/li\u003e\n\u003cli\u003eStop optimization when the budget expires, all declared quality objectives are achieved, or measured trials support convergence. If stopping early, explain the changes tried, the metric comparisons and the remaining limitations. Track remaining time through session status. At soft-budget expiry, finish or cancel already-started work and submit immediately; do not start another command, check or optimization round. If an MCP execution is running, use \u003ccode\u003epoll\u003c/code\u003e with its \u003ccode\u003eexecution_id\u003c/code\u003e and the returned \u003ccode\u003enext_offset\u003c/code\u003e as \u003ccode\u003eoffset\u003c/code\u003e until completion, or cancel it and wait for it to stop.\u003c/li\u003e\n\u003cli\u003eFinish or cancel outstanding work, restore your best candidate to the declared output path, and explicitly submit it before ending the session. With layout MCP \u003ccode\u003esubmit\u003c/code\u003e, remove the \u003ccode\u003e/workspace/\u003c/code\u003e prefix from \u003ccode\u003eoutput.path\u003c/code\u003e; with the container interface, run \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e. Wait for the receipt: only the last accepted snapshot is judged, and writing a file alone is not submission. Acceptance confirms delivery; the framework independently evaluates validity and quality after the session.\u003c/li\u003e\n\u003c/ol\u003e\n12:Tc07,\u003cp\u003eArtifact, geometry, DRC, LVS and declared functional requirements must pass. Parasitic extraction is also mandatory: it must produce a complete, electrically consistent netlist usable by the required post-layout simulations. A completed candidate rejection scores zero; infrastructure errors do not establish candidate failure.\u003c/p\u003e\n\u003cp\u003eOutput bias must be 0.3–1.5 V; phase margin at the specified crossing must lie on the stable-feedback branch within 0–180 degrees, and the crossing must exist. Gain, bandwidth and power are quality targets; no 40 dB, 100 kHz, 5 mW or 45 degree design-budget rejection thresholds are imposed. Power and absolute errors must be nonnegative; all required measurements must be complete, finite and in correct units.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eFunctional requirement or measurement domain\u003c/th\u003e\n\u003cth\u003eAggregation\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eScore weight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eNo fixed performance bound\u003c/td\u003e\n\u003ctd\u003emax\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e20%\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003egain_low\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eNo fixed performance bound\u003c/td\u003e\n\u003ctd\u003emin\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e30%\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eloop_bandwidth\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e0 … +∞ Hz\u003c/td\u003e\n\u003ctd\u003emin\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e30%\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003esupply_power\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e0 … +∞ W\u003c/td\u003e\n\u003ctd\u003emax\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e20%\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ephase_margin\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e0 … 180 deg\u003c/td\u003e\n\u003ctd\u003emin\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0%\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebias_voltage\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e0.3 … 1.5 V\u003c/td\u003e\n\u003ctd\u003emax\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0%\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003ePair electrical quality with independent source-netlist observations under exactly the same conditions, taking the worst paired quality for each metric. Gain in dB uses \u003ccode\u003e10^((x-b)/20)\u003c/code\u003e; target quantities use \u003ccode\u003e1/(1+abs(x-b)/s)\u003c/code\u003e; ratio quantities use \u003ccode\u003ex/b\u003c/code\u003e or \u003ccode\u003eb/x\u003c/code\u003e according to optimization direction; cost quantities declaring \u003ccode\u003esaturating_ratio\u003c/code\u003e use \u003ccode\u003e2*(b+s)/(b+x+2*s)\u003c/code\u003e. \u003ccode\u003ex\u003c/code\u003e is the candidate observation, \u003ccode\u003eb\u003c/code\u003e is the source observation and \u003ccode\u003es\u003c/code\u003e is the contract's physical normalization scale. These define no degradation allowance. Zero-weight observations still undergo measurement and functional checks.\u003c/p\u003e\n\u003cp\u003eArea quality is \u003ccode\u003e14329.60165 um² / candidate functional area\u003c/code\u003e; the area target is the original reference layout's functional-footprint soft target, and a separate envelope constraint controls functional bounds. Total score is \u003ccode\u003e100 × product(min(1, q_i)^w_i)\u003c/code\u003e, using the contract's \u003ccode\u003elayout\u003c/code\u003e method and original weights. Source-equivalent performance at target area scores 100, and each metric is capped at quality 1, so scores cannot exceed 100. Physical or functional invalidity scores zero; missing or unusable measurements make the score unknown. Capability coefficient \u003ccode\u003e3\u003c/code\u003e is independent of this quality score.\u003c/p\u003e\n13:T119f,\u003cp\u003eSoft solve budget: \u003cstrong\u003e8 hours\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eRead \u003ccode\u003e/protocol/task.json\u003c/code\u003e for input/output paths, constraints and the \u003ccode\u003eresources\u003c/code\u003e object; \u003ccode\u003e/protocol/harness.json\u003c/code\u003e describes the active check and submission interface.\u003c/p\u003e\n\u003cp\u003eUse the task information, tools and SKY130 resources provided by the runtime protocol. Write only the final GDS to \u003ccode\u003eoutput/final.gds\u003c/code\u003e and explicitly submit through the declared interface. Source simulation serves characterization; accepted results come from complete physical and RC electrical evaluation of the candidate GDS. Conclusions cover only the declared conditions, excluding PVT, mismatch, reliability and product signoff.\u003c/p\u003e\n\u003ch3\u003eSolve workflow\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eRead the declared circuit and materials, \u003ccode\u003e/protocol/task.json\u003c/code\u003e for paths, constraints and reviewed resources, and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e for capabilities and helper commands. Task inputs under \u003ccode\u003e/task\u003c/code\u003e and resources under \u003ccode\u003e/resources\u003c/code\u003e are read-only; construct the layout in \u003ccode\u003e/workspace\u003c/code\u003e with the declared tools. With layout MCP, paths and commands refer to the remote EDA workspace. Create your own implementation with real devices, interconnect and pins, using your own tool loop without delegating to other agents; reference layouts and author code are not solver inputs.\u003c/li\u003e\n\u003cli\u003eInspect \u003ccode\u003eresources.external\u003c/code\u003e before using external tools. Each command starts a fresh shell: when tool modules are declared, source \u003ccode\u003e/usr/share/Modules/init/bash\u003c/code\u003e and load the selected tool's modules; export its declared \u003ccode\u003etool_environment\u003c/code\u003e settings in that same command. Repeat as needed and use batch or headless operation. Local manuals, command references, and release notes may be available within the declared EDA installation and PDK resource directories. Locate these resources through \u003ccode\u003e/protocol/task.json\u003c/code\u003e and consult the documentation for the installed tool version when diagnosing unfamiliar syntax or tool failures.\u003c/li\u003e\n\u003cli\u003eGenerate an initial candidate and submit a snapshot early. When \u003ccode\u003eprocess-feedback\u003c/code\u003e is available, check the current GDS with layout MCP \u003ccode\u003echeck\u003c/code\u003e or \u003ccode\u003epython -I /protocol/process_check.py\u003c/code\u003e before the final submission. This runs the final evaluator's complete plan and returns engineering diagnostics and candidate measurements, without scores or normalized quality factors. Checks have no count limit and consume the same wall-clock budget. Inspect the physical and functional results and all scored metrics; successful tool execution alone does not establish requirement satisfaction. Read paginated diagnostics with \u003ccode\u003ereport\u003c/code\u003e when using MCP. Local exploratory checks do not replace this complete check.\u003c/li\u003e\n\u003cli\u003eUse the remaining time for measured improvements to the declared quality objectives. Identify the limiting scored metrics, make targeted layout changes, regenerate and check the candidate, and compare measurements with the previous candidate and the stated scoring targets and trade-offs. Preserve the best valid candidate and revert changes that worsen the overall objective. Repeat while time and useful improvements remain; passing validity checks alone is not a stopping condition.\u003c/li\u003e\n\u003cli\u003eStop optimization when the budget expires, all declared quality objectives are achieved, or measured trials support convergence. If stopping early, explain the changes tried, the metric comparisons and the remaining limitations. Track remaining time through session status. At soft-budget expiry, finish or cancel already-started work and submit immediately; do not start another command, check or optimization round. If an MCP execution is running, use \u003ccode\u003epoll\u003c/code\u003e with its \u003ccode\u003eexecution_id\u003c/code\u003e and the returned \u003ccode\u003enext_offset\u003c/code\u003e as \u003ccode\u003eoffset\u003c/code\u003e until completion, or cancel it and wait for it to stop.\u003c/li\u003e\n\u003cli\u003eFinish or cancel outstanding work, restore your best candidate to the declared output path, and explicitly submit it before ending the session. With layout MCP \u003ccode\u003esubmit\u003c/code\u003e, remove the \u003ccode\u003e/workspace/\u003c/code\u003e prefix from \u003ccode\u003eoutput.path\u003c/code\u003e; with the container interface, run \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e. Wait for the receipt: only the last accepted snapshot is judged, and writing a file alone is not submission. Acceptance confirms delivery; the framework independently evaluates validity and quality after the session.\u003c/li\u003e\n\u003c/ol\u003e\n6:[\"$\",\"$8\",null,{\"fallback\":[\"$\",\"p\",null,{\"children\":\"Loading published evidence…\"}],\"children\":[\"$\",\"$L10\",null,{\"task\":{\"case_path\":\"tasks/sky130A/OpenFASOC/cases/two_stage_opamp/case.toml\",\"coefficient\":3,\"collection\":\"OpenFASOC\",\"configuration_url\":\"/ICLayout-Bench/assets/b471bec084907e082f0bb812fa5ba60dd0376f837184ccc1358e4c1852a4898a.txt\",\"description_html\":\"$11\",\"description_path\":\"tasks/sky130A/OpenFASOC/cases/two_stage_opamp/problem.md\",\"hours\":8,\"id\":\"sky130A.OpenFASOC.two_stage_opamp\",\"inputs\":{\"description\":{\"format\":\"text\",\"path\":\"problem.md\",\"sha256\":\"108783232225db91b1228435e800e60e979d4c897bef3cae15e7237e0909a729\"},\"netlist\":{\"format\":\"spice\",\"path\":\"materials/circuit.spice\",\"sha256\":\"f49f855271aef32cc4b890fd261f376a632d2d389b936a73f944de8d50503b89\",\"subcircuit\":\"OPAMP_TWO_STAGE\"},\"performance\":{\"format\":\"spice\",\"path\":\"materials/testbench.spice\",\"sha256\":\"77e9a05834a6a73aa1d0b3a1750529a321ab664be231b7bde8c99a72707b8cdd\"}},\"licenses\":[{\"name\":\"LICENSE\",\"path\":\"tasks/sky130A/OpenFASOC/LICENSE\",\"url\":\"/ICLayout-Bench/assets/c71d239df91726fc519c6eb72d318ec65820627232b2f796219e87dcf35d0ab4.txt\"},{\"name\":\"NOTICE\",\"path\":\"tasks/sky130A/OpenFASOC/NOTICE\",\"url\":\"/ICLayout-Bench/assets/274e13ad9458d0418773bacdfe05d6d45e4905da7c930cae0a376b7a33d8ed26.txt\"}],\"materials\":[{\"name\":\"problem.md\",\"role\":\"description\",\"url\":\"/ICLayout-Bench/assets/108783232225db91b1228435e800e60e979d4c897bef3cae15e7237e0909a729.txt\"},{\"name\":\"materials/circuit.spice\",\"role\":\"netlist\",\"url\":\"/ICLayout-Bench/assets/f49f855271aef32cc4b890fd261f376a632d2d389b936a73f944de8d50503b89.txt\"},{\"name\":\"materials/testbench.spice\",\"role\":\"performance\",\"url\":\"/ICLayout-Bench/assets/77e9a05834a6a73aa1d0b3a1750529a321ab664be231b7bde8c99a72707b8cdd.txt\"}],\"metrics\":[{\"aggregation\":\"max\",\"category\":\"physical\",\"direction\":\"minimize\",\"id\":\"functional_area\",\"observations\":[\"geometry:area\"],\"unit\":\"um2\"},{\"aggregation\":\"min\",\"baseline\":[\"source_light:gain_low\",\"source_nominal:gain_low\",\"source_heavy:gain_low\"],\"category\":\"performance\",\"dimension\":\"response\",\"direction\":\"maximize\",\"id\":\"gain_low\",\"normalization\":\"db20\",\"observations\":[\"light:gain_low\",\"nominal:gain_low\",\"heavy:gain_low\"],\"unit\":\"dB\"},{\"aggregation\":\"min\",\"baseline\":[\"source_light:loop_bandwidth\",\"source_nominal:loop_bandwidth\",\"source_heavy:loop_bandwidth\"],\"category\":\"performance\",\"dimension\":\"response\",\"direction\":\"maximize\",\"id\":\"loop_bandwidth\",\"normalization\":\"ratio\",\"observations\":[\"light:loop_bandwidth\",\"nominal:loop_bandwidth\",\"heavy:loop_bandwidth\"],\"requirement\":{\"lower\":0,\"rationale\":\"The declared ordered-event interval or crossing frequency has a nonnegative measurement domain, and its crossing must exist for a usable observation.\"},\"unit\":\"Hz\"},{\"aggregation\":\"max\",\"baseline\":[\"source_light:supply_power\",\"source_nominal:supply_power\",\"source_heavy:supply_power\"],\"category\":\"performance\",\"dimension\":\"supply\",\"direction\":\"minimize\",\"id\":\"supply_power\",\"normalization\":\"saturating_ratio\",\"observations\":[\"light:supply_power\",\"nominal:supply_power\",\"heavy:supply_power\"],\"requirement\":{\"lower\":0,\"rationale\":\"The declared powered circuit must consume nonnegative net energy from its supplies and driven references over the stated observation; power magnitude remains a quality objective.\"},\"scale\":0.0001,\"unit\":\"W\"},{\"aggregation\":\"min\",\"category\":\"performance\",\"direction\":\"target\",\"id\":\"phase_margin\",\"observations\":[\"light:phase_margin\",\"nominal:phase_margin\",\"heavy:phase_margin\"],\"requirement\":{\"lower\":0,\"rationale\":\"The declared negative-feedback loop must remain on its measured 0 to 180 degree stable-feedback branch at the specified crossing; the previous 45 degree design margin is not a validity cutoff.\",\"upper\":180},\"unit\":\"deg\"},{\"aggregation\":\"max\",\"category\":\"performance\",\"direction\":\"target\",\"id\":\"bias_voltage\",\"observations\":[\"light:bias_voltage\",\"nominal:bias_voltage\",\"heavy:bias_voltage\"],\"requirement\":{\"lower\":0.3,\"rationale\":\"The declared output or bias must stay in its specified operating or logic-level interval under the supplied rail, feedback or full-scale reference conditions; an out-of-range output violates that interface.\",\"upper\":1.5},\"unit\":\"V\"}],\"pdk\":\"sky130A\",\"reader\":{\"category\":\"Amplifiers \u0026 RF\",\"summary\":\"Amplifies differential inputs with a two-stage Miller amplifier characterized at noise gain ten.\",\"title\":\"SKY130 Two-Stage Miller Operational Amplifier\"},\"scoring\":{\"area_metric\":\"functional_area\",\"area_target\":14329.60165,\"method\":\"layout\",\"rationale\":\"Low-frequency voltage gain and noise-gain-10 loop bandwidth each carry 30%, supply power 20%, and physical area 20%. Source and extracted fixtures use 0.1/0.5/1 pF and 100 Mohm loads, TT at 27 C, 1.8 V supply, 0.9 V common mode and 20/100 uA biases. The loop must retain its stable 0 to 180 degree phase-margin branch at |A|=10; no fixed gain, bandwidth, power or 45 degree margin budget is a validity cutoff. Area target is the frozen reference functional footprint.\",\"weights\":{\"functional_area\":0.2,\"gain_low\":0.3,\"loop_bandwidth\":0.3,\"supply_power\":0.2}},\"sections\":{\"Electrical Requirements and Scoring\":\"$12\",\"Inputs and Interface\":\"\u003cp\u003eOrdered ports are \u003ccode\u003eVDD GND DIFFPAIR_BIAS VP VN CS_BIAS VOUT\u003c/code\u003e. Declared inputs include \u003ccode\u003eproblem.md\u003c/code\u003e, \u003ccode\u003ematerials/circuit.spice\u003c/code\u003e and \u003ccode\u003ematerials/testbench.spice\u003c/code\u003e. The runtime provides models and process resources; reference layouts, author code and qualification evidence are maintainer-only materials.\u003c/p\u003e\\n\",\"Objective\":\"\u003cp\u003eImplement \u003ccode\u003eOPAMP_TWO_STAGE\u003c/code\u003e from the supplied transistor-level circuit, preserving topology, fixed device parameters, four-terminal body connections and the ordered interface. Submit a candidate GDS for electrical evaluation of its distributed RC extraction.\u003c/p\u003e\\n\u003ch3\u003eOptimization objective\u003c/h3\u003e\\n\u003cp\u003eMaximize the declared quality score within the solve budget while satisfying all physical and necessary functional requirements. The first passing DRC, LVS and required electrical checks establish a feasible baseline. Continue improving the scored metrics from that baseline; a passing check or \u003ccode\u003etask_success = true\u003c/code\u003e does not mean that the quality objectives have been achieved.\u003c/p\u003e\\n\",\"Operating Conditions\":\"\u003cp\u003eSupply 1.8 V, input common mode 0.9 V, and external input-stage/common-source-stage bias currents 20, 100 uA, respectively. Use output capacitances 0.1, 0.5, 1 pF and a 100 Mohm resistive load. Feedback 9 Mohm and reference 1 Mohm resistors set noise gain 10; external large inductance/capacitance closes DC feedback and breaks AC feedback, measuring loop bandwidth and phase margin where open-loop magnitude falls to 10. This fixture does not prove unity-gain stability. All electrical experiments use fixed TT models at 27 °C; delivered testbenches define interpolation, edges, loads, sweeps, observation times and power intervals.\u003c/p\u003e\\n\",\"Physical Requirements\":\"\u003cp\u003eSubmit a nonempty GDS no larger than 10485760 bytes, with top cell \u003ccode\u003eOPAMP_TWO_STAGE\u003c/code\u003e. Functional geometry must fit within the 200 × 200 um envelope on the declared layer set. Pass complete Magic DRC without waivers and independent Netgen LVS checking named ports, models, dimensions, multiplicities and body/contact connections. After physical and geometric checks pass, extract the candidate's distributed interconnect resistance, capacitance and devices, then run every declared experiment.\u003c/p\u003e\\n\",\"Tools and Submission\":\"$13\"},\"source_url\":\"https://github.com/idea-fasoc/OpenFASOC/tree/426c17025c7c01d6e7d4d259fb7f9e7d741cc5c4\",\"status\":\"qualified\",\"title\":\"SKY130 Two-Stage Miller Operational Amplifier\",\"core\":false},\"catalog\":{\"tasks\":[],\"runs\":[],\"experiments\":[],\"contexts\":[],\"boards\":[]},\"previewRun\":null,\"preview\":null,\"evidenceError\":false}]}]\nc:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n14:I[27201,[\"/ICLayout-Bench/_next/static/chunks/2h60meymns2z5.js\"],\"IconMark\"]\n9:null\ne:[[\"$\",\"title\",\"0\",{\"children\":\"ICLayout-Bench | Circuit layout intelligence\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Independent evaluation of AI for integrated circuit layout. Compare model scores, explore circuit performance and inspect generated layouts.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/ICLayout-Bench/brand/iclayout-bench.svg\",\"type\":\"image/svg+xml\",\"sizes\":\"any\"}],[\"$\",\"$L14\",\"3\",{}]]\n"])</script></body></html>
