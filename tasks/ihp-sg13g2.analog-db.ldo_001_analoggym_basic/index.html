ce\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}],[\"$\",\"script\",\"script-0\",{\"src\":\"/ICLayout-Bench/_next/static/chunks/3gll1ekbrh320.js\",\"async\":true,\"nonce\":\"$undefined\"}]],[\"$\",\"html\",null,{\"lang\":\"en\",\"children\":[\"$\",\"body\",null,{\"children\":[[\"$\",\"a\",null,{\"className\":\"skip-link\",\"href\":\"#main-content\",\"children\":\"Skip to content\"}],[\"$\",\"header\",null,{\"children\":[[\"$\",\"$L2\",null,{\"className\":\"brand\",\"href\":\"/\",\"children\":[[\"$\",\"img\",null,{\"className\":\"brandmark\",\"src\":\"/ICLayout-Bench/brand/iclayout-bench.svg\",\"width\":40,\"height\":40,\"alt\":\"\",\"aria-hidden\":\"true\"}],\" \",\"ICLayout\",[\"$\",\"span\",null,{\"children\":\"Bench\"}]]}],[\"$\",\"$L3\",null,{\"participantAccess\":false}]]}],[\"$\",\"main\",null,{\"id\":\"main-content\",\"children\":[\"$\",\"$L4\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L5\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":[[\"$\",\"section\",null,{\"children\":[[\"$\",\"h1\",null,{\"children\":\"Page unavailable\"}],[\"$\",\"p\",null,{\"children\":\"This page is not part of the current public release.\"}],[\"$\",\"$L2\",null,{\"href\":\"/\",\"children\":\"Return to overview\"}]]}],[]],\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]}],[\"$\",\"footer\",null,{\"children\":[[\"$\",\"span\",null,{\"children\":\"ICLayout-Bench · Integrated circuit layout intelligence\"}],[\"$\",\"span\",null,{\"children\":[\"Evidence first. Conditions explicit.\",\" \",[\"$\",\"$L2\",null,{\"href\":\"/methodology\",\"children\":\"Methodology\"}],false]}]]}]]}]}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[null,[\"$\",\"$L4\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L5\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[\"$L6\",[[\"$\",\"script\",\"script-0\",{\"src\":\"/ICLayout-Bench/_next/static/chunks/3_2wwayut9q0b.js\",\"async\":true,\"nonce\":\"$undefined\"}]],[\"$\",\"$L7\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.MetadataOutlet\",\"children\":\"$@9\"}]}]]}],{},null,false,null]},null,false,\"$a\"]},null,false,null],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Lb\",null,{\"children\":\"$Lc\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Ld\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.Metadata\",\"children\":\"$Le\"}]}]}],null]}],false]],\"m\":\"$undefined\",\"G\":[\"$f\",[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/ICLayout-Bench/_next/static/chunks/25phisebeeifo.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]]],\"S\":true,\"h\":null,\"r\":\"$undefined\",\"s\":\"$undefined\",\"a\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"U2oZdoUjWqT_XfcDHuQ5i\"}\n10:I[1186,[\"/ICLayout-Bench/_next/static/chunks/3gll1ekbrh320.js\",\"/ICLayout-Bench/_next/static/chunks/3_2wwayut9q0b.js\"],\"default\"]\na:C\n11:T50f0,\u003ch1 id=\"problem-multistage-error-amplifier-pmos-regulator-layout-task\"\u003eMultistage Error-Amplifier PMOS Regulator Layout Task\u003c/h1\u003e\n\u003ch2 id=\"problem-objective\"\u003eObjective\u003c/h2\u003e\n\u003cp\u003eLay out \u003ccode\u003eldo_001_analoggym_basic\u003c/code\u003e: a PMOS pass regulator with a folded\nPMOS-input error amplifier, cascoded bias branches, mirrored loads and an\nadditional PMOS/NMOS intermediate branch driving the pass-gate node \u003ccode\u003enet1\u003c/code\u003e.\nThe auxiliary PMOS source and body connect to \u003ccode\u003enet1\u003c/code\u003e; the input pair has a\nseparate source-tied \u003ccode\u003enet20\u003c/code\u003e well. Internal compensation connects \u003ccode\u003enet106\u003c/code\u003e\nto output and the 3:1 physical divider returns one quarter of output voltage.\nThis complete multistage error amplifier and its internal pass-gate drive\nare distinct from the simpler 5T and mirror-OTA regulator cases.\u003c/p\u003e\n\u003ch2 id=\"problem-inputs-and-interface\"\u003eInputs and Interface\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003ematerials/circuit.cdl\u003c/code\u003e: authoritative native physical circuit.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ematerials/circuit.spice\u003c/code\u003e: matching simulator circuit with finite taps.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ematerials/testbench.spice\u003c/code\u003e: bilateral loop and current-load recovery.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ematerials/startup.spice\u003c/code\u003e: synchronized zero-state resistive startup.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ematerials/sweeps.spice\u003c/code\u003e: line/load and downward headroom sweeps.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eOrdered ports: \u003ccode\u003evdd vout vss ib vref vfb sense\u003c/code\u003e. VDD/VSS are supply/return,\nVOUT output, IB connects an external current sink to VSS, and VREF is the\nexternal reference. VFB is the physical divider midpoint and SENSE is the\ninverting error-amplifier input. Connect them only through the testbench's\nzero-volt injection link; no additional servo or feedback element is permitted.\nThe source's zero-volt output measurement link is collapsed into VOUT and\nrelocated to this explicitly declared divider/input boundary.\u003c/p\u003e\n\u003cp\u003eRetain all 24 source MOS groups. Integer regrouping converts 1,168 source\nfingers into 831 physical fingers with \u0026lt;=10 um individual width, preserving\neach original group's total W, L and body connection exactly. Individual W/m\nand diffusion perimeter change, so the maintained simulator and extracted\ncandidate are qualified independently. Other PMOS bodies use the VDD well;\nNMOS bodies and physical high-poly backplates use the VSS substrate contact.\nExplicit 2 x 2 um substrate/well taps use \u0026lt;=20 um pitch. Preserve the current\nnative circuit's dimensions and total multiplicities; equivalent parallel\nfingering requires all physical and electrical checks to pass.\u003c/p\u003e\n\u003cp\u003eAll internal passives are physical DUT elements:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eThree parallel 42.685 × 42.685 um \u003ccode\u003ecap_cmim\u003c/code\u003e units: top \u003ccode\u003enet106\u003c/code\u003e, bottom VOUT;\napproximately 8.22 pF total, retaining the source's approximately 8.2 pF branch.\u003c/li\u003e\n\u003cli\u003eOne 51.64 × 51.64 um \u003ccode\u003ecap_cmim\u003c/code\u003e: top \u003ccode\u003enet10\u003c/code\u003e, bottom VOUT, approximately\n4 pF. This added physical local compensation closes the internal dynamic mode.\u003c/li\u003e\n\u003cli\u003eTwelve series \u003ccode\u003erhigh\u003c/code\u003e segments from VOUT to VFB and four from VFB to VSS,\neach W=1 um, L=17.465 um, b=0: approximately 300/100 kohm total.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eThere is no additional external output capacitor, but the compensation is\nreal output-connected storage. Do not delete or idealize any internal passive.\u003c/p\u003e\n\u003ch2 id=\"problem-operating-conditions\"\u003eOperating Conditions\u003c/h2\u003e\n\u003cp\u003eThe loop/load testbench allows 1000 DC operating-point iterations (\u003ccode\u003eitl1=1000\u003c/code\u003e)\nfor both source and extracted simulations. Error tolerances and physical stimuli\nare unchanged; this is a convergence setting, not added circuit damping.\u003c/p\u003e\n\u003cp\u003eUse typical IHP LV MOS/MIM/poly models at 27 C. VDD is 1.2 or 1.3 V,\nVREF=0.225 V, and the external IB-to-VSS sink is 8 uA. The reference is\nexplicitly changed from the normalized source's 0.4 V: the 3:1 divider then\nhas a 0.9 V ideal output target, within the LV supply. The 8 uA bias and\nall original total MOS widths/lengths are retained. This is a bounded\nregulator core, not a precision reference, PVT or manufacturing-signoff task.\u003c/p\u003e\n\u003cp\u003eMain measurements cover both supplies and initial current loads 0.2/0.5 mA.\nAfter an operating point, the load doubles at 2–2.2 us, remains high for\n8 us, and returns at 10.2–10.4 us; the period is 16 us. Simulate 0–18 us\nwith KLU, Gear order 2, maximum step 1 ns, \u003ccode\u003ershunt=1e12\u003c/code\u003e, \u003ccode\u003ereltol=1e-5\u003c/code\u003e,\n\u003ccode\u003eabstol=1e-12\u003c/code\u003e and \u003ccode\u003evntol=1e-8\u003c/code\u003e. The numerical shunt is not a physical\nbias or startup device. Explicit \u003ccode\u003e.save\u003c/code\u003e lists retain all measured vectors;\nevery extracted circuit element still participates in the solve.\u003c/p\u003e\n\u003cp\u003eMeasure the bilateral return ratio at the actual divider/input boundary:\nfirst inject unit series AC voltage from SENSE to VFB, with zero parallel\ncurrent; then use zero series voltage and unit current into SENSE. With\nfirst-run \u003ccode\u003eb=-I(VPROBE)\u003c/code\u003e, \u003ccode\u003ed=V(SENSE)\u003c/code\u003e and second-run \u003ccode\u003ea=-I(VPROBE)\u003c/code\u003e,\n\u003ccode\u003ec=V(SENSE)\u003c/code\u003e, define \u003ccode\u003edelta=a*d-b*c\u003c/code\u003e and\n\u003ccode\u003eT=(2*delta-a+d)/(1-2*delta+a-d)\u003c/code\u003e (Tian et al., Eq. 30).\nBoth injections retain divider, input and reverse-path loading. Exported\nvoltages/currents permit an independent two-port admittance calculation.\nSweep 0.01 Hz–1 GHz at 300 points/decade, using continuous natural phase\nwithout an arbitrary low-frequency offset. Check first/final descending\nunity crossings, minimum sampled \u003ccode\u003eabs(1+T)\u003c/code\u003e, full sampled return-difference\nphase and maximum 200 MHz–1 GHz gain. This finite external-loop contract\nis not an exhaustive proof of all internal poles.\u003c/p\u003e\n\u003cp\u003eSweep load 0.2–1 mA in 10 uA steps at each supply. Downward VDD sweeps\n1.3–0.8 V in 1 mV steps at 0.2/1 mA measure the first 30 mV output-error\ncrossing. The line span uses both endpoints of 1.2–1.3 V. The regulation\nfloor includes amplifier headroom and is not a pass-resistance-only dropout\nrating. These DC sweeps do not extend dynamic stability to every intermediate\nsupply/load combination.\u003c/p\u003e\n\u003cp\u003eStartup uses \u003ccode\u003euic\u003c/code\u003e with supply, reference and bias ramping together from zero\nin 10 or 20 us. For both supplies, use 900/4500 ohm resistive loads (nominally\n1/0.2 mA at 0.9 V), maximum step 2 ns, and simulate to 50 us. This does not\nqualify arbitrary sequencing or a constant-current load imposed at zero supply.\nFaster 1 us startup and 20 ns current-load edges are outside qualification: they\nproduce excessive peaks in the same extracted circuit. The README provides\nrunnable failure probes. The maintained contract explicitly narrows the\ninitial development stimuli without relaxing the voltage-excursion bounds.\nLoads below 0.2 mA are outside the qualified dynamic range.\u003c/p\u003e\n\u003cp\u003eFirst and final crossing phase margins must both lie in [0, 180] degrees.\nMinimum return distance and return-phase excursion have only nonnegative\ndomain bounds; high-frequency gain has no acceptance bound. These full-sweep\nmetrics affect continuous quality without adding a stability acceptance screen.\nMissing crossings or invalid observations are evaluator errors.\u003c/p\u003e\n\u003ch2 id=\"problem-physical-requirements\"\u003ePhysical Requirements\u003c/h2\u003e\n\u003cp\u003eSubmit GDSII top cell \u003ccode\u003eldo_001_analoggym_basic\u003c/code\u003e, at most 32 MiB. Pass native\nIHP main/maximal DRC without waivers (standalone density/antenna disabled),\nstrict named-interface LVS with explicit taps, and a 5500 × 360 um functional\nenvelope. All device/contact/interconnect drawing layers in the runtime\n\u003ccode\u003eoutline\u003c/code\u003e contribute to area; annotation and pin-purpose layers do not.\u003c/p\u003e\n\u003cp\u003eCandidate-derived Magic RC includes both capacitor plates, every poly segment,\nMOS and interconnect parasitic. Half-grid import and zero parasitic thresholds\nare explicit. Native LVS checks the original GDS's tap labels; the Magic\nextraction copy retains only Metal3 interface text, avoiding internal well-name\naliases without altering geometry. Magic idealizes well/substrate taps while\nsource simulation includes their finite models. Distributed substrate\nresistance/noise and fabrication signoff remain unqualified.\u003c/p\u003e\n\u003ch2 id=\"problem-electrical-requirements-and-scoring\"\u003eElectrical Requirements and Scoring\u003c/h2\u003e\n\u003cp\u003ePhysical checks and declared functional bounds remain mandatory. Quality has no\nfixed allowed-degradation threshold. Each \u003ccode\u003esource_*\u003c/code\u003e job simulates the declared\nsource circuit with exactly the same testbench, model resources, parameters,\nload and measurement window as its paired extracted-candidate job. A source\nobservation is the 100-point electrical baseline; it is independent of the\nsubmitted GDS. All individual pairs are retained in the evaluation report.\u003c/p\u003e\n\u003cp\u003eFor a post-layout observation x and its source observation b:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eMaximize: q = x/b; minimize: q = b/x. When a numerical scale s is declared,\nuse (x+s)/(b+s) or its inverse. This handles zero-valued error measurements;\ns is a normalization floor, not an allowed degradation or pass threshold.\u003c/li\u003e\n\u003cli\u003eAmplitude dB: q = 10^((x-b)/20) for maximize, its inverse for minimize.\u003c/li\u003e\n\u003cli\u003eTarget: q = 1/(1+abs(x-b)/s), with a declared physical scale s. Signed and\nzero-valued operating points are never divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eScoring uses \u003ccode\u003elayout\u003c/code\u003e. A metric uses its worst paired quality q. The score is\nS = 100 * product(q_i ** w_i), including area quality\nq_area = area_reference / candidate_functional_area. The weights below sum to\none. Dimensions describe measurements but do not determine their weights.\nPhysical or functional rejection scores zero; missing or invalid measurements\nproduce an unknown score, including measurements with zero weight.\nSource-equivalent performance at the area reference scores 100; improvements\ncan exceed 100. A weight expresses a tradeoff, not a hard acceptance limit.\u003c/p\u003e\n\u003cp\u003eMeasurement definitions below use the supplied SPICE node/source names.\n\u003ccode\u003ev(n)\u003c/code\u003e is node voltage and \u003ccode\u003ei(V)\u003c/code\u003e is current into a voltage source; delivered\npower therefore uses a minus sign. \u003ccode\u003edb(z)=20*log10(abs(z))\u003c/code\u003e, \u003ccode\u003emag/abs\u003c/code\u003e\ndenote magnitude, and \u003ccode\u003ecph\u003c/code\u003e is continuous phase in radians. \u003ccode\u003efind\u003c/code\u003e, \u003ccode\u003ewhen\u003c/code\u003e,\n\u003ccode\u003efrom/to\u003c/code\u003e, and \u003ccode\u003erise/fall\u003c/code\u003e retain the deck's interpolation, window and\ncrossing conventions; SPICE suffixes p/n/u/m/meg/g mean pico/nano/micro/\nmilli/mega/giga. Nested \u003ccode\u003eavg\u003c/code\u003e, \u003ccode\u003emin\u003c/code\u003e, \u003ccode\u003emax\u003c/code\u003e, \u003ccode\u003evecmin/vecmax\u003c/code\u003e and \u003ccode\u003ederiv\u003c/code\u003e\nmean the stated window average, extrema and sampled derivative. All\ndeclared conditions are measured separately and paired with the same\nsource condition; a group uses its worst paired quality.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eDefinition / observations\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eQuality rule\u003c/th\u003e\n\u003cth\u003eFunctional bounds\u003c/th\u003e\n\u003cth\u003eScale\u003c/th\u003e\n\u003cth\u003eDimension\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003ev(vout)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.3\u003c/td\u003e\n\u003ctd\u003e1.3\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebias_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003ev(ib)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.3\u003c/td\u003e\n\u003ctd\u003e1.3\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003equiescent_a\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003e-i(VDD)-@iload[current]\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eA\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003ctd\u003esupply\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003e-v(vdd)*i(VDD)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003ctd\u003esupply\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edc_gain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: Value of \ n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estartup_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Maximum of \u003ccode\u003e(abs(v(vout)-0.9)) from=40u to=49u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estartup_peak_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Maximum of \u003ccode\u003ev(vout) from=0 to=50u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.3\u003c/td\u003e\n\u003ctd\u003e1.3\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estartup_minimum_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Minimum of \u003ccode\u003ev(vout) from=0 to=50u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e1.3\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eregulation_floor_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC: Crossing coordinate where \u003ccode\u003e(abs(v(vout)-0.9))=0.03 rise=1\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.3\u003c/td\u003e\n\u003ctd\u003e1.3\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eheadroom_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC sweep: \u003ccode\u003e(when (abs(v(vout)-0.9))=0.03 rise=1)-(find v(vout) when (abs(v(vout)-0.9))=0.03 rise=1)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eline_span_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC sweep: \u003ccode\u003e(max v(vout) from=1.3 to=1.2)-(min v(vout) from=1.3 to=1.2)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eload_span_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC sweep: \u003ccode\u003e(max v(vout))-(min v(vout))\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eArea reference: \u003cstrong\u003e42364.42 um2\u003c/strong\u003e. 1240 expanded device instances; sum of device/contact envelopes 27974.3733 um2, per-side envelope allowance 0.6 um, 50% routing allowance and total outer width/height allowance 1.2 um. Estimate = ceil(100 * (1.5 * envelope_sum + 2 * margin * sqrt(envelope_sum) + margin^2)) / 100. Here margin is the total allowance across two opposite sides; the envelope sum is displayed rounded to four decimals. MOS/passive envelopes use declared W/L (or resistor dimensions) and multiplicity; explicit tap areas and HBT emitter/contact envelopes are included. This is a frozen engineering estimate, not a foundry minimum or a feasibility claim.\u003c/p\u003e\n\u003cp\u003eThe capability coefficient remains \u003cstrong\u003e9\u003c/strong\u003e; it is independent of\nthe reference-relative task score.\u003c/p\u003e\n\u003ch3 id=\"problem-score-weights\"\u003eScore weights\u003c/h3\u003e\n\u003cp\u003eIHP regulators: regulation and headroom 22.5%; load recovery 22.5%; startup 13.5%; loop stability 13.5%; AC transfer and extrema 4.5%; internal bias 1.8%; quiescent current 7.2%; power 4.5%; area 10%. Each objective's weight is divided equally among its metrics.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eheadroom_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eline_span_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eload_span_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eregulation_floor_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eloaded_ripple_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.056250000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003erecovery_load_v\u003c/code\u00 \u003e\u003ccode\u003efinal_unity_hz\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.007500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ehf_gain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.007500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emaximum_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.007500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eminimum_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.007500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eunity_hz\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.007500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebias_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.018000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003equiescent_a\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.072000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emean_power_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.022500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.022500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch2 id=\"problem-tools-and-submission\"\u003eTools and Submission\u003c/h2\u003e\n\u003cp\u003eSolve budget: \u003cstrong\u003e3 hours\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eDiscover task/resources/feedback through \u003ccode\u003e/protocol/task.json\u003c/code\u003e,\n\u003ccode\u003e/protocol/resources.json\u003c/code\u003e and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e. Use the supplied\nIHP primitives and KLayout/Magic/ngspice. Write \u003ccode\u003e/workspace/output/final.gds\u003c/code\u003e\nand explicitly submit via the harness protocol. Host configuration, source\nrecords and reference answers are excluded from standard solver inputs.\u003c/p\u003e\n12:T2ece,\u003cp\u003ePhysical checks and declared functional bounds remain mandatory. Quality has no\nfixed allowed-degradation threshold. Each \u003ccode\u003esource_*\u003c/code\u003e job simulates the declared\nsource circuit with exactly the same testbench, model resources, parameters,\nload and measurement window as its paired extracted-candidate job. A source\nobservation is the 100-point electrical baseline; it is independent of the\nsubmitted GDS. All individual pairs are retained in the evaluation report.\u003c/p\u003e\n\u003cp\u003eFor a post-layout observation x and its source observation b:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eMaximize: q = x/b; minimize: q = b/x. When a numerical scale s is declared,\nuse (x+s)/(b+s) or its inverse. This handles zero-valued error measurements;\ns is a normalization floor, not an allowed degradation or pass threshold.\u003c/li\u003e\n\u003cli\u003eAmplitude dB: q = 10^((x-b)/20) for maximize, its inverse for minimize.\u003c/li\u003e\n\u003cli\u003eTarget: q = 1/(1+abs(x-b)/s), with a declared physical scale s. Signed and\nzero-valued operating points are never divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eScoring uses \u003ccode\u003elayout\u003c/code\u003e. A metric uses its worst paired quality q. The score is\nS = 100 * product(q_i ** w_i), including area quality\nq_area = area_reference / candidate_functional_area. The weights below sum to\none. Dimensions describe measurements but do not determine their weights.\nPhysical or functional rejection scores zero; missing or invalid measurements\nproduce an unknown score, including measurements with zero weight.\nSource-equivalent performance at the area reference scores 100; improvements\ncan exceed 100. A weight expresses a tradeoff, not a hard acceptance limit.\u003c/p\u003e\n\u003cp\u003eMeasurement definitions below use the supplied SPICE node/source names.\n\u003ccode\u003ev(n)\u003c/code\u003e is node voltage and \u003ccode\u003ei(V)\u003c/code\u003e is current into a voltage source; delivered\npower therefore uses a minus sign. \u003ccode\u003edb(z)=20*log10(abs(z))\u003c/code\u003e, \u003ccode\u003emag/abs\u003c/code\u003e\ndenote magnitude, and \u003ccode\u003ecph\u003c/code\u003e is continuous phase in radians. \u003ccode\u003efind\u003c/code\u003e, \u003ccode\u003ewhen\u003c/code\u003e,\n\u003ccode\u003efrom/to\u003c/code\u003e, and \u003ccode\u003erise/fall\u003c/code\u003e retain the deck's interpolation, window and\ncrossing conventions; SPICE suffixes p/n/u/m/meg/g mean pico/nano/micro/\nmilli/mega/giga. Nested \u003ccode\u003eavg\u003c/code\u003e, \u003ccode\u003emin\u003c/code\u003e, \u003ccode\u003emax\u003c/code\u003e, \u003ccode\u003evecmin/vecmax\u003c/code\u003e and \u003ccode\u003ederiv\u003c/code\u003e\nmean the stated window average, extrema and sampled derivative. All\ndeclared conditions are measured separately and paired with the same\nsource condition; a group uses its worst paired quality.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eDefinition / observations\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eQuality rule\u003c/th\u003e\n\u003cth\u003eFunctional bounds\u003c/th\u003e\n\u003cth\u003eScale\u003c/th\u003e\n\u003cth\u003eDimension\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003ev(vout)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estartup_peak_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Maximum of \u003ccode\u003ev(vout) from=0 to=50u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.3\u003c/td\u003e\n\u003ctd\u003e1.3\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estartup_minimum_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Minimum of \u003ccode\u003ev(vout) from=0 to=50u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e1.3\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eregulation_floor_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC: Crossing coordinate where \u003ccode\u003e(abs(v(vout)-0.9))=0.03 rise=1\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.3\u003c/td\u003e\n\u003ctd\u003e1.3\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eheadroom_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC sweep: \u003ccode\u003e(when (abs(v(vout)-0.9))=0.03 rise=1)-(find v(vout) when (abs(v(vout)-0.9))=0.03 rise=1)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eline_span_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC sweep: \u003ccode\u003e(max v(vout) from=1.3 to=1.2)-(min v(vout) from=1.3 to=1.2)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eload_span_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC sweep: \u003ccode\u003e(max v(vout))-(min v(vout))\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eArea reference: \u003cstrong\u003e42364.42 um2\u003c/strong\u003e. 1240 expanded device instances; sum of device/contact envelopes 27974.3733 um2, per-side envelope allowance 0.6 um, 50% routing allowance and total outer width/height allowance 1.2 um. Estimate = ceil(100 * (1.5 * envelope_sum + 2 * margin * sqrt(envelope_sum) + margin^2)) / 100. Here margin is the total allowance across two opposite sides; the envelope sum is displayed rounded to four decimals. MOS/passive envelopes use declared W/L (or resistor dimensions) and multiplicity; explicit tap areas and HBT emitter/contact envelopes are included. This is a frozen engineering estimate, not a foundry minimum or a feasibility claim.\u003c/p\u003e\n\u003cp\u003eThe capability coefficient remains \u003cstrong\u003e9\u003c/strong\u003e; it is independent of\nthe reference-relative task score.\u003c/p\u003e\n\u003ch3\u003eScore weights\u003c/h3\u003e\n\u003cp\u003eIHP regulators: regulation and headroom 22.5%; load recovery 22.5%; startup 13.5%; loop stability 13.5%; AC transfer and extrema 4.5%; internal bias 1.8%; quiescent current 7.2%; power 4.5%; area 10%. Each objective's weight is divided equally among its metrics.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eheadroom_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eline_span_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eload_span_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eregulation_floor_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eloaded_ripple_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.056250000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003erecovery_load_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.056250000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003erecovery_release_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.056250000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ereleased_ripple_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.056250000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estartup_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estartup_minimum_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estartup_peak_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efinal_phase_margin_deg\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.033750000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eminimum_return_distance\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.033750000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ephase_margin_deg\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.033750000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ereturn_phase_excursion_deg\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.033750000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edc_gain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.007500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efinal_unity_hz\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.007500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ehf_gain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.007500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emaximum_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.007500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eminimum_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.007500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eunity_hz\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.007500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebias_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.018000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003equiescent_a\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.072000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emean_power_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.022500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.022500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n13:Te83,\u003cp\u003eThe loop/load testbench allows 1000 DC operating-point iterations (\u003ccode\u003eitl1=1000\u003c/code\u003e)\nfor both source and extracted simulations. Error tolerances and physical stimuli\nare unchanged; this is a convergence setting, not added circuit damping.\u003c/p\u003e\n\u003cp\u003eUse typical IHP LV MOS/MIM/poly models at 27 C. VDD is 1.2 or 1.3 V,\nVREF=0.225 V, and the external IB-to-VSS sink is 8 uA. The reference is\nexplicitly changed from the normalized source's 0.4 V: the 3:1 divider then\nhas a 0.9 V ideal output target, within the LV supply. The 8 uA bias and\nall original total MOS widths/lengths are retained. This is a bounded\nregulator core, not a precision reference, PVT or manufacturing-signoff task.\u003c/p\u003e\n\u003cp\u003eMain measurements cover both supplies and initial current loads 0.2/0.5 mA.\nAfter an operating point, the load doubles at 2–2.2 us, remains high for\n8 us, and returns at 10.2–10.4 us; the period is 16 us. Simulate 0–18 us\nwith KLU, Gear order 2, maximum step 1 ns, \u003ccode\u003ershunt=1e12\u003c/code\u003e, \u003ccode\u003ereltol=1e-5\u003c/code\u003e,\n\u003ccode\u003eabstol=1e-12\u003c/code\u003e and \u003ccode\u003evntol=1e-8\u003c/code\u003e. The numerical shunt is not a physical\nbias or startup device. Explicit \u003ccode\u003e.save\u003c/code\u003e lists retain all measured vectors;\nevery extracted circuit element still participates in the solve.\u003c/p\u003e\n\u003cp\u003eMeasure the bilateral return ratio at the actual divider/input boundary:\nfirst inject unit series AC voltage from SENSE to VFB, with zero parallel\ncurrent; then use zero series voltage and unit current into SENSE. With\nfirst-run \u003ccode\u003eb=-I(VPROBE)\u003c/code\u003e, \u003ccode\u003ed=V(SENSE)\u003c/code\u003e and second-run \u003ccode\u003ea=-I(VPROBE)\u003c/code\u003e,\n\u003ccode\u003ec=V(SENSE)\u003c/code\u003e, define \u003ccode\u003edelta=a*d-b*c\u003c/code\u003e and\n\u003ccode\u003eT=(2*delta-a+d)/(1-2*delta+a-d)\u003c/code\u003e (Tian et al., Eq. 30).\nBoth injections retain divider, input and reverse-path loading. Exported\nvoltages/currents permit an independent two-port admittance calculation.\nSweep 0.01 Hz–1 GHz at 300 points/decade, using continuous natural phase\nwithout an arbitrary low-frequency offset. Check first/final descending\nunity crossings, minimum sampled \u003ccode\u003eabs(1+T)\u003c/code\u003e, full sampled return-difference\nphase and maximum 200 MHz–1 GHz gain. This finite external-loop contract\nis not an exhaustive proof of all internal poles.\u003c/p\u003e\n\u003cp\u003eSweep load 0.2–1 mA in 10 uA steps at each supply. Downward VDD sweeps\n1.3–0.8 V in 1 mV steps at 0.2/1 mA measure the first 30 mV output-error\ncrossing. The line span uses both endpoints of 1.2–1.3 V. The regulation\nfloor includes amplifier headroom and is not a pass-resistance-only dropout\nrating. These DC sweeps do not extend dynamic stability to every intermediate\nsupply/load combination.\u003c/p\u003e\n\u003cp\u003eStartup uses \u003ccode\u003euic\u003c/code\u003e with supply, reference and bias ramping together from zero\nin 10 or 20 us. For both supplies, use 900/4500 ohm resistive loads (nominally\n1/0.2 mA at 0.9 V), maximum step 2 ns, and simulate to 50 us. This does not\nqualify arbitrary sequencing or a constant-current load imposed at zero supply.\nFaster 1 us startup and 20 ns current-load edges are outside qualification: they\nproduce excessive peaks in the same extracted circuit. The README provides\nrunnable failure probes. The maintained contract explicitly narrows the\ninitial development stimuli without relaxing the voltage-excursion bounds.\nLoads below 0.2 mA are outside the qualified dynamic range.\u003c/p\u003e\n\u003cp\u003eFirst and final crossing phase margins must both lie in [0, 180] degrees.\nMinimum return distance and return-phase excursion have only nonnegative\ndomain bounds; high-frequency gain has no acceptance bound. These full-sweep\nmetrics affect continuous quality without adding a stability acceptance screen.\nMissing crossings or invalid observations are evaluator errors.\u003c/p\u003e\n6:[\"$\",\"$8\",null,{\"fallback\":[\"$\",\"p\",null,{\"children\":\"Loading published evidence…\"}],\"children\":[\"$\",\"$L10\",null,{\"task\":{\"case_path\":\"tasks/ihp-sg13g2/analog-db/cases/ldo_001_analoggym_basic/case.toml\",\"coefficient\":9,\"collection\":\"analog-db\",\"configuration_url\":\"/ICLayout-Bench/assets/53db61a2e3fbe8b58aaf94ca5228beb06b42fe8688ff538676485d51ede6fca6.txt\",\"description_html\":\"$11\",\"description_path\":\"tasks/ihp-sg13g2/analog-db/cases/ldo_001_analoggym_basic/problem.md\",\"hours\":3,\"id\":\"ihp-sg13g2.analog-db.ldo_001_analoggym_basic\",\"inputs\":{\"description\":{\"format\":\"text\",\"path\":\"problem.md\",\"sha256\":\"746049248099678645eb61767da0158b9bb407a74da57666677685279397c80b\"},\"netlist\":{\"format\":\"spice\",\"path\":\"materials/circuit.cdl\",\"sha256\":\"e \"reader\":{\"category\":\"Power \u0026 references\",\"summary\":\"Regulates a loaded output through the declared feedback loop, with layout-dependent recovery and power.\",\"title\":\"Multistage Error-Amplifier PMOS Regulator\"},\"schematic_url\":\"/ICLayout-Bench/assets/860f3660d4f3b4539be4bb5a6049aca13c06e32b029f0a1196b3410971f34c09.svg\",\"scoring\":{\"area_metric\":\"functional_area\",\"area_target\":42364.42,\"method\":\"layout\",\"rationale\":\"IHP regulators: regulation and headroom 22.5%; load recovery 22.5%; startup 13.5%; loop stability 13.5%; AC transfer and extrema 4.5%; internal bias 1.8%; quiescent current 7.2%; power 4.5%; area 10%. Each objective's weight is divided equally among its metrics.\",\"weights\":{\"bias_v\":0.018,\"dc_gain_db\":0.0075,\"final_phase_margin_deg\":0.03375,\"final_unity_hz\":0.0075,\"functional_area\":0.1,\"headroom_v\":0.045,\"hf_gain_db\":0.0075,\"line_span_v\":0.045,\"load_span_v\":0.045,\"loaded_ripple_v\":0.05625,\"maximum_v\":0.0075,\"mean_power_w\":0.0225,\"minimum_return_distance\":0.03375,\"minimum_v\":0.0075,\"output_v\":0.045,\"phase_margin_deg\":0.03375,\"power_w\":0.0225,\"quiescent_a\":0.072,\"recovery_load_v\":0.05625,\"recovery_release_v\":0.05625,\"regulation_floor_v\":0.045,\"released_ripple_v\":0.05625,\"return_phase_excursion_deg\":0.03375,\"startup_error_v\":0.045,\"startup_minimum_v\":0.045,\"startup_peak_v\":0.045,\"unity_hz\":0.0075}},\"sections\":{\"Electrical Requirements and Scoring\":\"$12\",\"Objective\":\"\u003cp\u003eLay out \u003ccode\u003eldo_001_analoggym_basic\u003c/code\u003e: a PMOS pass regulator with a folded\\nPMOS-input error amplifier, cascoded bias branches, mirrored loads and an\\nadditional PMOS/NMOS intermediate branch driving the pass-gate node \u003ccode\u003enet1\u003c/code\u003e.\\nThe auxiliary PMOS source and body connect to \u003ccode\u003enet1\u003c/code\u003e; the input pair has a\\nseparate source-tied \u003ccode\u003enet20\u003c/code\u003e well. Internal compensation connects \u003ccode\u003enet106\u003c/code\u003e\\nto output and the 3:1 physical divider returns one quarter of output voltage.\\nThis complete multistage error amplifier and its internal pass-gate drive\\nare distinct from the simpler 5T and mirror-OTA regulator cases.\u003c/p\u003e\\n\",\"Operating Conditions\":\"$13\",\"Physical Requirements\":\"\u003cp\u003eSubmit GDSII top cell \u003ccode\u003eldo_001_analoggym_basic\u003c/code\u003e, at most 32 MiB. Pass native\\nIHP main/maximal DRC without waivers (standalone density/antenna disabled),\\nstrict named-interface LVS with explicit taps, and a 5500 × 360 um functional\\nenvelope. All device/contact/interconnect drawing layers in the runtime\\n\u003ccode\u003eoutline\u003c/code\u003e contribute to area; annotation and pin-purpose layers do not.\u003c/p\u003e\\n\u003cp\u003eCandidate-derived Magic RC includes both capacitor plates, every poly segment,\\nMOS and interconnect parasitic. Half-grid import and zero parasitic thresholds\\nare explicit. Native LVS checks the original GDS's tap labels; the Magic\\nextraction copy retains only Metal3 interface text, avoiding internal well-name\\naliases without altering geometry. Magic idealizes well/substrate taps while\\nsource simulation includes their finite models. Distributed substrate\\nresistance/noise and fabrication signoff remain unqualified.\u003c/p\u003e\\n\"},\"source_url\":\"https://github.com/MacAnalog/spicexplorer-release/tree/263d0322f8900dc331536fbbe6c0e804514fc454/analog-db/circuits/ldo_001_analoggym_basic\",\"status\":\"qualified\",\"title\":\"Multistage Error-Amplifier PMOS Regulator\"},\"catalog\":{\"boards\":[],\"contexts\":[],\"experiments\":[],\"runs\":[],\"tasks\":[]},\"evidenceError\":false}]}]\nc:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n14:I[27201,[\"/ICLayout-Bench/_next/static/chunks/3gll1ekbrh320.js\"],\"IconMark\"]\n9:null\ne:[[\"$\",\
