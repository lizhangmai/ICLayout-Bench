error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L5\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[\"$L6\",[[\"$\",\"script\",\"script-0\",{\"src\":\"/ICLayout-Bench/_next/static/chunks/27jip_2vcvnd5.js\",\"async\":true,\"nonce\":\"$undefined\"}]],[\"$\",\"$L7\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.MetadataOutlet\",\"children\":\"$@9\"}]}]]}],{},null,false,null]},null,false,\"$a\"]},null,false,null],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Lb\",null,{\"children\":\"$Lc\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Ld\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.Metadata\",\"children\":\"$Le\"}]}]}],null]}],false]],\"m\":\"$undefined\",\"G\":[\"$f\",[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/ICLayout-Bench/_next/static/chunks/3sa54_ghi1h2h.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]]],\"S\":true,\"h\":null,\"r\":\"$undefined\",\"s\":\"$undefined\",\"a\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"2hqB741EA4j7xWQVg6hu-\"}\n10:I[1186,[\"/ICLayout-Bench/_next/static/chunks/2h60meymns2z5.js\",\"/ICLayout-Bench/_next/static/chunks/27jip_2vcvnd5.js\"],\"default\"]\na:C\n11:T6835,\u003ch1 id=\"problem-multistage-error-amplifier-pmos-regulator-layout-task\"\u003eMultistage Error-Amplifier PMOS Regulator Layout Task\u003c/h1\u003e\n\u003ch2 id=\"problem-objective\"\u003eObjective\u003c/h2\u003e\n\u003cp\u003eLay out \u003ccode\u003eldo_001_analoggym_basic\u003c/code\u003e: a PMOS pass regulator with a folded\nPMOS-input error amplifier, cascoded bias branches, mirrored loads and an\nadditional PMOS/NMOS intermediate branch driving the pass-gate node \u003ccode\u003enet1\u003c/code\u003e.\nThe auxiliary PMOS source and body connect to \u003ccode\u003enet1\u003c/code\u003e; the input pair has a\nseparate source-tied \u003ccode\u003enet20\u003c/code\u003e well. Internal compensation connects \u003ccode\u003enet106\u003c/code\u003e\nto output and the 3:1 physical divider returns one quarter of output voltage.\nThis complete multistage error amplifier and its internal pass-gate drive\nare distinct from the simpler 5T and mirror-OTA regulator cases.\u003c/p\u003e\n\u003ch3 id=\"problem-optimization-objective\"\u003eOptimization objective\u003c/h3\u003e\n\u003cp\u003eMaximize the declared quality score within the solve budget while satisfying all physical and necessary functional requirements. The first passing DRC, LVS and required electrical checks establish a feasible baseline. Continue improving the scored metrics from that baseline; a passing check or \u003ccode\u003etask_success = true\u003c/code\u003e does not mean that the quality objectives have been achieved.\u003c/p\u003e\n\u003ch2 id=\"problem-inputs-and-interface\"\u003eInputs and Interface\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003ematerials/circuit.cdl\u003c/code\u003e: authoritative native physical circuit.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ematerials/circuit.spice\u003c/code\u003e: matching simulator circuit with logical body nets.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ematerials/testbench.spice\u003c/code\u003e: bilateral loop and current-load recovery.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ematerials/startup.spice\u003c/code\u003e: synchronized zero-state resistive startup.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ematerials/sweeps.spice\u003c/code\u003e: line/load and downward headroom sweeps.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eOrdered ports: \u003ccode\u003evdd vout vss ib vref vfb sense\u003c/code\u003e. VDD/VSS are supply/return,\nVOUT output, IB connects an external current sink to VSS, and VREF is the\nexternal reference. VFB is the physical divider midpoint and SENSE is the\ninverting error-amplifier input. Connect them only through the testbench's\nzero-volt injection link; no additional servo or feedback element is permitted.\nThe source's zero-volt output measurement link is collapsed into VOUT and\nrelocated to this explicitly declared divider/input boundary.\u003c/p\u003e\n\u003cp\u003eRetain all 24 source MOS groups. The declared inputs retain upstream W/L/m with the reviewed geometry-grid adaptation. Other PMOS bodies use the VDD well;\nNMOS bodies and physical high-poly backplates use the VSS substrate contact.\nWell/substrate contacts must meet the native PDK rules. Preserve the declared\nMOS dimensions and total multiplicities; equivalent parallel\nfingering requires all physical and electrical checks to pass.\u003c/p\u003e\n\u003cp\u003eAll internal passives are physical DUT elements:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eThree parallel 42.685 × 42.685 um \u003ccode\u003ecap_cmim\u003c/code\u003e units: top \u003ccode\u003enet106\u003c/code\u003e, bottom VOUT;\napproximately 8.22 pF total, retaining the source's approximately 8.2 pF branch.\u003c/li\u003e\n\u003cli\u003eOne 51.64 × 51.64 um \u003ccode\u003ecap_cmim\u003c/code\u003e: top \u003ccode\u003enet10\u003c/code\u003e, bottom VOUT, approximately\n4 pF. This added physical local compensation closes the internal dynamic mode.\u003c/li\u003e\n\u003cli\u003eTwelve series \u003ccode\u003erhigh\u003c/code\u003e segments from VOUT to VFB and four from VFB to VSS,\neach W=1 um, L=17.465 um, b=0: approximately 300/100 kohm total.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eThere is no additional external output capacitor, but the compensation is\nreal output-connected storage. Do not delete or idealize any internal passive.\u003c/p\u003e\n\u003ch2 id=\"problem-operating-conditions\"\u003eOperating Conditions\u003c/h2\u003e\n\u003cp\u003eThe loop/load testbench allows 1000 DC operating-point iterations (\u003ccode\u003eitl1=1000\u003c/code\u003e)\nfor both source and extracted simulations. Error tolerances and physical stimuli\nare unchanged; this is a convergence setting, not added circuit damping.\u003c/p\u003e\n\u003cp\u003eUse typical IHP LV MOS/MIM/poly models at 27 C. VDD is 1.2 or 1.3 V,\nVREF=0.225 V, and the external IB-to-VSS sink is 8 uA. The reference is\nexplicitly changed from the normalized source's 0.4 V: the 3:1 divider then\nhas a 0.9 V ideal output target, within the LV supply. The 8 uA bias and\nall original total MOS widths/lengths are retained. This is a bounded\nregulator core, not a precision reference, PVT or manufacturing-signoff task.\u003c/p\u003e\n\u003cp\u003eMain measurements cover both supplies and initial current loads 0.2/0.5 mA.\nAfter an operating point, the load doubles at 2–2.2 us, remains high for\n8 us, and returns at 10.2–10.4 us; the period is 16 us. Simulate 0–18 us\nwith KLU, Gear order 2, maximum step 1 ns, \u003ccode\u003ershunt=1e12\u003c/code\u003e, \u003ccode\u003ereltol=1e-5\u003c/code\u003e,\n\u003ccode\u003eabstol=1e-12\u003c/code\u003e and \u003ccode\u003evntol=1e-8\u003c/code\u003e. The numerical shunt is not a physical\nbias or startup device. Explicit \u003ccode\u003e.save\u003c/code\u003e lists retain all measured vectors;\nevery extracted circuit element still participates in the solve.\u003c/p\u003e\n\u003cp\u003eMeasure the bilateral return ratio at the actual divider/input boundary:\nfirst inject unit series AC voltage from SENSE to VFB, with zero parallel\ncurrent; then use zero series voltage and unit current into SENSE. With\nfirst-run \u003ccode\u003eb=-I(VPROBE)\u003c/code\u003e, \u003ccode\u003ed=V(SENSE)\u003c/code\u003e and second-run \u003ccode\u003ea=-I(VPROBE)\u003c/code\u003e,\n\u003ccode\u003ec=V(SENSE)\u003c/code\u003e, define \u003ccode\u003edelta=a*d-b*c\u003c/code\u003e and\n\u003ccode\u003eT=(2*delta-a+d)/(1-2*delta+a-d)\u003c/code\u003e (Tian et al., Eq. 30).\nBoth injections retain divider, input and reverse-path loading. Exported\nvoltages/currents permit an independent two-port admittance calculation.\nSweep 0.01 Hz–1 GHz at 300 points/decade, using continuous natural phase\nwithout an arbitrary low-frequency offset. Check first/final descending\nunity crossings, minimum sampled \u003ccode\u003eabs(1+T)\u003c/code\u003e, full sampled return-difference\nphase and maximum 200 MHz–1 GHz gain. This finite external-loop contract\nis not an exhaustive proof of all internal poles.\u003c/p\u003e\n\u003cp\u003eSweep load 0.2–1 mA in 10 uA steps at each supply. Downward VDD sweeps\n1.3–0.8 V in 1 mV steps at 0.2/1 mA measure the first 30 mV output-error\ncrossing. The line span uses both endpoints of 1.2–1.3 V. The regulation\nfloor includes amplifier headroom and is not a pass-resistance-only dropout\nrating. These DC sweeps do not extend dynamic stability to every intermediate\nsupply/load combination.\u003c/p\u003e\n\u003cp\u003eStartup uses \u003ccode\u003euic\u003c/code\u003e with supply, reference and bias ramping together from zero\nin 10 or 20 us. For both supplies, use 900/4500 ohm resistive loads (nominally\n1/0.2 mA at 0.9 V), maximum step 2 ns, and simulate to 50 us. This does not\nqualify arbitrary sequencing or a constant-current load imposed at zero supply.\nFaster 1 us startup and 20 ns current-load edges are outside qualification: they\nproduce excessive peaks in the same extracted circuit. The README provides\nrunnable failure probes. The maintained contract explicitly narrows the\ninitial development stimuli without relaxing the voltage-excursion bounds.\nLoads below 0.2 mA are outside the qualified dynamic range.\u003c/p\u003e\n\u003cp\u003eThe phase margins at the first and last crossings must both lie within [0, 180] degrees. Minimum return distance and return-phase excursion need only be nonnegative; high-frequency gain has no acceptance threshold. These full-sweep metrics affect continuous quality without adding stability acceptance conditions. Missing crossings or invalid observations are evaluation errors.\u003c/p\u003e\n\u003ch2 id=\"problem-physical-requirements\"\u003ePhysical Requirements\u003c/h2\u003e\n\u003cp\u003eSubmit GDSII top cell \u003ccode\u003eldo_001_analoggym_basic\u003c/code\u003e, at most 32 MiB. Pass native\nIHP main/maximal DRC without waivers (standalone density/antenna disabled),\nstrict named-interface LVS with physically verified body connections, and a 5500 × 360 um functional\nenvelope. All device/contact/interconnect drawing layers in the runtime\n\u003ccode\u003eoutline\u003c/code\u003e contribute to area; annotation and pin-purpose layers do not.\u003c/p\u003e\n\u003cp\u003eCandidate-derived Magic RC includes both capacitor plates, every poly segment,\nMOS and interconnect parasitic. Half-grid import and zero parasitic thresholds\nare explicit. Native LVS checks the original GDS and actual body connections; the Magic\nextraction copy retains only Metal3 interface text, avoiding internal well-name\naliases without altering geometry. Source simulation and extraction\nuse the same logical body-net boundary. Distributed substrate\nresistance/noise and fabrication signoff remain unqualified.\u003c/p\u003e\n\u003ch2 id=\"problem-electrical-requirements-and-scoring\"\u003eElectrical Requirements and Scoring\u003c/h2\u003e\n\u003cp\u003eArtifact, geometry, DRC, LVS and declared functional requirements must pass. Parasitic extraction is also mandatory: it must produce a complete, electrically consistent netlist usable by the required post-layout simulations. A completed candidate rejection scores zero; infrastructure errors do not establish candidate failure.\u003c/p\u003e\n\u003cp\u003ePhysical checks and the declared functional bounds must pass. Quality scoring imposes no fixed degradation allowance. Each \u003ccode\u003esource_*\u003c/code\u003e job and its corresponding candidate extracted circuit use exactly the same testbench, model resources, parameters, loads and measurement windows. Independent source observations define the 100-point electrical baseline without depending on the submitted GDS; reports retain every paired result.\u003c/p\u003e\n\u003cp\u003eLet x be the post-layout measurement and b the source-circuit measurement under the same conditions:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eRatio normalization: maximize with q = x/b and minimize with q = b/x. When a numerical scale s is declared, use (x+s)/(b+s) and its reciprocal, respectively. The scale handles zero values as a normalization floor; it is neither an allowed degradation nor an acceptance bound.\u003c/li\u003e\n\u003cli\u003eAmplitude in dB: maximize with q = 10^((x-b)/20) and minimize with its reciprocal.\u003c/li\u003e\n\u003cli\u003eTarget normalization: q = 1/(1+abs(x-b)/s), where s is the declared physical scale. Signed or zero-valued operating points are not divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eUse \u003ccode\u003elayout\u003c/code\u003e scoring. Each metric takes its worst paired quality q, and the total score is S = 100 * product(min(1, q_i) ** w_i), with area quality q_area = area_reference / candidate_functional_area. The weights below sum to 1; metric dimensions describe measurements and do not determine weights. Physical, extraction, or functional rejection scores zero; other missing or invalid measurements leave the score unknown, and zero-weight observations must also be valid. Matching source-circuit performance at the reference area scores 100 points; each metric is capped at quality 1, so scores cannot exceed 100. Weights express quality tradeoffs rather than hard bounds.\u003c/p\u003e\n\u003cp\u003eThe measurements below use the supplied SPICE node and source names. \u003ccode\u003ev(n)\u003c/code\u003e is a node voltage; \u003ccode\u003ei(V)\u003c/code\u003e is current flowing into a voltage source, so delivered power uses a negative sign. \u003ccode\u003edb(z)=20*log10(abs(z))\u003c/code\u003e; \u003ccode\u003emag/abs\u003c/code\u003e denote magnitude, and \u003ccode\u003ecph\u003c/code\u003e denotes continuous phase in radians. \u003ccode\u003efind\u003c/code\u003e, \u003ccode\u003ewhen\u003c/code\u003e, \u003ccode\u003efrom/to\u003c/code\u003e and \u003ccode\u003erise/fall\u003c/code\u003e follow the deck's interpolation, window and crossing conventions. SPICE suffixes p/n/u/m/meg/g mean pico/nano/micro/milli/mega/giga. Nested \u003ccode\u003eavg\u003c/code\u003e, \u003ccode\u003emin\u003c/code\u003e, \u003ccode\u003emax\u003c/code\u003e, \u003ccode\u003evecmin/vecmax\u003c/code\u003e and \u003ccode\u003ederiv\u003c/code\u003e represent window averages, extrema and sampled derivatives. Measure each operating condition independently, pair it with the source result under that condition, and take the worst paired quality within each metric group.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003eloaded_ripple_v\u003c/code\u003e, \u003ccode\u003ereleased_ripple_v\u003c/code\u003e, \u003ccode\u003estartup_error_v\u003c/code\u003e, \u003ccode\u003erecovery_load_v\u003c/code\u003e, \u003ccode\u003erecovery_release_v\u003c/code\u003e, \u003ccode\u003eline_span_v\u003c/code\u003e, \u003ccode\u003eload_span_v\u003c/code\u003e use \u003ccode\u003esaturating_ratio\u003c/code\u003e: q = 2(b+s)/(b+x+2s), where x is candidate error, b is paired source error and s is the positive scale below. Source equivalence gives q=1; improvement approaches the upper limit 2 with diminishing returns. s retains the declared units and numeric-floor meaning; normalize each condition before taking the worst quality, and apply other rules as declared.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eDefinition / observation\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eQuality normalization\u003c/th\u003e\n\u003cth\u003eFunctional range\u003c/th\u003e\n\u003cth\u003eScale\u003c/th\u003e\n\u003cth\u003eDimension\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003ev(vout)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.3\u003c/td\u003e\n\u003ctd\u003e1.3\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebias_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003ev(ib)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.3\u003c/td\u003e\n\u003ctd\u003e1.3\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003equiescent_a\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003e-i(VDD)-@iload[current]\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eA\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003ctd\u003esupply\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003e-v(vdd)*i(VDD)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003ctd\u003esupply\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edc_gain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: Value of \u003ccode\u003e(db((T))) at=0.01\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003emaximize / db20\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eunity_hz\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: Crossing coordinate where \u003ccode\u003e(db((T)))=0 fall=1\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eHz\u003c/td\u003e\n\u003ctd\u003emaximize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ephase_margin_deg\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: \u003ccode\u003e180+(find (180*cph((T))/pi) when (db((T)))=0 fall=1)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003edeg\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 180\u003c/td\u003e\n\u003ctd\u003e180\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efinal_unity_hz\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: Crossing coordinate where \u003ccode\u003e(db((T)))=0 fall=last\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eHz\u003c/td\u003e\n\u003ctd\u003emaximize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efinal_phase_margin_deg\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: \u003ccode\u003e180+(find (180*cph((T))/pi) when (db((T)))=0 fall=last)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003edeg\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 180\u003c/td\u003e\n\u003ctd\u003e180\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eminimum_return_distance\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: \u003ccode\u003evecmin((mag(1+(T))))\u003c/code\u003e; sweep \u003ccode\u003edec 300 0.01 1g\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003e1\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1.0\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ereturn_phase_excursion_deg\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: \u003ccode\u003evecmax(abs(180*cph(1+(T))/pi))\u003c/code\u003e; sweep \u003ccode\u003edec 300 0.01 1g\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003edeg\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ehf_gain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: Maximum of \u003ccode\u003e(db((T))) from=200meg to=1g\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003eminimize / db20\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eminimum_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Minimum of \u003ccode\u003ev(vout) from=2u to=18u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.3\u003c/td\u003e\n\u003ctd\u003e1.3\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emaximum_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Maximum of \u003ccode\u003ev(vout) from=2u to=18u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.3\u003c/td\u003e\n\u003ctd\u003e1.3\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003erecovery_load_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Maximum of \u003ccode\u003e(abs(v(vout)-0.9)) from=5u to=9.5u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003erecovery_release_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Maximum of \u003ccode\u003e(abs(v(vout)-0.9)) from=13u to=17.5u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emean_power_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Mean of \u003ccode\u003e(-v(vdd)*i(VDD)) from=2u to=18u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003ctd\u003esupply\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eloaded_ripple_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTransient: \u003ccode\u003e(max v(vout) from=9u to=9.5u)-(min v(vout) from=9u to=9.5u)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ereleased_ripple_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTransient: \u003ccode\u003e(max v(vout) from=17u to=17.5u)-(min v(vout) from=17u to=17.5u)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estartup_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Maximum of \u003ccode\u003e(abs(v(vout)-0.9)) from=40u to=49u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estartup_peak_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Maximum of \u003ccode\u003ev(vout) from=0 to=50u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.3\u003c/td\u003e\n\u003ctd\u003e1.3\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estartup_minimum_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Minimum of \u003ccode\u003ev(vout) from=0 to=50u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e1.3\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eregulation_floor_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC: Crossing coordinate where \u003ccode\u003e(abs(v(vout)-0.9))=0.03 rise=1\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.3\u003c/td\u003e\n\u003ctd\u003e1.3\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eheadroom_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC sweep: \u003ccode\u003e(when (abs(v(vout)-0.9))=0.03 rise=1)-(find v(vout) when (abs(v(vout)-0.9))=0.03 rise=1)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eline_span_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC sweep: \u003ccode\u003e(max v(vout) from=1.3 to=1.2)-(min v(vout) from=1.3 to=1.2)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eload_span_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC sweep: \u003ccode\u003e(max v(vout))-(min v(vout))\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eArea reference: \u003cstrong\u003e42364.42 um2\u003c/strong\u003e. The reference engineering estimate used 1240 device instances, a sum of device/contact envelopes 27974.3733 um2, a one-sided envelope margin of 0.6 um, a routing allowance of 50%, and a total outer width/height allowance 1.2 um. Estimate = ceil(100 * (1.5 * envelope_sum + 2 * margin * sqrt(envelope_sum) + margin^2)) / 100. Here margin is the total allowance across both sides, and the envelope sum is displayed to four decimal places. Reference MOS/passive envelopes use W/L (or resistor dimensions) and multiplicity, including explicit contacts and HBT emitter/contact envelopes. This is a frozen engineering estimate, not a process minimum or a proven achievable area.\u003c/p\u003e\n\u003cp\u003eThe capability coefficient is \u003cstrong\u003e9\u003c/strong\u003e, independent of this task's reference-normalized score.\u003c/p\u003e\n\u003ch3 id=\"problem-score-weights\"\u003eScore weights\u003c/h3\u003e\n\u003cp\u003eIHP regulator: regulation and dropout 22.5%, load recovery 22.5%, startup 13.5%, loop stability 13.5%, AC transfer and extrema 4.5%, internal bias 1.8%, quiescent current 7.2%, power 4.5%, area 10%; each objective weight is divided equally among its metrics.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eheadroom_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eline_span_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eload_span_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eregulation_floor_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eloaded_ripple_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.056250000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003erecovery_load_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.056250000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003erecovery_release_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.056250000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ereleased_ripple_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.056250000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estartup_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estartup_minimum_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estartup_peak_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efinal_phase_margin_deg\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.033750000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eminimum_return_distance\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.033750000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ephase_margin_deg\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.033750000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ereturn_phase_excursion_deg\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.033750000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edc_gain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.007500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efinal_unity_hz\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.007500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ehf_gain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.007500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emaximum_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.007500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eminimum_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.007500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eunity_hz\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.007500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebias_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.018000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003equiescent_a\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.072000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emean_power_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.022500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.022500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch2 id=\"problem-tools-and-submission\"\u003eTools and Submission\u003c/h2\u003e\n\u003cp\u003eSoft solve budget: \u003cstrong\u003e3 hours\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eDiscover task/resources/feedback through \u003ccode\u003e/protocol/task.json\u003c/code\u003e (including its \u003ccode\u003eresources\u003c/code\u003e field) and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e. Use the supplied\nIHP primitives and KLayout/Magic/ngspice. Write \u003ccode\u003e/workspace/output/final.gds\u003c/code\u003e\nand explicitly submit via the harness protocol. Host configuration, source\nrecords and reference answers are excluded from standard solver inputs.\u003c/p\u003e\n\u003cp\u003eThe authoritative MOS input preserves the original logical groups, W/L/m and all four terminal nets. Verified unit arrays, multiple fingers, shared diffusion and shared wells on the same body net are allowed. Native LVS checks connectivity and equivalent device parameters; native DRC checks actual well/substrate contacts. Contact count, dimensions, area/perimeter and the reference well partition are not circuit constraints. PEX uses actual diffusion geometry and interconnect RC, with logical body nets as its boundary; distributed substrate/well resistance is outside this extraction model.\u003c/p\u003e\n\u003ch3 id=\"problem-solve-workflow\"\u003eSolve workflow\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eRead the declared circuit and materials, \u003ccode\u003e/protocol/task.json\u003c/code\u003e for paths, constraints and reviewed resources, and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e for capabilities and helper commands. Task inputs under \u003ccode\u003e/task\u003c/code\u003e and resources under \u003ccode\u003e/resources\u003c/code\u003e are read-only; construct the layout in \u003ccode\u003e/workspace\u003c/code\u003e with the declared tools. With layout MCP, paths and commands refer to the remote EDA workspace. Create your own implementation with real devices, interconnect and pins, using your own tool loop without delegating to other agents; reference layouts and author code are not solver inputs.\u003c/li\u003e\n\u003cli\u003eInspect \u003ccode\u003eresources.external\u003c/code\u003e before using external tools. Each command starts a fresh shell: when tool modules are declared, source \u003ccode\u003e/usr/share/Modules/init/bash\u003c/code\u003e and load the selected tool's modules; export its declared \u003ccode\u003etool_environment\u003c/code\u003e settings in that same command. Repeat as needed and use batch or headless operation. Local manuals, command references, and release notes may be available within the declared EDA installation and PDK resource directories. Locate these resources through \u003ccode\u003e/protocol/task.json\u003c/code\u003e and consult the documentation for the installed tool version when diagnosing unfamiliar syntax or tool failures.\u003c/li\u003e\n\u003cli\u003eGenerate an initial candidate and submit a snapshot early. When \u003ccode\u003eprocess-feedback\u003c/code\u003e is available, check the current GDS with layout MCP \u003ccode\u003echeck\u003c/code\u003e or \u003ccode\u003epython -I /protocol/process_check.py\u003c/code\u003e before the final submission. This runs the final evaluator's complete plan and returns engineering diagnostics and candidate measurements, without scores or normalized quality factors. Checks have no count limit and consume the same wall-clock budget. Inspect the physical and functional results and all scored metrics; successful tool execution alone does not establish requirement satisfaction. Read paginated diagnostics with \u003ccode\u003ereport\u003c/code\u003e when using MCP. Local exploratory checks do not replace this complete check.\u003c/li\u003e\n\u003cli\u003eUse the remaining time for measured improvements to the declared quality objectives. Identify the limiting scored metrics, make targeted layout changes, regenerate and check the candidate, and compare measurements with the previous candidate and the stated scoring targets and trade-offs. Preserve the best valid candidate and revert changes that worsen the overall objective. Repeat while time and useful improvements remain; passing validity checks alone is not a stopping condition.\u003c/li\u003e\n\u003cli\u003eStop optimization when the budget expires, all declared quality objectives are achieved, or measured trials support convergence. If stopping early, explain the changes tried, the metric comparisons and the remaining limitations. Track remaining time through session status. At soft-budget expiry, finish or cancel already-started work and submit immediately; do not start another command, check or optimization round. If an MCP execution is running, use \u003ccode\u003epoll\u003c/code\u003e with its \u003ccode\u003eexecution_id\u003c/code\u003e and the returned \u003ccode\u003enext_offset\u003c/code\u003e as \u003ccode\u003eoffset\u003c/code\u003e until completion, or cancel it and wait for it to stop.\u003c/li\u003e\n\u003cli\u003eFinish or cancel outstanding work, restore your best candidate to the declared output path, and explicitly submit it before ending the session. With layout MCP \u003ccode\u003esubmit\u003c/code\u003e, remove the \u003ccode\u003e/workspace/\u003c/code\u003e prefix from \u003ccode\u003eoutput.path\u003c/code\u003e; with the container interface, run \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e. Wait for the receipt: only the last accepted snapshot is judged, and writing a file alone is not submission. Acceptance confirms delivery; the framework independently evaluates validity and quality after the session.\u003c/li\u003e\n\u003c/ol\u003e\n12:T33b3,\u003cp\u003eArtifact, geometry, DRC, LVS and declared functional requirements must pass. Parasitic extraction is also mandatory: it must produce a complete, electrically consistent netlist usable by the required post-layout simulations. A completed candidate rejection scores zero; infrastructure errors do not establish candidate failure.\u003c/p\u003e\n\u003cp\u003ePhysical checks and the declared functional bounds must pass. Quality scoring imposes no fixed degradation allowance. Each \u003ccode\u003esource_*\u003c/code\u003e job and its corresponding candidate extracted circuit use exactly the same testbench, model resources, parameters, loads and measurement windows. Independent source observations define the 100-point electrical baseline without depending on the submitted GDS; reports retain every paired result.\u003c/p\u003e\n\u003cp\u003eLet x be the post-layout measurement and b the source-circuit measurement under the same conditions:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eRatio normalization: maximize with q = x/b and minimize with q = b/x. When a numerical scale s is declared, use (x+s)/(b+s) and its reciprocal, respectively. The scale handles zero values as a normalization floor; it is neither an allowed degradation nor an acceptance bound.\u003c/li\u003e\n\u003cli\u003eAmplitude in dB: maximize with q = 10^((x-b)/20) and minimize with its reciprocal.\u003c/li\u003e\n\u003cli\u003eTarget normalization: q = 1/(1+abs(x-b)/s), where s is the declared physical scale. Signed or zero-valued operating points are not divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eUse \u003ccode\u003elayout\u003c/code\u003e scoring. Each metric takes its worst paired quality q, and the total score is S = 100 * product(min(1, q_i) ** w_i), with area quality q_area = area_reference / candidate_functional_area. The weights below sum to 1; metric dimensions describe measurements and do not determine weights. Physical, extraction, or functional rejection scores zero; other missing or invalid measurements leave the score unknown, and zero-weight observations must also be valid. Matching source-circuit performance at the reference area scores 100 points; each metric is capped at quality 1, so scores cannot exceed 100. Weights express quality tradeoffs rather than hard bounds.\u003c/p\u003e\n\u003cp\u003eThe measurements below use the supplied SPICE node and source names. \u003ccode\u003ev(n)\u003c/code\u003e is a node voltage; \u003ccode\u003ei(V)\u003c/code\u003e is current flowing into a voltage source, so delivered power uses a negative sign. \u003ccode\u003edb(z)=20*log10(abs(z))\u003c/code\u003e; \u003ccode\u003emag/abs\u003c/code\u003e denote magnitude, and \u003ccode\u003ecph\u003c/code\u003e denotes continuous phase in radians. \u003ccode\u003efind\u003c/code\u003e, \u003ccode\u003ewhen\u003c/code\u003e, \u003ccode\u003efrom/to\u003c/code\u003e and \u003ccode\u003erise/fall\u003c/code\u003e follow the deck's interpolation, window and crossing conventions. SPICE suffixes p/n/u/m/meg/g mean pico/nano/micro/milli/mega/giga. Nested \u003ccode\u003eavg\u003c/code\u003e, \u003ccode\u003emin\u003c/code\u003e, \u003ccode\u003emax\u003c/code\u003e, \u003ccode\u003evecmin/vecmax\u003c/code\u003e and \u003ccode\u003ederiv\u003c/code\u003e represent window averages, extrema and sampled derivatives. Measure each operating condition independently, pair it with the source result under that condition, and take the worst paired quality within each metric group.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003eloaded_ripple_v\u003c/code\u003e, \u003ccode\u003ereleased_ripple_v\u003c/code\u003e, \u003ccode\u003estartup_error_v\u003c/code\u003e, \u003ccode\u003erecovery_load_v\u003c/code\u003e, \u003ccode\u003erecovery_release_v\u003c/code\u003e, \u003ccode\u003eline_span_v\u003c/code\u003e, \u003ccode\u003eload_span_v\u003c/code\u003e use \u003ccode\u003esaturating_ratio\u003c/code\u003e: q = 2(b+s)/(b+x+2s), where x is candidate error, b is paired source error and s is the positive scale below. Source equivalence gives q=1; improvement approaches the upper limit 2 with diminishing returns. s retains the declared units and numeric-floor meaning; normalize each condition before taking the worst quality, and apply other rules as declared.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eDefinition / observation\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eQuality normalization\u003c/th\u003e\n\u003cth\u003eFunctional range\u003c/th\u003e\n\u003cth\u003eScale\u003c/th\u003e\n\u003cth\u003eDimension\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003ev(vout)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.3\u003c/td\u003e\n\u003ctd\u003e1.3\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebias_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003ev(ib)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.3\u003c/td\u003e\n\u003ctd\u003e1.3\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003equiescent_a\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003e-i(VDD)-@iload[current]\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eA\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003ctd\u003esupply\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003e-v(vdd)*i(VDD)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003ctd\u003esupply\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edc_gain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: Value of \u003ccode\u003e(db((T))) at=0.01\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003emaximize / db20\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eunity_hz\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: Crossing coordinate where \u003ccode\u003e(db((T)))=0 fall=1\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eHz\u003c/td\u003e\n\u003ctd\u003emaximize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ephase_margin_deg\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: \u003ccode\u003e180+(find (180*cph((T))/pi) when (db((T)))=0 fall=1)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003edeg\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 180\u003c/td\u003e\n\u003ctd\u003e180\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efinal_unity_hz\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: Crossing coordinate where \u003ccode\u003e(db((T)))=0 fall=last\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eHz\u003c/td\u003e\n\u003ctd\u003emaximize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efinal_phase_margin_deg\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: \u003ccode\u003e180+(find (180*cph((T))/pi) when (db((T)))=0 fall=last)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003edeg\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 180\u003c/td\u003e\n\u003ctd\u003e180\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eminimum_return_distance\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: \u003ccode\u003evecmin((mag(1+(T))))\u003c/code\u003e; sweep \u003ccode\u003edec 300 0.01 1g\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003e1\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1.0\u003c/td\u003e\n\u003ctd\u003eresponse\u0 3e\n\u003c/ul\u003e\n\u003cp\u003eOrdered ports: \u003ccode\u003evdd vout vss ib vref vfb sense\u003c/code\u003e. VDD/VSS are supply/return,\nVOUT output, IB connects an external current sink to VSS, and VREF is the\nexternal reference. VFB is the physical divider midpoint and SENSE is the\ninverting error-amplifier input. Connect them only through the testbench's\nzero-volt injection link; no additional servo or feedback element is permitted.\nThe source's zero-volt output measurement link is collapsed into VOUT and\nrelocated to this explicitly declared divider/input boundary.\u003c/p\u003e\n\u003cp\u003eRetain all 24 source MOS groups. The declared inputs retain upstream W/L/m with the reviewed geometry-grid adaptation. Other PMOS bodies use the VDD well;\nNMOS bodies and physical high-poly backplates use the VSS substrate contact.\nWell/substrate contacts must meet the native PDK rules. Preserve the declared\nMOS dimensions and total multiplicities; equivalent parallel\nfingering requires all physical and electrical checks to pass.\u003c/p\u003e\n\u003cp\u003eAll internal passives are physical DUT elements:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eThree parallel 42.685 × 42.685 um \u003ccode\u003ecap_cmim\u003c/code\u003e units: top \u003ccode\u003enet106\u003c/code\u003e, bottom VOUT;\napproximately 8.22 pF total, retaining the source's approximately 8.2 pF branch.\u003c/li\u003e\n\u003cli\u003eOne 51.64 × 51.64 um \u003ccode\u003ecap_cmim\u003c/code\u003e: top \u003ccode\u003enet10\u003c/code\u003e, bottom VOUT, approximately\n4 pF. This added physical local compensation closes the internal dynamic mode.\u003c/li\u003e\n\u003cli\u003eTwelve series \u003ccode\u003erhigh\u003c/code\u003e segments from VOUT to VFB and four from VFB to VSS,\neach W=1 um, L=17.465 um, b=0: approximately 300/100 kohm total.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eThere is no additional external output capacitor, but the compensation is\nreal output-connected storage. Do not delete or idealize any internal passive.\u003c/p\u003e\n14:T437,\u003cp\u003eLay out \u003ccode\u003eldo_001_analoggym_basic\u003c/code\u003e: a PMOS pass regulator with a folded\nPMOS-input error amplifier, cascoded bias branches, mirrored loads and an\nadditional PMOS/NMOS intermediate branch driving the pass-gate node \u003ccode\u003enet1\u003c/code\u003e.\nThe auxiliary PMOS source and body connect to \u003ccode\u003enet1\u003c/code\u003e; the input pair has a\nseparate source-tied \u003ccode\u003enet20\u003c/code\u003e well. Internal compensation connects \u003ccode\u003enet106\u003c/code\u003e\nto output and the 3:1 physical divider returns one quarter of output voltage.\nThis complete multistage error amplifier and its internal pass-gate drive\nare distinct from the simpler 5T and mirror-OTA regulator cases.\u003c/p\u003e\n\u003ch3\u003eOptimization objective\u003c/h3\u003e\n\u003cp\u003eMaximize the declared quality score within the solve budget while satisfying all physical and necessary functional requirements. The first passing DRC, LVS and required electrical checks establish a feasible baseline. Continue improving the scored metrics from that baseline; a passing check or \u003ccode\u003etask_success = true\u003c/code\u003e does not mean that the quality objectives have been achieved.\u003c/p\u003e\n15:Te8e,\u003cp\u003eThe loop/load testbench allows 1000 DC operating-point iterations (\u003ccode\u003eitl1=1000\u003c/code\u003e)\nfor both source and extracted simulations. Error tolerances and physical stimuli\nare unchanged; this is a convergence setting, not added circuit damping.\u003c/p\u003e\n\u003cp\u003eUse typical IHP LV MOS/MIM/poly models at 27 C. VDD is 1.2 or 1.3 V,\nVREF=0.225 V, and the external IB-to-VSS sink is 8 uA. The reference is\nexplicitly changed from the normalized source's 0.4 V: the 3:1 divider then\nhas a 0.9 V ideal output target, within the LV supply. The 8 uA bias and\nall original total MOS widths/lengths are retained. This is a bounded\nregulator core, not a precision reference, PVT or manufacturing-signoff task.\u003c/p\u003e\n\u003cp\u003eMain measurements cover both supplies and initial current loads 0.2/0.5 mA.\nAfter an operating point, the load doubles at 2–2.2 us, remains high for\n8 us, and returns at 10.2–10.4 us; the period is 16 us. Simulate 0–18 us\nwith KLU, Gear order 2, maximum step 1 ns, \u003ccode\u003ershunt=1e12\u003c/code\u003e, \u003ccode\u003ereltol=1e-5\u003c/code\u003e,\n\u003ccode\u003eabstol=1e-12\u003c/code\u003e and \u003ccode\u003evntol=1e-8\u003c/code\u003e. The numerical shunt is not a physical\nbias or startup device. Explicit \u003ccode\u003e.save\u003c/code\u003e lists retain all measured vectors;\nevery extracted circuit element still participates in the solve.\u003c/p\u003e\n\u003cp\u003eMeasure the bilateral return ratio at the actual divider/input boundary:\nfirst inject unit series AC voltage from SENSE to VFB, with zero parallel\ncurrent; then use zero series voltage and unit current into SENSE. With\nfirst-run \u003ccode\u003eb=-I(VPROBE)\u003c/code\u003e, \u003ccode\u003ed=V(SENSE)\u003c/code\u003e and second-run \u003ccode\u003ea=-I(VPROBE)\u003c/code\u003e,\n\u003ccode\u003ec=V(SENSE)\u003c/code\u003e, define \u003ccode\u003edelta=a*d-b*c\u003c/code\u003e and\n\u003ccode\u003eT=(2*delta-a+d)/(1-2*delta+a-d)\u003c/code\u003e (Tian et al., Eq. 30).\nBoth injections retain divider, input and reverse-path loading. Exported\nvoltages/currents permit an independent two-port admittance calculation.\nSweep 0.01 Hz–1 GHz at 300 points/decade, using continuous natural phase\nwithout an arbitrary low-frequency offset. Check first/final descending\nunity crossings, minimum sampled \u003ccode\u003eabs(1+T)\u003c/code\u003e, full sampled return-difference\nphase and maximum 200 MHz–1 GHz gain. This finite external-loop contract\nis not an exhaustive proof of all internal poles.\u003c/p\u003e\n\u003cp\u003eSweep load 0.2–1 mA in 10 uA steps at each supply. Downward VDD sweeps\n1.3–0.8 V in 1 mV steps at 0.2/1 mA measure the first 30 mV output-error\ncrossing. The line span uses both endpoints of 1.2–1.3 V. The regulation\nfloor includes amplifier headroom and is not a pass-resistance-only dropout\nrating. These DC sweeps do not extend dynamic stability to every intermediate\nsupply/load combination.\u003c/p\u003e\n\u003cp\u003eStartup uses \u003ccode\u003euic\u003c/code\u003e with supply, reference and bias ramping together from zero\nin 10 or 20 us. For both supplies, use 900/4500 ohm resistive loads (nominally\n1/0.2 mA at 0.9 V), maximum step 2 ns, and simulate to 50 us. This does not\nqualify arbitrary sequencing or a constant-current load imposed at zero supply.\nFaster 1 us startup and 20 ns current-load edges are outside qualification: they\nproduce excessive peaks in the same extracted circuit. The README provides\nrunnable failure probes. The maintained contract explicitly narrows the\ninitial development stimuli without relaxing the voltage-excursion bounds.\nLoads below 0.2 mA are outside the qualified dynamic range.\u003c/p\u003e\n\u003cp\u003eThe phase margins at the first and last crossings must both lie within [0, 180] degrees. Minimum return distance and return-phase excursion need only be nonnegative; high-frequency gain has no acceptance threshold. These full-sweep metrics affect continuous quality without adding stability acceptance conditions. Missing crossings or invalid observations are evaluation errors.\u003c/p\u003e\n16:T130a,\u003cp\u003eSoft solve budget: \u003cstrong\u003e3 hours\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eDiscover task/resources/feedback through \u003ccode\u003e/protocol/task.json\u003c/code\u003e (including its \u003ccode\u003eresources\u003c/code\u003e field) and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e. Use the supplied\nIHP primitives and KLayout/Magic/ngspice. Write \u003ccode\u003e/workspace/output/final.gds\u003c/code\u003e\nand explicitly submit via the harness protocol. Host configuration, source\nrecords and reference answers are excluded from standard solver inputs.\u003c/p\u003e\n\u003cp\u003eThe authoritative MOS input preserves the original logical groups, W/L/m and all four terminal nets. Verified unit arrays, multiple fingers, shared diffusion and shared wells on the same body net are allowed. Native LVS checks connectivity and equivalent device parameters; native DRC checks actual well/substrate contacts. Contact count, dimensions, area/perimeter and the reference well partition are not circuit constraints. PEX uses actual diffusion geometry and interconnect RC, with logical body nets as its boundary; distributed substrate/well resistance is outside this extraction model.\u003c/p\u003e\n\u003ch3\u003eSolve workflow\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eRead the declared circuit and materials, \u003ccode\u003e/protocol/task.json\u003c/code\u003e for paths, constraints and reviewed resources, and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e for capabilities and helper commands. Task inputs under \u003ccode\u003e/task\u003c/code\u003e and resources under \u003ccode\u003e/resources\u003c/code\u003e are read-only; construct the layout in \u003ccode\u003e/workspace\u003c/code\u003e with the declared tools. With layout MCP, paths and commands refer to the remote EDA workspace. Create your own implementation with real devices, interconnect and pins, using your own tool loop without delegating to other agents; reference layouts and author code are not solver inputs.\u003c/li\u003e\n\u003cli\u003eInspect \u003ccode\u003eresources.external\u003c/code\u003e before using external tools. Each command starts a fresh shell: when tool modules are declared, source \u003ccode\u003e/usr/share/Modules/init/bash\u003c/code\u003e and load the selected tool's modules; export its declared \u003ccode\u003etool_environment\u003c/code\u003e settings in that same command. Repeat as needed and use batch or headless operation. Local manuals, command references, and release notes may be available within the declared EDA installation and PDK resource directories. Locate these resources through \u003ccode\u003e/protocol/task.json\u003c/code\u003e and consult the documentation for the installed tool version when diagnosing unfamiliar syntax or tool failures.\u003c/li\u003e\n\u003cli\u003eGenerate an initial candidate and submit a snapshot early. When \u003ccode\u003eprocess-feedback\u003c/code\u003e is available, check the current GDS with layout MCP \u003ccode\u003echeck\u003c/code\u003e or \u003ccode\u003epython -I /protocol/process_check.py\u003c/code\u003e before the final submission. This runs the final evaluator's complete plan and returns engineering diagnostics and candidate measurements, without scores or normalized quality factors. Checks have no count limit and consume the same wall-clock budget. Inspect the physical and functional results and all scored metrics; successful tool execution alone does not establish requirement satisfaction. Read paginated diagnostics with \u003ccode\u003ereport\u003c/code\u003e when using MCP. Local exploratory checks do not replace this complete check.\u003c/li\u003e\n\u003cli\u003eUse the remaining time for measured improvements to the declared quality objectives. Identify the limiting scored metrics, make targeted layout changes, regenerate and check the candidate, and compare measurements with the previous candidate and the stated scoring targets and trade-offs. Preserve the best valid candidate and revert changes that worsen the overall objective. Repeat while time and useful improvements remain; passing validity checks alone is not a stopping condition.\u003c/li\u003e\n\u003cli\u003eStop optimization when the budget expires, all declared quality objectives are achieved, or measured trials support convergence. If stopping early, explain the changes tried, the metric comparisons and the remaining limitations. Track remaining time through session status. At soft-budget expiry, finish or cancel already-started work and submit immediately; do not start another command, check or optimization round. If an MCP execution is running, use \u003ccode\u003epoll\u003c/code\u003e with its \u003ccode\u003eexecution_id\u003c/code\u003e and the returned \u003ccode\u003enext_offset\u003c/code\u003e as \u003ccode\u003eoffset\u003c/code\u003e until completion, or cancel it and wait for it to stop.\u003c/li\u003e\n\u003cli\u003eFinish or cancel outstanding work, restore your best candidate to the declared output path, and explicitly submit it before ending the session. With layout MCP \u003ccode\u003esubmit\u003c/code\u003e, remove the \u003ccode\u003e/workspace/\u003c/code\u003e prefix from \u003ccode\u003eoutput.path\u003c/code\u003e; with the container interface, run \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e. Wait for the receipt: only the last accepted snapshot is judged, and writing a file alone is not submission. Acceptance confirms delivery; the framework independently evaluates validity and quality after the session.\u003c/li\u003e\n\u003c/ol\u003e\n6:[\"$\",\"$8\",null,{\"fallback\":[\"$\",\"p\",null,{\"children\":\"Loading published evidence…\"}],\"children\":[\"$\",\"$L10\",null,{\"task\":{\"case_path\":\"tasks/ihp-sg13g2/analog-db/cases/ldo_001_analoggym_basic/case.toml\",\"coefficient\":9,\"collection\":\"analog-db\",\"configuration_url\":\"/ICLayout-Bench/assets/8fc76d1f4eaeaccdaa1fe3e5ca08a99b5b5f84e9492b7c0a757dd10970369620.txt\",\"description_html\":\"$11\",\"description_path\":\"tasks/ihp-sg13g2/analog-db/cases/ldo_001_analoggym_basic/problem.md\",\"hours\":3,\"id\":\"ihp-sg13g2.analog-db.ldo_001_analoggym_basic\",\"inputs\":{\"description\":{\"format\":\"text\",\"path\":\"problem.md\",\"sha256\":\"3dbd775500a693fd929f2b9f4ac5375784f44d4c4d4c2bae6966c7de27b18af2\"},\"netlist\":{\"format\":\"spice\",\"path\":\"materials/circuit.cdl\",\"sha256\":\"46bc249c1f72b4d0162bce
