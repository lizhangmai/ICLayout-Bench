yles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L5\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[\"$L6\",[[\"$\",\"script\",\"script-0\",{\"src\":\"/ICLayout-Bench/_next/static/chunks/27jip_2vcvnd5.js\",\"async\":true,\"nonce\":\"$undefined\"}]],[\"$\",\"$L7\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.MetadataOutlet\",\"children\":\"$@9\"}]}]]}],{},null,false,null]},null,false,\"$a\"]},null,false,null],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Lb\",null,{\"children\":\"$Lc\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Ld\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.Metadata\",\"children\":\"$Le\"}]}]}],null]}],false]],\"m\":\"$undefined\",\"G\":[\"$f\",[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/ICLayout-Bench/_next/static/chunks/3sa54_ghi1h2h.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]]],\"S\":true,\"h\":null,\"r\":\"$undefined\",\"s\":\"$undefined\",\"a\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"2hqB741EA4j7xWQVg6hu-\"}\n10:I[1186,[\"/ICLayout-Bench/_next/static/chunks/2h60meymns2z5.js\",\"/ICLayout-Bench/_next/static/chunks/27jip_2vcvnd5.js\"],\"default\"]\na:C\n11:T5892,\u003ch1 id=\"problem-five-transistor-ota-with-bias-and-dummies-layout-task\"\u003eFive-Transistor OTA with Bias and Dummies Layout Task\u003c/h1\u003e\n\u003ch2 id=\"problem-objective\"\u003eObjective\u003c/h2\u003e\n\u003cp\u003eImplement \u003ccode\u003eota_5t\u003c/code\u003e in GF180MCU D, preserving the complete circuit and interface. Optimize area, DC/AC performance, follower dynamics, intrinsic noise and immunity to the declared substrate and well current disturbances. Choose the physical implementation using measured feedback.\u003c/p\u003e\n\u003ch3 id=\"problem-optimization-objective\"\u003eOptimization objective\u003c/h3\u003e\n\u003cp\u003eMaximize the declared quality score within the solve budget while satisfying all physical and necessary functional requirements. The first passing DRC, LVS and required electrical checks establish a feasible baseline. Continue improving the scored metrics from that baseline; a passing check or \u003ccode\u003etask_success = true\u003c/code\u003e does not mean that the quality objectives have been achieved.\u003c/p\u003e\n\u003ch2 id=\"problem-inputs-and-interface\"\u003eInputs and Interface\u003c/h2\u003e\n\u003cp\u003eThe authoritative circuit is \u003ccode\u003ematerials/circuit.spice\u003c/code\u003e. Declared fixtures are \u003ccode\u003eanalysis.spice\u003c/code\u003e, \u003ccode\u003edc.spice\u003c/code\u003e, \u003ccode\u003etransient.spice\u003c/code\u003e, \u003ccode\u003elinearity.spice\u003c/code\u003e and \u003ccode\u003esubstrate_noise.spice\u003c/code\u003e under \u003ccode\u003ematerials/\u003c/code\u003e, together with the five \u003ccode\u003emodels_tt/ff/ss/fs/sf.spice\u003c/code\u003e selectors. Native PDK cards remain in the reviewed process resources.\nOrdered subcircuit and GDS interface: \u003ccode\u003evdd, out, in_p, in_n, i_bias, vss\u003c/code\u003e. The ports denote supply, output, positive input, negative input, bias-current input and return, respectively.\u003c/p\u003e\n\u003cp\u003ePreserve topology, source models, total device widths, channel lengths, multiplicities and body connections. Equivalent hierarchy, diffusion sharing and parallel fingers are allowed. Retain every dummy device even when all its terminals share one net. Do not idealize internal devices.\u003c/p\u003e\n\u003ch2 id=\"problem-operating-conditions\"\u003eOperating Conditions\u003c/h2\u003e\n\u003cp\u003eUse 10 uA bias current from VDD into i_bias and input common mode 1.65 V throughout. Statistical parameter variation is disabled. The nominal condition is TT, 3.3 V, 27 C. External output loads are 0.1, 1 and 5 pF. AC/noise tests use all three nominal loads and six additional 1 pF conditions: FF, SS, FS and SF at 3.3 V/27 C, TT at 3.0 V/-40 C, and TT at 3.3 V/125 C. DC range tests use the seven distinct process/voltage/temperature combinations at 1 pF. Step and sine tests use the three nominal loads. This is a representative condition set, not a full PVT product or analog worst-case guarantee.\u003c/p\u003e\n\u003cp\u003eFor open-loop tests, an external output clamp nulls its DC current by bisecting the symmetric differential input over +/-0.2 V, preserving the exact input common mode. After 24 iterations, require less than 100 pA residual clamp current, freeze the correction, and release the clamp to 1 fS conductance before AC/noise analysis. The free output must remain within 1 mV of 1.65 V. This is a measurement instrument outside the DUT. Sweep 10 Hz–1 GHz at 80 points/decade. Measure differential gain at 10 Hz, first falling differential unity crossing, signed/absolute input offset, complete supply power, CMRR and input-referred PSRR+/- at 10 Hz and 100 kHz. Common-mode excitation moves both inputs together; supply excitations hold the absolute input common mode fixed and apply AC to VDD or VSS independently. The ideal bias current source has no AC current. For follower loop gain, the declared E/V/F feedback probe preserves input-current loading while opening the voltage feedback path in AC; the DC loop remains closed. Phase margin is 180 degrees plus unwrapped loop phase at its first falling unity crossing. Native noise uses SPARSE and integrates input-equivalent noise from 10 Hz to 100 kHz, with physical RC resistor noise retained.\u003c/p\u003e\n\u003cp\u003eFor DC range tests, scan 0.30–3.00 V in 50 mV steps, independently varying input common mode at fixed output 1.65 V and output target at fixed common mode 1.65 V. At each point, an external ideal voltage clamp holds the output target. Use a bracketed secant search over +/-0.2 V, with midpoint fallback and at most 24 iterations, to null clamp current. Local differential gain is the negative ratio of clamp-current sensitivity to differential input and to output voltage, so the clamp is only a measurement instrument. A usable sampled point requires gain \u0026gt;=20 dB, residual clamp current \u0026lt;100 pA, differential correction magnitude \u0026lt;0.2 V, and driven terminals within supply rails. Report the contiguous sampled interval containing 1.65 V. These spans are defined by this gain criterion and grid, not continuous rail-to-rail specifications.\u003c/p\u003e\n\u003cp\u003eIn unity feedback, apply a 20 mV step and a 0.5 V step centred on 1.65 V, with rising/falling edges at 0.5/1.5 us and 100 ps transition time. Simulate to 2.5 us with maximum 50 ps step. Small-step settling is the last out-of-band sample after the edge, relative to the response's own final plateau and actual output step amplitude. Record 1% and 0.1% bands, both directions, with a 750 ns recovery window and final 50 ns hold check. Static tracking error is recorded separately. Large-step slew rate is 60% of the actual output excursion divided by its 20%–80% crossing interval, independently on each edge.\u003c/p\u003e\n\u003cp\u003eThe sine test uses 100 mV input amplitude at 1 MHz, runs for 15 us with maximum 0.5 ns step, and integrates harmonic quadratures over the last five complete periods. Report fundamental amplitude and THD from harmonics 2–10. Its scored linearity error is \u003ccode\u003e(sqrt(sum(A_k^2,k=2..10)) + max(0,80mV-A_1))/100mV\u003c/code\u003e: an 80 mV desired output-amplitude floor penalizes severe attenuation continuously instead of rewarding a vanishing output for low THD. This floor is a soft quality objective.\u003c/p\u003e\n\u003ch3 id=\"problem-substrate-and-well-interference\"\u003eSubstrate and well interference\u003c/h3\u003e\n\u003cp\u003eUse unity feedback, 10 uA bias, a DC input of 1.65 V and 1 pF load. There is no intended AC input. In eight independent experiments, inject a zero-DC, \u003cstrong\u003e100 uA AC\u003c/strong\u003e current over \u003cstrong\u003e1 kHz–1 MHz\u003c/strong\u003e at four logarithmic intervals per decade, and measure the largest sampled output-voltage amplitude. Retain the 1 kHz amplitude as a diagnostic and export the complete sampled response. This is a linear small-signal normalization; it does not assert a finite-amplitude transient response.\u003c/p\u003e\n\u003cp\u003eRegister the centre of the candidate's complete functional bounding box at (0,0), without changing orientation or dimensions. The physical integration window is 32 by 40 um. The four P-substrate experiments distribute the total current uniformly over separate 1 by 1 um squares centred at (-22,0), (22,0), (0,-26) and (0,26) um. These positions remain outside the integration window.\u003c/p\u003e\n\u003cp\u003eFor each connected N-well containing a transistor body, form its west, east, south and north boundary strips: intersect the actual well with the corresponding 1 um-wide strip inside its bounding box. Each N-well experiment distributes \u003cstrong\u003e100 uA total\u003c/strong\u003e uniformly over the union of all active wells' strips in one direction. Unused wells do not dilute this current. The excitation therefore remains defined when wells move, resize or split. The P-substrate and N-well metrics separately retain their worst of four directions.\u003c/p\u003e\n\u003ch3 id=\"problem-declared-physical-model\"\u003eDeclared physical model\u003c/h3\u003e\n\u003cp\u003eThe interference branch extracts primitive MOS devices, their actual channel footprints, body contacts, and supply-connected Metal1–Metal5 and vias from the frozen candidate. A reciprocal finite-volume model uses separate projected P-substrate and N-well sheets, with insulating PN boundaries. Nominal sheet resistances are 3250 and 1000 ohm/square; same-polarity P+/N+ diffusion contributes 7/6.3 ohm/square in parallel locally, with ideal vertical ohmic coupling. Actual 0.22 um contact cuts contribute 5.2/6.3 ohm each. Metal1–Metal4 use 0.09 ohm/square, Metal5 0.04, and 0.26 um vias 4.5 ohm each. These coefficients and layer bindings are in the reviewed \u003ccode\u003esubstrate\u003c/code\u003e resource.\u003c/p\u003e\n\u003cp\u003eThe external return environment is fixed: a P+ diffusion/Metal1 square perimeter at +/-40 um, 1 um band width, with 0.22 um contacts at 2 um pitch. Only its west Metal1 window x=[-40,-39], y=[-0.5,0.5] um is clamped to zero AC voltage. Candidate supply pins use a 0.1 by 0.1 um zero-AC-voltage access window on their actual metal. The numerical domain is [-64,64] um in both axes, with no current through its outer edges. Material-aligned 0.125 and 0.0625 um local meshes must converge within 3% by the maximum response of each multiport column. The return environment and test currents are evaluator fixtures and do not count toward candidate area.\u003c/p\u003e\n\u003cp\u003eBody voltages are channel-area averages. The extracted passive multiport is coupled to every native MOS body, including compact-model body-current loading; native device parameters and all other connections are retained. This branch assumes ideal signal interconnect. All ordinary DC/AC/noise and follower tests use a separate distributed interconnect-RC extraction. The source interference anchor has ideal equipotential bodies and zero output disturbance under the same external fixture.\u003c/p\u003e\n\u003cp\u003eThe model measures immunity within this explicit projected-sheet approximation. It does not model vertical/backside transport, depletion coupling, carrier collection, latch-up, mismatch yield, statistical device noise, RF/EM or full-chip density. It is not a silicon-calibrated isolation prediction.\u003c/p\u003e\n\u003ch2 id=\"problem-physical-requirements\"\u003ePhysical Requirements\u003c/h2\u003e\n\u003cp\u003eSubmit a nonempty GDS with top cell \u003ccode\u003eota_5t\u003c/code\u003e, at most 10485760 bytes, and 0.001 um database unit. The complete functional bounding box must fit \u003cstrong\u003e32 by 40 um\u003c/strong\u003e. It includes devices, implants/wells, contacts, vias, dummy routing and interconnect on:\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003e[[5,0],[11,17],[11,39],[12,0],[13,17],[21,0],[22,0],[22,4],[24,0],[24,5],[30,0],[30,4],[31,0],[32,0],[33,0],[34,0],[34,3],[34,4],[34,5],[35,0],[36,0],[36,3],[36,4],[36,5],[37,0],[38,0],[40,0],[41,0],[42,0],[42,3],[42,4],[42,5],[46,0],[46,3],[46,4],[46,5],[49,0],[53,0],[53,3],[53,4],[53,5],[55,0],[62,0],[75,0],[80,5],[81,0],[81,3],[81,4],[81,5],[82,0],[86,17],[88,17],[96,1],[100,5],[100,7],[100,8],[108,5],[110,5],[110,11],[110,12],[110,13],[110,14],[110,15],[110,16],[111,5],[112,1],[115,5],[116,5],[117,5],[117,10],[118,5],[119,5],[122,5],[123,5],[124,5],[125,5],[127,5],[128,17],[137,5],[151,5],[152,5],[153,51],[166,5],[167,5],[173,5],[178,0],[183,0],[184,0],[185,0],[204,0],[210,0],[220,0],[226,0],[227,0],[241,0]]\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eText and nonfunctional boundary layers 0/0 and 63/0 do not count as area. Functional geometry must remain on its process layers. The projected conducting boundaries must be Manhattan. Pass the fixed GF180 D FEOL, BEOL, connectivity, grid and antenna checks without waivers. Use five metal layers, 1.1 um top metal and the 1 kOhm/square poly option. Chip density and seal-ring closure belong to higher-level integration.\u003c/p\u003e\n\u003cp\u003eLVS checks topology, dimensions, body terminals and all named top-level ports, case-insensitively. Use exactly one external power-pin label for each of vdd and vss, with its stated metal access window. Implement the supplied electrical body connections physically. Native extraction retains salicide continuity: abutting opposite implants can be ohmically connected even without a metal strap. Use separated opposite-implant diffusion; butted taps are outside the declared projected-sheet model. Missing ports, disconnected bodies or incomplete extraction cannot establish success.\u003c/p\u003e\n\u003ch2 id=\"problem-electrical-requirements-and-scoring\"\u003eElectrical Requirements and Scoring\u003c/h2\u003e\n\u003cp\u003eArtifact, geometry, DRC, LVS, both extraction branches and every declared functional requirement must pass. A completed candidate rejection scores zero; infrastructure errors leave the score unknown. Every measurement, including zero-weight diagnostics, must be complete and valid.\u003c/p\u003e\n\u003cp\u003eEach electrical observation is paired with the same-condition frozen source fixture. For a metric, normalize each pair first and retain its worst quality. Credit is c=min(1,q); the score is 100 times the product of each credit raised to its weight. Improvements beyond a target cannot compensate for another unmet objective. The weights sum to one; feasible layouts can score below 100.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003cth\u003eDefinition and quality rule\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.25\u003c/td\u003e\n\u003ctd\u003eComplete functional area; q=240/area\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003egain\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.01\u003c/td\u003e\n\u003ctd\u003e10 Hz differential gain; db20 source retention\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoffset\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.01\u003c/td\u003e\n\u003ctd\u003eAbsolute DC servo correction; saturating ratio, s=1 mV\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eicmr\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.025\u003c/td\u003e\n\u003ctd\u003eSampled input-common-mode span; degradation budget 0.1 V\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_swing\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.025\u003c/td\u003e\n\u003ctd\u003eSampled output span; degradation budget 0.1 V\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eunity\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.18\u003c/td\u003e\n\u003ctd\u003eFirst falling differential unity frequency; source ratio\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ephase_margin\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.07\u003c/td\u003e\n\u003ctd\u003eFollower loop margin; 60 degree quality target, 10 degree degradation budget\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003esettling\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.15\u003c/td\u003e\n\u003ctd\u003eWorst paired 0.1% small-step settling; inverse source ratio with 50 ps floor\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eslew\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.08\u003c/td\u003e\n\u003ctd\u003e20%–80% large-step slew rate, both directions; source ratio\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003elinearity\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.02\u003c/td\u003e\n\u003ctd\u003eHarmonic and amplitude-shortfall error defined above; saturating ratio, s=0.001\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ecmrr\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.02\u003c/td\u003e\n\u003ctd\u003eCMRR at 10 Hz and 100 kHz; db20 source retention\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epsrr\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.02\u003c/td\u003e\n\u003ctd\u003ePSRR+/- at both frequencies; db20 source retention\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003einput_noise\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.01\u003c/td\u003e\n\u003ctd\u003e10 Hz–100 kHz input RMS noise; inverse source ratio, 1 nV floor\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003esupply\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.03\u003c/td\u003e\n\u003ctd\u003eComplete no-signal supply power; inverse source ratio, 1 pW floor\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epsub_interference_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.05\u003c/td\u003e\n\u003ctd\u003eWorst direction/frequency P-substrate amplitude; saturating ratio, s=5 uV\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ewell_interference_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.05\u003c/td\u003e\n\u003ctd\u003eWorst direction/frequency N-well amplitude; saturating ratio, s=5 uV\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_bias\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0\u003c/td\u003e\n\u003ctd\u003eServoed output; target retention, 1 mV scale; zero weight\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eFor observed value x, source value b and scale s, maximizing ratio is (x+s)/(b+s), minimizing ratio is its inverse; db20 is 10^((x-b)/20); minimizing saturating ratio is 2*(b+s)/(b+x+2*s). A degradation budget gives q=s/(s+max(0,b-x)) for maximization. Phase margin uses 60 degrees in place of b; output-bias quality is 1/(1+abs(x-b)/s). All individual credits are capped at one. Each metric retains the worst normalized condition, so extra directions, loads and corners do not increase its total weight.\u003c/p\u003e\n\u003cp\u003eMagnitude/time/span/power measurements must be nonnegative; unity crossings must exist. The calibrated open-loop output must be within 1 mV of 1.65 V, and phase margin must be nonnegative. Each step must give a nonnegative follower gain. A final 50 ns hold flag diagnoses recovery outside the 0.1% band; an unfinished recovery retains its window-limited settling observation and is penalized continuously, rather than rejected for precision alone. The 60 degree margin and all precision/speed goals remain soft. No random-mismatch, spatial-gradient or silicon-isolation yield is claimed.\u003c/p\u003e\n\u003cp\u003eThe 240 um2 area goal budgets approximately 10 by 24 um for 32 three-micron finger-width equivalents including bias and dummies, contacted gate pitch, diffusion segmentation, poly-contact access, implants/wells, body access and routing. It is an integration estimate, not a demonstrated optimum; the permitted window remains 32 by 40 um. Retention targets use the fixed circuit's own performance, including its intrinsic systematic offset, rather than specifications from another OTA. The 0.1 V range budget is two DC grid steps; 50 ps is the transient resolution; the 0.001 linearity scale allocates 0.1 mV harmonic/attenuation error per 100 mV input.\u003c/p\u003e\n\u003cp\u003eFor this standardized 100 uA small-signal test, the quality scale is 5 uV: with a zero source anchor, q=10 uV/(10 uV+Vnoise), giving q=0.5 at 10 uV in either domain. This engineering scale uses half of 20 mV x 0.1% as a per-domain comparison level; it is not a hard accuracy specification, a calibrated digital-neighbor noise budget, or a claim about the sum of the two independent experiments. The domains retain positive, equal weights: together 10% (5% each), alongside area 25%, DC 7%, AC 25%, transient/linearity 25%, rejection/intrinsic noise 5% and power 3%. Actual extracted electrical responses assess body contacts, return routes and isolation structures; no specific ring pattern or contact count earns points. Gain, deterministic offset and intrinsic noise retain 1% each as source-performance retention objectives: under the fixed circuit and declared deterministic RC model, these have limited layout sensitivity. Area and routing-dependent frequency response, stability, settling and slew receive the main weights. The simplified projected-sheet immunity tests remain secondary quality objectives: each body domain retains a positive weight, while their limited physical scope is reflected in the 10% combined allocation. Static power retains 3% because the circuit and device dimensions are fixed. The capability coefficient remains 4.\u003c/p\u003e\n\u003ch2 id=\"problem-tools-and-submission\"\u003eTools and Submission\u003c/h2\u003e\n\u003cp\u003eSoft solve budget: \u003cstrong\u003e1 hour\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eRead \u003ccode\u003e/protocol/task.json\u003c/code\u003e for paths, constraints and reviewed resources, and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e for the complete check and submission interfaces. Source simulation assists design; process feedback runs the declared candidate evaluation. Write \u003ccode\u003e/workspace/output/final.gds\u003c/code\u003e and explicitly submit through the runtime protocol. The final evaluator judges the frozen snapshot.\u003c/p\u003e\n\u003ch3 id=\"problem-solve-workflow\"\u003eSolve workflow\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eRead the declared circuit and materials, \u003ccode\u003e/protocol/task.json\u003c/code\u003e for paths, constraints and reviewed resources, and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e for capabilities and helper commands. Task inputs under \u003ccode\u003e/task\u003c/code\u003e and resources under \u003ccode\u003e/resources\u003c/code\u003e are read-only; construct the layout in \u003ccode\u003e/workspace\u003c/code\u003e with the declared tools. With layout MCP, paths and commands refer to the remote EDA workspace. Create your own implementation with real devices, interconnect and pins, using your own tool loop without delegating to other agents; reference layouts and author code are not solver inputs.\u003c/li\u003e\n\u003cli\u003eInspect \u003ccode\u003eresources.external\u003c/code\u003e before using external tools. Each command starts a fresh shell: when tool modules are declared, source \u003ccode\u003e/usr/share/Modules/init/bash\u003c/code\u003e and load the selected tool's modules; export its declared \u003ccode\u003etool_environment\u003c/code\u003e settings in that same command. Repeat as needed and use batch or headless operation. Local manuals, command references, and release notes may be available within the declared EDA installation and PDK resource directories. Locate these resources through \u003ccode\u003e/protocol/task.json\u003c/code\u003e and consult the documentation for the installed tool version when diagnosing unfamiliar syntax or tool failures.\u003c/li\u003e\n\u003cli\u003eGenerate an initial candidate and submit a snapshot early. When \u003ccode\u003eprocess-feedback\u003c/code\u003e is available, check the current GDS with layout MCP \u003ccode\u003echeck\u003c/code\u003e or \u003ccode\u003epython -I /protocol/process_check.py\u003c/code\u003e before the final submission. This runs the final evaluator's complete plan and returns engineering diagnostics and candidate measurements, without scores or normalized quality factors. Checks have no count limit and consume the same wall-clock budget. Inspect the physical and functional results and all scored metrics; successful tool execution alone does not establish requirement satisfaction. Read paginated diagnostics with \u003ccode\u003ereport\u003c/code\u003e when using MCP. Local exploratory checks do not replace this complete check.\u003c/li\u003e\n\u003cli\u003eUse the remaining time for measured improvements to the declared quality objectives. Identify the limiting scored metrics, make targeted layout changes, regenerate and check the candidate, and compare measurements with the previous candidate and the stated scoring targets and trade-offs. Preserve the best valid candidate and revert changes that worsen the overall objective. Repeat while time and useful improvements remain; passing validity checks alone is not a stopping condition.\u003c/li\u003e\n\u003cli\u003eStop optimization when the budget expires, all declared quality objectives are achieved, or measured trials support convergence. If stopping early, explain the changes tried, the metric comparisons and the remaining limitations. Track remaining time through session status. At soft-budget expiry, finish or cancel already-started work and submit immediately; do not start another command, check or optimization round. If an MCP execution is running, use \u003ccode\u003epoll\u003c/code\u003e with its \u003ccode\u003eexecution_id\u003c/code\u003e and the returned \u003ccode\u003enext_offset\u003c/code\u003e as \u003ccode\u003eoffset\u003c/code\u003e until completion, or cancel it and wait for it to stop.\u003c/li\u003e\n\u003cli\u003eFinish or cancel outstanding work, restore your best candidate to the declared output path, and explicitly submit it before ending the session. With layout MCP \u003ccode\u003esubmit\u003c/code\u003e, remove the \u003ccode\u003e/workspace/\u003c/code\u003e prefix from \u003ccode\u003eoutput.path\u003c/code\u003e; with the container interface, run \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e. Wait for the receipt: only the last accepted snapshot is judged, and writing a file alone is not submission. Acceptance confirms delivery; the framework independently evaluates validity and quality after the session.\u003c/li\u003e\n\u003c/ol\u003e\n12:T198b,\u003cp\u003eArtifact, geometry, DRC, LVS, both extraction branches and every declared functional requirement must pass. A completed candidate rejection scores zero; infrastructure errors leave the score unknown. Every measurement, including zero-weight diagnostics, must be complete and valid.\u003c/p\u003e\n\u003cp\u003eEach electrical observation is paired with the same-condition frozen source fixture. For a metric, normalize each pair first and retain its worst quality. Credit is c=min(1,q); the score is 100 times the product of each credit raised to its weight. Improvements beyond a target cannot compensate for another unmet objective. The weights sum to one; feasible layouts can score below 100.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003cth\u003eDefinition and quality rule\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.25\u003c/td\u003e\n\u003ctd\u003eComplete functional area; q=240/area\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003egain\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.01\u003c/td\u003e\n\u003ctd\u003e10 Hz differential gain; db20 source retention\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoffset\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.01\u003c/td\u003e\n\u003ctd\u003eAbsolute DC servo correction; saturating ratio, s=1 mV\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eicmr\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.025\u003c/td\u003e\n\u003ctd\u003eSampled input-common-mode span; degradation budget 0.1 V\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_swing\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.025\u003c/td\u003e\n\u003ctd\u003eSampled output span; degradation budget 0.1 V\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eunity\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.18\u003c/td\u003e\n\u003ctd\u003eFirst falling differential unity frequency; source ratio\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ephase_margin\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.07\u003c/td\u003e\n\u003ctd\u003eFollower loop margin; 60 degree quality target, 10 degree degradation budget\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003esettling\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.15\u003c/td\u003e\n\u003ctd\u003eWorst paired 0.1% small-step settling; inverse source ratio with 50 ps floor\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eslew\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.08\u003c/td\u003e\n\u003ctd\u003e20%–80% large-step slew rate, both directions; source ratio\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003elinearity\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.02\u003c/td\u003e\n\u003ctd\u003eHarmonic and amplitude-shortfall error defined above; saturating ratio, s=0.001\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ecmrr\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.02\u003c/td\u003e\n\u003ctd\u003eCMRR at 10 Hz and 100 kHz; db20 source retention\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epsrr\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.02\u003c/td\u003e\n\u003ctd\u003ePSRR+/- at both frequencies; db20 source retention\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003einput_noise\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.01\u003c/td\u003e\n\u003ctd\u003e10 Hz–100 kHz input RMS noise; inverse source ratio, 1 nV floor\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003esupply\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.03\u003c/td\u003e\n\u003ctd\u003eComplete no-signal supply power; inverse source ratio, 1 pW floor\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epsub_interference_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.05\u003c/td\u003e\n\u003ctd\u003eWorst direction/frequency P-substrate amplitude; saturating ratio, s=5 uV\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ewell_interference_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.05\u003c/td\u003e\n\u003ctd\u003eWorst direction/frequency N-well amplitude; saturating ratio, s=5 uV\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_bias\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0\u003c/td\u003e\n\u003ctd\u003eServoed output; target retention, 1 mV scale; zero weight\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eFor observed value x, source value b and scale s, maximizing ratio is (x+s)/(b+s), minimizing ratio is its inverse; db20 is 10^((x-b)/20); minimizing saturating ratio is 2*(b+s)/(b+x+2*s). A degradation budget gives q=s/(s+max(0,b-x)) for maximization. Phase margin uses 60 degrees in place of b; output-bias quality is 1/(1+abs(x-b)/s). All individual credits are capped at one. Each metric retains the worst normalized condition, so extra directions, loads and corners do not increase its total weight.\u003c/p\u003e\n\u003cp\u003eMagnitude/time/span/power measurements must be nonnegative; unity crossings must exist. The calibrated open-loop output must be within 1 mV of 1.65 V, and phase margin must be nonnegative. Each step must give a nonnegative follower gain. A final 50 ns hold flag diagnoses recovery outside the 0.1% band; an unfinished recovery retains its window-limited settling observation and is penalized continuously, rather than rejected for precision alone. The 60 degree margin and all precision/speed goals remain soft. No random-mismatch, spatial-gradient or silicon-isolation yield is claimed.\u003c/p\u003e\n\u003cp\u003eThe 240 um2 area goal budgets approximately 10 by 24 um for 32 three-micron finger-width equivalents including bias and dummies, contacted gate pitch, diffusion segmentation, poly-contact access, implants/wells, body access and routing. It is an integration estimate, not a demonstrated optimum; the permitted window remains 32 by 40 um. Retention targets use the fixed circuit's own performance, including its intrinsic systematic offset, rather than specifications from another OTA. The 0.1 V range budget is two DC grid steps; 50 ps is the transient resolution; the 0.001 linearity scale allocates 0.1 mV harmonic/attenuation error per 100 mV input.\u003c/p\u003e\n\u003cp\u003eFor this standardized 100 uA small-signal test, the quality scale is 5 uV: with a zero source anchor, q=10 uV/(10 uV+Vnoise), giving q=0.5 at 10 uV in either domain. This engineering scale uses half of 20 mV x 0.1% as a per-domain comparison level; it is not a hard accuracy specification, a calibrated digital-neighbor noise budget, or a claim about the sum of the two independent experiments. The domains retain positive, equal weights: together 10% (5% each), alongside area 25%, DC 7%, AC 25%, transient/linearity 25%, rejection/intrinsic noise 5% and power 3%. Actual extracted electrical responses assess body contacts, return routes and isolation structures; no specific ring pattern or contact count earns points. Gain, deterministic offset and intrinsic noise retain 1% each as source-performance retention objectives: under the fixed circuit and declared deterministic RC model, these have limited layout sensitivity. Area and routing-dependent frequency response, stability, settling and slew receive the main weights. The simplified projected-sheet immunity tests remain secondary quality objectives: each body domain retains a positive weight, while their limited physical scope is reflected in the 10% combined allocation. Static power retains 3% because the circuit and device dimensions are fixed. The capability coefficient remains 4.\u003c/p\u003e\n13:T1d69,\u003cp\u003eUse 10 uA bias current from VDD into i_bias and input common mode 1.65 V throughout. Statistical parameter variation is disabled. The nominal condition is TT, 3.3 V, 27 C. External output loads are 0.1, 1 and 5 pF. AC/noise tests use all three nominal loads and six additional 1 pF conditions: FF, SS, FS and SF at 3.3 V/27 C, TT at 3.0 V/-40 C, and TT at 3.3 V/125 C. DC range tests use the seven distinct process/voltage/temperature combinations at 1 pF. Step and sine tests use the three nominal loads. This is a representative condition set, not a full PVT product or analog worst-case guarantee.\u003c/p\u003e\n\u003cp\u003eFor open-loop tests, an external output clamp nulls its DC current by bisecting the symmetric differential input over +/-0.2 V, preserving the exact input common mode. After 24 iterations, require less than 100 pA residual clamp current, freeze the correction, and release the clamp to 1 fS conductance before AC/noise analysis. The free output must remain within 1 mV of 1.65 V. This is a measurement instrument outside the DUT. Sweep 10 Hz–1 GHz at 80 points/decade. Measure differential gain at 10 Hz, first falling differential unity crossing, signed/absolute input offset, complete supply power, CMRR and input-referred PSRR+/- at 10 Hz and 100 kHz. Common-mode excitation moves both inputs together; supply excitations hold the absolute input common mode fixed and apply AC to VDD or VSS independently. The ideal bias current source has no AC current. For follower loop gain, the declared E/V/F feedback probe preserves input-current loading while opening the voltage feedback path in AC; the DC loop remains closed. Phase margin is 180 degrees plus unwrapped loop phase at its first falling unity crossing. Native noise uses SPARSE and integrates input-equivalent noise from 10 Hz to 100 kHz, with physical RC resistor noise retained.\u003c/p\u003e\n\u003cp\u003eFor DC range tests, scan 0.30–3.00 V in 50 mV steps, independently varying input common mode at fixed output 1.65 V and output target at fixed common mode 1.65 V. At each point, an external ideal voltage clamp holds the output target. Use a bracketed secant search over +/-0.2 V, with midpoint fallback and at most 24 iterations, to null clamp current. Local differential gain is the negative ratio of clamp-current sensitivity to differential input and to output voltage, so the clamp is only a measurement instrument. A usable sampled point requires gain \u0026gt;=20 dB, residual clamp current \u0026lt;100 pA, differential correction magnitude \u0026lt;0.2 V, and driven terminals within supply rails. Report the contiguous sampled interval containing 1.65 V. These spans are defined by this gain criterion and grid, not continuous rail-to-rail specifications.\u003c/p\u003e\n\u003cp\u003eIn unity feedback, apply a 20 mV step and a 0.5 V step centred on 1.65 V, with rising/falling edges at 0.5/1.5 us and 100 ps transition time. Simulate to 2.5 us with maximum 50 ps step. Small-step settling is the last out-of-band sample after the edge, relative to the response's own final plateau and actual output step amplitude. Record 1% and 0.1% bands, both directions, with a 750 ns recovery window and final 50 ns hold check. Static tracking error is recorded separately. Large-step slew rate is 60% of the actual output excursion divided by its 20%–80% crossing interval, independently on each edge.\u003c/p\u003e\n\u003cp\u003eThe sine test uses 100 mV input amplitude at 1 MHz, runs for 15 us with maximum 0.5 ns step, and integrates harmonic quadratures over the last five complete periods. Report fundamental amplitude and THD from harmonics 2–10. Its scored linearity error is \u003ccode\u003e(sqrt(sum(A_k^2,k=2..10)) + max(0,80mV-A_1))/100mV\u003c/code\u003e: an 80 mV desired output-amplitude floor penalizes severe attenuation continuously instead of rewarding a vanishing output for low THD. This floor is a soft quality objective.\u003c/p\u003e\n\u003ch3\u003eSubstrate and well interference\u003c/h3\u003e\n\u003cp\u003eUse unity feedback, 10 uA bias, a DC input of 1.65 V and 1 pF load. There is no intended AC input. In eight independent experiments, inject a zero-DC, \u003cstrong\u003e100 uA AC\u003c/strong\u003e current over \u003cstrong\u003e1 kHz–1 MHz\u003c/strong\u003e at four logarithmic intervals per decade, and measure the largest sampled output-voltage amplitude. Retain the 1 kHz amplitude as a diagnostic and export the complete sampled response. This is a linear small-signal normalization; it does not assert a finite-amplitude transient response.\u003c/p\u003e\n\u003cp\u003eRegister the centre of the candidate's complete functional bounding box at (0,0), without changing orientation or dimensions. The physical integration window is 32 by 40 um. The four P-substrate experiments distribute the total current uniformly over separate 1 by 1 um squares centred at (-22,0), (22,0), (0,-26) and (0,26) um. These positions remain outside the integration window.\u003c/p\u003e\n\u003cp\u003eFor each connected N-well containing a transistor body, form its west, east, south and north boundary strips: intersect the actual well with the corresponding 1 um-wide strip inside its bounding box. Each N-well experiment distributes \u003cstrong\u003e100 uA total\u003c/strong\u003e uniformly over the union of all active wells' strips in one direction. Unused wells do not dilute this current. The excitation therefore remains defined when wells move, resize or split. The P-substrate and N-well metrics separately retain their worst of four directions.\u003c/p\u003e\n\u003ch3\u003eDeclared physical model\u003c/h3\u003e\n\u003cp\u003eThe interference branch extracts primitive MOS devices, their actual channel footprints, body contacts, and supply-connected Metal1–Metal5 and vias from the frozen candidate. A reciprocal finite-volume model uses separate projected P-substrate and N-well sheets, with insulating PN boundaries. Nominal sheet resistances are 3250 and 1000 ohm/square; same-polarity P+/N+ diffusion contributes 7/6.3 ohm/square in parallel locally, with ideal vertical ohmic coupling. Actual 0.22 um contact cuts contribute 5.2/6.3 ohm each. Metal1–Metal4 use 0.09 ohm/square, Metal5 0.04, and 0.26 um vias 4.5 ohm each. These coefficients and layer bindings are in the reviewed \u003ccode\u003esubstrate\u003c/code\u003e resource.\u003c/p\u003e\n\u003cp\u003eThe external return environment is fixed: a P+ diffusion/Metal1 square perimeter at +/-40 um, 1 um band width, with 0.22 um contacts at 2 um pitch. Only its west Metal1 window x=[-40,-39], y=[-0.5,0.5] um is clamped to zero AC voltage. Candidate supply pins use a 0.1 by 0.1 um zero-AC-voltage access window on their actual metal. The numerical domain is [-64,64] um in both axes, with no current through its outer edges. Material-aligned 0.125 and 0.0625 um local meshes must converge within 3% by the maximum response of each multiport column. The return environment and test currents are evaluator fixtures and do not count toward candidate area.\u003c/p\u003e\n\u003cp\u003eBody voltages are channel-area averages. The extracted passive multiport is coupled to every native MOS body, including compact-model body-current loading; native device parameters and all other connections are retained. This branch assumes ideal signal interconnect. All ordinary DC/AC/noise and follower tests use a separate distributed interconnect-RC extraction. The source interference anchor has ideal equipotential bodies and zero output disturbance under the same external fixture.\u003c/p\u003e\n\u003cp\u003eThe model measures immunity within this explicit projected-sheet approximation. It does not model vertical/backside transport, depletion coupling, carrier collection, latch-up, mismatch yield, statistical device noise, RF/EM or full-chip density. It is not a silicon-calibrated isolation prediction.\u003c/p\u003e\n14:T7f7,\u003cp\u003eSubmit a nonempty GDS with top cell \u003ccode\u003eota_5t\u003c/code\u003e, at most 10485760 bytes, and 0.001 um database unit. The complete functional bounding box must fit \u003cstrong\u003e32 by 40 um\u003c/strong\u003e. It includes devices, implants/wells, contacts, vias, dummy routing and interconnect on:\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003e[[5,0],[11,17],[11,39],[12,0],[13,17],[21,0],[22,0],[22,4],[24,0],[24,5],[30,0],[30,4],[31,0],[32,0],[33,0],[34,0],[34,3],[34,4],[34,5],[35,0],[36,0],[36,3],[36,4],[36,5],[37,0],[38,0],[40,0],[41,0],[42,0],[42,3],[42,4],[42,5],[46,0],[46,3],[46,4],[46,5],[49,0],[53,0],[53,3],[53,4],[53,5],[55,0],[62,0],[75,0],[80,5],[81,0],[81,3],[81,4],[81,5],[82,0],[86,17],[88,17],[96,1],[100,5],[100,7],[100,8],[108,5],[110,5],[110,11],[110,12],[110,13],[110,14],[110,15],[110,16],[111,5],[112,1],[115,5],[116,5],[117,5],[117,10],[118,5],[119,5],[122,5],[123,5],[124,5],[125,5],[127,5],[128,17],[137,5],[151,5],[152,5],[153,51],[166,5],[167,5],[173,5],[178,0],[183,0],[184,0],[185,0],[204,0],[210,0],[220,0],[226,0],[227,0],[241,0]]\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eText and nonfunctional boundary layers 0/0 and 63/0 do not count as area. Functional geometry must remain on its process layers. The projected conducting boundaries must be Manhattan. Pass the fixed GF180 D FEOL, BEOL, connectivity, grid and antenna checks without waivers. Use five metal layers, 1.1 um top metal and the 1 kOhm/square poly option. Chip density and seal-ring closure belong to higher-level integration.\u003c/p\u003e\n\u003cp\u003eLVS checks topology, dimensions, body terminals and all named top-level ports, case-insensitively. Use exactly one external power-pin label for each of vdd and vss, with its stated metal access window. Implement the supplied electrical body connections physically. Native extraction retains salicide continuity: abutting opposite implants can be ohmically connected even without a metal strap. Use separated opposite-implant diffusion; butted taps are outside the declared projected-sheet model. Missing ports, disconnected bodies or incomplete extraction cannot establish success.\u003c/p\u003e\n15:T10ae,\u003cp\u003eSoft solve budget: \u003cstrong\u003e1 hour\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eRead \u003ccode\u003e/protocol/task.json\u003c/code\u003e for paths, constraints and reviewed resources, and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e for the complete check and submission interfaces. Source simulation assists design; process feedback runs the declared candidate evaluation. Write \u003ccode\u003e/workspace/output/final.gds\u003c/code\u003e and explicitly submit through the runtime protocol. The final evaluator judges the frozen snapshot.\u003c/p\u003e\n\u003ch3\u003eSolve workflow\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eRead the declared circuit and materials, \u003ccode\u003e/protocol/task.json\u003c/code\u003e for paths, constraints and reviewed resources, and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e for capabilities and helper commands. Task inputs under \u003ccode\u003e/task\u003c/code\u003e and resources under \u003ccode\u003e/resources\u003c/code\u003e are read-only; construct the layout in \u003ccode\u003e/workspace\u003c/code\u003e with the declared tools. With layout MCP, paths and commands refer to the remote EDA workspace. Create your own implementation with real devices, interconnect and pins, using your own tool loop without delegating to other agents; reference layouts and author code are not solver inputs.\u003c/li\u003e\n\u003cli\u003eInspect \u003ccode\u003eresources.external\u003c/code\u003e before using external tools. Each command starts a fresh shell: when tool modules are declared, source \u003ccode\u003e/usr/share/Modules/init/bash\u003c/code\u003e and load the selected tool's modules; export its declared \u003ccode\u003etool_environment\u003c/code\u003e settings in that same command. Repeat as needed and use batch or headless operation. Local manuals, command references, and release notes may be available within the declared EDA installation and PDK resource directories. Locate these resources through \u003ccode\u003e/protocol/task.json\u003c/code\u003e and consult the documentation for the installed tool version when diagnosing unfamiliar syntax or tool failures.\u003c/li\u003e\n\u003cli\u003eGenerate an initial candidate and submit a snapshot early. When \u003ccode\u003eprocess-feedback\u003c/code\u003e is available, check the current GDS with layout MCP \u003ccode\u003echeck\u003c/code\u003e or \u003ccode\u003epython -I /protocol/process_check.py\u003c/code\u003e before the final submission. This runs the final evaluator's complete plan and returns engineering diagnostics and candidate measurements, without scores or normalized quality factors. Checks have no count limit and consume the same wall-clock budget. Inspect the physical and functional results and all scored metrics; successful tool execution alone does not establish requirement satisfaction. Read paginated diagnostics with \u003ccode\u003ereport\u003c/code\u003e when using MCP. Local exploratory checks do not replace this complete check.\u003c/li\u003e\n\u003cli\u003eUse the remaining time for measured improvements to the declared quality objectives. Identify the limiting scored metrics, make targeted layout changes, regenerate and check the candidate, and compare measurements with the previous candidate and the stated scoring targets and trade-offs. Preserve the best valid candidate and revert changes that worsen the overall objective. Repeat while time and useful improvements remain; passing validity checks alone is not a stopping condition.\u003c/li\u003e\n\u003cli\u003eStop optimization when the budget expires, all declared quality objectives are achieved, or measured trials support convergence. If stopping early, explain the changes tried, the metric comparisons and the remaining limitations. Track remaining time through session status. At soft-budget expiry, finish or cancel already-started work and submit immediately; do not start another command, check or optimization round. If an MCP execution is running, use \u003ccode\u003epoll\u003c/code\u003e with its \u003ccode\u003eexecution_id\u003c/code\u003e and the returned \u003ccode\u003enext_offset\u003c/code\u003e as \u003ccode\u003eoffset\u003c/code\u003e until completion, or cancel it and wait for it to stop.\u003c/li\u003e\n\u003cli\u003eFinish or cancel outstanding work, restore your best candidate to the declared output path, and explicitly submit it before ending the session. With layout MCP \u003ccode\u003esubmit\u003c/code\u003e, remove the \u003ccode\u003e/workspace/\u003c/code\u003e prefix from \u003ccode\u003eoutput.path\u003c/code\u003e; with the container interface, run \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e. Wait for the receipt: only the last accepted snapshot is judged, and writing a file alone is not submission. Acceptance confirms delivery; the framework independently evaluates validity and quality after the session.\u003c/li\u003e\n\u003c/ol\u003e\n6:[\"$\",\"$8\",null,{\"fallback\":[\"$\",\"p\",null,{\"children\":\"Loading published evidence…\"}],\"children\":[\"$\",\"$L10\",null,{\"task\":{\"case_path\":\"tasks/gf180mcuD/Jianxun-OTA/cases/ota_5t/case.toml\",\"coefficient\":4,\"collection\":\"Jianxun-OTA\",\"configuratio erminals share one net. Do not idealize internal devices.\u003c/p\u003e\\n\",\"Objective\":\"\u003cp\u003eImplement \u003ccode\u003eota_5t\u003c/code\u003e in GF180MCU D, preserving the complete circuit and interface. Optimize area, DC/AC performance, follower dynamics, intrinsic noise and immunity to the declared substrate and well current disturbances. Choose the physical implementation using measured feedback.\u003c/p\u003e\\n\u003ch3\u003eOptimization objective\u003c/h3\u003e\\n\u003cp\u003eMaximize the declared quality score within the solve budget while satisfying all physical and necessary functional requirements. The first passing DRC, LVS and required electrical checks establish a feasible baseline. Continue improving the scored metrics from that baseline; a passing check or \u003ccode\u003etask_success = true\u003c/code\u003e does not mean that the quality objectives have been achieved.\u003c/p\u003e\\n\",\"Operating Conditions\":\"$13\",\"Physical Requirements\":\"$14\",\"Tools and Submission\":\"$15\"},\"source_url\":\"https://github.com/Jianxun/iic-osic-tools-project-template/tree/178a401d847ce7a602d0ce70a1ba90a15b5f9536/designs/libs/core_analog/ota_5t/ota_5t.spice\",\"status\":\"qualified\",\"title\":\"Five-Transistor OTA with Bias and Dummies\",\"core\":true},\"catalog\":{\"tasks\":[],\"runs\":[{\"condition\":{\"cli_version\":\"0.17.1\",\"configuration_sha256\":\"48024356c5886c422e478bc77d5b7ff0b1729b645e7a875ed03f2d3c4412ab18\",\"effort_requested\":\"max\",\"effort_resolved\":\"max\",\"harness\":\"zcode\",\"harness_id\":\"iclayout-zcode\",\"harness_kind\":\"agent\",\"harness_version\":\"1\",\"model\":\"tokenapi/glm-5.3-flash\",\"prompt_sha256\":\"e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855\",\"provider_effective_effort\":null,\"solver_image\":\"sha256:ce12cd8c22bb83bd1666b52bc68b73a1a4850f14517ffde9bd1b5f4b19b4ddc2\"},\"condition_id\":\"2b2e03be7942462c6afa39408935388534c4136251325f7ae08e32fbd0fc4aa8\",\"evaluation_id\":\"3693190
