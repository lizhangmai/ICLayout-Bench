"$undefined\",\"template\":[\"$\",\"$L5\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[\"$L6\",[[\"$\",\"script\",\"script-0\",{\"src\":\"/ICLayout-Bench/_next/static/chunks/3_2wwayut9q0b.js\",\"async\":true,\"nonce\":\"$undefined\"}]],[\"$\",\"$L7\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.MetadataOutlet\",\"children\":\"$@9\"}]}]]}],{},null,false,null]},null,false,\"$a\"]},null,false,null],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Lb\",null,{\"children\":\"$Lc\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Ld\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.Metadata\",\"children\":\"$Le\"}]}]}],null]}],false]],\"m\":\"$undefined\",\"G\":[\"$f\",[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/ICLayout-Bench/_next/static/chunks/25phisebeeifo.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]]],\"S\":true,\"h\":null,\"r\":\"$undefined\",\"s\":\"$undefined\",\"a\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"U2oZdoUjWqT_XfcDHuQ5i\"}\n10:I[1186,[\"/ICLayout-Bench/_next/static/chunks/3gll1ekbrh320.js\",\"/ICLayout-Bench/_next/static/chunks/3_2wwayut9q0b.js\"],\"default\"]\na:C\n11:T316d,\u003ch1 id=\"problem-two-stage-cmos-ota-layout-task\"\u003eTwo-Stage CMOS OTA Layout Task\u003c/h1\u003e\n\u003ch2 id=\"problem-objective\"\u003eObjective\u003c/h2\u003e\n\u003cp\u003eCreate an IHP SG13G2 layout for the \u003ccode\u003etwo_stage_OTA_layout\u003c/code\u003e two-stage CMOS\noperational transconductance amplifier. Preserve the MOS and MIM devices,\ndimensions, connectivity, well and substrate connections, and six-port\ninterface in the authoritative materials. The submitted GDS must pass the\nphysical checks, fit the functional outline, and meet the nominal DC-bias and\nAC-response limits after candidate-derived RC extraction.\u003c/p\u003e\n\u003ch2 id=\"problem-inputs-and-interface\"\u003eInputs and Interface\u003c/h2\u003e\n\u003cp\u003eIn addition to this problem, the solver receives the following declared\nmaterials. The structured constraints\nand evaluation plan are also available at runtime through \u003ccode\u003e/protocol/task.json\u003c/code\u003e.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eInput\u003c/th\u003e\n\u003cth\u003ePurpose\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"/ICLayout-Bench/assets/b26120b95af66cc4075ac9d12a25444b6badbe7e2c96b50d7a1bd7a15b0cf409.txt\"\u003ematerials/circuit.cdl\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eAuthoritative LVS netlist for \u003ccode\u003etwo_stage_OTA_layout\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"/ICLayout-Bench/assets/2c82bb396be0377ae24ee933e5402f87edf9e5da5f2c509774e6ff5c50705a20.txt\"\u003ematerials/circuit.spice\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003ePre-layout simulator netlist\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"/ICLayout-Bench/assets/62851f9d9bf6754a4d9b70ca2d9d63a0fd6241ae5e65b289fc5e2e8882469bea.txt\"\u003ematerials/testbench.spice\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eNominal bias, feedback fixture, AC sweep, and measurements\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eUse one external label on each distinct conductor. Internal nodes must not be\ndeclared as external ports.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003ePort\u003c/th\u003e\n\u003cth\u003eFunction\u003c/th\u003e\n\u003cth\u003eNominal connection\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ev-\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eInverting input\u003c/td\u003e\n\u003ctd\u003eDC feedback from \u003ccode\u003evout\u003c/code\u003e; AC feedback fixture return\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ev+\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eNon-inverting input\u003c/td\u003e\n\u003ctd\u003e0.6 V DC and unit AC excitation\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003evss\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eGround and substrate supply\u003c/td\u003e\n\u003ctd\u003e0 V\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003evdd\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003ePositive supply\u003c/td\u003e\n\u003ctd\u003e1.2 V\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eiout\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eBias-current node\u003c/td\u003e\n\u003ctd\u003eIdeal 80 µA sink to ground\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003evout\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eSingle-ended output\u003c/td\u003e\n\u003ctd\u003e500 fF load to ground\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eThe extraction port order is \u003ccode\u003ev- v+ vss vdd iout vout\u003c/code\u003e.\u003c/p\u003e\n\u003ch2 id=\"problem-operating-conditions\"\u003eOperating Conditions\u003c/h2\u003e\n\u003cp\u003eThe pre-layout and candidate-derived simulations use the supplied deck and the\nsame nominal model and fixture.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eParameter\u003c/th\u003e\n\u003cth\u003eSetting\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eProcess corner\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003emos_tt\u003c/code\u003e, \u003ccode\u003ecap_typ\u003c/code\u003e, \u003ccode\u003eres_typ\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eTemperature\u003c/td\u003e\n\u003ctd\u003e27 °C\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eSupply\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eVDD = 1.2 V\u003c/code\u003e, \u003ccode\u003eVSS = 0 V\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eInput DC level\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eV+ = 0.6 V\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eBias and load\u003c/td\u003e\n\u003ctd\u003e80 µA sink at \u003ccode\u003eiout\u003c/code\u003e; 500 fF from \u003ccode\u003evout\u003c/code\u003e to ground\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eFeedback fixture\u003c/td\u003e\n\u003ctd\u003e4 GH inductor from \u003ccode\u003evout\u003c/code\u003e to \u003ccode\u003ev-\u003c/code\u003e; 4 GF capacitor from \u003ccode\u003ev-\u003c/code\u003e to ground\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eAC sweep\u003c/td\u003e\n\u003ctd\u003e100 points/decade from 1 Hz through 10 MHz\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eNumerical conditioning\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003ershunt = 1e12\u003c/code\u003e: 1 TΩ from every analog node to ground, identical pre-layout and post-layout\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eThe feedback fixture closes the DC loop while opening the AC loop for transfer\nmeasurement. Supply power is \u003ccode\u003e-V(vdd) × I(VDD)\u003c/code\u003e at the operating point and\nexcludes external input and bias-source power.\u003c/p\u003e\n\u003ch2 id=\"problem-physical-requirements\"\u003ePhysical Requirements\u003c/h2\u003e\n\u003cp\u003eSubmit a readable GDSII file with a nonempty \u003ccode\u003etwo_stage_OTA_layout\u003c/code\u003e top cell. The\nfile must be at most 10 MiB (10,485,760 bytes) and must contain the complete\nhierarchy needed by the target cell.\u003c/p\u003e\n\u003cp\u003eThe evaluator runs the pinned SG13G2 main and additional maximal DRC rules in\ndeep mode, with density and antenna checks disabled and no waivers. LVS uses the\ncurrent \u003ccode\u003elvs-upstream.json\u003c/code\u003e profile and strict named-port matching against\n\u003ccode\u003ematerials/circuit.cdl\u003c/code\u003e; every declared port must stay on its own conductor with\nthe declared connectivity and device parameters. Port names are matched\ncase-insensitively.\u003c/p\u003e\n\u003cp\u003eThe functional outline is the recursive bounding box of polygons on these\nSG13G2 datatype-0 layers, including child cells and the complete routing stack:\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003e1, 3, 5, 6, 7, 8, 10, 11, 13, 14, 19, 24, 26, 28, 29, 30, 31, 32, 33, 35, 36, 40, 44, 46, 49, 50, 51, 52, 53, 55, 58, 66, 67, 90, 101, 111, 125, 126, 128, 129, 133, 134, 139, 152\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eThe maximum width is 80 µm and the maximum height is\n50 µm, measured along the submitted X and Y axes.\nFunctional area is width multiplied by height. Text, annotation and filler\nlayers are excluded. The area score below uses this same functional footprint.\u003c/p\u003e\n\u003cp\u003eAfter the physical and geometry gates pass, Magic extracts distributed wire\nresistance and layout capacitance from the submitted GDS. Device merging and\nresistor-network simplification are disabled. The compact-device extraction\nboundary represents MOS bodies at ideal model rails; explicit taps remain in the\nphysical LVS netlist but are not emitted as extracted tap elements. Substrate\nsheet and tap resistance as extracted quantities, body coupling, and noise are\noutside the declared scope. The finite source tap elements are covered by the\nsame-condition source calibration and are not treated as additional post-layout\nrequirements.\u003c/p\u003e\n\u003ch2 id=\"problem-electrical-requirements-and-scoring\"\u003eElectrical Requirements and Scoring\u003c/h2\u003e\n\u003cp\u003ePhysical checks and declared functional bounds remain mandatory. Quality has no\nfixed allowed-degradation threshold. Each \u003ccode\u003esource_*\u003c/code\u003e job simulates the declared\nsource circuit with exactly the same testbench, model resources, parameters,\nload and measurement window as its paired extracted-candidate job. A source\nobservation is the 100-point electrical baseline; it is independent of the\nsubmitted GDS. All individual pairs are retained in the evaluation report.\u003c/p\u003e\n\u003cp\u003eFor a post-layout observation x and its source observation b:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eMaximize: q = x/b; minimize: q = b/x. When a numerical scale s is declared,\nuse (x+s)/(b+s) or its inverse. This handles zero-valued error measurements;\ns is a normalization floor, not an allowed degradation or pass threshold.\u003c/li\u003e\n\u003cli\u003eAmplitude dB: q = 10^((x-b)/20) for maximize, its inverse for minimize.\u003c/li\u003e\n\u003cli\u003eTarget: q = 1/(1+abs(x-b)/s), with a declared physical scale s. Signed and\nzero-valued operating points are never divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eScoring uses \u003ccode\u003elayout\u003c/code\u003e. A metric uses its worst paired quality q. The score is\nS = 100 * product(q_i ** w_i), including area quality\nq_area = area_reference / candidate_functional_area. The weights below sum to\none. Dimensions describe measurements but do not determine their weights.\nPhysical or functional rejection scores zero; missing or invalid measurements\nproduce an unknown score, including measurements with zero weight.\nSource-equivalent performance at the area reference scores 100; improvements\ncan exceed 100. A weight expresses a tradeoff, not a hard acceptance limit.\u003c/p\u003e\n\u003cp\u003eMeasurement definitions below use the supplied SPICE node/source names.\n\u003ccode\u003ev(n)\u003c/code\u003e is node voltage and \u003ccode\u003ei(V)\u003c/code\u003e is current into a voltage source; delivered\npower therefore uses a minus sign. \u003ccode\u003edb(z)=20*log10(abs(z))\u003c/code\u003e, \u003ccode\u003emag/abs\u003c/code\u003e\ndenote magnitude, and \u003ccode\u003ecph\u003c/code\u003e is continuous phase in radians. \u003ccode\u003efind\u003c/code\u003e, \u003ccode\u003ewhen\u003c/code\u003e,\n\u003ccode\u003efrom/to\u003c/code\u003e, and \u003ccode\u003erise/fall\u003c/code\u003e retain the deck's interpolation, window and\ncrossing conventions; SPICE suffixes p/n/u/m/meg/g mean pico/nano/micro/\nmilli/mega/giga. Nested \u003ccode\u003eavg\u003c/code\u003e, \u003ccode\u003emin\u003c/code\u003e, \u003ccode\u003emax\u003c/code\u003e, \u003ccode\u003evecmin/vecmax\u003c/code\u003e and \u003ccode\u003ederiv\u003c/code\u003e\nmean the stated window average, extrema and sampled derivative. All\ndeclared conditions are measured separately and paired with the same\nsource condition; a group uses its worst paired quality.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eDefinition / observations\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eQuality rule\u003c/th\u003e\n\u003cth\u003eFunctional bounds\u003c/th\u003e\n\u003cth\u003eScale\u003c/th\u003e\n\u003cth\u003eDimension\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003elow_frequency_gain\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: Value of \u003ccode\u003e(db((v(vout)/(v(vp)-v(vm))))) at=1\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003emaximize / db20\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eunity_gain_bandwidth\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: Crossing coordinate where \u003ccode\u003e(db((v(vout)/(v(vp)-v(vm)))))=0 fall=1\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eHz\u003c/td\u003e\n\u003ctd\u003emaximize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ephase_margin\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: \u003ccode\u003e180+(find (180*cph((v(vout)/(v(vp)-v(vm))))/pi) when (db((v(vout)/(v(vp)-v(vm)))))=0 fall=1)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003edeg\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 180\u003c/td\u003e\n\u003ctd\u003e180\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003esupply_power\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003e-v(vdd)*i(VDD)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003ctd\u003esupply\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_bias\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003ev(vout)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.2\u003c/td\u003e\n\u003ctd\u003e1.2\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eArea reference: \u003cstrong\u003e2936.48 um2\u003c/strong\u003e. 24 expanded device instances; sum of device/contact envelopes 1887.1830 um2, per-side envelope allowance 0.6 um, 50% routing allowance and total outer width/height allowance 1.2 um. Estimate = ceil(100 * (1.5 * envelope_sum + 2 * margin * sqrt(envelope_sum) + margin^2)) / 100. Here margin is the total allowance across two opposite sides; the envelope sum is displayed rounded to four decimals. MOS/passive envelopes use dec e task score.\u003c/p\u003e\n\u003ch3\u003eScore weights\u003c/h3\u003e\n\u003cp\u003eSmall-signal OTAs: gain 27%; bandwidth 22.5%; phase margin 22.5%; operating points 4.5%; power 13.5%; area 10%. Each objective's weight is divided equally among its metrics.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003elow_frequency_gain\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.270000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eunity_gain_bandwidth\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.225000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ephase_margin\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.225000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_bias\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003esupply_power\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.135000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n13:T4e1,\u003cp\u003eThe pre-layout and candidate-derived simulations use the supplied deck and the\nsame nominal model and fixture.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eParameter\u003c/th\u003e\n\u003cth\u003eSetting\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eProcess corner\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003emos_tt\u003c/code\u003e, \u003ccode\u003ecap_typ\u003c/code\u003e, \u003ccode\u003eres_typ\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eTemperature\u003c/td\u003e\n\u003ctd\u003e27 °C\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eSupply\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eVDD = 1.2 V\u003c/code\u003e, \u003ccode\u003eVSS = 0 V\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eInput DC level\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eV+ = 0.6 V\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eBias and load\u003c/td\u003e\n\u003ctd\u003e80 µA sink at \u003ccode\u003eiout\u003c/code\u003e; 500 fF from \u003ccode\u003evout\u003c/code\u003e to ground\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eFeedback fixture\u003c/td\u003e\n\u003ctd\u003e4 GH inductor from \u003ccode\u003evout\u003c/code\u003e to \u003ccode\u003ev-\u003c/code\u003e; 4 GF capacitor from \u003ccode\u003ev-\u003c/code\u003e to ground\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eAC sweep\u003c/td\u003e\n\u003ctd\u003e100 points/decade from 1 Hz through 10 MHz\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eNumerical conditioning\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003ershunt = 1e12\u003c/code\u003e: 1 TΩ from every analog node to ground, identical pre-layout and post-layout\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eThe feedback fixture closes the DC loop while opening the AC loop for transfer\nmeasurement. Supply power is \u003ccode\u003e-V(vdd) × I(VDD)\u003c/code\u003e at the operating point and\nexcludes external input and bias-source power.\u003c/p\u003e\n14:T783,\u003cp\u003eSubmit a readable GDSII file with a nonempty \u003ccode\u003etwo_stage_OTA_layout\u003c/code\u003e top cell. The\nfile must be at most 10 MiB (10,485,760 bytes) and must contain the complete\nhierarchy needed by the target cell.\u003c/p\u003e\n\u003cp\u003eThe evaluator runs the pinned SG13G2 main and additional maximal DRC rules in\ndeep mode, with density and antenna checks disabled and no waivers. LVS uses the\ncurrent \u003ccode\u003elvs-upstream.json\u003c/code\u003e profile and strict named-port matching against\n\u003ccode\u003ematerials/circuit.cdl\u003c/code\u003e; every declared port must stay on its own conductor with\nthe declared connectivity and device parameters. Port names are matched\ncase-insensitively.\u003c/p\u003e\n\u003cp\u003eThe functional outline is the recursive bounding box of polygons on these\nSG13G2 datatype-0 layers, including child cells and the complete routing stack:\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003e1, 3, 5, 6, 7, 8, 10, 11, 13, 14, 19, 24, 26, 28, 29, 30, 31, 32, 33, 35, 36, 40, 44, 46, 49, 50, 51, 52, 53, 55, 58, 66, 67, 90, 101, 111, 125, 126, 128, 129, 133, 134, 139, 152\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eThe maximum width is 80 µm and the maximum height is\n50 µm, measured along the submitted X and Y axes.\nFunctional area is width multiplied by height. Text, annotation and filler\nlayers are excluded. The area score below uses this same functional footprint.\u003c/p\u003e\n\u003cp\u003eAfter the physical and geometry gates pass, Magic extracts distributed wire\nresistance and layout capacitance from the submitted GDS. Device merging and\nresistor-network simplification are disabled. The compact-device extraction\nboundary represents MOS bodies at ideal model rails; explicit taps remain in the\nphysical LVS netlist but are not emitted as extracted tap elements. Substrate\nsheet and tap resistance as extracted quantities, body coupling, and noise are\noutside the declared scope. The finite source tap elements are covered by the\nsame-condition source calibration and are not treated as additional post-layout\nrequirements.\u003c/p\u003e\n6:[\"$\",\"$8\",null,{\"fallb
