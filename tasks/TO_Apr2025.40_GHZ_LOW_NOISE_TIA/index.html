n\":\"$undefined\",\"nonce\":\"$undefined\"}],[\"$\",\"script\",\"script-0\",{\"src\":\"/ICLayout-Bench/_next/static/chunks/3gll1ekbrh320.js\",\"async\":true,\"nonce\":\"$undefined\"}]],[\"$\",\"html\",null,{\"lang\":\"en\",\"children\":[\"$\",\"body\",null,{\"children\":[[\"$\",\"a\",null,{\"className\":\"skip-link\",\"href\":\"#main-content\",\"children\":\"Skip to content\"}],[\"$\",\"header\",null,{\"children\":[[\"$\",\"$L2\",null,{\"className\":\"brand\",\"href\":\"/\",\"children\":[[\"$\",\"img\",null,{\"className\":\"brandmark\",\"src\":\"/ICLayout-Bench/brand/iclayout-bench.svg\",\"width\":40,\"height\":40,\"alt\":\"\",\"aria-hidden\":\"true\"}],\" \",\"ICLayout\",[\"$\",\"span\",null,{\"children\":\"Bench\"}]]}],[\"$\",\"$L3\",null,{\"participantAccess\":false}]]}],[\"$\",\"main\",null,{\"id\":\"main-content\",\"children\":[\"$\",\"$L4\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L5\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":[[\"$\",\"section\",null,{\"children\":[[\"$\",\"h1\",null,{\"children\":\"Page unavailable\"}],[\"$\",\"p\",null,{\"children\":\"This page is not part of the current public release.\"}],[\"$\",\"$L2\",null,{\"href\":\"/\",\"children\":\"Return to overview\"}]]}],[]],\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]}],[\"$\",\"footer\",null,{\"children\":[[\"$\",\"span\",null,{\"children\":\"ICLayout-Bench · Integrated circuit layout intelligence\"}],[\"$\",\"span\",null,{\"children\":[\"Evidence first. Conditions explicit.\",\" \",[\"$\",\"$L2\",null,{\"href\":\"/methodology\",\"children\":\"Methodology\"}],false]}]]}]]}]}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[null,[\"$\",\"$L4\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L5\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[\"$L6\",[[\"$\",\"script\",\"script-0\",{\"src\":\"/ICLayout-Bench/_next/static/chunks/3_2wwayut9q0b.js\",\"async\":true,\"nonce\":\"$undefined\"}]],[\"$\",\"$L7\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.MetadataOutlet\",\"children\":\"$@9\"}]}]]}],{},null,false,null]},null,false,\"$a\"]},null,false,null],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Lb\",null,{\"children\":\"$Lc\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Ld\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.Metadata\",\"children\":\"$Le\"}]}]}],null]}],false]],\"m\":\"$undefined\",\"G\":[\"$f\",[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/ICLayout-Bench/_next/static/chunks/25phisebeeifo.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]]],\"S\":true,\"h\":null,\"r\":\"$undefined\",\"s\":\"$undefined\",\"a\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"U2oZdoUjWqT_XfcDHuQ5i\"}\n10:I[1186,[\"/ICLayout-Bench/_next/static/chunks/3gll1ekbrh320.js\",\"/ICLayout-Bench/_next/static/chunks/3_2wwayut9q0b.js\"],\"default\"]\na:C\n11:T32a1,\u003ch1 id=\"problem-three-stage-sige-hbt-transimpedance-amplifier-layout-task\"\u003eThree-Stage SiGe HBT Transimpedance Amplifier Layout Task\u003c/h1\u003e\n\u003ch2 id=\"problem-objective\"\u003eObjective\u003c/h2\u003e\n\u003cp\u003eCreate a clean SG13G2 layout for the maintained three-stage, single-ended\ntransimpedance amplifier in \u003ccode\u003eFDM_QNC_00_LN_TIA\u003c/code\u003e. Preserve the circuit\nconnectivity, device multiplicities, passive dimensions and six external\nports. The submitted top cell must be \u003ccode\u003eFDM_QNC_00_LN_TIA\u003c/code\u003e and must pass the\nphysical checks and nominal post-layout measurements below.\u003c/p\u003e\n\u003ch2 id=\"problem-inputs-and-interface\"\u003eInputs and Interface\u003c/h2\u003e\n\u003cp\u003eIn addition to this problem, the runtime task supplies the following declared\ninputs:\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eInput\u003c/th\u003e\n\u003cth\u003ePurpose\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"/ICLayout-Bench/assets/17a094c09698acfbe6a25a50d3a0292ebb82fd82b7e21269442bcdd4fa3c0d45.txt\"\u003ematerials/circuit.cdl\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eAuthoritative LVS netlist and device geometry\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"/ICLayout-Bench/assets/62f7df0322744074c141d2bbbd3d5e9537fb06ee02729758e5f787a6de56c515.txt\"\u003ematerials/circuit.spice\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eAuthoritative simulator export\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"/ICLayout-Bench/assets/4973b1a2b9d7ca896646e106df79170391670961e01377f4d4dd2c2109a9dae4.txt\"\u003ematerials/testbench.spice\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eNominal pre-layout and post-layout operating-point and AC testbench\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eThe circuit is a three-stage SiGe HBT transimpedance core. Q1 is the input\ncommon-emitter device (\u003ccode\u003eNx=5\u003c/code\u003e), Q2 is the intermediate common-collector\ndevice (\u003ccode\u003eNx=10\u003c/code\u003e), and Q3 is the output common-emitter device (\u003ccode\u003eNx=10\u003c/code\u003e). The\nresistor network provides collector loads, emitter degeneration and feedback;\nthree \u003ccode\u003ecap_cmim\u003c/code\u003e capacitors decouple the independent supply rails. The\nexplicit \u003ccode\u003eptap1\u003c/code\u003e connects the substrate body to \u003ccode\u003eVSS\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eThe ordered top-level interface is:\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003ePort\u003c/th\u003e\n\u003cth\u003eFunction\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eRFin\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eCurrent input and transimpedance sensing node\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eRFout\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eVoltage output and 50 fF load node\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eVSS\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eCommon return and substrate-tap reference\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003evcc1\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eQ1 collector-load supply, 1.7 V\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003evcc2\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eQ2 collector supply, 2.1 V\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003evcc3\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eQ3 collector-load supply, 2.1 V\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eLVS and simulation use this order exactly. The netlists specify\nthree \u003ccode\u003enpn13G2\u003c/code\u003e devices, \u003ccode\u003erppd\u003c/code\u003e and \u003ccode\u003ersil\u003c/code\u003e resistors, 30 × 60 µm \u003ccode\u003ecap_cmim\u003c/code\u003e\ndevices with \u003ccode\u003em=2\u003c/code\u003e, and a substrate tap with \u003ccode\u003eA=25 µm²\u003c/code\u003e, \u003ccode\u003eP=20 µm\u003c/code\u003e and\nfinite simulator equivalent \u003ccode\u003eR=21.7391304348 Ω\u003c/code\u003e.\u003c/p\u003e\n\u003ch2 id=\"problem-operating-conditions\"\u003eOperating Conditions\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eParameter\u003c/th\u003e\n\u003cth\u003eSetting\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eModels and temperature\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003ehbt_typ\u003c/code\u003e, \u003ccode\u003eres_typ\u003c/code\u003e, \u003ccode\u003ecap_typ\u003c/code\u003e; 26.85 °C\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eSupplies\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003evcc1=1.7 V\u003c/code\u003e, \u003ccode\u003evcc2=2.1 V\u003c/code\u003e, \u003ccode\u003evcc3=2.1 V\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eInput DC current\u003c/td\u003e\n\u003ctd\u003e−100 µA, 0 A and +100 µA from \u003ccode\u003eVSS\u003c/code\u003e into \u003ccode\u003eRFin\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eAC stimulus\u003c/td\u003e\n\u003ctd\u003e1 A at the zero-volt \u003ccode\u003eVSENSE\u003c/code\u003e source for normalization\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eOutput load\u003c/td\u003e\n\u003ctd\u003e50 fF from \u003ccode\u003eRFout\u003c/code\u003e to \u003ccode\u003eVSS\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eAC sweep\u003c/td\u003e\n\u003ctd\u003e1 MHz–100 MHz, 40 points per decade\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eSolver options\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003ershunt=1e12\u003c/code\u003e Ω, \u003ccode\u003ereltol=1e-6\u003c/code\u003e, \u003ccode\u003evntol=1e-8\u003c/code\u003e V, \u003ccode\u003eabstol=1e-12\u003c/code\u003e A\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eThe AC stimulus is a small-signal normalization, not a large-signal 1 A\ninput. Transfer uses the current measured at \u003ccode\u003eVSENSE\u003c/code\u003e, and supply power is\ncalculated from the three independent supply sources.\u003c/p\u003e\n\u003ch2 id=\"problem-physical-requirements\"\u003ePhysical Requirements\u003c/h2\u003e\n\u003cp\u003eThe candidate GDS must be readable, non-empty and no larger than 32 MiB. It\nmust pass the pinned SG13G2 main and additional maximal DRC scopes in deep\nmode without waivers; density and antenna checks are outside this declared scope. It must\nalso pass strict named-port LVS against \u003ccode\u003ematerials/circuit.cdl\u003c/code\u003e, including\nthe six ports, device multiplicities, passive geometry and explicit substrate\ntap. Artifact, DRC, strict LVS and geometry gates all precede candidate\nextraction.\u003c/p\u003e\n\u003cp\u003eThe GDS must include the complete target hierarchy. Port names are matched\ncase-insensitively; each declared port must remain on its own conductor with\nthe declared connectivity.\u003c/p\u003e\n\u003cp\u003eThe functional outline is the recursive bounding box of polygons on these\nSG13G2 datatype-0 layers, including child cells and the complete routing stack:\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003e1, 3, 5, 6, 7, 8, 10, 11, 13, 14, 19, 24, 26, 28, 29, 30, 31, 32, 33, 35, 36, 40, 44, 46, 49, 50, 51, 52, 53, 55, 58, 66, 67, 90, 101, 111, 125, 126, 128, 129, 133, 134, 139, 152\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eThe maximum width is 660 µm and the maximum height is\n620 µm, measured along the submitted X and Y axes.\nFunctional area is width multiplied by height. Text, annotation and filler\nlayers are excluded. The area score below uses this same functional footprint.\u003c/p\u003e\n\u003cp\u003eCandidate post-layout extraction combines candidate-derived HBT geometry and\n\u003ccode\u003eNx\u003c/code\u003e with distributed interconnect resistance and capacitance. Drawn emitter\ngeometry is checked against the candidate; effective ordinary \u003ccode\u003enpn13G2\u003c/code\u003e\ndimensions use the simulator model defaults, with the extracted \u003ccode\u003eNx\u003c/code\u003e retained. The standard\npath disables tap extraction at the approved SG13G2 substrate boundary so\nthe compact-device body can be reconciled to \u003ccode\u003eVSS\u003c/code\u003e; strict LVS still checks\nthe finite \u003ccode\u003eptap1\u003c/code\u003e card. Device terminals, multiplicities, resistor geometry,\nMIM geometry and top-level connectivity remain candidate-derived. The\nfinite source tap is retained in pre-layout calibration, and the accepted\nmodel boundary is limited to the nominal low-frequency transfer and bias\nmeasurements in this task. No other internal-node aliases are permitted; a simulator global ground\nalias must not replace the explicit source substrate connection.\u003c/p\u003e\n\u003ch2 id=\"problem-electrical-requirements-and-scoring\"\u003eElectrical Requirements and Scoring\u003c/h2\u003e\n\u003cp\u003ePhysical checks and declared functional bounds remain mandatory. Quality has no\nfixed allowed-degradation threshold. Each \u003ccode\u003esource_*\u003c/code\u003e job simulates the declared\nsource circuit with exactly the same testbench, model resources, parameters,\nload and measurement window as its paired extracted-candidate job. A source\nobservation is the 100-point electrical baseline; it is independent of the\nsubmitted GDS. All individual pairs are retained in the evaluation report.\u003c/p\u003e\n\u003cp\u003eFor a post-layout observation x and its source observation b:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eMaximize: q = x/b; minimize: q = b/x. When a numerical scale s is declared,\nuse (x+s)/(b+s) or its inverse. This handles zero-valued error measurements;\ns is a normalization floor, not an allowed degradation or pass threshold.\u003c/li\u003e\n\u003cli\u003eAmplitude dB: q = 10^((x-b)/20) for maximize, its inverse for minimize.\u003c/li\u003e\n\u003cli\u003eTarget: q = 1/(1+abs(x-b)/s), with a declared physical scale s. Signed and\nzero-valued operating points are never divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eScoring uses \u003ccode\u003elayout\u003c/code\u003e. A metric uses its worst paired quality q. The score is\nS = 100 * product(q_i ** w_i), including area quality\nq_area = area_reference / candidate_functional_area. The weights below sum to\none. Dimensions describe measurements but do not determine their weights.\nPhysical or functional rejection scores zero; missing or invalid measurements\nproduce an unknown score, including measurements with zero weight.\nSource-equivalent performance at the area reference scores 100; improvements\ncan exceed 100. A weight expresses a tradeoff, not a hard acceptance limit.\u003c/p\u003e\n\u003cp\u003eMeasurement definitions below use the supplied SPICE node/source names.\n\u003ccode\u003ev(n)\u003c/code\u003e is node voltage and \u003ccode\u003ei(V)\u003c/code\u003e is current into a voltage source; delivered\npower therefore uses a minus sign. \u003ccode\u003edb(z)=20*log10(abs(z))\u003c/code\u003e, \u003ccode\u003emag/abs\u003c/code\u003e\ndenote magnitude, and \u003ccode\u003ecph\u003c/code\u003e is continuous phase in radians. \u003ccode\u003efind\u003c/code\u003e, \u003ccode\u003ewhen\u003c/code\u003e,\n\u003ccode\u003efrom/to\u003c/code\u003e, and \u003ccode\u003erise/fall\u003c/code\u003e retain the deck's interpolation, window and\ncrossing conventions; SPICE suffixes p/n/u/m/meg/g mean pico/nano/micro/\nmilli/mega/giga. Nested \u003ccode\u003eavg\u003c/code\u003e, \u003ccode\u003emin\u003c/code\u003e, \u003ccode\u003emax\u003c/code\u003e, \u003ccode\u003evecmin/vecmax\u003c/code\u003e and \u003ccode\u003ederiv\u003c/code\u003e\nmean the stated window average, extrema and sampled derivative. All\ndeclared conditions are measured separately and paired with the same\nsource condition; a group uses its worst paired quality.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eDefinition / observations\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eQuality rule\u003c/th\u003e\n\u003cth\u003eFunctional bounds\u003c/th\u003e\n\u003cth\u003eScale\u003c/th\u003e\n\u003cth\u003eDimension\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003etransimpedance_low\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: Value of \u003ccode\u003e(real(v(RFout)/i(VSENSE))) at=1meg\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eohm\u003c/td\u003e\n\u003ctd\u003emaximize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003etransimpedance_high\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: Value of \u003ccode\u003e(mag(v(RFout)/i(VSENSE))) at=100meg\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eohm\u003c/td\u003e\n\u003ctd\u003emaximize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003einput_bias\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003ev(RFin)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 2.1\u003c/td\u003e\n\u003ctd\u003e2.1\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_bias\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003ev(RFout)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 2.1\u003c/td\u003e\n\u003ctd\u003e2.1\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003esupply_power\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003e-v(vcc1)*i(VCC1)-v(vcc2)*i(VCC2)-v(vcc3)*i(VCC3)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003ctd\u003esupply\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eArea reference: \u003cstrong\u003e18573.26 um2\u003c/strong\u003e. 15 expanded device instances; sum of device/contact envelopes 12204.4550 um2, per-side envelope allowance 0.6 um, 50% routing allowance and total outer width/height allowance 1.2 um. Estimate = ceil(100 * (1.5 * envelope_sum + 2 * margin * sqrt(envelope_sum) + margin^2)) / 100. Here margin is the total allowance across two opposite sides; the envelope sum is displayed rounded to four decimals. MOS/passive envelopes use declared W/L (or resistor dimensions) and multiplicity; explicit tap areas and HBT emitter/contact envelopes are included. This is a frozen engineering estimate, not a foundry minimum or a feasibility claim.\u003c/p\u003e\n\u003cp\u003eThe capability coefficient remains \u003cstrong\u003e5\u003c/strong\u003e; it is independent of\nthe reference-relative task score.\u003c/p\u003e\n\u003ch3 id=\"problem-score-weights\"\u003eScore weights\u003c/h3\u003e\n\u003cp\u003eSiGe low-frequency transfer tasks: signal transfer 68.8%; bias 5.29%; supply cost 15.9%; area 10%. Each objective's weight is divided equally among its metrics.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003etransimpedance_high\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.344117647059\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003etransimpedance_low\u003c/code\u003e\u003c/td\u00 ions) and multiplicity; explicit tap areas and HBT emitter/contact envelopes are included. This is a frozen engineering estimate, not a foundry minimum or a feasibility claim.\u003c/p\u003e\n\u003cp\u003eThe capability coefficient remains \u003cstrong\u003e5\u003c/strong\u003e; it is independent of\nthe reference-relative task score.\u003c/p\u003e\n\u003ch3\u003eScore weights\u003c/h3\u003e\n\u003cp\u003eSiGe low-frequency transfer tasks: signal transfer 68.8%; bias 5.29%; supply cost 15.9%; area 10%. Each objective's weight is divided equally among its metrics.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003etransimpedance_high\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.344117647059\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003etransimpedance_low\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.344117647059\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003einput_bias\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.026470588235\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_bias\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.026470588235\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003esupply_power\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.158823529412\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n13:T451,\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eParameter\u003c/th\u003e\n\u003cth\u003eSetting\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eModels and temperature\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003ehbt_typ\u003c/code\u003e, \u003ccode\u003eres_typ\u003c/code\u003e, \u003ccode\u003ecap_typ\u003c/code\u003e; 26.85 °C\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eSupplies\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003evcc1=1.7 V\u003c/code\u003e, \u003ccode\u003evcc2=2.1 V\u003c/code\u003e, \u003ccode\u003evcc3=2.1 V\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eInput DC current\u003c/td\u003e\n\u003ctd\u003e−100 µA, 0 A and +100 µA from \u003ccode\u003eVSS\u003c/code\u003e into \u003ccode\u003eRFin\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eAC stimulus\u003c/td\u003e\n\u003ctd\u003e1 A at the zero-volt \u003ccode\u003eVSENSE\u003c/code\u003e source for normalization\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eOutput load\u003c/td\u003e\n\u003ctd\u003e50 fF from \u003ccode\u003eRFout\u003c/code\u003e to \u003ccode\u003eVSS\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eAC sweep\u003c/td\u003e\n\u003ctd\u003e1 MHz–100 MHz, 40 points per decade\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eSolver options\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003ershunt=1e12\u003c/code\u003e Ω, \u003ccode\u003ereltol=1e-6\u003c/code\u003e, \u003ccode\u003evntol=1e-8\u003c/code\u003e V, \u003ccode\u003eabstol=1e-12\u003c/code\u003e A\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eThe AC stimulus is a small-signal normalization, not a large-signal 1 A\ninput. Transfer uses the current measured at \u003ccode\u003eVSENSE\u003c/code\u003e, and supply power is\ncalculated from the three independent supply sources.\u003c/p\u003e\n14:T8fc,\u003cp\u003eThe candidate GDS must be readable, non-empty and no larger than 32 MiB. It\nmust pass the pinned SG13G2 main and additional maximal DRC scopes in deep\nmode without waivers; density and antenna checks are outside this declared scope. It must\nalso pass strict named-port LVS against \u003ccode\u003ematerials/circuit.cdl\u003c/code\u003e, including\nthe six ports, device multiplicities, passive geometry and explicit substrate\ntap. Artifact, DRC, strict LVS and geometry gates all precede candidate\nextraction.\u003c/p\u003e\n\u003cp\u003eThe GDS must include the complete target hierarchy. Port names are matched\ncase-insensitively; each declared port must remain on its own conductor with\nthe declared connectivity.\u003c/p\u003e\n\u003cp\u003eThe functional outline is the recursive bounding box of polygons on these\nSG13G2 datatype-0 layers, including child cells and the complete routing stack:\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003e1, 3, 5, 6, 7, 8, 10, 11, 13, 14, 19, 24, 26, 28, 29, 30, 31, 32, 33, 35, 36, 40, 44, 46, 49, 50, 51, 52, 53, 55, 58, 66, 67, 90, 101, 111, 125, 126, 128, 129, 133, 134, 139, 152\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eThe maximum width is 660 µm and the maximum height is\n620 µm, measured along the submitted X and Y axes.\nFunctional area is width multiplied by height. Text, annotation and filler\nlayers are excluded. The area score below uses this same functional footprint.\u003c/p\u003e\n\u003cp\u003eCandidate post-layout extraction combines candidate-derived HBT geometry and\n\u003ccode\u003eNx\u003c/code\u003e with distributed interconnect resistance and capacitance. Drawn emitter\ngeometry is checked against the candidate; effective ordinary \u003ccode\u003enpn13G2\u003c/code\u003e\ndimensions use the simulator model defaults, with the extracted \u003ccode\u003eNx\u003c/code\u003e retained. The standard\npath disables tap extraction at the approved SG13G2 substrate boundary so\nthe compact-device body can be reconciled to \u003ccode\u003eVSS\u003c/code\u003e; strict LVS still checks\nthe finite \u003ccode\u003eptap1\u003c/code\u003e card. Device terminals, multiplicities, resistor geometry,\nMIM geometry and top-level connectivity remain candidate-derived. The\nfinite source tap is retained in pre-layout calibration, and the accepted\nmodel boundary is limited to the nominal low-frequency transfer and bias\nmeasurements in this task. No other internal-node aliases are permitted; a simulator global ground\nalias must not replace the explicit source substrate connection.\u003c/p\u003e\n6:[\"$\",\"$8\",null,{\"fallback\":[\"$\",\"p\",null,{\"children\":\"Loading published evidence…\"}],\"children\":[\"$\",\"$L10\",null,{\"task\":{\"case_path\":\"tasks/ihp-sg13g2/TO_Apr2025/cases/40_GHZ_LOW_NOISE_TIA/case.toml\",\"coefficient\":5,\"collection\":\"TO_Apr2025\",\"configuration_url\":\"/ICLayout-Bench/assets/dc96d8b5faa197829ac8b5f9258b11e647e8c3d406fce9b51a3c2d2238411d7d.txt\",\"description_html\":\"$11\",\"description_path\":\"tasks/ihp-sg13g2/TO_Apr2025/cases/40_GHZ_LOW_NOISE_TIA/problem.md\",\"hours\":3,\"id\":\"TO_Apr2025.40_GHZ_LOW_NOISE_TIA\",\"inputs\":{\"description\":{\"format\":\"text\",\"path\":\"problem.md\",\"sha256\":\"4e1bf1e9856e4ca70e160b47ab5585fe97b6da4e48c97cc3287c62ff3fada74a\"},\"netlist\":{\"format\":\"spice\",\"path\":\"materials/circuit.cdl\",\"sha256\":\"17a094c09698acfbe6a25a50d3a0292ebb82fd82b7e21269442bcdd4fa3c0d45\",\"subcircuit\":\"FDM_QNC_00_LN_TIA\"},\"performance\":{\"format\":\"spice\",\"path\":\"materials/testbench.spice\",\"sha256\":\"4973b1a2b9d7ca896646e106df79170391670961e01377f4d4dd2c2109a9dae4\"},\"simulation\":{\"format\":\"spice\",\"path\":\"materials/circuit.spice\",\"sha256\":\"62f7df0322744074c141d2bbbd3d5e9537fb06ee02729758e5f787a6de56c515\"}},\"licenses\":[{\"name\":\"LICENSE\",\"path\":\"tasks/ihp-sg13g2/TO_Apr2025/LICENSE\",\"url\":\"/ICLayout-Bench/assets/c71d239df91726fc519c6eb72d318ec65820627232b2f796219e87dcf35d0ab4.txt\"}],\"materials\":[{\"name\":\"problem.md\",
