rrorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L5\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[\"$L6\",[[\"$\",\"script\",\"script-0\",{\"src\":\"/ICLayout-Bench/_next/static/chunks/27jip_2vcvnd5.js\",\"async\":true,\"nonce\":\"$undefined\"}]],[\"$\",\"$L7\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.MetadataOutlet\",\"children\":\"$@9\"}]}]]}],{},null,false,null]},null,false,\"$a\"]},null,false,null],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Lb\",null,{\"children\":\"$Lc\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Ld\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.Metadata\",\"children\":\"$Le\"}]}]}],null]}],false]],\"m\":\"$undefined\",\"G\":[\"$f\",[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/ICLayout-Bench/_next/static/chunks/3sa54_ghi1h2h.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]]],\"S\":true,\"h\":null,\"r\":\"$undefined\",\"s\":\"$undefined\",\"a\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"2hqB741EA4j7xWQVg6hu-\"}\n10:I[1186,[\"/ICLayout-Bench/_next/static/chunks/2h60meymns2z5.js\",\"/ICLayout-Bench/_next/static/chunks/27jip_2vcvnd5.js\"],\"default\"]\na:C\n11:T2b69,\u003ch1 id=\"problem-40-ghz-tia-with-a-designed-degeneration-line\"\u003e40 GHz TIA with a designed degeneration line\u003c/h1\u003e\n\u003ch2 id=\"problem-objective\"\u003eObjective\u003c/h2\u003e\n\u003cp\u003eImplement the complete three-stage SiGe TIA, four fixed upstream RF networks and a candidate-designed degeneration transmission line. This is an explicitly adapted task; the unavailable original \u003ccode\u003eTL_20_um.s2p\u003c/code\u003e is not required or reconstructed.\u003c/p\u003e\n\u003ch3 id=\"problem-optimization-objective\"\u003eOptimization objective\u003c/h3\u003e\n\u003cp\u003eMaximize the declared quality score within the solve budget while satisfying all physical and necessary functional requirements. The first passing DRC, LVS and required electrical checks establish a feasible baseline. Continue improving the scored metrics from that baseline; a passing check or \u003ccode\u003etask_success = true\u003c/code\u003e does not mean that the quality objectives have been achieved.\u003c/p\u003e\n\u003ch2 id=\"problem-inputs-and-interface\"\u003eInputs and Interface\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003ematerials/circuit.cdl\u003c/code\u003e defines the complete physical core: three HBTs with Nx=10/5/10, five resistors and three MIM decoupler banks. Preserve all models, dimensions, multipliers and connectivity. \u003ccode\u003ematerials/circuit.spice\u003c/code\u003e is its compact-model interface with the nominal reference-line subcircuit. The public amplifier ports are RFIN, RFOUT, VCC1, VCC2, VCC3 and GND. Additional core terminals expose the fixed choke/peaking networks and the designed degeneration line.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003erf-macros.gds\u003c/code\u003e, \u003ccode\u003erf-macros.json\u003c/code\u003e and \u003ccode\u003erf-models.spice\u003c/code\u003e supply three fixed choke cells, a fixed peaking cell and the BEOL ground context. Their model response comes from the original upstream tables, including the original 0.1-ohm peaking series element. Preserve their geometry, unique instance counts, ordered landings and relative pose.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003eline-design.json\u003c/code\u003e declares the RF_DEGEN_DESIGN cell and isolated physical design window. The reviewed process resource \u003ccode\u003erf-line-rlc\u003c/code\u003e defines its calibrated cross-section. \u003ccode\u003eline-reference.spice\u003c/code\u003e provides only the paired source's nominal 40-um electrical line. It is replaced by the evaluator's geometry-derived model during candidate scoring.\u003c/p\u003e\n\u003ch2 id=\"problem-operating-conditions\"\u003eOperating Conditions\u003c/h2\u003e\n\u003cp\u003eUse typical HBT/resistor/capacitor models at 26.85 °C. Physical VCC1=2.1 V, VCC2=2.1 V, VCC3=1.7 V, corresponding to original V3/V2/V1 respectively. Both RF ports have 50-ohm references and 5-uF fixture DC blocks. Front- and back-annotation use the same 157-point linear sweep from 1 to 40 GHz and the same fixture. The three physical decoupler banks are 30x60 um with m=2. The fixture includes 1-Tohm numerical reference shunts.\u003c/p\u003e\n\u003ch2 id=\"problem-physical-requirements\"\u003ePhysical Requirements\u003c/h2\u003e\n\u003cp\u003eSubmit one top cell \u003ccode\u003eFDM_QNC_00_LN_TIA\u003c/code\u003e, at most 32 MiB, within the declared functional outline. Pass the full native DRC, strict named-port LVS, fixed-macro verification and designed-line geometry checks. Only explicitly enumerated inherited curved RF/package markers have exceptions; functional widths, spacings, enclosures and circuit connections remain checked.\u003c/p\u003e\n\u003cp\u003eDraw the designed line in exactly one RF_DEGEN_DESIGN cell. In local coordinates it contains one TopMetal2 (134/0) rectangle starting at (0,0), with fixed width 15 um and drawn length equal to the modeled length plus two 2-um terminal landings. The modeled interior length is your design variable, 20–200 um. Supply its complete Metal1 (8/0) return plane: 90-um transverse width, centered below the strip, extending 25 um past each interior model plane. Include the process's mandatory 0.18-um ground slots at its declared 28-um pitch and 14-um offset from the return-plane lower corner. No additional geometry or labels belongs inside this cell.\u003c/p\u003e\n\u003cp\u003ePlace the line and its 10-um isolation guard within the declared window. Only declared terminal/access regions may contain added wiring or vias. Connect the input landing to RF_DEG_INNER, and physically connect the far landing and return plane to GND. The Metal1 return must have a continuous same-layer metal path to the fixed RF_GROUND anchor declared in \u003ccode\u003eline-design.json\u003c/code\u003e; labels do not establish that connection. Every conductor must be drawn in the candidate; the evaluator does not add vias, ground or missing connections. Width changes, bends, branches, duplicated bodies and unmodeled interior conductors are outside this calibrated design space.\u003c/p\u003e\n\u003cp\u003eThe evaluator checks original geometry, then exposes only the existing terminal landings in an extraction copy. Native LVS and KPEX retain the entire candidate core and nominal local coupling capacitance. The designed line is represented by a positive, DC-accurate Foster RLC ladder derived from its measured length; two passive RL branches model conductor skin effects. The cross-section is calibrated against the pinned PDK's two-port 880-um TM2-over-M1 field data. Uniform-length scaling, sparse ground perforations and ladder discretization are explicit approximations, with calibration evidence and numerical limits in the process resource. Independently simulated short-line/bend/width-change accuracy is not claimed. Core free-wire R/L and arbitrary new full-wave interactions with fixed macros are outside the selected model scope.\u003c/p\u003e\n\u003ch2 id=\"problem-electrical-requirements-and-scoring\"\u003eElectrical Requirements and Scoring\u003c/h2\u003e\n\u003cp\u003eAll operating-point and RF measurements must be finite. Squared reflections and peak-to-peak delay are nonnegative; there is no minimum quality score for feasibility.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eDegradation scale\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eband_transimpedance\u003c/code\u003e: minimum \u003ccode\u003e20 log10(abs(50*S21/(1-S11)))\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e50%\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e3 dB\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003einput_reflection\u003c/code\u003e: maximum input reflected-power fraction \u003ccode\u003eabs(S11)^2\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e30%\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.05\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_reflection\u003c/code\u003e: maximum output reflected-power fraction \u003ccode\u003eabs(S22)^2\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e20%\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.05\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eFor each metric, equal or better performance than the paired source earns quality 1; positive degradation d earns \u003ccode\u003escale/(scale+d)\u003c/code\u003e. The final score is 100 times the weighted geometric mean after physical and execution validity checks. Band gain, group-delay ripple, supply power and fixed-frame area are diagnostics. Noise is not scored because the inherited deterministic RF tables do not establish complete passive thermal-noise accuracy. A reference establishes feasibility, without a high-performance requirement.\u003c/p\u003e\n\u003ch2 id=\"problem-tools-and-submission\"\u003eTools and Submission\u003c/h2\u003e\n\u003cp\u003eSolve budget: \u003cstrong\u003e1 hour\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eUse the existing open EDA image and declared IHP resources. KLayout checks geometry and native circuits, KPEX provides core coupling capacitance and ngspice simulates the full RF network. Submit \u003ccode\u003eoutput/final.gds\u003c/code\u003e; candidate-supplied electrical models cannot determine the score.\u003c/p\u003e\n\u003ch3 id=\"problem-solve-workflow\"\u003eSolve workflow\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eRead the declared circuit and materials, \u003ccode\u003e/protocol/task.json\u003c/code\u003e for paths, constraints and reviewed resources, and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e for capabilities and helper commands. Task inputs under \u003ccode\u003e/task\u003c/code\u003e and resources under \u003ccode\u003e/resources\u003c/code\u003e are read-only; construct the layout in \u003ccode\u003e/workspace\u003c/code\u003e with the declared tools. With layout MCP, paths and commands refer to the remote EDA workspace. Create your own implementation with real devices, interconnect and pins, using your own tool loop without delegating to other agents; reference layouts and author code are not solver inputs.\u003c/li\u003e\n\u003cli\u003eInspect \u003ccode\u003eresources.external\u003c/code\u003e before using external tools. Each command starts a fresh shell: when tool modules are declared, source \u003ccode\u003e/usr/share/Modules/init/bash\u003c/code\u003e and load the selected tool's modules; export its declared \u003ccode\u003etool_environment\u003c/code\u003e settings in that same command. Repeat as needed and use batch or headless operation. Local manuals, command references, and release notes may be available within the declared EDA installation and PDK resource directories. Locate these resources through \u003ccode\u003e/protocol/task.json\u003c/code\u003e and consult the documentation for the installed tool version when diagnosing unfamiliar syntax or tool failures.\u003c/li\u003e\n\u003cli\u003eGenerate an initial candidate and submit a snapshot early. When \u003ccode\u003eprocess-feedback\u003c/code\u003e is available, check the current GDS with layout MCP \u003ccode\u003echeck\u003c/code\u003e or \u003ccode\u003epython -I /protocol/process_check.py\u003c/code\u003e before the final submission. This runs the final evaluator's complete plan and returns engineering diagnostics and candidate measurements, without scores or normalized quality factors. Checks have no count limit and consume the same wall-clock budget. Inspect the physical and functional results and all scored metrics; successful tool execution alone does not establish requirement satisfaction. Read paginated diagnostics with \u003ccode\u003ereport\u003c/code\u003e when using MCP. Local exploratory checks do not replace this complete check.\u003c/li\u003e\n\u003cli\u003eUse the remaining time for measured improvements to the declared quality objectives. Identify the limiting scored metrics, make targeted layout changes, regenerate and check the candidate, and compare measurements with the previous candidate and the stated scoring targets and trade-offs. Preserve the best valid candidate and revert changes that worsen the overall objective. Repeat while time and useful improvements remain; passing validity checks alone is not a stopping condition.\u003c/li\u003e\n\u003cli\u003eStop optimization when the budget expires, all declared quality objectives are achieved, or measured trials support convergence. If stopping early, explain the changes tried, the metric comparisons and the remaining limitations. Track remaining time through session status. At soft-budget expiry, finish or cancel already-started work and submit immediately; do not start another command, check or optimization round. If an MCP execution is running, use \u003ccode\u003epoll\u003c/code\u003e with its \u003ccode\u003eexecution_id\u003c/code\u003e and the returned \u003ccode\u003enext_offset\u003c/code\u003e as \u003ccode\u003eoffset\u003c/code\u003e until completion, or cancel it and wait for it to stop.\u003c/li\u003e\n\u003cli\u003eFinish or cancel outstanding work, restore your best candidate to the declared output path, and explicitly submit it before ending the session. With layout MCP \u003ccode\u003esubmit\u003c/code\u003e, remove the \u003ccode\u003e/workspace/\u003c/code\u003e prefix from \u003ccode\u003eoutput.path\u003c/code\u003e; with the container interface, run \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e. Wait for the receipt: only the last accepted snapshot is judged, and writing a file alone is not submission. Acceptance confirms delivery; the framework independently evaluates validity and quality after the session.\u003c/li\u003e\n\u003c/ol\u003e\n12:T5a8,\u003cp\u003eAll operating-point and RF measurements must be finite. Squared reflections and peak-to-peak delay are nonnegative; there is no minimum quality score for feasibility.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eDegradation scale\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eband_transimpedance\u003c/code\u003e: minimum \u003ccode\u003e20 log10(abs(50*S21/(1-S11)))\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e50%\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e3 dB\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003einput_reflection\u003c/code\u003e: maximum input reflected-power fraction \u003ccode\u003eabs(S11)^2\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e30%\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.05\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_reflection\u003c/code\u003e: maximum output reflected-power fraction \u003ccode\u003eabs(S22)^2\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e20%\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.05\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eFor each metric, equal or better performance than the paired source earns quality 1; positive degradation d earns \u003ccode\u003escale/(scale+d)\u003c/code\u003e. The final score is 100 times the weighted geometric mean after physical and execution validity checks. Band gain, group-delay ripple, supply power and fixed-frame area are diagnostics. Noise is not scored because the inherited deterministic RF tables do not establish complete passive thermal-noise accuracy. A reference establishes feasibility, without a high-performance requirement.\u003c/p\u003e\n13:T4ee,\u003cp\u003e\u003ccode\u003ematerials/circuit.cdl\u003c/code\u003e defines the complete physical core: three HBTs with Nx=10/5/10, five resistors and three MIM decoupler banks. Preserve all models, dimensions, multipliers and connectivity. \u003ccode\u003ematerials/circuit.spice\u003c/code\u003e is its compact-model interface with the nominal reference-line subcircuit. The public amplifier ports are RFIN, RFOUT, VCC1, VCC2, VCC3 and GND. Additional core terminals expose the fixed choke/peaking networks and the designed degeneration line.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003erf-macros.gds\u003c/code\u003e, \u003ccode\u003erf-macros.json\u003c/code\u003e and \u003ccode\u003erf-models.spice\u003c/code\u003e supply three fixed choke cells, a fixed peaking cell and the BEOL ground context. Their model response comes from the original upstream tables, including the original 0.1-ohm peaking series element. Preserve their geometry, unique instance counts, ordered landings and relative pose.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003eline-design.json\u003c/code\u003e declares the RF_DEGEN_DESIGN cell and isolated physical design window. The reviewed process resource \u003ccode\u003erf-line-rlc\u003c/code\u003e defines its calibrated cross-section. \u003ccode\u003eline-reference.spice\u003c/code\u003e provides only the paired source's nominal 40-um electrical line. It is replaced by the evaluator's geometry-derived model during candidate scoring.\u003c/p\u003e\n14:Ta01,\u003cp\u003eSubmit one top cell \u003ccode\u003eFDM_QNC_00_LN_TIA\u003c/code\u003e, at most 32 MiB, within the declared functional outline. Pass the full native DRC, strict named-port LVS, fixed-macro verification and designed-line geometry checks. Only explicitly enumerated inherited curved RF/package markers have exceptions; functional widths, spacings, enclosures and circuit connections remain checked.\u003c/p\u003e\n\u003cp\u003eDraw the designed line in exactly one RF_DEGEN_DESIGN cell. In local coordinates it contains one TopMetal2 (134/0) rectangle starting at (0,0), with fixed width 15 um and drawn length equal to the modeled length plus two 2-um terminal landings. The modeled interior length is your design variable, 20–200 um. Supply its complete Metal1 (8/0) return plane: 90-um transverse width, centered below the strip, extending 25 um past each interior model plane. Include the process's mandatory 0.18-um ground slots at its declared 28-um pitch and 14-um offset from the return-plane lower corner. No additional geometry or labels belongs inside this cell.\u003c/p\u003e\n\u003cp\u003ePlace the line and its 10-um isolation guard within the declared window. Only declared terminal/access regions may contain added wiring or vias. Connect the input landing to RF_DEG_INNER, and physically connect the far landing and return plane to GND. The Metal1 return must have a continuous same-layer metal path to the fixed RF_GROUND anchor declared in \u003ccode\u003eline-design.json\u003c/code\u003e; labels do not establish that connection. Every conductor must be drawn in the candidate; the evaluator does not add vias, ground or missing connections. Width changes, bends, branches, duplicated bodies and unmodeled interior conductors are outside this calibrated design space.\u003c/p\u003e\n\u003cp\u003eThe evaluator checks original geometry, then exposes only the existing terminal landings in an extraction copy. Native LVS and KPEX retain the entire candidate core and nominal local coupling capacitance. The designed line is represented by a positive, DC-accurate Foster RLC ladder derived from its measured length; two passive RL branches model conductor skin effects. The cross-section is calibrated against the pinned PDK's two-port 880-um TM2-over-M1 field data. Uniform-length scaling, sparse ground perforations and ladder discretization are explicit approximations, with calibration evidence and numerical limits in the process resource. Independently simulated short-line/bend/width-change accuracy is not claimed. Core free-wire R/L and arbitrary new full-wave interactions with fixed macros are outside the selected model scope.\u003c/p\u003e\n15:T102f,\u003cp\u003eSolve budget: \u003cstrong\u003e1 hour\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eUse the existing open EDA image and declared IHP resources. KLayout checks geometry and native circuits, KPEX provides core coupling capacitance and ngspice simulates the full RF network. Submit \u003ccode\u003eoutput/final.gds\u003c/code\u003e; candidate-supplied electrical models cannot determine the score.\u003c/p\u003e\n\u003ch3\u003eSolve workflow\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eRead the declared circuit and materials, \u003ccode\u003e/protocol/task.json\u003c/code\u003e for paths, constraints and reviewed resources, and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e for capabilities and helper commands. Task inputs under \u003ccode\u003e/task\u003c/code\u003e and resources under \u003ccode\u003e/resources\u003c/code\u003e are read-only; construct the layout in \u003ccode\u003e/workspace\u003c/code\u003e with the declared tools. With layout MCP, paths and commands refer to the remote EDA workspace. Create your own implementation with real devices, interconnect and pins, using your own tool loop without delegating to other agents; reference layouts and author code are not solver inputs.\u003c/li\u003e\n\u003cli\u003eInspect \u003ccode\u003eresources.external\u003c/code\u003e before using external tools. Each command starts a fresh shell: when tool modules are declared, source \u003ccode\u003e/usr/share/Modules/init/bash\u003c/code\u003e and load the selected tool's modules; export its declared \u003ccode\u003etool_environment\u003c/code\u003e settings in that same command. Repeat as needed and use batch or headless operation. Local manuals, command references, and release notes may be available within the declared EDA installation and PDK resource directories. Locate these resources through \u003ccode\u003e/protocol/task.json\u003c/code\u003e and consult the documentation for the installed tool version when diagnosing unfamiliar syntax or tool failures.\u003c/li\u003e\n\u003cli\u003eGenerate an initial candidate and submit a snapshot early. When \u003ccode\u003eprocess-feedback\u003c/code\u003e is available, check the current GDS with layout MCP \u003ccode\u003echeck\u003c/code\u003e or \u003ccode\u003epython -I /protocol/process_check.py\u003c/code\u003e before the final submission. This runs the final evaluator's complete plan and returns engineering diagnostics and candidate measurements, without scores or normalized quality factors. Checks have no count limit and consume the same wall-clock budget. Inspect the physical and functional results and all scored metrics; successful tool execution alone does not establish requirement satisfaction. Read paginated diagnostics with \u003ccode\u003ereport\u003c/code\u003e when using MCP. Local exploratory checks do not replace this complete check.\u003c/li\u003e\n\u003cli\u003eUse the remaining time for measured improvements to the declared quality objectives. Identify the limiting scored metrics, make targeted layout changes, regenerate and check the candidate, and compare measurements with the previous candidate and the stated scoring targets and trade-offs. Preserve the best valid candidate and revert changes that worsen the overall objective. Repeat while time and useful improvements remain; passing validity checks alone is not a stopping condition.\u003c/li\u003e\n\u003cli\u003eStop optimization when the budget expires, all declared quality objectives are achieved, or measured trials support convergence. If stopping early, explain the changes tried, the metric comparisons and the remaining limitations. Track remaining time through session status. At soft-budget expiry, finish or cancel already-started work and submit immediately; do not start another command, check or optimization round. If an MCP execution is running, use \u003ccode\u003epoll\u003c/code\u003e with its \u003ccode\u003eexecution_id\u003c/code\u003e and the returned \u003ccode\u003enext_offset\u003c/code\u003e as \u003ccode\u003eoffset\u003c/code\u003e until completion, or cancel it and wait for it to stop.\u003c/li\u003e\n\u003cli\u003eFinish or cancel outstanding work, restore your best candidate to the declared output path, and explicitly submit it before ending the session. With layout MCP \u003ccode\u003esubmit\u003c/code\u003e, remove the \u003ccode\u003e/workspace/\u003c/code\u003e prefix from \u003ccode\u003eoutput.path\u003c/code\u003e; with the container interface, run \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e. Wait for the receipt: only the last accepted snapshot is judged, and writing a file alone is not submission. Acceptance confirms delivery; the framework independently evaluates validity and quality after the session.\u003c/li\u003e\n\u003c/ol\u003e\n6:[\"$\",\"$8\",null,{\"fallback\":[\"$\",\"p\",null,{\"children\":\"Loading published evidence…\"}],\"children\":[\"$\",\"$L10\",null,{\"task\":{\"case_path\":\"tasks/ihp-sg13g2/TO_Apr2025/cases/40_GHZ_LOW_NOISE_TIA/case.toml\",\"coefficient\":5,\"collection\":\"TO_Apr2025\",\"configuration_url\":\"/ICLayout-Bench/assets/2f99b4ad0d11fc310aabe56f6829d203d7fa93ccc2e57eeae46fee67bd1689ee.txt\",\"description_html\":\"$11\",\"description_path\":\"tasks/ assets/bcd4e34a2294aded9afe2ad0c08f62daf64f74da4852636f756c62375c6287c6.txt\"},{\"name\":\"materials/circuit.spice\",\"role\":\"simulation\",\"url\":\"/ICLayout-Bench/assets/4a65bd7bac9b2c31d59dd865dbd3e00b0bc152e93bae6a57af343ecbceb56c62.txt\"},{\"name\":\"materials/testbench.spice\",\"role\":\"performance\",\"url\":\"/ICLayout-Bench/assets/2478797d022e38fc1e9794ee70f183f2882e43cb3e889278ff80ee98ce3d186f.txt\"},{\"name\":\"materials/rf-macros.gds\",\"role\":\"macrolibrary\",\"url\":\"/ICLayout-Bench/assets/f1155e835fbdeaafffa240099bd85d62d5980dcb5da0d29a7b10d854cbbc6acd.gds\"},{\"name\":\"materials/rf-macros.json\",\"role\":\"macrospec\",\"url\":\"/ICLayout-Bench/assets/4adf387b6a9499f06bf341c18693106d89f821879ce01cacd1668b2f1167ece8.txt\"},{\"name\":\"materials/rf-models.spice\",\"role\":\"macros\",\"url\":\"/ICLayout-Bench/assets/ac41fa00f254d9174d2211dd1980e273b4f402e4a8ed0b828415bc857c5f2917.txt\"},{\"name\":\"materials/line-design.json\",\"role\":\"line_spec\",\"url\":\"/ICLayout-Bench/assets/60846c37b353158a24444eec949daac9fa26eee323349b329140106b8717d5b7.txt\"},{\"name\":\"materials/line-reference.spice\",\"role\":\"line_reference\",\"url\":\"/ICLayout-Bench/assets/909536e269bb790ff7b69cf667b2a89bfff77c4fac3858a6f9cd2e44a618c66b.txt\"}],\"metrics\":[{\"aggregation\":\"max\",\"category\":\"physical\",\"direction\":\"minimize\",\"id\":\"functional_area\",\"observations\":[\"geometry:area\"],\"unit\":\"um2\"},{\"aggregation\":\"min\",\"baseline\":[\"source_rf:band_transimpedance\"],\"category\":\"performance\",\"dimension\":\"response\",\"direction\":\"maximize\",\"id\":\"band_transimpedance\",\"normalization\":\"degradation\",\"observations\":[\"rf:band_transimpedance\"],\"scale\":3,\"unit\":\"dBohm\"},{\"aggregation\":\"max\",\"category\":\"performance\",\"direction\":\"minimize\",\"id\":\"delay_ripple\",\"observations\":[\"rf:delay_ripple\"],\"requirement\":{\"lower\":0,\"rationale\":\"A squared reflection magnitude or peak-to-peak delay range is nonnegative; its size is scored continuously.\"},\"unit\":\"s\"},{\"aggregation\":\"max\",\"baseline\":[\"source_rf:input_reflection\"],\"category\":\"performance\",\"dimension\":\"response\",\"direction\":\"minimize\",\"id\":\"input_reflection\",\"normalization\":\"degradation\",\"observations\":[\"rf:input_reflection\"],\"requirement\":{\"lower\":0,\"rationale\":\"A squared reflection magnitude or peak-to-peak delay range is nonnegative; its size is scored continuously.\"},\"scale\":0.05,\"unit\":\"1\"},{\"aggregation\":\"max\",\"baseline\":[\"source_rf:output_reflection\"],\"category\":\"performance\",\"dimension\":\"response\",\"direction\":\"minimize\",\"id\":\"output_reflection\",\"normalization\":\"degradation\",\"observations\":[\"rf:output_reflection\"],\"requirement\":{\"lower\":0,\"rationale\":\"A squared reflection magnitude or peak-to-peak delay range is nonnegative; its size is scored continuously.\"},\"scale\":0.05,\"unit\":\"1\"},{\"aggregation\":\"min\",\"category\":\"performance\",\"direction\":\"maximize\",\"id\":\"band_gain\",\"observations\":[\"rf:band_gain\"],\"unit\":\"dB\"},{\"aggregation\":\"max\",\"category\":\"performance\",\"direction\":\"minimize\",\"id\":\"supply_power\",\"observations\":[\"rf:supply_power\"],\"unit\":\"W\"}],\"pdk\":\"ihp-sg13g2\",\"reader\":{\"category\":\"Amplifiers \u0026 RF\",\"summary\":\"Three-stage upstream TIA with four fixed RF networks and a physically designed, calibrated uniform degeneration line.\",\"title\":\"40 GHz SiGe TIA with candidate-designed degeneration line\"},\"scoring\":{\"area_metric\":\"functional_area\",\"area_target\":1210000,\"method\":\"layout\",\"rationale\":\"Continuous 1-40 GHz transimpedance and matching, paired with the source using the nominal 40-um line. Actual 20/80/120-um layouts show that output matching reaches full credit at 120 um, while transimpedance and input matching remain at quality 0.39-0.54; assign the harder metrics 50% and 30%, and output matching 20%. Bias, supply, delay and fixed-frame area earn no credit. A valid reference has no minimum quality-score requirement.\",\"weights\":{\"band_transimpedance\":0.5,\"functional_area\":0,\"input_reflection\":0.3,\"output_reflection\":0.2}},\"sections\":{\"Electrical Requirements and Scoring\":\"$12\",\"Inputs and Interface\":\"$13\",\"Objective\":\"\u003cp\u003eImplement the complete three-stage SiGe TIA, four fixed upstream RF networks and a candidate-designed degeneration transmission line. This is an explicitly adapted task; the unavailable original \u003ccode\u003eTL_20_um.s2p\u003c/code\u003e is not required or reconstructed.\u003c/p\u003e\\n\u003ch3\u003eOptimization objective\u003c/h3\u003e\\n\u003cp\u003eMaximize the declared quality score within the solve budget while satisfying all physical and necessary functional requirements. The first passing DRC, LVS and required electrical checks establish a feasible baseline. Continue improving the scored metrics from that baseline; a passing check or \u003ccode\u003etask_success = true\u003c/code\u003e does not mean that the quality objectives have been achieved.\u003c/p\u003e\\n\",\"Operating Conditions\":\"\u003cp\u003eUse typical HBT/resistor/capacitor models at 26.85 °C. Physical VCC1=2.1 V, VCC2=2.1 V, VCC3=1.7 V, corresponding to original V3/V2/V1 respectively. Both RF ports have 50-ohm references and 5-uF fixture DC blocks. Front- and back-annotation use the same 157-point linear sweep from 1 to 40 GHz and the same fixture. The three physical decoupler banks are 30x60 um with m=2. The fixture includes 1-Tohm numerical reference shunts.\u003c/p\u003e\\n\",\"Physical Requirements\":\"$14\",\"Tools and Submission\":\"$15\"},\"source_url\":\"https://github.com/IHP-GmbH/TO_Apr2025/tree/63e203a0eccfb6028a1a0a8364553e4e979b55b3/40_GHZ_LOW_NOISE_TIA\",\"status\":\"qualified\",\"title\":\"40 GHz SiGe TIA with candidate-designed degeneration line\",\"core\":false},\"catalog\":{\"tasks\":[],\"runs\":[],\"experiments\":[],\"contexts\":[],\"boards\":[]},\"previewRun\":null,\"preview\":null,\"evidenceError\":false}]}]\nc:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n16:I[27201,[\"/ICLayout-Bench/_next/static/chunks/2h60meymns2z5.js\"],\"IconMark\"]\n9:null\ne:[[\"$\",\"title\",\"0\",{\"children\":\"ICLayout-Bench | Circuit layout intelligence\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Independent evaluation of AI for integrated circuit layout. Compare model scores, explore circuit performance and inspect generated layouts.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/ICLayout-Bench/brand/iclayout-bench.svg\",\"type\":\"image/svg+xml\",\"sizes\":\"any\"}],[\"$\",\"$L16\",\"3\",{}]]\n"])</script></body></html>
