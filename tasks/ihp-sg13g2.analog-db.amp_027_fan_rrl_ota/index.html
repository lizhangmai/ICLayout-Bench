e: netlist input.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ematerials/circuit.spice\u003c/code\u003e: simulation input.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ematerials/testbench.spice\u003c/code\u003e: performance input.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eOrdered ports: \u003ccode\u003evinp vinn voutp voutn vdd vss vb1 vb2 vb3 vb4\u003c/code\u003e. Preserve these named connections.\u003c/p\u003e\n\u003cp\u003eThe native CDL and simulator SPICE describe the same circuit. VINP/VINN are\nthe differential inputs; VOUTP/VOUTN are outputs; VDD/VSS are supply/return;\nVB1 through VB4 are bias ports. Independent bias sources are outside the physical core. Physical well/substrate taps are included.\u003c/p\u003e\n\u003ch2 id=\"problem-operating-conditions\"\u003eOperating Conditions\u003c/h2\u003e\n\u003cp\u003eTT, 27 C, VDD=1.2 V, input common mode 0.6 V; vb1/vb2/vb3/vb4=0.45/0.75/0.55/0.6 V. Loads are 1 and 10 pF per output. Differential steps are ±20 uV at 10 us, returning at 40.02 us; 5 uA per output common-mode injection runs from 60 to 61.02 us. Maximum transient step is 2 ns, duration 100 us. This is an open-loop signal test with the internal CMFB operating.\u003c/p\u003e\n\u003ch2 id=\"problem-physical-requirements\"\u003ePhysical Requirements\u003c/h2\u003e\n\u003cp\u003eSubmit a nonempty GDSII of at most 10485760 bytes.\nNative IHP DRC and strict named-interface LVS must pass. Keep the supplied tap geometry and compact-device parameters consistent. Functional device, well, contact and routing layers define area; annotation layers do not. The bounding rectangle must fit 5000 by 1000 um. No DRC waivers apply.\u003c/p\u003e\n\u003cp\u003eMagic extracts candidate interconnect resistance/capacitance and device\njunction geometry. Wells/substrate are connected to physical tap rails; source\nsimulation retains finite tap models. Distributed substrate, statistical\nmismatch and manufacturing signoff are outside this nominal contract.\u003c/p\u003e\n\u003cp\u003eThe scored functional layer/datatype pairs are \u003ccode\u003e[[1, 0], [3, 0], [5, 0], [6, 0], [7, 0], [8, 0], [10, 0], [11, 0], [13, 0], [14, 0], [19, 0], [24, 0], [26, 0], [28, 0], [29, 0], [30, 0], [31, 0], [32, 0], [33, 0], [35, 0], [36, 0], [40, 0], [44, 0], [46, 0], [49, 0], [50, 0], [51, 0], [52, 0], [53, 0], [55, 0], [58, 0], [66, 0], [67, 0], [90, 0], [101, 0], [111, 0], [125, 0], [126, 0], [128, 0], [129, 0], [133, 0], [134, 0], [139, 0], [152, 0]]\u003c/code\u003e.\u003c/p\u003e\n\u003ch2 id=\"problem-electrical-requirements-and-scoring\"\u003eElectrical Requirements and Scoring\u003c/h2\u003e\n\u003cp\u003eAll declared measurements must be finite and use the extracted candidate. Gain and phase at 10 Hz/100 kHz, output bias, supply power, small differential step response, common-mode kick and recovery are observed by the supplied deck. Step response subtracts 8–9 us baseline from 38–39 us response. The common-mode baseline is 58–59 us; kick peak is 60–62 us and residual is 98–99 us. Continuous quality uses independently simulated same-condition source observations. The physical-domain checks are nonnegative supplied power and nonnegative absolute errors; they are not upstream specifications.\u003c/p\u003e\n\u003cp\u003eQ is 1035.78 um2 divided by functional area. The anchor sums (W+2.4)(L+2.4) for each MOS and 3.2² um2 for each local tap and one global tap, then applies a 50% routing allowance. It is an engineering estimate, not a foundry minimum. Response metrics use source-paired dB gain, target phase (180 degree scale), target step (1 mV scale), and inverse absolute common-mode error (1 uV floor); bias uses a 1.2 V target scale; power uses an inverse ratio with 1 pW floor. Coefficient 6 reflects the complete signal amplifier coupled to a transistor common-mode recovery loop. Qualification does not require matching paper performance and does not cover PVT, noise, mismatch or an RRL system.\u003c/p\u003e\n\u003cp\u003ePhysical checks and declared functional bounds remain mandatory. Quality has no\nfixed allowed-degradation threshold. Each \u003ccode\u003esource_*\u003c/code\u003e job simulates the declared\nsource circuit with exactly the same testbench, model resources, parameters,\nload and measurement window as its paired extracted-candidate job. A source\nobservation is the 100-point electrical baseline; it is independent of the\nsubmitted GDS. All individual pairs are retained in the evaluation report.\u003c/p\u003e\n\u003cp\u003eFor a post-layout observation x and its source observation b:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eMaximize: q = x/b; minimize: q = b/x. When a numerical scale s is declared,\nuse (x+s)/(b+s) or its inverse. This handles zero-valued error measurements;\ns is a normalization floor, not an allowed degradation or pass threshold.\u003c/li\u003e\n\u003cli\u003eAmplitude dB: q = 10^((x-b)/20) for maximize, its inverse for minimize.\u003c/li\u003e\n\u003cli\u003eTarget: q = 1/(1+abs(x-b)/s), with a declared physical scale s. Signed and\nzero-valued operating points are never divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eScoring uses \u003ccode\u003elayout\u003c/code\u003e. A metric uses its worst paired quality q. The score is\nS = 100 * product(q_i ** w_i), including area quality\nq_area = area_reference / candidate_functional_area. The weights below sum to\none. Dimensions describe measurements but do not determine their weights.\nPhysical or functional rejection scores zero; missing or invalid measurements\nproduce an unknown score, including measurements with zero weight.\nSource-equivalent performance at the area reference scores 100; improvements\ncan exceed 100. A weight expresses a tradeoff, not a hard acceptance limit.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eDefinition / observation\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eQuality / dimension\u003c/th\u003e\n\u003cth\u003eFunctional bounds\u003c/th\u003e\n\u003cth\u003eScale\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eFunctional bounding-rectangle area\u003c/td\u003e\n\u003ctd\u003eum2\u003c/td\u003e\n\u003ctd\u003earea quality Q\u003c/td\u003e\n\u003ctd\u003epositive area\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ecm_bias_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003e(v(outp)+v(outn))/2\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target / bias\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e1.2\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edm_bias_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003ev(outp)-v(outn)\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target / bias\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e1.2\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003e-v(vdd)*i(VDD)-v(vb1)*i(VB1)-v(vb2)*i(VB2)-v(vb3)*i(VB3)-v(vb4)*i(VB4)\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eminimize / ratio / supply\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003egain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003efind gain at=10\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003emaximize / db20 / response\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003egain_100khz_db\u003c/code\u003e\u00 e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ecm_min_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003emin cm from=0 to=100u\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003ediagnostic\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ecm_max_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003emax cm from=0 to=100u\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003ediagnostic\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eApply each row to every declared load/tone condition. Pair each candidate\nobservation with its \u003ccode\u003esource_\u003c/code\u003e job under the identical condition. The supplied\ndeck defines intermediate vectors used in the expressions above.\u003c/p\u003e\n\u003ch3 id=\"problem-score-weights\"\u003eScore weights\u003c/h3\u003e\n\u003cp\u003eDifferential OTA cores: differential response 49.5%; common-mode recovery 22.5%; bias 4.5%; power 13.5%; area 10%. Each objective's weight is divided equally among its metrics.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003egain_100khz_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.123750000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003egain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.123750000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ephase_100khz_deg\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.123750000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estep_response_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.123750000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ecm_kick_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.112500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ecm_recovery_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.112500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ecm_bias_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.022500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edm_bias_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.022500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.135000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch2 id=\"problem-tools-and-submission\"\u003eTools and Submission\u003c/h2\u003e\n\u003cp\u003eSolve budget: \u003cstrong\u003e6 hours\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eUse the reviewed IHP resources. Submit only the GDS with top cell amp_027_fan_rrl_ota. Evaluation runs native DRC/LVS, area, candidate-derived Magic RC extraction and ngspice post-layout observations. The source circuit is independently simulated for scoring.\u003c/p\u003e\n\u003cp\u003eDiscover the frozen task, resources and submission interface through\n\u003ccode\u003e/protocol/task.json\u003c/code\u003e, \u003ccode\u003e/protocol/resources.json\u003c/code\u003e and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e.\nDeclared inputs are under \u003ccode\u003e/task\u003c/code\u003e. Write \u003ccode\u003e/workspace/output/final.gds\u003c/code\u003e\nand explicitly submit with \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e. Creating the file\nalone does not submit it. Only feedback supported by the active harness is available.\u003c/p\u003e\n12:T1ac7,\u003cp\u003eAll declared measurements must be finite and use the extracted candidate. Gain and phase at 10 Hz/100 kHz, output bias, supply power, small differential step response, common-mode kick and recovery are observed by the supplied deck. Step response subtracts 8–9 us baseline from 38–39 us response. The common-mode baseline is 58–59 us; kick peak is 60–62 us and residual is 98–99 us. Continuous quality uses independently simulated same-condition source observations. The physical-domain checks are nonnegative supplied power and nonnegative absolute errors; they are not upstream specifications.\u003c/p\u003e\n\u003cp\u003eQ is 1035.78 um2 divided by functional area. The anchor sums (W+2.4)(L+2.4) for each MOS and 3.2² um2 for each local tap and one global tap, then applies a 50% routing allowance. It is an engineering estimate, not a foundry minimum. Response metrics use source-paired dB gain, target phase (180 degree scale), target step (1 mV scale), and inverse absolute common-mode error (1 uV floor); bias uses a 1.2 V target scale; power uses an inverse ratio with 1 pW floor. Coefficient 6 reflects the complete signal amplifier coupled to a transistor common-mode recovery loop. Qualification does not require matching paper performance and does not cover PVT, noise, mismatch or an RRL system.\u003c/p\u003e\n\u003cp\u003ePhysical checks and declared functional bounds remain mandatory. Quality has no\nfixed allowed-degradation threshold. Each \u003ccode\u003esource_*\u003c/code\u003e job simulates the declared\nsource circuit with exactly the same testbench, model resources, parameters,\nload and measurement window as its paired extracted-candidate job. A source\nobservation is the 100-point electrical baseline; it is independent of the\nsubmitted GDS. All individual pairs are retained in the evaluation report.\u003c/p\u003e\n\u003cp\u003eFor a post-layout observation x and its source observation b:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eMaximize: q = x/b; minimize: q = b/x. When a numerical scale s is declared,\nuse (x+s)/(b+s) or its inverse. This handles zero-valued error measurements;\ns is a normalization floor, not an allowed degradation or pass threshold.\u003c/li\u003e\n\u003cli\u003eAmplitude dB: q = 10^((x-b)/20) for maximize, its inverse for minimize.\u003c/li\u003e\n\u003cli\u003eTarget: q = 1/(1+abs(x-b)/s), with a declared physical scale s. Signed and\nzero-valued operating points are never divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eScoring uses \u003ccode\u003elayout\u003c/code\u003e. A metric uses its worst paired quality q. The score is\nS = 100 * product(q_i ** w_i), including area quality\nq_area = area_reference / candidate_functional_area. The weights below sum to\none. Dimensions describe measurements but do not determine their weights.\nPhysical or functional rejection scores zero; missing or invalid measurements\nproduce an unknown score, including measurements with zero weight.\nSource-equivalent performance at the area reference scores 100; improvements\ncan exceed 100. A weight expresses a tradeoff, not a hard acceptance limit.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eDefinition / observation\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eQuality / dimension\u003c/th\u003e\n\u003cth\u003eFunctional bounds\u003c/th\u003e\n\u003cth\u003eScale\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eFunctional bounding-rectangle area\u003c/td\u003e\n\u003ctd\u003eum2\u003c/td\u003e\n\u003ctd\u003earea quality Q\u003c/td\u003e\n\u003ctd\u003epositive area\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ecm_bias_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003e(v(outp)+v(outn))/2\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target / bias\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e1.2\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edm_bias_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003ev(outp)-v(outn)\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target / bias\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e1.2\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003e-v(vdd)*i(VDD)-v(vb1)*i(VB1)-v(vb2)*i(VB2)-v(vb3)*i(VB3)-v(vb4)*i(VB4)\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eminimize / ratio / supply\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003egain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003efind gain at=10\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003emaximize / db20 / response\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003egain_100khz_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003efind gain at=100k\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003emaximize / db20 / response\u003c/td\u003e\n\u003
