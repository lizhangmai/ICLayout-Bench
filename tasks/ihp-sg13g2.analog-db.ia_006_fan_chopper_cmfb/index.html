el\":\"stylesheet\",\"href\":\"/ICLayout-Bench/_next/static/chunks/3sa54_ghi1h2h.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}],[\"$\",\"script\",\"script-0\",{\"src\":\"/ICLayout-Bench/_next/static/chunks/2h60meymns2z5.js\",\"async\":true,\"nonce\":\"$undefined\"}]],[\"$\",\"html\",null,{\"lang\":\"en\",\"children\":[\"$\",\"body\",null,{\"children\":[[\"$\",\"a\",null,{\"className\":\"skip-link\",\"href\":\"#main-content\",\"children\":\"Skip to content\"}],[\"$\",\"header\",null,{\"children\":[[\"$\",\"$L2\",null,{\"className\":\"brand\",\"href\":\"/\",\"children\":[[\"$\",\"img\",null,{\"className\":\"brandmark\",\"src\":\"/ICLayout-Bench/brand/iclayout-bench.svg\",\"width\":40,\"height\":40,\"alt\":\"\",\"aria-hidden\":\"true\"}],\" \",\"ICLayout\",[\"$\",\"span\",null,{\"children\":\"Bench\"}]]}],[\"$\",\"$L3\",null,{\"participantAccess\":false}]]}],[\"$\",\"main\",null,{\"id\":\"main-content\",\"children\":[\"$\",\"$L4\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L5\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":[[\"$\",\"section\",null,{\"children\":[[\"$\",\"h1\",null,{\"children\":\"Page unavailable\"}],[\"$\",\"p\",null,{\"children\":\"This page is not part of the current public release.\"}],[\"$\",\"$L2\",null,{\"href\":\"/\",\"children\":\"Return to overview\"}]]}],[]],\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]}],[\"$\",\"footer\",null,{\"children\":[[\"$\",\"span\",null,{\"children\":\"ICLayout-Bench · Integrated circuit layout intelligence\"}],[\"$\",\"span\",null,{\"children\":[\"Explore the scores. Understand the layouts.\",\" \",[\"$\",\"$L2\",null,{\"href\":\"/methodology\",\"children\":\"Methodology\"}],false]}]]}]]}]}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[null,[\"$\",\"$L4\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L5\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[\"$L6\",[[\"$\",\"script\",\"script-0\",{\"src\":\"/ICLayout-Bench/_next/static/chunks/27jip_2vcvnd5.js\",\"async\":true,\"nonce\":\"$undefined\"}]],[\"$\",\"$L7\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.MetadataOutlet\",\"children\":\"$@9\"}]}]]}],{},null,false,null]},null,false,\"$a\"]},null,false,null],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Lb\",null,{\"children\":\"$Lc\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Ld\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.Metadata\",\"children\":\"$Le\"}]}]}],null]}],false]],\"m\":\"$undefined\",\"G\":[\"$f\",[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/ICLayout-Bench/_next/static/chunks/3sa54_ghi1h2h.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]]],\"S\":true,\"h\":null,\"r\":\"$undefined\",\"s\":\"$undefined\",\"a\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"2hqB741EA4j7xWQVg6hu-\"}\n10:I[1186,[\"/ICLayout-Bench/_next/static/chunks/2h60meymns2z5.js\",\"/ICLayout-Bench/_next/static/chunks/27jip_2vcvnd5.js\"],\"default\"]\na:C\n11:T5ea2,\u003ch1 id=\"problem-clocked-capacitive-instrumentation-amplifier-with-cmfb-layout-task\"\u003eClocked Capacitive Instrumentation Amplifier with CMFB Layout Task\u003c/h1\u003e\n\u003ch2 id=\"problem-objective\"\u003eObjective\u003c/h2\u003e\n\u003cp\u003eImplement \u003ccode\u003eia_006_fan_chopper_cmfb\u003c/code\u003e: a complete capacitively coupled differential\ninstrumentation amplifier with input, feedback and interstage/output chopping,\na two-stage amplifier and transistor common-mode feedback (CMFB). Preserve the\nphysical signal/feedback capacitors, both bias-return paths, compensation and\nthe actual common-mode controller. Validate operation with all clocks running.\u003c/p\u003e\n\u003ch3 id=\"problem-optimization-objective\"\u003eOptimization objective\u003c/h3\u003e\n\u003cp\u003eMaximize the declared quality score within the solve budget while satisfying all physical and necessary functional requirements. The first passing DRC, LVS and required electrical checks establish a feasible baseline. Continue improving the scored metrics from that baseline; a passing check or \u003ccode\u003etask_success = true\u003c/code\u003e does not mean that the quality objectives have been achieved.\u003c/p\u003e\n\u003ch2 id=\"problem-inputs-and-interface\"\u003eInputs and Interface\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003ematerials/circuit.cdl\u003c/code\u003e: authoritative physical circuit for native LVS.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ematerials/circuit.spice\u003c/code\u003e: equivalent process-model simulator representation.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ematerials/testbench.spice\u003c/code\u003e: independent bias, clocks, loads and measurements.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eThe ordered interface is:\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003evinp vinn voutp voutn vref\nclk_chin clk_chin_not clk_chfb clk_chfb_not clk_chout clk_chout_not\nvdd vss core__vb1 core__vb2 core__vb3 core__vb4 vref_cm\ncore__vsum_p core__vsum_n\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eVINP/VINN and VOUTP/VOUTN are the differential input and output. VREF biases\nthe summing nodes through physical high-poly return arms; VREF_CM is the\nreference for the actual transistor common-mode controller. The four CORE__VB\nports supply the declared core bias voltages. The final two ports are\nhigh-impedance summing-node monitors: the testbench observes them without\napplying voltage/current drive, a servo or an external load. Keep these named\nconnections; they also distinguish the symmetric native LVS branches.\u003c/p\u003e\n\u003cp\u003eUse the fixed models, dimensions, multiplicities and connections in the\nnetlist. The 46 source MOS groups have a maintained 61-finger implementation;\nparallel fingering/merging is allowed when all checks pass. Core matching pairs\nhave fixed total W*m/L and on-grid finger dimensions; do not replace them with\nunqualified model widths. NMOS and resistor bodies connect to SUB through the\nexplicit VSS substrate tap, and PMOS bodies to WELL through the VDD well tap.\nDo not drive the internal CMFB actuator VB4O externally.\u003c/p\u003e\n\u003cp\u003ePhysical passive requirements are:\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eBranch\u003c/th\u003e\n\u003cth\u003ePhysical implementation\u003c/th\u003e\n\u003cth\u003eNominal value at TT, 27 C\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eEach input arm\u003c/td\u003e\n\u003ctd\u003eFour parallel 51.6 × 51.6 um \u003ccode\u003ecap_cmim\u003c/code\u003e units\u003c/td\u003e\n\u003ctd\u003e16.008384 pF\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eEach capacitive feedback arm\u003c/td\u003e\n\u003ctd\u003eOne 23.11 × 23.11 um \u003ccode\u003ecap_cmim\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e0.80480575 pF\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eEach differential Miller path\u003c/td\u003e\n\u003ctd\u003eOne 51.6 × 51.6 um \u003ccode\u003ecap_cmim\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e4.002096 pF\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eCMFB actuator to VSS\u003c/td\u003e\n\u003ctd\u003eOne 25.85 × 25.85 um \u003ccode\u003ecap_cmim\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e1.00646975 pF\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eEach summing-node return to VREF\u003c/td\u003e\n\u003ctd\u003e41 series \u003ccode\u003erhigh\u003c/code\u003e segments, W=1 um, L=180 um, m=1, b=0\u003c/td\u003e\n\u003ctd\u003e10.46156 Mohm\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eEach output-to-common-mode-sense arm\u003c/td\u003e\n\u003ctd\u003eFour of the same high-poly segments\u003c/td\u003e\n\u003ctd\u003e1.02064 Mohm\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eThe input/feedback capacitor ratio is approximately 19.891. All internal\npassives are physical DUT devices, distinct from external output loads. Preserve\nMIM plate orientation. The maintained compensation is deliberately retuned for\nthe physical combined loop; the source's ideal 1 pF Miller / 1 fF controller\nvalues do not define this task.\u003c/p\u003e\n\u003ch2 id=\"problem-operating-conditions\"\u003eOperating Conditions\u003c/h2\u003e\n\u003cp\u003eUse TT MOS/capacitor/resistor models at 27 C and VDD/VSS=1.2/0 V. VREF and\nVREF_CM are both 0.6 V. Relative to VSS, CORE__VB1/2/3/4 are respectively\n0.5/0.75/0.45/0.589 V. There is no ideal external output-common-mode or\ndifferential-feedback servo. Each output has a 1 pF or 5 pF external load.\nAt each load, run both signs of a 10 mV differential input step: four conditions.\u003c/p\u003e\n\u003cp\u003eThe input common mode stays at 0.6 V. Both inputs initially equal 0.6 V.\nIn the differential-response suite, VINP and VINN move oppositely by ±5 mV during 500–501 us, hold for 500 us, then return during 1001–1002 us. A separate common-mode rejection suite holds the differential input at zero and moves both inputs together from 0.6 V to 0.61 V over 1 us at 500 us, holds through 1001 us and returns over 1 us. It runs at both 1 pF and 5 pF loads while all three clock pairs continue switching. The additional \u003ccode\u003ecm_to_dm_peak_v\u003c/code\u003e measurement is the maximum absolute differential output change from its 400–500 us pre-step baseline during 900 us–1 ms.\nThe pulse period is 10 ms; only the finite 0–1.5 ms sequence is measured.\u003c/p\u003e\n\u003cp\u003eAll three true/complement clock pairs run synchronously at 20 kHz between\n0 and 1.2 V. True clocks begin high, fall during 25–25.05 us, hold low for\n24.95 us, then rise during 50–50.05 us; the 50 us pattern repeats. Complement\nclocks have exactly opposite levels with the same 50 ns edges. Finite\ncomplementary slopes may produce overlap or dead intervals according to device\nthresholds; no ideal break-before-make behavior is assumed. Input, feedback and\noutput/interstage clocks all switch; frozen-clock gain is not an acceptance test.\u003c/p\u003e\n\u003cp\u003eTransient starts from the solved DC operating point. Use Gear order 2, the\nKLU solver, maximum time step 500 ns, \u003ccode\u003ershunt=1e13\u003c/code\u003e, \u003ccode\u003ereltol=1e-5\u003c/code\u003e,\n\u003ccode\u003eabstol=1e-13\u003c/code\u003e and \u003ccode\u003evntol=1e-8\u003c/code\u003e. Save the declared port voltages and source\ncurrents. The settled observation windows contain integer clock periods;\nstartup from a zero-supply state is not covered.\u003c/p\u003e\n\u003ch2 id=\"problem-physical-requirements\"\u003ePhysical Requirements\u003c/h2\u003e\n\u003cp\u003eSubmit GDSII top cell \u003ccode\u003eia_006_fan_chopper_cmfb\u003c/code\u003e, no larger than 10 MiB.\nPass native IHP main/maximal DRC without waivers (standalone scope with\ndensity/antenna disabled), strict named-interface LVS including taps, and a\n3000 × 700 um functional outline. Device, contact and complete routing layers\nare enumerated by the runtime outline constraint. Pin/annotation layers are\nexcluded from area and cannot conceal functional geometry.\u003c/p\u003e\n\u003cp\u003eThe submitted layout must provide the actual capacitors, resistor segments and\nmatching-aware core. Post-layout simulation consumes candidate-derived Magic\nRC with device junction geometry and interconnect. Extraction subdivides the\ninitial Magic grid by two and uses \u003ccode\u003egds_readonly=false\u003c/code\u003e on an isolated import;\nthe submitted GDS remains immutable. No extraction diagnostic is waived.\nMagic idealizes the explicit tap devices while retaining its extracted RC\nnetwork; the source simulator includes finite tap models. Distributed substrate\nnoise and manufacturing signoff are not qualified.\u003c/p\u003e\n\u003ch2 id=\"problem-electrical-requirements-and-scoring\"\u003eElectrical Requirements and Scoring\u003c/h2\u003e\n\u003cp\u003eArtifact, geometry, DRC, LVS and declared functional requirements must pass. Parasitic extraction is also mandatory: it must produce a complete, electrically consistent netlist usable by the required post-layout simulations. A completed candidate rejection scores zero; infrastructure errors do not establish candidate failure.\u003c/p\u003e\n\u003cp\u003eFor \u003ccode\u003elayout\u003c/code\u003e scoring, cap every positively weighted raw quality at 1 before aggregation; the score ranges from 0 to 100. Reaching every weighted target scores 100, and no minimum score is required for validity.\u003c/p\u003e\n\u003cp\u003ePhysical checks and the declared functional bounds must pass. Each \u003ccode\u003esource_*\u003c/code\u003e job and its corresponding candidate extracted circuit use exactly the same testbench, model resources, parameters, loads and measurement windows. Every electrical scoring anchor is the paired pre-layout measurement under that condition. The score measures preservation of the fixed circuit's performance; it does not require layout to improve intrinsic circuit behavior. Reports retain every paired result.\u003c/p\u003e\n\u003cp\u003eLet x be the post-layout measurement and b the same-condition pre-layout measurement:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eRatio normalization: maximize with q = x/b and minimize with q = b/x. When a numerical scale s is declared, use (x+s)/(b+s) and its reciprocal, respectively. The scale handles zero values as a normalization floor; it is neither an allowed degradation nor an acceptance bound.\u003c/li\u003e\n\u003cli\u003eAmplitude in dB: maximize with q = 10^((x-b)/20) and minimize with its reciprocal.\u003c/li\u003e\n\u003cli\u003eTarget normalization: q = 1/(1+abs(x-b)/s), where s is the declared physical scale. Signed or zero-valued operating points are not divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eUse \u003ccode\u003elayout\u003c/code\u003e scoring. First compute each metric's raw quality q from the worst paired condition, with raw area quality q_area = area_target / candidate_functional_area. Credit c_i = min(1, q_i) for every positively weighted metric, then compute S = 100 * product(c_i ** w_i). The weights sum to 1 and the score is bounded by 100. An improvement beyond one target cannot compensate for missing another target. Physical, extraction, or functional rejection scores zero; other missing or invalid measurements leave the score unknown, and zero-weight observations must also be valid. Reaching every positively weighted target scores 100; a feasible reference may score far below 100. Weights express quality tradeoffs, not acceptance bounds.\u003c/p\u003e\n\u003cp\u003eThe measurements below use the supplied SPICE node and source names. \u003ccode\u003ev(n)\u003c/code\u003e is a node voltage; \u003ccode\u003ei(V)\u003c/code\u003e is current flowing into a voltage source, so delivered power uses a negative sign. \u003ccode\u003edb(z)=20*log10(abs(z))\u003c/code\u003e; \u003ccode\u003emag/abs\u003c/code\u003e denote magnitude, and \u003ccode\u003ecph\u003c/code\u003e denotes continuous phase in radians. \u003ccode\u003efind\u003c/code\u003e, \u003ccode\u003ewhen\u003c/code\u003e, \u003ccode\u003efrom/to\u003c/code\u003e and \u003ccode\u003erise/fall\u003c/code\u003e follow the deck's interpolation, window and crossing conventions. SPICE suffixes p/n/u/m/meg/g mean pico/nano/micro/milli/mega/giga. Nested \u003ccode\u003eavg\u003c/code\u003e, \u003ccode\u003emin\u003c/code\u003e, \u003ccode\u003emax\u003c/code\u003e, \u003ccode\u003evecmin/vecmax\u003c/code\u003e and \u003ccode\u003ederiv\u003c/code\u003e represent window averages, extrema and sampled derivatives. Measure each operating condition independently, pair it with the source result under that condition, and take the worst paired quality within each metric group.\u003c/p\u003e\n\u003cp\u003eFor metrics declaring \u003ccode\u003esaturating_ratio\u003c/code\u003e, q = 2(b+s)/(b+x+2*s), using the quality anchor b and the positive scale s in the metric’s units. Equality to the anchor gives raw quality 1; improvements approach raw quality 2 but credited quality stays at 1. Normalize each condition before selecting the worst quality. These scales and targets do not add acceptance cutoffs.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eDefinition / observation\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eQuality normalization\u003c/th\u003e\n\u003cth\u003eFunctional range\u003c/th\u003e\n\u003cth\u003eScale\u003c/th\u003e\n\u003cth\u003eDimension\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003egain_vv\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTransient: \u003ccode\u003e((avg (v(voutp)-v(voutn)) from=900u to=1m)-(avg (v(voutp)-v(voutn)) from=400u to=500u))/(2*((avg v(vinp) from=900u to=1m)-.6))\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV/V\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e0.2\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebaseline_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTransient: \u003ccode\u003eabs((avg (v(voutp)-v(voutn)) from=400u to=500u))\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-07\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ereturn_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTransient: \u003ccode\u003eabs((avg (v(voutp)-v(voutn)) from=1.4m to=1.5m)-(avg (v(voutp)-v(voutn)) from=400u to=500u))\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-07\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ehigh_drift_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTransient: \u003ccode\u003eabs((avg (v(voutp)-v(voutn)) from=950u to=1m)-(avg (v(voutp)-v(voutn)) from=900u to=950u))\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ereturn_drift_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTransient: \u003ccode\u003eabs((avg (v(voutp)-v(voutn)) from=1.45m to=1.5m)-(avg (v(voutp)-v(voutn)) from=1.4m to=1.45m))\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eripple_rms_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTransient: \u003ccode\u003esqrt((avg (((v(voutp)-v(voutn))-(avg (v(voutp)-v(voutn)) from=900u to=1m))^2) from=900u to=1m))\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e0.001\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eripple_pp_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTransient: \u003ccode\u003e(max (v(voutp)-v(voutn)) from=900u to=1m)-(min (v(voutp)-v(voutn)) from=900u to=1m)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e0.01\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ecm_mean_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Mean of \u003ccode\u003e((v(voutp)+v(voutn))/2) from=900u to=1m\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.2\u003c/td\u003e\n\u003ctd\u003e1.2\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ecm_min_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Minimum of \u003ccode\u003e((v(voutp)+v(voutn))/2) from=400u to=1.5m\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.2\u003c/td\u003e\n\u003ctd\u003e1.2\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ecm_max_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Maximum of \u003ccode\u003e((v(voutp)+v(voutn))/2) from=400u to=1.5m\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.2\u003c/td\u003e\n\u003ctd\u003e1.2\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003esum_cm_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Mean of \u003ccode\u003e((v(monp)+v(monn))/2) from=900u to=1m\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.2\u003c/td\u003e\n\u003ctd\u003e1.2\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003esum_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTransient: \u003ccode\u003eabs((avg ((v(monp)-v(monn))*(v(clk_chin)/.6-1)) from=900u to=1m))\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ecm_to_dm_peak_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMaximum \u003ccode\u003eabs((v(voutp)-v(voutn))-baseline)\u003c/code\u003e from 900 us to 1 ms after both inputs step 0.6→0.61 V; both clock polarities active; 1 pF and 5 pF output loads\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e2e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emean_power_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Mean of \u003ccode\u003e(-1.2*i(VDD)) from=400u to=1.5m\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003ctd\u003esupply\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eclock_power_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMean sum of positive delivered power from all six chopper clock sources over 900 us–1 ms; negative (returned) power from each source is clipped to zero before summation.\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003ctd\u003esupply\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edc_cm_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003e(v(voutp)+v(voutn))/2\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eunscored diagnostic\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edc_dm_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003ev(voutp)-v(voutn)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eunscored diagnostic\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebaseline_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Mean of \u003ccode\u003e(v(voutp)-v(voutn)) from=400u to=500u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eunscored diagnostic\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eplateau_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Mean of \u003ccode\u003e(v(voutp)-v(voutn)) from=900u to=1m\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eunscored diagnostic\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ereturn_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Mean of \u003ccode\u003e(v(voutp)-v(voutn)) from=1.4m to=1.5m\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eunscored diagnostic\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edc_power_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003e-1.2*i(VDD)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eunscored diagnostic\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eThe capability coefficient remains \u003cstrong\u003e10\u003c/strong\u003e; it is independent of\nthe reference-relative task score.\u003c/p\u003e\n\u003ch3 id=\"problem-quality-targets-and-weights\"\u003eQuality targets and weights\u003c/h3\u003e\n\u003cp\u003eThe area quality target is \u003cstrong\u003e34000 um2\u003c/strong\u003e, with \u003cstrong\u003e20%\u003c/strong\u003e weight. It is an integration objective, not a hard limit or a proven achievable minimum.\u003c/p\u003e\n\u003cp\u003eThe 13 fixed MIM plates occupy 28361.9667 um2, or 83.4% of the 34000 um2 footprint objective, leaving 5638.0333 um2 of planar overhead. High-poly chains, taps, MOS, plate spacing and routing must be integrated using the permitted layer stack; their layer areas are not added to MIM area where legal overlap is possible. This is a demanding footprint objective, not a proven achievable minimum or an acceptance bound. Clock power carries 30%, baseline error 25%, area 20%, return error 10%, peak-to-peak ripple 10% and gain preservation 5%. These source-paired metrics emphasize clock-routing cost and offset recovery while all clocks run. RMS ripple, common-mode conversion and mean rail power remain diagnostics. The existing error floors, complete condition set and functional requirements are retained.\u003c/p\u003e\n\u003cp\u003ePeak-to-peak ripple has 10% weight and retains the complete 900 us-1 ms window, so clock spikes remain visible. RMS ripple is diagnostic. Baseline and return errors retain their 0.1 uV normalization floor, equal to 10 ppm of the 10 mV stimulus. Clock power retains the source-paired positive-energy accounting while every clock pair switches.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eQuality anchor\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eScale\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e34000\u003c/td\u003e\n\u003ctd\u003eum2\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.2\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebaseline_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003epaired source\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e1e-07\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.25\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003egain_vv\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003epaired source\u003c/td\u003e\n\u003ctd\u003eV/V\u003c/td\u003e\n\u003ctd\u003e0.2\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.05\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ereturn_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003epaired source\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e1e-07\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eripple_pp_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003epaired source\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e0.01\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eripple_rms_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003epaired source\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e0.001\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eclock_power_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003epaired source\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.3\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emean_power_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003epaired source\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ecm_to_dm_peak_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003epaired source\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e2e-06\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eZero-weight observations: \u003ccode\u003ehigh_drift_v\u003c/code\u003e, \u003ccode\u003ereturn_drift_v\u003c/code\u003e, \u003ccode\u003eripple_rms_v\u003c/code\u003e, \u003ccode\u003ecm_max_v\u003c/code\u003e, \u003ccode\u003ecm_mean_v\u003c/code\u003e, \u003ccode\u003ecm_min_v\u003c/code\u003e, \u003ccode\u003esum_cm_v\u003c/code\u003e, \u003ccode\u003esum_error_v\u003c/code\u003e, \u003ccode\u003emean_power_w\u003c/code\u003e, \u003ccode\u003ecm_to_dm_peak_v\u003c/code\u003e. Every original functional requirement and measurement remains enforced.\u003c/p\u003e\n\u003cp\u003eThe targets affect continuous quality only. A complete feasible reference may miss them; there is no minimum qualifying score.\u003c/p\u003e\n\u003ch2 id=\"problem-tools-and-submission\"\u003eTools and Submission\u003c/h2\u003e\n\u003cp\u003eSoft solve budget: \u003cstrong\u003e1.5 hours\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eDiscover frozen task inputs, requirements, reviewed resources and harness\nfeedback in \u003ccode\u003e/protocol/task.json\u003c/code\u003e, the \u003ccode\u003eresources\u003c/code\u003e field of \u003ccode\u003e/protocol/task.json\u003c/code\u003e and\n\u003ccode\u003e/protocol/harness.json\u003c/code\u003e. Use the supplied IHP primitives and KLayout, Magic\nand ngspice. Write \u003ccode\u003e/workspace/output/final.gds\u003c/code\u003e and explicitly submit through\nthe harness protocol. Source records, reference GDS and host configuration\nremain outside standard solver inputs.\u003c/p\u003e\n\u003ch3 id=\"problem-solve-workflow\"\u003eSolve workflow\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eRead the declared circuit and materials, \u003ccode\u003e/protocol/task.json\u003c/code\u003e for paths, constraints and reviewed resources, and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e for capabilities and helper commands. Task inputs under \u003ccode\u003e/task\u003c/code\u003e and resources under \u003ccode\u003e/resources\u003c/code\u003e are read-only; construct the layout in \u003ccode\u003e/workspace\u003c/code\u003e with the declared tools. With layout MCP, paths and commands refer to the remote EDA workspace. Create your own implementation with real devices, interconnect and pins, using your own tool loop without delegating to other agents; reference layouts and author code are not solver inputs.\u003c/li\u003e\n\u003cli\u003eInspect \u003ccode\u003eresources.external\u003c/code\u003e before using external tools. Each command starts a fresh shell: when tool modules are declared, source \u003ccode\u003e/usr/share/Modules/init/bash\u003c/code\u003e and load the selected tool's modules; export its declared \u003ccode\u003etool_environment\u003c/code\u003e settings in that same command. Repeat as needed and use batch or headless operation. Local manuals, command references, and release notes may be available within the declared EDA installation and PDK resource directories. Locate these resources through \u003ccode\u003e/protocol/task.json\u003c/code\u003e and consult the documentation for the installed tool version when diagnosing unfamiliar syntax or tool failures.\u003c/li\u003e\n\u003cli\u003eGenerate an initial candidate and submit a snapshot early. When \u003ccode\u003eprocess-feedback\u003c/code\u003e is available, check the current GDS with layout MCP \u003ccode\u003echeck\u003c/code\u003e or \u003ccode\u003epython -I /protocol/process_check.py\u003c/code\u003e before the final submission. This runs the final evaluator's complete plan and returns engineering diagnostics and candidate measurements, without scores or normalized quality factors. Checks have no count limit and consume the same wall-clock budget. Inspect the physical and functional results and all scored metrics; successful tool execution alone does not establish requirement satisfaction. Read paginated diagnostics with \u003ccode\u003ereport\u003c/code\u003e when using MCP. Local exploratory checks do not replace this complete check.\u003c/li\u003e\n\u003cli\u003eUse the remaining time for measured improvements to the declared quality objectives. Identify the limiting scored metrics, make targeted layout changes, regenerate and check the candidate, and compare measurements with the previous candidate and the stated scoring targets and trade-offs. Preserve the best valid candidate and revert changes that worsen the overall objective. Repeat while time and useful improvements remain; passing validity checks alone is not a stopping condition.\u003c/li\u003e\n\u003cli\u003eStop optimization when the budget expires, all declared quality objectives are achieved, or measured trials support convergence. If stopping early, explain the changes tried, the metric comparisons and the remaining limitations. Track remaining time through session status. At soft-budget expiry, finish or cancel already-started work and submit immediately; do not start another command, check or optimization round. If an MCP execution is running, use \u003ccode\u003epoll\u003c/code\u003e with its \u003ccode\u003eexecution_id\u003c/code\u003e and the returned \u003ccode\u003enext_offset\u003c/code\u003e as \u003ccode\u003eoffset\u003c/code\u003e until completion, or cancel it and wait for it to stop.\u003c/li\u003e\n\u003cli\u003eFinish or cancel outstanding work, restore your best candidate to the declared output path, and explicitly submit it before ending the session. With layout MCP \u003ccode\u003esubmit\u003c/code\u003e, remove the \u003ccode\u003e/workspace/\u003c/code\u003e prefix from \u003ccode\u003eoutput.path\u003c/code\u003e; with the container interface, run \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e. Wait for the receipt: only the last accepted snapshot is judged, and writing a file alone is not submission. Acceptance confirms delivery; the framework independently evaluates validity and quality after the session.\u003c/li\u003e\n\u003c/ol\u003e\n12:T302b,\u003cp\u003eArtifact, geometry, DRC, LVS and declared functional requirements must pass. Parasitic extraction is also mandatory: it must produce a complete, electrically consistent netlist usable by the required post-layout simulations. A completed candidate rejection scores zero; infrastructure errors do not establish candidate failure.\u003c/p\u003e\n\u003cp\u003eFor \u003ccode\u003elayout\u003c/code\u003e scoring, cap every positively weighted raw quality at 1 before aggregation; the score ranges from 0 to 100. Reaching every weighted target scores 100, and no minimum score is required for validity.\u003c/p\u003e\n\u003cp\u003ePhysical checks and the declared functional bounds must pass. Each \u003ccode\u003esource_*\u003c/code\u003e job and its corresponding candidate extracted circuit use exactly the same testbench, model resources, parameters, loads and measurement windows. Every electrical scoring anchor is the paired pre-layout measurement under that condition. The score measures preservation of the fixed circuit's performance; it does not require layout to improve intrinsic circuit behavior. Reports retain every paired result.\u003c/p\u003e\n\u003cp\u003eLet x be the post-layout measurement and b the same-condition pre-layout measurement:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eRatio normalization: maximize with q = x/b and minimize with q = b/x. When a numerical scale s is declared, use (x+s)/(b+s) and its reciprocal, respectively. The scale handles zero values as a normalization floor; it is neither an allowed degradation nor an acceptance bound.\u003c/li\u003e\n\u003cli\u003eAmplitude in dB: maximize with q = 10^((x-b)/20) and minimize with its reciprocal.\u003c/li\u003e\n\u003cli\u003eTarget normalization: q = 1/(1+abs(x-b)/s), where s is the declared physical scale. Signed or zero-valued operating points are not divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eUse \u003ccode\u003elayout\u003c/code\u003e scoring. First compute each metric's raw quality q from the worst paired condition, with raw area quality q_area = area_target / candidate_functional_area. Credit c_i = min(1, q_i) for every positively weighted metric, then compute S = 100 * product(c_i ** w_i). The weights sum to 1 and the score is bounded by 100. An improvement beyond one target cannot compensate for missing another target. Physical, extraction, or functional rejection scores zero; other missing or invalid measurements leave the score unknown, and zero-weight observations must also be valid. Reaching every positively weighted target scores 100; a feasible reference may score far below 100. Weights express quality tradeoffs, not acceptance bounds.\u003c/p\u003e\n\u003cp\u003eThe measurements below use the supplied SPICE node and source names. \u003ccode\u003ev(n)\u003c/code\u003e is a node voltage; \u003ccode\u003ei(V)\u003c/code\u003e is current flowing into a voltage source, so delivered power uses a negative sign. \u003ccode\u003edb(z)=20*log10(abs(z))\u003c/code\u003e; \u003ccode\u003emag/abs\u003c/code\u003e denote magnitude, and \u003ccode\u003ecph\u003c/code\u003e denotes continuous phase in radians. \u003ccode\u003efind\u003c/code\u003e, \u003ccode\u003ewhen\u003c/code\u003e, \u003ccode\u003efrom/to\u003c/code\u003e and \u003ccode\u003erise/fall\u003c/code\u003e follow the deck's interpolation, window and crossing conventions. SPICE suffixes p/n/u/m/meg/g mean pico/nano/micro/milli/mega/giga. Nested \u003ccode\u003eavg\u003c/code\u003e, \u003ccode\u003emin\u003c/code\u003e, \u003ccode\u003emax\u003c/code\u003e, \u003ccode\u003evecmin/vecmax\u003c/code\u003e and \u003ccode\u003ederiv\u003c/code\u003e represent window averages, extrema and sampled derivatives. Measure each operating condition independently, pair it with the source result under that condition, and take the worst paired quality within each metric group.\u003c/p\u003e\n\u003cp\u003eFor metrics declaring \u003ccode\u003esaturating_ratio\u003c/code\u003e, q = 2(b+s)/(b+x+2*s), using the quality anchor b and the positive scale s in the metric’s units. Equality to the anchor gives raw quality 1; improvements approach raw quality 2 but credited quality stays at 1. Normalize each condition before selecting the worst quality. These scales and targets do not add acceptance cutoffs.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eDefinition / observation\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eQuality normalization\u003c/th\u003e\n\u003cth\u003eFunctional range\u003c/th\u003e\n\u003cth\u003eScale\u003c/th\u003e\n\u003cth\u003eDimension\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003egain_vv\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTransient: \u003ccode\u003e((avg (v(voutp)-v(voutn)) from=900u to=1m)-(avg (v(voutp)-v(voutn)) from=400u to=500u))/(2*((avg v(vinp) from=900u to=1m)-.6))\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV/V\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e0.2\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebaseline_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTransient: \u003ccode\u003eabs((avg (v(voutp)-v(voutn)) from=400u to=500u))\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-07\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ereturn_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTransient: \u003ccode\u003eabs((avg (v(voutp)-v(voutn)) from=1.4m to=1.5m)-(avg (v(voutp)-v(voutn)) from=400u to=500u))\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-07\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ehigh_drift_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTransient: \u003ccode\u003eabs((avg (v(voutp)-v(voutn)) from=950u to=1m)-(avg (v(voutp)-v(voutn)) from=900u to=950u))\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ereturn_drift_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTransient: \u003ccode\u003eabs((avg (v(voutp)-v(voutn)) from=1.45m to=1.5m)-(avg (v(voutp)-v(voutn)) from=1.4m to=1.45m))\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eripple_rms_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTransient: \u003ccode\u003esqrt((avg (((v(voutp)-v(voutn))-(avg (v(voutp)-v(voutn)) from=900u to=1m))^2) from=900u to=1m))\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e0.001\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eripple_pp_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTransient: \u003ccode\u003e(max (v(voutp)-v(voutn)) from=900u to=1m)-(min (v(voutp)-v(voutn)) from=900u to=1m)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e0.01\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ecm_mean_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Mean of \u003ccode\u003e((v(voutp)+v(voutn))/2) from=900u to=1m\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.2\u003c/td\u003e\n\u003ctd\u003e1.2\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ecm_min_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Minimum of \u003ccode\u003e((v(voutp)+v(voutn))/2) from=400u to=1.5m\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.2\u003c/td\u003e\n\u003ctd\u003e1.2\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ecm_max_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Maximum of \u003ccode\u003e((v(voutp)+v(voutn))/2) from=400u to=1.5m\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.2\u003c/td\u003e\n\u003ctd\u003e1.2\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003esum_cm_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Mean of \u003ccode\u003e((v(monp)+v(monn))/2) from=900u to=1m\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.2\u003c/td\u003e\n\u003ctd\u003e1.2\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003esum_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTransient: \u003ccode\u003eabs((avg ((v(monp)-v(monn))*(v(clk_chin)/.6-1)) from=900u to=1m))\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ecm_to_dm_peak_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMaximum \u003ccode\u003eabs((v(voutp)-v(voutn))-baseline)\u003c/code\u003e from 900 us to 1 ms after both inputs step 0.6→0.61 V; both clock polarities active; 1 pF and 5 pF output loads\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e2e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emean_power_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Mean of \u003ccode\u003e(-1.2*i(VDD)) from=400u to=1.5m\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003ctd\u003esupply\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eclock_power_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMean sum of positive delivered power from all six chopper clock sources over 900 us–1 ms; negative (returned) power from each source is clipped to zero before summation.\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003ctd\u003esupply\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edc_cm_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003e(v(voutp)+v(voutn))/2\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eunscored diagnostic\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edc_dm_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003ev(voutp)-v(voutn)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eunscored diagnostic\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebaseline_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Mean of \u003ccode\u003e(v(voutp)-v(voutn)) from=400u to=500u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eunscored diagnostic\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eplateau_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Mean of \u003ccode\u003e(v(voutp)-v(voutn)) from=900u to=1m\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eunscored diagnostic\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ereturn_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Mean of \u003ccode\u003e(v(voutp)-v(voutn)) from=1.4m to=1.5m\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eunscored diagnostic\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edc_power_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003e-1.2*i(VDD)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eunscored diagnostic\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eThe capability coefficient remains \u003cstrong\u003e10\u003c/strong\u003e; it is independent of\nthe reference-relative task score.\u003c/p\u003e\n\u003ch3\u003eQuality targets and weights\u003c/h3\u003e\n\u003cp\u003eThe area quality target is \u003cstrong\u003e34000 um2\u003c/strong\u003e, with \u003cstrong\u003e20%\u003c/strong\u003e weight. It is an integration objective, not a hard limit or a proven achievable minimum.\u003c/p\u003e\n\u003cp\u003eThe 13 fixed MIM plates occupy 28361.9667 um2, or 83.4% of the 34000 um2 footprint objective, leaving 5638.0333 um2 of planar overhead. High-poly chains, taps, MOS, plate spacing and routing must be integrated using the permitted layer stack; their layer areas are not added to MIM area where legal overlap is possible. This is a demanding footprint objective, not a proven achievable minimum or an acceptance bound. Clock power carries 30%, baseline error 25%, area 20%, return error 10%, peak-to-peak ripple 10% and gain preservation 5%. These source-paired metrics emphasize clock-routing cost and offset recovery while all clocks run. RMS ripple, common-mode conversion and mean rail power remain diagnostics. The existing error floors, complete condition set and functional requirements are retained.\u003c/p\u003e\n\u003cp\u003ePeak-to-peak ripple has 10% weight and retains the complete 900 us-1 ms window, so clock spikes remain visible. RMS ripple is diagnostic. Baseline and return errors retain their 0.1 uV normalization floor, equal to 10 ppm of the 10 mV stimulus. Clock power retains the source-paired positive-energy accounting while every clock pair switches.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eQuality anchor\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eScale\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e34000\u003c/td\u003e\n\u003ctd\u003eum2\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.2\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebaseline_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003epaired source\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e1e-07\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.25\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003egain_vv\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003epaired source\u003c/td\u003e\n\u003ctd\u003eV/V\u003c/td\u003e\n\u003ctd\u003e0.2\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.05\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ereturn_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003epaired source\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e1e-07\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eripple_pp_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003epaired source\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e0.01\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eripple_rms_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003epaired source\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e0.001\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eclock_power_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003epaired source\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.3\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emean_power_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003epaired source\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ecm_to_dm_peak_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003epaired source\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e2e-06\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eZero-weight observations: \u003ccode\u003ehigh_drift_v\u003c/code\u003e, \u003ccode\u003ereturn_drift_v\u003c/code\u003e, \u003ccode\u003eripple_rms_v\u003c/code\u003e, \u003ccode\u003ecm_max_v\u003c/code\u003e, \u003ccode\u003ecm_mean_v\u003c/code\u003e, \u003ccode\u003ecm_min_v\u003c/code\u003e, \u003ccode\u003esum_cm_v\u003c/code\u003e, \u003ccode\u003esum_error_v\u003c/code\u003e, \u003ccode\u003emean_power_w\u003c/code\u003e, \u003ccode\u003ecm_to_dm_peak_v\u003c/code\u003e. Every original functional requirement and measurement remains enforced.\u003c/p\u003e\n\u003cp\u003eThe targets affect continuous quality only. A complete feasible reference may miss them; there is no minimum qualifying score.\u003c/p\u003e\n13:Tb61,\u003cul\u003e\n\u003cli\u003e\u003ccode\u003ematerials/circuit.cdl\u003c/code\u003e: authoritative physical circuit for native LVS.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ematerials/circuit.spice\u003c/code\u003e: equivalent process-model simulator representation.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ematerials/testbench.spice\u003c/code\u003e: independent bias, clocks, loads and measurements.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eThe ordered interface is:\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003evinp vinn voutp voutn vref\nclk_chin clk_chin_not clk_chfb clk_chfb_not clk_chout clk_chout_not\nvdd vss core__vb1 core__vb2 core__vb3 core__vb4 vref_cm\ncore__vsum_p core__vsum_n\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eVINP/VINN and VOUTP/VOUTN are the differential input and output. VREF biases\nthe summing nodes through physical high-poly return arms; VREF_CM is the\nreference for the actual transistor common-mode controller. The four CORE__VB\nports supply the declared core bias voltages. The final two ports are\nhigh-impedance summing-node monitors: the testbench observes them without\napplying voltage/current drive, a servo or an external load. Keep these named\nconnections; they also distinguish the symmetric native LVS branches.\u003c/p\u003e\n\u003cp\u003eUse the fixed models, dimensions, multiplicities and connections in the\nnetlist. The 46 source MOS groups have a maintained 61-finger implementation;\nparallel fingering/merging is allowed when all checks pass. Core matching pairs\nhave fixed total W*m/L and on-grid finger dimensions; do not replace them with\nunqualified model widths. NMOS and resistor bodies connect to SUB through the\nexplicit VSS substrate tap, and PMOS bodies to WELL through the VDD well tap.\nDo not drive the internal CMFB actuator VB4O externally.\u003c/p\u003e\n\u003cp\u003ePhysical passive requirements are:\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eBranch\u003c/th\u003e\n\u003cth\u003ePhysical implementation\u003c/th\u003e\n\u003cth\u003eNominal value at TT, 27 C\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eEach input arm\u003c/td\u003e\n\u003ctd\u003eFour parallel 51.6 × 51.6 um \u003ccode\u003ecap_cmim\u003c/code\u003e units\u003c/td\u003e\n\u003ctd\u003e16.008384 pF\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eEach capacitive feedback arm\u003c/td\u003e\n\u003ctd\u003eOne 23.11 × 23.11 um \u003ccode\u003ecap_cmim\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e0.80480575 pF\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eEach differential Miller path\u003c/td\u003e\n\u003ctd\u003eOne 51.6 × 51.6 um \u003ccode\u003ecap_cmim\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e4.002096 pF\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eCMFB actuator to VSS\u003c/td\u003e\n\u003ctd\u003eOne 25.85 × 25.85 um \u003ccode\u003ecap_cmim\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e1.00646975 pF\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eEach summing-node return to VREF\u003c/td\u003e\n\u003ctd\u003e41 series \u003ccode\u003erhigh\u003c/code\u003e segments, W=1 um, L=180 um, m=1, b=0\u003c/td\u003e\n\u003ctd\u003e10.46156 Mohm\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eEach output-to-common-mode-sense arm\u003c/td\u003e\n\u003ctd\u003eFour of the same high-poly segments\u003c/td\u003e\n\u003ctd\u003e1.02064 Mohm\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eThe input/feedback capacitor ratio is approximately 19.891. All internal\npassives are physical DUT devices, distinct from external output loads. Preserve\nMIM plate orientation. The maintained compensation is deliberately retuned for\nthe physical combined loop; the source's ideal 1 pF Miller / 1 fF controller\nvalues do not define this task.\u003c/p\u003e\n14:T81e,\u003cp\u003eUse TT MOS/capacitor/resistor models at 27 C and VDD/VSS=1.2/0 V. VREF and\nVREF_CM are both 0.6 V. Relative to VSS, CORE__VB1/2/3/4 are respectively\n0.5/0.75/0.45/0.589 V. There is no ideal external output-common-mode or\ndifferential-feedback servo. Each output has a 1 pF or 5 pF external load.\nAt each load, run both signs of a 10 mV differential input step: four conditions.\u003c/p\u003e\n\u003cp\u003eThe input common mode stays at 0.6 V. Both inputs initially equal 0.6 V.\nIn the differential-response suite, VINP and VINN move oppositely by ±5 mV during 500–501 us, hold for 500 us, then return during 1001–1002 us. A separate common-mode rejection suite holds the differential input at zero and moves both inputs together from 0.6 V to 0.61 V over 1 us at 500 us, holds through 1001 us and returns over 1 us. It runs at both 1 pF and 5 pF loads while all three clock pairs continue switching. The additional \u003ccode\u003ecm_to_dm_peak_v\u003c/code\u003e measurement is the maximum absolute differential output change from its 400–500 us pre-step baseline during 900 us–1 ms.\nThe pulse period is 10 ms; only the finite 0–1.5 ms sequence is measured.\u003c/p\u003e\n\u003cp\u003eAll three true/complement clock pairs run synchronously at 20 kHz between\n0 and 1.2 V. True clocks begin high, fall during 25–25.05 us, hold low for\n24.95 us, then rise during 50–50.05 us; the 50 us pattern repeats. Complement\nclocks have exactly opposite levels with the same 50 ns edges. Finite\ncomplementary slopes may produce overlap or dead intervals according to device\nthresholds; no ideal break-before-make behavior is assumed. Input, feedback and\noutput/interstage clocks all switch; frozen-clock gain is not an acceptance test.\u003c/p\u003e\n\u003cp\u003eTransient starts from the solved DC operating point. Use Gear order 2, the\nKLU solver, maximum time step 500 ns, \u003ccode\u003ershunt=1e13\u003c/code\u003e, \u003ccode\u003ereltol=1e-5\u003c/code\u003e,\n\u003ccode\u003eabstol=1e-13\u003c/code\u003e and \u003ccode\u003evntol=1e-8\u003c/code\u003e. Save the declared port voltages and source\ncurrents. The settled observation windows contain integer clock periods;\nstartup from a zero-supply state is not covered.\u003c/p\u003e\n15:T424,\u003cp\u003eSubmit GDSII top cell \u003ccode\u003eia_006_fan_chopper_cmfb\u003c/code\u003e, no larger than 10 MiB.\nPass native IHP main/maximal DRC without waivers (standalone scope with\ndensity/antenna disabled), strict named-interface LVS including taps, and a\n3000 × 700 um functional outline. Device, contact and complete routing layers\nare enumerated by the runtime outline constraint. Pin/annotation layers are\nexcluded from area and cannot conceal functional geometry.\u003c/p\u003e\n\u003cp\u003eThe submitted layout must provide the actual capacitors, resistor segments and\nmatching-aware core. Post-layout simulation consumes candidate-derived Magic\nRC with device junction geometry and interconnect. Extraction subdivides the\ninitial Magic grid by two and uses \u003ccode\u003egds_readonly=false\u003c/code\u003e on an isolated import;\nthe submitted GDS remains immutable. No extraction diagnostic is waived.\nMagic idealizes the explicit tap devices while retaining its extracted RC\nnetwork; the source simulator includes finite tap models. Distributed substrate\nnoise and manufacturing signoff are not qualified.\u003c/p\u003e\n16:T10f9,\u003cp\u003eSoft solve budget: \u003cstrong\u003e1.5 hours\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eDiscover frozen task inputs, requirements, reviewed resources and harness\nfeedback in \u003ccode\u003e/protocol/task.json\u003c/code\u003e, the \u003ccode\u003eresources\u003c/code\u003e field of \u003ccode\u003e/protocol/task.json\u003c/code\u003e and\n\u003ccode\u003e/protocol/harness.json\u003c/code\u003e. Use the supplied IHP primitives and KLayout, Magic\nand ngspice. Write \u003ccode\u003e/workspace/output/final.gds\u003c/code\u003e and explicitly submit through\nthe harness protocol. Source records, reference GDS and host configuration\nremain outside standard solver inputs.\u003c/p\u003e\n\u003ch3\u003eSolve workflow\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eRead the declared circuit and materials, \u003ccode\u003e/protocol/task.json\u003c/code\u003e for paths, constraints and reviewed resources, and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e for capabilities and helper commands. Task inputs under \u003ccode\u003e/task\u003c/code\u003e and resources under \u003ccode\u003e/resources\u003c/code\u003e are read-only; construct the layout in \u003ccode\u003e/workspace\u003c/code\u003e with the declared tools. With layout MCP, paths and commands refer to the remote EDA workspace. Create your own implementation with real devices, interconnect and pins, using your own tool loop without delegating to other agents; reference layouts and author code are not solver inputs.\u003c/li\u003e\n\u003cli\u003eInspect \u003ccode\u003eresources.external\u003c/code\u003e before using external tools. Each command starts a fresh shell: when tool modules are declared, source \u003ccode\u003e/usr/share/Modules/init/bash\u003c/code\u003e and load the selected tool's modules; export its declared \u003ccode\u003etool_environment\u003c/code\u003e settings in that same command. Repeat as needed and use batch or headless operation. Local manuals, command references, and release notes may be available within the declared EDA installation and PDK resource directories. Locate these resources through \u003ccode\u003e/protocol/task.json\u003c/code\u003e and consult the documentation for the installed tool version when diagnosing unfamiliar syntax or tool failures.\u003c/li\u003e\n\u003cli\u003eGenerate an initial candidate and submit a snapshot early. When \u003ccode\u003eprocess-feedback\u003c/code\u003e is available, check the current GDS with layout MCP \u003ccode\u003echeck\u003c/code\u003e or \u003ccode\u003epython -I /protocol/process_check.py\u003c/code\u003e before the final submission. This runs the final evaluator's complete plan and returns engineering diagnostics and candidate measurements, without scores or normalized quality factors. Checks have no count limit and consume the same wall-clock budget. Inspect the physical and functional results and all scored metrics; successful tool execution alone does not establish requirement satisfaction. Read paginated diagnostics with \u003ccode\u003ereport\u003c/code\u003e when using MCP. Local exploratory checks do not replace this complete check.\u003c/li\u003e\n\u003cli\u003eUse the remaining time for measured improvements to the declared quality objectives. Identify the limiting scored metrics, make targeted layout changes, regenerate and check the candidate, and compare measurements with the previous candidate and the stated scoring targets and trade-offs. Preserve the best valid candidate and revert changes that worsen the overall objective. Repeat while time and useful improvements remain; passing validity checks alone is not a stopping condition.\u003c/li\u003e\n\u003cli\u003eStop optimization when the budget expires, all declared quality objectives are achieved, or measured trials support convergence. If stopping early, explain the changes tried, the metric comparisons and the remaining limitations. Track remaining time through session status. At soft-budget expiry, finish or cancel already-started work and submit immediately; do not start another command, check or optimization round. If an MCP execution is running, use \u003ccode\u003epoll\u003c/code\u003e with its \u003ccode\u003eexecution_id\u003c/code\u003e and the returned \u003ccode\u003enext_offset\u003c/code\u003e as \u003ccode\u003eoffset\u003c/code\u003e until completion, or cancel it and wait for it to stop.\u003c/li\u003e\n\u003cli\u003eFinish or cancel outstanding work, restore your best candidate to the declared output path, and explicitly submit it before ending the session. With layout MCP \u003ccode\u003esubmit\u003c/code\u003e, remove the \u003ccode\u003e/workspace/\u003c/code\u003e prefix from \u003ccode\u003eoutput.path\u003c/code\u003e; with the container interface, run \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e. Wait for the receipt: only the last accepted snapshot is judged, and writing a file alone is not submission. Acceptance confirms delivery; the framework independently evaluates validity and quality after the session.\u003c/li\u003e\n\u003c/ol\u003e\n6:[\"$\",\"$8\",null,{\"fallback\":[\"$\",\"p\",null,{\"children\":\"Loading published evidence…\"}],\"children\":[\"$\",\"$L10\",null,{\"task\":{\"case_path\":\"tasks/ihp-sg13g2/analog-db/cases/ia_006_fan_chopper_cmfb/case.toml\",\"coefficient\":10,\"collection\":\"analog-db\",\"configuration_url\":\"/ICLayout-Bench/assets/89dc13c0ef15fca55234f18791a56fe35f88ecdaed8baa2ee17885bda316b12d.txt\",\"description_html\":\"$11\",\"description_path\":\"tasks/ihp-sg13g2/analog-db/cases/ia_006_fan_chopper_cmfb/problem.md\",\"hours\":1.5,\"id\":\"ihp-sg13g2.analog-db.ia_006_fan_chopper_cmfb\",\"inputs\":{\"cm_disturbance\":{\"format\":\"spice\",\"path\":\"materials/cm_disturbance.spice\",\"sha256\":\"295c571a95fd08302ffdf52471f652113fe27911ae9aa39ff5b4fbe376cd9b78\"},\"description\":{\"format\":\"text\",\"path\":\"problem.md\",\"sha256\":\"93f073d85546aefc18cf425b113cee84f337d56ac8a21bad8d9f2b0611eaad3f\"},\"netlist\":{\"format\":\"spice\",\"path\":\"materials/circuit.cdl\",\"sha256\":\"e5049836e133e951c36c34dd5eed0fe1c2492f1
