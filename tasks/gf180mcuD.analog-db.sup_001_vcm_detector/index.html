tylesheet\",\"href\":\"/ICLayout-Bench/_next/static/chunks/3sa54_ghi1h2h.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}],[\"$\",\"script\",\"script-0\",{\"src\":\"/ICLayout-Bench/_next/static/chunks/2h60meymns2z5.js\",\"async\":true,\"nonce\":\"$undefined\"}]],[\"$\",\"html\",null,{\"lang\":\"en\",\"children\":[\"$\",\"body\",null,{\"children\":[[\"$\",\"a\",null,{\"className\":\"skip-link\",\"href\":\"#main-content\",\"children\":\"Skip to content\"}],[\"$\",\"header\",null,{\"children\":[[\"$\",\"$L2\",null,{\"className\":\"brand\",\"href\":\"/\",\"children\":[[\"$\",\"img\",null,{\"className\":\"brandmark\",\"src\":\"/ICLayout-Bench/brand/iclayout-bench.svg\",\"width\":40,\"height\":40,\"alt\":\"\",\"aria-hidden\":\"true\"}],\" \",\"ICLayout\",[\"$\",\"span\",null,{\"children\":\"Bench\"}]]}],[\"$\",\"$L3\",null,{\"participantAccess\":false}]]}],[\"$\",\"main\",null,{\"id\":\"main-content\",\"children\":[\"$\",\"$L4\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L5\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":[[\"$\",\"section\",null,{\"children\":[[\"$\",\"h1\",null,{\"children\":\"Page unavailable\"}],[\"$\",\"p\",null,{\"children\":\"This page is not part of the current public release.\"}],[\"$\",\"$L2\",null,{\"href\":\"/\",\"children\":\"Return to overview\"}]]}],[]],\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]}],[\"$\",\"footer\",null,{\"children\":[[\"$\",\"span\",null,{\"children\":\"ICLayout-Bench · Integrated circuit layout intelligence\"}],[\"$\",\"span\",null,{\"children\":[\"Explore the scores. Understand the layouts.\",\" \",[\"$\",\"$L2\",null,{\"href\":\"/methodology\",\"children\":\"Methodology\"}],false]}]]}]]}]}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[null,[\"$\",\"$L4\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L5\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[\"$L6\",[[\"$\",\"script\",\"script-0\",{\"src\":\"/ICLayout-Bench/_next/static/chunks/27jip_2vcvnd5.js\",\"async\":true,\"nonce\":\"$undefined\"}]],[\"$\",\"$L7\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.MetadataOutlet\",\"children\":\"$@9\"}]}]]}],{},null,false,null]},null,false,\"$a\"]},null,false,null],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Lb\",null,{\"children\":\"$Lc\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Ld\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.Metadata\",\"children\":\"$Le\"}]}]}],null]}],false]],\"m\":\"$undefined\",\"G\":[\"$f\",[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/ICLayout-Bench/_next/static/chunks/3sa54_ghi1h2h.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]]],\"S\":true,\"h\":null,\"r\":\"$undefined\",\"s\":\"$undefined\",\"a\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"2hqB741EA4j7xWQVg6hu-\"}\n10:I[1186,[\"/ICLayout-Bench/_next/static/chunks/2h60meymns2z5.js\",\"/ICLayout-Bench/_next/static/chunks/27jip_2vcvnd5.js\"],\"default\"]\na:C\n11:T3668,\u003ch1 id=\"problem-passive-resistive-common-mode-averager-layout-task\"\u003ePassive Resistive Common-Mode Averager Layout Task\u003c/h1\u003e\n\u003ch2 id=\"problem-objective\"\u003eObjective\u003c/h2\u003e\n\u003cp\u003eTwo matched 1 Mohm resistors join vinp to vcm_out and vcm_out to vinn. This is a passive average detector, without a buffer, amplifier or CMFB controller. The fixed IHP binding contains ideal R cards, not process-specific resistor models; the maintained physical adaptation uses forty native GF180 ppolyf_u_1k segments (twenty per branch), totaling 999951.8 ohm per branch at TT/27 C. The extra vss port grounds their physical substrate; it is not a functional supply. Target top cell: \u003ccode\u003esup_001_vcm_detector\u003c/code\u003e.\u003c/p\u003e\n\u003ch3 id=\"problem-optimization-objective\"\u003eOptimization objective\u003c/h3\u003e\n\u003cp\u003eMaximize the declared quality score within the solve budget while satisfying all physical and necessary functional requirements. The first passing DRC, LVS and required electrical checks establish a feasible baseline. Continue improving the scored metrics from that baseline; a passing check or \u003ccode\u003etask_success = true\u003c/code\u003e does not mean that the quality objectives have been achieved.\u003c/p\u003e\n\u003ch2 id=\"problem-inputs-and-interface\"\u003eInputs and Interface\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003ematerials/circuit.cdl\u003c/code\u003e is the authoritative physical netlist; \u003ccode\u003ematerials/circuit.spice\u003c/code\u003e is the same compact-device circuit for simulation. \u003ccode\u003ematerials/testbench.spice\u003c/code\u003e supplies the external fixture. Both source and extracted candidate use the exact same deck, bias, loads, excitation, initial-state procedure and measurement windows. Ordered ports: vcm_out (sense output), vinp (positive input), vinn (negative input), vss (physical substrate).\u003c/p\u003e\n\u003ch2 id=\"problem-operating-conditions\"\u003eOperating Conditions\u003c/h2\u003e\n\u003cp\u003e27 C, TT. External ideal drivers are 0.8 V and 0.4 V, each followed by 1 kohm source resistance. The output has 1 pF and either 1 Mohm or 1 Gohm to ground. Each load uses common-mode AC (both drivers +1 V) and differential AC (+1/-1 V), 1 Hz–10 MHz at 40 points/decade. Both drivers increase by 0.1 V at 1 us, with 10 ns edges, and stay high through the 5 us observation. Maximum transient step is 2 ns. The initial state is the same biased DC operating point for source and candidate. A 1 Gohm load is a finite high-impedance observation, not an unloaded claim. The analytic DC limit is Vcm*RL/(RL+500.5 kohm), tending to Vcm only as RL tends to infinity. Both input-source powers are included; no zero-power claim follows from the absence of a supply pin.\u003c/p\u003e\n\u003ch2 id=\"problem-physical-requirements\"\u003ePhysical Requirements\u003c/h2\u003e\n\u003cp\u003eUse native GF180 KLayout main rules, named-interface LVS and reviewed Magic RC extraction on a ten-division grid, without per-task waivers. Extraction must retain all models, multiplicities, dimensions, resistance values, connections and ordered ports. The functional outline includes task-declared devices, wells, contacts and all routing layers; annotations and pin labels do not add area. Maximum outline is 5000 × 1000 um and maximum GDS size is 10485760 bytes. Physically implement all devices and resistors without adding ideal internal macros or auxiliary servos; external sources, probe loads and storage capacitors belong to the testbench.\u003c/p\u003e\n\u003ch2 id=\"problem-electrical-requirements-and-scoring\"\u003eElectrical Requirements and Scoring\u003c/h2\u003e\n\u003cp\u003eArtifact, geometry, DRC, LVS and declared functional requirements must pass. Parasitic extraction is also mandatory: it must produce a complete, electrically consistent netlist usable by the required post-layout simulations. A completed candidate rejection scores zero; infrastructure errors do not establish candidate failure.\u003c/p\u003e\n\u003cp\u003ePhysical checks and the declared functional bounds must pass. Quality scoring imposes no fixed degradation allowance. Each \u003ccode\u003esource_*\u003c/code\u003e job and its corresponding candidate extracted circuit use exactly the same testbench, model resources, parameters, loads and measurement windows. Independent source observations define the 100-point electrical baseline without depending on the submitted GDS; reports retain every paired result.\u003c/p\u003e\n\u003cp\u003eLet x be the post-layout measurement and b the source-circuit measurement under the same conditions:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eRatio normalization: maximize with q = x/b and minimize with q = b/x. When a numerical scale s is declared, use (x+s)/(b+s) and its reciprocal, respectively. The scale handles zero values as a normalization floor; it is neither an allowed degradation nor an acceptance bound.\u003c/li\u003e\n\u003cli\u003eAmplitude in dB: maximize with q = 10^((x-b)/20) and minimize with its reciprocal.\u003c/li\u003e\n\u003cli\u003eTarget normalization: q = 1/(1+abs(x-b)/s), where s is the declared physical scale. Signed or zero-valued operating points are not divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eUse \u003ccode\u003elayout\u003c/code\u003e scoring. Each metric takes its worst paired quality q, and the total score is S = 100 * product(min(1, q_i) ** w_i), with area quality q_area = area_reference / candidate_functional_area. The weights below sum to 1; metric dimensions describe measurements and do not determine weights. Physical, extraction, or functional rejection scores zero; other missing or invalid measurements leave the score unknown, and zero-weight observations must also be valid. Matching source-circuit performance at the reference area scores 100 points; each metric is capped at quality 1, so scores cannot exceed 100. Weights express quality tradeoffs rather than hard bounds.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003estep_error_v\u003c/code\u003e uses \u003ccode\u003esaturating_ratio\u003c/code\u003e: q = 2(b+s)/(b+x+2s), where x is candidate error, b is paired source error and s is the positive scale below. Source equivalence gives q=1; improvement approaches the upper limit 2 with diminishing returns. The scale retains its declared unit and numerical-floor meaning. Normalize each condition before taking the worst quality; other rules follow their declarations.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eDefinition\u003c/th\u003e\n\u003cth\u003eBound\u003c/th\u003e\n\u003cth\u003eQuality\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eLoaded DC sense voltage\u003c/td\u003e\n\u003ctd\u003e0 to 0.8\u003c/td\u003e\n\u003ctd\u003ebias: target, target, scale=0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eNet delivered power from both external input sources\u003c/td\u003e\n\u003ctd\u003e0 to unbounded\u003c/td\u003e\n\u003ctd\u003esupply: ratio, minimize, scale=1e-12\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003egain\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e1\u003c/td\u003e\n\u003ctd\u003eOutput magnitude at 1 Hz for declared common/differential input\u003c/td\u003e\n\u003ctd\u003eunbounded to unbounded\u003c/td\u003e\n\u003ctd\u003eresponse: target, target, scale=1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003egain_10khz\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e1\u003c/td\u003e\n\u003ctd\u003eOutput magnitude at 10 kHz\u003c/td\u003e\n\u003ctd\u003eunbounded to unbounded\u003c/td\u003e\n\u003ctd\u003eresponse: target, target, scale=1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estep_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eMean absolute error from settled DC target over 2–4 us\u003c/td\u003e\n\u003ctd\u003e0 to unbounded\u003c/td\u003e\n\u003ctd\u003eresponse: saturating_ratio, minimize, scale=1e-06\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eThe 2–4 us average absolute step error is a finite-window quantity. Common and differential AC magnitudes use a 1 V half-input normalization; the differential residual is not divided by a near-zero source result. Nominal deterministic matching does not establish statistical mismatch or noise.\u003c/p\u003e\n\u003cp\u003eStatic output bounds check the corresponding supply domain; nonnegative power/error conditions define the measurement domain; KCL checks reject inconsistent DC solutions. Every condition must be valid; upstream advertised performance is not a hard threshold. The metric table declares target scales and normalization floors; floors handle zero-error ratios, and neither scales nor floors are acceptance tolerances.\u003c/p\u003e\n\u003cp\u003eEach metric uses the worst source-paired quality over matching conditions. Target quality is \u003ccode\u003e1/(1+abs(candidate-source)/scale)\u003c/code\u003e, and minimizing ratio quality is \u003ccode\u003e(source+scale)/(candidate+scale)\u003c/code\u003e. Missing, nonfinite or invalid source/candidate measurements and tool failures make the score unknown; confirmed physical/functional rejection scores zero. Gates apply separately to every observation.\u003c/p\u003e\n\u003cp\u003eCompact area anchor: 6000 um2 = 40 × 55 × 2 um2 resistor/contact/isolation envelopes + 1600 um2 routing allowance. Each envelope accommodates the approximately 48.44 um resistor, end contacts and lateral spacing; the estimate permits folding. It is independent of the long, sparse witness. Coefficient 4: coupled matching, physical passive network, finite loading and parasitic dynamics. The circuit and these anchors are fixed before participant evaluation.\u003c/p\u003e\n\u003ch3 id=\"problem-score-weights\"\u003eScore weights\u003c/h3\u003e\n\u003cp\u003eCommon-mode sensing/controllers: recovery and error 40.5%; signed transfer 31.5%; output bias 4.5%; power 13.5%; area 10%. Each objective's weight is divided equally among its metrics.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estep_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.405000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003egain\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.157500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003egain_10khz\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.157500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.135000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch2 id=\"problem-tools-and-submission\"\u003eTools and Submission\u003c/h2\u003e\n\u003cp\u003eSoft solve budget: \u003cstrong\u003e6 hours\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eRead \u003ccode\u003e/protocol/task.json\u003c/code\u003e for input/output paths, constraints and the \u003ccode\u003eresources\u003c/code\u003e object; \u003ccode\u003e/protocol/harness.json\u003c/code\u003e describes the active check and submission interface.\u003c/p\u003e\n\u003cp\u003eDiscover tools and feedback through the runtime task, protocol and reviewed resource bundle. Explicitly submit \u003ccode\u003e/workspace/output/final.gds\u003c/code\u003e through the protocol; writing a file alone does not submit it. Reference assets and maintainer source records are not solver inputs.\u003c/p\u003e\n\u003ch3 id=\"problem-solve-workflow\"\u003eSolve workflow\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eRead the declared circuit and materials, \u003ccode\u003e/protocol/task.json\u003c/code\u003e for paths, constraints and reviewed resources, and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e for capabilities and helper commands. Task inputs under \u003ccode\u003e/task\u003c/code\u003e and resources under \u003ccode\u003e/resources\u003c/code\u003e are read-only; construct the layout in \u003ccode\u003e/workspace\u003c/code\u003e with the declared tools. With layout MCP, paths and commands refer to the remote EDA workspace. Create your own implementation with real devices, interconnect and pins, using your own tool loop without delegating to other agents; reference layouts and author code are not solver inputs.\u003c/li\u003e\n\u003cli\u003eInspect \u003ccode\u003eresources.external\u003c/code\u003e before using external tools. Each command starts a fresh shell: when tool modules are declared, source \u003ccode\u003e/usr/share/Modules/init/bash\u003c/code\u003e and load the selected tool's modules; export its declared \u003ccode\u003etool_environment\u003c/code\u003e settings in that same command. Repeat as needed and use batch or headless operation. Local manuals, command references, and release notes may be available within the declared EDA installation and PDK resource directories. Locate these resources through \u003ccode\u003e/protocol/task.json\u003c/code\u003e and consult the documentation for the installed tool version when diagnosing unfamiliar syntax or tool failures.\u003c/li\u003e\n\u003cli\u003eGenerate an initial candidate and submit a snapshot early. When \u003ccode\u003eprocess-feedback\u003c/code\u003e is available, check the current GDS with layout MCP \u003ccode\u003echeck\u003c/code\u003e or \u003ccode\u003epython -I /protocol/process_check.py\u003c/code\u003e before the final submission. This runs the final evaluator's complete plan and returns engineering diagnostics and candidate measurements, without scores or normalized quality factors. Checks have no count limit and consume the same wall-clock budget. Inspect the physical and functional results and all scored metrics; successful tool execution alone does not establish requirement satisfaction. Read paginated diagnostics with \u003ccode\u003ereport\u003c/code\u003e when using MCP. Local exploratory checks do not replace this complete check.\u003c/li\u003e\n\u003cli\u003eUse the remaining time for measured improvements to the declared quality objectives. Identify the limiting scored metrics, make targeted layout changes, regenerate and check the candidate, and compare measurements with the previous candidate and the stated scoring targets and trade-offs. Preserve the best valid candidate and revert changes that worsen the overall objective. Repeat while time and useful improvements remain; passing validity checks alone is not a stopping condition.\u003c/li\u003e\n\u003cli\u003eStop optimization when the budget expires, all declared quality objectives are achieved, or measured trials support convergence. If stopping early, explain the changes tried, the metric comparisons and the remaining limitations. Track remaining time through session status. At soft-budget expiry, finish or cancel already-started work and submit immediately; do not start another command, check or optimization round. If an MCP execution is running, use \u003ccode\u003epoll\u003c/code\u003e with its \u003ccode\u003eexecution_id\u003c/code\u003e and the returned \u003ccode\u003enext_offset\u003c/code\u003e as \u003ccode\u003eoffset\u003c/code\u003e until completion, or cancel it and wait for it to stop.\u003c/li\u003e\n\u003cli\u003eFinish or cancel outstanding work, restore your best candidate to the declared output path, and explicitly submit it before ending the session. With layout MCP \u003ccode\u003esubmit\u003c/code\u003e, remove the \u003ccode\u003e/workspace/\u003c/code\u003e prefix from \u003ccode\u003eoutput.path\u003c/code\u003e; with the container interface, run \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e. Wait for the receipt: only the last accepted snapshot is judged, and writing a file alone is not submission. Acceptance confirms delivery; the framework independently evaluates validity and quality after the session.\u003c/li\u003e\n\u003c/ol\u003e\n12:T17d5,\u003cp\u003eArtifact, geometry, DRC, LVS and declared functional requirements must pass. Parasitic extraction is also mandatory: it must produce a complete, electrically consistent netlist usable by the required post-layout simulations. A completed candidate rejection scores zero; infrastructure errors do not establish candidate failure.\u003c/p\u003e\n\u003cp\u003ePhysical checks and the declared functional bounds must pass. Quality scoring imposes no fixed degradation allowance. Each \u003ccode\u003esource_*\u003c/code\u003e job and its corresponding candidate extracted circuit use exactly the same testbench, model resources, parameters, loads and measurement windows. Independent source observations define the 100-point electrical baseline without depending on the submitted GDS; reports retain every paired result.\u003c/p\u003e\n\u003cp\u003eLet x be the post-layout measurement and b the source-circuit measurement under the same conditions:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eRatio normalization: maximize with q = x/b and minimize with q = b/x. When a numerical scale s is declared, use (x+s)/(b+s) and its reciprocal, respectively. The scale handles zero values as a normalization floor; it is neither an allowed degradation nor an acceptance bound.\u003c/li\u003e\n\u003cli\u003eAmplitude in dB: maximize with q = 10^((x-b)/20) and minimize with its reciprocal.\u003c/li\u003e\n\u003cli\u003eTarget normalization: q = 1/(1+abs(x-b)/s), where s is the declared physical scale. Signed or zero-valued operating points are not divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eUse \u003ccode\u003elayout\u003c/code\u003e scoring. Each metric takes its worst paired quality q, and the total score is S = 100 * product(min(1, q_i) ** w_i), with area quality q_area = area_reference / candidate_functional_area. The weights below sum to 1; metric dimensions describe measurements and do not determine weights. Physical, extraction, or functional rejection scores zero; other missing or invalid measurements leave the score unknown, and zero-weight observations must also be valid. Matching source-circuit performance at the reference area scores 100 points; each metric is capped at quality 1, so scores cannot exceed 100. Weights express quality tradeoffs rather than hard bounds.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003estep_error_v\u003c/code\u003e uses \u003ccode\u003esaturating_ratio\u003c/code\u003e: q = 2(b+s)/(b+x+2s), where x is candidate error, b is paired source error and s is the positive scale below. Source equivalence gives q=1; improvement approaches the upper limit 2 with diminishing returns. The scale retains its declared unit and numerical-floor meaning. Normalize each condition before taking the worst quality; other rules follow their declarations.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eDefinition\u003c/th\u003e\n\u003cth\u003eBound\u003c/th\u003e\n\u003cth\u003eQuality\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eLoaded DC sense voltage\u003c/td\u003e\n\u003ctd\u003e0 to 0.8\u003c/td\u003e\n\u003ctd\u003ebias: target, target, scale=0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eNet delivered power from both external input sources\u003c/td\u003e\n\u003ctd\u003e0 to unbounded\u003c/td\u003e\n\u003ctd\u003esupply: ratio, minimize, scale=1e-12\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003egain\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e1\u003c/td\u003e\n\u003ctd\u003eOutput magnitude at 1 Hz for declared common/differential input\u003c/td\u003e\n\u003ctd\u003eunbounded to unbounded\u003c/td\u003e\n\u003ctd\u003eresponse: target, target, scale=1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003egain_10khz\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e1\u003c/td\u003e\n\u003ctd\u003eOutput magnitude at 10 kHz\u003c/td\u003e\n\u003ctd\u003eunbounded to unbounded\u003c/td\u003e\n\u003ctd\u003eresponse: target, target, scale=1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estep_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eMean absolute error from settled DC target over 2–4 us\u003c/td\u003e\n\u003ctd\u003e0 to unbounded\u003c/td\u003e\n\u003ctd\u003eresponse: saturating_ratio, minimize, scale=1e-06\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eThe 2–4 us average absolute step error is a finite-window quantity. Common and differential AC magnitudes use a 1 V half-input normalization; the differential residual is not divided by a near-zero source result. Nominal deterministic matching does not establish statistical mismatch or noise.\u003c/p\u003e\n\u003cp\u003eStatic output bounds check the corresponding supply domain; nonnegative power/error conditions define the measurement domain; KCL checks reject inconsistent DC solutions. Every condition must be valid; upstream advertised performance is not a hard threshold. The metric table declares target scales and normalization floors; floors handle zero-error ratios, and neither scales nor floors are acceptance tolerances.\u003c/p\u003e\n\u003cp\u003eEach metric uses the worst source-paired quality over matching conditions. Target quality is \u003ccode\u003e1/(1+abs(candidate-source)/scale)\u003c/code\u003e, and minimizing ratio quality is \u003ccode\u003e(source+scale)/(candidate+scale)\u003c/code\u003e. Missing, nonfinite or invalid source/candidate measurements and tool failures make the score unknown; confirmed physical/functional rejection scores zero. Gates apply separately to every observation.\u003c/p\u003e\n\u003cp\u003eCompact area anchor: 6000 um2 = 40 × 55 × 2 um2 resistor/contact/isolation envelopes + 1600 um2 routing allowance. Each envelope accommodates the approximately 48.44 um resistor, end contacts and lateral spacing; the estimate permits folding. It is independent of the long, sparse witness. Coefficient 4: coupled matching, physical passive network, finite loading and parasitic dynamics. The circuit and these anchors are fixed before participant evaluation.\u003c/p\u003e\n\u003ch3\u003eScore weights\u003c/h3\u003e\n\u003cp\u003eCommon-mode sensing/controllers: recovery and error 40.5%; signed transfer 31.5%; output bias 4.5%; power 13.5%; area 10%. Each objective's weight is divided equally among its metrics.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estep_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.405000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003egain\u003c/code\u003e\u003c/td d layout changes, regenerate and check the candidate, and compare measurements with the previous candidate and the stated scoring targets and trade-offs. Preserve the best valid candidate and revert changes that worsen the overall objective. Repeat while time and useful improvements remain; passing validity checks alone is not a stopping condition.\u003c/li\u003e\n\u003cli\u003eStop optimization when the budget expires, all declared quality objectives are achieved, or measured trials support convergence. If stopping early, explain the changes tried, the metric comparisons and the remaining limitations. Track remaining time through session status. At soft-budget expiry, finish or cancel already-started work and submit immediately; do not start another command, check or optimization round. If an MCP execution is running, use \u003ccode\u003epoll\u003c/code\u003e with its \u003ccode\u003eexecution_id\u003c/code\u003e and the returned \u003ccode\u003enext_offset\u003c/code\u003e as \u003ccode\u003eoffset\u003c/code\u003e until completion, or cancel it and wait for it to stop.\u003c/li\u003e\n\u003cli\u003eFinish or cancel outstanding work, restore your best candidate to the declared output path, and explicitly submit it before ending the session. With layout MCP \u003ccode\u003esubmit\u003c/code\u003e, remove the \u003ccode\u003e/workspace/\u003c/code\u003e prefix from \u003ccode\u003eoutput.path\u003c/code\u003e; with the container interface, run \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e. Wait for the receipt: only the last accepted snapshot is judged, and writing a file alone is not submission. Acceptance confirms delivery; the framework independently evaluates validity and quality after the session.\u003c/li\u003e\n\u003c/ol\u003e\n6:[\"$\",\"$8\",null,{\"fallback\":[\"$\",\"p\",null,{\"children\":\"Loading published evidence…\"}],\"children\":[\"$\",\"$L10\",null,{\"task\":{\"case_path\":\"tasks/gf180mcuD/analog-db/cases/sup_001_vcm_detector/cas 6ca0d357e30017b93afa4806330bb1995bb0.txt\"}],\"metrics\":[{\"aggregation\":\"max\",\"category\":\"physical\",\"direction\":\"minimize\",\"id\":\"functional_area\",\"observations\":[\"geometry:area\"],\"unit\":\"um2\"},{\"aggregation\":\"max\",\"baseline\":[\"source_condition_0:output_v\",\"source_condition_1:output_v\",\"source_condition_2:output_v\",\"source_condition_3:output_v\"],\"category\":\"performance\",\"dimension\":\"bias\",\"direction\":\"target\",\"id\":\"output_v\",\"normalization\":\"target\",\"observations\":[\"condition_0:output_v\",\"condition_1:output_v\",\"condition_2:output_v\",\"condition_3:output_v\"],\"requirement\":{\"lower\":0,\"rationale\":\"The declared unipolar circuit output or bias node must remain within its stated ground-to-supply operating envelope; source-matching precision remains a scored objective.\",\"upper\":0.8},\"scale\":0.1,\"unit\":\"V\"},{\"aggregation\":\"max\",\"baseline\":[\"source_condition_0:power_w\",\"source_condition_1:power_w\",\"source_condition_2:power_w\",\"source_condition_3:power_w\"],\"category\":\"performance\",\"dimension\":\"supply\",\"direction\":\"minimize\",\"id\":\"power_w\",\"normalization\":\"ratio\",\"observations\":[\"condition_0:power_w\",\"condition_1:power_w\",\"condition_2:power_w\",\"condition_3:power_w\"],\"requirement\":{\"lower\":0,\"rationale\":\"The declared powered circuit or passive driven network must consume nonnegative net supply/driver energy or quiescent current under the complete stated observation.\"},\"scale\":1e-12,\"unit\":\"W\"},{\"aggregation\":\"max\",\"baseline\":[\"source_condition_0:gain\",\"source_condition_1:gain\",\"source_condition_2:gain\",\"source_condition_3:gain\"],\"category\":\"performance\",\"dimension\":\"response\",\"direction\":\"target\",\"id\":\"gain\",\"normalization\":\"target\",\"observations\":[\"condition_0:gain\",\"condition_1:gain\",\"condition_2:gain\",\"condition_3:gain\"],\"scale\":1,\"unit\":\"1\"},{\"aggregation\":\"max\",\"baseline\":[\"source_condition_0:gain_10khz\",\"source_condition_1:gain_10khz\",\"source_condition_2:gain_10khz\",\"source_condition_3:gain_10khz\"],\"category\":\"performance\",\"dimension\":\"response\",\"direction\":\"target\",\"id\":\"gain_10khz\",\"normalization\":\"target\",\"observations\":[\"condition_0:gain_10khz\",\"condition_1:gain_10khz\",\"condition_2:gain_10khz\",\"condition_3:gain_10khz\"],\"scale\":1,\"unit\":\"1\"},{\"aggregation\":\"max\",\"baseline\":[\"source_condition_0:step_error_v\",\"source_condition_1:step_error_v\",\"source_condition_2:step_error_v\",\"source_condition_3:step_error_v\"],\"category\":\"performance\",\"dimension\":\"response\",\"direction\":\"minimize\",\"id\":\"step_error_v\",\"normalization\":\"saturating_ratio\",\"observations\":[\"condition_0:step_error_v\",\"condition_1:step_error_v\",\"condition_2:step_error_v\",\"condition_3:step_error_v\"],\"requirement\":{\"lower\":0,\"rationale\":\"The absolute error, voltage span or magnitude has a nonnegative measurement domain; its positive value remains a continuously scored quality observation.\"},\"scale\":0.000001,\"unit\":\"V\"}],\"pdk\":\"gf180mcuD\",\"reader\":{\"category\":\"Amplifiers \u0026 RF\",\"summary\":\"Averages two input voltages through a passive resistive common-mode network.\",\"title\":\"Passive Resistive Common-Mode Averager\"},\"scoring\":{\"area_metric\":\"functional_area\",\"area_target\":6000,\"method\":\"layout\",\"rationale\":\"Common-mode sensing/controllers: recovery and error 40.5%; signed transfer 31.5%; output bias 4.5%; power 13.5%; area 10%. Each objective's weight is divided equally among its metrics.\",\"weights\":{\"functional_area\":0.1,\"gain\":0.1575,\"gain_10khz\":0.1575,\"output_v\":0.045,\"power_w\":0.135,\"step_error_v\":0.405}},\"sections\":{\"Electrical Requirements and Scoring\":\"$12\",\"Inputs and Interface\":\"\u003cp\u003e\u003ccode\u003ematerials/circuit.cdl\u003c/code\u003e is the authoritative physical netlist; \u003ccode\u003ematerials/circuit.spice\u003c/code\u003e is the same compact-device circuit for simulation. \u003ccode\u003ematerials/testbench.spice\u003c/code\u003e supplies the external fixture. Both source and extracted candidate use the exact same deck, bias, loads, excitation, initial-state procedure and measurement windows. Ordered ports: vcm_out (sense output), vinp (positive input), vinn (negative input), vss (physical substrate).\u003c/p\u003e\\n\",\"Objective\":\"\u003cp\u003eTwo matched 1 Mohm resistors join vinp to vcm_out and vcm_out to vinn. This is a passive average detector, without a buffer, amplifier or CMFB controller. The fixed IHP binding contains ideal R cards, not process-specific resistor models; the maintained physical adaptation uses forty native GF180 ppolyf_u_1k segments (twenty per branch), totaling 999951.8 ohm per branch at TT/27 C. The extra vss port grounds their physical substrate; it is not a functional supply. Target top cell: \u003ccode\u003esup_001_vcm_detector\u003c/code\u003e.\u003c/p\u003e\\n\u003ch3\u003eOptimization objective\u003c/h3\u003e\\n\u003cp\u003eMaximize the declared quality score within the solve budget while satisfying all physical and necessary functional requirements. The first passing DRC, LVS and required electrical checks establish a feasible baseline. Continue improving the scored metrics from that baseline; a passing check or \u003ccode\u003etask_success = true\u003c/code\u003e does not mean that the quality objectives have been achieved.\u003c/p\u003e\\n\",\"Operating Conditions\":\"\u003cp\u003e27 C, TT. External ideal drivers are 0.8 V and 0.4 V, each followed by 1 kohm source resistance. The output has 1 pF and either 1 Mohm or 1 Gohm to ground. Each load uses common-mode AC (both drivers +1 V) and differential AC (+1/-1 V), 1 Hz–10 MHz at 40 points/decade. Both drivers increase by 0.1 V at 1 us, with 10 ns edges, and stay high through the 5 us observation. Maximum transient step is 2 ns. The initial state is the same biased DC operating point for source and candidate. A 1 Gohm load is a finite high-impedance observation, not an unloaded claim. The analytic DC limit is Vcm*RL/(RL+500.5 kohm), tending to Vcm only as RL tends to infinity. Both input-source powers are included; no zero-power claim follows from the absence of a supply pin.\u003c/p\u003e\\n\",\"Physical Requirements\":\"\u003cp\u003eUse native GF180 KLayout main rules, named-interface LVS and reviewed Magic RC extraction on a ten-division grid, without per-task waivers. Extraction must retain all models, multiplicities, dimensions, resistance values, connections and ordered ports. The functional outline includes task-declared devices, wells, contacts and all routing layers; annotations and pin labels do not add area. Maximum outline is 5000 × 1000 um and maximum GDS size is 10485760 bytes. Physically implement all devices and resistors without adding ideal internal macros or auxiliary servos; external sources, probe loads and storage capacitors belong to the testbench.\u003c/p\u003e\\n\",\"Tools and Submission\":\"$13\"},\"source_url\":\"https://github.com/MacAnalog/spicexplorer-release/tree/263d0322f8900dc331536fbbe6c0e804514fc454/analog-db/circuits/sup_001_vcm_detector\",\"status\":\"qualified\",\"title\":\"Passive Resistive Common-Mode Averager\",\"core\":false},\"catalog\":{\"tasks\":[],\"runs\":[],\"experiments\":[],\"contexts\":[],\"boards\":[]},\"previewRun\":null,\"preview\":null,\"evidenceError\":false}]}]\nc:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n14:I[27201,[\"/ICLayout-Bench/_next/static/chunks/2h60meymns2z5.js\"],\"IconMark\"]\n9:null\ne:[[\"$\",\"title\",\"0\",{\"children\":\"ICLayout-Bench | Circuit layout intelligence\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Independent evaluation of AI for integrated circuit layout. Compare model scores, explore circuit performance and inspect generated layouts.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/ICLayout-Bench/brand/iclayout-bench.svg\",\"type\":\"image/svg+xml\",\"sizes\":\"any\"}],[\"$\",\"$L14\",\"3\",{}]]\n"])</script></body></html>
