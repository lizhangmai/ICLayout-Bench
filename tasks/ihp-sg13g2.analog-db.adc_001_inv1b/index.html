"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[\"$L6\",[[\"$\",\"script\",\"script-0\",{\"src\":\"/ICLayout-Bench/_next/static/chunks/3_2wwayut9q0b.js\",\"async\":true,\"nonce\":\"$undefined\"}]],[\"$\",\"$L7\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.MetadataOutlet\",\"children\":\"$@9\"}]}]]}],{},null,false,null]},null,false,\"$a\"]},null,false,null],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Lb\",null,{\"children\":\"$Lc\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Ld\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.Metadata\",\"children\":\"$Le\"}]}]}],null]}],false]],\"m\":\"$undefined\",\"G\":[\"$f\",[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/ICLayout-Bench/_next/static/chunks/25phisebeeifo.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]]],\"S\":true,\"h\":null,\"r\":\"$undefined\",\"s\":\"$undefined\",\"a\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"U2oZdoUjWqT_XfcDHuQ5i\"}\n10:I[1186,[\"/ICLayout-Bench/_next/static/chunks/3gll1ekbrh320.js\",\"/ICLayout-Bench/_next/static/chunks/3_2wwayut9q0b.js\"],\"default\"]\na:C\n11:T1f0d,\u003ch1 id=\"problem-cmos-inverter-threshold-core-layout-task\"\u003eCMOS Inverter Threshold Core Layout Task\u003c/h1\u003e\n\u003ch2 id=\"problem-objective\"\u003eObjective\u003c/h2\u003e\n\u003cp\u003eThe fixed binding is a CMOS inverter: one 1/0.13 um NMOS and one 2.5/0.13 um PMOS, each m=1. Bodies connect to their respective rails through native physical contacts. It provides a threshold decision core; there is no sampling, independent reference, encoding or complete ADC. Target top cell: \u003ccode\u003eadc_001_inv1b\u003c/code\u003e.\u003c/p\u003e\n\u003ch2 id=\"problem-inputs-and-interface\"\u003eInputs and Interface\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003ematerials/circuit.cdl\u003c/code\u003e is the authoritative physical netlist; \u003ccode\u003ematerials/circuit.spice\u003c/code\u003e is the same compact-device circuit for simulation. \u003ccode\u003ematerials/testbench.spice\u003c/code\u003e supplies the external fixture. Both source and extracted candidate use the exact same deck, bias, loads, excitation, initial-state procedure and measurement windows. Ordered ports: vdd (1.2 V rail), vin (gate input), vout (drain output), vss (return).\u003c/p\u003e\n\u003ch2 id=\"problem-operating-conditions\"\u003eOperating Conditions\u003c/h2\u003e\n\u003cp\u003eIHP LV MOS TT, 27 C, VDD=1.2 V. Input driver impedance is 50 ohm; output capacitance is 20 fF. DC input sweeps 0–1.2 V in 1 mV steps. The transient driver starts at 0 V, rises at 10 ns, falls at 20.1 ns, has 100 ps edges and a 20 ns period. The initial DC output is high. The 31 ns run uses a maximum 1 ps step. Power is the net energy from supply and input driver divided by the 10–30 ns window.\u003c/p\u003e\n\u003ch2 id=\"problem-physical-requirements\"\u003ePhysical Requirements\u003c/h2\u003e\n\u003cp\u003eUse IHP native KLayout main and maximum rule decks and named-interface LVS; Magic full RC extraction. No case-specific waivers. Candidate extraction must preserve every model, multiplicity, size, resistor value, connection and ordered port. The functional outline includes devices, wells, contacts and all routing layers declared in the public task; annotation and pin labels do not add area. Maximum outline: 5000 by 1000 um. Maximum GDS size: 10485760 bytes. Every device and resistor must be physical; no ideal internal macro or auxiliary servo may be added. External sources, probe loads and storage capacitors belong to the testbench.\u003c/p\u003e\n\u003ch2 id=\"problem-electrical-requirements-and-scoring\"\u003eElectrical Requirements and Scoring\u003c/h2\u003e\n\u003cp\u003ePhysical checks and declared functional bounds remain mandatory. Quality has no\nfixed allowed-degradation threshold. Each \u003ccode\u003esource_*\u003c/code\u003e job simulates the declared\nsource circuit with exactly the same testbench, model resources, parameters,\nload and measurement window as its paired extracted-candidate job. A source\nobservation is the 100-point electrical baseline; it is independent of the\nsubmitted GDS. All individual pairs are retained in the evaluation report.\u003c/p\u003e\n\u003cp\u003eFor a post-layout observation x and its source observation b:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eMaximize: q = x/b; minimize: q = b/x. When a numerical scale s is declared,\nuse (x+s)/(b+s) or its inverse. This handles zero-valued error measurements;\ns is a normalization floor, not an allowed degradation or pass threshold.\u003c/li\u003e\n\u003cli\u003eAmplitude dB: q = 10^((x-b)/20) for maximize, its inverse for minimize.\u003c/li\u003e\n\u003cli\u003eTarget: q = 1/(1+abs(x-b)/s), with a declared physical scale s. Signed and\nzero-valued operating points are never divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eScoring uses \u003ccode\u003elayout\u003c/code\u003e. A metric uses its worst paired quality q. The score is\nS = 100 * product(q_i ** w_i), including area quality\nq_area = area_reference / candidate_functional_area. The weights below sum to\none. Dimensions describe measurements but do not determine their weights.\nPhysical or functional rejection scores zero; missing or invalid measurements\nproduce an unknown score, including measurements with zero weight.\nSource-equivalent performance at the area reference scores 100; improvements\ncan exceed 100. A weight expresses a tradeoff, not a hard acceptance limit.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eDefinition\u003c/th\u003e\n\u003cth\u003eBound\u003c/th\u003e\n\u003cth\u003eQuality\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ethreshold_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eUnique DC output=0.6 V crossing\u003c/td\u003e\n\u003ctd\u003eunbounded to unbounded\u003c/td\u003e\n\u003ctd\u003eresponse: target, target, scale=0.6\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edelay_s\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003es\u003c/td\u003e\n\u003ctd\u003eWorst 50% input to opposite 50% output delay\u003c/td\u003e\n\u003ctd\u003e0 to unbounded\u003c/td\u003e\n\u003ctd\u003eresponse: ratio, minimize, scale=1e-12\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003etransition_s\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003es\u003c/td\u003e\n\u003ctd\u003eWorst output 10–90% or 90–10% transition\u003c/td\u003e\n\u003ctd\u003e0 to unbounded\u003c/td\u003e\n\u003ctd\u003eresponse: ratio, minimize, scale=1e-12\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eMean net supply and input-driver power from 10–30 ns\u003c/td\u003e\n\u003ctd\u003e0 to unbounded\u003c/td\u003e\n\u003ctd\u003esupply: ratio, minimize, scale=1e-12\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eswing_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eDC high minus low output; meaningful logic transition\u003c/td\u003e\n\u003ctd\u003e0.6 to unbounded\u003c/td\u003e\n\u003ctd\u003ediagnostic / functional only\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eThe DC threshold is the unique output=0.6 V crossing, not a scan endpoint. Delay is the worse input 50% to opposite output 50% delay. Transition is the worse output 10–90% rise or 90–10% fall. Guards reject missing or multiple DC/transition crossings; independent audits require the intended 10–15 ns and 20–25 ns windows and correct ordering. DC high/low output uses actual endpoint samples, with a minimum 0.6 V swing establishing a meaningful logic transition. This is nominal loaded characterization, not Liberty/PVT or ADC accuracy.\u003c/p\u003e\n\u003cp\u003eStatic output bounds are physical rail-domain checks, nonnegative power/error bounds establish measurement domains, and KCL guards reject inconsistent DC solutions. All required conditions must be valid. No advertised upstream performance is a hard gate. The metric table specifies each target scale and normalization floor. Floors prevent zero-error ratios; scales and floors are normalization units, not acceptance tolerances.\u003c/p\u003e\n\u003cp\u003eFor each metric take the worst same-condition source-paired quality. Target quality is \u003ccode\u003e1/(1+abs(candidate-source)/scale)\u003c/code\u003e; minimizing ratio quality is \u003ccode\u003e(source+scale)/(candidate+scale)\u003c/code\u003e.  Missing/nonfinite/invalid source or candidate measurements and tool failures yield an unknown score; completed physical/functional rejection yields zero. Bounds apply to every observation.\u003c/p\u003e\n\u003cp\u003eCompact area anchor: 120 um2 = 20 um2 NMOS contact envelope + 30 um2 PMOS/well envelope + 20 um2 body-contact/isolation allowance + 50 um2 routing. These envelopes follow the fixed widths and contact/isolation needs, not the witness bounding box. Coefficient 1: a single logic stage with loaded transitions and connectivity. The circuit and these anchors are fixed before participant evaluation.\u003c/p\u003e\n\u003ch3 id=\"problem-score-weights\"\u003eScore weights\u003c/h3\u003e\n\u003cp\u003eInverter threshold element: switching threshold 25.5%; delay 34%; transition 12.8%; power 12.8%; area 15%. Each objective's weight is divided equally among its metrics.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.15\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ethreshold_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.255000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edelay_s\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.340000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003etransition_s\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.127500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.127500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch2 id=\"problem-tools-and-submission\"\u003eTools and Submission\u003c/h2\u003e\n\u003cp\u003eSolve budget: \u003cstrong\u003e6 hours\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eUse the runtime task/protocol and reviewed resource bundle to discover tools and feedback. Submit \u003ccode\u003e/workspace/output/final.gds\u003c/code\u003e explicitly through the protocol; merely writing it is not a submission. The reference and maintainer source records are excluded from solver inputs.\u003c/p\u003e\n12:T1475,\u003cp\u003ePhysical checks and declared functional bounds remain mandatory. Quality has no\nfixed allowed-degradation threshold. Each \u003ccode\u003esource_*\u003c/code\u003e job simulates the declared\nsource circuit with exactly the same testbench, model resources, parameters,\nload and measurement window as its paired extracted-candidate job. A source\nobservation is the 100-point electrical baseline; it is independent of the\nsubmitted GDS. All individual pairs are retained in the evaluation report.\u003c/p\u003e\n\u003cp\u003eFor a post-layout observation x and its source observation b:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eMaximize: q = x/b; minimize: q = b/x. When a numerical scale s is declared,\nuse (x+s)/(b+s) or its inverse. This handles zero-valued error measurements;\ns is a normalization floor, not an allowed degradation or pass threshold.\u003c/li\u003e\n\u003cli\u003eAmplitude dB: q = 10^((x-b)/20) for maximize, its inverse for minimize.\u003c/li\u003e\n\u003cli\u003eTarget: q = 1/(1+abs(x-b)/s), with a declared physical scale s. Signed and\nzero-valued operating points are never divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eScoring uses \u003ccode\u003elayout\u003c/code\u003e. A metric uses its worst paired quality q. The score is\nS = 100 * product(q_i ** w_i), including area quality\nq_area = area_reference / candidate_functional_area. The weights below sum to\none. Dimensions describe measurements but do not determine their weights.\nPhysical or functional rejection scores zero; missing or invalid measurements\nproduce an unknown score, including measurements with zero weight.\nSource-equivalent performance at the area reference scores 100; improvements\ncan exceed 100. A weight expresses a tradeoff, not a hard acceptance limit.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eDefinition\u003c/th\u003e\n\u003cth\u003eBound\u003c/th\u003e\n\u003cth\u003eQuality\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ethreshold_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eUnique DC output=0.6 V crossing\u003c/td\u003e\n\u003ctd\u003eunbounded to unbounded\u003c/td\u003e\n\u003ctd\u003eresponse: target, target, scale=0.6\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edelay_s\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003es\u003c/td\u003e\n\u003ctd\u003eWorst 50% input to opposite 50% output delay\u003c/td\u003e\n\u003ctd\u003e0 to unbounded\u003c/td\u003e\n\u003ctd\u003eresponse: ratio, minimize, scale=1e-12\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003etransition_s\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003es\u003c/td\u003e\n\u003ctd\u003eWorst output 10–90% or 90–10% transition\u003c/td\u003e\n\u003ctd\u003e0 to unbounded\u003c/td\u003e\n\u003ctd\u003eresponse: ratio, minimize, scale=1e-12\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eMean net supply and input-driver power from 10–30 ns\u003c/td\u003e\n\u003ctd\u003e0 to unbounded\u003c/td\u003e\n\u003ctd\u003esupply: ratio, minimize, scale=1e-12\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eswing_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eDC high minus low output; meaningful logic transition\u003c/td\u003e\n\u003ctd\u003e0.6 to unbounded\u003c/td\u003e\n\u003ctd\u003ediagnostic / functional only\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eThe DC threshold is the unique output=0.6 V crossing, not a scan endpoint. Delay is the worse input 50% to opposite output 50% delay. Transition is the worse output 10–90% rise or 90–10% fall. Guards reject missing or multiple DC/transition crossings; independent audits require the intended 10–15 ns and 20–25 ns windows and correct ordering. DC high/low output uses actual endpoint samples, with a minimum 0.6 V swing establishing a meaningful logic transition. This is nominal loaded characterization, not Liberty/PVT or ADC accuracy.\u003c/p\u003e\n\u003cp\u003eStatic output bounds are physical rail-domain checks, nonnegative power/error bounds establish measurement domains, and KCL guards reject inconsistent DC solutions. All required conditions must be valid. No advertised upstream performance is a hard gate. The metric table specifies each target scale and normalization floor. Floors prevent zero-error ratios; scales and floors are normalization units, not acceptance tolerances.\u003c/p\u003e\n\u003cp\u003eFor each metric take the worst same-condition source-paired quality. Target quality is \u003ccode\u003e1/(1+abs(candidate-source)/scale)\u003c/code\u003e; minimizing ratio quality is \u003ccode\u003e(source+scale)/(candidate+scale)\u003c/code\u003e.  Missing/nonfinite/invalid source or candidate measurements and tool failures yield an unknown score; completed physical/functional rejection yields zero. Bounds apply to every observation.\u003c/p\u003e\n\u003cp\u003eCompact area anchor: 120 um2 = 20 um2 NMOS contact envelope + 30 um2 PMOS/well envelope + 20 um2 body-contact/isolation allowance + 50 um2 routing. These envelopes follow the fixed widths and contact/isolation needs, not the witness bounding box. Coefficient 1: a single logic stage with loaded transitions and connectivity. The circuit and these anchors are fixed before participant evaluation.\u003c/p\u003e\n\u003ch3\u003eScore weights\u003c/h3\u003e\n\u003cp\u003eInverter threshold element: switching threshold 25.5%; delay 34%; transition 12.8%; power 12.8%; area 15%. Each objective's weight is divided equally among its metrics.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.15\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ethreshold_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.255000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edelay_s\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.340000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003etransition_s\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.127500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.127500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n6:[\"$\",\"$8\",null,{\"fallback\":[\"$\",\"p\",null,{\"children\":\"Loading published evidence…\"}],\"children\":[\"$\",\"$L10\",null,{\"task\":{\"case_path\":\"tasks/ihp-sg13g2/analog-db/cases/adc_001_inv1b/case.toml\",\"coefficient\":1,\"collection\":\"analog-db\",\"configuration_url\":\"/ICLayout-Bench/assets/15a45dfb0015daf6001fe5b5ef6f14c368245cfcfca8bed74fbf773f49575cb4.txt\",\"description_html\":\"$11\",\"description_path\":\"tasks/ihp-sg13g2/analog-db/cases/adc_001_inv1b/problem.md\",\"hours\":6,\"id\":\"ihp-sg13g2.analog-db.adc_001_inv1b\",\"inputs\":{\"description\":{\"format\":\"text\",\"path\":\"problem.md\",\"sha256\":\"f77341695350c9c22f0f938c9deb1c21d4085419f90b9c92448364039ae9d4e8\"},\"netlist\":{\"format\":\"spice\",\"path\":\"materials/circuit.cdl\",\"sha256\":\"ac17dacdee7c373b47d4038a7318a7b0fedc024031b06f93011f8eaab684caf4\",\"subcircuit\":\"adc_001_inv1b\"},\"performance\":{\"format\":\"spice\",\"path\":\"materials/testbench.spice\",\"sha256\":\"c7fa64149fb838b9ae6b0fbcd173883a86be2db0869ba9f7a3d13e61def94476\"},\"simulation\":{\"format\":\"spice\",\"path\":\"materials/circuit.spice\",\"sha256\":\"5b7039e6399c1336c9ed31405b0176f512f2981b51e1fa8ffae36fa8d51af7aa\"}},\"licenses\":[{\"name\":\"LICENSE\",\"path\":\"tasks/ihp-sg13g2/analog-db/LICENSE\",\"url\":\"/ICLayout-Bench/assets/644dd511526bc2da77ee7c74714118315db91255376d0ea93a1975b4dbfbfb3d.txt\"},{\"name\":\"NOTICE\",\"path\":\"tasks/ihp-sg13g2/analog-db/NOTICE\",\"url\":\"/ICLayout-Bench/assets/69f7110d12f142806dfdd53f516082a82032da57d1ad47d0bc792d3a68329145.txt\"}],\"materials\":[{\"name\":\"problem.md\",\"role\":\"description\",\"url\":\"/ICLayout-Bench/assets/f77341695350c9c22f0f938c9deb1c21d4085419f90b9c92448364039ae9d4e8.txt\"},{\"name\":\"materials/circuit.cdl\",\"role\":\"netlist\",\"url\":\"/ICLayout-Bench/assets/ac17dacdee7c373b47d4038a7318a7b0fedc024031b06f93011f8eaab684caf4.txt\"},{\"name\":\"materials/circuit.spice\",\"role\":\"simulation\",\"url\":\"/ICLayout-Bench/assets/5b7039e6399c1336c9ed31405b0176f512f2981b51e1fa8ffae36fa8d51af7aa.txt\"},{\"name\":\"materials/testbench.spice\",\"role\":\"performance\",\"url\":\"/ICLayout-Bench/assets/c7fa64149fb838b9ae6b0fbcd173883a86be2db0869ba9f7a3d13e61def94476.txt\"}],\"metrics\":[{\"aggregation\":\"max\",\"category\":\"physical\",\"direction\":\"minimize\",\"id\":\"functional_area\",\"observations\":[\"geometry:area\"],\"unit\":\"um2\"},{\"aggregation\":\"max\",\"baseline\":[\"source_condition_0:threshold_v\"],\"category\":\"performance\",\"dimension\":\"response\",\"direction\":\"target\",\"id\":\"threshold_v\",\"normalization\":\"target\",\"observations\":[\"condition_0:threshold_v\"],\"scale\":0.6,\"unit\":\"V\"},{\"aggregation\":\"max\",\"baseline\":[\"source_condition_0:delay_s\"],\"category\":\"performance\",\"dimension\":\"response\",\"direction\":\"minimize\",\"id\":\"delay_s\",\"lower\":0,\"normalization\":\"ratio\",\"observations\":[\"condition_0:delay_s\"],\"scale\":1e-12,\"unit\":\"s\"},{\"aggregation\":\"max\",\"baseline\":[\"source_condition_0:transition_s\"],\"category\":\"performance\",\"dimension\":\"response\",\"direction\":\"minimize\",\"id\":\"transition_s\",\"lower\":0,\"normalization\":\"ratio\",\"observations\":[\"condition_0:transition_s\"],\"scale\":1e-12,\"unit\":\"s\"},{\"aggregation\":\"max\",\"baseline\":[\"source_condition_0:power_w\"],\"category\":\"performance\",\"dimension\":\"supply\",\"direction\":\"minimize\",\"id\":\"power_w\",\"lower\":0,\"normalization\":\"ratio\",\"observations\":[\"condition_0:power_w\"],\"scale\":1e-12,\"unit\":\"W\"},{\"aggregation\":\"max\",\"category\":\"performance\",\"direction\":\"maximize\",\"id\":\"swing_v\",\"lower\":0.6,\"observations\":[\"condition_0:swing_v\"],\"unit\":\"V\"}],\"pdk\":\"ihp-sg13g2\",\"reader\":{\"category\":\"Mixed-signal\",\"summary\":\"Characterizes an inverter switching threshold, output swing and timing.\",\"title\":\"CMOS Inverter Threshold Core\"},\"schematic_url\":\"/ICLayout-Bench/assets/a8cccb07772179454cce99b4d0e172c6a622160212c25ddda6f451e08f2350d8.svg\",\"scoring\":{\"area_metric\":\"functional_area\",\"area_target\":120,\"method\":\"layout\",\"rationale\":\"Inverter threshold element: switching threshold 25.5%; delay 34%; transition 12.8%; power 12.8%; area 15%. Each objective's weight is divided equally among its metrics.\",\"weights\":{\"delay_s\":0.34,\"functional_area\":0.15,\"power_w\":0.1275,\"threshold_v\":0.255,\"transition_s\":0.1275}},\"sections\":{\"Electrical Requirements and Scoring\":\"$12\",\"Objective\":\"\u003cp\u003eThe fixed binding is a CMOS inverter: one 1/0.13 um NMOS and one 2.5/0.13 um PMOS, each m=1. Bodies connect to their respective rails through native physical contacts. It provides a threshold decision core; there is no sampling, independent reference, encoding or complete ADC. Target top cell: \u003ccode\u003eadc_001_inv1b\u003c/code\u003e.\u003c/p\u003e\\n\",\"Operating Conditions\":\"\u003cp\u003eIHP LV MOS TT, 27 C, VDD=1.2 V. Input driver impedance is 50 ohm; output capacitance is 20 fF. DC input sweeps 0–1.2 V in 1 mV steps. The transient driver starts at 0 V, rises at 10 ns, falls at 20.1 ns, has 100 ps edges and a 20 ns period. The initial DC output is high. The 31 ns run uses a maximum 1 ps step. Power is the net energy from supply and input driver divided by the 10–30 ns window.\u003c/p\u003e\\n\",\"Physical Requirements\":\"\u003cp\u003eUse IHP native KLayout main and maximum rule decks and named-interface LVS; Magic full RC extraction. No case-specific waivers. Candidate extraction must preserve every model, multiplicity, size, resistor value, connection and ordered port. The functional outline includes devices, wells, contacts and all routing layers declared in the public task; annotation and pin labels do not add area. Maximum outline: 5000 by 1000 um. Maximum GDS size: 10485760 bytes. Every device and resistor must be physical; no ideal internal macro or auxiliary servo may be added. External sources, probe loads and storage capacitors belong to the testbench.\u003c/p\u003e\\n\"},\"source_url\":\"https://github.com/MacAnalog/spicexplorer-release/tree/263d0322f8900dc331536fbbe6c0e804514fc454/analog-db/circuits/adc_001_inv1b\",\"status\":\"qualified\",\"title\":\"CMOS Inverter Threshold Core\"},\"catalog\":{\"boards\":[],\"contexts\":[],\"experiments\":[],\"runs\":[],\"tasks\":[]},\"evidenceError\":false}]}]\nc:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n13:I[27201,[\"/ICLayout-Bench/_next/static/chunks/3gll1ekbrh320.js\"],\"IconMark\"]\n9:null\ne:[[\"$\",\"title\",\"0\",{\"children\":\"ICLayout-Bench | Circuit layout intelligence\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Measured progress in AI-driven integrated circuit layout. Explore circuits, model conditions and reviewed experimental evidence.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/ICLayout-Bench/brand/iclayout-bench.svg\",\"type\":\"image/svg+xml\",\"sizes\":\"any\"}],[\"$\",\"$L13\",\"3\",{}]]\n"])</script></body></html>
