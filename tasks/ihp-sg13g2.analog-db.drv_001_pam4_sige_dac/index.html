$L5\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[\"$L6\",[[\"$\",\"script\",\"script-0\",{\"src\":\"/ICLayout-Bench/_next/static/chunks/3_2wwayut9q0b.js\",\"async\":true,\"nonce\":\"$undefined\"}]],[\"$\",\"$L7\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.MetadataOutlet\",\"children\":\"$@9\"}]}]]}],{},null,false,null]},null,false,\"$a\"]},null,false,null],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Lb\",null,{\"children\":\"$Lc\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Ld\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.Metadata\",\"children\":\"$Le\"}]}]}],null]}],false]],\"m\":\"$undefined\",\"G\":[\"$f\",[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/ICLayout-Bench/_next/static/chunks/25phisebeeifo.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]]],\"S\":true,\"h\":null,\"r\":\"$undefined\",\"s\":\"$undefined\",\"a\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"U2oZdoUjWqT_XfcDHuQ5i\"}\n10:I[1186,[\"/ICLayout-Bench/_next/static/chunks/3gll1ekbrh320.js\",\"/ICLayout-Bench/_next/static/chunks/3_2wwayut9q0b.js\"],\"default\"]\na:C\n11:T2864,\u003ch1 id=\"problem-broadband-sige-pam4-driver-layout-task\"\u003eBroadband SiGe PAM4 Driver Layout Task\u003c/h1\u003e\n\u003ch2 id=\"problem-objective\"\u003eObjective\u003c/h2\u003e\n\u003cp\u003eLay out the upstream inductorless, three-cell current-steering PAM4 driver as\n\u003ccode\u003epam4drv_pam4_lay\u003c/code\u003e. One LSB cell and two parallel MSB cells contain twelve\nthree-finger \u003ccode\u003enpn13G2\u003c/code\u003e HBTs, twelve physical \u003ccode\u003ersil\u003c/code\u003e resistors and three physical\nMIM degeneration capacitors. Preserve the supplied topology and dimensions.\nThe task coefficient is 4.\u003c/p\u003e\n\u003ch2 id=\"problem-inputs-and-interface\"\u003eInputs and Interface\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003ematerials/circuit.cdl\u003c/code\u003e is the native LVS authority;\n\u003ccode\u003ematerials/circuit.spice\u003c/code\u003e is its simulator representation;\n\u003ccode\u003ematerials/testbench.spice\u003c/code\u003e defines the electrical measurements.\u003c/p\u003e\n\u003cp\u003eOrdered ports: \u003ccode\u003elsbp lsbn msbp msbn outp outn vcc vcasc vcmb tmsb0 tlsb0 tmsb1 sub\u003c/code\u003e.\nThe first four ports are differential LSB/MSB inputs, \u003ccode\u003eoutp/outn\u003c/code\u003e are differential\noutputs, \u003ccode\u003evcc\u003c/code\u003e is the supply, \u003ccode\u003evcasc\u003c/code\u003e biases the cascode bases, \u003ccode\u003evcmb\u003c/code\u003e is the input\ntermination reference, the three tail ports connect to external current sinks,\nand \u003ccode\u003esub\u003c/code\u003e is the ideal substrate reference. The three testbench VCCS tails are\nexternal bias apparatus, not missing physical transistors.\u003c/p\u003e\n\u003ch2 id=\"problem-operating-conditions\"\u003eOperating Conditions\u003c/h2\u003e\n\u003cp\u003eUse the upstream \u003cstrong\u003elayout signoff point\u003c/strong\u003e, not its separate static sizing point:\n4 V supply, 3.35 V cascode bias, 1.9 V input common mode and 15 mA per cell.\nThe nominal corners are \u003ccode\u003ehbt_typ\u003c/code\u003e, \u003ccode\u003eres_typ\u003c/code\u003e and \u003ccode\u003ecap_typ\u003c/code\u003e at 27 °C. HBTs have\n\u003ccode\u003eNx=3\u003c/code\u003e. Physical dimensions are fixed by the netlists; the nominal targets are\n50 Ω collector loads, 48 Ω input terminations, 3.2 Ω degeneration and 16 fF\nbridging capacitance. PDK geometry models determine their actual values.\u003c/p\u003e\n\u003cp\u003eBoth RF ports use 50 Ω per side (100 Ω differential). AC gain is differential\npower-wave S21 = \u003ccode\u003e2*Vout/Vsrc\u003c/code\u003e, measured at 1 GHz; bandwidth is checked by the\n50 GHz gain relative to 1 GHz. S11 is evaluated at \u003cstrong\u003e32 GHz\u003c/strong\u003e, and S22 at\n\u003cstrong\u003e50 GHz\u003c/strong\u003e, using the testbench's 20 points/decade sweep and interpolation.\nDo not substitute the preceding sweep samples for these endpoints.\u003c/p\u003e\n\u003cp\u003eThe large-signal test drives LSB and MSB in phase at 1 GHz through the same\nsource impedances, with ±0.8 V per source around 1.9 V. Supplies and bias ramp\nfrom zero over 8 ns; sine excitation starts at 9 ns. The 16–21 ns measurement\nwindow contains five periods. Swing is twice the fundamental phasor amplitude\nusing the exported transient samples, rather than raw peak-to-peak excursion.\u003c/p\u003e\n\u003ch2 id=\"problem-physical-requirements\"\u003ePhysical Requirements\u003c/h2\u003e\n\u003cp\u003eSubmit GDS with the exact top-cell name, all thirteen labeled ports, and at most\n10 MiB. Native SG13G2 DRC checks main and extra maximal rules without density or\nantenna; no marker waivers apply. Native LVS compares devices, dimensions,\nconnectivity and named ports. Functional width/height must not exceed 160/120 µm.\nThe published \u003ccode\u003eoutline\u003c/code\u003e layer list covers HBT, resistor, MIM, substrate-contact,\nseven-metal and via geometry; pin/text and presentation layers are excluded.\u003c/p\u003e\n\u003cp\u003ePost-layout simulation uses KPEX 0.3.12 nominal 2.5D \u003cstrong\u003ecoupling capacitance\u003c/strong\u003e from\nthe submitted GDS. Native extracted devices are checked against the candidate's\nindependent LVS database. MIM devices retain extracted endpoints and \u003ccode\u003ew/l/m\u003c/code\u003e;\nno MIM layers are stripped and no source devices are reinserted. The process\nreference plane is tied to \u003ccode\u003esub\u003c/code\u003e. Distributed wire resistance, inductance,\npads/package, statistical yield and process-corner robustness are not claimed\nby this upstream CC characterization contract. Finite substrate/tail-generator\ncircuits are outside the physical core. A PAM4 eye/RLM result is not established\nby these tone and small-signal checks.\u003c/p\u003e\n\u003ch2 id=\"problem-electrical-requirements-and-scoring\"\u003eElectrical Requirements and Scoring\u003c/h2\u003e\n\u003cp\u003ePhysical checks and declared functional bounds remain mandatory. Quality has no\nfixed allowed-degradation threshold. Each \u003ccode\u003esource_*\u003c/code\u003e job simulates the declared\nsource circuit with exactly the same testbench, model resources, parameters,\nload and measurement window as its paired extracted-candidate job. A source\nobservation is the 100-point electrical baseline; it is independent of the\nsubmitted GDS. All individual pairs are retained in the evaluation report.\u003c/p\u003e\n\u003cp\u003eFor a post-layout observation x and its source observation b:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eMaximize: q = x/b; minimize: q = b/x. When a numerical scale s is declared,\nuse (x+s)/(b+s) or its inverse. This handles zero-valued error measurements;\ns is a normalization floor, not an allowed degradation or pass threshold.\u003c/li\u003e\n\u003cli\u003eAmplitude dB: q = 10^((x-b)/20) for maximize, its inverse for minimize.\u003c/li\u003e\n\u003cli\u003eTarget: q = 1/(1+abs(x-b)/s), with a declared physical scale s. Signed and\nzero-valued operating points are never divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eScoring uses \u003ccode\u003elayout\u003c/code\u003e. A metric uses its worst paired quality q. The score is\nS = 100 * product(q_i ** w_i), including area quality\nq_area = area_reference / candidate_functional_area. The weights below sum to\none. Dimensions describe measurements but do not determine their weights.\nPhysical or functional rejection scores zero; missing or invalid measurements\nproduce an unknown score, including measurements with zero weight.\nSource-equivalent performance at the area reference scores 100; improvements\ncan exceed 100. A weight expresses a tradeoff, not a hard acceptance limit.\u003c/p\u003e\n\u003cp\u003eAll measurements and their paired source observations must be finite and usable.\nPerformance is scored continuously against the same-condition source circuit;\nupstream data-sheet targets are not acceptance thresholds. Supply consumption\nand output swing must be nonnegative; zero or otherwise unusable ratio baselines\ncannot establish a score. Physical checks remain mandatory.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eDefinition\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eQuality rule\u003c/th\u003e\n\u003cth\u003eFunctional bounds\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003elsb_gain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eLSB S21 at 1 GHz\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003emaximize / db20\u003c/td\u003e\n\u003ctd\u003enone\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emsb_gain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMSB S21 at 1 GHz\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003emaximize / db20\u003c/td\u003e\n\u003ctd\u003enone\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edac_weight_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMSB minus LSB gain\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003esource target\u003c/td\u003e\n\u003ctd\u003enone\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003elsb_rel50_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eLSB S21(50 GHz) minus S21(1 GHz)\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003emaximize / db20\u003c/td\u003e\n\u003ctd\u003enone\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emsb_rel50_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMSB S21(50 GHz) minus S21(1 GHz)\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003emaximize / db20\u003c/td\u003e\n\u003ctd\u003enone\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003es11_32g_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMSB input reflection coefficient, 20 log10(abs(S11)), at 32 GHz\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003eminimize / db20\u003c/td\u003e\n\u003ctd\u003enone\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003es22_50g_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eOutput reflection coefficient, 20 log10(abs(S22)), at 50 GHz\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003eminimize / db20\u003c/td\u003e\n\u003ctd\u003enone\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_mw\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003ePower drawn from the 4 V rail at OP\u003c/td\u003e\n\u003ctd\u003emW\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e≥ 0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eswing_vpp\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDifferential output fundamental swing\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003emaximize / ratio\u003c/td\u003e\n\u003ctd\u003e≥ 0\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eIndependent source simulation uses the same deck, conditions and models.\nResponse quality uses \u003ccode\u003edb20\u003c/code\u003e for gain,\nrelative bandwidth and reflection-coefficient dB, and a maximizing ratio for swing. Binary\nweight uses target normalization to its source value with a \u003ccode\u003e20*log10(2)\u003c/code\u003e dB scale, the ideal binary amplitude-weight interval. Supply quality uses a minimizing\npower ratio. Area quality is \u003ccode\u003eQ = 10000 µm² / functional_area\u003c/code\u003e. The frozen compact\nallowance is 4500 µm² for device rows + 2000 µm² for terminations/loads +\n3500 µm² for routing, vias and substrate contacts. Reflection-coefficient dB\nis the negative of positive return loss, so smaller values improve quality. Physical or electrical rejection scores zero; incomplete evaluation\ncannot establish success. The area target is a compact sizing allowance,\nnot the area of a qualified reference.\u003c/p\u003e\n\u003ch3 id=\"problem-score-weights\"\u003eScore weights\u003c/h3\u003e\n\u003cp\u003ePAM4 SiGe driver: binary weighting 22.5%; high-frequency transfer 22.5%; port matching 18%; gain and swing 18%; power 9%; area 10%. Each objective's weight is divided equally among its metrics.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edac_weight_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.225000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003elsb_rel50_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.112500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emsb_rel50_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.112500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003es11_32g_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.090000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003es22_50g_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.090000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003elsb_gain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.060000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emsb_gain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.060000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eswing_vpp\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.060000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_mw\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.090000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch2 id=\"problem-tools-and-submission\"\u003eTools and Submission\u003c/h2\u003e\n\u003cp\u003eSolve budget: \u003cstrong\u003e4 hours\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eUse the reviewed SG13G2 resources and the runtime task/protocol metadata.\nNgspice must be ≥45 with \u003ccode\u003engbehavior=hsa\u003c/code\u003e, compiled R3_CMC support and the\nspecified HBT/capacitor models. The toolchain provides native KLayout checks,\ncandidate-derived KPEX capacitance and ngspice feedback. Write\n\u003ccode\u003e/workspace/output/final.gds\u003c/code\u003e and explicitly submit it through the runtime\nsubmission interface. Reference and maintainer material is not a solver input.\u003c/p\u003e\n12:T15e1,\u003cp\u003ePhysical checks and declared functional bounds remain mandatory. Quality has no\nfixed allowed-degradation threshold. Each \u003ccode\u003esource_*\u003c/code\u003e job simulates the declared\nsource circuit with exactly the same testbench, model resources, parameters,\nload and measurement window as its paired extracted-candidate job. A source\nobservation is the 100-point electrical baseline; it is independent of the\nsubmitted GDS. All individual pairs are retained in the evaluation report.\u003c/p\u003e\n\u003cp\u003eFor a post-layout observation x and its source observation b:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eMaximize: q = x/b; minimize: q = b/x. When a numerical scale s is declared,\nuse (x+s)/(b+s) or its inverse. This handles zero-valued error measurements;\ns is a normalization floor, not an allowed degradation or pass threshold.\u003c/li\u003e\n\u003cli\u003eAmplitude dB: q = 10^((x-b)/20) for maximize, its inverse for minimize.\u003c/li\u003e\n\u003cli\u003eTarget: q = 1/(1+abs(x-b)/s), with a declared physical scale s. Signed and\nzero-valued operating points are never divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eScoring uses \u003ccode\u003elayout\u003c/code\u003e. A metric uses its worst paired quality q. The score is\nS = 100 * product(q_i ** w_i), including area quality\nq_area = area_reference / candidate_functional_area. The weights below sum to\none. Dimensions describe measurements but do not determine their weights.\nPhysical or functional rejection scores zero; missing or invalid measurements\nproduce an unknown score, including measurements with zero weight.\nSource-equivalent performance at the area reference scores 100; improvements\ncan exceed 100. A weight expresses a tradeoff, not a hard acceptance limit.\u003c/p\u003e\n\u003cp\u003eAll measurements and their paired source observations must be finite and usable.\nPerformance is scored continuously against the same-condition source circuit;\nupstream data-sheet targets are not acceptance thresholds. Supply consumption\nand output swing must be nonnegative; zero or otherwise unusable ratio baselines\ncannot establish a score. Physical checks remain mandatory.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eDefinition\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eQuality rule\u003c/th\u003e\n\u003cth\u003eFunctional bounds\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003elsb_gain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eLSB S21 at 1 GHz\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003emaximize / db20\u003c/td\u003e\n\u003ctd\u003enone\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emsb_gain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMSB S21 at 1 GHz\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003emaximize / db20\u003c/td\u003e\n\u003ctd\u003enone\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edac_weight_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMSB minus LSB gain\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003esource target\u003c/td\u003e\n\u003ctd\u003enone\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003elsb_rel50_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eLSB S21(50 GHz) minus S21(1 GHz)\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003emaximize / db20\u003c/td\u003e\n\u003ctd\u003enone\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emsb_rel50_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMSB S21(50 GHz) minus S21(1 GHz)\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003emaximize / db20\u003c/td\u003e\n\u003ctd\u003enone\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003es11_32g_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMSB input reflection coefficient, 20 log10(abs(S11)), at 32 GHz\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003eminimize / db20\u003c/td\u003e\n\u003ctd\u003enone\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003es22_50g_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eOutput reflection coefficient, 20 log10(abs(S22)), at 50 GHz\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003eminimize / db20\u003c/td\u003e\n\u003ctd\u003enone\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_mw\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003ePower drawn from the 4 V rail at OP\u003c/td\u003e\n\u003ctd\u003emW\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e≥ 0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eswing_vpp\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDifferential output fundamental swing\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003emaximize / ratio\u003c/td\u003e\n\u003ctd\u003e≥ 0\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eIndependent source simulation uses the same deck, conditions and models.\nResponse quality uses \u003ccode\u003edb20\u003c/code\u003e for gain,\nrelative bandwidth and reflection-coefficient dB, and a maximizing ratio for swing. Binary\nweight uses target normalization to its source value with a \u003ccode\u003e20*log10(2)\u003c/code\u003e dB scale, the ideal binary amplitude-weight interval. Supply quality uses a minimizing\npower ratio. Area quality is \u003ccode\u003eQ = 10000 µm² / functional_area\u003c/code\u003e. The frozen compact\nallowance is 4500 µm² for device rows + 2000 µm² for terminations/loads +\n3500 µm² for routing, vias and substrate contacts. Reflection-coefficient dB\nis the negative of positive return loss, so smaller values improve quality. Physical or electrical rejection scores zero; incomplete evaluation\ncannot establish success. The area target is a compact sizing allowance,\nnot the area of a qualified reference.\u003c/p\u003e\n\u003ch3\u003eScore weights\u003c/h3\u003e\n\u003cp\u003ePAM4 SiGe driver: binary weighting 22.5%; high-frequency transfer 22.5%; port matching 18%; gain and swing 18%; power 9%; area 10%. Each objective's weight is divided equally among its metrics.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edac_weight_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.225000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003elsb_rel50_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.112500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emsb_rel50_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.112500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003es11_32g_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.090000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003es22_50g_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.090000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003elsb_gain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.060000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emsb_gain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.060000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eswing_vpp\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.060000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_mw\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.090000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n13:T548,\u003cp\u003eUse the upstream \u003cstrong\u003elayout signoff point\u003c/strong\u003e, not its separate static sizing point:\n4 V supply, 3.35 V cascode bias, 1.9 V input common mode and 15 mA per cell.\nThe nominal corners are \u003ccode\u003ehbt_typ\u003c/code\u003e, \u003ccode\u003eres_typ\u003c/code\u003e and \u003ccode\u003ecap_typ\u003c/code\u003e at 27 °C. HBTs have\n\u003ccode\u003eNx=3\u003c/code\u003e. Physical dimensions are fixed by the netlists; the nominal targets are\n50 Ω collector loads, 48 Ω input terminations, 3.2 Ω degeneration and 16 fF\nbridging capacitance. PDK geometry models determine their actual values.\u003c/p\u003e\n\u003cp\u003eBoth RF ports use 50 Ω per side (100 Ω differential). AC gain is differential\npower-wave S21 = \u003ccode\u003e2*Vout/Vsrc\u003c/code\u003e, measured at 1 GHz; bandwidth is checked by the\n50 GHz gain relative to 1 GHz. S11 is evaluated at \u003cstrong\u003e32 GHz\u003c/strong\u003e, and S22 at\n\u003cstrong\u003e50 GHz\u003c/strong\u003e, using the testbench's 20 points/decade sweep and interpolation.\nDo not substitute the preceding sweep samples for these endpoints.\u003c/p\u003e\n\u003cp\u003eThe large-signal test drives LSB and MSB in phase at 1 GHz through the same\nsource impedances, with ±0.8 V per source around 1.9 V. Supplies and bias ramp\nfrom zero over 8 ns; sine excitation starts at 9 ns. The 16–21 ns measurement\nwindow contains five periods. Swing is twice the fundamental phasor amplitude\nusing the exported transient samples, rather than raw peak-to-peak excursion.\u003c/p\u003e\n14:T4b8,\u003cp\u003eSubmit GDS with the exact top-cell name, all thirteen labeled ports, and at most\n10 MiB. Native SG13G2 DRC checks main and extra maximal rules without density or\nantenna; no marker waivers apply. Native LVS compares devices, dimensions,\nconnectivity and named ports. Functional width/height must not exceed 160/120 µm.\nThe published \u003ccode\u003eoutline\u003c/code\u003e layer list covers HBT, resistor, MIM, substrate-contact,\nseven-metal and via geometry; pin/text and presentation layers are excluded.\u003c/p\u003e\n\u003cp\u003ePost-layout simulation uses KPEX 0.3.12 nominal 2.5D \u003cstrong\u003ecoupling capacitance\u003c/strong\u003e from\nthe submitted GDS. Native extracted devices are checked against the candidate's\nindependent LVS database. MIM devices retain extracted endpoints and \u003ccode\u003ew/l/m\u003c/code\u003e;\nno MIM layers are stripped and no source devices are reinserted. The process\nreference plane is tied to \u003ccode\u003esub\u003c/code\u003e. Distributed wire resistance, inductance,\npads/package, statistical yield and process-corner robustness are not claimed\nby this upstream CC characterization contract. Finite substrate/tail-generator\ncircuits are outside the physical core. A PAM4 eye/RLM result is not established\nby these tone and small-signal checks.\u003c/p\u003e\n6:[\"$\",\"$8\",null,{\"fallback\":[\"$\",\"p\",null,{\"children\":\"Loading published evidence…\"}],\"children\":[\"$\",\"$L10\",null,{\"task\":{\"case_path\":\"tasks/ihp-sg13g2/analog-db/cases/drv_001_pam4_sige_dac/case.toml\",\"coefficient\":4,\"collection\":\"analog-db\",\"configuration_url\":\"/ICLayout-Bench/assets/f09f7966d5b3a9e727670b252db9e476e15ad0b10cf64b326897054b23acfdbe.txt\",\"description_html\":\"$11\",\"description_path\":\"tasks/ihp-sg13g2/analog-db/cases/drv_001_pam4_sige_dac/problem.md\",\"hours\":4,\"id\":\"ihp-sg13g2.analog-db.drv_001_pam4_sige_dac\",\"inputs\":{\"description\":{\"format\":\"text\",\"path\":\"problem.md\",\"sha256\":\"f293d5119508f41a3d4b5cf940eb934d822097ed4ab4299b82a538f04f9cf10d\"},\"netlist\":{\"format\":\"spice\",\"path\":\"materials/circuit.cdl\",\"sha256\":\"310d1f67d5d237cfc88525f26568c5bcf45680bb2e8141982600669ee81a2ead\",\"subcircuit\":\"pam4drv_pam4_lay\"},\"performance\":{\"format\":\"spice\",\"path\":\"materials/testbench.spice\",\"sha256\":\"3b4e7c1c84b2dfb82e22cbc59b4abad5948608e463b789d97e057de9094197ca\"},\"s
