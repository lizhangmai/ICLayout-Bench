r\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L5\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[\"$L6\",[[\"$\",\"script\",\"script-0\",{\"src\":\"/ICLayout-Bench/_next/static/chunks/27jip_2vcvnd5.js\",\"async\":true,\"nonce\":\"$undefined\"}]],[\"$\",\"$L7\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.MetadataOutlet\",\"children\":\"$@9\"}]}]]}],{},null,false,null]},null,false,\"$a\"]},null,false,null],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Lb\",null,{\"children\":\"$Lc\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Ld\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.Metadata\",\"children\":\"$Le\"}]}]}],null]}],false]],\"m\":\"$undefined\",\"G\":[\"$f\",[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/ICLayout-Bench/_next/static/chunks/3sa54_ghi1h2h.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]]],\"S\":true,\"h\":null,\"r\":\"$undefined\",\"s\":\"$undefined\",\"a\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"2hqB741EA4j7xWQVg6hu-\"}\n10:I[1186,[\"/ICLayout-Bench/_next/static/chunks/2h60meymns2z5.js\",\"/ICLayout-Bench/_next/static/chunks/27jip_2vcvnd5.js\"],\"default\"]\na:C\n11:T3f09,\u003ch1 id=\"problem-broadband-sige-pam4-driver-layout-task\"\u003eBroadband SiGe PAM4 Driver Layout Task\u003c/h1\u003e\n\u003ch2 id=\"problem-objective\"\u003eObjective\u003c/h2\u003e\n\u003cp\u003eLay out the upstream inductorless, three-cell current-steering PAM4 driver as\n\u003ccode\u003epam4drv_pam4_lay\u003c/code\u003e. One LSB cell and two parallel MSB cells contain twelve\nthree-finger \u003ccode\u003enpn13G2\u003c/code\u003e HBTs, twelve physical \u003ccode\u003ersil\u003c/code\u003e resistors and three physical\nMIM degeneration capacitors. Preserve the supplied topology and dimensions.\nThe task coefficient is 4.\u003c/p\u003e\n\u003ch3 id=\"problem-optimization-objective\"\u003eOptimization objective\u003c/h3\u003e\n\u003cp\u003eMaximize the declared quality score within the solve budget while satisfying all physical and necessary functional requirements. The first passing DRC, LVS and required electrical checks establish a feasible baseline. Continue improving the scored metrics from that baseline; a passing check or \u003ccode\u003etask_success = true\u003c/code\u003e does not mean that the quality objectives have been achieved.\u003c/p\u003e\n\u003ch2 id=\"problem-inputs-and-interface\"\u003eInputs and Interface\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003ematerials/circuit.cdl\u003c/code\u003e is the native LVS authority;\n\u003ccode\u003ematerials/circuit.spice\u003c/code\u003e is its simulator representation;\n\u003ccode\u003ematerials/testbench.spice\u003c/code\u003e defines the electrical measurements.\u003c/p\u003e\n\u003cp\u003eOrdered ports: \u003ccode\u003elsbp lsbn msbp msbn outp outn vcc vcasc vcmb tmsb0 tlsb0 tmsb1 sub\u003c/code\u003e.\nThe first four ports are differential LSB/MSB inputs, \u003ccode\u003eoutp/outn\u003c/code\u003e are differential\noutputs, \u003ccode\u003evcc\u003c/code\u003e is the supply, \u003ccode\u003evcasc\u003c/code\u003e biases the cascode bases, \u003ccode\u003evcmb\u003c/code\u003e is the input\ntermination reference, the three tail ports connect to external current sinks,\nand \u003ccode\u003esub\u003c/code\u003e is the ideal substrate reference. The three testbench VCCS tails are\nexternal bias apparatus, not missing physical transistors.\u003c/p\u003e\n\u003ch2 id=\"problem-operating-conditions\"\u003eOperating Conditions\u003c/h2\u003e\n\u003cp\u003eUse the upstream \u003cstrong\u003elayout signoff point\u003c/strong\u003e, not its separate static sizing point:\n4 V supply, 3.35 V cascode bias, 1.9 V input common mode and 15 mA per cell.\nThe nominal corners are \u003ccode\u003ehbt_typ\u003c/code\u003e, \u003ccode\u003eres_typ\u003c/code\u003e and \u003ccode\u003ecap_typ\u003c/code\u003e at 27 °C. HBTs have\n\u003ccode\u003eNx=3\u003c/code\u003e. Physical dimensions are fixed by the netlists; the nominal targets are\n50 Ω collector loads, 48 Ω input terminations, 3.2 Ω degeneration and 16 fF\nbridging capacitance. PDK geometry models determine their actual values.\u003c/p\u003e\n\u003cp\u003eBoth RF ports use 50 Ω per side (100 Ω differential). AC gain is differential\npower-wave S21 = \u003ccode\u003e2*Vout/Vsrc\u003c/code\u003e, measured at 1 GHz; bandwidth is checked by the\n50 GHz gain relative to 1 GHz. S11 is evaluated at \u003cstrong\u003e32 GHz\u003c/strong\u003e, and S22 at\n\u003cstrong\u003e50 GHz\u003c/strong\u003e, using the testbench's 20 points/decade sweep and interpolation.\nDo not substitute the preceding sweep samples for these endpoints.\u003c/p\u003e\n\u003cp\u003eThe large-signal test drives LSB and MSB in phase at 1 GHz through the same\nsource impedances, with ±0.8 V per source around 1.9 V. Supplies and bias ramp\nfrom zero over 8 ns; sine excitation starts at 9 ns. The 16–21 ns measurement\nwindow contains five periods. Swing is twice the fundamental phasor amplitude, calculated by time-integrating Vdiff times sine/cosine over 16-21 ns and dividing by the 5 ns window. The exported adaptive time samples are not equally weighted.\u003c/p\u003e\n\u003ch2 id=\"problem-physical-requirements\"\u003ePhysical Requirements\u003c/h2\u003e\n\u003cp\u003eSubmit GDS with the exact top-cell name, all thirteen labeled ports, and at most\n10 MiB. Native SG13G2 DRC checks main and extra maximal rules without density or\nantenna; no marker waivers apply. Native LVS compares devices, dimensions,\nconnectivity and named ports. Functional width/height must not exceed 160/120 µm.\nThe published \u003ccode\u003eoutline\u003c/code\u003e layer list covers HBT, resistor, MIM, substrate-contact,\nseven-metal and via geometry; pin/text and presentation layers are excluded.\u003c/p\u003e\n\u003cp\u003ePost-layout simulation follows the upstream kpex 2.5D CC extraction and ngspice flow. Candidate-derived native devices retain their models, physical dimensions, connections and ordered ports; extraction adds wiring capacitance. Missing candidate geometry or devices are not reconstructed from the source netlist. The substrate reference is the declared ideal \u003ccode\u003esub\u003c/code\u003e node. This scoring model does not include wiring resistance, self/mutual inductance or a full-wave network.\u003c/p\u003e\n\u003ch2 id=\"problem-electrical-requirements-and-scoring\"\u003eElectrical Requirements and Scoring\u003c/h2\u003e\n\u003cp\u003eArtifact, geometry, DRC, LVS and declared functional requirements must pass. Parasitic extraction is also mandatory: it must produce a complete, electrically consistent netlist usable by the required post-layout simulations. A completed candidate rejection scores zero; infrastructure errors do not establish candidate failure.\u003c/p\u003e\n\u003cp\u003eFor \u003ccode\u003elayout\u003c/code\u003e scoring, cap every positively weighted raw quality at 1 before aggregation; the score ranges from 0 to 100. Reaching every weighted target scores 100, and no minimum score is required for validity.\u003c/p\u003e\n\u003cp\u003ePhysical checks and the declared functional bounds must pass. Quality scoring imposes no fixed degradation allowance. Each \u003ccode\u003esource_*\u003c/code\u003e job and its corresponding candidate extracted circuit use exactly the same testbench, model resources, parameters, loads and measurement windows. Independent source observations provide every electrical scoring anchor. Reports retain every paired result.\u003c/p\u003e\n\u003cp\u003eLet x be the post-layout measurement and b the declared quality target, or the same-condition source measurement when no target is declared:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eRatio normalization: maximize with q = x/b and minimize with q = b/x. When a numerical scale s is declared, use (x+s)/(b+s) and its reciprocal, respectively. The scale handles zero values as a normalization floor; it is neither an allowed degradation nor an acceptance bound.\u003c/li\u003e\n\u003cli\u003eAmplitude in dB: maximize with q = 10^((x-b)/20) and minimize with its reciprocal.\u003c/li\u003e\n\u003cli\u003eOne-sided degradation normalization: loss = max(0, b-x) for maximize, or max(0, x-b) for minimize; q = s/(s+loss). The physical quality scale s is a degradation budget: a loss equal to s gives q = 0.5. An improvement gives q = 1. This scale is not an acceptance cutoff.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eUse \u003ccode\u003elayout\u003c/code\u003e scoring. First compute each metric's raw quality q from the worst paired condition, with raw area quality q_area = area_target / candidate_functional_area. Credit c_i = min(1, q_i) for every positively weighted metric, then compute S = 100 * product(c_i ** w_i). The weights sum to 1 and the score is bounded by 100. An improvement beyond one target cannot compensate for missing another target. Physical, extraction, or functional rejection scores zero; other missing or invalid measurements leave the score unknown, and zero-weight observations must also be valid. Reaching every positively weighted target scores 100; a feasible reference may score far below 100. Weights express quality tradeoffs, not acceptance bounds.\u003c/p\u003e\n\u003cp\u003eAll measurements and their paired source observations must be finite and usable.\nPerformance is scored continuously against the declared quality anchors;\nupstream data-sheet targets are not acceptance thresholds. Supply consumption\nand output swing must be nonnegative; zero or otherwise unusable ratio baselines\ncannot establish a score. Physical checks remain mandatory.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eDefinition\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eQuality normalization\u003c/th\u003e\n\u003cth\u003eFunctional range\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003elsb_gain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eLSB S21 at 1 GHz\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003emaximize / db20\u003c/td\u003e\n\u003ctd\u003eNone\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emsb_gain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMSB S21 at 1 GHz\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003emaximize / db20\u003c/td\u003e\n\u003ctd\u003eNone\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edac_weight_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMSB minus LSB gain\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003esource-paired diagnostic\u003c/td\u003e\n\u003ctd\u003eNone\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003elsb_rel50_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eLSB S21(50 GHz) minus S21(1 GHz)\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003emaximize / db20\u003c/td\u003e\n\u003ctd\u003eNone\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emsb_rel50_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMSB S21(50 GHz) minus S21(1 GHz)\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003emaximize / db20\u003c/td\u003e\n\u003ctd\u003eNone\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003es11_32g_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMSB input reflection coefficient, 20 log10(abs(S11)), at 32 GHz\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003eminimize / degradation, s = 0.5 dB\u003c/td\u003e\n\u003ctd\u003eNone\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003es22_50g_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eOutput reflection coefficient, 20 log10(abs(S22)), at 50 GHz\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003eminimize / degradation, s = 1 dB\u003c/td\u003e\n\u003ctd\u003eNone\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_mw\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003ePower drawn from the 4 V rail at OP\u003c/td\u003e\n\u003ctd\u003emW\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e≥ 0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eswing_vpp\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDifferential output fundamental swing\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003emaximize / ratio\u003c/td\u003e\n\u003ctd\u003e≥ 0\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e| \u003ccode\u003elsb_g50_db\u003c/code\u003e | Absolute LSB S21 at 50 GHz | dB | maximize / degradation, s = 0.5 dB | None |\n| \u003ccode\u003emsb_g50_db\u003c/code\u003e | Absolute MSB S21 at 50 GHz | dB | maximize / degradation, s = 0.5 dB | None |\u003c/p\u003e\n\u003cp\u003eIndependent source simulation uses the same deck, conditions and models. Electrical quality anchors are its actual observations. The fixed circuit's ideal 2:1 weighting is not a scoring target. Reflection-coefficient dB is the negative of positive return loss, so smaller values improve matching.\u003c/p\u003e\n\u003cp\u003eThe area target is \u003cstrong\u003e700 um2\u003c/strong\u003e. Area and electrical targets are quality anchors, not acceptance cutoffs. The reference only demonstrates feasibility.\u003c/p\u003e\n\u003cp\u003eS11/S22 carry the largest weights because the upstream layout study identifies input/output matching as limiting objectives. Absolute S21 at 50 GHz preserves delivered signal, so flat attenuation cannot improve matching without a score cost. Fixed-bias power, LF gain, DAC weight, relative rolloff and the 1 GHz tone swing remain diagnostics.\u003c/p\u003e\n\u003cp\u003eA 0.5 dB gain budget represents about 5.6% amplitude loss. The 0.5 dB input-matching budget resolves the source's roughly 1 dB return-loss margin; the 1 dB output budget resolves degradation within its roughly 4 dB margin. A plain amplitude-ratio conversion would still credit a 1 dB degradation at about 0.89, hiding that margin consumption. These scales define quality sensitivity and impose no functional pass/fail threshold.\u003c/p\u003e\n\u003ch3 id=\"problem-score-weights\"\u003eScore weights\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.15\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edac_weight_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003elsb_rel50_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emsb_rel50_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003es11_32g_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.25\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003es22_50g_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.35\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003elsb_gain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emsb_gain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eswing_vpp\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_mw\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003elsb_g50_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emsb_g50_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.15\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch2 id=\"problem-tools-and-submission\"\u003eTools and Submission\u003c/h2\u003e\n\u003cp\u003eSoft solve budget: \u003cstrong\u003e1.5 hours\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eRead \u003ccode\u003e/protocol/task.json\u003c/code\u003e for input/output paths, constraints and the \u003ccode\u003eresources\u003c/code\u003e object; \u003ccode\u003e/protocol/harness.json\u003c/code\u003e describes the active check and submission interface.\u003c/p\u003e\n\u003cp\u003eUse the reviewed SG13G2 resources and the runtime task/protocol metadata.\nNgspice must be ≥45 with \u003ccode\u003engbehavior=hsa\u003c/code\u003e, compiled R3_CMC support and the\nspecified HBT/capacitor models. The toolchain provides native KLayout checks,\ncandidate-derived kpex coupling-capacitance extraction and ngspice feedback. Write\n\u003ccode\u003e/workspace/output/final.gds\u003c/code\u003e and explicitly submit it through the runtime\nsubmission interface. Reference and maintainer material is not a solver input.\u003c/p\u003e\n\u003ch3 id=\"problem-solve-workflow\"\u003eSolve workflow\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eRead the declared circuit and materials, \u003ccode\u003e/protocol/task.json\u003c/code\u003e for paths, constraints and reviewed resources, and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e for capabilities and helper commands. Task inputs under \u003ccode\u003e/task\u003c/code\u003e and resources under \u003ccode\u003e/resources\u003c/code\u003e are read-only; construct the layout in \u003ccode\u003e/workspace\u003c/code\u003e with the declared tools. With layout MCP, paths and commands refer to the remote EDA workspace. Create your own implementation with real devices, interconnect and pins, using your own tool loop without delegating to other agents; reference layouts and author code are not solver inputs.\u003c/li\u003e\n\u003cli\u003eInspect \u003ccode\u003eresources.external\u003c/code\u003e before using external tools. Each command starts a fresh shell: when tool modules are declared, source \u003ccode\u003e/usr/share/Modules/init/bash\u003c/code\u003e and load the selected tool's modules; export its declared \u003ccode\u003etool_environment\u003c/code\u003e settings in that same command. Repeat as needed and use batch or headless operation. Local manuals, command references, and release notes may be available within the declared EDA installation and PDK resource directories. Locate these resources through \u003ccode\u003e/protocol/task.json\u003c/code\u003e and consult the documentation for the installed tool version when diagnosing unfamiliar syntax or tool failures.\u003c/li\u003e\n\u003cli\u003eGenerate an initial candidate and submit a snapshot early. When \u003ccode\u003eprocess-feedback\u003c/code\u003e is available, check the current GDS with layout MCP \u003ccode\u003echeck\u003c/code\u003e or \u003ccode\u003epython -I /protocol/process_check.py\u003c/code\u003e before the final submission. This runs the final evaluator's complete plan and returns engineering diagnostics and candidate measurements, without scores or normalized quality factors. Checks have no count limit and consume the same wall-clock budget. Inspect the physical and functional results and all scored metrics; successful tool execution alone does not establish requirement satisfaction. Read paginated diagnostics with \u003ccode\u003ereport\u003c/code\u003e when using MCP. Local exploratory checks do not replace this complete check.\u003c/li\u003e\n\u003cli\u003eUse the remaining time for measured improvements to the declared quality objectives. Identify the limiting scored metrics, make targeted layout changes, regenerate and check the candidate, and compare measurements with the previous candidate and the stated scoring targets and trade-offs. Preserve the best valid candidate and revert changes that worsen the overall objective. Repeat while time and useful improvements remain; passing validity checks alone is not a stopping condition.\u003c/li\u003e\n\u003cli\u003eStop optimization when the budget expires, all declared quality objectives are achieved, or measured trials support convergence. If stopping early, explain the changes tried, the metric comparisons and the remaining limitations. Track remaining time through session status. At soft-budget expiry, finish or cancel already-started work and submit immediately; do not start another command, check or optimization round. If an MCP execution is running, use \u003ccode\u003epoll\u003c/code\u003e with its \u003ccode\u003eexecution_id\u003c/code\u003e and the returned \u003ccode\u003enext_offset\u003c/code\u003e as \u003ccode\u003eoffset\u003c/code\u003e until completion, or cancel it and wait for it to stop.\u003c/li\u003e\n\u003cli\u003eFinish or cancel outstanding work, restore your best candidate to the declared output path, and explicitly submit it before ending the session. With layout MCP \u003ccode\u003esubmit\u003c/code\u003e, remove the \u003ccode\u003e/workspace/\u003c/code\u003e prefix from \u003ccode\u003eoutput.path\u003c/code\u003e; with the container interface, run \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e. Wait for the receipt: only the last accepted snapshot is judged, and writing a file alone is not submission. Acceptance confirms delivery; the framework independently evaluates validity and quality after the session.\u003c/li\u003e\n\u003c/ol\u003e\n12:T514,Area carries 15%; S11 at 32 GHz and S22 at 50 GHz carry 25% and 35%; absolute LSB/MSB differential S21 at 50 GHz carry 10% and 15%. These use the upstream RF testbench conventions and same-condition pre-layout observations. High-frequency absolute gain retains delivered signal in the objective, so attenuation cannot improve matching without a cost. LF gain, binary weight, relative rolloff, fixed-bias power and 1 GHz tone swing remain diagnostics. The reference proves feasibility without a score minimum. Model scope is upstream kpex 2.5D CC plus native devices; inductance/full-wave accuracy is not claimed by the scoring extraction. Each scored RF metric uses one-sided degradation q=budget/(budget+loss), with q=1 for an improvement. Budgets are 0.5 dB for delivered gain and input reflection, and 1 dB for output reflection. A 0.5 dB gain budget represents about 5.6% amplitude loss. The input matching budget resolves the upstream physical design's roughly 1 dB return-loss margin; the broader output budget resolves a 1 dB loss within the source's roughly 4 dB margin. They set quality sensitivity, not functional cutoffs, and exceed numerical measurement noise. Ordinary db20 conversion would credit a 1 dB reflection degradation at about 0.89, obscuring these margins even at high weight.13:T1b5d,\u003cp\u003eArtifact, geometry, DRC, LVS and declared functional requirements must pass. Parasitic extraction is also mandatory: it must produce a complete, electrically consistent netlist usable by the required post-layout simulations. A completed candidate rejection scores zero; infrastructure errors do not establish candidate failure.\u003c/p\u003e\n\u003cp\u003eFor \u003ccode\u003elayout\u003c/code\u003e scoring, cap every positively weighted raw quality at 1 before aggregation; the score ranges from 0 to 100. Reaching every weighted target scores 100, and no minimum score is required for validity.\u003c/p\u003e\n\u003cp\u003ePhysical checks and the declared functional bounds must pass. Quality scoring imposes no fixed degradation allowance. Each \u003ccode\u003esource_*\u003c/code\u003e job and its corresponding candidate extracted circuit use exactly the same testbench, model resources, parameters, loads and measurement windows. Independent source observations provide every electrical scoring anchor. Reports retain every paired result.\u003c/p\u003e\n\u003cp\u003eLet x be the post-layout measurement and b the declared quality target, or the same-condition source measurement when no target is declared:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eRatio normalization: maximize with q = x/b and minimize with q = b/x. When a numerical scale s is declared, use (x+s)/(b+s) and its reciprocal, respectively. The scale handles zero values as a normalization floor; it is neither an allowed degradation nor an acceptance bound.\u003c/li\u003e\n\u003cli\u003eAmplitude in dB: maximize with q = 10^((x-b)/20) and minimize with its reciprocal.\u003c/li\u003e\n\u003cli\u003eOne-sided degradation normalization: loss = max(0, b-x) for maximize, or max(0, x-b) for minimize; q = s/(s+loss). The physical quality scale s is a degradation budget: a loss equal to s gives q = 0.5. An improvement gives q = 1. This scale is not an acceptance cutoff.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eUse \u003ccode\u003elayout\u003c/code\u003e scoring. First compute each metric's raw quality q from the worst paired condition, with raw area quality q_area = area_target / candidate_functional_area. Credit c_i = min(1, q_i) for every positively weighted metric, then compute S = 100 * product(c_i ** w_i). The weights sum to 1 and the score is bounded by 100. An improvement beyond one target cannot compensate for missing another target. Physical, extraction, or functional rejection scores zero; other missing or invalid measurements leave the score unknown, and zero-weight observations must also be valid. Reaching every positively weighted target scores 100; a feasible reference may score far below 100. Weights express quality tradeoffs, not acceptance bounds.\u003c/p\u003e\n\u003cp\u003eAll measurements and their paired source observations must be finite and usable.\nPerformance is scored continuously against the declared quality anchors;\nupstream data-sheet targets are not acceptance thresholds. Supply consumption\nand output swing must be nonnegative; zero or otherwise unusable ratio baselines\ncannot establish a score. Physical checks remain mandatory.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eDefinition\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eQuality normalization\u003c/th\u003e\n\u003cth\u003eFunctional range\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003elsb_gain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eLSB S21 at 1 GHz\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003emaximize / db20\u003c/td\u003e\n\u003ctd\u003eNone\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emsb_gain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMSB S21 at 1 GHz\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003emaximize / db20\u003c/td\u003e\n\u003ctd\u003eNone\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edac_weight_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMSB minus LSB gain\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003esource-paired diagnostic\u003c/td\u003e\n\u003ctd\u003eNone\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003elsb_rel50_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eLSB S21(50 GHz) minus S21(1 GHz)\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003emaximize / db20\u003c/td\u003e\n\u003ctd\u003eNone\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emsb_rel50_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMSB S21(50 GHz) minus S21(1 GHz)\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003emaximize / db20\u003c/td\u003e\n\u003ctd\u003eNone\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003es11_32g_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMSB input reflection coefficient, 20 log10(abs(S11)), at 32 GHz\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003eminimize / degradation, s = 0.5 dB\u003c/td\u003e\n\u003ctd\u003eNone\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003es22_50g_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eOutput reflection coefficient, 20 log10(abs(S22)), at 50 GHz\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003eminimize / degradation, s = 1 dB\u003c/td\u003e\n\u003ctd\u003eNone\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_mw\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003ePower drawn from the 4 V rail at OP\u003c/td\u003e\n\u003ctd\u003emW\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e≥ 0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eswing_vpp\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDifferential output fundamental swing\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003emaximize / ratio\u003c/td\u003e\n\u003ctd\u003e≥ 0\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e| \u003ccode\u003elsb_g50_db\u003c/code\u003e | Absolute LSB S21 at 50 GHz | dB | maximize / degradation, s = 0.5 dB | None |\n| \u003ccode\u003emsb_g50_db\u003c/code\u003e | Absolute MSB S21 at 50 GHz | dB | maximize / degradation, s = 0.5 dB | None |\u003c/p\u003e\n\u003cp\u003eIndependent source simulation uses the same deck, conditions and models. Electrical quality anchors are its actual observations. The fixed circuit's ideal 2:1 weighting is not a scoring target. Reflection-coefficient dB is the negative of positive return loss, so smaller values improve matching.\u003c/p\u003e\n\u003cp\u003eThe area target is \u003cstrong\u003e700 um2\u003c/strong\u003e. Area and electrical targets are quality anchors, not acceptance cutoffs. The reference only demonstrates feasibility.\u003c/p\u003e\n\u003cp\u003eS11/S22 carry the largest weights because the upstream layout study identifies input/output matching as limiting objectives. Absolute S21 at 50 GHz preserves delivered signal, so flat attenuation cannot improve matching without a score cost. Fixed-bias power, LF gain, DAC weight, relative rolloff and the 1 GHz tone swing remain diagnostics.\u003c/p\u003e\n\u003cp\u003eA 0.5 dB gain budget represents about 5.6% amplitude loss. The 0.5 dB input-matching budget resolves the source's roughly 1 dB return-loss margin; the 1 dB output budget resolves degradation within its roughly 4 dB margin. A plain amplitude-ratio conversion would still credit a 1 dB degradation at about 0.89, hiding that margin consumption. These scales define quality sensitivity and impose no functional pass/fail threshold.\u003c/p\u003e\n\u003ch3\u003eScore weights\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.15\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edac_weight_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003elsb_rel50_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emsb_rel50_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003es11_32g_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.25\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003es22_50g_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.35\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003elsb_gain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emsb_gain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eswing_vpp\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_mw\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003elsb_g50_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emsb_g50_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.15\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n14:T59e,\u003cp\u003eUse the upstream \u003cstrong\u003elayout signoff point\u003c/strong\u003e, not its separate static sizing point:\n4 V supply, 3.35 V cascode bias, 1.9 V input common mode and 15 mA per cell.\nThe nominal corners are \u003ccode\u003ehbt_typ\u003c/code\u003e, \u003ccode\u003eres_typ\u003c/code\u003e and \u003ccode\u003ecap_typ\u003c/code\u003e at 27 °C. HBTs have\n\u003ccode\u003eNx=3\u003c/code\u003e. Physical dimensions are fixed by the netlists; the nominal targets are\n50 Ω collector loads, 48 Ω input terminations, 3.2 Ω degeneration and 16 fF\nbridging capacitance. PDK geometry models determine their actual values.\u003c/p\u003e\n\u003cp\u003eBoth RF ports use 50 Ω per side (100 Ω differential). AC gain is differential\npower-wave S21 = \u003ccode\u003e2*Vout/Vsrc\u003c/code\u003e, measured at 1 GHz; bandwidth is checked by the\n50 GHz gain relative to 1 GHz. S11 is evaluated at \u003cstrong\u003e32 GHz\u003c/strong\u003e, and S22 at\n\u003cstrong\u003e50 GHz\u003c/strong\u003e, using the testbench's 20 points/decade sweep and interpolation.\nDo not substitute the preceding sweep samples for these endpoints.\u003c/p\u003e\n\u003cp\u003eThe large-signal test drives LSB and MSB in phase at 1 GHz through the same\nsource impedances, with ±0.8 V per source around 1.9 V. Supplies and bias ramp\nfrom zero over 8 ns; sine excitation starts at 9 ns. The 16–21 ns measurement\nwindow contains five periods. Swing is twice the fundamental phasor amplitude, calculated by time-integrating Vdiff times sine/cosine over 16-21 ns and dividing by the 5 ns window. The exported adaptive time samples are not equally weighted.\u003c/p\u003e\n15:T11cd,\u003cp\u003eSoft solve budget: \u003cstrong\u003e1.5 hours\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eRead \u003ccode\u003e/protocol/task.json\u003c/code\u003e for input/output paths, constraints and the \u003ccode\u003eresources\u003c/code\u003e object; \u003ccode\u003e/protocol/harness.json\u003c/code\u003e describes the active check and submission interface.\u003c/p\u003e\n\u003cp\u003eUse the reviewed SG13G2 resources and the runtime task/protocol metadata.\nNgspice must be ≥45 with \u003ccode\u003engbehavior=hsa\u003c/code\u003e, compiled R3_CMC support and the\nspecified HBT/capacitor models. The toolchain provides native KLayout checks,\ncandidate-derived kpex coupling-capacitance extraction and ngspice feedback. Write\n\u003ccode\u003e/workspace/output/final.gds\u003c/code\u003e and explicitly submit it through the runtime\nsubmission interface. Reference and maintainer material is not a solver input.\u003c/p\u003e\n\u003ch3\u003eSolve workflow\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eRead the declared circuit and materials, \u003ccode\u003e/protocol/task.json\u003c/code\u003e for paths, constraints and reviewed resources, and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e for capabilities and helper commands. Task inputs under \u003ccode\u003e/task\u003c/code\u003e and resources under \u003ccode\u003e/resources\u003c/code\u003e are read-only; construct the layout in \u003ccode\u003e/workspace\u003c/code\u003e with the declared tools. With layout MCP, paths and commands refer to the remote EDA workspace. Create your own implementation with real devices, interconnect and pins, using your own tool loop without delegating to other agents; reference layouts and author code are not solver inputs.\u003c/li\u003e\n\u003cli\u003eInspect \u003ccode\u003eresources.external\u003c/code\u003e before using external tools. Each command starts a fresh shell: when tool modules are declared, source \u003ccode\u003e/usr/share/Modules/init/bash\u003c/code\u003e and load the selected tool's modules; export its declared \u003ccode\u003etool_environment\u003c/code\u003e settings in that same command. Repeat as needed and use batch or headless operation. Local manuals, command references, and release notes may be available within the declared EDA installation and PDK resource directories. Locate these resources through \u003ccode\u003e/protocol/task.json\u003c/code\u003e and consult the documentation for the installed tool version when diagnosing unfamiliar syntax or tool failures.\u003c/li\u003e\n\u003cli\u003eGenerate an initial candidate and submit a snapshot early. When \u003ccode\u003eprocess-feedback\u003c/code\u003e is available, check the current GDS with layout MCP \u003ccode\u003echeck\u003c/code\u003e or \u003ccode\u003epython -I /protocol/process_check.py\u003c/code\u003e before the final submission. This runs the final evaluator's complete plan and returns engineering diagnostics and candidate measurements, without scores or normalized quality factors. Checks have no count limit and consume the same wall-clock budget. Inspect the physical and functional results and all scored metrics; successful tool execution alone does not establish requirement satisfaction. Read paginated diagnostics with \u003ccode\u003ereport\u003c/code\u003e when using MCP. Local exploratory checks do not replace this complete check.\u003c/li\u003e\n\u003cli\u003eUse the remaining time for measured improvements to the declared quality objectives. Identify the limiting scored metrics, make targeted layout changes, regenerate and check the candidate, and compare measurements with the previous candidate and the stated scoring targets and trade-offs. Preserve the best valid candidate and revert changes that worsen the overall objective. Repeat while time and useful improvements remain; passing validity checks alone is not a stopping condition.\u003c/li\u003e\n\u003cli\u003eStop optimization when the budget expires, all declared quality objectives are achieved, or measured trials support convergence. If stopping early, explain the changes tried, the metric comparisons and the remaining limitations. Track remaining time through session status. At soft-budget expiry, finish or cancel already-started work and submit immediately; do not start another command, check or optimization round. If an MCP execution is running, use \u003ccode\u003epoll\u003c/code\u003e with its \u003ccode\u003eexecution_id\u003c/code\u003e and the returned \u003ccode\u003enext_offset\u003c/code\u003e as \u003ccode\u003eoffset\u003c/code\u003e until completion, or cancel it and wait for it to stop.\u003c/li\u003e\n\u003cli\u003eFinish or cancel outstanding work, restore your best candidate to the declared output path, and explicitly submit it before ending the session. With layout MCP \u003ccode\u003esubmit\u003c/code\u003e, remove the \u003ccode\u003e/workspace/\u003c/code\u003e prefix from \u003ccode\u003eoutput.path\u003c/code\u003e; with the container interface, run \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e. Wait for the receipt: only the last accepted snapshot is judged, and writing a file alone is not submission. Acceptance confirms delivery; the framework independently evaluates validity and quality after the session.\u003c/li\u003e\n\u003c/ol\u003e\n6:[\"$\",\"$8\",null,{\"fallback\":[\"$\",\"p\",null,{\"children\":\"Loading published evidence…\"}],\"children\":[\"$\",\"$L10\",null,{\"task\":{\"case_path\":\"tasks/ihp-sg13g2/analog-db/cases/drv_001_pam4_sige_dac/case.toml\",\"coefficient\":4,\"collection\":\"analog-db\",\"configuration_url\":\"/ICLayout-Bench/assets/37e7b33b61dc697a5ef563b525763ed329fae5e8a6a09e26c203a01a6ee6c7b1.txt\",\"description_html\":\"$11\",\"description_path\":\"tasks/ihp-sg13g2/analog-db/cases/drv_001_pam4_sige_dac/problem.md\",\"hours\":1.5,\"id\":\"ihp-sg13g2.analog-db.drv_001_pam4_sige_dac\",\"inputs\":{\"description\":{\"format\":\"text\",\"path\":\"problem.md\",\"sha256\":\"12602c7fde2b4fb9399082956d5b0ef1da1e24fda136d65c59ca2e71fc09fac4\"},\"netlist\":{\"format\":\"spice\",\"path\":\"materials/circuit.cdl\",\"sha256\":\"310d1f67d5d237cfc88525f26568c5bcf45680bb2e8141982600669ee81a2ead\",\"subcircuit\":\"pam4drv_pam4_lay\"},\"performance\":{\"format\":\"spice\",\"path\":\"materials/testbench.spice\",\"sha256\":\"55a8c9dfe3ef9ea19426b35540ccedfe835804d59177295b24f656ec606b6072\"},\"simulation\":{\"format\":\"spice\",\"path\":\"materials/cir nce, capacitance, amplitude or absolute return-ratio diagnostic has a nonnegative measurement domain; its value remains a quality or diagnostic observation.\"},\"unit\":\"V\"},{\"aggregation\":\"min\",\"baseline\":[\"source_nominal:lsb_g50_db\"],\"category\":\"performance\",\"dimension\":\"response\",\"direction\":\"maximize\",\"id\":\"lsb_g50_db\",\"normalization\":\"degradation\",\"observations\":[\"nominal:lsb_g50_db\"],\"scale\":0.5,\"unit\":\"dB\"},{\"aggregation\":\"min\",\"baseline\":[\"source_nominal:msb_g50_db\"],\"category\":\"performance\",\"dimension\":\"response\",\"direction\":\"maximize\",\"id\":\"msb_g50_db\",\"normalization\":\"degradation\",\"observations\":[\"nominal:msb_g50_db\"],\"scale\":0.5,\"unit\":\"dB\"}],\"pdk\":\"ihp-sg13g2\",\"reader\":{\"category\":\"Amplifiers \u0026 RF\",\"summary\":\"Combines weighted current-steering cells into a SiGe PAM4 driver.\",\"title\":\"Upstream broadband SiGe PAM4 current-steering driver\"},\"scoring\":{\"area_metric\":\"functional_area\",\"area_target\":700,\"method\":\"layout\",\"rationale\":\"$12\",\"weights\":{\"dac_weight_db\":0,\"functional_area\":0.15,\"lsb_g50_db\":0.1,\"lsb_gain_db\":0,\"lsb_rel50_db\":0,\"msb_g50_db\":0.15,\"msb_gain_db\":0,\"msb_rel50_db\":0,\"power_mw\":0,\"s11_32g_db\":0.25,\"s22_50g_db\":0.35,\"swing_vpp\":0}},\"sections\":{\"Electrical Requirements and Scoring\":\"$13\",\"Inputs and Interface\":\"\u003cp\u003e\u003ccode\u003ematerials/circuit.cdl\u003c/code\u003e is the native LVS authority;\\n\u003ccode\u003ematerials/circuit.spice\u003c/code\u003e is its simulator representation;\\n\u003ccode\u003ematerials/testbench.spice\u003c/code\u003e defines the electrical measurements.\u003c/p\u003e\\n\u003cp\u003eOrdered ports: \u003ccode\u003elsbp lsbn msbp msbn outp outn vcc vcasc vcmb tmsb0 tlsb0 tmsb1 sub\u003c/code\u003e.\\nThe first four ports are differential LSB/MSB inputs, \u003ccode\u003eoutp/outn\u003c/code\u003e are differential\\noutputs, \u003ccode\u003evcc\u003c/code\u003e is the supply, \u003ccode\u003evcasc\u003c/code\u003e biases the cascode bases, \u003ccode\u003evcmb\u003c/code\u003e is the input\\ntermination reference, the three tail ports connect to external current sinks,\\nand \u003ccode\u003esub\u003c/code\u003e is the ideal substrate reference. The three testbench VCCS tails are\\nexternal bias apparatus, not missing physical transistors.\u003c/p\u003e\\n\",\"Objective\":\"\u003cp\u003eLay out the upstream inductorless, three-cell current-steering PAM4 driver as\\n\u003ccode\u003epam4drv_pam4_lay\u003c/code\u003e. One LSB cell and two parallel MSB cells contain twelve\\nthree-finger \u003ccode\u003enpn13G2\u003c/code\u003e HBTs, twelve physical \u003ccode\u003ersil\u003c/code\u003e resistors and three physical\\nMIM degeneration capacitors. Preserve the supplied topology and dimensions.\\nThe task coefficient is 4.\u003c/p\u003e\\n\u003ch3\u003eOptimization objective\u003c/h3\u003e\\n\u003cp\u003eMaximize the declared quality score within the solve budget while satisfying all physical and necessary functional requirements. The first passing DRC, LVS and required electrical checks establish a feasible baseline. Continue improving the scored metrics from that baseline; a passing check or \u003ccode\u003etask_success = true\u003c/code\u003e does not mean that the quality objectives have been achieved.\u003c/p\u003e\\n\",\"Operating Conditions\":\"$14\",\"Physical Requirements\":\"\u003cp\u003eSubmit GDS with the exact top-cell name, all thirteen labeled ports, and at most\\n10 MiB. Native SG13G2 DRC checks main and extra maximal rules without density or\\nantenna; no marker waivers apply. Native LVS compares devices, dimensions,\\nconnectivity and named ports. Functional width/height must not exceed 160/120 µm.\\nThe published \u003ccode\u003eoutline\u003c/code\u003e layer list covers HBT, resistor, MIM, substrate-contact,\\nseven-metal and via geometry; pin/text and presentation layers are excluded.\u003c/p\u003e\\n\u003cp\u003ePost-layout simulation follows the upstream kpex 2.5D CC extraction and ngspice flow. Candidate-derived native devices retain their models, physical dimensions, connections and ordered ports; extraction adds wiring capacitance. Missing candidate geometry or devices are not reconstructed from the source netlist. The substrate reference is the declared ideal \u003ccode\u003esub\u003c/code\u003e node. This scoring model does not include wiring resistance, self/mutual inductance or a full-wave network.\u003c/p\u003e\\n\",\"Tools and Submission\":\"$15\"},\"source_url\":\"https://github.com/MacAnalog/spicexplorer-release/tree/263d0322f8900dc331536fbbe6c0e804514fc454/analog-db/circuits/drv_001_pam4_sige_dac\",\"status\":\"qualified\",\"title\":\"Upstream broadband SiGe PAM4 current-steering driver\",\"core\":true},\"catalog\":{\"tasks\":[],\"runs\":[{\"condition\":{\"cli_version\":\"0.17.0\",\"configuration_sha256\":\"e0e49e08f9acde5eba1a536dc6f272287e2e82f7a54584eee239017bee10e85d\",\"effort_requested\":\"max\",\"effort_resolved\":\"max\",\"harness\":\"zcode\",\"harness_id\":\"iclayout-zcode\",\"harness_kind\":\"agent\",\"harness_version\":\"1\",\"model\":\"account:bigmodel-individual-coding-plan/GLM-5.3-Flash\",\"prompt_sha256\":\"e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855\",\"provider_effective_effort\":null,\"solver_image\":\"sha256:ce12cd8c22bb83bd1666b52bc68b73a1a4850f14517ffde9bd1b5f4b19b4ddc2\"},\"condition_id\":\"61a58736fe9942150afd0c85c4883febd1b6a40dee0f5d451d3366fe724d55ac\",\"evaluation_id\":\"cb947d1d3d7887c7747ec1bb668d76737d856d8635b8bca38a88dbb318c9995e\",\"evaluation_mode\":\"self_run\",\"id\":\"d600a35002bff11f873aac4865295536974b66636d2880646ca359014fad11ee\",\"method\":\"layout\",\"origin\":\"official\",\"outcome\":\"fail\",\"pdk\":\"ihp-sg13g2\",\"publication\":\"published\",\"repetition\":1,\"score\":0,\"task_id\":\"ihp-sg13g2.analog-db.drv_001_pam4_sige_dac\",\"task_version\":\"04b1096bc84210106fdda2546def929fcb6072
