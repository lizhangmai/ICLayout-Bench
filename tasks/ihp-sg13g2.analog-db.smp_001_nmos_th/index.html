ined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L5\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[\"$L6\",[[\"$\",\"script\",\"script-0\",{\"src\":\"/ICLayout-Bench/_next/static/chunks/27jip_2vcvnd5.js\",\"async\":true,\"nonce\":\"$undefined\"}]],[\"$\",\"$L7\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.MetadataOutlet\",\"children\":\"$@9\"}]}]]}],{},null,false,null]},null,false,\"$a\"]},null,false,null],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Lb\",null,{\"children\":\"$Lc\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Ld\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.Metadata\",\"children\":\"$Le\"}]}]}],null]}],false]],\"m\":\"$undefined\",\"G\":[\"$f\",[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/ICLayout-Bench/_next/static/chunks/3sa54_ghi1h2h.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]]],\"S\":true,\"h\":null,\"r\":\"$undefined\",\"s\":\"$undefined\",\"a\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"2hqB741EA4j7xWQVg6hu-\"}\n10:I[1186,[\"/ICLayout-Bench/_next/static/chunks/2h60meymns2z5.js\",\"/ICLayout-Bench/_next/static/chunks/27jip_2vcvnd5.js\"],\"default\"]\na:C\n11:T4b67,\u003ch1 id=\"problem-physical-nmos-sample-and-hold-layout-task\"\u003ePhysical NMOS Sample-and-Hold Layout Task\u003c/h1\u003e\n\u003ch2 id=\"problem-objective\"\u003eObjective\u003c/h2\u003e\n\u003cp\u003eImplement \u003ccode\u003esmp_001_nmos_th\u003c/code\u003e: a single-NMOS sampling switch with an internal\nphysical storage capacitor. Preserve the switch and stored-charge node, and\nmeet acquisition, turn-off pedestal, isolated-input feedthrough, hold drift\nand reacquisition requirements at the specified input and temperature points.\u003c/p\u003e\n\u003ch3 id=\"problem-optimization-objective\"\u003eOptimization objective\u003c/h3\u003e\n\u003cp\u003eMaximize the declared quality score within the solve budget while satisfying all physical and necessary functional requirements. The first passing DRC, LVS and required electrical checks establish a feasible baseline. Continue improving the scored metrics from that baseline; a passing check or \u003ccode\u003etask_success = true\u003c/code\u003e does not mean that the quality objectives have been achieved.\u003c/p\u003e\n\u003ch2 id=\"problem-inputs-and-interface\"\u003eInputs and Interface\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003ematerials/circuit.cdl\u003c/code\u003e: authoritative native physical circuit.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ematerials/circuit.spice\u003c/code\u003e: equivalent simulator representation.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ematerials/testbench.spice\u003c/code\u003e: independent stimuli and measurements.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eThe ordered interface is \u003ccode\u003evin clk vout vss\u003c/code\u003e. VIN is driven through an external\n1 kohm source resistance; CLK receives the external clock; VOUT is the storage\nnode. The source's unused VDD port is removed. There is no DUT supply-current\nmetric or added artificial supply connection. Tie VSS to ground.\u003c/p\u003e\n\u003cp\u003eRetain the \u003ccode\u003esg13_lv_nmos\u003c/code\u003e with W=2 um, L=0.13 um, m=1 and drain/gate/source\nconnected to VIN/CLK/VOUT. Its body connects through the explicit VSS substrate\ntap. One \u003ccode\u003ecap_cmim\u003c/code\u003e with W=L=18.2 um connects its top plate to VOUT and bottom\nplate to VSS, nominally 499.772 fF at TT, 27 C. Preserve plate orientation.\nThe capacitor is internal physical storage, not a testbench load or an ideal\nreplacement. The native and simulator circuits include the same explicit tap.\u003c/p\u003e\n\u003cp\u003ePreserve models, sizes and connectivity. Equivalent parallel fingering is\npermitted only when all physical and electrical checks pass. Do not add a\nbuffer, complementary switch, dummy cancellation device, hold-node servo,\nexternal storage capacitor or other topology change.\u003c/p\u003e\n\u003ch2 id=\"problem-operating-conditions\"\u003eOperating Conditions\u003c/h2\u003e\n\u003cp\u003eUse typical MOS and capacitor models at 27 and 85 C. CLK is externally driven\nbetween 0 and 1.2 V, with 2 ns linear transitions. The ideal signal source SRC\ndrives VIN through 1 kohm. Qualify four sampled levels, \u003ccode\u003esample_v\u003c/code\u003e = 0.1, 0.4,\n0.6 and 0.7 V, at both temperatures. At each point the off-state input is\nseparately driven to \u003ccode\u003ehold_v\u003c/code\u003e = 0 or 1.2 V: sixteen conditions. These are\nspecified sample points, not rail-to-rail or continuous-range qualification.\u003c/p\u003e\n\u003cp\u003eThe finite sequence starts from a solved DC operating point with SRC=0 and\nCLK=1.2 V. SRC moves to \u003ccode\u003esample_v\u003c/code\u003e during 20–22 ns. CLK falls during\n200–202 ns, isolating the storage node. SRC moves to \u003ccode\u003ehold_v\u003c/code\u003e during\n400–402 ns while CLK remains zero. SRC returns to \u003ccode\u003esample_v\u003c/code\u003e during\n11.2–11.202 us; CLK rises during 11.4–11.402 us. Stop at 11.7 us.\nNo output load, DC bias source or discharge resistor is attached to VOUT.\u003c/p\u003e\n\u003cp\u003eUse Gear order 2, KLU, maximum time step 2 ns, \u003ccode\u003egmin=1e-15\u003c/code\u003e,\n\u003ccode\u003ershunt=1e15\u003c/code\u003e, \u003ccode\u003ereltol=1e-6\u003c/code\u003e, \u003ccode\u003eabstol=1e-15\u003c/code\u003e and \u003ccode\u003evntol=1e-9\u003c/code\u003e.\nThe numerical shunt is not a specified physical retention load. Save SRC,\nVIN, CLK, VOUT and both ideal voltage-source currents.\u003c/p\u003e\n\u003ch2 id=\"problem-physical-requirements\"\u003ePhysical Requirements\u003c/h2\u003e\n\u003cp\u003eSubmit GDSII top cell \u003ccode\u003esmp_001_nmos_th\u003c/code\u003e, at most 10 MiB, within an 80 × 80 um\nfunctional outline. Pass native IHP main/maximal DRC without waivers\n(standalone scope with density/antenna disabled), strict named-port LVS,\nfunctional geometry and candidate-derived Magic RC extraction. Functional\narea includes the complete device/contact/routing layers enumerated by the\nruntime outline; annotation and pin layers do not count.\u003c/p\u003e\n\u003cp\u003ePost-layout simulation must consume the submitted layout's extracted NMOS,\nphysical MIM, junction geometry and interconnect RC. The isolated Magic import\nuses half-grid subdivision and \u003ccode\u003egds_readonly=false\u003c/code\u003e; the submitted GDS remains\nimmutable. No diagnostic is waived. Source simulation retains the finite tap\nmodel; Magic idealizes the tap connection. Distributed substrate noise and\nfabrication signoff are outside this contract.\u003c/p\u003e\n\u003ch2 id=\"problem-electrical-requirements-and-scoring\"\u003eElectrical Requirements and Scoring\u003c/h2\u003e\n\u003cp\u003eArtifact, geometry, DRC, LVS and declared functional requirements must pass. Parasitic extraction is also mandatory: it must produce a complete, electrically consistent netlist usable by the required post-layout simulations. A completed candidate rejection scores zero; infrastructure errors do not establish candidate failure.\u003c/p\u003e\n\u003cp\u003eFor \u003ccode\u003elayout\u003c/code\u003e scoring, cap every positively weighted raw quality at 1 before aggregation; the score ranges from 0 to 100. Reaching every weighted target scores 100, and no minimum score is required for validity.\u003c/p\u003e\n\u003cp\u003ePhysical checks and the declared functional bounds must pass. Quality scoring imposes no fixed degradation allowance. Each \u003ccode\u003esource_*\u003c/code\u003e job and its corresponding candidate extracted circuit use exactly the same testbench, model resources, parameters, loads and measurement windows. Independent source observations remain required evidence. The explicit quality targets below supply scoring anchors; otherwise the paired source value is used. Reports retain every paired result.\u003c/p\u003e\n\u003cp\u003eLet x be the post-layout measurement and b the declared quality target, or the same-condition source measurement when no target is declared:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eRatio normalization: maximize with q = x/b and minimize with q = b/x. When a numerical scale s is declared, use (x+s)/(b+s) and its reciprocal, respectively. The scale handles zero values as a normalization floor; it is neither an allowed degradation nor an acceptance bound.\u003c/li\u003e\n\u003cli\u003eAmplitude in dB: maximize with q = 10^((x-b)/20) and minimize with its reciprocal.\u003c/li\u003e\n\u003cli\u003eTarget normalization: q = 1/(1+abs(x-b)/s), where s is the declared physical scale. Signed or zero-valued operating points are not divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eUse \u003ccode\u003elayout\u003c/code\u003e scoring. First compute each metric's raw quality q from the worst paired condition, with raw area quality q_area = area_target / candidate_functional_area. Credit c_i = min(1, q_i) for every positively weighted metric, then compute S = 100 * product(c_i ** w_i). The weights sum to 1 and the score is bounded by 100. An improvement beyond one target cannot compensate for missing another target. Physical, extraction, or functional rejection scores zero; other missing or invalid measurements leave the score unknown, and zero-weight observations must also be valid. Reaching every positively weighted target scores 100; a feasible reference may score far below 100. Weights express quality tradeoffs, not acceptance bounds.\u003c/p\u003e\n\u003cp\u003eThe measurements below use the supplied SPICE node and source names. \u003ccode\u003ev(n)\u003c/code\u003e is a node voltage; \u003ccode\u003ei(V)\u003c/code\u003e is current flowing into a voltage source, so delivered power uses a negative sign. \u003ccode\u003edb(z)=20*log10(abs(z))\u003c/code\u003e; \u003ccode\u003emag/abs\u003c/code\u003e denote magnitude, and \u003ccode\u003ecph\u003c/code\u003e denotes continuous phase in radians. \u003ccode\u003efind\u003c/code\u003e, \u003ccode\u003ewhen\u003c/code\u003e, \u003ccode\u003efrom/to\u003c/code\u003e and \u003ccode\u003erise/fall\u003c/code\u003e follow the deck's interpolation, window and crossing conventions. SPICE suffixes p/n/u/m/meg/g mean pico/nano/micro/milli/mega/giga. Nested \u003ccode\u003eavg\u003c/code\u003e, \u003ccode\u003emin\u003c/code\u003e, \u003ccode\u003emax\u003c/code\u003e, \u003ccode\u003evecmin/vecmax\u003c/code\u003e and \u003ccode\u003ederiv\u003c/code\u003e represent window averages, extrema and sampled derivatives. Measure each operating condition independently, pair it with the source result under that condition, and take the worst paired quality within each metric group.\u003c/p\u003e\n\u003cp\u003eFor metrics declaring \u003ccode\u003esaturating_ratio\u003c/code\u003e, q = 2(b+s)/(b+x+2*s), using the quality anchor b and the positive scale s in the metric’s units. Equality to the anchor gives raw quality 1; improvements approach raw quality 2 but credited quality stays at 1. Normalize each condition before selecting the worst quality. These scales and targets do not add acceptance cutoffs.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eDefinition / observation\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eQuality normalization\u003c/th\u003e\n\u003cth\u003eFunctional range\u003c/th\u003e\n\u003cth\u003eScale\u003c/th\u003e\n\u003cth\u003eDimension\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003etrack_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMaximum absolute VOUT minus target over 80–190 ns; target is VSRC sampled at 180 ns.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-05\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epedestal_abs_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAbsolute difference between VOUT at 220 ns and 180 ns (held minus tracked sample).\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e0.0001\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efeedthrough_peak_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMaximum absolute VOUT minus its 390 ns sample over 400–450 ns, during the input transition in hold.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e5e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ehold_drift_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAbsolute difference between VOUT at 11 us and 1 us.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ehold_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMaximum absolute VOUT minus target over 220 ns–11 us; target is VSRC at 180 ns.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e0.001\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ereacquire_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMaximum absolute VOUT minus target over 11.48–11.69 us; target is VSRC at 180 ns.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eclock_energy_j\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eIntegral of max(-V(CLK)*I(VCLK), 0) over 0–11.7 us; returned clock energy is excluded.\u003c/td\u003e\n\u003ctd\u003eJ\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-21\u003c/td\u003e\n\u003ctd\u003esupply\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003etarget\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Value of \u003ccode\u003ev(src) at=180n\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eunscored diagnostic\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003etrack_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Value of \u003ccode\u003ev(vout) at=180n\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eunscored diagnostic\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eheld_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Value of \u003ccode\u003ev(vout) at=220n\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eunscored diagnostic\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebefore_input_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Value of \u003ccode\u003ev(vout) at=390n\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eunscored diagnostic\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eafter_input_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Value of \u003ccode\u003ev(vout) at=450n\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eunscored diagnostic\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ehold_start_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Value of \u003ccode\u003ev(vout) at=1u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eunscored diagnostic\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ehold_end_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Value of \u003ccode\u003ev(vout) at=11u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eunscored diagnostic\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ereacquired_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Value of \u003ccode\u003ev(vout) at=11.65u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eunscored diagnostic\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epedestal_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eSigned VOUT(220 ns) − VOUT(180 ns).\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eunscored diagnostic\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efeedthrough_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eSigned VOUT(450 ns) − VOUT(390 ns).\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eunscored diagnostic\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edrift_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eSigned VOUT(11 us) − VOUT(1 us).\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eunscored diagnostic\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eThe capability coefficient is \u003cstrong\u003e5\u003c/strong\u003e, independent of this task's reference-normalized score.\u003c/p\u003e\n\u003ch3 id=\"problem-quality-targets-and-weights\"\u003eQuality targets and weights\u003c/h3\u003e\n\u003cp\u003eThe area quality target is \u003cstrong\u003e400 um2\u003c/strong\u003e. It is an integration budget, not a hard limit or a proven process minimum.\u003c/p\u003e\n\u003cp\u003eThe fixed 18.2 um square storage plate occupies 331.24 um2. A 400 um2 integration budget leaves 68.76 um2 beyond that plate for enclosure, the sampling switch, body tap and routing and carries 30%. Held-value accuracy carries 25%; pedestal, off-state feedthrough, tracking and clock energy carry 10% each; reacquisition carries 5%. The 2.7 fJ positive clock-source energy budget leaves approximately 0.121 fJ, or 4.7%, above the worst source-circuit energy for clock routing and contacts. Hold drift remains a diagnostic decomposition of held-value error. The fixed-switch electrical targets retain their physical anchors; the worst of all 16 sample/temperature/off-state conditions determines each quality factor.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eQuality anchor\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eScale\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e400\u003c/td\u003e\n\u003ctd\u003eum2\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.3\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ereacquire_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e5e-06\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.05\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003etrack_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e0.001\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e1e-05\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efeedthrough_peak_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e5e-05\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e5e-06\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ehold_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e0.015\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e0.001\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.25\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epedestal_abs_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e0.003\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e0.0001\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eclock_energy_j\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e2.7e-15\u003c/td\u003e\n\u003ctd\u003eJ\u003c/td\u003e\n\u003ctd\u003e1e-21\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eZero-weight observations: \u003ccode\u003ehold_drift_v\u003c/code\u003e. Original functional requirements remain enforced; grouped metrics listed above carry their stated weight once.\u003c/p\u003e\n\u003cp\u003eThe targets affect continuous quality only. A complete feasible reference may miss them; there is no minimum qualifying score.\u003c/p\u003e\n\u003ch2 id=\"problem-tools-and-submission\"\u003eTools and Submission\u003c/h2\u003e\n\u003cp\u003eSoft solve budget: \u003cstrong\u003e1 hour\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eUse \u003ccode\u003e/protocol/task.json\u003c/code\u003e (including its \u003ccode\u003eresources\u003c/code\u003e field) and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e\nfor the frozen inputs, requirements, reviewed IHP primitives and harness\nfeedback. Work with the supplied KLayout, Magic and ngspice resources.\nWrite \u003ccode\u003e/workspace/output/final.gds\u003c/code\u003e and explicitly submit through the harness.\nReference GDS, source records and host configuration are not standard inputs.\u003c/p\u003e\n\u003ch3 id=\"problem-solve-workflow\"\u003eSolve workflow\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eRead the declared circuit and materials, \u003ccode\u003e/protocol/task.json\u003c/code\u003e for paths, constraints and reviewed resources, and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e for capabilities and helper commands. Task inputs under \u003ccode\u003e/task\u003c/code\u003e and resources under \u003ccode\u003e/resources\u003c/code\u003e are read-only; construct the layout in \u003ccode\u003e/workspace\u003c/code\u003e with the declared tools. With layout MCP, paths and commands refer to the remote EDA workspace. Create your own implementation with real devices, interconnect and pins, using your own tool loop without delegating to other agents; reference layouts and author code are not solver inputs.\u003c/li\u003e\n\u003cli\u003eInspect \u003ccode\u003eresources.external\u003c/code\u003e before using external tools. Each command starts a fresh shell: when tool modules are declared, source \u003ccode\u003e/usr/share/Modules/init/bash\u003c/code\u003e and load the selected tool's modules; export its declared \u003ccode\u003etool_environment\u003c/code\u003e settings in that same command. Repeat as needed and use batch or headless operation. Local manuals, command references, and release notes may be available within the declared EDA installation and PDK resource directories. Locate these resources through \u003ccode\u003e/protocol/task.json\u003c/code\u003e and consult the documentation for the installed tool version when diagnosing unfamiliar syntax or tool failures.\u003c/li\u003e\n\u003cli\u003eGenerate an initial candidate and submit a snapshot early. When \u003ccode\u003eprocess-feedback\u003c/code\u003e is available, check the current GDS with layout MCP \u003ccode\u003echeck\u003c/code\u003e or \u003ccode\u003epython -I /protocol/process_check.py\u003c/code\u003e before the final submission. This runs the final evaluator's complete plan and returns engineering diagnostics and candidate measurements, without scores or normalized quality factors. Checks have no count limit and consume the same wall-clock budget. Inspect the physical and functional results and all scored metrics; successful tool execution alone does not establish requirement satisfaction. Read paginated diagnostics with \u003ccode\u003ereport\u003c/code\u003e when using MCP. Local exploratory checks do not replace this complete check.\u003c/li\u003e\n\u003cli\u003eUse the remaining time for measured improvements to the declared quality objectives. Identify the limiting scored metrics, make targeted layout changes, regenerate and check the candidate, and compare measurements with the previous candidate and the stated scoring targets and trade-offs. Preserve the best valid candidate and revert changes that worsen the overall objective. Repeat while time and useful improvements remain; passing validity checks alone is not a stopping condition.\u003c/li\u003e\n\u003cli\u003eStop optimization when the budget expires, all declared quality objectives are achieved, or measured trials support convergence. If stopping early, explain the changes tried, the metric comparisons and the remaining limitations. Track remaining time through session status. At soft-budget expiry, finish or cancel already-started work and submit immediately; do not start another command, check or optimization round. If an MCP execution is running, use \u003ccode\u003epoll\u003c/code\u003e with its \u003ccode\u003eexecution_id\u003c/code\u003e and the returned \u003ccode\u003enext_offset\u003c/code\u003e as \u003ccode\u003eoffset\u003c/code\u003e until completion, or cancel it and wait for it to stop.\u003c/li\u003e\n\u003cli\u003eFinish or cancel outstanding work, restore your best candidate to the declared output path, and explicitly submit it before ending the session. With layout MCP \u003ccode\u003esubmit\u003c/code\u003e, remove the \u003ccode\u003e/workspace/\u003c/code\u003e prefix from \u003ccode\u003eoutput.path\u003c/code\u003e; with the container interface, run \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e. Wait for the receipt: only the last accepted snapshot is judged, and writing a file alone is not submission. Acceptance confirms delivery; the framework independently evaluates validity and quality after the session.\u003c/li\u003e\n\u003c/ol\u003e\n12:T2789,\u003cp\u003eArtifact, geometry, DRC, LVS and declared functional requirements must pass. Parasitic extraction is also mandatory: it must produce a complete, electrically consistent netlist usable by the required post-layout simulations. A completed candidate rejection scores zero; infrastructure errors do not establish candidate failure.\u003c/p\u003e\n\u003cp\u003eFor \u003ccode\u003elayout\u003c/code\u003e scoring, cap every positively weighted raw quality at 1 before aggregation; the score ranges from 0 to 100. Reaching every weighted target scores 100, and no minimum score is required for validity.\u003c/p\u003e\n\u003cp\u003ePhysical checks and the declared functional bounds must pass. Quality scoring imposes no fixed degradation allowance. Each \u003ccode\u003esource_*\u003c/code\u003e job and its corresponding candidate extracted circuit use exactly the same testbench, model resources, parameters, loads and measurement windows. Independent source observations remain required evidence. The explicit quality targets below supply scoring anchors; otherwise the paired source value is used. Reports retain every paired result.\u003c/p\u003e\n\u003cp\u003eLet x be the post-layout measurement and b the declared quality target, or the same-condition source measurement when no target is declared:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eRatio normalization: maximize with q = x/b and minimize with q = b/x. When a numerical scale s is declared, use (x+s)/(b+s) and its reciprocal, respectively. The scale handles zero values as a normalization floor; it is neither an allowed degradation nor an acceptance bound.\u003c/li\u003e\n\u003cli\u003eAmplitude in dB: maximize with q = 10^((x-b)/20) and minimize with its reciprocal.\u003c/li\u003e\n\u003cli\u003eTarget normalization: q = 1/(1+abs(x-b)/s), where s is the declared physical scale. Signed or zero-valued operating points are not divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eUse \u003ccode\u003elayout\u003c/code\u003e scoring. First compute each metric's raw quality q from the worst paired condition, with raw area quality q_area = area_target / candidate_functional_area. Credit c_i = min(1, q_i) for every positively weighted metric, then compute S = 100 * product(c_i ** w_i). The weights sum to 1 and the score is bounded by 100. An improvement beyond one target cannot compensate for missing another target. Physical, extraction, or functional rejection scores zero; other missing or invalid measurements leave the score unknown, and zero-weight observations must also be valid. Reaching every positively weighted target scores 100; a feasible reference may score far below 100. Weights express quality tradeoffs, not acceptance bounds.\u003c/p\u003e\n\u003cp\u003eThe measurements below use the supplied SPICE node and source names. \u003ccode\u003ev(n)\u003c/code\u003e is a node voltage; \u003ccode\u003ei(V)\u003c/code\u003e is current flowing into a voltage source, so delivered power uses a negative sign. \u003ccode\u003edb(z)=20*log10(abs(z))\u003c/code\u003e; \u003ccode\u003emag/abs\u003c/code\u003e denote magnitude, and \u003ccode\u003ecph\u003c/code\u003e denotes continuous phase in radians. \u003ccode\u003efind\u003c/code\u003e, \u003ccode\u003ewhen\u003c/code\u003e, \u003ccode\u003efrom/to\u003c/code\u003e and \u003ccode\u003erise/fall\u003c/code\u003e follow the deck's interpolation, window and crossing conventions. SPICE suffixes p/n/u/m/meg/g mean pico/nano/micro/milli/mega/giga. Nested \u003ccode\u003eavg\u003c/code\u003e, \u003ccode\u003emin\u003c/code\u003e, \u003ccode\u003emax\u003c/code\u003e, \u003ccode\u003evecmin/vecmax\u003c/code\u003e and \u003ccode\u003ederiv\u003c/code\u003e represent window averages, extrema and sampled derivatives. Measure each operating condition independently, pair it with the source result under that condition, and take the worst paired quality within each metric group.\u003c/p\u003e\n\u003cp\u003eFor metrics declaring \u003ccode\u003esaturating_ratio\u003c/code\u003e, q = 2(b+s)/(b+x+2*s), using the quality anchor b and the positive scale s in the metric’s units. Equality to the anchor gives raw quality 1; improvements approach raw quality 2 but credited quality stays at 1. Normalize each condition before selecting the worst quality. These scales and targets do not add acceptance cutoffs.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eDefinition / observation\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eQuality normalization\u003c/th\u003e\n\u003cth\u003eFunctional range\u003c/th\u003e\n\u003cth\u003eScale\u003c/th\u003e\n\u003cth\u003eDimension\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003etrack_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMaximum absolute VOUT minus target over 80–190 ns; target is VSRC sampled at 180 ns.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-05\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epedestal_abs_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAbsolute difference between VOUT at 220 ns and 180 ns (held minus tracked sample).\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e0.0001\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efeedthrough_peak_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMaximum absolute VOUT minus its 390 ns sample over 400–450 ns, during the input transition in hold.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e5e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ehold_drift_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAbsolute difference between VOUT at 11 us and 1 us.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ehold_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMaximum absolute VOUT minus target over 220 ns–11 us; target is VSRC at 180 ns.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e0.001\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ereacquire_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMaximum absolute VOUT minus target over 11.48–11.69 us; target is VSRC at 180 ns.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eclock_energy_j\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eIntegral of max(-V(CLK)*I(VCLK), 0) over 0–11.7 us; returned clock energy is excluded.\u003c/td\u003e\n\u003ctd\u003eJ\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-21\u003c/td\u003e\n\u003ctd\u003esupply\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003etarget\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Value of \u003ccode\u003ev(src) at=180n\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eunscored diagnostic\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003etrack_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Value of \u003ccode\u003ev(vout) at=180n\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eunscored diagnostic\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eheld_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Value of \u003ccode\u003ev(vout) at=220n\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eunscored diagnostic\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebefore_input_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Value of \u003ccode\u003ev(vout) at=390n\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eunscored diagnostic\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eafter_input_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Value of \u003ccode\u003ev(vout) at=450n\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eunscored diagnostic\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ehold_start_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Value of \u003ccode\u003ev(vout) at=1u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eunscored diagnostic\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ehold_end_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Value of \u003ccode\u003ev(vout) at=11u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eunscored diagnostic\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ereacquired_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Value of \u003ccode\u003ev(vout) at=11.65u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eunscored diagnostic\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epedestal_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eSigned VOUT(220 ns) − VOUT(180 ns).\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eunscored diagnostic\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efeedthrough_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eSigned VOUT(450 ns) − VOUT(390 ns).\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eunscored diagnostic\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edrift_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eSigned VOUT(11 us) − VOUT(1 us).\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eunscored diagnostic\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eThe capability coefficient is \u003cstrong\u003e5\u003c/strong\u003e, independent of this task's reference-normalized score.\u003c/p\u003e\n\u003ch3\u003eQuality targets and weights\u003c/h3\u003e\n\u003cp\u003eThe area quality target is \u003cstrong\u003e400 um2\u003c/strong\u003e. It is an integration budget, not a hard limit or a proven process minimum.\u003c/p\u003e\n\u003cp\u003eThe fixed 18.2 um square storage plate occupies 331.24 um2. A 400 um2 integration budget leaves 68.76 um2 beyond that plate for enclosure, the sampling switch, body tap and routing and carries 30%. Held-value accuracy carries 25%; pedestal, off-state feedthrough, tracking and clock energy carry 10% each; reacquisition carries 5%. The 2.7 fJ positive clock-source energy budget leaves approximately 0.121 fJ, or 4.7%, above the worst source-circuit energy for clock routing and contacts. Hold drift remains a diagnostic decomposition of held-value error. The fixed-switch electrical targets retain their physical anchors; the worst of all 16 sample/temperature/off-state conditions determines each quality factor.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eQuality anchor\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eScale\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e400\u003c/td\u003e\n\u003ctd\u003eum2\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.3\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ereacquire_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e5e-06\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.05\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003etrack_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e0.001\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e1e-05\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efeedthrough_peak_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e5e-05\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e5e-06\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ehold_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e0.015\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e0.001\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.25\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epedestal_abs_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e0.003\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e0.0001\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eclock_energy_j\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e2.7e-15\u003c/td\u003e\n\u003ctd\u003eJ\u003c/td\u003e\n\u003ctd\u003e1e-21\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eZero-weight observations: \u003ccode\u003ehold_drift_v\u003c/code\u003e. Original functional requirements remain enforced; grouped metrics listed above carry their stated weight once.\u003c/p\u003e\n\u003cp\u003eThe targets affect continuous quality only. A complete feasible reference may miss them; there is no minimum qualifying score.\u003c/p\u003e\n13:T552,\u003cul\u003e\n\u003cli\u003e\u003ccode\u003ematerials/circuit.cdl\u003c/code\u003e: authoritative native physical circuit.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ematerials/circuit.spice\u003c/code\u003e: equivalent simulator representation.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ematerials/testbench.spice\u003c/code\u003e: independent stimuli and measurements.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eThe ordered interface is \u003ccode\u003evin clk vout vss\u003c/code\u003e. VIN is driven through an external\n1 kohm source resistance; CLK receives the external clock; VOUT is the storage\nnode. The source's unused VDD port is removed. There is no DUT supply-current\nmetric or added artificial supply connection. Tie VSS to ground.\u003c/p\u003e\n\u003cp\u003eRetain the \u003ccode\u003esg13_lv_nmos\u003c/code\u003e with W=2 um, L=0.13 um, m=1 and drain/gate/source\nconnected to VIN/CLK/VOUT. Its body connects through the explicit VSS substrate\ntap. One \u003ccode\u003ecap_cmim\u003c/code\u003e with W=L=18.2 um connects its top plate to VOUT and bottom\nplate to VSS, nominally 499.772 fF at TT, 27 C. Preserve plate orientation.\nThe capacitor is internal physical storage, not a testbench load or an ideal\nreplacement. The native and simulator circuits include the same explicit tap.\u003c/p\u003e\n\u003cp\u003ePreserve models, sizes and connectivity. Equivalent parallel fingering is\npermitted only when all physical and electrical checks pass. Do not add a\nbuffer, complementary switch, dummy cancellation device, hold-node servo,\nexternal storage capacitor or other topology change.\u003c/p\u003e\n14:T4fc,\u003cp\u003eUse typical MOS and capacitor models at 27 and 85 C. CLK is externally driven\nbetween 0 and 1.2 V, with 2 ns linear transitions. The ideal signal source SRC\ndrives VIN through 1 kohm. Qualify four sampled levels, \u003ccode\u003esample_v\u003c/code\u003e = 0.1, 0.4,\n0.6 and 0.7 V, at both temperatures. At each point the off-state input is\nseparately driven to \u003ccode\u003ehold_v\u003c/code\u003e = 0 or 1.2 V: sixteen conditions. These are\nspecified sample points, not rail-to-rail or continuous-range qualification.\u003c/p\u003e\n\u003cp\u003eThe finite sequence starts from a solved DC operating point with SRC=0 and\nCLK=1.2 V. SRC moves to \u003ccode\u003esample_v\u003c/code\u003e during 20–22 ns. CLK falls during\n200–202 ns, isolating the storage node. SRC moves to \u003ccode\u003ehold_v\u003c/code\u003e during\n400–402 ns while CLK remains zero. SRC returns to \u003ccode\u003esample_v\u003c/code\u003e during\n11.2–11.202 us; CLK rises during 11.4–11.402 us. Stop at 11.7 us.\nNo output load, DC bias source or discharge resistor is attached to VOUT.\u003c/p\u003e\n\u003cp\u003eUse Gear order 2, KLU, maximum time step 2 ns, \u003ccode\u003egmin=1e-15\u003c/code\u003e,\n\u003ccode\u003ershunt=1e15\u003c/code\u003e, \u003ccode\u003ereltol=1e-6\u003c/code\u003e, \u003ccode\u003eabstol=1e-15\u003c/code\u003e and \u003ccode\u003evntol=1e-9\u003c/code\u003e.\nThe numerical shunt is not a specified physical retention load. Save SRC,\nVIN, CLK, VOUT and both ideal voltage-source currents.\u003c/p\u003e\n15:T10c3,\u003cp\u003eSoft solve budget: \u003cstrong\u003e1 hour\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eUse \u003ccode\u003e/protocol/task.json\u003c/code\u003e (including its \u003ccode\u003eresources\u003c/code\u003e field) and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e\nfor the frozen inputs, requirements, reviewed IHP primitives and harness\nfeedback. Work with the supplied KLayout, Magic and ngspice resources.\nWrite \u003ccode\u003e/workspace/output/final.gds\u003c/code\u003e and explicitly submit through the harness.\nReference GDS, source records and host configuration are not standard inputs.\u003c/p\u003e\n\u003ch3\u003eSolve workflow\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eRead the declared circuit and materials, \u003ccode\u003e/protocol/task.json\u003c/code\u003e for paths, constraints and reviewed resources, and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e for capabilities and helper commands. Task inputs under \u003ccode\u003e/task\u003c/code\u003e and resources under \u003ccode\u003e/resources\u003c/code\u003e are read-only; construct the layout in \u003ccode\u003e/workspace\u003c/code\u003e with the declared tools. With layout MCP, paths and commands refer to the remote EDA workspace. Create your own implementation with real devices, interconnect and pins, using your own tool loop without delegating to other agents; reference layouts and author code are not solver inputs.\u003c/li\u003e\n\u003cli\u003eInspect \u003ccode\u003eresources.external\u003c/code\u003e before using external tools. Each command starts a fresh shell: when tool modules are declared, source \u003ccode\u003e/usr/share/Modules/init/bash\u003c/code\u003e and load the selected tool's modules; export its declared \u003ccode\u003etool_environment\u003c/code\u003e settings in that same command. Repeat as needed and use batch or headless operation. Local manuals, command references, and release notes may be available within the declared EDA installation and PDK resource directories. Locate these resources through \u003ccode\u003e/protocol/task.json\u003c/code\u003e and consult the documentation for the installed tool version when diagnosing unfamiliar syntax or tool failures.\u003c/li\u003e\n\u003cli\u003eGenerate an initial candidate and submit a snapshot early. When \u003ccode\u003eprocess-feedback\u003c/code\u003e is available, check the current GDS with layout MCP \u003ccode\u003echeck\u003c/code\u003e or \u003ccode\u003epython -I /protocol/process_check.py\u003c/code\u003e before the final submission. This runs the final evaluator's complete plan and returns engineering diagnostics and candidate measurements, without scores or normalized quality factors. Checks have no count limit and consume the same wall-clock budget. Inspect the physical and functional results and all scored metrics; successful tool execution alone does not establish requirement satisfaction. Read paginated diagnostics with \u003ccode\u003ereport\u003c/code\u003e when using MCP. Local exploratory checks do not replace this complete check.\u003c/li\u003e\n\u003cli\u003eUse the remaining time for measured improvements to the declared quality objectives. Identify the limiting scored metrics, make targeted layout changes, regenerate and check the candidate, and compare measurements with the previous candidate and the stated scoring targets and trade-offs. Preserve the best valid candidate and revert changes that worsen the overall objective. Repeat while time and useful improvements remain; passing validity checks alone is not a stopping condition.\u003c/li\u003e\n\u003cli\u003eStop optimization when the budget expires, all declared quality objectives are achieved, or measured trials support convergence. If stopping early, explain the changes tried, the metric comparisons and the remaining limitations. Track remaining time through session status. At soft-budget expiry, finish or cancel already-started work and submit immediately; do not start another command, check or optimization round. If an MCP execution is running, use \u003ccode\u003epoll\u003c/code\u003e with its \u003ccode\u003eexecution_id\u003c/code\u003e and the returned \u003ccode\u003enext_offset\u003c/code\u003e as \u003ccode\u003eoffset\u003c/code\u003e until completion, or cancel it and wait for it to stop.\u003c/li\u003e\n\u003cli\u003eFinish or cancel outstanding work, restore your best candidate to the declared output path, and explicitly submit it before ending the session. With layout MCP \u003ccode\u003esubmit\u003c/code\u003e, remove the \u003ccode\u003e/workspace/\u003c/code\u003e prefix from \u003ccode\u003eoutput.path\u003c/code\u003e; with the container interface, run \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e. Wait for the receipt: only the last accepted snapshot is judged, and writing a file alone is not submission. Acceptance confirms delivery; the framework independently evaluates validity and quality after  each quality factor.\",\"weights\":{\"clock_energy_j\":0.1,\"feedthrough_peak_v\":0.1,\"functional_area\":0.3,\"hold_drift_v\":0,\"hold_error_v\":0.25,\"pedestal_abs_v\":0.1,\"reacquire_error_v\":0.05,\"track_error_v\":0.1}},\"sections\":{\"Electrical Requirements and Scoring\":\"$12\",\"Inputs and Interface\":\"$13\",\"Objective\":\"\u003cp\u003eImplement \u003ccode\u003esmp_001_nmos_th\u003c/code\u003e: a single-NMOS sampling switch with an internal\\nphysical storage capacitor. Preserve the switch and stored-charge node, and\\nmeet acquisition, turn-off pedestal, isolated-input feedthrough, hold drift\\nand reacquisition requirements at the specified input and temperature points.\u003c/p\u003e\\n\u003ch3\u003eOptimization objective\u003c/h3\u003e\\n\u003cp\u003eMaximize the declared quality score within the solve budget while satisfying all physical and necessary functional requirements. The first passing DRC, LVS and required electrical checks establish a feasible baseline. Continue improving the scored metrics from that baseline; a passing check or \u003ccode\u003etask_success = true\u003c/code\u003e does not mean that the quality objectives have been achieved.\u003c/p\u003e\\n\",\"Operating Conditions\":\"$14\",\"Physical Requirements\":\"\u003cp\u003eSubmit GDSII top cell \u003ccode\u003esmp_001_nmos_th\u003c/code\u003e, at most 10 MiB, within an 80 × 80 um\\nfunctional outline. Pass native IHP main/maximal DRC without waivers\\n(standalone scope with density/antenna disabled), strict named-port LVS,\\nfunctional geometry and candidate-derived Magic RC extraction. Functional\\narea includes the complete device/contact/routing layers enumerated by the\\nruntime outline; annotation and pin layers do not count.\u003c/p\u003e\\n\u003cp\u003ePost-layout simulation must consume the submitted layout's extracted NMOS,\\nphysical MIM, junction geometry and interconnect RC. The isolated Magic import\\nuses half-grid subdivision and \u003ccode\u003egds_readonly=false\u003c/code\u003e; the submitted GDS remains\\nimmutable. No diagnostic is waived. Source simulation retains the finite tap\\nmodel; Magic idealizes the tap connection. Distributed substrate noise and\\nfabrication signoff are outside this contract.\u003c/p\u003e\\n\",\"Tools and Submission\":\"$15\"},\"source_url\":\"https://github.com/MacAnalog/spicexplorer-release/tree/263d0322f8900dc331536fbbe6c0e804514fc454/analog-db/circuits/smp_001_nmos_th\",\"status\":\"qualified\",\"title\":\"Physical NMOS Sample-and-Hold: Headroom and Retention\",\"core\":false},\"catalog\":{\"tasks\":[],\"runs\":[{\"condition\":{\"cli_version\":\"2.1.1\",\"configuration_sha256\":\"2872a6f25782cba5c217ff887dd85de87ebc9b0dbbc4060f55c7f726a5270820\",\"effort_requested\":\"high\",\"effort_resolved\":\"high\",\"harness\":\"kimi-code\",\"harness_id\":\"iclayout-kimi-code\",\"harness_kind\":\"agent\",\"harness_version\":\"1\",\"model\":\"kimi-code/k3\",\"prompt_sha256\":\"620096f881d41decf3158e66dfa0731aa69e297e489ee12f9b6c289434dade25\",\"provider_effective_effort\":null,\"solver_image\":\"sha256:6c47f91ee32beb0e182f754de40ad76299b3eb44f92ab09b526d11c14a17dbdb\"},\"condition_id\":\"c7e2ec727ef437e3755cc9769ede4eba90d297de31b35fa27a75bc96a3ca8721\",\"evaluation_id\":\"c325f87242aae50423fe820149ec88afe6675ff4f10de92fd0cff39bcc31cdd0\",\"evaluation_mode\":\"self_run\",\"id\":\"83813a17c58ec42ffbd6487a2663b6bfd2c4c192af6531b9b4d4c5813f95ed3a\",\"method\":\"layout\",\"origin\":\"official\",\"outcome\":\"pass\",\"pdk\":\"ihp-sg13g2\",\"publication\":\"published\",\"repetition\":1,\"score\":95.38599923813142,\"task_id\":\"ihp-sg13g2.analog-db.smp_001_nmos_th\",\"task_version\":\"accfad14981b75d506e9b43ea92f4799f94a5263e8f54a84d3d362c8eec79bfc\",\"title\":\"Physical NMOS Sample-and-Hold: Headroom and Retention\"},{\"condition\":{\"cli_version\":\"codex-cli 0.162.1\",\"configuration_sha256\":\"14d27bd522ce09bad94da261aceb908347a814b3e087ff692c1af5a3f2a3253d\",\"effort_requested\":\"max\",\"effort_resolved
