[task.evaluation]
schema_version = 1
mode = "post_layout"

[[task.evaluation.jobs]]
id = "artifact"
stage = "check"
operation = "layout.artifact"
gate = "artifact"

[task.evaluation.jobs.inputs]
layout = "candidate"
task = "task"

[[task.evaluation.jobs]]
id = "drc"
stage = "check"
operation = "layout.drc"
gate = "drc"
requires = [
    "artifact",
]

[task.evaluation.jobs.inputs]
layout = "candidate"
task = "task"

[[task.evaluation.jobs]]
id = "lvs"
stage = "check"
operation = "layout.lvs"
gate = "lvs"
requires = [
    "artifact",
]

[task.evaluation.jobs.inputs]
layout = "candidate"
task = "task"
netlist = "input:netlist"

[task.evaluation.jobs.outputs]
database = "klayout-lvs"
binding = "json"

[[task.evaluation.jobs]]
id = "geometry"
stage = "check"
operation = "layout.geometry"
gate = "constraint"
requires = [
    "artifact",
    "drc",
    "lvs",
]

[task.evaluation.jobs.inputs]
layout = "candidate"
task = "task"
constraints = "input:constraints"
database = "job:lvs:database"
binding = "job:lvs:binding"

[[task.evaluation.jobs]]
id = "parasitics"
stage = "extract"
operation = "layout.extract_rc"
requires = [
    "artifact",
    "drc",
    "lvs",
    "geometry",
]

[task.evaluation.jobs.inputs]
layout = "candidate"
task = "task"

[task.evaluation.jobs.outputs]
netlist = "spice"

[task.evaluation.jobs.parameters]
ports = [
    "vin",
    "vout",
    "clk",
    "clkb",
    "vdd",
    "vss",
]

[[task.evaluation.jobs]]
id = "nominal"
stage = "simulate"
operation = "circuit.simulate"

[task.evaluation.jobs.inputs]
deck = "input:performance"
dut = "job:parasitics:netlist"

[task.evaluation.jobs.outputs]
waveform = "ngspice-raw"

[task.evaluation.jobs.parameters.measurements]
track_high = "V"
track_again = "V"
track_low = "V"
hold_error_v = "V"
settle_s = "s"

[task.evaluation.jobs.parameters.values]

[task.evaluation.jobs.parameters.exports]
waveform = "waveform.raw"

[[task.evaluation.metrics]]
id = "functional_area"
category = "physical"
observations = [
    "geometry:area",
]
unit = "um2"
direction = "minimize"
aggregation = "max"

[[task.evaluation.metrics]]
id = "high"
category = "performance"
observations = [
    "nominal:track_high",
    "nominal:track_again",
]
unit = "V"
direction = "maximize"
aggregation = "min"
dimension = "response"
lower = 2.48
upper = 2.52
zero_lower = 1.5
zero_upper = 3.3

[[task.evaluation.metrics]]
id = "low"
category = "performance"
observations = [
    "nominal:track_low",
]
unit = "V"
direction = "maximize"
aggregation = "min"
dimension = "response"
lower = 0.48
upper = 0.52
zero_lower = 0
zero_upper = 1.5

[[task.evaluation.metrics]]
id = "hold"
category = "performance"
observations = [
    "nominal:hold_error_v",
]
unit = "V"
direction = "minimize"
aggregation = "max"
dimension = "response"
upper = 0.04
zero_upper = 0.3

[[task.evaluation.metrics]]
id = "settling"
category = "performance"
observations = [
    "nominal:settle_s",
]
unit = "s"
direction = "maximize"
aggregation = "min"
dimension = "response"
lower = 0
upper = 1e-09
zero_lower = 0
zero_upper = 1e-08

[task.evaluation.scoring]
method = "layout-v1"
area_metric = "functional_area"
area_target = 4000
area_zero = 16000

[toolchain]
schema_version = 1

[toolchain.backends.artifact]
type = "klayout-docker"

[toolchain.backends.artifact.settings]
image = "iclayout-bench-tools:local"
check = "artifact"
timeout_seconds = 180

[toolchain.backends.drc]
type = "klayout-docker"

[toolchain.backends.drc.settings]
image = "iclayout-bench-tools:local"
check = "drc"
timeout_seconds = 180
support = "build/support/gf180-physical-v2"
profile = "drc.json"

[toolchain.backends.drc.support_profiles]
support = "physical"

[toolchain.backends.lvs]
type = "klayout-docker"

[toolchain.backends.lvs.settings]
image = "iclayout-bench-tools:local"
check = "lvs"
timeout_seconds = 180
support = "build/support/gf180-physical-v2"
profile = "lvs-vss.json"

[toolchain.backends.lvs.support_profiles]
support = "physical"

[toolchain.backends.geometry]
type = "klayout-geometry-docker"

[toolchain.backends.geometry.settings]
image = "iclayout-bench-tools:local"
timeout_seconds = 180

[toolchain.backends.rc]
type = "magic-rc-docker"

[toolchain.backends.rc.settings]
image = "iclayout-bench-tools:local"
support = "build/support/gf180-magic"
technology = "gf180mcuD.tech"
tech_name = "gf180mcuD"
style = "ngspice()"
gds_readonly = false
grid_subdivision = 10
case_insensitive_ports = true
timeout_seconds = 240

[toolchain.backends.rc.support_profiles]
support = "magic"

[toolchain.backends.ngspice]
type = "ngspice-docker"

[toolchain.backends.ngspice.settings]
image = "iclayout-bench-tools:local"
support = "build/support/gf180-models"
timeout_seconds = 240

[toolchain.backends.ngspice.support_profiles]
support = "models"

[toolchain.bindings]
"layout.artifact" = "artifact"
"layout.drc" = "drc"
"layout.lvs" = "lvs"
"layout.geometry" = "geometry"
"layout.extract_rc" = "rc"
"circuit.simulate" = "ngspice"

