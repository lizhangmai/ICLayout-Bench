schema_version = 1

[agent]
schema_version = 1
id = "gf180mcuD"
support_profiles = [
    "models",
    "physical",
    "magic",
]
checks = [
    [
        "python",
        "-c",
        "import os, pya; from pathlib import Path; from cells.draw_fet import draw_nfet; from cells.layers_def import layer; t=pya.Technology(); t.load(str(Path(os.environ['PDK_PATH'], 'libs.tech/klayout/tech/gf180mcu.lyt'))); assert t.name; c=draw_nfet(w_gate=0.42); c.write_gds('/workspace/gf180-smoke.gds'); l=pya.Layout(); l.read('/workspace/gf180-smoke.gds'); assert pya.Region(l.top_cell().begin_shapes_rec(l.layer(*layer['comp']))).area()>0",
    ],
    [
        "python",
        "/resources/pdk-check.py",
        "models",
        "nfet_03v3",
        "models.spice",
        "--voltage",
        "3.3",
        "--length",
        "0.28u",
    ],
]

[agent.sources.gf180mcuD]
installation = true
path = "gf180mcuD"
include = [
    "gf180mcuD/libs.tech/klayout",
    "gf180mcuD/libs.tech/magic",
    "gf180mcuD/libs.tech/ngspice",
    "gf180mcuD/libs.tech/netgen",
    "gf180mcuD/libs.tech/xschem",
    "gf180mcuD/libs.ref/gf180mcu_fd_pr",
    "gf180mcuD/SOURCES",
]
exclude = [
    "gf180mcuD/libs.tech/xschem/tests",
    "gf180mcuD/libs.tech/klayout/tech/drc/testing",
    "gf180mcuD/libs.tech/klayout/tech/lvs/testing",
    "gf180mcuD/libs.tech/klayout/tech/d25",
]

[agent.environment]
USER = "agent"
ICLAYOUT_BENCH_PDK = "gf180mcuD"
