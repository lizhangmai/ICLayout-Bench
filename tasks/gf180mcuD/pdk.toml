[[profiles.physical.files."lvs/gf180mcu.lvs".replace]]
old = "reader = RBA::NetlistSpiceReader.new(SubcircuitModelsReader.new)"
new = """
# ICLayout-Bench adapter: official ngspice primitive X wrappers use total W, SI L/W.
class GF180SpiceReader < SubcircuitModelsReader
  def wants_subcircuit(name)
    %w[NFET_03V3 PFET_03V3 PPOLYF_U_1K].include?(name.upcase)
  end
  def element(circuit, ele, name, model, value, nets, params)
    if ele == 'X' && %w[NFET_03V3 PFET_03V3].include?(model.upcase)
      error('GF180 MOS requires four terminals') unless nets.size == 4
      return super(circuit, 'M', name, model, value, nets, params)
    elsif ele == 'X' && model.upcase == 'PPOLYF_U_1K'
      error('GF180 resistor requires three terminals') unless nets.size == 3
      mapped = {'W' => params.fetch('R_WIDTH'), 'L' => params.fetch('R_LENGTH')}
      return super(circuit, 'R', name, model, 0, nets, mapped)
    end
    super
  end
end

reader = RBA::NetlistSpiceReader.new(GF180SpiceReader.new)"""

