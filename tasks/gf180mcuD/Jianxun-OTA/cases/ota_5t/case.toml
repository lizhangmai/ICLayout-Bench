[task.evaluation]
schema_version = 1
mode = "post_layout"

[[task.evaluation.jobs]]
id = "artifact"
stage = "check"
operation = "layout.artifact"
gate = "artifact"

[task.evaluation.jobs.inputs]
layout = "candidate"
task = "task"

[[task.evaluation.jobs]]
id = "drc"
stage = "check"
operation = "layout.drc"
gate = "drc"
requires = [
    "artifact",
]

[task.evaluation.jobs.inputs]
layout = "candidate"
task = "task"

[[task.evaluation.jobs]]
id = "lvs"
stage = "check"
operation = "layout.lvs"
gate = "lvs"
requires = [
    "artifact",
]

[task.evaluation.jobs.inputs]
layout = "candidate"
task = "task"
netlist = "input:netlist"

[task.evaluation.jobs.outputs]
database = "klayout-lvs"
binding = "json"

[[task.evaluation.jobs]]
id = "geometry"
stage = "check"
operation = "layout.geometry"
gate = "constraint"
requires = [
    "artifact",
    "drc",
    "lvs",
]

[task.evaluation.jobs.inputs]
layout = "candidate"
task = "task"
constraints = "input:constraints"
database = "job:lvs:database"
binding = "job:lvs:binding"

[[task.evaluation.jobs]]
id = "parasitics"
stage = "extract"
operation = "layout.extract_rc"
requires = [
    "artifact",
    "drc",
    "lvs",
    "geometry",
]

[task.evaluation.jobs.inputs]
layout = "candidate"
task = "task"

[task.evaluation.jobs.outputs]
netlist = "spice"

[task.evaluation.jobs.parameters]
ports = [
    "vdd",
    "out",
    "in_p",
    "in_n",
    "i_bias",
    "vss",
]

[[task.evaluation.jobs]]
id = "nominal"
stage = "simulate"
operation = "circuit.simulate"

[task.evaluation.jobs.inputs]
deck = "input:performance"
dut = "job:parasitics:netlist"

[task.evaluation.jobs.outputs]
waveform = "ngspice-raw"

[task.evaluation.jobs.parameters.measurements]
gain_db = "dB"
unity_hz = "Hz"
bias_v = "V"
power_w = "W"

[task.evaluation.jobs.parameters.values]

[task.evaluation.jobs.parameters.exports]
waveform = "waveform.raw"

[[task.evaluation.metrics]]
id = "functional_area"
category = "physical"
observations = [
    "geometry:area",
]
unit = "um2"
direction = "minimize"
aggregation = "max"

[[task.evaluation.metrics]]
id = "gain"
category = "performance"
observations = [
    "nominal:gain_db",
]
unit = "dB"
direction = "maximize"
aggregation = "min"
dimension = "response"
lower = 20
zero_lower = 0

[[task.evaluation.metrics]]
id = "unity"
category = "performance"
observations = [
    "nominal:unity_hz",
]
unit = "Hz"
direction = "maximize"
aggregation = "min"
dimension = "response"
lower = 15000000.0
zero_lower = 1000000.0

[[task.evaluation.metrics]]
id = "output_bias"
category = "performance"
observations = [
    "nominal:bias_v",
]
unit = "V"
direction = "maximize"
aggregation = "min"
dimension = "bias"
lower = 2
upper = 2.9
zero_lower = 0
zero_upper = 3.3

[[task.evaluation.metrics]]
id = "supply"
category = "performance"
observations = [
    "nominal:power_w",
]
unit = "W"
direction = "maximize"
aggregation = "min"
dimension = "supply"
lower = 0
upper = 0.00015
zero_lower = 0
zero_upper = 0.001

[task.evaluation.scoring]
method = "layout-v1"
area_metric = "functional_area"
area_target = 6000
area_zero = 24000

[toolchain]
schema_version = 1

[toolchain.backends.artifact]
type = "klayout-docker"

[toolchain.backends.artifact.settings]
image = "iclayout-bench-tools:local"
check = "artifact"
timeout_seconds = 180

[toolchain.backends.drc]
type = "klayout-docker"

[toolchain.backends.drc.settings]
image = "iclayout-bench-tools:local"
check = "drc"
timeout_seconds = 180
support = "build/support/gf180-physical-v2"
profile = "drc.json"

[toolchain.backends.drc.support_profiles]
support = "physical"

[toolchain.backends.lvs]
type = "klayout-docker"

[toolchain.backends.lvs.settings]
image = "iclayout-bench-tools:local"
check = "lvs"
timeout_seconds = 180
support = "build/support/gf180-physical-v2"
profile = "lvs-vss.json"

[toolchain.backends.lvs.support_profiles]
support = "physical"

[toolchain.backends.geometry]
type = "klayout-geometry-docker"

[toolchain.backends.geometry.settings]
image = "iclayout-bench-tools:local"
timeout_seconds = 180

[toolchain.backends.rc]
type = "magic-rc-docker"

[toolchain.backends.rc.settings]
image = "iclayout-bench-tools:local"
support = "build/support/gf180-magic"
technology = "gf180mcuD.tech"
tech_name = "gf180mcuD"
style = "ngspice()"
gds_readonly = false
grid_subdivision = 10
case_insensitive_ports = true
timeout_seconds = 240

[toolchain.backends.rc.support_profiles]
support = "magic"

[toolchain.backends.ngspice]
type = "ngspice-docker"

[toolchain.backends.ngspice.settings]
image = "iclayout-bench-tools:local"
support = "build/support/gf180-models"
timeout_seconds = 240

[toolchain.backends.ngspice.support_profiles]
support = "models"

[toolchain.bindings]
"layout.artifact" = "artifact"
"layout.drc" = "drc"
"layout.lvs" = "lvs"
"layout.geometry" = "geometry"
"layout.extract_rc" = "rc"
"circuit.simulate" = "ngspice"

