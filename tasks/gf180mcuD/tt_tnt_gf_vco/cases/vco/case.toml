stage = "check"
operation = "layout.artifact"
gate = "artifact"

[task.evaluation.jobs.inputs]
layout = "candidate"
task = "task"

[[task.evaluation.jobs]]
id = "drc"
stage = "check"
operation = "layout.drc"
gate = "drc"
requires = [
    "artifact",
]

[task.evaluation.jobs.inputs]
layout = "candidate"
task = "task"

[[task.evaluation.jobs]]
id = "lvs"
stage = "check"
operation = "layout.lvs"
