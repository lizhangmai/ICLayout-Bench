[toolchain]
schema_version = 1

[toolchain.backends.artifact]
type = "klayout-docker"

[toolchain.backends.artifact.settings]
image = "iclayout-bench-tools:local"
check = "artifact"
timeout_seconds = 180

[toolchain.backends.drc]
type = "klayout-docker"

[toolchain.backends.drc.settings]
image = "iclayout-bench-tools:local"
check = "drc"
timeout_seconds = 180
support = "build/support/gf180-physical-v2"
profile = "drc.json"

[toolchain.backends.drc.support_profiles]
support = "physical"

[toolchain.backends.lvs]
type = "klayout-docker"

[toolchain.backends.lvs.settings]
image = "iclayout-bench-tools:local"
check = "lvs"
timeout_seconds = 180
support = "build/support/gf180-physical-v2"
profile = "lvs.json"

[toolchain.backends.lvs.support_profiles]
support = "physical"

[toolchain.backends.geometry]
type = "klayout-geometry-docker"

[toolchain.backends.geometry.settings]
image = "iclayout-bench-tools:local"
timeout_seconds = 180

[toolchain.backends.rc]
type = "magic-rc-docker"

[toolchain.backends.rc.settings]
image = "iclayout-bench-tools:local"
support = "build/support/gf180-magic"
technology = "gf180mcuD.tech"
tech_name = "gf180mcuD"
style = "ngspice()"
gds_readonly = false
grid_subdivision = 10
case_insensitive_ports = true
timeout_seconds = 240

[toolchain.backends.rc.support_profiles]
support = "magic"

[toolchain.backends.ngspice]
type = "ngspice-docker"

[toolchain.backends.ngspice.settings]
image = "iclayout-bench-tools:local"
support = "build/support/gf180-models"
timeout_seconds = 240

[toolchain.backends.ngspice.support_profiles]
support = "models"

[toolchain.bindings]
"layout.artifact" = "artifact"
"layout.drc" = "drc"
"layout.lvs" = "lvs"
"layout.geometry" = "geometry"
"layout.extract_rc" = "rc"
"circuit.simulate" = "ngspice"

