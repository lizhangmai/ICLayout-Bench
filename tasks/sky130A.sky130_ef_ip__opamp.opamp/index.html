,\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L5\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[\"$L6\",[[\"$\",\"script\",\"script-0\",{\"src\":\"/ICLayout-Bench/_next/static/chunks/27jip_2vcvnd5.js\",\"async\":true,\"nonce\":\"$undefined\"}]],[\"$\",\"$L7\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.MetadataOutlet\",\"children\":\"$@9\"}]}]]}],{},null,false,null]},null,false,\"$a\"]},null,false,null],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Lb\",null,{\"children\":\"$Lc\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Ld\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.Metadata\",\"children\":\"$Le\"}]}]}],null]}],false]],\"m\":\"$undefined\",\"G\":[\"$f\",[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/ICLayout-Bench/_next/static/chunks/3sa54_ghi1h2h.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]]],\"S\":true,\"h\":null,\"r\":\"$undefined\",\"s\":\"$undefined\",\"a\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"2hqB741EA4j7xWQVg6hu-\"}\n10:I[1186,[\"/ICLayout-Bench/_next/static/chunks/2h60meymns2z5.js\",\"/ICLayout-Bench/_next/static/chunks/27jip_2vcvnd5.js\"],\"default\"]\na:C\n11:T2490,\u003ch1 id=\"problem-sky130-33-v-operational-amplifier-layout-task\"\u003eSKY130 3.3 V Operational Amplifier Layout Task\u003c/h1\u003e\n\u003ch2 id=\"problem-objective\"\u003eObjective\u003c/h2\u003e\n\u003cp\u003eImplement \u003ccode\u003esky130_ef_ip__opamp\u003c/code\u003e from the supplied transistor-level circuit, preserving topology, fixed device parameters, four-terminal body connections and the ordered interface. Submit a candidate GDS for electrical evaluation of its distributed RC extraction.\u003c/p\u003e\n\u003ch3 id=\"problem-optimization-objective\"\u003eOptimization objective\u003c/h3\u003e\n\u003cp\u003eMaximize the declared quality score within the solve budget while satisfying all physical and necessary functional requirements. The first passing DRC, LVS and required electrical checks establish a feasible baseline. Continue improving the scored metrics from that baseline; a passing check or \u003ccode\u003etask_success = true\u003c/code\u003e does not mean that the quality objectives have been achieved.\u003c/p\u003e\n\u003ch2 id=\"problem-inputs-and-interface\"\u003eInputs and Interface\u003c/h2\u003e\n\u003cp\u003eOrdered ports are \u003ccode\u003evdd out ena vss inp inm\u003c/code\u003e. Declared inputs include \u003ccode\u003eproblem.md\u003c/code\u003e, \u003ccode\u003ematerials/circuit.spice\u003c/code\u003e \u003ccode\u003ematerials/testbench.spice\u003c/code\u003e and \u003ccode\u003ematerials/dynamics.spice\u003c/code\u003e. The runtime provides models and process resources; reference layouts, author code and qualification evidence are maintainer-only materials.\u003c/p\u003e\n\u003ch2 id=\"problem-operating-conditions\"\u003eOperating Conditions\u003c/h2\u003e\n\u003cp\u003eSupply 3.3 V, enable 1.8 V, input common mode 1.65 V. Use output loads 0.1, 0.5, 1 pF and 100 Mohm resistance; the declared large-inductance/capacitance fixture closes DC feedback and breaks AC feedback. Measure low-frequency gain, unity-gain crossing, phase margin and supply power. 5 pF is outside this task's operating conditions. All electrical experiments use fixed TT models at 27 °C; delivered testbenches define interpolation, edges, loads, sweeps, observation times and power intervals.\u003c/p\u003e\n\u003cp\u003eDynamic tests reuse the upstream CACE unity-feedback slew apparatus: drive the input from 0 to 3.3 V or back at 100 ns with 0.1 ns edges, and measure the output interval between 0.5 and 2.8 V. Repeat unloaded and with 0.1/1 pF loads. Stop at 10 us with a 2 ns maximum step. The measured interval is used directly rather than the upstream hard-coded 2 V slew numerator; the actual threshold separation is 2.3 V.\u003c/p\u003e\n\u003ch2 id=\"problem-physical-requirements\"\u003ePhysical Requirements\u003c/h2\u003e\n\u003cp\u003eSubmit a nonempty GDS no larger than 10485760 bytes, with top cell \u003ccode\u003esky130_ef_ip__opamp\u003c/code\u003e. Functional geometry must fit within the 80 × 100 um envelope on the declared layer set. Pass complete Magic DRC without waivers and independent Netgen LVS checking named ports, models, dimensions, multiplicities and body/contact connections. After physical and geometric checks pass, extract the candidate's distributed interconnect resistance, capacitance and devices, then run every declared experiment.\u003c/p\u003e\n\u003ch2 id=\"problem-electrical-requirements-and-scoring\"\u003eElectrical Requirements and Scoring\u003c/h2\u003e\n\u003cp\u003ePreserve the existing physical, extraction, output-bias and stable phase-branch requirements. Every declared source and candidate measurement must be complete and finite. Dynamic crossing intervals must be nonnegative. No minimum score or fixed speed/power target is an acceptance cutoff.\u003c/p\u003e\n\u003cp\u003ePair every electrical observation with the same-condition pre-layout circuit and take the worst quality per metric. Rising/falling intervals use q=2(b+s)/(b+x+2s), with s=1 ns. Existing loaded bandwidth normalization remains in the contract. Area quality is 1500 um2 divided by candidate functional area; this 30 by 50 um integration allocation is independent of the feasibility witness and permits other aspect ratios. The score is 100 times the product of min(1,q) raised to each weight. Invalid candidates score zero; incomplete measurements leave the result unknown.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.30\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eunity_hz\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.25\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003erise_slew_s\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.225\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efall_slew_s\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.225\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003egain_low\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003esupply_power\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eDC gain and fixed-bias supply power remain measured diagnostics. The reference proves feasibility without a score minimum. Coverage is nominal TT, 27 C; the presence of other upstream CACE templates does not establish noise, PVT or statistical qualification.\u003c/p\u003e\n\u003ch2 id=\"problem-tools-and-submission\"\u003eTools and Submission\u003c/h2\u003e\n\u003cp\u003eSoft solve budget: \u003cstrong\u003e8 hours\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eRead \u003ccode\u003e/protocol/task.json\u003c/code\u003e for input/output paths, constraints and the \u003ccode\u003eresources\u003c/code\u003e object; \u003ccode\u003e/protocol/harness.json\u003c/code\u003e describes the active check and submission interface.\u003c/p\u003e\n\u003cp\u003eUse the task information, tools and SKY130 resources provided by the runtime protocol. Write only the final GDS to \u003ccode\u003eoutput/final.gds\u003c/code\u003e and explicitly submit through the declared interface. Source simulation serves characterization; accepted results come from complete physical and RC electrical evaluation of the candidate GDS. Conclusions cover only the declared conditions, excluding PVT, mismatch, reliability and product signoff.\u003c/p\u003e\n\u003ch3 id=\"problem-solve-workflow\"\u003eSolve workflow\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eRead the declared circuit and materials, \u003ccode\u003e/protocol/task.json\u003c/code\u003e for paths, constraints and reviewed resources, and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e for capabilities and helper commands. Task inputs under \u003ccode\u003e/task\u003c/code\u003e and resources under \u003ccode\u003e/resources\u003c/code\u003e are read-only; construct the layout in \u003ccode\u003e/workspace\u003c/code\u003e with the declared tools. With layout MCP, paths and commands refer to the remote EDA workspace. Create your own implementation with real devices, interconnect and pins, using your own tool loop without delegating to other agents; reference layouts and author code are not solver inputs.\u003c/li\u003e\n\u003cli\u003eInspect \u003ccode\u003eresources.external\u003c/code\u003e before using external tools. Each command starts a fresh shell: when tool modules are declared, source \u003ccode\u003e/usr/share/Modules/init/bash\u003c/code\u003e and load the selected tool's modules; export its declared \u003ccode\u003etool_environment\u003c/code\u003e settings in that same command. Repeat as needed and use batch or headless operation. Local manuals, command references, and release notes may be available within the declared EDA installation and PDK resource directories. Locate these resources through \u003ccode\u003e/protocol/task.json\u003c/code\u003e and consult the documentation for the installed tool version when diagnosing unfamiliar syntax or tool failures.\u003c/li\u003e\n\u003cli\u003eGenerate an initial candidate and submit a snapshot early. When \u003ccode\u003eprocess-feedback\u003c/code\u003e is available, check the current GDS with layout MCP \u003ccode\u003echeck\u003c/code\u003e or \u003ccode\u003epython -I /protocol/process_check.py\u003c/code\u003e before the final submission. This runs the final evaluator's complete plan and returns engineering diagnostics and candidate measurements, without scores or normalized quality factors. Checks have no count limit and consume the same wall-clock budget. Inspect the physical and functional results and all scored metrics; successful tool execution alone does not establish requirement satisfaction. Read paginated diagnostics with \u003ccode\u003ereport\u003c/code\u003e when using MCP. Local exploratory checks do not replace this complete check.\u003c/li\u003e\n\u003cli\u003eUse the remaining time for measured improvements to the declared quality objectives. Identify the limiting scored metrics, make targeted layout changes, regenerate and check the candidate, and compare measurements with the previous candidate and the stated scoring targets and trade-offs. Preserve the best valid candidate and revert changes that worsen the overall objective. Repeat while time and useful improvements remain; passing validity checks alone is not a stopping condition.\u003c/li\u003e\n\u003cli\u003eStop optimization when the budget expires, all declared quality objectives are achieved, or measured trials support convergence. If stopping early, explain the changes tried, the metric comparisons and the remaining limitations. Track remaining time through session status. At soft-budget expiry, finish or cancel already-started work and submit immediately; do not start another command, check or optimization round. If an MCP execution is running, use \u003ccode\u003epoll\u003c/code\u003e with its \u003ccode\u003eexecution_id\u003c/code\u003e and the returned \u003ccode\u003enext_offset\u003c/code\u003e as \u003ccode\u003eoffset\u003c/code\u003e until completion, or cancel it and wait for it to stop.\u003c/li\u003e\n\u003cli\u003eFinish or cancel outstanding work, restore your best candidate to the declared output path, and explicitly submit it before ending the session. With layout MCP \u003ccode\u003esubmit\u003c/code\u003e, remove the \u003ccode\u003e/workspace/\u003c/code\u003e prefix from \u003ccode\u003eoutput.path\u003c/code\u003e; with the container interface, run \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e. Wait for the receipt: only the last accepted snapshot is judged, and writing a file alone is not submission. Acceptance confirms delivery; the framework independently evaluates validity and quality after the session.\u003c/li\u003e\n\u003c/ol\u003e\n12:T6de,\u003cp\u003ePreserve the existing physical, extraction, output-bias and stable phase-branch requirements. Every declared source and candidate measurement must be complete and finite. Dynamic crossing intervals must be nonnegative. No minimum score or fixed speed/power target is an acceptance cutoff.\u003c/p\u003e\n\u003cp\u003ePair every electrical observation with the same-condition pre-layout circuit and take the worst quality per metric. Rising/falling intervals use q=2(b+s)/(b+x+2s), with s=1 ns. Existing loaded bandwidth normalization remains in the contract. Area quality is 1500 um2 divided by candidate functional area; this 30 by 50 um integration allocation is independent of the feasibility witness and permits other aspect ratios. The score is 100 times the product of min(1,q) raised to each weight. Invalid candidates score zero; incomplete measurements leave the result unknown.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.30\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eunity_hz\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.25\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003erise_slew_s\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.225\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efall_slew_s\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.225\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003egain_low\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003esupply_power\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eDC gain and fixed-bias supply power remain measured diagnostics. The reference proves feasibility without a score minimum. Coverage is nominal TT, 27 C; the presence of other upstream CACE templates does not establish noise, PVT or statistical qualification.\u003c/p\u003e\n13:T119f,\u003cp\u003eSoft solve budget: \u003cstrong\u003e8 hours\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eRead \u003ccode\u003e/protocol/task.json\u003c/code\u003e for input/output paths, constraints and the \u003ccode\u003eresources\u003c/code\u003e object; \u003ccode\u003e/protocol/harness.json\u003c/code\u003e describes the active check and submission interface.\u003c/p\u003e\n\u003cp\u003eUse the task information, tools and SKY130 resources provided by the runtime protocol. Write only the final GDS to \u003ccode\u003eoutput/final.gds\u003c/code\u003e and explicitly submit through the declared interface. Source simulation serves characterization; accepted results come from complete physical and RC electrical evaluation of the candidate GDS. Conclusions cover only the declared conditions, excluding PVT, mismatch, reliability and product signoff.\u003c/p\u003e\n\u003ch3\u003eSolve workflow\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eRead the declared circuit and materials, \u003ccode\u003e/protocol/task.json\u003c/code\u003e for paths, constraints and reviewed resources, and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e for capabilities and helper commands. Task inputs under \u003ccode\u003e/task\u003c/code\u003e and resources under \u003ccode\u003e/resources\u003c/code\u003e are read-only; construct the layout in \u003ccode\u003e/workspace\u003c/code\u003e with the declared tools. With layout MCP, paths and commands refer to the remote EDA workspace. Create your own implementation with real devices, interconnect and pins, using your own tool loop without delegating to other agents; reference layouts and author code are not solver inputs.\u003c/li\u003e\n\u003cli\u003eInspect \u003ccode\u003eresources.external\u003c/code\u003e before using external tools. Each command starts a fresh shell: when tool modules are declared, source \u003ccode\u003e/usr/share/Modules/init/bash\u003c/code\u003e and load the selected tool's modules; export its declared \u003ccode\u003etool_environment\u003c/code\u003e settings in that same command. Repeat as needed and use batch or headless operation. Local manuals, command references, and release notes may be available within the declared EDA installation and PDK resource directories. Locate these resources through \u003ccode\u003e/protocol/task.json\u003c/code\u003e and consult the documentation for the installed tool version when diagnosing unfamiliar syntax or tool failures.\u003c/li\u003e\n\u003cli\u003eGenerate an initial candidate and submit a snapshot early. When \u003ccode\u003eprocess-feedback\u003c/code\u003e is available, check the current GDS with layout MCP \u003ccode\u003echeck\u003c/code\u003e or \u003ccode\u003epython -I /protocol/process_check.py\u003c/code\u003e before the final submission. This runs the final evaluator's complete plan and returns engineering diagnostics and candidate measurements, without scores or normalized quality factors. Checks have no count limit and consume the same wall-clock budget. Inspect the physical and functional results and all scored metrics; successful tool execution alone does not establish requirement satisfaction. Read paginated diagnostics with \u003ccode\u003ereport\u003c/code\u003e when using MCP. Local exploratory checks do not replace this complete check.\u003c/li\u003e\n\u003cli\u003eUse the remaining time for measured improvements to the declared quality objectives. Identify the limiting scored metrics, make targeted layout changes, regenerate and check the candidate, and compare measurements with the previous candidate and the stated scoring targets and trade-offs. Preserve the best valid candidate and revert changes that worsen the overall objective. Repeat while time and useful improvements remain; passing validity checks alone is not a stopping condition.\u003c/li\u003e\n\u003cli\u003eStop optimization when the budget expires, all declared quality objectives are achieved, or measured trials support convergence. If stopping early, explain the changes tried, the metric comparisons and the remaining limitations. Track remaining time through session status. At soft-budget expiry, finish or cancel already-started work and submit immediately; do not start another command, check or optimization round. If an MCP execution is running, use \u003ccode\u003epoll\u003c/code\u003e with its \u003ccode\u003eexecution_id\u003c/code\u003e and the returned \u003ccode\u003enext_offset\u003c/code\u003e as \u003ccode\u003eoffset\u003c/code\u003e until completion, or cancel it and wait for it to stop.\u003c/li\u003e\n\u003cli\u003eFinish or cancel outstanding work, restore your best candidate to the declared output path, and explicitly submit it before ending the session. With layout MCP \u003ccode\u003esubmit\u003c/code\u003e, remove the \u003ccode\u003e/workspace/\u003c/code\u003e prefix from \u003ccode\u003eoutput.path\u003c/code\u003e; with the container interface, run \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e. Wait for the receipt: only the last accepted snapshot is judged, and writing a file alone is not submission. Acceptance confirms delivery; the framework independently evaluates validity and quality after the session.\u003c/li\u003e\n\u003c/ol\u003e\n6:[\"$\",\"$8\",null,{\"fallback\":[\"$\",\"p\",null,{\"children\":\"Loading published evidence…\"}],\"children\":[\"$\",\"$L10\",null,{\"task\":{\"case_path\":\"tasks/sky130A/sky130_ef_ip__opamp/cases/opamp/case.toml\",\"coefficient\":3,\"collection\":\"sky130_ef_ip__opamp\",\"configuration_url\":\"/ICLayout-Bench/assets/0393eb3d8f81143b1edade8091455a72082b48953db86a9439c489c926064837.txt\",\"description_html\":\"$11\",\"description_path\":\"tasks/sky130A/sky130_ef_ip__opamp/cases/opamp/problem.md\",\"hours\":8,\"id\":\"sky130A.sky130_ef_ip__opamp.opamp\",\"inputs\":{\"description\":{\"format\":\"text\",\"path\":\"problem.md\",\"sha256\":\"d2cb7e6de59753b4674486a565f47d6d22f4c914bcae9b0eb272d2c905b6d2dd\"},\"dynamics\":{\"format\":\"spice\",\"path\":\"materials/dynamics.spice\",\"sha256\":\"0ea3b168acf3a9480990b174f0eb2a8b94cfe51732ace0adca5a2045576131fb\"},\"netlist\":{\"format\":\"spice\",\"path\":\"materials/circuit.spice\",\"sha256\":\"12b9a110d6e630c1d51f61891154997f19672dce63c6d65883c740d4ae67882a\",\"subcircuit\":\"sky130_ef_ip__opamp\"},\"performance\":{\"format\":\"spice\",\"path\":\"materials/testbench.spice\",\"sha256\":\"8a445a3cbb29766dbfafa634a369c25f82df226c1d319a7f2aa80ae10f9b4537\"}},\"licenses\":[{\"name\":\"LICENSE\",\"path\":\"tasks/sky130A/sky130_ef_ip__opamp/LICENSE\",\"url\":\"/ICLayout-Bench/assets/c71d239df91726fc519c6eb72d318ec65820627232b2f796219e87dcf35d0ab4.txt\"},{\"name\":\"NOTICE\",\"path\":\"tasks/sky130A/sky130_ef_ip__opamp/NOTICE\",\"url\":\"/ICLayout-Bench/assets/f4ff343814afa59fa99383dca7ea70ba3e5e64edd3eb0a2e67c2dc803bec8400.txt\"}],\"materials\":[{\"name\":\"problem.md\",\"role\":\"description\",\"url\":\"/ICLayout-Bench/assets/d2cb7e6de59753b4674486a565f47d6d22f4c914bcae9b0eb272d2c905b6d2dd.txt\"},{\"name\":\"materials/circuit.spice\",\"role\":\"netlist\",\"url\":\"/ICLayout-Bench/assets/12b9a110d6e630c1d51f61891154997f19672dce63c6d65883c740d4ae67882a.txt\"},{\"name\":\"materials/testbench.spice\",\"role\":\"performance\",\"url\":\"/ICLayout-Bench/assets/8a445a3cbb29766dbfafa634a369c25f82df226c1d319a7f2aa80ae10f9b4537.txt\"},{\"name\":\"materials/dynamics.spice\",\"role\":\"dynamics\",\"url\":\"/ICLayout-Bench/assets/0ea3b168acf3a9480990b174f0eb2a8b94cfe51732ace0adca5a2045576131fb.txt\"}],\"metrics\":[{\"aggregation\":\"max\",\"category\":\"physical\",\"direction\":\"minimize\",\"id\":\"functional_area\",\"observations\":[\"geometry:area\"],\"unit\":\"um2\"},{\"aggregation\":\"min\",\"baseline\":[\"source_light:gain_low\",\"source_nominal:gain_low\",\"source_heavy:gain_low\"],\"category\":\"performance\",\"dimension\":\"response\",\"direction\":\"maximize\",\"id\":\"gain_low\",\"normalization\":\"db20\",\"observations\":[\"light:gain_low\",\"nominal:gain_low\",\"heavy:gain_low\"],\"unit\":\"dB\"},{\"aggregation\":\"min\",\"baseline\":[\"source_light:unity_hz\",\"source_nominal:unity_hz\",\"source_heavy:unity_hz\"],\"category\":\"performance\",\"dimension\":\"response\",\"direction\":\"maximize\",\"id\":\"unity_hz\",\"normalization\":\"ratio\",\"observations\":[\"light:unity_hz\",\"nominal:unity_hz\",\"heavy:unity_hz\"],\"requirement\":{\"lower\":0,\"rationale\":\"The declared ordered-event interval or crossing frequency has a nonnegative measurement domain, and its crossing must exist for a usable observation.\"},\"unit\":\"Hz\"},{\"aggregation\":\"max\",\"baseline\":[\"source_light:supply_power\",\"source_nominal:supply_power\",\"source_heavy:supply_power\"],\"category\":\"performance\",\"dimension\":\"supply\",\"direction\":\"minimize\",\"id\":\"supply_power\",\"normalization\":\"saturating_ratio\",\"observations\":[\"light:supply_power\",\"nominal:supply_power\",\"heavy:supply_power\"],\"requirement\":{\"lower\":0,\"rationale\":\"The declared powered circuit must consume nonnegative net energy from its supplies and driven references over the stated observation; power magnitude remains a quality objective.\"},\"scale\":0.0001,\"unit\":\"W\"},{\"aggregation\":\"min\",\"category\":\"performance\",\"direction\":\"target\",\"id\":\"phase_margin\",\"observations\":[\"light:phase_margin\",\"nominal:phase_margin\",\"heavy:phase_margin\"],\"requirement\":{\"lower\":0,\"rationale\":\"The declared negative-feedback loop must remain on its measured 0 to 180 degree stable-feedback branch at the specified crossing; the previous 45 degree design margin is not a validity cutoff.\",\"upper\":180},\"unit\":\"deg\"},{\"aggregation\":\"max\",\"category\":\"performance\",\"direction\":\"target\",\"id\":\"bias_voltage\",\"observations\":[\"light:bias_voltage\",\"nominal:bias_voltage\",\"heavy:bias_voltage\"],\"requirement\":{\"lower\":1,\"rationale\":\"The declared output or bias must stay in its specified operating or logic-level interval under the supplied rail, feedback or full-scale reference conditions; an out-of-range output violates that interface.\",\"upper\":2.3},\"unit\":\"V\"},{\"aggregation\":\"max\",\"baseline\":[\"source_slew_0_0:slew_interval_s\",\"source_slew_0_1:slew_interval_s\",\"source_slew_0_2:slew_interval_s\"],\"category\":\"performance\",\"dimension\":\"response\",\"direction\":\"minimize\",\"id\":\"fall_slew_s\",\"normalization\":\"saturating_ratio\",\"observations\":[\"slew_0_0:slew_interval_s\",\"slew_0_1:slew_interval_s\",\"slew_0_2:slew_interval_s\"],\"requirement\":{\"lower\":0,\"rationale\":\"The elapsed output crossing interval has a nonnegative time domain.\"},\"scale\":1e-9,\"unit\":\"s\"},{\"aggregation\":\"max\",\"baseline\":[\"source_slew_1_0:slew_interval_s\",\"source_slew_1_1:slew_interval_s\",\"source_slew_1_2:slew_interval_s\"],\"category\":\"performance\",\"dimension\":\"response\",\"direction\":\"minimize\",\"id\":\"rise_slew_s\",\"normalization\":\"saturating_ratio\",\"observations\":[\"slew_1_0:slew_interval_s\",\"slew_1_1:slew_interval_s\",\"slew_1_2:slew_interval_s\"],\"requirement\":{\"lower\":0,\"rationale\":\"The elapsed output crossing interval has a nonnegative time domain.\"},\"scale\":1e-9,\"unit\":\"s\"}],\"pdk\":\"sky130A\",\"reader\":{\"category\":\"Amplifiers \u0026 RF\",\"summary\":\"Amplifies differential inputs with a 3.3 V rail-to-rail operational amplifier under the declared capacitive loads.\",\"title\":\"SKY130 3.3 V Rail-to-Rail Operational Amplifier\"},\"scoring\":{\"area_metric\":\"functional_area\",\"area_target\":1500,\"method\":\"layout\",\"rationale\":\"The 1500 um2 footprint is a 30 by 50 um integration allocation, independent of the feasibility witness. Core dynamic response carries 45% through the upstream CACE output crossing intervals; loaded unity-gain bandwidth carries 25% and area 30%. DC gain and fixed-bias power remain diagnostics. Source-paired slew intervals retain the upstream unloaded fixture and add the existing 0.1/1 pF application loads. The actual 0.5-to-2.8 V interval is measured directly, avoiding the upstream hard-coded 2 V slew numerator.\",\"weights\":{\"fall_slew_s\":0.225,\"functional_area\":0.3,\"gain_low\":0,\"rise_slew_s\":0.225,\"supply_power\":0,\"unity_hz\":0.25}},\"sections\":{\"Electrical Requirements and Scoring\":\"$12\",\"Inputs and Interface\":\"\u003cp\u003eOrdered ports are \u003ccode\u003evdd out ena vss inp inm\u003c/code\u003e. Declared inputs include \u003ccode\u003eproblem.md\u003c/code\u003e, \u003ccode\u003ematerials/circuit.spice\u003c/code\u003e \u003ccode\u003ematerials/testbench.spice\u003c/code\u003e and \u003ccode\u003ematerials/dynamics.spice\u003c/code\u003e. The runtime provides models and process resources; reference layouts, author code and qualification evidence are maintainer-only materials.\u003c/p\u003e\\n\",\"Objective\":\"\u003cp\u003eImplement \u003ccode\u003esky130_ef_ip__opamp\u003c/code\u003e from the supplied transistor-level circuit, preserving topology, fixed device parameters, four-terminal body connections and the ordered interface. Submit a candidate GDS for electrical evaluation of its distributed RC extraction.\u003c/p\u003e\\n\u003ch3\u003eOptimization objective\u003c/h3\u003e\\n\u003cp\u003eMaximize the declared quality score within the solve budget while satisfying all physical and necessary functional requirements. The first passing DRC, LVS and required electrical checks establish a feasible baseline. Continue improving the scored metrics from that baseline; a passing check or \u003ccode\u003etask_success = true\u003c/code\u003e does not mean that the quality objectives have been achieved.\u003c/p\u003e\\n\",\"Operating Conditions\":\"\u003cp\u003eSupply 3.3 V, enable 1.8 V, input common mode 1.65 V. Use output loads 0.1, 0.5, 1 pF and 100 Mohm resistance; the declared large-inductance/capacitance fixture closes DC feedback and breaks AC feedback. Measure low-frequency gain, unity-gain crossing, phase margin and supply power. 5 pF is outside this task's operating conditions. All electrical experiments use fixed TT models at 27 °C; delivered testbenches define interpolation, edges, loads, sweeps, observation times and power intervals.\u003c/p\u003e\\n\u003cp\u003eDynamic tests reuse the upstream CACE unity-feedback slew apparatus: drive the input from 0 to 3.3 V or back at 100 ns with 0.1 ns edges, and measure the output interval between 0.5 and 2.8 V. Repeat unloaded and with 0.1/1 pF loads. Stop at 10 us with a 2 ns maximum step. The measured interval is used directly rather than the upstream hard-coded 2 V slew numerator; the actual threshold separation is 2.3 V.\u003c/p\u003e\\n\",\"Physical Requirements\":\"\u003cp\u003eSubmit a nonempty GDS no larger than 10485760 bytes, with top cell \u003ccode\u003esky130_ef_ip__opamp\u003c/code\u003e. Functional geometry must fit within the 80 × 100 um envelope on the declared layer set. Pass complete Magic DRC without waivers and independent Netgen LVS checking named ports, models, dimensions, multiplicities and body/contact connections. After physical and geometric checks pass, extract the candidate's distributed interconnect resistance, capacitance and devices, then run every declared experiment.\u003c/p\u003e\\n\",\"Tools and Submission\":\"$13\"},\"source_url\":\"https://github.com/efabless/sky130_ef_ip__opamp/tree/f0eb5cd47112d90fd6d7792ba68e763beacac8e7\",\"status\":\"qualified\",\"title\":\"SKY130 3.3 V Rail-to-Rail Operational Amplifier\",\"core\":false},\"catalog\":{\"tasks\":[],\"runs\":[],\"experiments\":[],\"contexts\":[],\"boards\":[]},\"previewRun\":null,\"preview\":null,\"evidenceError\":false}]}]\nc:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n14:I[27201,[\"/ICLayout-Bench/_next/static/chunks/2h60meymns2z5.js\"],\"IconMark\"]\n9:null\ne:[[\"$\",\"title\",\"0\",{\"children\":\"ICLayout-Bench | Circuit layout intelligence\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Independent evaluation of AI for integrated circuit layout. Compare model scores, explore circuit performance and inspect generated layouts.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/ICLayout-Bench/brand/iclayout-bench.svg\",\"type\":\"image/svg+xml\",\"sizes\":\"any\"}],[\"$\",\"$L14\",\"3\",{}]]\n"])</script></body></html>
