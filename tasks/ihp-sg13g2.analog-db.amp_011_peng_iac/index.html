,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[\"$L6\",[[\"$\",\"script\",\"script-0\",{\"src\":\"/ICLayout-Bench/_next/static/chunks/3_2wwayut9q0b.js\",\"async\":true,\"nonce\":\"$undefined\"}]],[\"$\",\"$L7\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.MetadataOutlet\",\"children\":\"$@9\"}]}]]}],{},null,false,null]},null,false,\"$a\"]},null,false,null],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Lb\",null,{\"children\":\"$Lc\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Ld\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.Metadata\",\"children\":\"$Le\"}]}]}],null]}],false]],\"m\":\"$undefined\",\"G\":[\"$f\",[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/ICLayout-Bench/_next/static/chunks/25phisebeeifo.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]]],\"S\":true,\"h\":null,\"r\":\"$undefined\",\"s\":\"$undefined\",\"a\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"U2oZdoUjWqT_XfcDHuQ5i\"}\n10:I[1186,[\"/ICLayout-Bench/_next/static/chunks/3gll1ekbrh320.js\",\"/ICLayout-Bench/_next/static/chunks/3_2wwayut9q0b.js\"],\"default\"]\na:C\n11:T2c14,\u003ch1 id=\"problem-peng-iac-three-stage-amplifier-layout-task\"\u003ePeng IAC Three-Stage Amplifier Layout Task\u003c/h1\u003e\n\u003ch2 id=\"problem-objective\"\u003eObjective\u003c/h2\u003e\n\u003cp\u003eImplement \u003ccode\u003eamp_011_peng_iac\u003c/code\u003e with the supplied fixed topology and dimensions. The PMOS input pair and cascoded branches feed voutn/voutp. The PMOS bias mirror is cascoded with vb2, generated by XM65/XM63/XM64. XM10 drives net043; XM67/XM68 and XM70 retain the auxiliary current path, with XM69 driving net10 against XM66. XM11/XM23 drive vout. Compensation retains 1.95593 pF between voutp and vout, and 4.33595 pF between net10 and net4 with 1.46466 Mohm from net4 to vss.\nDo not replace the circuit, delete compensation, or add a servo. The physical core\ncontains 505 MOS after expanding explicit upstream multiplicities. Each PMOS\ninput body remains tied to its own tail node through its physical well contact.\u003c/p\u003e\n\u003ch2 id=\"problem-inputs-and-interface\"\u003eInputs and Interface\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003ematerials/circuit.cdl\u003c/code\u003e is the physical authority; \u003ccode\u003ematerials/circuit.spice\u003c/code\u003e is its\nmatching simulator representation. \u003ccode\u003ematerials/testbench.spice\u003c/code\u003e defines closed-loop\nobservations and \u003ccode\u003ematerials/ac.spice\u003c/code\u003e defines balanced differential AC excitation.\nOrdered ports: \u003ccode\u003evss vdd vinn vinp vout vb1\u003c/code\u003e. \u003ccode\u003evss\u003c/code\u003e is ground, \u003ccode\u003evdd\u003c/code\u003e supply,\n\u003ccode\u003evinn/vinp\u003c/code\u003e negative/positive input, \u003ccode\u003evout\u003c/code\u003e the single-ended output, and \u003ccode\u003evb1\u003c/code\u003e\nthe external bias-current sink. Bias, input drivers, feedback wiring and load are\nexternal test apparatus; taps and all internal R/C are physical DUT elements.\u003c/p\u003e\n\u003ch2 id=\"problem-operating-conditions\"\u003eOperating Conditions\u003c/h2\u003e\n\u003cp\u003eIHP SG13G2, nominal TT/typical, 27 C, supply 1.5 V, input reference 0.24 V,\nexternal current sink 7.11568e-07 A to vss, and 10 pF output load. Use the fixed IHP LV binding at 1.5 V, adapting the authored 1.8 V stimulus to the LV process rail; retain its bias current and input reference. Round W/L to 10 nm so half-gate contacts remain on grid.\nThe closed-loop deck ties vinn directly to vout, drives vinp with a +100 mV pulse\nstarting at 2 us (100 ns rise/fall, 18 us high duration), and runs to 40 us with\n2 ns maximum steps, Gear order 2, reltol=1e-5, abstol=1 pA, vntol=10 nV.\nA disconnected timing marker forces exact integration-window endpoints.\nTransient starts from the solved DC point; this is not a zero-state supply-ramp\nstartup test. High and return windows are 15–20 and 35–40 us.\u003c/p\u003e\n\u003cp\u003eAC spans 1 Hz–1 GHz at 200 points/decade. The differential deck retains DC output\nfeedback through a 1 GH inductor and AC-isolates its bias node with 1 kF to ground;\nvinp/vinn receive balanced +0.5/-0.5 V small-signal excitation. It verifies residual\ninput common-mode amplitude \u0026lt;=1 uV and DC feedback mismatch \u0026lt;=1 uV. These are external small-signal bias fixtures,\nnot physical compensation. Both decks use rshunt=1e12 ohm to regularize\notherwise floating extracted nodes; this numerical conductance is applied equally\nto source and candidate and is not a DUT compensation branch. The separate closed-loop deck measures actual follower\nresponse. No voltage-transfer estimate is labeled a loop return ratio.\u003c/p\u003e\n\u003ch2 id=\"problem-physical-requirements\"\u003ePhysical Requirements\u003c/h2\u003e\n\u003cp\u003eSupply a GDS \u0026lt;=64 MiB with top cell \u003ccode\u003eamp_011_peng_iac\u003c/code\u003e, within 20000 by 2000 um\n(the task's artifact-size/outline bounds). Native DRC, strict named-interface LVS\nand functional-area measurement must pass; no marker waivers apply. Preserve\nMOS dimensions, multiplicities, body connections, all physical R/C and tap geometry.\nFunctional layers in the published task include active, implant, wells, gates,\ncontacts, passive plates, vias and routing; annotation/text-only layers are excluded.\nIHP native main and maximal DRC use the pinned PDK block profiles, with chip-level density and antenna disabled. Native MIM and high-poly primitives retain their compact models. Magic idealizes well/substrate taps; source simulation retains the explicit finite tap models. This is not distributed substrate or RF/EM extraction. Candidate-derived Magic distributed RC feeds every post-layout job.\u003c/p\u003e\n\u003ch2 id=\"problem-electrical-requirements-and-scoring\"\u003eElectrical Requirements and Scoring\u003c/h2\u003e\n\u003cp\u003ePhysical checks and declared functional bounds remain mandatory. Quality has no\nfixed allowed-degradation threshold. Each \u003ccode\u003esource_*\u003c/code\u003e job simulates the declared\nsource circuit with exactly the same testbench, model resources, parameters,\nload and measurement window as its paired extracted-candidate job. A source\nobservation is the 100-point electrical baseline; it is independent of the\nsubmitted GDS. All individual pairs are retained in the evaluation report.\u003c/p\u003e\n\u003cp\u003eFor a post-layout observation x and its source observation b:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eMaximize: q = x/b; minimize: q = b/x. When a numerical scale s is declared,\nuse (x+s)/(b+s) or its inverse. This handles zero-valued error measurements;\ns is a normalization floor, not an allowed degradation or pass threshold.\u003c/li\u003e\n\u003cli\u003eAmplitude dB: q = 10^((x-b)/20) for maximize, its inverse for minimize.\u003c/li\u003e\n\u003cli\u003eTarget: q = 1/(1+abs(x-b)/s), with a declared physical scale s. Signed and\nzero-valued operating points are never divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eScoring uses \u003ccode\u003elayout\u003c/code\u003e. A metric uses its worst paired quality q. The score is\nS = 100 * product(q_i ** w_i), including area quality\nq_area = area_reference / candidate_functional_area. The weights below sum to\none. Dimensions describe measurements but do not determine their weights.\nPhysical or functional rejection scores zero; missing or invalid measurements\nproduce an unknown score, including measurements with zero weight.\nSource-equivalent performance at the area reference scores 100; improvements\ncan exceed 100. A weight expresses a tradeoff, not a hard acceptance limit.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eDefinition\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eTreatment\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003egain_db, gain_10khz_db\u003c/td\u003e\n\u003ctd\u003eBalanced differential Vout/(Vinp−Vinn) magnitude at 1 Hz and 10 kHz\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003eResponse, source-paired db20 maximize\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eclosed_gain_10khz_db\u003c/td\u003e\n\u003ctd\u003eActual unity-follower transfer at 10 kHz\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003eResponse target, 6 dB scale\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eoutput_v\u003c/td\u003e\n\u003ctd\u003eDC follower output\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eBias target, 1.5 V scale\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003epower_w\u003c/td\u003e\n\u003ctd\u003eDC power drawn from VDD\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eSupply, inverse ratio, 1 pW floor\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003emean_power_w\u003c/td\u003e\n\u003ctd\u003eMean supply power over 2–40 us\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eSupply, inverse ratio, 1 pW floor\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003elate_error_v, return_error_v\u003c/td\u003e\n\u003ctd\u003eMean absolute tracking error in high/return window\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eResponse, inverse ratio, 1 mV floor\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eripple_v, return_ripple_v\u003c/td\u003e\n\u003ctd\u003eFull output peak-to-peak range in high/return window\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eResponse, inverse ratio, 1 mV floor\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ehigh_v, low_v\u003c/td\u003e\n\u003ctd\u003eWindow means\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eDiagnostic\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ebias_v\u003c/td\u003e\n\u003ctd\u003eExternal bias port DC voltage\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eDiagnostic\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eoutput_min_v, output_max_v\u003c/td\u003e\n\u003ctd\u003eFull-transient extrema\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eDiagnostic\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003edc_feedback_error_v\u003c/td\u003e\n\u003ctd\u003eAbsolute DC voltage across the external feedback inductor\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eMeasurement-validity check, 0–1 uV\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003efixture_cm_max\u003c/td\u003e\n\u003ctd\u003eMaximum residual common-mode AC drive\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eMeasurement-validity check, 0–1 uV\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eAll measurements must be finite and complete. Nonnegative supply power and\nabsolute-error/range values follow their physical domains. The common-mode fixture\nbound verifies the differential excitation, not DUT common-mode regulation. The\nDC feedback bound rejects a failed bias-isolation solve. Both checks fail the\nsource or candidate simulation before scoring. These\nare the only electrical hard bounds; upstream paper targets are not gates.\nWindow errors and ripple do not assert settled operation or periodic steady state.\nNo phase margin, unity crossing, settling time, CMRR, noise, PVT or mismatch is claimed.\u003c/p\u003e\n\u003cp\u003eQuality uses independently simulated same-condition source observations. For gain,\nq=10^((candidate−source)/20); target q=1/(1+abs(candidate−source)/scale);\ninverse-ratio q=(source+floor)/(candidate+floor). The 6 dB target scale corresponds\nto a factor-of-two amplitude change; 1.5 V is the bias normalization and 1 mV is\n1% of the 100 mV test step, preventing numerical zero error from dominating quality.\nArea quality is Q=30926.75 um2/functional_area.\u003c/p\u003e\n\u003cp\u003eThe compact-area anchor is independent of any reference layout: sum\nm*((W+2.4)\u003cem\u003e(L+2.4)+3.2^2) um2 over upstream-bound MOS, add 1.2\u003c/em\u003eC/density\nfor capacitors (density 1.5 fF/um2) and 2*R/sheet_resistance um2\nfor resistor contact/routing envelopes (sheet resistance 1360 ohm),\nthen apply a 50% global routing allowance. This is an engineering estimate, not a\nfoundry minimum. Coefficient 8: Active auxiliary current feedback, cascoded bias, and two interacting compensation paths affect finite-window recovery and frequency response.\u003c/p\u003e\n\u003ch3 id=\"problem-score-weights\"\u003eScore weights\u003c/h3\u003e\n\u003cp\u003eFinite-window amplifier response: tracking error 36%; ripple 22.5%; AC transfer 18%; bias and offset 4.5%; power 9%; area 10%. Each objective's weight is divided equally among its metrics.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003elate_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.180000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ereturn_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.180000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ereturn_ripple_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.112500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eripple_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.112500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eclosed_gain_10khz_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.060000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003egain_10khz_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.060000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003egain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.060000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emean_power_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch2 id=\"problem-tools-and-submission\"\u003eTools and Submission\u003c/h2\u003e\n\u003cp\u003eSolve budget: \u003cstrong\u003e8 hours\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eUse the reviewed IHP SG13G2 resources and the ngspice 45 tools environment.\nThe runtime \u003ccode\u003e/protocol/task.json\u003c/code\u003e supplies frozen requirements and resource bindings.\nSubmit \u003ccode\u003e/workspace/output/final.gds\u003c/code\u003e through the session's explicit submission tool;\nwriting a file alone does not submit it. Evaluation performs artifact, native\nDRC/LVS, geometry, candidate RC, independent source and post-layout simulation.\nThe source baseline, witness and authoring repository are not solver inputs.\u003c/p\u003e\n12:T18cc,\u003cp\u003ePhysical checks and declared functional bounds remain mandatory. Quality has no\nfixed allowed-degradation threshold. Each \u003ccode\u003esource_*\u003c/code\u003e job simulates the declared\nsource circuit with exactly the same testbench, model resources, parameters,\nload and measurement window as its paired extracted-candidate job. A source\nobservation is the 100-point electrical baseline; it is independent of the\nsubmitted GDS. All individual pairs are retained in the evaluation report.\u003c/p\u003e\n\u003cp\u003eFor a post-layout observation x and its source observation b:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eMaximize: q = x/b; minimize: q = b/x. When a numerical scale s is declared,\nuse (x+s)/(b+s) or its inverse. This handles zero-valued error measurements;\ns is a normalization floor, not an allowed degradation or pass threshold.\u003c/li\u003e\n\u003cli\u003eAmplitude dB: q = 10^((x-b)/20) for maximize, its inverse for minimize.\u003c/li\u003e\n\u003cli\u003eTarget: q = 1/(1+abs(x-b)/s), with a declared physical scale s. Signed and\nzero-valued operating points are never divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eScoring uses \u003ccode\u003elayout\u003c/code\u003e. A metric uses its worst paired quality q. The score is\nS = 100 * product(q_i ** w_i), including area quality\nq_area = area_reference / candidate_functional_area. The weights below sum to\none. Dimensions describe measurements but do not determine their weights.\nPhysical or functional rejection scores zero; missing or invalid measurements\nproduce an unknown score, including measurements with zero weight.\nSource-equivalent performance at the area reference scores 100; improvements\ncan exceed 100. A weight expresses a tradeoff, not a hard acceptance limit.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eDefinition\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eTreatment\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003egain_db, gain_10khz_db\u003c/td\u003e\n\u003ctd\u003eBalanced differential Vout/(Vinp−Vinn) magnitude at 1 Hz and 10 kHz\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003eResponse, source-paired db20 maximize\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eclosed_gain_10khz_db\u003c/td\u003e\n\u003ctd\u003eActual unity-follower transfer at 10 kHz\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003eResponse target, 6 dB scale\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eoutput_v\u003c/td\u003e\n\u003ctd\u003eDC follower output\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eBias target, 1.5 V scale\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003epower_w\u003c/td\u003e\n\u003ctd\u003eDC power drawn from VDD\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eSupply, inverse ratio, 1 pW floor\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003emean_power_w\u003c/td\u003e\n\u003ctd\u003eMean supply power over 2–40 us\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eSupply, inverse ratio, 1 pW floor\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003elate_error_v, return_error_v\u003c/td\u003e\n\u003ctd\u003eMean absolute tracking error in high/return window\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eResponse, inverse ratio, 1 mV floor\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eripple_v, return_ripple_v\u003c/td\u003e\n\u003ctd\u003eFull output peak-to-peak range in high/return window\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eResponse, inverse ratio, 1 mV floor\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ehigh_v, low_v\u003c/td\u003e\n\u003ctd\u003eWindow means\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eDiagnostic\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ebias_v\u003c/td\u003e\n\u003ctd\u003eExternal bias port DC voltage\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eDiagnostic\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eoutput_min_v, output_max_v\u003c/td\u003e\n\u003ctd\u003eFull-transient extrema\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eDiagnostic\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003edc_feedback_error_v\u003c/td\u003e\n\u003ctd\u003eAbsolute DC voltage across the external feedback inductor\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eMeasurement-validity check, 0–1 uV\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003efixture_cm_max\u003c/td\u003e\n\u003ctd\u003eMaximum residual common-mode AC drive\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eMeasurement-validity check, 0–1 uV\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eAll measurements must be finite and complete. Nonnegative supply power and\nabsolute-error/range values follow their physical domains. The common-mode fixture\nbound verifies the differential excitation, not DUT common-mode regulation. The\nDC feedback bound rejects a failed bias-isolation solve. Both checks fail the\nsource or candidate simulation before scoring. These\nare the only electrical hard bounds; upstream paper targets are not gates.\nWindow errors and ripple do not assert settled operation or periodic steady state.\nNo phase margin, unity crossing, settling time, CMRR, noise, PVT or mismatch is claimed.\u003c/p\u003e\n\u003cp\u003eQuality uses independently simulated same-condition source observations. For gain,\nq=10^((candidate−source)/20); target q=1/(1+abs(candidate−source)/scale);\ninverse-ratio q=(source+floor)/(candidate+floor). The 6 dB target scale corresponds\nto a factor-of-two amplitude change; 1.5 V is the bias normalization and 1 mV is\n1% of the 100 mV test step, preventing numerical zero error from dominating quality.\nArea quality is Q=30926.75 um2/functional_area.\u003c/p\u003e\n\u003cp\u003eThe compact-area anchor is independent of any reference layout: sum\nm*((W+2.4)\u003cem\u003e(L+2.4)+3.2^2) um2 over upstream-bound MOS, add 1.2\u003c/em\u003eC/density\nfor capacitors (density 1.5 fF/um2) and 2*R/sheet_resistance um2\nfor resistor contact/routing envelopes (sheet resistance 1360 ohm),\nthen apply a 50% global routing allowance. This is an engineering estimate, not a\nfoundry minimum. Coefficient 8: Active auxiliary current feedback, cascoded bias, and two interacting compensation paths affect finite-window recovery and frequency response.\u003c/p\u003e\n\u003ch3\u003eScore weights\u003c/h3\u003e\n\u003cp\u003eFinite-window amplifier response: tracking error 36%; ripple 22.5%; AC transfer 18%; bias and offset 4.5%; power 9%; area 10%. Each objective's weight is divided equally among its metrics.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003elate_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.180000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ereturn_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.180000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ereturn_ripple_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.112500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eripple_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.112500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eclosed_gain_10khz_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.060000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003egain_10khz_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.060000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003egain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.060000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emean_power_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n13:T5f9,\u003cp\u003eIHP SG13G2, nominal TT/typical, 27 C, supply 1.5 V, input reference 0.24 V,\nexternal current sink 7.11568e-07 A to vss, and 10 pF output load. Use the fixed IHP LV binding at 1.5 V, adapting the authored 1.8 V stimulus to the LV process rail; retain its bias current and input reference. Round W/L to 10 nm so half-gate contacts remain on grid.\nThe closed-loop deck ties vinn directly to vout, drives vinp with a +100 mV pulse\nstarting at 2 us (100 ns rise/fall, 18 us high duration), and runs to 40 us with\n2 ns maximum steps, Gear order 2, reltol=1e-5, abstol=1 pA, vntol=10 nV.\nA disconnected timing marker forces exact integration-window endpoints.\nTransient starts from the solved DC point; this is not a zero-state supply-ramp\nstartup test. High and return windows are 15–20 and 35–40 us.\u003c/p\u003e\n\u003cp\u003eAC spans 1 Hz–1 GHz at 200 points/decade. The differential deck retains DC output\nfeedback through a 1 GH inductor and AC-isolates its bias node with 1 kF to ground;\nvinp/vinn receive balanced +0.5/-0.5 V small-signal excitation. It verifies residual\ninput common-mode amplitude \u0026lt;=1 uV and DC feedback mismatch \u0026lt;=1 uV. These are external small-signal bias fixtures,\nnot physical compensation. Both decks use rshunt=1e12 ohm to regularize\notherwise floating extracted nodes; this numerical conductance is applied equally\nto source and candidate and is not a DUT compensation branch. The separate closed-loop deck measures actual follower\nresponse. No voltage-transfer estimate is labeled a loop return ratio.\u003c/p\u003e\n6:[\"$\",\"$8\",null,{\"fallback\":[\"$\",\"p\",null,{\"children\":\"Loading published evidence…\"}],\"children\":[\"$\",\"$L10\",null,{\"task\":{\"case_path\":\"tasks/ihp-sg13g2/analog-db/cases/amp_011_peng_iac/case.toml\",\"coefficient\":8,\"collection\":\"analog-db\",\"configuration_url\":\"/ICLayout-Bench/assets/6a3084040055da18f94c36d2e394ba1614007d8a14df2d9367223caa7eda2e70.txt\",\"description_html\":\"$11\",\"description_path\":\"tasks/ihp-sg13g2/analog-db/cases/amp_011_peng_iac/problem.md\",\"hours\":8,\"id\":\"ihp-sg13g2.analog-db.amp_011_peng_iac\",\"inputs\":{\"description\":{\"format\":\"text\",\"path\":\"problem.md\",\"sha256\":\"1acdb3c35a5135905a79860e97e698982c67baefcc4b3c5ec3933315afb47cf0\"},\"frequency\":{\"format\":\"spice\",\"path\":\"materials/ac.spice\",\"sha256\":\"6db68e956301da79022015fef52f9fb55ed63c30bc43475d3c57fa3f3c552124\"},\"netlist\":{\"format\":\"spice\",\"path\":\"materials/circuit.cdl\",\"sha256\":\"3d202284343734913c74c1436446a7dab16631757da8c617aaae8e6f67a2db15\",\"subcircuit\": oded bias and auxiliary current paths.\",\"title\":\"Peng IAC Three-Stage Amplifier\"},\"schematic_url\":\"/ICLayout-Bench/assets/9abd9baa42deb4d6d0a42d0f0ae435b7d921c72d4d6332b0a0c5ac9a96dec8c2.svg\",\"scoring\":{\"area_metric\":\"functional_area\",\"area_target\":30926.75,\"method\":\"layout\",\"rationale\":\"Finite-window amplifier response: tracking error 36%; ripple 22.5%; AC transfer 18%; bias and offset 4.5%; power 9%; area 10%. Each objective's weight is divided equally among its metrics.\",\"weights\":{\"closed_gain_10khz_db\":0.06,\"functional_area\":0.1,\"gain_10khz_db\":0.06,\"gain_db\":0.06,\"late_error_v\":0.18,\"mean_power_w\":0.045,\"output_v\":0.045,\"power_w\":0.045,\"return_error_v\":0.18,\"return_ripple_v\":0.1125,\"ripple_v\":0.1125}},\"sections\":{\"Electrical Requirements and Scoring\":\"$12\",\"Objective\":\"\u003cp\u003eImplement \u003ccode\u003eamp_011_peng_iac\u003c/code\u003e with the supplied fixed topology and dimensions. The PMOS input pair and cascoded branches feed voutn/voutp. The PMOS bias mirror is cascoded with vb2, generated by XM65/XM63/XM64. XM10 drives net043; XM67/XM68 and XM70 retain the auxiliary current path, with XM69 driving net10 against XM66. XM11/XM23 drive vout. Compensation retains 1.95593 pF between voutp and vout, and 4.33595 pF between net10 and net4 with 1.46466 Mohm from net4 to vss.\\nDo not replace the circuit, delete compensation, or add a servo. The physical core\\ncontains 505 MOS after expanding explicit upstream multiplicities. Each PMOS\\ninput body remains tied to its own tail node through its physical well contact.\u003c/p\u003e\\n\",\"Operating Conditions\":\"$13\",\"Physical Requirements\":\"\u003cp\u003eSupply a GDS \u0026lt;=64 MiB with top cell \u003ccode\u003eamp_011_peng_iac\u003c/code\u003e, within 20000 by 2000 um\\n(the task's artifact-size/outline bounds). Native DRC, strict named-interface LVS\\nand functional-area measurement must pass; no marker waivers apply. Preserve\\nMOS dimensions, multiplicities, body connections, all physical R/C and tap geometry.\\nFunctional layers in the published task include active, implant, wells, gates,\\ncontacts, passive plates, vias and routing; annotation/text-only layers are excluded.\\nIHP native main and maximal DRC use the pinned PDK block profiles, with chip-level density and antenna disabled. Native MIM and high-poly primitives retain their compact models. Magic idealizes well/substrate taps; source simulation retains the explicit finite tap models. This is not distributed substrate or RF/EM extraction. Candidate-derived Magic distributed RC feeds every post-layout job.\u003c/p\u003e\\n\"},\"source_url\":\"https://github.com/MacAnalog/spicexplorer-release/tree/263d0322f8900dc331536fbbe6c0e804514fc454/analog-db/circuits/amp_011_peng_iac\",\"status\":\"qualified\",\"title\":\"Peng IAC Three-Stage Amplifier\"},\"catalog\":{\"boards\":[],\"contexts\":[],\"experiments\":[],\"runs\":[],\"tasks\":[]},\"evidenceError\":false}]}]\nc:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n14:I[27201,[\"/ICLayout-Bench/_next/static/chunks/3gll1ekbrh320.js\"],\"IconMark\"]\n9:null\ne:[[\"$\",\"title\",\"0\",{\"children\":\"ICLayout-Bench | Circuit layout intelligence\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Measured progress in AI-driven integrated circuit layout. Explore circuits, model conditions and reviewed experimental evidence.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/ICLayout-Bench/brand/iclayout-bench.svg\",\"type\":\"image/svg+xml\",\"sizes\":\"any\"}],[\"$\",\"$L14\",\"3\",{}]]\n"])</script></body></html>
