5\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[\"$L6\",[[\"$\",\"script\",\"script-0\",{\"src\":\"/ICLayout-Bench/_next/static/chunks/3_2wwayut9q0b.js\",\"async\":true,\"nonce\":\"$undefined\"}]],[\"$\",\"$L7\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.MetadataOutlet\",\"children\":\"$@9\"}]}]]}],{},null,false,null]},null,false,\"$a\"]},null,false,null],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Lb\",null,{\"children\":\"$Lc\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Ld\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.Metadata\",\"children\":\"$Le\"}]}]}],null]}],false]],\"m\":\"$undefined\",\"G\":[\"$f\",[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/ICLayout-Bench/_next/static/chunks/25phisebeeifo.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]]],\"S\":true,\"h\":null,\"r\":\"$undefined\",\"s\":\"$undefined\",\"a\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"U2oZdoUjWqT_XfcDHuQ5i\"}\n10:I[1186,[\"/ICLayout-Bench/_next/static/chunks/3gll1ekbrh320.js\",\"/ICLayout-Bench/_next/static/chunks/3_2wwayut9q0b.js\"],\"default\"]\na:C\n11:T23c5,\u003ch1 id=\"problem-resistive-feedback-hysteretic-comparator-layout-task\"\u003eResistive-Feedback Hysteretic Comparator Layout Task\u003c/h1\u003e\n\u003ch2 id=\"problem-objective\"\u003eObjective\u003c/h2\u003e\n\u003cp\u003eImplement the fixed \u003ccode\u003ecmp_001_hyst_diffpair\u003c/code\u003e circuit in GF180MCU D and submit self-contained GDS.\nA differential input stage, resistive positive feedback and three output inverters form a hysteretic comparator. Twelve MOS entries expand to 28 physical instances. The physical ppolyf_u_1k resistors are width 2 um: two 600 um feedback devices (300 squares) and one 12 um tail device (6 squares). MOS sizes and multiplicities are retained; ideal resistors become substrate-connected process devices.\u003c/p\u003e\n\u003ch2 id=\"problem-inputs-and-interface\"\u003eInputs and Interface\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003ematerials/circuit.spice\u003c/code\u003e is authoritative for LVS and source calibration;\n\u003ccode\u003ematerials/testbench.spice\u003c/code\u003e defines every electrical measurement. This problem\nis the description input. Ordered ports: \u003ccode\u003evdd vout vinp vinn vss\u003c/code\u003e.\nIn order, these are: Supply, digital output, swept positive input, fixed negative input, and return.\u003c/p\u003e\n\u003cp\u003ePreserve the netlist's device connectivity, dimensions, multiplicities and body\nconnections. Provide physical well/substrate contacts to the declared rails.\nPlacement, routing, splitting and source/drain interchange are permitted only\nwhere accepted by the declared LVS equivalence rules. No common-centroid or\nstatistical matching requirement is scored. Ideal external stimulus, bias and\nload devices remain testbench apparatus and must not be placed inside the DUT.\u003c/p\u003e\n\u003ch2 id=\"problem-operating-conditions\"\u003eOperating Conditions\u003c/h2\u003e\n\u003cp\u003eUse the typical GF180 3.3 V MOS models and physical poly models where present,\nwith statistical variation disabled. Unless swept explicitly, temperature is 27 C.\nVDD = 3.3 V, VSS = 0 V, VINN = 1.65 V. VINP stays at 1.45 V through 0.1 ms, ramps to 1.85 V at 1.1 ms, holds through 1.2 ms, ramps back to 1.45 V at 2.2 ms, then holds through 2.3 ms. Each ramp magnitude is 0.4 V/ms. Evaluate external loads of 1, 5 and 10 pF separately with a 0.2 us transient output step. The transient starts from its DC operating point.\u003c/p\u003e\n\u003ch2 id=\"problem-physical-requirements\"\u003ePhysical Requirements\u003c/h2\u003e\n\u003cp\u003eSubmit top cell \u003ccode\u003ecmp_001_hyst_diffpair\u003c/code\u003e with every named electrical port, resolved hierarchy\nand a file size at most 10 MiB. Artifact, GF180 variant-D DRC including antenna,\nstrict named-port LVS and geometry must pass, without DRC waivers. Chip-level\ndensity and seal-ring closure are outside this standalone-block scope.\u003c/p\u003e\n\u003cp\u003eThe functional bounding box must fit within 1300 by 200 um. Area includes all\nprocess device and routing drawing layers listed in runtime constraints:\nwells, implants, active, poly, contacts, metals/vias and passive/device markers.\nAnnotation and pin-purpose shapes are excluded; all functional routing must use\ndrawing layers. The complete layer list is frozen in \u003ccode\u003e/protocol/task.json\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eThe judge independently extracts distributed wiring resistance and capacitance\nfrom the submitted GDS, retaining candidate-derived MOS/passive geometry and\nexternal body connections. Every scored simulation consumes that extracted DUT.\nThis model boundary does not include a distributed silicon substrate network.\nThresholds include this finite ramp rate and output load. Offset is intentional and is not zero-centered about VINN. Metastability, fast decision delay, startup, noise, statistical offset, PVT and EM are outside scope. Manufacturing signoff is not claimed.\u003c/p\u003e\n\u003ch2 id=\"problem-electrical-requirements-and-scoring\"\u003eElectrical Requirements and Scoring\u003c/h2\u003e\n\u003cp\u003eAll three operating conditions must complete and every observation must be finite\nand meet its inclusive band. Aggregation cannot hide a failing condition;\nmissing crossings or incomplete extraction/simulation cannot establish success.\nSaved waveforms provide the inputs for independently reconstructing observations.\u003c/p\u003e\n\u003cp\u003ePhysical checks and declared functional bounds remain mandatory. Quality has no\nfixed allowed-degradation threshold. Each \u003ccode\u003esource_*\u003c/code\u003e job simulates the declared\nsource circuit with exactly the same testbench, model resources, parameters,\nload and measurement window as its paired extracted-candidate job. A source\nobservation is the 100-point electrical baseline; it is independent of the\nsubmitted GDS. All individual pairs are retained in the evaluation report.\u003c/p\u003e\n\u003cp\u003eFor a post-layout observation x and its source observation b:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eMaximize: q = x/b; minimize: q = b/x. When a numerical scale s is declared,\nuse (x+s)/(b+s) or its inverse. This handles zero-valued error measurements;\ns is a normalization floor, not an allowed degradation or pass threshold.\u003c/li\u003e\n\u003cli\u003eAmplitude dB: q = 10^((x-b)/20) for maximize, its inverse for minimize.\u003c/li\u003e\n\u003cli\u003eTarget: q = 1/(1+abs(x-b)/s), with a declared physical scale s. Signed and\nzero-valued operating points are never divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eScoring uses \u003ccode\u003elayout\u003c/code\u003e. A metric uses its worst paired quality q. The score is\nS = 100 * product(q_i ** w_i), including area quality\nq_area = area_reference / candidate_functional_area. The weights below sum to\none. Dimensions describe measurements but do not determine their weights.\nPhysical or functional rejection scores zero; missing or invalid measurements\nproduce an unknown score, including measurements with zero weight.\nSource-equivalent performance at the area reference scores 100; improvements\ncan exceed 100. A weight expresses a tradeoff, not a hard acceptance limit.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eDefinition / observations\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eQuality rule\u003c/th\u003e\n\u003cth\u003eFunctional bounds\u003c/th\u003e\n\u003cth\u003eScale\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003erising_input\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eInterpolated VINP at the first rising VOUT = 1.65 V crossing\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 3.3\u003c/td\u003e\n\u003ctd\u003e3.3\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efalling_input\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eInterpolated VINP at the first falling VOUT = 1.65 V crossing\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 3.3\u003c/td\u003e\n\u003ctd\u003e3.3\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ehysteresis_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eRising-input threshold minus falling-input threshold\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 3.3\u003c/td\u003e\n\u003ctd\u003e3.3\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emean_power_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTime-average -V(vdd)*I(VDD) over the full 0–2.3 ms transient\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003elow_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMaximum VOUT over 0.02–0.08 ms\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003efunctional check\u003c/td\u003e\n\u003ctd\u003e0 … 0.1\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ehigh_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMinimum VOUT over 1.12–1.18 ms\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003efunctional check\u003c/td\u003e\n\u003ctd\u003e3.2 … 3.31\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eArea reference: \u003cstrong\u003e8386.58 um2\u003c/strong\u003e. 31 expanded device instances; sum of device/contact envelopes 5392.5600 um2, per-side envelope allowance 1 um, 50% routing allowance and total outer width/height allowance 2 um. Estimate = ceil(100 * (1.5 * envelope_sum + 2 * margin * sqrt(envelope_sum) + margin^2)) / 100. Here margin is the total allowance across two opposite sides; the envelope sum is displayed rounded to four decimals. MOS/passive envelopes use declared W/L (or resistor dimensions) and multiplicity; explicit tap areas and HBT emitter/contact envelopes are included. This is a frozen engineering estimate, not a foundry minimum or a feasibility claim.\u003c/p\u003e\n\u003cp\u003eThe capability coefficient remains \u003cstrong\u003e5\u003c/strong\u003e; it is independent of\nthe reference-relative task score.\u003c/p\u003e\n\u003ch3 id=\"problem-score-weights\"\u003eScore weights\u003c/h3\u003e\n\u003cp\u003eHysteretic comparator: switching thresholds 49.5%; hysteresis 27%; supply power 13.5%; area 10%. Each objective's weight is divided equally among its metrics.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efalling_input\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.247500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003erising_input\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.247500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ehysteresis_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.270000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emean_power_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.135000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch2 id=\"problem-tools-and-submission\"\u003eTools and Submission\u003c/h2\u003e\n\u003cp\u003eSolve budget: \u003cstrong\u003e3 hours\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eUse the reviewed GF180 resources listed in \u003ccode\u003e/protocol/resources.json\u003c/code\u003e.\nKLayout checks the layout, Magic extracts RC and ngspice simulates the circuit.\n\u003ccode\u003e/protocol/task.json\u003c/code\u003e provides frozen constraints and evaluation requirements;\n\u003ccode\u003e/protocol/harness.json\u003c/code\u003e describes the harness. If \u003ccode\u003eprocess-feedback\u003c/code\u003e is\nexposed, use its published helper for interim checks. Write\n\u003ccode\u003e/workspace/output/final.gds\u003c/code\u003e, then explicitly submit with\n\u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eUse a GDS database unit of 0.001 um, as required by the GF180MCU DRC deck.\u003c/p\u003e\n12:T128c,\u003cp\u003eAll three operating conditions must complete and every observation must be finite\nand meet its inclusive band. Aggregation cannot hide a failing condition;\nmissing crossings or incomplete extraction/simulation cannot establish success.\nSaved waveforms provide the inputs for independently reconstructing observations.\u003c/p\u003e\n\u003cp\u003ePhysical checks and declared functional bounds remain mandatory. Quality has no\nfixed allowed-degradation threshold. Each \u003ccode\u003esource_*\u003c/code\u003e job simulates the declared\nsource circuit with exactly the same testbench, model resources, parameters,\nload and measurement window as its paired extracted-candidate job. A source\nobservation is the 100-point electrical baseline; it is independent of the\nsubmitted GDS. All individual pairs are retained in the evaluation report.\u003c/p\u003e\n\u003cp\u003eFor a post-layout observation x and its source observation b:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eMaximize: q = x/b; minimize: q = b/x. When a numerical scale s is declared,\nuse (x+s)/(b+s) or its inverse. This handles zero-valued error measurements;\ns is a normalization floor, not an allowed degradation or pass threshold.\u003c/li\u003e\n\u003cli\u003eAmplitude dB: q = 10^((x-b)/20) for maximize, its inverse for minimize.\u003c/li\u003e\n\u003cli\u003eTarget: q = 1/(1+abs(x-b)/s), with a declared physical scale s. Signed and\nzero-valued operating points are never divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eScoring uses \u003ccode\u003elayout\u003c/code\u003e. A metric uses its worst paired quality q. The score is\nS = 100 * product(q_i ** w_i), including area quality\nq_area = area_reference / candidate_functional_area. The weights below sum to\none. Dimensions describe measurements but do not determine their weights.\nPhysical or functional rejection scores zero; missing or invalid measurements\nproduce an unknown score, including measurements with zero weight.\nSource-equivalent performance at the area reference scores 100; improvements\ncan exceed 100. A weight expresses a tradeoff, not a hard acceptance limit.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eDefinition / observations\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eQuality rule\u003c/th\u003e\n\u003cth\u003eFunctional bounds\u003c/th\u003e\n\u003cth\u003eScale\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003erising_input\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eInterpolated VINP at the first rising VOUT = 1.65 V crossing\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 3.3\u003c/td\u003e\n\u003ctd\u003e3.3\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efalling_input\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eInterpolated VINP at the first falling VOUT = 1.65 V crossing\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 3.3\u003c/td\u003e\n\u003ctd\u003e3.3\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ehysteresis_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eRising-input threshold minus falling-input threshold\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 3.3\u003c/td\u003e\n\u003ctd\u003e3.3\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emean_power_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTime-average -V(vdd)*I(VDD) over the full 0–2.3 ms transient\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003elow_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMaximum VOUT over 0.02–0.08 ms\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003efunctional check\u003c/td\u003e\n\u003ctd\u003e0 … 0.1\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ehigh_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMinimum VOUT over 1.12–1.18 ms\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003efunctional check\u003c/td\u003e\n\u003ctd\u003e3.2 … 3.31\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eArea reference: \u003cstrong\u003e8386.58 um2\u003c/strong\u003e. 31 expanded device instances; sum of device/contact envelopes 5392.5600 um2, per-side envelope allowance 1 um, 50% routing allowance and total outer width/height allowance 2 um. Estimate = ceil(100 * (1.5 * envelope_sum + 2 * margin * sqrt(envelope_sum) + margin^2)) / 100. Here margin is the total allowance across two opposite sides; the envelope sum is displayed rounded to four decimals. MOS/passive envelopes use declared W/L (or resistor dimensions) and multiplicity; explicit tap areas and HBT emitter/contact envelopes are included. This is a frozen engineering estimate, not a foundry minimum or a feasibility claim.\u003c/p\u003e\n\u003cp\u003eThe capability coefficient remains \u003cstrong\u003e5\u003c/strong\u003e; it is independent of\nthe reference-relative task score.\u003c/p\u003e\n\u003ch3\u003eScore weights\u003c/h3\u003e\n\u003cp\u003eHysteretic comparator: switching thresholds 49.5%; hysteresis 27%; supply power 13.5%; area 10%. Each objective's weight is divided equally among its metrics.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efalling_input\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.247500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003erising_input\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.247500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ehysteresis_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.270000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emean_power_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.135000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n13:T52d,\u003cp\u003eSubmit top cell \u003ccode\u003ecmp_001_hyst_diffpair\u003c/code\u003e with every named electrical port, resolved hierarchy\nand a file size at most 10 MiB. Artifact, GF180 variant-D DRC including antenna,\nstrict named-port LVS and geometry must pass, without DRC waivers. Chip-level\ndensity and seal-ring closure are outside this standalone-block scope.\u003c/p\u003e\n\u003cp\u003eThe functional bounding box must fit within 1300 by 200 um. Area includes all\nprocess device and routing drawing layers listed in runtime constraints:\nwells, implants, active, poly, contacts, metals/vias and passive/device markers.\nAnnotation and pin-purpose shapes are excluded; all functional routing must use\ndrawing layers. The complete layer list is frozen in \u003ccode\u003e/protocol/task.json\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eThe judge independently extracts distributed wiring resistance and capacitance\nfrom the submitted GDS, retaining candidate-derived MOS/passive geometry and\nexternal body connections. Every scored simulation consumes that extracted DUT.\nThis model boundary does not include a distributed silicon substrate network.\nThresholds include this finite ramp rate and output load. Offset is intentional and is not zero-centered about VINN. Metastability, fast decision delay, startup, noise, statistical offset, PVT and EM are outside scope. Manufacturing signoff is not claimed.\u003c/p\u003e\n6:[\"$\",\"$8\",null,{\"fallback\":[\"$\",\"p\",null,{\"children\":\"Loading published evidence…\"}],\"children\":[\"$\",\"$L10\",null,{\"task\":{\"case_path\":\"tasks/gf180mcuD/analog-db/cases/cmp_001_hyst_diffpair/case.toml\",\"coefficient\":5,\"collection\":\"analog-db\",\"configuration_url\":\"/ICLayout-Bench/assets/bc8505f1bb608ddd79d74f941a65dc7fbf782cfd0ae168173a1b6a8f89d65a84.txt\",\"description_html\":\"$11\",\"description_path\":\"tasks/gf180mcuD/analog-db/cases/cmp_001_hyst_diffpair/problem.md\",\"hours\":3,\"id\":\"gf180mcuD.analog-db.cmp_001_hyst_diffpair\",\"inputs\":{\"description\":{\"format\":\"text\",\"path\":\"problem.md\",\"sha256\":\"123d1face1400587cf10ed8d890ba5480304973b62ba4a5f13311c5f7cd45af2\"},\"netlist\":{\"format\":\"spice\",\"path\":\"materials/circuit.spice\",\"sha256\":\"cdca67d855bfc4b89e55bcd53d1cab7a1c46a2fd78e97f3d1cc7b574c4f1dadd\",\"subcircuit\":\"cmp_001_hyst_diffpair\"},\"performance\":{\"format\":\"spice\",\"path\":\"materials/testbench.spice\",\"sha256\":\"8929bab9abc5e6051a5b8075a2ac1d3d60fdadecec8b3cdec6bb4d0bf93f4bdc\"}},\"licenses\":[{\"name\":\"LICENSE\",\"path\":\"tasks/gf180mcuD/analog-db/LICENSE\",\"url\":\"/ICLayout-Bench/assets/d6c09a4fa902f192f05e697110788e520f294a97446ababab65986137c16fceb.txt\"},{\"name\":\"NOTICE\",\"path\":\"tasks/gf180mcuD/analog-db/NOTICE\",\"url\":\"/ICLayout-Bench/assets/75d61165620fd72b89f65e52c2b6c85b73d410bd293062873390bd20ab820a41.txt\"}],\"materials\":[{\"name\":\"problem.md\",\"role\":\"description\",\"url\":\"/ICLayout-Bench/assets/123d1face1400587cf10ed8d890ba5480304973b62ba4a5f13311c5f7cd45af2.txt\"},{\"name\":\"materials/circuit.spice\",\"role\":\"netlist\",\"url\":\"/ICLayout-Bench/assets/cdca67d855bfc4b89e55bcd53d1cab7a1c46a2fd78e97f3d1cc7b574c4f1dadd.txt\"},{\"name\":\"materials/testbench.spice\",\"role\":\"performance\",\"url\":\"/ICLayout-Bench/assets/8929bab9abc5e6051a5b8075a2ac1d3d60fdadecec8b3cdec6bb4d0bf93f4bdc.txt\"}],\"metrics\":[{\"aggregation\":\"max\",\"category\":\"physical\",\"direction\":\"minimize\",\"id\":\"functional_area\",\"observations\":[\"geometry:area\"],\"unit\":\"um2\"},{\"aggregation\":\"max\",\"baseline\":[\"source_condition_0:rising_input\",\"source_condition_1:rising_input\",\"source_condition_2:rising_input\"],\"category\":\"performance\",\"dimension\":\"response\",\"direction\":\"target\",\"id\":\"rising_input\",\"lower\":0,\"normalization\":\"target\",\"observations\":[\"condition_0:rising_input\",\"condition_1:rising_input\",\"condition_2:rising_input\"],\"scale\":3.3,\"unit\":\"V\",\"upper\":3.3},{\"aggregation\":\"max\",\"baseline\":[\"source_condition_0:falling_input\",\"source_condition_1:falling_input\",\"source_condition_2:falling_input\"],\"category\":\"performance\",\"dimension\":\"response\",\"direction\":\"target\",\"id\":\"falling_input\",\"lower\":0,\"normalization\":\"target\",\"observations\":[\"condition_0:falling_input\",\"condition_1:falling_input\",\"condition_2:falling_input\"],\"scale\":3.3,\"unit\":\"V\",\"upper\":3.3},{\"aggregation\":\"max\",\"baseline\":[\"source_condition_0:hysteresis_v\",\"source_condition_1:hysteresis_v\",\"source_condition_2:hysteresis_v\"],\"category\":\"performance\",\"dimension\":\"response\",\"direction\":\"target\",\"id\":\"hysteresis_v\",\"lower\":0,\"normalization\":\"target\",\"observations\":[\"condition_0:hysteresis_v\",\"condition_1:hysteresis_v\",\"condition_2:hysteresis_v\"],\"scale\":3.3,\"unit\":\"V\",\"upper\":3.3},{\"aggregation\":\"max\",\"baseline\":[\"source_condition_0:mean_power_w\",\"source_condition_1:mean_power_w\",\"source_condition_2:mean_power_w\"],\"category\":\"performance\",\"dimension\":\"supply\",\"direction\":\"minimize\",\"id\":\"mean_power_w\",\"lower\":0,\"normalization\":\"ratio\",\"observations\":[\"condition_0:mean_power_w\",\"condition_1:mean_power_w\",\"condition_2:mean_power_w\"],\"scale\":1e-12,\"unit\":\"W\"},{\"aggregation\":\"max\",\"category\":\"performance\",\"direction\":\"minimize\",\"id\":\"low_v\",\"lower\":0,\"observations\":[\"condition_0:low_v\",\"condition_1:low_v\",\"condition_2:low_v\"],\"unit\":\"V\",\"upper\":0.1},{\"aggregation\":\"max\",\"category\":\"performance\",\"direction\":\"target\",\"id\":\"high_v\",\"lower\":3.2,\"observations\":[\"condition_0:high_v\",\"condition_1:high_v\",\"condition_2:high_v\"],\"unit\":\"V\",\"upper\":3.31}],\"pdk\":\"gf180mcuD\",\"reader\":{\"category\":\"Mixed-signal\",\"summary\":\"Produces distinct rising and falling switching thresholds through resistive hysteresis.\",\"title\":\"Resistive-Feedback Hysteretic Comparator\"},\"schematic_url\":\"/ICLayout-Bench/assets/1fb35b157f7bc6fd76a3ff59344aea63d29f48be2a51127947f026c4cb758ec4.svg\",\"scoring\":{\"area_metric\":\"functional_area\",\"area_target\":8386.58,\"method\":\"layout\",\"rationale\":\"Hysteretic comparator: switching thresholds 49.5%; hysteresis 27%; supply power 13.5%; area 10%. Each objective's weight is divided equally among its metrics.\",\"weights\":{\"falling_input\":0.2475,\"functional_area\":0.1,\"hysteresis_v\":0.27,\"mean_power_w\":0.135,\"rising_input\":0.2475}},\"sections\":{\"Electrical Requirements and Scoring\":\"$12\",\"Objective\":\"\u003cp\u003eImplement the fixed \u003ccode\u003ecmp_001_hyst_diffpair\u003c/code\u003e circuit in GF180MCU D and submit self-contained GDS.\\nA differential input stage, resistive positive feedback and three output inverters form a hysteretic comparator. Twelve MOS entries expand to 28 physical instances. The physical ppolyf_u_1k resistors are width 2 um: two 600 um feedback devices (300 squares) and one 12 um tail device (6 squares). MOS sizes and multiplicities are retained; ideal resistors become substrate-connected process devices.\u003c/p\u003e\\n\",\"Operating Conditions\":\"\u003cp\u003eUse the typical GF180 3.3 V MOS models and physical poly models where present,\\nwith statistical variation disabled. Unless swept explicitly, temperature is 27 C.\\nVDD = 3.3 V, VSS = 0 V, VINN = 1.65 V. VINP stays at 1.45 V through 0.1 ms, ramps to 1.85 V at 1.1 ms, holds through 1.2 ms, ramps back to 1.45 V at 2.2 ms, then holds through 2.3 ms. Each ramp magnitude is 0.4 V/ms. Evaluate external loads of 1, 5 and 10 pF separately with a 0.2 us transient output step. The transient starts from its DC operating point.\u003c/p\u003e\\n\",\"Physical Requirements\":\"$13\"},\"source_url\":\"https://github.com/MacAnalog/spicexplorer-release/tree/263d0322f8900dc331536fbbe6c0e804514fc454/analog-db/circuits/cmp_001_hyst_diffpair\",\"status\":\"qualified\",\"title\":\"Resistive-Feedback Hysteretic Comparator\"},\"catalog\":{\"boards\":[],\"contexts\":[],\"experiments\":[],\"runs\":[],\"tasks\":[]},\"evidenceError\":false}]}]\nc:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n14:I[27201,[\"/ICLayout-Bench/_next/static/chunks/3gll1ekbrh320.js\"],\"IconMark\"]\n9:null\ne:[[\"$\",\"title\",\"0\",{\"children\":\"ICLayout-Bench | Circuit layout intelligence\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Measured progress in AI-driven integrated circuit layout. Explore circuits, model conditions and reviewed experimental evidence.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/ICLayout-Bench/brand/iclayout-bench.svg\",\"type\":\"image/svg+xml\",\"sizes\":\"any\"}],[\"$\",\"$L14\",\"3\",{}]]\n"])</script></body></html>
