"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L5\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[\"$L6\",[[\"$\",\"script\",\"script-0\",{\"src\":\"/ICLayout-Bench/_next/static/chunks/27jip_2vcvnd5.js\",\"async\":true,\"nonce\":\"$undefined\"}]],[\"$\",\"$L7\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.MetadataOutlet\",\"children\":\"$@9\"}]}]]}],{},null,false,null]},null,false,\"$a\"]},null,false,null],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Lb\",null,{\"children\":\"$Lc\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Ld\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.Metadata\",\"children\":\"$Le\"}]}]}],null]}],false]],\"m\":\"$undefined\",\"G\":[\"$f\",[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/ICLayout-Bench/_next/static/chunks/3sa54_ghi1h2h.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]]],\"S\":true,\"h\":null,\"r\":\"$undefined\",\"s\":\"$undefined\",\"a\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"2hqB741EA4j7xWQVg6hu-\"}\n10:I[1186,[\"/ICLayout-Bench/_next/static/chunks/2h60meymns2z5.js\",\"/ICLayout-Bench/_next/static/chunks/27jip_2vcvnd5.js\"],\"default\"]\na:C\n11:T3f93,\u003ch1 id=\"problem-eight-bit-r-2r-dac-core-layout-task\"\u003eEight-Bit R-2R DAC Core Layout Task\u003c/h1\u003e\n\u003ch2 id=\"problem-objective\"\u003eObjective\u003c/h2\u003e\n\u003cp\u003eImplement \u003ccode\u003er2r\u003c/code\u003e in GF180MCU variant D while preserving the supplied circuit, device dimensions and ordered interface. Eight-bit passive voltage conversion with ideal external bit drivers and a 1 pF output load; ten transient codes plus the complete static 256-code transfer.\u003c/p\u003e\n\u003ch3 id=\"problem-optimization-objective\"\u003eOptimization objective\u003c/h3\u003e\n\u003cp\u003eMaximize the declared quality score within the solve budget while satisfying all physical and necessary functional requirements. The first passing DRC, LVS and required electrical checks establish a feasible baseline. Continue improving the scored metrics from that baseline; a passing check or \u003ccode\u003etask_success = true\u003c/code\u003e does not mean that the quality objectives have been achieved.\u003c/p\u003e\n\u003ch2 id=\"problem-inputs-and-interface\"\u003eInputs and Interface\u003c/h2\u003e\n\u003cp\u003eInputs are this description, \u003ccode\u003ematerials/circuit.spice\u003c/code\u003e (the authoritative circuit) and \u003ccode\u003ematerials/testbench.spice\u003c/code\u003e (stimuli and measurements). Runtime task metadata supplies consistent frozen constraints, evaluation conditions and output declarations.\u003c/p\u003e\n\u003cp\u003eOrdered subcircuit and GDS interface: \u003ccode\u003eb7, b1, b0, b2, b3, b4, b5, b6, out, VGND\u003c/code\u003e.\nb0–b7: ideal-driver bit inputs (b0 is LSB); out: analog output; VGND: substrate and ladder return.\u003c/p\u003e\n\u003cp\u003ePreserve topology, total device widths, channel lengths, multiplicities, resistor dimensions and body connections. Equivalent hierarchy, diffusion sharing and parallel fingers are allowed when connectivity and electrical checks pass; preserve source models and dimensions without idealizing internal devices. Retain dummy devices even when all their terminals are shorted.\u003c/p\u003e\n\u003ch2 id=\"problem-operating-conditions\"\u003eOperating Conditions\u003c/h2\u003e\n\u003cp\u003eUse 3.3 V bit-driver levels and 27 C, with 1 pF from out to VGND. For the two late transient accuracy samples, evaluate codes 0, 1, 2, 4, 8, 16, 32, 64, 128 and 255 separately. bit0 is the least significant bit. Each bit starts at 0 V and changes from 10 ns to 10.1 ns to 3.3\u003cem\u003ebitN V. Simulate through 2 us with a 1 ns requested step. The expected settled voltage is 3.3\u003c/em\u003ecode/256 V. Separately, a single static DC sweep maps codes 0 through 255 in 1-code steps to ideal 0/3.3 V bit levels and measures the complete settled transfer. This static sweep has no input transitions and makes no dynamic code-glitch claim. The external drivers and load are testbench components, outside the required passive circuit.\u003c/p\u003e\n\u003cp\u003eUse reviewed typical primitive models with statistical variation disabled. Numerical parameters from runtime simulation jobs generate the testbench's \u003ccode\u003eparameters.spice\u003c/code\u003e; interpolation and detailed PWL follow the delivered deck. Scope is limited to nominal compact-model conditions, excluding temperature/process corners, mismatch yield, noise, RF/EM and full-chip density closure.\u003c/p\u003e\n\u003ch2 id=\"problem-physical-requirements\"\u003ePhysical Requirements\u003c/h2\u003e\n\u003cp\u003eSubmit a nonempty GDS with top cell \u003ccode\u003er2r\u003c/code\u003e, no larger than 10485760 bytes. The functional bounding box must fit within 200 × 200 um and includes relevant device and routing polygons, implants/wells, passive markers, contacts, vias and dummy routing. The complete layer/datatype set is:\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003e[[5,0],[11,17],[11,39],[12,0],[13,17],[21,0],[22,0],[22,4],[24,0],[24,5],[30,0],[30,4],[31,0],[32,0],[33,0],[34,0],[34,3],[34,4],[34,5],[35,0],[36,0],[36,3],[36,4],[36,5],[37,0],[38,0],[40,0],[41,0],[42,0],[42,3],[42,4],[42,5],[46,0],[46,3],[46,4],[46,5],[49,0],[53,0],[53,3],[53,4],[53,5],[55,0],[62,0],[75,0],[80,5],[81,0],[81,3],[81,4],[81,5],[82,0],[86,17],[88,17],[96,1],[100,5],[100,7],[100,8],[108,5],[110,5],[110,11],[110,12],[110,13],[110,14],[110,15],[110,16],[111,5],[112,1],[115,5],[116,5],[117,5],[117,10],[118,5],[119,5],[122,5],[123,5],[124,5],[125,5],[127,5],[128,17],[137,5],[151,5],[152,5],[153,51],[166,5],[167,5],[173,5],[178,0],[183,0],[184,0],[185,0],[204,0],[210,0],[220,0],[226,0],[227,0],[241,0]]\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eArea excludes text and nonfunctional boundary layers 0/0 and 63/0; functional geometry must remain on functional layers. Pass the fixed GF180 D FEOL, BEOL, connectivity, grid and antenna checks without waivers. Use five metal layers, the 1.1 um top-metal option and the 1 kOhm/square high-resistance poly option. Chip density and seal-ring closure belong to higher-level integration.\u003c/p\u003e\n\u003cp\u003eLVS checks topology, dimensions, body terminals and all named top-level ports, case-insensitively. Physically implement supply and substrate/well contacts; do not short different nets through adjoining silicided diffusion. After validity and geometric checks pass, extract candidate devices and distributed interconnect RC, then simulate the extracted circuit. The substrate model is one equipotential body region with explicit well/body contacts, rather than a distributed silicon-substrate network. Unreliable extraction, missing ports or incomplete measurements cannot establish success.\u003c/p\u003e\n\u003ch2 id=\"problem-electrical-requirements-and-scoring\"\u003eElectrical Requirements and Scoring\u003c/h2\u003e\n\u003cp\u003eArtifact, geometry, DRC, LVS and declared functional requirements must pass. Parasitic extraction is also mandatory: it must produce a complete, electrically consistent netlist usable by the required post-layout simulations. A completed candidate rejection scores zero; infrastructure errors do not establish candidate failure.\u003c/p\u003e\n\u003cp\u003eFor \u003ccode\u003elayout\u003c/code\u003e scoring, cap every positively weighted raw quality at 1 before aggregation; the score ranges from 0 to 100. Reaching every weighted target scores 100, and no minimum score is required for validity.\u003c/p\u003e\n\u003cp\u003ePhysical checks and the declared functional bounds must pass. Quality scoring imposes no fixed degradation allowance. Each \u003ccode\u003esource_*\u003c/code\u003e job and its corresponding candidate extracted circuit use exactly the same testbench, model resources, parameters, loads and measurement windows. Independent source observations remain required evidence. The explicit quality targets below supply scoring anchors; otherwise the paired source value is used. Reports retain every paired result.\u003c/p\u003e\n\u003cp\u003eLet x be the post-layout measurement and b the declared quality target, or the same-condition source measurement when no target is declared:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eRatio normalization: maximize with q = x/b and minimize with q = b/x. When a numerical scale s is declared, use (x+s)/(b+s) and its reciprocal, respectively. The scale handles zero values as a normalization floor; it is neither an allowed degradation nor an acceptance bound.\u003c/li\u003e\n\u003cli\u003eAmplitude in dB: maximize with q = 10^((x-b)/20) and minimize with its reciprocal.\u003c/li\u003e\n\u003cli\u003eTarget normalization: q = 1/(1+abs(x-b)/s), where s is the declared physical scale. Signed or zero-valued operating points are not divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eUse \u003ccode\u003elayout\u003c/code\u003e scoring. First compute each metric's raw quality q from the worst paired condition, with raw area quality q_area = area_target / candidate_functional_area. Credit c_i = min(1, q_i) for every positively weighted metric, then compute S = 100 * product(c_i ** w_i). The weights sum to 1 and the score is bounded by 100. An improvement beyond one target cannot compensate for missing another target. Physical, extraction, or functional rejection scores zero; other missing or invalid measurements leave the score unknown, and zero-weight observations must also be valid. Reaching every positively weighted target scores 100; a feasible reference may score far below 100. Weights express quality tradeoffs, not acceptance bounds.\u003c/p\u003e\n\u003cp\u003eFor metrics declaring \u003ccode\u003esaturating_ratio\u003c/code\u003e, q = 2(b+s)/(b+x+2*s), using the quality anchor b and the positive scale s in the metric’s units. Equality to the anchor gives raw quality 1; improvements approach raw quality 2 but credited quality stays at 1. Normalize each condition before selecting the worst quality. These scales and targets do not add acceptance cutoffs.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eDefinition / observation\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eQuality normalization\u003c/th\u003e\n\u003cth\u003eFunctional range\u003c/th\u003e\n\u003cth\u003eScale\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eaccuracy\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAbsolute difference between output at 1.9 us and 3.3*code/256, checked independently for each declared code.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e5e-07\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003einl_lsb\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMaximum absolute endpoint INL over codes 0–255, relative to the line through codes 0 and 255 and normalized by the 3.3/256 V ideal LSB.\u003c/td\u003e\n\u003ctd\u003eLSB\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-05\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ednl_lsb\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMaximum absolute deviation of each adjacent static code step from the 3.3/256 V ideal LSB.\u003c/td\u003e\n\u003ctd\u003eLSB\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-05\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emonotonicity\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMinimum adjacent static code step over the 256-code sweep.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003emaximize, unscored functional gate\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003esettling\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAbsolute difference between output at 1 us and 3.3*code/256 after the 10 ns input transition.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eThe capability coefficient is \u003cstrong\u003e4\u003c/strong\u003e, independent of this task's reference-normalized score.\u003c/p\u003e\n\u003ch3 id=\"problem-quality-targets-and-weights\"\u003eQuality targets and weights\u003c/h3\u003e\n\u003cp\u003eThe area quality target is \u003cstrong\u003e4000 um2\u003c/strong\u003e, independent of the current feasibility witness. It is not a hard area limit or a process minimum.\u003c/p\u003e\n\u003cp\u003eThe 4000 um2 footprint challenges the physical ladder and routing. Area carries 40%, INL 25%, DNL 20% and late-sample absolute accuracy 15%. The 1 uV absolute-error goal stays above the unchanged transient source residual of approximately 0.375 uV. The 0.00002 LSB INL and DNL goals each allocate approximately 0.258 uV to static differential routing error, well above the approximately 2e-12 LSB source sweep residual. Their scales are 0.5 uV and 0.00001 LSB, respectively, so small parasitic errors remain distinguishable. The metric named settling is a second late absolute-error sample at 1 us, while accuracy samples at 1.9 us; it retains zero weight to avoid counting the same equilibrium error twice. These are deterministic nominal-model goals, not a claim of mismatch yield, dynamic glitch suppression or measured settling time.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eQuality anchor\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eScale\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e4000\u003c/td\u003e\n\u003ctd\u003eum2\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.4\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eaccuracy\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e5e-07\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.15\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003einl_lsb\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e2e-05\u003c/td\u003e\n\u003ctd\u003eLSB\u003c/td\u003e\n\u003ctd\u003e1e-05\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.25\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ednl_lsb\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e2e-05\u003c/td\u003e\n\u003ctd\u003eLSB\u003c/td\u003e\n\u003ctd\u003e1e-05\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.2\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eZero-weight paired diagnostics: \u003ccode\u003esettling\u003c/code\u003e. All unweighted measurements and functional requirements remain checked.\u003c/p\u003e\n\u003cp\u003eThe targets above affect continuous quality only. A complete feasible reference is allowed to miss them; there is no minimum qualifying score.\u003c/p\u003e\n\u003ch2 id=\"problem-tools-and-submission\"\u003eTools and Submission\u003c/h2\u003e\n\u003cp\u003eSoft solve budget: \u003cstrong\u003e1 hour\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eRead \u003ccode\u003e/protocol/task.json\u003c/code\u003e for input/output paths, constraints and the \u003ccode\u003eresources\u003c/code\u003e object; \u003ccode\u003e/protocol/harness.json\u003c/code\u003e describes the active check and submission interface.\u003c/p\u003e\n\u003cp\u003eDiscover inputs and reviewed GF180 resources through the runtime task, resource and submission protocols. Trusted feedback executes the declared physical and post-layout evaluation; source simulation only assists design. Write the final GDS to \u003ccode\u003e/workspace/output/final.gds\u003c/code\u003e and explicitly submit through the runtime protocol. File generation or a successful standalone simulation alone does not complete the task.\u003c/p\u003e\n\u003cp\u003eUse a GDS database unit of 0.001 um as required by GF180MCU DRC rules.\u003c/p\u003e\n\u003ch3 id=\"problem-solve-workflow\"\u003eSolve workflow\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eRead the declared circuit and materials, \u003ccode\u003e/protocol/task.json\u003c/code\u003e for paths, constraints and reviewed resources, and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e for capabilities and helper commands. Task inputs under \u003ccode\u003e/task\u003c/code\u003e and resources under \u003ccode\u003e/resources\u003c/code\u003e are read-only; construct the layout in \u003ccode\u003e/workspace\u003c/code\u003e with the declared tools. With layout MCP, paths and commands refer to the remote EDA workspace. Create your own implementation with real devices, interconnect and pins, using your own tool loop without delegating to other agents; reference layouts and author code are not solver inputs.\u003c/li\u003e\n\u003cli\u003eInspect \u003ccode\u003eresources.external\u003c/code\u003e before using external tools. Each command starts a fresh shell: when tool modules are declared, source \u003ccode\u003e/usr/share/Modules/init/bash\u003c/code\u003e and load the selected tool's modules; export its declared \u003ccode\u003etool_environment\u003c/code\u003e settings in that same command. Repeat as needed and use batch or headless operation. Local manuals, command references, and release notes may be available within the declared EDA installation and PDK resource directories. Locate these resources through \u003ccode\u003e/protocol/task.json\u003c/code\u003e and consult the documentation for the installed tool version when diagnosing unfamiliar syntax or tool failures.\u003c/li\u003e\n\u003cli\u003eGenerate an initial candidate and submit a snapshot early. When \u003ccode\u003eprocess-feedback\u003c/code\u003e is available, check the current GDS with layout MCP \u003ccode\u003echeck\u003c/code\u003e or \u003ccode\u003epython -I /protocol/process_check.py\u003c/code\u003e before the final submission. This runs the final evaluator's complete plan and returns engineering diagnostics and candidate measurements, without scores or normalized quality factors. Checks have no count limit and consume the same wall-clock budget. Inspect the physical and functional results and all scored metrics; successful tool execution alone does not establish requirement satisfaction. Read paginated diagnostics with \u003ccode\u003ereport\u003c/code\u003e when using MCP. Local exploratory checks do not replace this complete check.\u003c/li\u003e\n\u003cli\u003eUse the remaining time for measured improvements to the declared quality objectives. Identify the limiting scored metrics, make targeted layout changes, regenerate and check the candidate, and compare measurements with the previous candidate and the stated scoring targets and trade-offs. Preserve the best valid candidate and revert changes that worsen the overall objective. Repeat while time and useful improvements remain; passing validity checks alone is not a stopping condition.\u003c/li\u003e\n\u003cli\u003eStop optimization when the budget expires, all declared quality objectives are achieved, or measured trials support convergence. If stopping early, explain the changes tried, the metric comparisons and the remaining limitations. Track remaining time through session status. At soft-budget expiry, finish or cancel already-started work and submit immediately; do not start another command, check or optimization round. If an MCP execution is running, use \u003ccode\u003epoll\u003c/code\u003e with its \u003ccode\u003eexecution_id\u003c/code\u003e and the returned \u003ccode\u003enext_offset\u003c/code\u003e as \u003ccode\u003eoffset\u003c/code\u003e until completion, or cancel it and wait for it to stop.\u003c/li\u003e\n\u003cli\u003eFinish or cancel outstanding work, restore your best candidate to the declared output path, and explicitly submit it before ending the session. With layout MCP \u003ccode\u003esubmit\u003c/code\u003e, remove the \u003ccode\u003e/workspace/\u003c/code\u003e prefix from \u003ccode\u003eoutput.path\u003c/code\u003e; with the container interface, run \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e. Wait for the receipt: only the last accepted snapshot is judged, and writing a file alone is not submission. Acceptance confirms delivery; the framework independently evaluates validity and quality after the session.\u003c/li\u003e\n\u003c/ol\u003e\n12:T18e2,\u003cp\u003eArtifact, geometry, DRC, LVS and declared functional requirements must pass. Parasitic extraction is also mandatory: it must produce a complete, electrically consistent netlist usable by the required post-layout simulations. A completed candidate rejection scores zero; infrastructure errors do not establish candidate failure.\u003c/p\u003e\n\u003cp\u003eFor \u003ccode\u003elayout\u003c/code\u003e scoring, cap every positively weighted raw quality at 1 before aggregation; the score ranges from 0 to 100. Reaching every weighted target scores 100, and no minimum score is required for validity.\u003c/p\u003e\n\u003cp\u003ePhysical checks and the declared functional bounds must pass. Quality scoring imposes no fixed degradation allowance. Each \u003ccode\u003esource_*\u003c/code\u003e job and its corresponding candidate extracted circuit use exactly the same testbench, model resources, parameters, loads and measurement windows. Independent source observations remain required evidence. The explicit quality targets below supply scoring anchors; otherwise the paired source value is used. Reports retain every paired result.\u003c/p\u003e\n\u003cp\u003eLet x be the post-layout measurement and b the declared quality target, or the same-condition source measurement when no target is declared:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eRatio normalization: maximize with q = x/b and minimize with q = b/x. When a numerical scale s is declared, use (x+s)/(b+s) and its reciprocal, respectively. The scale handles zero values as a normalization floor; it is neither an allowed degradation nor an acceptance bound.\u003c/li\u003e\n\u003cli\u003eAmplitude in dB: maximize with q = 10^((x-b)/20) and minimize with its reciprocal.\u003c/li\u003e\n\u003cli\u003eTarget normalization: q = 1/(1+abs(x-b)/s), where s is the declared physical scale. Signed or zero-valued operating points are not divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eUse \u003ccode\u003elayout\u003c/code\u003e scoring. First compute each metric's raw quality q from the worst paired condition, with raw area quality q_area = area_target / candidate_functional_area. Credit c_i = min(1, q_i) for every positively weighted metric, then compute S = 100 * product(c_i ** w_i). The weights sum to 1 and the score is bounded by 100. An improvement beyond one target cannot compensate for missing another target. Physical, extraction, or functional rejection scores zero; other missing or invalid measurements leave the score unknown, and zero-weight observations must also be valid. Reaching every positively weighted target scores 100; a feasible reference may score far below 100. Weights express quality tradeoffs, not acceptance bounds.\u003c/p\u003e\n\u003cp\u003eFor metrics declaring \u003ccode\u003esaturating_ratio\u003c/code\u003e, q = 2(b+s)/(b+x+2*s), using the quality anchor b and the positive scale s in the metric’s units. Equality to the anchor gives raw quality 1; improvements approach raw quality 2 but credited quality stays at 1. Normalize each condition before selecting the worst quality. These scales and targets do not add acceptance cutoffs.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eDefinition / observation\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eQuality normalization\u003c/th\u003e\n\u003cth\u003eFunctional range\u003c/th\u003e\n\u003cth\u003eScale\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eaccuracy\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAbsolute difference between output at 1.9 us and 3.3*code/256, checked independently for each declared code.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e5e-07\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003einl_lsb\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMaximum absolute endpoint INL over codes 0–255, relative to the line through codes 0 and 255 and normalized by the 3.3/256 V ideal LSB.\u003c/td\u003e\n\u003ctd\u003eLSB\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-05\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ednl_lsb\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMaximum absolute deviation of each adjacent static code step from the 3.3/256 V ideal LSB.\u003c/td\u003e\n\u003ctd\u003eLSB\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-05\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emonotonicity\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMinimum adjacent static code step over the 256-code sweep.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003emaximize, unscored functional gate\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003esettling\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAbsolute difference between output at 1 us and 3.3*code/256 after the 10 ns input transition.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eThe capability coefficient is \u003cstrong\u003e4\u003c/strong\u003e, independent of this task's reference-normalized score.\u003c/p\u003e\n\u003ch3\u003eQuality targets and weights\u003c/h3\u003e\n\u003cp\u003eThe area quality target is \u003cstrong\u003e4000 um2\u003c/strong\u003e, independent of the current feasibility witness. It is not a hard area limit or a process minimum.\u003c/p\u003e\n\u003cp\u003eThe 4000 um2 footprint challenges the physical ladder and routing. Area carries 40%, INL 25%, DNL 20% and late-sample absolute accuracy 15%. The 1 uV absolute-error goal stays above the unchanged transient source residual of approximately 0.375 uV. The 0.00002 LSB INL and DNL goals each allocate approximately 0.258 uV to static differential routing error, well above the approximately 2e-12 LSB source sweep residual. Their scales are 0.5 uV and 0.00001 LSB, respectively, so small parasitic errors remain distinguishable. The metric named settling is a second late absolute-error sample at 1 us, while accuracy samples at 1.9 us; it retains zero weight to avoid counting the same equilibrium error twice. These are deterministic nominal-model goals, not a claim of mismatch yield, dynamic glitch suppression or measured settling time.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eQuality anchor\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eScale\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e4000\u003c/td\u003e\n\u003ctd\u003eum2\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.4\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eaccuracy\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e5e-07\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.15\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003einl_lsb\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e2e-05\u003c/td\u003e\n\u003ctd\u003eLSB\u003c/td\u003e\n\u003ctd\u003e1e-05\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.25\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ednl_lsb\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e2e-05\u003c/td\u003e\n\u003ctd\u003eLSB\u003c/td\u003e\n\u003ctd\u003e1e-05\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.2\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eZero-weight paired diagnostics: \u003ccode\u003esettling\u003c/code\u003e. All unweighted measurements and functional requirements remain checked.\u003c/p\u003e\n\u003cp\u003eThe targets above affect continuous quality only. A complete feasible reference is allowed to miss them; there is no minimum qualifying score.\u003c/p\u003e\n13:T462,\u003cp\u003eUse 3.3 V bit-driver levels and 27 C, with 1 pF from out to VGND. For the two late transient accuracy samples, evaluate codes 0, 1, 2, 4, 8, 16, 32, 64, 128 and 255 separately. bit0 is the least significant bit. Each bit starts at 0 V and changes from 10 ns to 10.1 ns to 3.3\u003cem\u003ebitN V. Simulate through 2 us with a 1 ns requested step. The expected settled voltage is 3.3\u003c/em\u003ecode/256 V. Separately, a single static DC sweep maps codes 0 through 255 in 1-code steps to ideal 0/3.3 V bit levels and measures the complete settled transfer. This static sweep has no input transitions and makes no dynamic code-glitch claim. The external drivers and load are testbench components, outside the required passive circuit.\u003c/p\u003e\n\u003cp\u003eUse reviewed typical primitive models with statistical variation disabled. Numerical parameters from runtime simulation jobs generate the testbench's \u003ccode\u003eparameters.spice\u003c/code\u003e; interpolation and detailed PWL follow the delivered deck. Scope is limited to nominal compact-model conditions, excluding temperature/process corners, mismatch yield, noise, RF/EM and full-chip density closure.\u003c/p\u003e\n14:T7f4,\u003cp\u003eSubmit a nonempty GDS with top cell \u003ccode\u003er2r\u003c/code\u003e, no larger than 10485760 bytes. The functional bounding box must fit within 200 × 200 um and includes relevant device and routing polygons, implants/wells, passive markers, contacts, vias and dummy routing. The complete layer/datatype set is:\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003e[[5,0],[11,17],[11,39],[12,0],[13,17],[21,0],[22,0],[22,4],[24,0],[24,5],[30,0],[30,4],[31,0],[32,0],[33,0],[34,0],[34,3],[34,4],[34,5],[35,0],[36,0],[36,3],[36,4],[36,5],[37,0],[38,0],[40,0],[41,0],[42,0],[42,3],[42,4],[42,5],[46,0],[46,3],[46,4],[46,5],[49,0],[53,0],[53,3],[53,4],[53,5],[55,0],[62,0],[75,0],[80,5],[81,0],[81,3],[81,4],[81,5],[82,0],[86,17],[88,17],[96,1],[100,5],[100,7],[100,8],[108,5],[110,5],[110,11],[110,12],[110,13],[110,14],[110,15],[110,16],[111,5],[112,1],[115,5],[116,5],[117,5],[117,10],[118,5],[119,5],[122,5],[123,5],[124,5],[125,5],[127,5],[128,17],[137,5],[151,5],[152,5],[153,51],[166,5],[167,5],[173,5],[178,0],[183,0],[184,0],[185,0],[204,0],[210,0],[220,0],[226,0],[227,0],[241,0]]\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eArea excludes text and nonfunctional boundary layers 0/0 and 63/0; functional geometry must remain on functional layers. Pass the fixed GF180 D FEOL, BEOL, connectivity, grid and antenna checks without waivers. Use five metal layers, the 1.1 um top-metal option and the 1 kOhm/square high-resistance poly option. Chip density and seal-ring closure belong to higher-level integration.\u003c/p\u003e\n\u003cp\u003eLVS checks topology, dimensions, body terminals and all named top-level ports, case-insensitively. Physically implement supply and substrate/well contacts; do not short different nets through adjoining silicided diffusion. After validity and geometric checks pass, extract candidate devices and distributed interconnect RC, then simulate the extracted circuit. The substrate model is one equipotential body region with explicit well/body contacts, rather than a distributed silicon-substrate network. Unreliable extraction, missing ports or incomplete measurements cannot establish success.\u003c/p\u003e\n15:T11d9,\u003cp\u003eSoft solve budget: \u003cstrong\u003e1 hour\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eRead \u003ccode\u003e/protocol/task.json\u003c/code\u003e for input/output paths, constraints and the \u003ccode\u003eresources\u003c/code\u003e object; \u003ccode\u003e/protocol/harness.json\u003c/code\u003e describes the active check and submission interface.\u003c/p\u003e\n\u003cp\u003eDiscover inputs and reviewed GF180 resources through the runtime task, resource and submission protocols. Trusted feedback executes the declared physical and post-layout evaluation; source simulation only assists design. Write the final GDS to \u003ccode\u003e/workspace/output/final.gds\u003c/code\u003e and explicitly submit through the runtime protocol. File generation or a successful standalone simulation alone does not complete the task.\u003c/p\u003e\n\u003cp\u003eUse a GDS database unit of 0.001 um as required by GF180MCU DRC rules.\u003c/p\u003e\n\u003ch3\u003eSolve workflow\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eRead the declared circuit and materials, \u003ccode\u003e/protocol/task.json\u003c/code\u003e for paths, constraints and reviewed resources, and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e for capabilities and helper commands. Task inputs under \u003ccode\u003e/task\u003c/code\u003e and resources under \u003ccode\u003e/resources\u003c/code\u003e are read-only; construct the layout in \u003ccode\u003e/workspace\u003c/code\u003e with the declared tools. With layout MCP, paths and commands refer to the remote EDA workspace. Create your own implementation with real devices, interconnect and pins, using your own tool loop without delegating to other agents; reference layouts and author code are not solver inputs.\u003c/li\u003e\n\u003cli\u003eInspect \u003ccode\u003eresources.external\u003c/code\u003e before using external tools. Each command starts a fresh shell: when tool modules are declared, source \u003ccode\u003e/usr/share/Modules/init/bash\u003c/code\u003e and load the selected tool's modules; export its declared \u003ccode\u003etool_environment\u003c/code\u003e settings in that same command. Repeat as needed and use batch or headless operation. Local manuals, command references, and release notes may be available within the declared EDA installation and PDK resource directories. Locate these resources through \u003ccode\u003e/protocol/task.json\u003c/code\u003e and consult the documentation for the installed tool version when diagnosing unfamiliar syntax or tool failures.\u003c/li\u003e\n\u003cli\u003eGenerate an initial candidate and submit a snapshot early. When \u003ccode\u003eprocess-feedback\u003c/code\u003e is available, check the current GDS with layout MCP \u003ccode\u003echeck\u003c/code\u003e or \u003ccode\u003epython -I /protocol/process_check.py\u003c/code\u003e before the final submission. This runs the final evaluator's complete plan and returns engineering diagnostics and candidate measurements, without scores or normalized quality factors. Checks have no count limit and consume the same wall-clock budget. Inspect the physical and functional results and all scored metrics; successful tool execution alone does not establish requirement satisfaction. Read paginated diagnostics with \u003ccode\u003ereport\u003c/code\u003e when using MCP. Local exploratory checks do not replace this complete check.\u003c/li\u003e\n\u003cli\u003eUse the remaining time for measured improvements to the declared quality objectives. Identify the limiting scored metrics, make targeted layout changes, regenerate and check the candidate, and compare measurements with the previous candidate and the stated scoring targets and trade-offs. Preserve the best valid candidate and revert changes that worsen the overall objective. Repeat while time and useful improvements remain; passing validity checks alone is not a stopping condition.\u003c/li\u003e\n\u003cli\u003eStop optimization when the budget expires, all declared quality objectives are achieved, or measured trials support convergence. If stopping early, explain the changes tried, the metric comparisons and the remaining limitations. Track remaining time through session status. At soft-budget expiry, finish or cancel already-started work and submit immediately; do not start another command, check or optimization round. If an MCP execution is running, use \u003ccode\u003epoll\u003c/code\u003e with its \u003ccode\u003eexecution_id\u003c/code\u003e and the returned \u003ccode\u003enext_offset\u003c/code\u003e as \u003ccode\u003eoffset\u003c/code\u003e until completion, or cancel it and wait for it to stop.\u003c/li\u003e\n\u003cli\u003eFinish or cancel outstanding work, restore your best candidate to the declared output path, and explicitly submit it before ending the session. With layout MCP \u003ccode\u003esubmit\u003c/code\u003e, remove the \u003ccode\u003e/workspace/\u003c/code\u003e prefix from \u003ccode\u003eoutput.path\u003c/code\u003e; with the container interface, run \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e. Wait for the receipt: only the last accepted snapshot is judged, and writing a file alone is not submission. Acceptance confirms delivery; the framework independently evaluates validity and quality after the session.\u003c/li\u003e\n\u003c/ol\u003e\n6:[\"$\",\"$8\",null,{\"fallback\":[\"$\",\"p\",null,{\"children\":\"Loading published evidence…\"}],\"children\":[\"$\",\"$L10\",null,{\"task\":{\"case_path\":\"tasks/gf180mcuD/gf-r2r-dac/cases/r2r/case.toml\",\"coefficient\":4,\"collection\":\"gf-r2r-dac\",\"configuration_url\":\"/ICLayout-Bench/assets/89966c5804b52c1de143a7d6a05630f7cee1dbe830b84c7dc20d0fae09139879.txt\",\"description_html\":\"$11\",\"description_path\":\"tasks/gf180mcuD/gf-r2r-dac/cases/r2r/problem.md\",\"hours\":1,\"id\":\"gf180mcuD.gf-r2r-dac.r2r\",\"inputs\":{\"description\":{\"format\":\"text\",\"path\":\"problem.md\",\"sha256\":\"a2134c589c10b02b8e1a4e6e8acaa53bf0e3120f434eb939fa9ad4a1349cd8fa\"},\"netlist\":{\"format\":\"spice\",\"path\":\"materials/circuit.spice\",\"sha256\":\"64ee316b7953b9444c61d2ac5639e4ac4b32ddd83323e1cc5b190e4865e97957\",\"subcircuit\":\"r2r\"},\"performance\":{\"format\":\"spice\",\"path\":\"materials/testbench.spice\",\"sha256\":\"10a7328b0ebfe072cab7a70c4265780c3ffa5760702bd7e2a94333c7f7dfdce0\"},\"transfer\":{\"format\":\"spice\",\"path\":\"materials/static_transfer.spice\",\"sha256\":\"dd9acbcefcec6a5d4249a8e5c43f484439b9fac211bb2ee78ad449e6db9f3165\"}},\"licenses\":[{\"name\":\"LICENSE\",\ \"rationale\":\"The absolute error, voltage span or magnitude has a nonnegative measurement domain; its positive value remains a continuously scored quality observation.\"},\"scale\":5e-7,\"unit\":\"V\"},{\"aggregation\":\"max\",\"baseline\":[\"source_transfer:worst_inl_lsb\"],\"category\":\"performance\",\"dimension\":\"response\",\"direction\":\"minimize\",\"id\":\"inl_lsb\",\"normalization\":\"saturating_ratio\",\"observations\":[\"transfer:worst_inl_lsb\"],\"quality_target\":{\"rationale\":\"Allocate 0.00002 LSB, or approximately 0.258 uV, to endpoint-fit INL over all 256 static codes. The fixed typical resistor network has near-zero source INL; this goal resolves differential routing parasitics and remains far above the source sweep numerical residual.\",\"value\":0.00002},\"requirement\":{\"lower\":0,\"rationale\":\"The absolute error, voltage span or magnitude has a nonnegative measurement domain; its positive value remains a continuously scored quality observation.\"},\"scale\":0.00001,\"unit\":\"LSB\"},{\"aggregation\":\"max\",\"baseline\":[\"source_transfer:worst_dnl_lsb\"],\"category\":\"performance\",\"dimension\":\"response\",\"direction\":\"minimize\",\"id\":\"dnl_lsb\",\"normalization\":\"saturating_ratio\",\"observations\":[\"transfer:worst_dnl_lsb\"],\"quality_target\":{\"rationale\":\"Allocate 0.00002 LSB, or approximately 0.258 uV, to adjacent-code DNL over the complete static transfer. This challenges unequal routing resistance in the nominal resistor ladder; it does not claim statistical matching yield.\",\"value\":0.00002},\"requirement\":{\"lower\":0,\"rationale\":\"The absolute error, voltage span or magnitude has a nonnegative measurement domain; its positive value remains a continuously scored quality observation.\"},\"scale\":0.00001,\"unit\":\"LSB\"},{\"aggregation\":\"min\",\"category\":\"performance\",\"direction\":\"maximize\",\"id\":\"monotonicity\",\"observations\":[\"transfer:minimum_step_v\"],\"requirement\":{\"lower\":0,\"rationale\":\"Increasing the digital code must not decrease the DAC static output voltage.\"},\"unit\":\"V\"},{\"aggregation\":\"max\",\"baseline\":[\"source_code0:settling_error_v\",\"source_code1:settling_error_v\",\"source_code2:settling_error_v\",\"source_code4:settling_error_v\",\"source_code8:settling_error_v\",\"source_code16:settling_error_v\",\"source_code32:settling_error_v\",\"source_code64:settling_error_v\",\"source_code128:settling_error_v\",\"source_code255:settling_error_v\"],\"category\":\"performance\",\"dimension\":\"response\",\"direction\":\"minimize\",\"id\":\"settling\",\"normalization\":\"saturating_ratio\",\"observations\":[\"code0:settling_error_v\",\"code1:settling_error_v\",\"code2:settling_error_v\",\"code4:settling_error_v\",\"code8:settling_error_v\",\"code16:settling_error_v\",\"code32:settling_error_v\",\"code64:settling_error_v\",\"code128:settling_error_v\",\"code255:settling_error_v\"],\"requirement\":{\"lower\":0,\"rationale\":\"The absolute error, voltage span or magnitude has a nonnegative measurement domain; its positive value remains a continuously scored quality observation.\"},\"scale\":0.000001,\"unit\":\"V\"}],\"pdk\":\"gf180mcuD\",\"reader\":{\"category\":\"Mixed-signal\",\"summary\":\"Converts an eight-bit digital code into an analog voltage through an R-2R network.\",\"title\":\"Eight-Bit R-2R DAC Core\"},\"scoring\":{\"area_metric\":\"functional_area\",\"area_target\":4000,\"method\":\"layout\",\"rationale\":\"The 4000 um2 footprint challenges the physical ladder and routing. Area carries 40%, INL 25%, DNL 20% and late-sample absolute accuracy 15%. The 1 uV absolute-error goal stays above the unchanged transient source residual of approximately 0.375 uV. The 0.00002 LSB INL and DNL goals each allocate approximately 0.258 uV to static differential routing error, well above the approximately 2e-12 LSB source sweep residual. Their scales are 0.5 uV and 0.00001 LSB, respectively, so small parasitic errors remain distinguishable. The metric named settling is a second late absolute-error sample at 1 us, while accuracy samples at 1.9 us; it retains zero weight to avoid counting the same equilibrium error twice. These are deterministic nominal-model goals, not a claim of mismatch yield, dynamic glitch suppression or measured settling time.\",\"weights\":{\"accuracy\":0.15,\"dnl_lsb\":0.2,\"functional_area\":0.4,\"inl_lsb\":0.25,\"settling\":0}},\"sections\":{\"Electrical Requirements and Scoring\":\"$12\",\"Inputs and Interface\":\"\u003cp\u003eInputs are this description, \u003ccode\u003ematerials/circuit.spice\u003c/code\u003e (the authoritative circuit) and \u003ccode\u003ematerials/testbench.spice\u003c/code\u003e (stimuli and measurements). Runtime task metadata supplies consistent frozen constraints, evaluation conditions and output declarations.\u003c/p\u003e\\n\u003cp\u003eOrdered subcircuit and GDS interface: \u003ccode\u003eb7, b1, b0, b2, b3, b4, b5, b6, out, VGND\u003c/code\u003e.\\nb0–b7: ideal-driver bit inputs (b0 is LSB); out: analog output; VGND: substrate and ladder return.\u003c/p\u003e\\n\u003cp\u003ePreserve topology, total device widths, channel lengths, multiplicities, resistor dimensions and body connections. Equivalent hierarchy, diffusion sharing and parallel fingers are allowed when connectivity and electrical checks pass; preserve source models and dimensions without idealizing internal devices. Retain dummy devices even when all their terminals are shorted.\u003c/p\u003e\\n\",\"Objective\":\"\u003cp\u003eImplement \u003ccode\u003er2r\u003c/code\u003e in GF180MCU variant D while preserving the supplied circuit, device dimensions and ordered interface. Eight-bit passive voltage conversion with ideal external bit drivers and a 1 pF output load; ten transient codes plus the complete static 256-code transfer.\u003c/p\u003e\\n\u003ch3\u003eOptimization objective\u003c/h3\u003e\\n\u003cp\u003eMaximize the declared quality score within the solve budget while satisfying all
