\"$L5\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[\"$L6\",[[\"$\",\"script\",\"script-0\",{\"src\":\"/ICLayout-Bench/_next/static/chunks/3_2wwayut9q0b.js\",\"async\":true,\"nonce\":\"$undefined\"}]],[\"$\",\"$L7\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.MetadataOutlet\",\"children\":\"$@9\"}]}]]}],{},null,false,null]},null,false,\"$a\"]},null,false,null],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Lb\",null,{\"children\":\"$Lc\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Ld\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.Metadata\",\"children\":\"$Le\"}]}]}],null]}],false]],\"m\":\"$undefined\",\"G\":[\"$f\",[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/ICLayout-Bench/_next/static/chunks/25phisebeeifo.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]]],\"S\":true,\"h\":null,\"r\":\"$undefined\",\"s\":\"$undefined\",\"a\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"U2oZdoUjWqT_XfcDHuQ5i\"}\n10:I[1186,[\"/ICLayout-Bench/_next/static/chunks/3gll1ekbrh320.js\",\"/ICLayout-Bench/_next/static/chunks/3_2wwayut9q0b.js\"],\"default\"]\na:C\n11:T4d3a,\u003ch1 id=\"problem-mirror-ota-regulator-with-bilateral-return-ratio-measurements-layout-task\"\u003eMirror-OTA Regulator with Bilateral Return-Ratio Measurements Layout Task\u003c/h1\u003e\n\u003ch2 id=\"problem-objective\"\u003eObjective\u003c/h2\u003e\n\u003cp\u003eImplement \u003ccode\u003eldo_008_fer_mirror_ota\u003c/code\u003e: a mirror-loaded NMOS-input error amplifier,\ndiode/tail bias network, PMOS pass device, feedback divider and series R/C\ncompensation. Preserve all seven source MOS groups as 81 physical fingers,\n40 MIM units and three high-poly resistors, with explicit substrate/well taps.\nThe internal compensation and divider remain part of the DUT.\u003c/p\u003e\n\u003cp\u003eMOS dimensions and multiplicities are unchanged from the fixed IHP binding.\nThe source 160 pF capacitor becomes forty 51.64 um square MIM units, nominally\n160.331872 pF total. The source 2 kohm compensation resistor becomes one\nW=1 um / L=1.325 um \u003ccode\u003erhigh\u003c/code\u003e; each source 9 kohm divider resistor becomes one\nW=1 um / L=6.235 um \u003ccode\u003erhigh\u003c/code\u003e, with m=1 and b=0. Source capacitor PLUS is\n\u003ccode\u003eczero\u003c/code\u003e, MINUS is \u003ccode\u003evout\u003c/code\u003e; the series resistor connects \u003ccode\u003eegate\u003c/code\u003e to \u003ccode\u003eczero\u003c/code\u003e.\nDivider upper/lower connect \u003ccode\u003evout–fb\u003c/code\u003e and \u003ccode\u003efb–vss\u003c/code\u003e. Every passive stays physical.\u003c/p\u003e\n\u003cp\u003eThe external source bias is unchanged at 20 uA from VDD to NBIAS. The external\nreference is deliberately changed from the source 0.6 V to \u003cstrong\u003e0.5 V\u003c/strong\u003e, giving\na nominal 1.0 V output and defined headroom at 1.2/1.3 V supply. There is no\nseparate internal or external COUT; compensation still provides physical\noutput-connected capacitance. This is not a claim of zero internal storage.\u003c/p\u003e\n\u003ch2 id=\"problem-inputs-and-interface\"\u003eInputs and Interface\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003ematerials/circuit.cdl\u003c/code\u003e: authoritative native LVS circuit.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ematerials/circuit.spice\u003c/code\u003e: equivalent simulator representation.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ematerials/testbench.spice\u003c/code\u003e: DC bias, bilateral loop measurements and load steps.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ematerials/startup.spice\u003c/code\u003e: zero-state resistive-load startup.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ematerials/sweeps.spice\u003c/code\u003e: DC line/load and regulation-headroom sweeps.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ematerials/fast.spice\u003c/code\u003e: short, finely resolved load-impulse response.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eOrdered ports: \u003ccode\u003evdd vout vss nbias vref fb sense\u003c/code\u003e. VDD/VSS are supply/return;\nVOUT is output; NBIAS receives the supply-fed current; VREF receives the 0.5 V\nreference. FB is the physical divider junction and SENSE is the amplifier's\nfeedback-input gate. Connect SENSE externally to FB through the zero-volt\nmeasurement source. This external link replaces the raw VLP's measurement role;\nit is not a manufactured voltage source. The relocated break exposes the\nactual input/divider boundary; the upper divider still connects to output.\nPMOS bodies connect through the VDD well tap; NMOS/poly bodies through the VSS\ntap. Preserve every W/L/m, body connection and physical passive. Equivalent\nparallel finger arrangements require native LVS and every other check to pass.\u003c/p\u003e\n\u003ch2 id=\"problem-operating-conditions\"\u003eOperating Conditions\u003c/h2\u003e\n\u003cp\u003eUse typical IHP LV MOS, MIM and resistor models at 27 C. Main conditions are\nall combinations of VDD=1.2/1.3 V and initial load 0.1/0.5 mA. The current\nload doubles at 2–2.02 us and returns at 10.02–10.04 us. Run to 18 us with\n1 ns maximum step, Gear order 2, \u003ccode\u003ershunt=1e12\u003c/code\u003e, \u003ccode\u003ereltol=1e-5\u003c/code\u003e, \u003ccode\u003eabstol=1e-14\u003c/code\u003e\nand \u003ccode\u003evntol=1e-8\u003c/code\u003e. Startup and fast tests use the same accuracy tolerances.\u003c/p\u003e\n\u003cp\u003eFor AC, independent supply/reference/load sources have no AC excitation.\nPerform two sweeps, 0.01 Hz–1 GHz at 300 points/decade, at the same operating\npoint. VPROBE is oriented SENSE→FB and IINJ from ground→SENSE. Both have\nzero DC value and are ordinary external test sources. First set VPROBE AC=1 V,\nIINJ AC=0; second set VPROBE AC=0, IINJ AC=1 A. The 1 A is only a normalized\nlinear AC excitation, not a physical large-signal load.\u003c/p\u003e\n\u003cp\u003eLet B=−I(VPROBE)/1 V and D=V(SENSE)/1 V from the first sweep; A=−I(VPROBE)/1 A\nand C=V(SENSE)/1 A from the second. With delta=AD−BC, define\n\u003ccode\u003eT=(2*delta−A+D)/(1−2*delta+A−D)\u003c/code\u003e. This bilateral two-port return ratio includes\nboth directional transmissions and port loading. The old voltage-only\n\u003ccode\u003e−V(FB)/V(SENSE)\u003c/code\u003e is not the accepted loop metric. Reset the circuit before\ntransient analysis; neither AC experiment changes its DC or transient topology.\u003c/p\u003e\n\u003cp\u003eThis measures the declared external feedback loop with the internal circuit\nretained. It is not an exhaustive pole proof for all internal device loops or\nan RF/model-validity claim beyond the declared tests. Both first and final crossing phase margins must lie in [0, 180] degrees.\nThe full-sweep return-distance and return-phase metrics have only nonnegative\ndomain bounds; high-frequency gain is unbounded. They affect continuous\nquality without adding a stability acceptance screen.\u003c/p\u003e\n\u003cp\u003eStartup uses 1/10 kohm loads and simultaneous linear supply/reference/bias\nramps from zero over 1/10 us: eight combinations including both supplies.\nRun with \u003ccode\u003euic\u003c/code\u003e, no internal-node initial conditions, to 30 us with 2 ns\nmaximum step. Startup qualification is resistive-load and synchronized-ramp\nonly, not arbitrary reference sequencing or constant-current startup.\u003c/p\u003e\n\u003cp\u003eDC sweeps: supply decreases from 1.3 to 0.8 V by 1 mV at 0.1/1 mA; line\nspan is measured over 1.2–1.3 V. Regulation floor is the first increasing\ncrossing of \u003ccode\u003eabs(VOUT−1.0)=0.03 V\u003c/code\u003e. Headroom is supply \u003cstrong\u003eminus actual output at\nthat crossing\u003c/strong\u003e, not supply minus the nominal target. The lower supply sweep\nis a boundary probe, not an extended qualified operating range. Separately\nsweep load 0.1–1 mA by 10 uA at each qualified supply, retaining both endpoints.\u003c/p\u003e\n\u003cp\u003eFast conditions use the four main DC biases and a +1 uA load pulse beginning\nat 1 ns, 5 ps rise/fall and 1 ns high time. Run 100 ns with 5 ps maximum step.\nIt probes fast recovery around the solved operating point without modifying\ncompensation, adding an output capacitor or clamping an internal node.\u003c/p\u003e\n\u003cp\u003eTransient extrema and AC sweep screens use the saved in-window samples;\nDC crossing locations and mean power use interpolation/integration. Numerical\nqualification also checks interpolated recovery-window endpoints.\u003c/p\u003e\n\u003ch2 id=\"problem-physical-requirements\"\u003ePhysical Requirements\u003c/h2\u003e\n\u003cp\u003eSubmit GDSII top cell \u003ccode\u003eldo_008_fer_mirror_ota\u003c/code\u003e, at most 10 MiB. Native main/maximal\nDRC has no waivers (standalone scope, density/antenna disabled). Strict named-port\nLVS includes physical taps. Functional outline is at most 3350 × 310 um and\nincludes all device, passive, contact and routing drawing layers; annotation\nand pin-purpose layers do not contribute. Magic candidate RC must preserve\nall physical MOS/MIM/poly and interconnect parasitics. Half-grid import is\nexplicit; extraction idealizes taps whereas source simulation uses their finite\nmodels. Distributed substrate resistance, PVT, mismatch, noise, fabrication\nsignoff and arbitrary-load stability are outside qualification.\u003c/p\u003e\n\u003ch2 id=\"problem-electrical-requirements-and-scoring\"\u003eElectrical Requirements and Scoring\u003c/h2\u003e\n\u003cp\u003ePhysical checks and declared functional bounds remain mandatory. Quality has no\nfixed allowed-degradation threshold. Each \u003ccode\u003esource_*\u003c/code\u003e job simulates the declared\nsource circuit with exactly the same testbench, model resources, parameters,\nload and measurement window as its paired extracted-candidate job. A source\nobservation is the 100-point electrical baseline; it is independent of the\nsubmitted GDS. All individual pairs are retained in the evaluation report.\u003c/p\u003e\n\u003cp\u003eFor a post-layout observation x and its source observation b:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eMaximize: q = x/b; minimize: q = b/x. When a numerical scale s is declared,\nuse (x+s)/(b+s) or its inverse. This handles zero-valued error measurements;\ns is a normalization floor, not an allowed degradation or pass threshold.\u003c/li\u003e\n\u003cli\u003eAmplitude dB: q = 10^((x-b)/20) for maximize, its inverse for minimize.\u003c/li\u003e\n\u003cli\u003eTarget: q = 1/(1+abs(x-b)/s), with a declared physical scale s. Signed and\nzero-valued operating points are never divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eScoring uses \u003ccode\u003elayout\u003c/code\u003e. A metric uses its worst paired quality q. The score is\nS = 100 * product(q_i ** w_i), including area quality\nq_area = area_reference / candidate_functional_area. The weights below sum to\none. Dimensions describe measurements but do not determine their weights.\nPhysical or functional rejection scores zero; missing or invalid measurements\nproduce an unknown score, including measurements with zero weight.\nSource-equivalent performance at the area reference scores 100; improvements\ncan exceed 100. A weight expresses a tradeoff, not a hard acceptance limit.\u003c/p\u003e\n\u003cp\u003eMeasurement definitions below use the supplied SPICE node/source names.\n\u003ccode\u003ev(n)\u003c/code\u003e is node voltage and \u003ccode\u003ei(V)\u003c/code\u003e is current into a voltage source; delivered\npower therefore uses a minus sign. \u003ccode\u003edb(z)=20*log10(abs(z))\u003c/code\u003e, \u003ccode\u003emag/abs\u003c/code\u003e\ndenote magnitude, and \u003ccode\u003ecph\u003c/code\u003e is continuous phase in radians. \u003ccode\u003efind\u003c/code\u003e, \u003ccode\u003ewhen\u003c/code\u003e,\n\u003ccode\u003efrom/to\u003c/code\u003e, and \u003ccode\u003erise/fall\u003c/code\u003e retain the deck's interpolation, window and\ncrossing conventions; SPICE suffixes p/n/u/m/meg/g mean pico/nano/micro/\nmilli/mega/giga. Nested \u003ccode\u003eavg\u003c/code\u003e, \u003ccode\u003emin\u003c/code\u003e, \u003ccode\u003emax\u003c/code\u003e, \u003ccode\u003evecmin/vecmax\u003c/code\u003e and \u003ccode\u003ederiv\u003c/code\u003e\nmean the stated window average, extrema and sampled derivative. All\ndeclared conditions are measured separately and paired with the same\nsource condition; a group uses its worst paired quality.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eDefinition / observations\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eQuality rule\u003c/th\u003e\n\u003cth\u003eFunctional bounds\u003c/th\u003e\n\u003cth\u003eScale\u003c/th\u003e\n\u003cth\u003eDimension\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003ev(vout)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.3\u003c/td\u003e\n\u003ctd\u003e1.3\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebias_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003ev(nbias)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.3\u003c/td\u003e\n\u003ctd\u003e1.3\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003equiescent_a\u003c/code\u003e\u003c/td\ nimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003ctd\u003esupply\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estartup_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Maximum of \u003ccode\u003e(abs(v(vout)-1.0)) from=25u to=30u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estartup_peak_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Maximum of \u003ccode\u003ev(vout) from=0 to=30u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.3\u003c/td\u003e\n\u003ctd\u003e1.3\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estartup_minimum_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Minimum of \u003ccode\u003ev(vout) from=0 to=30u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e1.3\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eregulation_floor_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC: Crossing coordinate where \u003ccode\u003e(abs(v(vout)-1.0))=0.03 rise=1\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.3\u003c/td\u003e\n\u003ctd\u003e1.3\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eheadroom_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC sweep: \u003ccode\u003e(when (abs(v(vout)-1.0))=0.03 rise=1)-(find v(vout) when (abs(v(vout)-1.0))=0.03 rise=1)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eline_span_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC sweep: \u003ccode\u003e(max v(vout) from=1.3 to=1.2)-(min v(vout) from=1.3 to=1.2)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eload_span_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC sweep: \u003ccode\u003e(max v(vout))-(min v(vout))\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efast_peak_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMaximum absolute deviation of transient VOUT from its initial DC operating-point value over 0–100 ns in the fast load-pulse deck.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.3\u003c/td\u003e\n\u003ctd\u003e1.3\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efast_tail_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eThe same absolute deviation from initial DC VOUT over 80–100 ns.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.3\u003c/td\u003e\n\u003ctd\u003e1.3\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eArea reference: \u003cstrong\u003e172708.78 um2\u003c/strong\u003e. 126 expanded device instances; sum of device/contact envelopes 114596.5905 um2, per-side envelope allowance 0.6 um, 50% routing allowance and total outer width/height allowance 1.2 um. Estimate = ceil(100 * (1.5 * envelope_sum + 2 * margin * sqrt(envelope_sum) + margin^2)) / 100. Here margin is the total allowance across two opposite sides; the envelope sum is displayed rounded to four decimals. MOS/passive envelopes use declared W/L (or resistor dimensions) and multiplicity; explicit tap areas and HBT emitter/contact envelopes are included. This is a frozen engineering estimate, not a foundry minimum or a feasibility claim.\u003c/p\u003e\n\u003cp\u003eThe capability coefficient remains \u003cstrong\u003e9\u003c/strong\u003e; it is independent of\nthe reference-relative task score.\u003c/p\u003e\n\u003ch3 id=\"problem-score-weights\"\u003eScore weights\u003c/h3\u003e\n\u003cp\u003eIHP regulators: regulation and headroom 22.5%; load recovery 22.5%; startup 13.5%; loop stability 13.5%; AC transfer and extrema 4.5%; internal bias 1.8%; quiescent current 7.2%; power 4.5%; area 10%. Each objective's weight is divided equally among its metrics.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eheadroom_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eline_span_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eload_span_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eregulation_floor_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003erecovery_load_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.112500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003erecovery_release_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.112500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estartup_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estartup_minimum_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estartup_peak_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efinal_phase_margin_deg\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.033750000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eminimum_return_distance\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.033750000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ephase_margin_deg\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.033750000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ereturn_phase_excursion_deg\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.033750000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edc_gain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.005625000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efast_peak_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.005625000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efast_tail_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.005625000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efinal_unity_hz\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.005625000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ehf_gain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.005625000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emaximum_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.005625000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eminimum_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.005625000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eunity_hz\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.005625000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebias_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.018000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003equiescent_a\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.072000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emean_power_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.022500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.022500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch2 id=\"problem-tools-and-submission\"\u003eTools and Submission\u003c/h2\u003e\n\u003cp\u003eSolve budget: \u003cstrong\u003e3 hours\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eDiscover inputs, resources and feedback through \u003ccode\u003e/protocol/task.json\u003c/code\u003e,\n\u003ccode\u003e/protocol/resources.json\u003c/code\u003e and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e. Use supplied IHP\nprimitives, KLayout, Magic and ngspice. Write \u003ccode\u003e/workspace/output/final.gds\u003c/code\u003e\nand explicitly submit through the harness. Source records, host configuration\nand reference layouts stay outside standard solver inputs.\u003c/p\u003e\n12:T2ecf,\u003cp\u003ePhysical checks and declared functional bounds remain mandatory. Quality has no\nfixed allowed-degradation threshold. Each \u003ccode\u003esource_*\u003c/code\u003e job simulates the declared\nsource circuit with exactly the same testbench, model resources, parameters,\nload and measurement window as its paired extracted-candidate job. A source\nobservation is the 100-point electrical baseline; it is independent of the\nsubmitted GDS. All individual pairs are retained in the evaluation report.\u003c/p\u003e\n\u003cp\u003eFor a post-layout observation x and its source observation b:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eMaximize: q = x/b; minimize: q = b/x. When a numerical scale s is declared,\nuse (x+s)/(b+s) or its inverse. This handles zero-valued error measurements;\ns is a normalization floor, not an allowed degradation or pass threshold.\u003c/li\u003e\n\u003cli\u003eAmplitude dB: q = 10^((x-b)/20) for maximize, its inverse for minimize.\u003c/li\u003e\n\u003cli\u003eTarget: q = 1/(1+abs(x-b)/s), with a declared physical scale s. Signed and\nzero-valued operating points are never divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eScoring uses \u003ccode\u003elayout\u003c/code\u003e. A metric uses its worst paired quality q. The score is\nS = 100 * product(q_i ** w_i), including area quality\nq_area = area_reference / candidate_functional_area. The weights below sum to\none. Dimensions describe measurements but do not determine their weights.\nPhysical or functional rejection scores zero; missing or invalid measurements\nproduce an unknown score, including measurements with zero weight.\nSource-equivalent performance at the area reference scores 100; improvements\ncan exceed 100. A weight expresses a tradeoff, not a hard acceptance limit.\u003c/p\u003e\n\u003cp\u003eMeasurement definitions below use the supplied SPICE node/source names.\n\u003ccode\u003ev(n)\u003c/code\u003e is node voltage and \u003ccode\u003ei(V)\u003c/code\u003e is current into a voltage source; delivered\npower therefore uses a minus sign. \u003ccode\u003edb(z)=20*log10(abs(z))\u003c/code\u003e, \u003ccode\u003emag/abs\u003c/code\u003e\ndenote magnitude, and \u003ccode\u003ecph\u003c/code\u003e is continuous phase in radians. \u003ccode\u003efind\u003c/code\u003e, \u003ccode\u003ewhen\u003c/code\u003e,\n\u003ccode\u003efrom/to\u003c/code\u003e, and \u003ccode\u003erise/fall\u003c/code\u003e retain the deck's interpolation, window and\ncrossing conventions; SPICE suffixes p/n/u/m/meg/g mean pico/nano/micro/\nmilli/mega/giga. Nested \u003ccode\u003eavg\u003c/code\u003e, \u003ccode\u003emin\u003c/code\u003e, \u003ccode\u003emax\u003c/code\u003e, \u003ccode\u003evecmin/vecmax\u003c/code\u003e and \u003ccode\u003ederiv\u003c/code\u003e\nmean the stated window average, extrema and sampled derivative. All\ndeclared conditions are measured separately and paired with the same\nsource condition; a group uses its worst paired quality.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eDefinition / observations\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eQuality rule\u003c/th\u003e\n\u003cth\u003eFunctional bounds\u003c/th\u003e\n\u003cth\u003eScale\u003c/th\u003e\n\u003cth\u003eDimension\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003ev(vout)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.3\u003c/td\u003e\n\u003ctd\u003e1.3\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebias_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003ev(nbias)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.3\u003c/td\u003e\n\u003ctd\u003e1.3\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003equiescent_a\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003e-i(VDD)-@iload[current]\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eA\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003ctd\u003esupply\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003e-v(vdd)*i(VDD)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e \u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Maximum of \u003ccode\u003ev(vout) from=0 to=30u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.3\u003c/td\u003e\n\u003ctd\u003e1.3\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estartup_minimum_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Minimum of \u003ccode\u003ev(vout) from=0 to=30u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e1.3\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eregulation_floor_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC: Crossing coordinate where \u003ccode\u003e(abs(v(vout)-1.0))=0.03 rise=1\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.3\u003c/td\u003e\n\u003ctd\u003e1.3\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eheadroom_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC sweep: \u003ccode\u003e(when (abs(v(vout)-1.0))=0.03 rise=1)-(find v(vout) when (abs(v(vout)-1.0))=0.03 rise=1)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eline_span_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC sweep: \u003ccode\u003e(max v(vout) from=1.3 to=1.2)-(min v(vout) from=1.3 to=1.2)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eload_span_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC sweep: \u003ccode\u003e(max v(vout))-(min v(vout))\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efast_peak_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMaximum absolute deviation of transient VOUT from its initial DC operating-point value over 0–100 ns in the fast load-pulse deck.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.3\u003c/td\u003e\n\u003ctd\u003e1.3\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efast_tail_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eThe same absolute deviation from initial DC VOUT over 80–100 ns.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.3\u003c/td\u003e\n\u003ctd\u003e1.3\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eArea reference: \u003cstrong\u003e172708.78 um2\u003c/strong\u003e. 126 expanded device instances; sum of device/contact envelopes 114596.5905 um2, per-side envelope allowance 0.6 um, 50% routing allowance and total outer width/height allowance 1.2 um. Estimate = ceil(100 * (1.5 * envelope_sum + 2 * margin * sqrt(envelope_sum) + margin^2)) / 100. Here margin is the total allowance across two opposite sides; the envelope sum is displayed rounded to four decimals. MOS/passive envelopes use declared W/L (or resistor dimensions) and multiplicity; explicit tap areas and HBT emitter/contact envelopes are included. This is a frozen engineering estimate, not a foundry minimum or a feasibility claim.\u003c/p\u003e\n\u003cp\u003eThe capability coefficient remains \u003cstrong\u003e9\u003c/strong\u003e; it is independent of\nthe reference-relative task score.\u003c/p\u003e\n\u003ch3\u003eScore weights\u003c/h3\u003e\n\u003cp\u003eIHP regulators: regulation and headroom 22.5%; load recovery 22.5%; startup 13.5%; loop stability 13.5%; AC transfer and extrema 4.5%; internal bias 1.8%; quiescent current 7.2%; power 4.5%; area 10%. Each objective's weight is divided equally among its metrics.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eheadroom_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eline_span_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eload_span_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eregulation_floor_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003erecovery_load_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.112500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003erecovery_release_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.112500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estartup_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estartup_minimum_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estartup_peak_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efinal_phase_margin_deg\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.033750000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eminimum_return_distance\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.033750000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ephase_margin_deg\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.033750000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ereturn_phase_excursion_deg\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.033750000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edc_gain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.005625000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efast_peak_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.005625000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efast_tail_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.005625000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efinal_unity_hz\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.005625000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ehf_gain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.005625000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emaximum_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.005625000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eminimum_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.005625000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eunity_hz\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.005625000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebias_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.018000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003equiescent_a\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.072000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emean_power_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.022500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.022500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n13:T590,\u003cp\u003eImplement \u003ccode\u003eldo_008_fer_mirror_ota\u003c/code\u003e: a mirror-loaded NMOS-input error amplifier,\ndiode/tail bias network, PMOS pass device, feedback divider and series R/C\ncompensation. Preserve all seven source MOS groups as 81 physical fingers,\n40 MIM units and three high-poly resistors, with explicit substrate/well taps.\nThe internal compensation and divider remain part of the DUT.\u003c/p\u003e\n\u003cp\u003eMOS dimensions and multiplicities are unchanged from the fixed IHP binding.\nThe source 160 pF capacitor becomes forty 51.64 um square MIM units, nominally\n160.331872 pF total. The source 2 kohm compensation resistor becomes one\nW=1 um / L=1.325 um \u003ccode\u003erhigh\u003c/code\u003e; each source 9 kohm divider resistor becomes one\nW=1 um / L=6.235 um \u003ccode\u003erhigh\u003c/code\u003e, with m=1 and b=0. Source capacitor PLUS is\n\u003ccode\u003eczero\u003c/code\u003e, MINUS is \u003ccode\u003evout\u003c/code\u003e; the series resistor connects \u003ccode\u003eegate\u003c/code\u003e to \u003ccode\u003eczero\u003c/code\u003e.\nDivider upper/lower connect \u003ccode\u003evout–fb\u003c/code\u003e and \u003ccode\u003efb–vss\u003c/code\u003e. Every passive stays physical.\u003c/p\u003e\n\u003cp\u003eThe external source bias is unchanged at 20 uA from VDD to NBIAS. The external\nreference is deliberately changed from the source 0.6 V to \u003cstrong\u003e0.5 V\u003c/strong\u003e, giving\na nominal 1.0 V output and defined headroom at 1.2/1.3 V supply. There is no\nseparate internal or external COUT; compensation still provides physical\noutput-connected capacitance. This is not a claim of zero internal storage.\u003c/p\u003e\n14:Tcd1,\u003cp\u003eUse typical IHP LV MOS, MIM and resistor models at 27 C. Main conditions are\nall combinations of VDD=1.2/1.3 V and initial load 0.1/0.5 mA. The current\nload doubles at 2–2.02 us and returns at 10.02–10.04 us. Run to 18 us with\n1 ns maximum step, Gear order 2, \u003ccode\u003ershunt=1e12\u003c/code\u003e, \u003ccode\u003ereltol=1e-5\u003c/code\u003e, \u003ccode\u003eabstol=1e-14\u003c/code\u003e\nand \u003ccode\u003evntol=1e-8\u003c/code\u003e. Startup and fast tests use the same accuracy tolerances.\u003c/p\u003e\n\u003cp\u003eFor AC, independent supply/reference/load sources have no AC excitation.\nPerform two sweeps, 0.01 Hz–1 GHz at 300 points/decade, at the same operating\npoint. VPROBE is oriented SENSE→FB and IINJ from ground→SENSE. Both have\nzero DC value and are ordinary external test sources. First set VPROBE AC=1 V,\nIINJ AC=0; second set VPROBE AC=0, IINJ AC=1 A. The 1 A is only a normalized\nlinear AC excitation, not a physical large-signal load.\u003c/p\u003e\n\u003cp\u003eLet B=−I(VPROBE)/1 V and D=V(SENSE)/1 V from the first sweep; A=−I(VPROBE)/1 A\nand C=V(SENSE)/1 A from the second. With delta=AD−BC, define\n\u003ccode\u003eT=(2*delta−A+D)/(1−2*delta+A−D)\u003c/code\u003e. This bilateral two-port return ratio includes\nboth directional transmissions and port loading. The old voltage-only\n\u003ccode\u003e−V(FB)/V(SENSE)\u003c/code\u003e is not the accepted loop metric. Reset the circuit before\ntransient analysis; neither AC experiment changes its DC or transient topology.\u003c/p\u003e\n\u003cp\u003eThis measures the declared external feedback loop with the internal circuit\nretained. It is not an exhaustive pole proof for all internal device loops or\nan RF/model-validity claim beyond the declared tests. Both first and final crossing phase margins must lie in [0, 180] degrees.\nThe full-sweep return-distance and return-phase metrics have only nonnegative\ndomain bounds; high-frequency gain is unbounded. They affect continuous\nquality without adding a stability acceptance screen.\u003c/p\u003e\n\u003cp\u003eStartup uses 1/10 kohm loads and simultaneous linear supply/reference/bias\nramps from zero over 1/10 us: eight combinations including both supplies.\nRun with \u003ccode\u003euic\u003c/code\u003e, no internal-node initial conditions, to 30 us with 2 ns\nmaximum step. Startup qualification is resistive-load and synchronized-ramp\nonly, not arbitrary reference sequencing or constant-current startup.\u003c/p\u003e\n\u003cp\u003eDC sweeps: supply decreases from 1.3 to 0.8 V by 1 mV at 0.1/1 mA; line\nspan is measured over 1.2–1.3 V. Regulation floor is the first increasing\ncrossing of \u003ccode\u003eabs(VOUT−1.0)=0.03 V\u003c/code\u003e. Headroom is supply \u003cstrong\u003eminus actual output at\nthat crossing\u003c/strong\u003e, not supply minus the nominal target. The lower supply sweep\nis a boundary probe, not an extended qualified operating range. Separately\nsweep load 0.1–1 mA by 10 uA at each qualified supply, retaining both endpoints.\u003c/p\u003e\n\u003cp\u003eFast conditions use the four main DC biases and a +1 uA load pulse beginning\nat 1 ns, 5 ps rise/fall and 1 ns high time. Run 100 ns with 5 ps maximum step.\nIt probes fast recovery around the solved operating point without modifying\ncompensation, adding an output capacitor or clamping an internal node.\u003c/p\u003e\n\u003cp\u003eTransient extrema and AC sweep screens use the saved in-window samples;\nDC crossing locations and mean power use interpolation/integration. Numerical\nqualification also checks interpolated recovery-window endpoints.\u003c/p\u003e\n6:[\"$\",\"$8\",null,{\"fallback\":[\"$\",\"p\",null,{\"children\":\"Loading published evidence…\"}],\"children\":[\"$\",\"$L10\",null,{\"task\":{\"case_path\":\"tasks/ihp-sg13g2/analog-db/cases/ldo_008_fer_mirror_ota/case.toml\",\"coefficient\":9,\"collection\":\"analog-db\",\"configuration_url\":\"/ICLayout-Bench/assets/0112b24633297076d0939a9aa711cb2221e1205f570acd15f48196bc31f04326.txt\",\"description_html\":\"$11\",\"description_path\":\"tasks/ihp-sg13g2/analog-db/cases/ldo_008_fer_mirror_ota/problem.md\",\"hours\":3,\"id\":\"ihp-sg13g2.analog-db.ldo_008_fer_mirror_ota\",\"inputs\":{\"description\":{\"format\":\"text\",\"path\":\"problem.md\",\"sha256\":\"30a89147fa8d7b619eedfe8099816048e11c137b45f03fa137c7e373aaf22ef9\"},\"fast\":{\"format\":\"spice\",\"path\":\"materials/fast.spice\",\"sha256\":\"cdede5701638863728fbd3f89a87841d7cf16fa27693e2514ce413053b47bea4\"},\"netlist\":{\"format\":\"
