ror\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L5\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[\"$L6\",[[\"$\",\"script\",\"script-0\",{\"src\":\"/ICLayout-Bench/_next/static/chunks/27jip_2vcvnd5.js\",\"async\":true,\"nonce\":\"$undefined\"}]],[\"$\",\"$L7\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.MetadataOutlet\",\"children\":\"$@9\"}]}]]}],{},null,false,null]},null,false,\"$a\"]},null,false,null],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Lb\",null,{\"children\":\"$Lc\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Ld\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.Metadata\",\"children\":\"$Le\"}]}]}],null]}],false]],\"m\":\"$undefined\",\"G\":[\"$f\",[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/ICLayout-Bench/_next/static/chunks/3sa54_ghi1h2h.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]]],\"S\":true,\"h\":null,\"r\":\"$undefined\",\"s\":\"$undefined\",\"a\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"2hqB741EA4j7xWQVg6hu-\"}\n10:I[1186,[\"/ICLayout-Bench/_next/static/chunks/2h60meymns2z5.js\",\"/ICLayout-Bench/_next/static/chunks/27jip_2vcvnd5.js\"],\"default\"]\na:C\n11:T6f1a,\u003ch1 id=\"problem-mirror-ota-regulator-with-bilateral-return-ratio-measurements-layout-task\"\u003eMirror-OTA Regulator with Bilateral Return-Ratio Measurements Layout Task\u003c/h1\u003e\n\u003ch2 id=\"problem-objective\"\u003eObjective\u003c/h2\u003e\n\u003cp\u003eImplement \u003ccode\u003eldo_008_fer_mirror_ota\u003c/code\u003e: a mirror-loaded NMOS-input error amplifier,\ndiode/tail bias network, PMOS pass device, feedback divider and series R/C\ncompensation. Preserve all seven source MOS groups as 81 physical fingers,\n40 MIM units and three high-poly resistors, with explicit substrate/well taps.\nThe internal compensation and divider remain part of the DUT.\u003c/p\u003e\n\u003cp\u003eMOS dimensions and multiplicities are unchanged from the fixed IHP binding.\nThe source 160 pF capacitor becomes forty 51.64 um square MIM units, nominally\n160.331872 pF total. The source 2 kohm compensation resistor becomes one\nW=1 um / L=1.325 um \u003ccode\u003erhigh\u003c/code\u003e; each source 9 kohm divider resistor becomes one\nW=1 um / L=6.235 um \u003ccode\u003erhigh\u003c/code\u003e, with m=1 and b=0. Source capacitor PLUS is\n\u003ccode\u003eczero\u003c/code\u003e, MINUS is \u003ccode\u003evout\u003c/code\u003e; the series resistor connects \u003ccode\u003eegate\u003c/code\u003e to \u003ccode\u003eczero\u003c/code\u003e.\nDivider upper/lower connect \u003ccode\u003evout–fb\u003c/code\u003e and \u003ccode\u003efb–vss\u003c/code\u003e. Every passive stays physical.\u003c/p\u003e\n\u003cp\u003eThe external source bias is unchanged at 20 uA from VDD to NBIAS. The external\nreference is deliberately changed from the source 0.6 V to \u003cstrong\u003e0.5 V\u003c/strong\u003e, giving\na nominal 1.0 V output and defined headroom at 1.2/1.3 V supply. There is no\nseparate internal or external COUT; compensation still provides physical\noutput-connected capacitance. This is not a claim of zero internal storage.\u003c/p\u003e\n\u003ch3 id=\"problem-optimization-objective\"\u003eOptimization objective\u003c/h3\u003e\n\u003cp\u003eMaximize the declared quality score within the solve budget while satisfying all physical and necessary functional requirements. The first passing DRC, LVS and required electrical checks establish a feasible baseline. Continue improving the scored metrics from that baseline; a passing check or \u003ccode\u003etask_success = true\u003c/code\u003e does not mean that the quality objectives have been achieved.\u003c/p\u003e\n\u003ch2 id=\"problem-inputs-and-interface\"\u003eInputs and Interface\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003ematerials/circuit.cdl\u003c/code\u003e: authoritative native LVS circuit.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ematerials/circuit.spice\u003c/code\u003e: equivalent simulator representation.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ematerials/testbench.spice\u003c/code\u003e: DC bias, bilateral loop measurements and load steps.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ematerials/startup.spice\u003c/code\u003e: zero-state resistive-load startup.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ematerials/sweeps.spice\u003c/code\u003e: DC line/load and regulation-headroom sweeps.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ematerials/psrr.spice\u003c/code\u003e: closed-loop small-signal supply rejection.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ematerials/fast.spice\u003c/code\u003e: short, finely resolved load-impulse response.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eOrdered ports: \u003ccode\u003evdd vout vss nbias vref fb sense\u003c/code\u003e. VDD/VSS are supply/return;\nVOUT is output; NBIAS receives the supply-fed current; VREF receives the 0.5 V\nreference. FB is the physical divider junction and SENSE is the amplifier's\nfeedback-input gate. Connect SENSE externally to FB through the zero-volt\nmeasurement source. This external link replaces the raw VLP's measurement role;\nit is not a manufactured voltage source. The relocated break exposes the\nactual input/divider boundary; the upper divider still connects to output.\nPMOS bodies connect through the VDD well tap; NMOS/poly bodies through the VSS\ntap. Preserve every W/L/m, body connection and physical passive. Equivalent\nparallel finger arrangements require native LVS and every other check to pass.\u003c/p\u003e\n\u003ch2 id=\"problem-operating-conditions\"\u003eOperating Conditions\u003c/h2\u003e\n\u003cp\u003eUse typical IHP LV MOS, MIM and resistor models at 27 C. Main conditions are\nall combinations of VDD=1.2/1.3 V and initial load 0.1/0.5 mA. The current\nload doubles at 2–2.02 us and returns at 10.02–10.04 us. Run to 18 us with\n5 ns maximum step, Gear order 2, \u003ccode\u003ershunt=1e12\u003c/code\u003e, \u003ccode\u003ereltol=1e-5\u003c/code\u003e, \u003ccode\u003eabstol=1e-14\u003c/code\u003e\nand \u003ccode\u003evntol=1e-8\u003c/code\u003e. Startup and fast tests use the same accuracy tolerances.\u003c/p\u003e\n\u003cp\u003eFor AC, independent supply/reference/load sources have no AC excitation.\nPerform two sweeps, 0.01 Hz–1 GHz at 300 points/decade, at the same operating\npoint. VPROBE is oriented SENSE→FB and IINJ from ground→SENSE. Both have\nzero DC value and are ordinary external test sources. First set VPROBE AC=1 V,\nIINJ AC=0; second set VPROBE AC=0, IINJ AC=1 A. The 1 A is only a normalized\nlinear AC excitation, not a physical large-signal load.\u003c/p\u003e\n\u003cp\u003eLet B=−I(VPROBE)/1 V and D=V(SENSE)/1 V from the first sweep; A=−I(VPROBE)/1 A\nand C=V(SENSE)/1 A from the second. With delta=AD−BC, define\n\u003ccode\u003eT=(2*delta−A+D)/(1−2*delta+A−D)\u003c/code\u003e. This bilateral two-port return ratio includes\nboth directional transmissions and port loading. The old voltage-only\n\u003ccode\u003e−V(FB)/V(SENSE)\u003c/code\u003e is not the accepted loop metric. Reset the circuit before\ntransient analysis; neither AC experiment changes its DC or transient topology.\u003c/p\u003e\n\u003cp\u003eThe separate supply-rejection suite uses the same four DC operating points\n(VDD=1.2/1.3 V and ILOAD=0.1/0.5 mA) at 27 C. VDD receives a normalized 1 V\nsmall-signal AC excitation around each DC value; VREF, IBIAS and ILOAD have zero\nAC excitation. VPROBE remains a zero-volt connection with zero AC magnitude,\nand IINJ is zero, so the feedback loop remains closed. Sweep 10 Hz–10 MHz at\n300 points/decade. At 1 kHz and 1 MHz, measure\n\u003ccode\u003ePSRR=20*log10(abs(VDD/VOUT))\u003c/code\u003e in dB. This is source-paired small-signal\nrejection for the declared external bias fixture, not large-signal ripple\nimmunity or rejection of an internal bias generator.\u003c/p\u003e\n\u003cp\u003eThis measures the declared external feedback loop with the internal circuit\nretained. It is not an exhaustive pole proof for all internal device loops or\nan RF/model-validity claim beyond the declared tests. Both first and final crossing phase margins must lie in [0, 180] degrees.\nThe full-sweep return-distance and return-phase metrics have only nonnegative\ndomain bounds; high-frequency gain is unbounded. They affect continuous\nquality without adding a stability acceptance screen.\u003c/p\u003e\n\u003cp\u003eStartup uses 1/10 kohm loads and simultaneous linear supply/reference/bias\nramps from zero over 1/10 us: eight combinations including both supplies.\nRun with \u003ccode\u003euic\u003c/code\u003e, no internal-node initial conditions, to 30 us with 10 ns\nmaximum step. Startup qualification is resistive-load and synchronized-ramp\nonly, not arbitrary reference sequencing or constant-current startup.\u003c/p\u003e\n\u003cp\u003eDC sweeps: supply decreases from 1.3 to 0.8 V by 1 mV at 0.1/1 mA; line\nspan is measured over 1.2–1.3 V. Regulation floor is the first increasing\ncrossing of \u003ccode\u003eabs(VOUT−1.0)=0.03 V\u003c/code\u003e. Headroom is supply \u003cstrong\u003eminus actual output at\nthat crossing\u003c/strong\u003e, not supply minus the nominal target. The lower supply sweep\nis a boundary probe, not an extended qualified operating range. Separately\nsweep load 0.1–1 mA by 10 uA at each qualified supply, retaining both endpoints.\u003c/p\u003e\n\u003cp\u003eFast conditions use the four main DC biases and a +1 uA load pulse beginning\nat 1 ns, 5 ps rise/fall and 1 ns high time. Run 100 ns with 25 ps maximum step.\nIt probes fast recovery around the solved operating point without modifying\ncompensation, adding an output capacitor or clamping an internal node.\u003c/p\u003e\n\u003cp\u003eTransient extrema and AC sweep screens use the saved in-window samples;\nDC crossing locations and mean power use interpolation/integration. Numerical\nqualification also checks interpolated recovery-window endpoints.\u003c/p\u003e\n\u003cp\u003eAdditional upstream application fixtures use a 1 uF output capacitor: a 0.1-to-1 mA load step at 5 us with 10 ns edges and a 30 us stop, plus closed-loop supply rejection at 1 kHz. Both retain the declared 1.2 V LV supply, 20 uA external bias and 0.5 V reference. Their observations are source-paired diagnostics, separate from the small-capacitance and startup stress tests. They introduce no new performance rejection threshold.\u003c/p\u003e\n\u003ch2 id=\"problem-physical-requirements\"\u003ePhysical Requirements\u003c/h2\u003e\n\u003cp\u003eSubmit GDSII top cell \u003ccode\u003eldo_008_fer_mirror_ota\u003c/code\u003e, at most 10 MiB. Native main/maximal\nDRC has no waivers (standalone scope, density/antenna disabled). Strict named-port\nLVS includes physical taps. Functional outline is at most 3350 × 310 um and\nincludes all device, passive, contact and routing drawing layers; annotation\nand pin-purpose layers do not contribute. Magic candidate RC must preserve\nall physical MOS/MIM/poly and interconnect parasitics. Half-grid import is\nexplicit; extraction idealizes taps whereas source simulation uses their finite\nmodels. Distributed substrate resistance, PVT, mismatch, noise, fabrication\nsignoff and arbitrary-load stability are outside qualification.\u003c/p\u003e\n\u003ch2 id=\"problem-electrical-requirements-and-scoring\"\u003eElectrical Requirements and Scoring\u003c/h2\u003e\n\u003cp\u003eArtifact, geometry, DRC, LVS and declared functional requirements must pass. Parasitic extraction is also mandatory: it must produce a complete, electrically consistent netlist usable by the required post-layout simulations. A completed candidate rejection scores zero; infrastructure errors do not establish candidate failure.\u003c/p\u003e\n\u003cp\u003eFor \u003ccode\u003elayout\u003c/code\u003e scoring, cap every positively weighted raw quality at 1 before aggregation; the score ranges from 0 to 100. Reaching every weighted target scores 100, and no minimum score is required for validity.\u003c/p\u003e\n\u003cp\u003ePhysical checks and the declared functional bounds must pass. Quality scoring imposes no fixed degradation allowance. Each \u003ccode\u003esource_*\u003c/code\u003e job and its corresponding candidate extracted circuit use exactly the same testbench, model resources, parameters, loads and measurement windows. Independent source observations remain required evidence. The explicit quality targets below supply scoring anchors; otherwise the paired source value is used. Reports retain every paired result.\u003c/p\u003e\n\u003cp\u003eLet x be the post-layout measurement and b the declared quality target, or the same-condition source measurement when no target is declared:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eRatio normalization: maximize with q = x/b and minimize with q = b/x. When a numerical scale s is declared, use (x+s)/(b+s) and its reciprocal, respectively. The scale handles zero values as a normalization floor; it is neither an allowed degradation nor an acceptance bound.\u003c/li\u003e\n\u003cli\u003eAmplitude in dB: maximize with q = 10^((x-b)/20) and minimize with its reciprocal.\u003c/li\u003e\n\u003cli\u003eTarget normalization: q = 1/(1+abs(x-b)/s), where s is the declared physical scale. Signed or zero-valued operating points are not divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eUse \u003ccode\u003elayout\u003c/code\u003e scoring. First compute each metric's raw quality q from the worst paired condition, with raw area quality q_area = area_target / candidate_functional_area. Credit c_i = min(1, q_i) for every positively weighted metric, then compute S = 100 * product(c_i ** w_i). The weights sum to 1 and the score is bounded by 100. An improvement beyond one target cannot compensate for missing another target. Physical, extraction, or functional rejection scores zero; other missing or invalid measurements leave the score unknown, and zero-weight observations must also be valid. Reaching every positively weighted target scores 100; a feasible reference may score far below 100. Weights express quality tradeoffs, not acceptance bounds.\u003c/p\u003e\n\u003cp\u003eThe measurements below use the supplied SPICE node and source names. \u003ccode\u003ev(n)\u003c/code\u003e is a node voltage; \u003ccode\u003ei(V)\u003c/code\u003e is current flowing into a voltage source, so delivered power uses a negative sign. \u003ccode\u003edb(z)=20*log10(abs(z))\u003c/code\u003e; \u003ccode\u003emag/abs\u003c/code\u003e denote magnitude, and \u003ccode\u003ecph\u003c/code\u003e denotes continuous phase in radians. \u003ccode\u003efind\u003c/code\u003e, \u003ccode\u003ewhen\u003c/code\u003e, \u003ccode\u003efrom/to\u003c/code\u003e and \u003ccode\u003erise/fall\u003c/code\u003e follow the deck's interpolation, window and crossing conventions. SPICE suffixes p/n/u/m/meg/g mean pico/nano/micro/milli/mega/giga. Nested \u003ccode\u003eavg\u003c/code\u003e, \u003ccode\u003emin\u003c/code\u003e, \u003ccode\u003emax\u003c/code\u003e, \u003ccode\u003evecmin/vecmax\u003c/code\u003e and \u003ccode\u003ederiv\u003c/code\u003e represent window averages, extrema and sampled derivatives. Measure each operating condition independently, pair it with the source result under that condition, and take the worst paired quality within each metric group.\u003c/p\u003e\n\u003cp\u003eFor metrics declaring \u003ccode\u003esaturating_ratio\u003c/code\u003e, q = 2(b+s)/(b+x+2*s), using the quality anchor b and the positive scale s in the metric’s units. Equality to the anchor gives raw quality 1; improvements approach raw quality 2 but credited quality stays at 1. Normalize each condition before selecting the worst quality. These scales and targets do not add acceptance cutoffs.\u003c/p\u003e\n\u003cp\u003eThe functional voltage envelope is unipolar 0 to 1.3 V; reversed polarity or operation beyond the supplied rail is outside the regulator interface. The first and final unity crossings must retain the stable 0 to 180 degree negative-feedback phase-margin branch. Net supply consumption and headroom must be nonnegative for this non-boosting regulator. Magnitudes, absolute errors, ranges and physical crossing coordinates must represent their declared measurement domains; missing crossings remain measurement errors. These functional/domain bounds have explicit rationales in \u003ccode\u003ecase.toml\u003c/code\u003e. Their positive values remain quality objectives, with no minimum quality score or additional performance cutoff.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eDefinition / observation\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eQuality normalization\u003c/th\u003e\n\u003cth\u003eFunctional range\u003c/th\u003e\n\u003cth\u003eScale\u003c/th\u003e\n\u003cth\u003eDimension\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003ev(vout)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.3\u003c/td\u003e\n\u003ctd\u003e1.3\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebias_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003ev(nbias)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.3\u003c/td\u003e\n\u003ctd\u003e1.3\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003equiescent_a\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003e-i(VDD)-@iload[current]\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eA\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003ctd\u003esupply\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003e-v(vdd)*i(VDD)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003ctd\u003esupply\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edc_gain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: Value of \u003ccode\u003e(db((T))) at=0.01\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003emaximize / db20\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eunity_hz\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: Crossing coordinate where \u003ccode\u003e(db((T)))=0 fall=1\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eHz\u003c/td\u003e\n\u003ctd\u003emaximize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ephase_margin_deg\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: \u003ccode\u003e180+(find (180*cph((T))/pi) when (db((T)))=0 fall=1)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003edeg\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 180\u003c/td\u003e\n\u003ctd\u003e10\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efinal_unity_hz\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: Crossing coordinate where \u003ccode\u003e(db((T)))=0 fall=last\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eHz\u003c/td\u003e\n\u003ctd\u003emaximize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efinal_phase_margin_deg\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: \u003ccode\u003e180+(find (180*cph((T))/pi) when (db((T)))=0 fall=last)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003edeg\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 180\u003c/td\u003e\n\u003ctd\u003e10\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eminimum_return_distance\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: \u003ccode\u003evecmin((mag(1+(T))))\u003c/code\u003e; sweep \u003ccode\u003edec 300 0.01 1g\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003e1\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ereturn_phase_excursion_deg\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: \u003ccode\u003evecmax(abs(180*cph(1+(T))/pi))\u003c/code\u003e; sweep \u003ccode\u003edec 300 0.01 1g\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003edeg\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ehf_gain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: Maximum of \u003ccode\u003e(db((T))) from=200meg to=1g\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003eminimize / db20\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epsrr_1khz_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003ePSRR deck: \u003ccode\u003e20*log10(abs(VDD/VOUT))\u003c/code\u003e at 1 kHz for all four VDD/ILOAD DC combinations.\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003emaximize / db20\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epsrr_1mhz_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003ePSRR deck: \u003ccode\u003e20*log10(abs(VDD/VOUT))\u003c/code\u003e at 1 MHz for all four VDD/ILOAD DC combinations.\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003emaximize / db20\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eminimum_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Minimum of \u003ccode\u003ev(vout) from=2u to=18u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.3\u003c/td\u003e\n\u003ctd\u003e1.3\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emaximum_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Maximum of \u003ccode\u003ev(vout) from=2u to=18u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.3\u003c/td\u003e\n\u003ctd\u003e1.3\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003erecovery_load_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Maximum of \u003ccode\u003e(abs(v(vout)-1.0)) from=5u to=9.5u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e0.0005\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003erecovery_release_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Maximum of \u003ccode\u003e(abs(v(vout)-1.0)) from=13u to=17.5u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e0.0005\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emean_power_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Mean of \u003ccode\u003e(-v(vdd)*i(VDD)) from=2u to=18u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003ctd\u003esupply\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estartup_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Maximum of \u003ccode\u003e(abs(v(vout)-1.0)) from=25u to=30u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e0.0005\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estartup_peak_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Maximum of \u003ccode\u003ev(vout) from=0 to=30u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.3\u003c/td\u003e\n\u003ctd\u003e1.3\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estartup_minimum_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Minimum of \u003ccode\u003ev(vout) from=0 to=30u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e1.3\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eregulation_floor_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC: Crossing coordinate where \u003ccode\u003e(abs(v(vout)-1.0))=0.03 rise=1\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.3\u003c/td\u003e\n\u003ctd\u003e1.3\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eheadroom_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC sweep: \u003ccode\u003e(when (abs(v(vout)-1.0))=0.03 rise=1)-(find v(vout) when (abs(v(vout)-1.0))=0.03 rise=1)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e0.001\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eline_span_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC sweep: \u003ccode\u003e(max v(vout) from=1.3 to=1.2)-(min v(vout) from=1.3 to=1.2)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e0.0001\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eload_span_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC sweep: \u003ccode\u003e(max v(vout))-(min v(vout))\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e0.001\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efast_peak_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMaximum absolute deviation of transient VOUT from its initial DC operating-point value over 0–100 ns in the fast load-pulse deck.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … 1.3\u003c/td\u003e\n\u003ctd\u003e2.5e-05\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efast_tail_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eThe same absolute deviation from initial DC VOUT over 80–100 ns.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.3\u003c/td\u003e\n\u003ctd\u003e1.3\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eThe capability coefficient is \u003cstrong\u003e9\u003c/strong\u003e, independent of this task's reference-normalized score.\u003c/p\u003e\n\u003ch3 id=\"problem-quality-targets-and-weights\"\u003eQuality targets and weights\u003c/h3\u003e\n\u003cp\u003eThe area quality target is \u003cstrong\u003e112500 um2\u003c/strong\u003e. It is an integration budget, not a hard limit or a proven process minimum.\u003c/p\u003e\n\u003cp\u003eForty 51.64 um square MIM plates alone occupy 106667.584 um2, exceeding the former 70000 um2 goal. The 112500 um2 integration budget reserves 5832.416 um2 beyond plate area for enclosures, taps, 81 MOS fingers and routing; it is a compact allocation, not a proof of minimum area. Headroom carries 20%, load-step recovery 15%, load-release recovery 10%, startup error 15%, load span 15%, area 15% and minimum return-distance preservation 10%. Existing targets and normalization scales are retained. Small-pulse, PSRR, quiescent-current, line-span and repeated phase-margin summaries remain diagnostics with their functional requirements and source-paired observations intact.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003estability_margin_deg\u003c/code\u003e takes the worst source-paired quality across both first and final phase-margin observations and all four loop conditions, using the same 10-degree target-deviation scale. The original first/final functional requirements remain separately enforced. This grouped observation is diagnostic; minimum return distance carries the 10% stability weight. \u003ccode\u003estartup_error_v\u003c/code\u003e is scored across all eight supply/load/ramp combinations with a 5 mV goal. \u003ccode\u003efast_peak_v\u003c/code\u003e is measured diagnostically across all four fast-pulse conditions with a 250 uV goal; its 0–100 ns window is distinct from the large load-step recovery windows.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eQuality anchor\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eScale\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e112500\u003c/td\u003e\n\u003ctd\u003eum2\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.15\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eheadroom_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e0.02\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e0.001\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.2\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eline_span_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e0.001\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e0.0001\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eload_span_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e0.01\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e0.001\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.15\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epsrr_1khz_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003epaired source\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epsrr_1mhz_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003epaired source\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003erecovery_load_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e0.005\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e0.0005\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.15\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003erecovery_release_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e0.005\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e0.0005\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estartup_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e0.005\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e0.0005\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.15\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eminimum_return_distance\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003epaired source\u003c/td\u003e\n\u003ctd\u003e1\u003c/td\u003e\n\u003ctd\u003e1\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efast_peak_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e0.00025\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e2.5e-05\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003equiescent_a\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003epaired source\u003c/td\u003e\n\u003ctd\u003eA\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estability_margin_deg\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003epaired source\u003c/td\u003e\n\u003ctd\u003edeg\u003c/td\u003e\n\u003ctd\u003e10\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eZero-weight observations: \u003ccode\u003eline_span_v\u003c/code\u003e, \u003ccode\u003eoutput_v\u003c/code\u003e, \u003ccode\u003eregulation_floor_v\u003c/code\u003e, \u003ccode\u003epsrr_1khz_db\u003c/code\u003e, \u003ccode\u003epsrr_1mhz_db\u003c/code\u003e, \u003ccode\u003estartup_minimum_v\u003c/code\u003e, \u003ccode\u003estartup_peak_v\u003c/code\u003e, \u003ccode\u003efinal_phase_margin_deg\u003c/code\u003e, \u003ccode\u003ephase_margin_deg\u003c/code\u003e, \u003ccode\u003ereturn_phase_excursion_deg\u003c/code\u003e, \u003ccode\u003edc_gain_db\u003c/code\u003e, \u003ccode\u003efast_peak_v\u003c/code\u003e, \u003ccode\u003efast_tail_v\u003c/code\u003e, \u003ccode\u003efinal_unity_hz\u003c/code\u003e, \u003ccode\u003ehf_gain_db\u003c/code\u003e, \u003ccode\u003emaximum_v\u003c/code\u003e, \u003ccode\u003eminimum_v\u003c/code\u003e, \u003ccode\u003eunity_hz\u003c/code\u003e, \u003ccode\u003ebias_v\u003c/code\u003e, \u003ccode\u003equiescent_a\u003c/code\u003e, \u003ccode\u003emean_power_w\u003c/code\u003e, \u003ccode\u003epower_w\u003c/code\u003e, \u003ccode\u003estability_margin_deg\u003c/code\u003e. Every original functional requirement and measurement remains enforced.\u003c/p\u003e\n\u003cp\u003eThe targets affect continuous quality only. A complete feasible reference may miss them; there is no minimum qualifying score.\u003c/p\u003e\n\u003ch2 id=\"problem-tools-and-submission\"\u003eTools and Submission\u003c/h2\u003e\n\u003cp\u003eSoft solve budget: \u003cstrong\u003e1.5 hours\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eDiscover inputs, resources and feedback through \u003ccode\u003e/protocol/task.json\u003c/code\u003e (including its \u003ccode\u003eresources\u003c/code\u003e field) and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e. Use supplied IHP\nprimitives, KLayout, Magic and ngspice. Write \u003ccode\u003e/workspace/output/final.gds\u003c/code\u003e\nand explicitly submit through the harness. Source records, host configuration\nand reference layouts stay outside standard solver inputs.\u003c/p\u003e\n\u003ch3 id=\"problem-solve-workflow\"\u003eSolve workflow\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eRead the declared circuit and materials, \u003ccode\u003e/protocol/task.json\u003c/code\u003e for paths, constraints and reviewed resources, and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e for capabilities and helper commands. Task inputs under \u003ccode\u003e/task\u003c/code\u003e and resources under \u003ccode\u003e/resources\u003c/code\u003e are read-only; construct the layout in \u003ccode\u003e/workspace\u003c/code\u003e with the declared tools. With layout MCP, paths and commands refer to the remote EDA workspace. Create your own implementation with real devices, interconnect and pins, using your own tool loop without delegating to other agents; reference layouts and author code are not solver inputs.\u003c/li\u003e\n\u003cli\u003eInspect \u003ccode\u003eresources.external\u003c/code\u003e before using external tools. Each command starts a fresh shell: when tool modules are declared, source \u003ccode\u003e/usr/share/Modules/init/bash\u003c/code\u003e and load the selected tool's modules; export its declared \u003ccode\u003etool_environment\u003c/code\u003e settings in that same command. Repeat as needed and use batch or headless operation. Local manuals, command references, and release notes may be available within the declared EDA installation and PDK resource directories. Locate these resources through \u003ccode\u003e/protocol/task.json\u003c/code\u003e and consult the documentation for the installed tool version when diagnosing unfamiliar syntax or tool failures.\u003c/li\u003e\n\u003cli\u003eGenerate an initial candidate and submit a snapshot early. When \u003ccode\u003eprocess-feedback\u003c/code\u003e is available, check the current GDS with layout MCP \u003ccode\u003echeck\u003c/code\u003e or \u003ccode\u003epython -I /protocol/process_check.py\u003c/code\u003e before the final submission. This runs the final evaluator's complete plan and returns engineering diagnostics and candidate measurements, without scores or normalized quality factors. Checks have no count limit and consume the same wall-clock budget. Inspect the physical and functional results and all scored metrics; successful tool execution alone does not establish requirement satisfaction. Read paginated diagnostics with \u003ccode\u003ereport\u003c/code\u003e when using MCP. Local exploratory checks do not replace this complete check.\u003c/li\u003e\n\u003cli\u003eUse the remaining time for measured improvements to the declared quality objectives. Identify the limiting scored metrics, make targeted layout changes, regenerate and check the candidate, and compare measurements with the previous candidate and the stated scoring targets and trade-offs. Preserve the best valid candidate and revert changes that worsen the overall objective. Repeat while time and useful improvements remain; passing validity checks alone is not a stopping condition.\u003c/li\u003e\n\u003cli\u003eStop optimization when the budget expires, all declared quality objectives are achieved, or measured trials support convergence. If stopping early, explain the changes tried, the metric comparisons and the remaining limitations. Track remaining time through session status. At soft-budget expiry, finish or cancel already-started work and submit immediately; do not start another command, check or optimization round. If an MCP execution is running, use \u003ccode\u003epoll\u003c/code\u003e with its \u003ccode\u003eexecution_id\u003c/code\u003e and the returned \u003ccode\u003enext_offset\u003c/code\u003e as \u003ccode\u003eoffset\u003c/code\u003e until completion, or cancel it and wait for it to stop.\u003c/li\u003e\n\u003cli\u003eFinish or cancel outstanding work, restore your best candidate to the declared output path, and explicitly submit it before ending the session. With layout MCP \u003ccode\u003esubmit\u003c/code\u003e, remove the \u003ccode\u003e/workspace/\u003c/code\u003e prefix from \u003ccode\u003eoutput.path\u003c/code\u003e; with the container interface, run \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e. Wait for the receipt: only the last accepted snapshot is judged, and writing a file alone is not submission. Acceptance confirms delivery; the framework independently evaluates validity and quality after the session.\u003c/li\u003e\n\u003c/ol\u003e\n12:T3b34,\u003cp\u003eArtifact, geometry, DRC, LVS and declared functional requirements must pass. Parasitic extraction is also mandatory: it must produce a complete, electrically consistent netlist usable by the required post-layout simulations. A completed candidate rejection scores zero; infrastructure errors do not establish candidate failure.\u003c/p\u003e\n\u003cp\u003eFor \u003ccode\u003elayout\u003c/code\u003e scoring, cap every positively weighted raw quality at 1 before aggregation; the score ranges from 0 to 100. Reaching every weighted target scores 100, and no minimum score is required for validity.\u003c/p\u003e\n\u003cp\u003ePhysical checks and the declared functional bounds must pass. Quality scoring imposes no fixed degradation allowance. Each \u003ccode\u003esource_*\u003c/code\u003e job and its corresponding candidate extracted circuit use exactly the same testbench, model resources, parameters, loads and measurement windows. Independent source observations remain required evidence. The explicit quality targets below supply scoring anchors; otherwise the paired source value is used. Reports retain every paired result.\u003c/p\u003e\n\u003cp\u003eLet x be the post-layout measurement and b the declared quality target, or the same-condition source measurement when no target is declared:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eRatio normalization: maximize with q = x/b and minimize with q = b/x. When a numerical scale s is declared, use (x+s)/(b+s) and its reciprocal, respectively. The scale handles zero values as a normalization floor; it is neither an allowed degradation nor an acceptance bound.\u003c/li\u003e\n\u003cli\u003eAmplitude in dB: maximize with q = 10^((x-b)/20) and minimize with its reciprocal.\u003c/li\u003e\n\u003cli\u003eTarget normalization: q = 1/(1+abs(x-b)/s), where s is the declared physical scale. Signed or zero-valued operating points are not divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eUse \u003ccode\u003elayout\u003c/code\u003e scoring. First compute each metric's raw quality q from the worst paired condition, with raw area quality q_area = area_target / candidate_functional_area. Credit c_i = min(1, q_i) for every positively weighted metric, then compute S = 100 * product(c_i ** w_i). The weights sum to 1 and the score is bounded by 100. An improvement beyond one target cannot compensate for missing another target. Physical, extraction, or functional rejection scores zero; other missing or invalid measurements leave the score unknown, and zero-weight observations must also be valid. Reaching every positively weighted target scores 100; a feasible reference may score far below 100. Weights express quality tradeoffs, not acceptance bounds.\u003c/p\u003e\n\u003cp\u003eThe measurements below use the supplied SPICE node and source names. \u003ccode\u003ev(n)\u003c/code\u003e is a node voltage; \u003ccode\u003ei(V)\u003c/code\u003e is current flowing into a voltage source, so delivered power uses a negative sign. \u003ccode\u003edb(z)=20*log10(abs(z))\u003c/code\u003e; \u003ccode\u003emag/abs\u003c/code\u003e denote magnitude, and \u003ccode\u003ecph\u003c/code\u003e denotes continuous phase in radians. \u003ccode\u003efind\u003c/code\u003e, \u003ccode\u003ewhen\u003c/code\u003e, \u003ccode\u003efrom/to\u003c/code\u003e and \u003ccode\u003erise/fall\u003c/code\u003e follow the deck's interpolation, window and crossing conventions. SPICE suffixes p/n/u/m/meg/g mean pico/nano/micro/milli/mega/giga. Nested \u003ccode\u003eavg\u003c/code\u003e, \u003ccode\u003emin\u003c/code\u003e, \u003ccode\u003emax\u003c/code\u003e, \u003ccode\u003evecmin/vecmax\u003c/code\u003e and \u003ccode\u003ederiv\u003c/code\u003e represent window averages, extrema and sampled derivatives. Measure each operating condition independently, pair it with the source result under that condition, and take the worst paired quality within each metric group.\u003c/p\u003e\n\u003cp\u003eFor metrics declaring \u003ccode\u003esaturating_ratio\u003c/code\u003e, q = 2(b+s)/(b+x+2*s), using the quality anchor b and the positive scale s in the metric’s units. Equality to the anchor gives raw quality 1; improvements approach raw quality 2 but credited quality stays at 1. Normalize each condition before selecting the worst quality. These scales and targets do not add acceptance cutoffs.\u003c/p\u003e\n\u003cp\u003eThe functional voltage envelope is unipolar 0 to 1.3 V; reversed polarity or operation beyond the supplied rail is outside the regulator interface. The first and final unity crossings must retain the stable 0 to 180 degree negative-feedback phase-margin branch. Net supply consumption and headroom must be nonnegative for this non-boosting regulator. Magnitudes, absolute errors, ranges and physical crossing coordinates must represent their declared measurement domains; missing crossings remain measurement errors. These functional/domain bounds have explicit rationales in \u003ccode\u003ecase.toml\u003c/code\u003e. Their positive values remain quality objectives, with no minimum quality score or additional performance cutoff.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eDefinition / observation\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eQuality normalization\u003c/th\u003e\n\u003cth\u003eFunctional range\u003c/th\u003e\n\u003cth\u003eScale\u003c/th\u003e\n\u003cth\u003eDimension\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003ev(vout)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.3\u003c/td\u003e\n\u003ctd\u003e1.3\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebias_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003ev(nbias)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.3\u003c/td\u003e\n\u003ctd\u003e1.3\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003equiescent_a\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003e-i(VDD)-@iload[current]\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eA\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003ctd\u003esupply\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003e-v(vdd)*i(VDD)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003ctd\u003esupply\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edc_gain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: Value of \u003ccode\u003e(db((T))) at=0.01\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003emaximize / db20\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eunity_hz\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: Crossing coordinate where \u003ccode\u003e(db((T)))=0 fall=1\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eHz\u003c/td\u003e\n\u003ctd\u003emaximize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ephase_margin_deg\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: \u003ccode\u003e180+(find (180*cph((T))/pi) when (db((T)))=0 fall=1)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003edeg\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 180\u003c/td\u003e\n\u003ctd\u003e10\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efinal_unity_hz\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: Crossing coordinate where \u003ccode\u003e(db((T)))=0 fall=last\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eHz\u003c/td\u003e\n\u003ctd\u003emaximize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efinal_phase_margin_deg\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: \u003ccode\u003e180+(find (180*cph((T))/pi) when (db((T)))=0 fall=last)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003edeg\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 180\u003c/td\u003e\n\u003ctd\u003e10\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eminimum_return_distance\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: \u003ccode\u003evecmin((mag(1+(T))))\u003c/code\u003e; sweep \u003ccode\u003edec 300 0.01 1g\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003e1\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ereturn_phase_excursion_deg\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: \u003ccode\u003evecmax(abs(180*cph(1+(T))/pi))\u003c/code\u003e; sweep \u003ccode\u003edec 300 0.01 1g\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003edeg\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ehf_gain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: Maximum of \u003ccode\u003e(db((T))) from=200meg to=1g\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003eminimize / db20\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epsrr_1khz_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003ePSRR deck: \u003ccode\u003e20*log10(abs(VDD/VOUT))\u003c/code\u003e at 1 kHz for all four VDD/ILOAD DC combinations.\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003emaximize / db20\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epsrr_1mhz_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003ePSRR deck: \u003ccode\u003e20*log10(abs(VDD/VOUT))\u003c/code\u003e at 1 MHz for all four VDD/ILOAD DC combinations.\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003emaximize / db20\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eminimum_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Minimum of \u003ccode\u003ev(vout) from=2u to=18u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.3\u003c/td\u003e\n\u003ctd\u003e1.3\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emaximum_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Maximum of \u003ccode\u003ev(vout) from=2u to=18u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.3\u003c/td\u003e\n\u003ctd\u003e1.3\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003erecovery_load_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Maximum of \u003ccode\u003e(abs(v(vout)-1.0)) from=5u to=9.5u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e0.0005\u003c/td\u003e\n\u003ctd\u0  final phase-margin observations and all four loop conditions, using the same 10-degree target-deviation scale. The original first/final functional requirements remain separately enforced. This grouped observation is diagnostic; minimum return distance carries the 10% stability weight. \u003ccode\u003estartup_error_v\u003c/code\u003e is scored across all eight supply/load/ramp combinations with a 5 mV goal. \u003ccode\u003efast_peak_v\u003c/code\u003e is measured diagnostically across all four fast-pulse conditions with a 250 uV goal; its 0–100 ns window is distinct from the large load-step recovery windows.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eQuality anchor\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eScale\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e112500\u003c/td\u003e\n\u003ctd\u003eum2\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.15\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eheadroom_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e0.02\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e0.001\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.2\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eline_span_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e0.001\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e0.0001\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eload_span_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e0.01\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e0.001\u003c/td\u003e\n\u003ctd style=\"text-align: \u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003equiescent_a\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003epaired source\u003c/td\u003e\n\u003ctd\u003eA\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estability_margin_deg\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003epaired source\u003c/td\u003e\n\u003ctd\u003edeg\u003c/td\u003e\n\u003ctd\u003e10\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eZero-weight observations: \u003ccode\u003eline_span_v\u003c/code\u003e, \u003ccode\u003eoutput_v\u003c/code\u003e, \u003ccode\u003eregulation_floor_v\u003c/code\u003e, \u003ccode\u003epsrr_1khz_db\u003c/code\u003e, \u003ccode\u003epsrr_1mhz_db\u003c/code\u003e, \u003ccode\u003estartup_minimum_v\u003c/code\u003e, \u003ccode\u003estartup_peak_v\u003c/code\u003e, \u003ccode\u003efinal_phase_margin_deg\u003c/code\u003e, \u003ccode\u003ephase_margin_deg\u003c/code\u003e, \u003ccode\u003ereturn_phase_excursion_deg\u003c/code\u003e, \u003ccode\u003edc_gain_db\u003c/code\u003e, \u003ccode\u003efast_peak_v\u003c/code\u003e, \u003ccode\u003efast_tail_v\u003c/code\u003e, \u003ccode\u003efinal_unity_hz\u003c/code\u003e, \u003ccode\u003ehf_gain_db\u003c/code\u003e, \u003ccode\u003emaximum_v\u003c/code\u003e, \u003ccode\u003eminimum_v\u003c/code\u003e, \u003ccode\u003eunity_hz\u003c/code\u003e, \u003ccode\u003ebias_v\u003c/code\u003e, \u003ccode\u003equiescent_a\u003c/code\u003e, \u003ccode\u003emean_power_w\u003c/code\u003e, \u003ccode\u003epower_w\u003c/code\u003e, \u003ccode\u003estability_margin_deg\u003c/code\u003e. Every original functional requirement and measurement remains enforced.\u003c/p\u003e\n\u003cp\u003eThe targets affect continuous quality only. A complete feasible reference may miss them; there is no minimum qualifying score.\u003c/p\u003e\n13:T585,\u003cul\u003e\n\u003cli\u003e\u003ccode\u003ematerials/circuit.cdl\u003c/code\u003e: authoritative native LVS circuit.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ematerials/circuit.spice\u003c/code\u003e: equivalent simulator representation.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ematerials/testbench.spice\u003c/code\u003e: DC bias, bilateral loop measurements and load steps.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ematerials/startup.spice\u003c/code\u003e: zero-state resistive-load startup.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ematerials/sweeps.spice\u003c/code\u003e: DC line/load and regulation-headroom sweeps.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ematerials/psrr.spice\u003c/code\u003e: closed-loop small-signal supply rejection.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ematerials/fast.spice\u003c/code\u003e: short, finely resolved load-impulse response.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eOrdered ports: \u003ccode\u003evdd vout vss nbias vref fb sense\u003c/code\u003e. VDD/VSS are supply/return;\nVOUT is output; NBIAS receives the supply-fed current; VREF receives the 0.5 V\nreference. FB is the physical divider junction and SENSE is the amplifier's\nfeedback-input gate. Connect SENSE externally to FB through the zero-volt\nmeasurement source. This external link replaces the raw VLP's measurement role;\nit is not a manufactured voltage source. The relocated break exposes the\nactual input/divider boundary; the upper divider still connects to output.\nPMOS bodies connect through the VDD well tap; NMOS/poly bodies through the VSS\ntap. Preserve every W/L/m, body connection and physical passive. Equivalent\nparallel finger arrangements require native LVS and every other check to pass.\u003c/p\u003e\n14:T73d,\u003cp\u003eImplement \u003ccode\u003eldo_008_fer_mirror_ota\u003c/code\u003e: a mirror-loaded NMOS-input error amplifier,\ndiode/tail bias network, PMOS pass device, feedback divider and series R/C\ncompensation. Preserve all seven source MOS groups as 81 physical fingers,\n40 MIM units and three high-poly resistors, with explicit substrate/well taps.\nThe internal compensation and divider remain part of the DUT.\u003c/p\u003e\n\u003cp\u003eMOS dimensions and multiplicities are unchanged from the fixed IHP binding.\nThe source 160 pF capacitor becomes forty 51.64 um square MIM units, nominally\n160.331872 pF total. The source 2 kohm compensation resistor becomes one\nW=1 um / L=1.325 um \u003ccode\u003erhigh\u003c/code\u003e; each source 9 kohm divider resistor becomes one\nW=1 um / L=6.235 um \u003ccode\u003erhigh\u003c/code\u003e, with m=1 and b=0. Source capacitor PLUS is\n\u003ccode\u003eczero\u003c/code\u003e, MINUS is \u003ccode\u003evout\u003c/code\u003e; the series resistor connects \u003ccode\u003eegate\u003c/code\u003e to \u003ccode\u003eczero\u003c/code\u003e.\nDivider upper/lower connect \u003ccode\u003evout–fb\u003c/code\u003e and \u003ccode\u003efb–vss\u003c/code\u003e. Every passive stays physical.\u003c/p\u003e\n\u003cp\u003eThe external source bias is unchanged at 20 uA from VDD to NBIAS. The external\nreference is deliberately changed from the source 0.6 V to \u003cstrong\u003e0.5 V\u003c/strong\u003e, giving\na nominal 1.0 V output and defined headroom at 1.2/1.3 V supply. There is no\nseparate internal or external COUT; compensation still provides physical\noutput-connected capacitance. This is not a claim of zero internal storage.\u003c/p\u003e\n\u003ch3\u003eOptimization objective\u003c/h3\u003e\n\u003cp\u003eMaximize the declared quality score within the solve budget while satisfying all physical and necessary functional requirements. The first passing DRC, LVS and required electrical checks establish a feasible baseline. Continue improving the scored metrics from that baseline; a passing check or \u003ccode\u003etask_success = true\u003c/code\u003e does not mean that the quality objectives have been achieved.\u003c/p\u003e\n15:T1116,\u003cp\u003eUse typical IHP LV MOS, MIM and resistor models at 27 C. Main conditions are\nall combinations of VDD=1.2/1.3 V and initial load 0.1/0.5 mA. The current\nload doubles at 2–2.02 us and returns at 10.02–10.04 us. Run to 18 us with\n5 ns maximum step, Gear order 2, \u003ccode\u003ershunt=1e12\u003c/code\u003e, \u003ccode\u003ereltol=1e-5\u003c/code\u003e, \u003ccode\u003eabstol=1e-14\u003c/code\u003e\nand \u003ccode\u003evntol=1e-8\u003c/code\u003e. Startup and fast tests use the same accuracy tolerances.\u003c/p\u003e\n\u003cp\u003eFor AC, independent supply/reference/load sources have no AC excitation.\nPerform two sweeps, 0.01 Hz–1 GHz at 300 points/decade, at the same operating\npoint. VPROBE is oriented SENSE→FB and IINJ from ground→SENSE. Both have\nzero DC value and are ordinary external test sources. First set VPROBE AC=1 V,\nIINJ AC=0; second set VPROBE AC=0, IINJ AC=1 A. The 1 A is only a normalized\nlinear AC excitation, not a physical large-signal load.\u003c/p\u003e\n\u003cp\u003eLet B=−I(VPROBE)/1 V and D=V(SENSE)/1 V from the first sweep; A=−I(VPROBE)/1 A\nand C=V(SENSE)/1 A from the second. With delta=AD−BC, define\n\u003ccode\u003eT=(2*delta−A+D)/(1−2*delta+A−D)\u003c/code\u003e. This bilateral two-port return ratio includes\nboth directional transmissions and port loading. The old voltage-only\n\u003ccode\u003e−V(FB)/V(SENSE)\u003c/code\u003e is not the accepted loop metric. Reset the circuit before\ntransient analysis; neither AC experiment changes its DC or transient topology.\u003c/p\u003e\n\u003cp\u003eThe separate supply-rejection suite uses the same four DC operating points\n(VDD=1.2/1.3 V and ILOAD=0.1/0.5 mA) at 27 C. VDD receives a normalized 1 V\nsmall-signal AC excitation around each DC value; VREF, IBIAS and ILOAD have zero\nAC excitation. VPROBE remains a zero-volt connection with zero AC magnitude,\nand IINJ is zero, so the feedback loop remains closed. Sweep 10 Hz–10 MHz at\n300 points/decade. At 1 kHz and 1 MHz, measure\n\u003ccode\u003ePSRR=20*log10(abs(VDD/VOUT))\u003c/code\u003e in dB. This is source-paired small-signal\nrejection for the declared external bias fixture, not large-signal ripple\nimmunity or rejection of an internal bias generator.\u003c/p\u003e\n\u003cp\u003eThis measures the declared external feedback loop with the internal circuit\nretained. It is not an exhaustive pole proof for all internal device loops or\nan RF/model-validity claim beyond the declared tests. Both first and final crossing phase margins must lie in [0, 180] degrees.\nThe full-sweep return-distance and return-phase metrics have only nonnegative\ndomain bounds; high-frequency gain is unbounded. They affect continuous\nquality without adding a stability acceptance screen.\u003c/p\u003e\n\u003cp\u003eStartup uses 1/10 kohm loads and simultaneous linear supply/reference/bias\nramps from zero over 1/10 us: eight combinations including both supplies.\nRun with \u003ccode\u003euic\u003c/code\u003e, no internal-node initial conditions, to 30 us with 10 ns\nmaximum step. Startup qualification is resistive-load and synchronized-ramp\nonly, not arbitrary reference sequencing or constant-current startup.\u003c/p\u003e\n\u003cp\u003eDC sweeps: supply decreases from 1.3 to 0.8 V by 1 mV at 0.1/1 mA; line\nspan is measured over 1.2–1.3 V. Regulation floor is the first increasing\ncrossing of \u003ccode\u003eabs(VOUT−1.0)=0.03 V\u003c/code\u003e. Headroom is supply \u003cstrong\u003eminus actual output at\nthat crossing\u003c/strong\u003e, not supply minus the nominal target. The lower supply sweep\nis a boundary probe, not an extended qualified operating range. Separately\nsweep load 0.1–1 mA by 10 uA at each qualified supply, retaining both endpoints.\u003c/p\u003e\n\u003cp\u003eFast conditions use the four main DC biases and a +1 uA load pulse beginning\nat 1 ns, 5 ps rise/fall and 1 ns high time. Run 100 ns with 25 ps maximum step.\nIt probes fast recovery around the solved operating point without modifying\ncompensation, adding an output capacitor or clamping an internal node.\u003c/p\u003e\n\u003cp\u003eTransient extrema and AC sweep screens use the saved in-window samples;\nDC crossing locations and mean power use interpolation/integration. Numerical\nqualification also checks interpolated recovery-window endpoints.\u003c/p\u003e\n\u003cp\u003eAdditional upstream application fixtures use a 1 uF output capacitor: a 0.1-to-1 mA load step at 5 us with 10 ns edges and a 30 us stop, plus closed-loop supply rejection at 1 kHz. Both retain the declared 1.2 V LV supply, 20 uA external bias and 0.5 V reference. Their observations are source-paired diagnostics, separate from the small-capacitance and startup stress tests. They introduce no new performance rejection threshold.\u003c/p\u003e\n16:T10ac,\u003cp\u003eSoft solve budget: \u003cstrong\u003e1.5 hours\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eDiscover inputs, resources and feedback through \u003ccode\u003e/protocol/task.json\u003c/code\u003e (including its \u003ccode\u003eresources\u003c/code\u003e field) and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e. Use supplied IHP\nprimitives, KLayout, Magic and ngspice. Write \u003ccode\u003e/workspace/output/final.gds\u003c/code\u003e\nand explicitly submit through the harness. Source records, host configuration\nand reference layouts stay outside standard solver inputs.\u003c/p\u003e\n\u003ch3\u003eSolve workflow\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eRead the declared circuit and materials, \u003ccode\u003e/protocol/task.json\u003c/code\u003e for paths, constraints and reviewed resources, and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e for capabilities and helper commands. Task inputs under \u003ccode\u003e/task\u003c/code\u003e and resources under \u003ccode\u003e/resources\u003c/code\u003e are read-only; construct the layout in \u003ccode\u003e/workspace\u003c/code\u003e with the declared tools. With layout MCP, paths and commands refer to the remote EDA workspace. Create your own implementation with real devices, interconnect and pins, using your own tool loop without delegating to other agents; reference layouts and author code are not solver inputs.\u003c/li\u003e\n\u003cli\u003eInspect \u003ccode\u003eresources.external\u003c/code\u003e before using external tools. Each command starts a fresh shell: when tool modules are declared, source \u003ccode\u003e/usr/share/Modules/init/bash\u003c/code\u003e and load the selected tool's modules; export its declared \u003ccode\u003etool_environment\u003c/code\u003e settings in that same command. Repeat as needed and use batch or headless operation. Local manuals, command references, and release notes may be available within the declared EDA installation and PDK resource directories. Locate these resources through \u003ccode\u003e/protocol/task.json\u003c/code\u003e and consult the documentation for the installed tool version when diagnosing unfamiliar syntax or tool failures.\u003c/li\u003e\n\u003cli\u003eGenerate an initial candidate and submit a snapshot early. When \u003ccode\u003eprocess-feedback\u003c/code\u003e is available, check the current GDS with layout MCP \u003ccode\u003echeck\u003c/code\u003e or \u003ccode\u003epython -I /protocol/process_check.py\u003c/code\u003e before the final submission. This runs the final evaluator's complete plan and returns engineering diagnostics and candidate measurements, without scores or normalized quality factors. Checks have no count limit and consume the same wall-clock budget. Inspect the physical and functional results and all scored metrics; successful tool execution alone does not establish requirement satisfaction. Read paginated diagnostics with \u003ccode\u003ereport\u003c/code\u003e when using MCP. Local exploratory checks do not replace this complete check.\u003c/li\u003e\n\u003cli\u003eUse the remaining time for measured improvements to the declared quality objectives. Identify the limiting scored metrics, make targeted layout changes, regenerate and check the candidate, and compare measurements with the previous candidate and the stated scoring targets and trade-offs. Preserve the best valid candidate and revert changes that worsen the overall objective. Repeat while time and useful improvements remain; passing validity checks alone is not a stopping condition.\u003c/li\u003e\n\u003cli\u003eStop optimization when the budget expires, all declared quality objectives are achieved, or measured trials support convergence. If stopping early, explain the changes tried, the metric comparisons and the remaining limitations. Track remaining time through session status. At soft-budget expiry, finish or cancel already-started work and submit immediately; do not start another command, check or optimization round. If an MCP execution is running, use \u003ccode\u003epoll\u003c/code\u003e with its \u003ccode\u003eexecution_id\u003c/code\u003e and the returned \u003ccode\u003enext_offset\u003c/code\u003e as \u003ccode\u003eoffset\u003c/code\u003e until completion, or cancel it and wait for it to stop.\u003c/li\u003e\n\u003cli\u003eFinish or cancel outstanding work, restore your best candidate to the declared output path, and explicitly submit it before ending the session. With layout MCP \u003ccode\u003esubmit\u003c/code\u003e, remove the \u003ccode\u003e/workspace/\u003c/code\u003e prefix from \u003ccode\u003eoutput.path\u003c/code\u003e; with the container interface, run \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e. Wait for the receipt: only the last accepted snapshot is judged, and writing a file alone is not submission. Acceptance confirms delivery; the framework independently evaluates validity and quality after the session.\u003c/li\u003e\n\u003c/ol\u003e\n6:[\"$\",\"$8\",null,{\"fallback\":[\"$\",\"p\",null,{\"children\":\"Loading published evidence…\"}],\"children\":[\"$\",\"$L10\",null,{\"task\":{\"case_path\":\"tasks/ihp-sg13g2/analog-db/cases/ldo_008_fer_mirror_ota
