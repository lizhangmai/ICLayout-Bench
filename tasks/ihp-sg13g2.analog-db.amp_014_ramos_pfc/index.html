ndefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L5\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[\"$L6\",[[\"$\",\"script\",\"script-0\",{\"src\":\"/ICLayout-Bench/_next/static/chunks/27jip_2vcvnd5.js\",\"async\":true,\"nonce\":\"$undefined\"}]],[\"$\",\"$L7\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.MetadataOutlet\",\"children\":\"$@9\"}]}]]}],{},null,false,null]},null,false,\"$a\"]},null,false,null],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Lb\",null,{\"children\":\"$Lc\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Ld\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.Metadata\",\"children\":\"$Le\"}]}]}],null]}],false]],\"m\":\"$undefined\",\"G\":[\"$f\",[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/ICLayout-Bench/_next/static/chunks/3sa54_ghi1h2h.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]]],\"S\":true,\"h\":null,\"r\":\"$undefined\",\"s\":\"$undefined\",\"a\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"2hqB741EA4j7xWQVg6hu-\"}\n10:I[1186,[\"/ICLayout-Bench/_next/static/chunks/2h60meymns2z5.js\",\"/ICLayout-Bench/_next/static/chunks/27jip_2vcvnd5.js\"],\"default\"]\na:C\n11:T4c60,\u003ch1 id=\"problem-ramos-pfc-three-stage-amplifier-layout-task\"\u003eRamos PFC Three-Stage Amplifier Layout Task\u003c/h1\u003e\n\u003ch2 id=\"problem-objective\"\u003eObjective\u003c/h2\u003e\n\u003cp\u003eImplement \u003ccode\u003eamp_014_ramos_pfc\u003c/code\u003e with the supplied fixed topology and dimensions. The PMOS input pair drives the cascoded NMOS branches at dm_2/net063; the voutn mirror produces net050. XM10 and the XM21/XM22 mirror drive net049, while XM11/XM23 drive the single-ended output. Both compensation paths remain: 63 pF from net050 to vout and 25 pF from net050 to net049. The vb3/vb4 bias network is retained.\nDo not replace the circuit, delete compensation, or add a servo. The circuit contains 24 logical MOS groups with the upstream W, L, multiplicity\nand four-terminal connections. PMOS groups XM8 and XM9 both have source and body\non net31; other PMOS bodies connect to vdd, and NMOS bodies connect to vss.\u003c/p\u003e\n\u003ch3 id=\"problem-optimization-objective\"\u003eOptimization objective\u003c/h3\u003e\n\u003cp\u003eMaximize the declared quality score within the solve budget while satisfying all physical and necessary functional requirements. The first passing DRC, LVS and required electrical checks establish a feasible baseline. Continue improving the scored metrics from that baseline; a passing check or \u003ccode\u003etask_success = true\u003c/code\u003e does not mean that the quality objectives have been achieved.\u003c/p\u003e\n\u003ch2 id=\"problem-inputs-and-interface\"\u003eInputs and Interface\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003ematerials/circuit.cdl\u003c/code\u003e is the authoritative logical circuit with native PDK model bindings, \u003ccode\u003ematerials/circuit.spice\u003c/code\u003e its simulation representation, \u003ccode\u003ematerials/testbench.spice\u003c/code\u003e defines closed-loop observations, and \u003ccode\u003ematerials/ac.spice\u003c/code\u003e defines balanced differential AC excitation, and \u003ccode\u003ematerials/stability.spice\u003c/code\u003e defines the two-injection external-loop experiment. Ordered ports are \u003ccode\u003evss vdd vinn vinp vout net1\u003c/code\u003e: ground, supply, negative/positive inputs, single-ended output and an external bias-current pull-down. Bias, input drive, feedback connections and loads are external test fixtures. Implement the compensation capacitors and physical body contacts. Body contacts are layout connectivity and are not additional logical circuit devices.\u003c/p\u003e\n\u003ch2 id=\"problem-operating-conditions\"\u003eOperating Conditions\u003c/h2\u003e\n\u003cp\u003eIHP SG13G2, nominal TT/typical, 27 C, supply 1.5 V, input reference 0.4 V,\nexternal current sink 2.4e-05 A to vss, and 5, 10 and 20 pF output loads, with the complete source/candidate experiments repeated at each load. Use the fixed IHP LV binding at 1.5 V, adapting the authored 1.8 V stimulus to the LV process rail; retain its bias current and input reference. Round W/L to 5 nm (the supplied integer-micrometre sizes are unchanged).\nThe closed-loop deck ties vinn directly to vout, drives vinp with a +100 mV pulse\nstarting at 20 us (100 ns rise/fall, 80 us high duration), and runs to 200 us with\n10 ns maximum steps, Gear order 2, reltol=1e-5, abstol=1 pA, vntol=10 nV.\nTransient starts from the solved DC point; this is not a zero-state supply-ramp\nstartup test. High and return windows are 80–100 and 180–200 us.\u003c/p\u003e\n\u003cp\u003eAC sweeps 200 points per decade from 1 Hz to 1 GHz. The differential-mode deck retains output DC feedback through a 1 TH inductor and isolates the bias node from AC through a 1 F capacitor to ground; vinp/vinn use balanced +0.5/-0.5 V small-signal excitation. Input common-mode residual amplitude and DC feedback error must both be \u0026lt;=1 uV. These are external small-signal bias fixtures, not physical compensation; an independent closed-loop deck measures actual follower response and does not call a voltage-transfer estimate a loop return ratio.\u003c/p\u003e\n\u003ch2 id=\"problem-physical-requirements\"\u003ePhysical Requirements\u003c/h2\u003e\n\u003cp\u003eSupply a GDS \u0026lt;=64 MiB with top cell \u003ccode\u003eamp_014_ramos_pfc\u003c/code\u003e, within 20000 by 2000 um\n(the task's artifact-size/outline bounds). Native DRC, strict named-interface LVS\nand functional-area measurement must pass; no marker waivers apply. Preserve\nMOS models, gate lengths, parallel-equivalent widths (W*m), logical body connections\nand the two native compensation-capacitor bindings. Electrically equivalent unit\narrays, multiple gate fingers and shared diffusion are allowed when native LVS\nverifies them. Sharing a well is allowed only for bodies on the same logical net.\nPhysically connect each well/substrate region to its declared body net through\nDRC-compliant contacts; contact count, placement and geometry are layout choices.\nNo particular reference-array partition or isolated well per unit is required.\nFunctional layers in the published task include active, implant, wells, gates,\ncontacts, passive plates, vias and routing; annotation/text-only layers are excluded.\nIHP native main and maximal DRC use the pinned PDK block profiles, with chip-level density and antenna disabled. The two native MIM bindings use 51.18 um square plates with m=16 and 48.74 um square plates with m=7, giving nominal 62.9964384 pF and 24.9982586 pF at the stated typical model. LVS connects actual tap regions to their wells/substrate before comparing the four-terminal logical MOS; it does not compare a prescribed tap inventory. Source simulation uses the same logical body boundary and native MIM models as candidate extraction. Magic extracts the candidate devices, junction geometry and distributed interconnect RC. This is not distributed substrate or RF/EM extraction. Candidate-derived Magic distributed RC feeds every post-layout job.\u003c/p\u003e\n\u003ch2 id=\"problem-electrical-requirements-and-scoring\"\u003eElectrical Requirements and Scoring\u003c/h2\u003e\n\u003cp\u003eArtifact, geometry, DRC, LVS and declared functional requirements must pass. Parasitic extraction is also mandatory: it must produce a complete, electrically consistent netlist usable by the required post-layout simulations. A completed candidate rejection scores zero; infrastructure errors do not establish candidate failure.\u003c/p\u003e\n\u003cp\u003eFor \u003ccode\u003elayout\u003c/code\u003e scoring, cap every positively weighted raw quality at 1 before aggregation; the score ranges from 0 to 100. Reaching every weighted target scores 100, and no minimum score is required for validity.\u003c/p\u003e\n\u003cp\u003ePhysical checks and the declared functional bounds must pass. Each \u003ccode\u003esource_*\u003c/code\u003e job and its corresponding candidate extracted circuit use exactly the same testbench, model resources, parameters, loads and measurement windows. Every electrical scoring anchor is the paired pre-layout measurement under that condition. The score measures preservation of the fixed circuit's performance; it does not require layout to improve intrinsic circuit behavior. Reports retain every paired result.\u003c/p\u003e\n\u003cp\u003eLet x be the post-layout measurement and b the same-condition pre-layout measurement:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eRatio normalization: maximize with q = x/b and minimize with q = b/x. When a numerical scale s is declared, use (x+s)/(b+s) and its reciprocal, respectively. The scale handles zero values as a normalization floor; it is neither an allowed degradation nor an acceptance bound.\u003c/li\u003e\n\u003cli\u003eAmplitude in dB: maximize with q = 10^((x-b)/20) and minimize with its reciprocal.\u003c/li\u003e\n\u003cli\u003eTarget normalization: q = 1/(1+abs(x-b)/s), where s is the declared physical scale. Signed or zero-valued operating points are not divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eUse \u003ccode\u003elayout\u003c/code\u003e scoring. First compute each metric's raw quality q from the worst paired condition, with raw area quality q_area = area_target / candidate_functional_area. Credit c_i = min(1, q_i) for every positively weighted metric, then compute S = 100 * product(c_i ** w_i). The weights sum to 1 and the score is bounded by 100. An improvement beyond one target cannot compensate for missing another target. Physical, extraction, or functional rejection scores zero; other missing or invalid measurements leave the score unknown, and zero-weight observations must also be valid. Reaching every positively weighted target scores 100; a feasible reference may score far below 100. Weights express quality tradeoffs, not acceptance bounds.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003elate_error_v\u003c/code\u003e, \u003ccode\u003ereturn_error_v\u003c/code\u003e, \u003ccode\u003eripple_v\u003c/code\u003e and \u003ccode\u003ereturn_ripple_v\u003c/code\u003e use \u003ccode\u003esaturating_ratio\u003c/code\u003e. Candidate error x, paired pre-layout error b and the positive scale s below define q = 2(b+s)/(b+x+2s). Equality to the anchor gives raw q=1; decreasing error approaches raw quality 2, while credited quality stays at 1. The scale retains its declared unit and limits sensitivity near zero. Normalize each condition before taking the worst paired quality; other metrics retain their declared normalization and functional requirements.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eDefinition\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eTreatment\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003egain_db, gain_10khz_db\u003c/td\u003e\n\u003ctd\u003eBalanced differential Vout/(Vinp−Vinn) magnitude at 1 Hz and 10 kHz\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003eResponse, source-paired db20 maximize\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eclosed_gain_10khz_db\u003c/td\u003e\n\u003ctd\u003eActual unity-follower transfer at 10 kHz\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003eResponse target, 6 dB scale\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eoutput_v\u003c/td\u003e\n\u003ctd\u003eDC follower output\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eBias target, 1.5 V scale\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003epower_w\u003c/td\u003e\n\u003ctd\u003eDC power drawn from VDD\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eSupply, inverse ratio, 1 pW floor\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003emean_power_w\u003c/td\u003e\n\u003ctd\u003eMean supply power over 20–200 us\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eSupply, inverse ratio, 1 pW floor\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003elate_error_v, return_error_v\u003c/td\u003e\n\u003ctd\u003eMean absolute tracking error in high/return window\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eSaturating quality for late error; return error diagnostic\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eripple_v, return_ripple_v\u003c/td\u003e\n\u003ctd\u003eFull output peak-to-peak range in high/return window\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eDiagnostic\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ehigh_v, low_v\u003c/td\u003e\n\u003ctd\u003eWindow means\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eDiagnostic\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ebias_v\u003c/td\u003e\n\u003ctd\u003eExternal bias port DC voltage\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eDiagnostic\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eoutput_min_v, output_max_v\u003c/td\u003e\n\u003ctd\u003eFull-transient extrema\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eDiagnostic\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003edc_feedback_error_v\u003c/td\u003e\n\u003ctd\u003eAbsolute DC voltage across the external feedback inductor\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eMeasurement-validity check, 0–1 uV\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003efixture_cm_max\u003c/td\u003e\n\u003ctd\u003eMaximum residual common-mode AC drive\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eMeasurement-validity check, 0–1 uV\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eAll measurements must be finite and complete. Supply power, absolute errors and amplitude ranges must obey their nonnegative physical definitions. The common-mode test-apparatus bound validates differential excitation, rather than DUT common-mode regulation. The DC feedback bound excludes failure of the isolated bias solve. Both apparatus checks apply to source and candidate simulation before scoring. These are this task's hard electrical requirements; upstream paper targets are not acceptance bounds. Window error and ripple do not establish settling or periodic steady state; no phase margin, unity-gain crossing, threshold-crossing settling time, CMRR, noise, PVT or mismatch performance is claimed. The separate two-injection sweep scores the minimum sampled return distance.\u003c/p\u003e\n\u003cp\u003eError metrics use saturating normalization \u003ccode\u003e2*(b+s)/(b+x+2*s)\u003c/code\u003e, with the quality anchor and scale declared below. This differs from an unbounded inverse ratio. Zero-weight ripple, return error, bias and closed-loop gain remain diagnostics; the response integral and sampled return distance score dynamic quality. Capability coefficient \u003cstrong\u003e7\u003c/strong\u003e is independent of the score.\u003c/p\u003e\n\u003ch3 id=\"problem-quality-targets-and-weights\"\u003eQuality targets and weights\u003c/h3\u003e\n\u003cp\u003eFor a minimizing metric, additional loss is \u003ccode\u003emax(0, x-b)\u003c/code\u003e; for a maximizing metric it is \u003ccode\u003emax(0, b-x)\u003c/code\u003e. Degradation quality is \u003ccode\u003eq = s/(s+loss)\u003c/code\u003e: loss equal to the declared budget halves that metric's quality, while matching or improving the paired source receives full credit. Normalize each condition before taking the worst quality. This formula does not change functional requirements.\u003c/p\u003e\n\u003cp\u003eThe area target is \u003cstrong\u003e62000 um2\u003c/strong\u003e, with \u003cstrong\u003e30%\u003c/strong\u003e weight. It is an integration objective rather than an acceptance bound.\u003c/p\u003e\n\u003cp\u003eThe 23 fixed MIM plates occupy 58539.3916 um2 within the 62000 um2 footprint objective. The remaining 3460.6084 um2 accommodates enclosures, spacing and routing with overlap only where native rules permit. Area carries 30%, minimum sampled return-distance preservation 50% and the worst bilateral offset-independent response integral 20%. Return-distance loss uses a budget of 0.05 in normalized loop units. At the source distance of about 0.8, losing 0.05 raises the sampled peak sensitivity 1/min(abs(1+T)) by about 7%; this merits a material quality penalty. The response-integral loss budget is 10 ns, one tenth of the 100 ns input ramp. Both metrics use degradation normalization against each paired source observation; equal or improved observations receive full credit. Tracking error, phase-margin summaries, gain and power remain diagnostics with all measurements and functional requirements retained. The fixed MIM footprint target is unchanged. These quality budgets do not impose acceptance thresholds or claim complete internal-loop stability.\u003c/p\u003e\n\u003cp\u003eThe external-loop fixture inserts VPROBE from VINN (\u003ccode\u003evm\u003c/code\u003e) to VOUT and IINJ from ground to \u003ccode\u003evm\u003c/code\u003e, with zero DC value. The first AC sweep sets VPROBE=1 V and IINJ=0; the second sets VPROBE=0 and IINJ=1 A. With B=-I(VPROBE), D=V(vm) from the voltage injection and A=-I(VPROBE), C=V(vm) from the current injection, delta=AD-BC and T=(2\u003cem\u003edelta-A+D)/(1-2\u003c/em\u003edelta+A-D). Sweep 0.01 Hz-1 GHz at 300 points/decade and measure min(abs(1+T)). The two sweeps retain the same DC circuit, bias and load. This finite external-loop measurement does not prove all internal-loop stability.\u003c/p\u003e\n\u003cp\u003eThe dynamic integral removes each direction's own plateau offset and normalizes absolute error to the 100 mV step. Every electrical score takes the worst paired quality over the three loads, including both dynamic-response directions; load conditions do not split a metric's weight.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.3\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eresponse_time_s\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.2\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eminimum_return_distance\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.5\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eAll remaining observations have zero quality weight and retain their measurement-validity and functional requirements. Electrical targets are the paired pre-layout observations. The scored dynamic-integral loss budget is 10 ns and the return-distance loss budget is 0.05; neither is an acceptance tolerance. Late tracking error is diagnostic.\u003c/p\u003e\n\u003ch2 id=\"problem-tools-and-submission\"\u003eTools and Submission\u003c/h2\u003e\n\u003cp\u003eSoft solve budget: \u003cstrong\u003e2.5 hours\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eRead \u003ccode\u003e/protocol/task.json\u003c/code\u003e for input/output paths, constraints and the \u003ccode\u003eresources\u003c/code\u003e object; \u003ccode\u003e/protocol/harness.json\u003c/code\u003e describes the active check and submission interface.\u003c/p\u003e\n\u003cp\u003eUse reviewed IHP SG13G2 resources and the ngspice 45 environment; see \u003ccode\u003e/protocol/task.json\u003c/code\u003e for frozen requirements and resource bindings. Explicitly submit \u003ccode\u003e/workspace/output/final.gds\u003c/code\u003e through the session tool; writing a file alone is insufficient. Evaluation checks files, native DRC/LVS, geometry, candidate RC, independent source simulation and post-layout simulation; source baselines, reference solutions and the author repository are not solver inputs.\u003c/p\u003e\n\u003ch3 id=\"problem-solve-workflow\"\u003eSolve workflow\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eRead the declared circuit and materials, \u003ccode\u003e/protocol/task.json\u003c/code\u003e for paths, constraints and reviewed resources, and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e for capabilities and helper commands. Task inputs under \u003ccode\u003e/task\u003c/code\u003e and resources under \u003ccode\u003e/resources\u003c/code\u003e are read-only; construct the layout in \u003ccode\u003e/workspace\u003c/code\u003e with the declared tools. With layout MCP, paths and commands refer to the remote EDA workspace. Create your own implementation with real devices, interconnect and pins, using your own tool loop without delegating to other agents; reference layouts and author code are not solver inputs.\u003c/li\u003e\n\u003cli\u003eInspect \u003ccode\u003eresources.external\u003c/code\u003e before using external tools. Each command starts a fresh shell: when tool modules are declared, source \u003ccode\u003e/usr/share/Modules/init/bash\u003c/code\u003e and load the selected tool's modules; export its declared \u003ccode\u003etool_environment\u003c/code\u003e settings in that same command. Repeat as needed and use batch or headless operation. Local manuals, command references, and release notes may be available within the declared EDA installation and PDK resource directories. Locate these resources through \u003ccode\u003e/protocol/task.json\u003c/code\u003e and consult the documentation for the installed tool version when diagnosing unfamiliar syntax or tool failures.\u003c/li\u003e\n\u003cli\u003eGenerate an initial candidate and submit a snapshot early. When \u003ccode\u003eprocess-feedback\u003c/code\u003e is available, check the current GDS with layout MCP \u003ccode\u003echeck\u003c/code\u003e or \u003ccode\u003epython -I /protocol/process_check.py\u003c/code\u003e before the final submission. This runs the final evaluator's complete plan and returns engineering diagnostics and candidate measurements, without scores or normalized quality factors. Checks have no count limit and consume the same wall-clock budget. Inspect the physical and functional results and all scored metrics; successful tool execution alone does not establish requirement satisfaction. Read paginated diagnostics with \u003ccode\u003ereport\u003c/code\u003e when using MCP. Local exploratory checks do not replace this complete check.\u003c/li\u003e\n\u003cli\u003eUse the remaining time for measured improvements to the declared quality objectives. Identify the limiting scored metrics, make targeted layout changes, regenerate and check the candidate, and compare measurements with the previous candidate and the stated scoring targets and trade-offs. Preserve the best valid candidate and revert changes that worsen the overall objective. Repeat while time and useful improvements remain; passing validity checks alone is not a stopping condition.\u003c/li\u003e\n\u003cli\u003eStop optimization when the budget expires, all declared quality objectives are achieved, or measured trials support convergence. If stopping early, explain the changes tried, the metric comparisons and the remaining limitations. Track remaining time through session status. At soft-budget expiry, finish or cancel already-started work and submit immediately; do not start another command, check or optimization round. If an MCP execution is running, use \u003ccode\u003epoll\u003c/code\u003e with its \u003ccode\u003eexecution_id\u003c/code\u003e and the returned \u003ccode\u003enext_offset\u003c/code\u003e as \u003ccode\u003eoffset\u003c/code\u003e until completion, or cancel it and wait for it to stop.\u003c/li\u003e\n\u003cli\u003eFinish or cancel outstanding work, restore your best candidate to the declared output path, and explicitly submit it before ending the session. With layout MCP \u003ccode\u003esubmit\u003c/code\u003e, remove the \u003ccode\u003e/workspace/\u003c/code\u003e prefix from \u003ccode\u003eoutput.path\u003c/code\u003e; with the container interface, run \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e. Wait for the receipt: only the last accepted snapshot is judged, and writing a file alone is not submission. Acceptance confirms delivery; the framework independently evaluates validity and quality after the session.\u003c/li\u003e\n\u003c/ol\u003e\n12:T420,The 23 fixed MIM plates occupy 58539.3916 um2 within the 62000 um2 footprint objective. The remaining 3460.6084 um2 accommodates enclosures, spacing and routing with overlap only where native rules permit. Area carries 30%, minimum sampled return-distance preservation 50% and the worst bilateral offset-independent response integral 20%. Return-distance loss uses a budget of 0.05 in normalized loop units. At the source distance of about 0.8, losing 0.05 raises the sampled peak sensitivity 1/min(abs(1+T)) by about 7%; this merits a material quality penalty. The response-integral loss budget is 10 ns, one tenth of the 100 ns input ramp. Both metrics use degradation normalization against each paired source observation; equal or improved observations receive full credit. Tracking error, phase-margin summaries, gain and power remain diagnostics with all measurements and functional requirements retained. The fixed MIM footprint target is unchanged. These quality budgets do not impose acceptance thresholds or claim complete internal-loop stability.13:T2440,\u003cp\u003eArtifact, geometry, DRC, LVS and declared functional requirements must pass. Parasitic extraction is also mandatory: it must produce a complete, electrically consistent netlist usable by the required post-layout simulations. A completed candidate rejection scores zero; infrastructure errors do not establish candidate failure.\u003c/p\u003e\n\u003cp\u003eFor \u003ccode\u003elayout\u003c/code\u003e scoring, cap every positively weighted raw quality at 1 before aggregation; the score ranges from 0 to 100. Reaching every weighted target scores 100, and no minimum score is required for validity.\u003c/p\u003e\n\u003cp\u003ePhysical checks and the declared functional bounds must pass. Each \u003ccode\u003esource_*\u003c/code\u003e job and its corresponding candidate extracted circuit use exactly the same testbench, model resources, parameters, loads and measurement windows. Every electrical scoring anchor is the paired pre-layout measurement under that condition. The score measures preservation of the fixed circuit's performance; it does not require layout to improve intrinsic circuit behavior. Reports retain every paired result.\u003c/p\u003e\n\u003cp\u003eLet x be the post-layout measurement and b the same-condition pre-layout measurement:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eRatio normalization: maximize with q = x/b and minimize with q = b/x. When a numerical scale s is declared, use (x+s)/(b+s) and its reciprocal, respectively. The scale handles zero values as a normalization floor; it is neither an allowed degradation nor an acceptance bound.\u003c/li\u003e\n\u003cli\u003eAmplitude in dB: maximize with q = 10^((x-b)/20) and minimize with its reciprocal.\u003c/li\u003e\n\u003cli\u003eTarget normalization: q = 1/(1+abs(x-b)/s), where s is the declared physical scale. Signed or zero-valued operating points are not divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eUse \u003ccode\u003elayout\u003c/code\u003e scoring. First compute each metric's raw quality q from the worst paired condition, with raw area quality q_area = area_target / candidate_functional_area. Credit c_i = min(1, q_i) for every positively weighted metric, then compute S = 100 * product(c_i ** w_i). The weights sum to 1 and the score is bounded by 100. An improvement beyond one target cannot compensate for missing another target. Physical, extraction, or functional rejection scores zero; other missing or invalid measurements leave the score unknown, and zero-weight observations must also be valid. Reaching every positively weighted target scores 100; a feasible reference may score far below 100. Weights express quality tradeoffs, not acceptance bounds.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003elate_error_v\u003c/code\u003e, \u003ccode\u003ereturn_error_v\u003c/code\u003e, \u003ccode\u003eripple_v\u003c/code\u003e and \u003ccode\u003ereturn_ripple_v\u003c/code\u003e use \u003ccode\u003esaturating_ratio\u003c/code\u003e. Candidate error x, paired pre-layout error b and the positive scale s below define q = 2(b+s)/(b+x+2s). Equality to the anchor gives raw q=1; decreasing error approaches raw quality 2, while credited quality stays at 1. The scale retains its declared unit and limits sensitivity near zero. Normalize each condition before taking the worst paired quality; other metrics retain their declared normalization and functional requirements.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eDefinition\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eTreatment\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003egain_db, gain_10khz_db\u003c/td\u003e\n\u003ctd\u003eBalanced differential Vout/(Vinp−Vinn) magnitude at 1 Hz and 10 kHz\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003eResponse, source-paired db20 maximize\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eclosed_gain_10khz_db\u003c/td\u003e\n\u003ctd\u003eActual unity-follower transfer at 10 kHz\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003eResponse target, 6 dB scale\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eoutput_v\u003c/td\u003e\n\u003ctd\u003eDC follower output\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eBias target, 1.5 V scale\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003epower_w\u003c/td\u003e\n\u003ctd\u003eDC power drawn from VDD\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eSupply, inverse ratio, 1 pW floor\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003emean_power_w\u003c/td\u003e\n\u003ctd\u003eMean supply power over 20–200 us\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eSupply, inverse ratio, 1 pW floor\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003elate_error_v, return_error_v\u003c/td\u003e\n\u003ctd\u003eMean absolute tracking error in high/return window\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eSaturating quality for late error; return error diagnostic\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eripple_v, return_ripple_v\u003c/td\u003e\n\u003ctd\u003eFull output peak-to-peak range in high/return window\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eDiagnostic\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ehigh_v, low_v\u003c/td\u003e\n\u003ctd\u003eWindow means\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eDiagnostic\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ebias_v\u003c/td\u003e\n\u003ctd\u003eExternal bias port DC voltage\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eDiagnostic\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eoutput_min_v, output_max_v\u003c/td\u003e\n\u003ctd\u003eFull-transient extrema\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eDiagnostic\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003edc_feedback_error_v\u003c/td\u003e\n\u003ctd\u003eAbsolute DC voltage across the external feedback inductor\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eMeasurement-validity check, 0–1 uV\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003efixture_cm_max\u003c/td\u003e\n\u003ctd\u003eMaximum residual common-mode AC drive\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eMeasurement-validity check, 0–1 uV\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eAll measurements must be finite and complete. Supply power, absolute errors and amplitude ranges must obey their nonnegative physical definitions. The common-mode test-apparatus bound validates differential excitation, rather than DUT common-mode regulation. The DC feedback bound excludes failure of the isolated bias solve. Both apparatus checks apply to source and candidate simulation before scoring. These are this task's hard electrical requirements; upstream paper targets are not acceptance bounds. Window error and ripple do not establish settling or periodic steady state; no phase margin, unity-gain crossing, threshold-crossing settling time, CMRR, noise, PVT or mismatch performance is claimed. The separate two-injection sweep scores the minimum sampled return distance.\u003c/p\u003e\n\u003cp\u003eError metrics use saturating normalization \u003ccode\u003e2*(b+s)/(b+x+2*s)\u003c/code\u003e, with the quality anchor and scale declared below. This differs from an unbounded inverse ratio. Zero-weight ripple, return error, bias and closed-loop gain remain diagnostics; the response integral and sampled return distance score dynamic quality. Capability coefficient \u003cstrong\u003e7\u003c/strong\u003e is independent of the score.\u003c/p\u003e\n\u003ch3\u003eQuality targets and weights\u003c/h3\u003e\n\u003cp\u003eFor a minimizing metric, additional loss is \u003ccode\u003emax(0, x-b)\u003c/code\u003e; for a maximizing metric it is \u003ccode\u003emax(0, b-x)\u003c/code\u003e. Degradation quality is \u003ccode\u003eq = s/(s+loss)\u003c/code\u003e: loss equal to the declared budget halves that metric's quality, while matching or improving the paired source receives full credit. Normalize each condition before taking the worst quality. This formula does not change functional requirements.\u003c/p\u003e\n\u003cp\u003eThe area target is \u003cstrong\u003e62000 um2\u003c/strong\u003e, with \u003cstrong\u003e30%\u003c/strong\u003e weight. It is an integration objective rather than an acceptance bound.\u003c/p\u003e\n\u003cp\u003eThe 23 fixed MIM plates occupy 58539.3916 um2 within the 62000 um2 footprint objective. The remaining 3460.6084 um2 accommodates enclosures, spacing and routing with overlap only where native rules permit. Area carries 30%, minimum sampled return-distance preservation 50% and the worst bilateral offset-independent response integral 20%. Return-distance loss uses a budget of 0.05 in normalized loop units. At the source distance of about 0.8, losing 0.05 raises the sampled peak sensitivity 1/min(abs(1+T)) by about 7%; this merits a material quality penalty. The response-integral loss budget is 10 ns, one tenth of the 100 ns input ramp. Both metrics use degradation normalization against each paired source observation; equal or improved observations receive full credit. Tracking error, phase-margin summaries, gain and power remain diagnostics with all measurements and functional requirements retained. The fixed MIM footprint target is unchanged. These quality budgets do not impose acceptance thresholds or claim complete internal-loop stability.\u003c/p\u003e\n\u003cp\u003eThe external-loop fixture inserts VPROBE from VINN (\u003ccode\u003evm\u003c/code\u003e) to VOUT and IINJ from ground to \u003ccode\u003evm\u003c/code\u003e, with zero DC value. The first AC sweep sets VPROBE=1 V and IINJ=0; the second sets VPROBE=0 and IINJ=1 A. With B=-I(VPROBE), D=V(vm) from the voltage injection and A=-I(VPROBE), C=V(vm) from the current injection, delta=AD-BC and T=(2\u003cem\u003edelta-A+D)/(1-2\u003c/em\u003edelta+A-D). Sweep 0.01 Hz-1 GHz at 300 points/decade and measure min(abs(1+T)). The two sweeps retain the same DC circuit, bias and load. This finite external-loop measurement does not prove all internal-loop stability.\u003c/p\u003e\n\u003cp\u003eThe dynamic integral removes each direction's own plateau offset and normalizes absolute error to the 100 mV step. Every electrical score takes the worst paired quality over the three loads, including both dynamic-response directions; load conditions do not split a metric's weight.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.3\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eresponse_time_s\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.2\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eminimum_return_distance\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.5\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eAll remaining observations have zero quality weight and retain their measurement-validity and functional requirements. Electrical targets are the paired pre-layout observations. The scored dynamic-integral loss budget is 10 ns and the return-distance loss budget is 0.05; neither is an acceptance tolerance. Late tracking error is diagnostic.\u003c/p\u003e\n14:T480,\u003cp\u003eImplement \u003ccode\u003eamp_014_ramos_pfc\u003c/code\u003e with the supplied fixed topology and dimensions. The PMOS input pair drives the cascoded NMOS branches at dm_2/net063; the voutn mirror produces net050. XM10 and the XM21/XM22 mirror drive net049, while XM11/XM23 drive the single-ended output. Both compensation paths remain: 63 pF from net050 to vout and 25 pF from net050 to net049. The vb3/vb4 bias network is retained.\nDo not replace the circuit, delete compensation, or add a servo. The circuit contains 24 logical MOS groups with the upstream W, L, multiplicity\nand four-terminal connections. PMOS groups XM8 and XM9 both have source and body\non net31; other PMOS bodies connect to vdd, and NMOS bodies connect to vss.\u003c/p\u003e\n\u003ch3\u003eOptimization objective\u003c/h3\u003e\n\u003cp\u003eMaximize the declared quality score within the solve budget while satisfying all physical and necessary functional requirements. The first passing DRC, LVS and required electrical checks establish a feasible baseline. Continue improving the scored metrics from that baseline; a passing check or \u003ccode\u003etask_success = true\u003c/code\u003e does not mean that the quality objectives have been achieved.\u003c/p\u003e\n15:T56d,\u003cp\u003eIHP SG13G2, nominal TT/typical, 27 C, supply 1.5 V, input reference 0.4 V,\nexternal current sink 2.4e-05 A to vss, and 5, 10 and 20 pF output loads, with the complete source/candidate experiments repeated at each load. Use the fixed IHP LV binding at 1.5 V, adapting the authored 1.8 V stimulus to the LV process rail; retain its bias current and input reference. Round W/L to 5 nm (the supplied integer-micrometre sizes are unchanged).\nThe closed-loop deck ties vinn directly to vout, drives vinp with a +100 mV pulse\nstarting at 20 us (100 ns rise/fall, 80 us high duration), and runs to 200 us with\n10 ns maximum steps, Gear order 2, reltol=1e-5, abstol=1 pA, vntol=10 nV.\nTransient starts from the solved DC point; this is not a zero-state supply-ramp\nstartup test. High and return windows are 80–100 and 180–200 us.\u003c/p\u003e\n\u003cp\u003eAC sweeps 200 points per decade from 1 Hz to 1 GHz. The differential-mode deck retains output DC feedback through a 1 TH inductor and isolates the bias node from AC through a 1 F capacitor to ground; vinp/vinn use balanced +0.5/-0.5 V small-signal excitation. Input common-mode residual amplitude and DC feedback error must both be \u0026lt;=1 uV. These are external small-signal bias fixtures, not physical compensation; an independent closed-loop deck measures actual follower response and does not call a voltage-transfer estimate a loop return ratio.\u003c/p\u003e\n16:T6d6,\u003cp\u003eSupply a GDS \u0026lt;=64 MiB with top cell \u003ccode\u003eamp_014_ramos_pfc\u003c/code\u003e, within 20000 by 2000 um\n(the task's artifact-size/outline bounds). Native DRC, strict named-interface LVS\nand functional-area measurement must pass; no marker waivers apply. Preserve\nMOS models, gate lengths, parallel-equivalent widths (W*m), logical body connections\nand the two native compensation-capacitor bindings. Electrically equivalent unit\narrays, multiple gate fingers and shared diffusion are allowed when native LVS\nverifies them. Sharing a well is allowed only for bodies on the same logical net.\nPhysically connect each well/substrate region to its declared body net through\nDRC-compliant contacts; contact count, placement and geometry are layout choices.\nNo particular reference-array partition or isolated well per unit is required.\nFunctional layers in the published task include active, implant, wells, gates,\ncontacts, passive plates, vias and routing; annotation/text-only layers are excluded.\nIHP native main and maximal DRC use the pinned PDK block profiles, with chip-level density and antenna disabled. The two native MIM bindings use 51.18 um square plates with m=16 and 48.74 um square plates with m=7, giving nominal 62.9964384 pF and 24.9982586 pF at the stated typical model. LVS connects actual tap regions to their wells/substrate before comparing the four-terminal logical MOS; it does not compare a prescribed tap inventory. Source simulation uses the same logical body boundary and native MIM models as candidate extraction. Magic extracts the candidate devices, junction geometry and distributed interconnect RC. This is not distributed substrate or RF/EM extraction. Candidate-derived Magic distributed RC feeds every post-layout job.\u003c/p\u003e\n17:T11c8,\u003cp\u003eSoft solve budget: \u003cstrong\u003e2.5 hours\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eRead \u003ccode\u003e/protocol/task.json\u003c/code\u003e for input/output paths, constraints and the \u003ccode\u003eresources\u003c/code\u003e object; \u003ccode\u003e/protocol/harness.json\u003c/code\u003e describes the active check and submission interface.\u003c/p\u003e\n\u003cp\u003eUse reviewed IHP SG13G2 resources and the ngspice 45 environment; see \u003ccode\u003e/protocol/task.json\u003c/code\u003e for frozen requirements and resource bindings. Explicitly submit \u003ccode\u003e/workspace/output/final.gds\u003c/code\u003e through the session tool; writing a file alone is insufficient. Evaluation checks files, native DRC/LVS, geometry, candidate RC, independent source simulation and post-layout simulation; source baselines, reference solutions and the author repository are not solver inputs.\u003c/p\u003e\n\u003ch3\u003eSolve workflow\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eRead the declared circuit and materials, \u003ccode\u003e/protocol/task.json\u003c/code\u003e for paths, constraints and reviewed resources, and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e for capabilities and helper commands. Task inputs under \u003ccode\u003e/task\u003c/code\u003e and resources under \u003ccode\u003e/resources\u003c/code\u003e are read-only; construct the layout in \u003ccode\u003e/workspace\u003c/code\u003e with the declared tools. With layout MCP, paths and commands refer to the remote EDA workspace. Create your own implementation with real devices, interconnect and pins, using your own tool loop without delegating to other agents; reference layouts and author code are not solver inputs.\u003c/li\u003e\n\u003cli\u003eInspect \u003ccode\u003eresources.external\u003c/code\u003e before using external tools. Each command starts a fresh shell: when tool modules are declared, source \u003ccode\u003e/usr/share/Modules/init/bash\u003c/code\u003e and load the selected tool's modules; export its declared \u003ccode\u003etool_environment\u003c/code\u003e settings in that same command. Repeat as needed and use batch or headless operation. Local manuals, command references, and release notes may be available within the declared EDA installation and PDK resource directories. Locate these resources through \u003ccode\u003e/protocol/task.json\u003c/code\u003e and consult the documentation for the installed tool version when diagnosing unfamiliar syntax or tool failures.\u003c/li\u003e\n\u003cli\u003eGenerate an initial candidate and submit a snapshot early. When \u003ccode\u003eprocess-feedback\u003c/code\u003e is available, check the current GDS with layout MCP \u003ccode\u003echeck\u003c/code\u003e or \u003ccode\u003epython -I /protocol/process_check.py\u003c/code\u003e before the final submission. This runs the final evaluator's complete plan and returns engineering diagnostics and candidate measurements, without scores or normalized quality factors. Checks have no count limit and consume the same wall-clock budget. Inspect the physical and functional results and all scored metrics; successful tool execution alone does not establish requirement satisfaction. Read paginated diagnostics with \u003ccode\u003ereport\u003c/code\u003e when using MCP. Local exploratory checks do not replace this complete check.\u003c/li\u003e\n\u003cli\u003eUse the remaining time for measured improvements to the declared quality objectives. Identify the limiting scored metrics, make targeted layout changes, regenerate and check the candidate, and compare measurements with the previous candidate and the stated scoring targets and trade-offs. Preserve the best valid candidate and revert changes that worsen the overall objective. Repeat while time and useful improvements remain; passing validity checks alone is not a stopping condition.\u003c/li\u003e\n\u003cli\u003eStop optimization when the budget expires, all declared quality objectives are achieved, or measured trials support convergence. If stopping early, explain the changes tried, the metric comparisons and the remaining limitations. Track remaining time through session status. At soft-budget expiry, finish or cancel already-started work and submit immediately; do not start another command, check or optimization round. If an MCP execution is running, use \u003ccode\u003epoll\u003c/code\u003e with its \u003ccode\u003eexecution_id\u003c/code\u003e and the returned \u003ccode\u003enext_offset\u003c/code\u003e as \u003ccode\u003eoffset\u003c/code\u003e until completion, or cancel it and wait for it to stop.\u003c/li\u003e\n\u003cli\u003eFinish or cancel outstanding work, restore your best candidate to the declared output path, and explicitly submit it before ending the session. With layout MCP \u003ccode\u003esubmit\u003c/code\u003e, remove the \u003ccode\u003e/workspace/\u003c/code\u003e prefix from \u003ccode\u003eoutput.path\u003c/code\u003e; with the container interface, run \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e. Wait for the receipt: only the last accepted snapshot is judged, and writing a file alone is not submission. Acceptance confirms delivery; the framework independently evaluates validity and quality after the session.\u003c/li\u003e\n\u003c/ol\u003e\n6:[\"$\",\"$8\",null,{\"fallback\":[\"$\",\"p\",null,{\"children\":\"Loading published evidence…\"}],\"children\":[\"$\",\"$L10\",null,{\"task\":{\"case_path\":\"tasks/ihp-sg13g2/analog-db/cases/amp_014_ramos_pfc/case.toml\",\"coefficient\":7,\"collection\":\"analog-db\",\"configuration_url\":\"
