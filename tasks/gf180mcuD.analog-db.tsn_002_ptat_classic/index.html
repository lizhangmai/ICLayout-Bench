not a precision temperature\nreference or a calibrated thermometer.\u003c/p\u003e\n\u003ch2 id=\"problem-inputs-and-interface\"\u003eInputs and Interface\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003ematerials/circuit.cdl\u003c/code\u003e is the physical LVS authority;\n\u003ccode\u003ematerials/circuit.spice\u003c/code\u003e is its simulator representation.\n\u003ccode\u003ematerials/testbench.spice\u003c/code\u003e defines stimuli and observations. This problem is\nthe description input. Ordered ports are \u003ccode\u003evdd vout vss\u003c/code\u003e: supply,\ntemperature-dependent output and return.\u003c/p\u003e\n\u003cp\u003eRetain all device dimensions, multiplicities and four-terminal connections.\nThe 8/1 um core NMOS has both source and body on \u003ccode\u003evout\u003c/code\u003e; its body must remain\nisolated from VSS. The physical primitive \u003ccode\u003eMM0 ... nfet_03v3_dn\u003c/code\u003e maps to\n\u003ccode\u003eXM0 ... nfet_03v3\u003c/code\u003e in the simulator, with the same D/G/S/B and W/L/m.\nUse an isolated P-well inside a supply-tied deep N-well, with explicit\nN-well enclosure and physical well/substrate contacts. Extraction must retain\nthe separation between the output body and substrate return. No body-to-VSS\nsubstitution is permitted. The core resistor is physical 1 kohm/square poly,\nW=2 um, L=40 um, nominal 20 kohm.\u003c/p\u003e\n\u003cp\u003eThe added startup devices have W/L of 0.42/20 um (weak PMOS pull-up),\n2/0.28 um (NMOS detector) and 0.42/1 um (NMOS injector). The detector reduces\nthe startup control voltage after bias is established, turning off the\ninjection path. The weak pull-up/detector branch still draws static current;\nall DUT supply power is measured. Preserve this branch as part of the DUT.\nPlacement, routing, splitting and source/drain interchange are permitted only\nwhere accepted by the declared LVS equivalence rules. No statistical matching\nor placement style is scored. External stimulus and the output load belong to\nthe testbench and must not be placed inside the DUT.\u003c/p\u003e\n\u003ch2 id=\"problem-operating-conditions\"\u003eOperating Conditions\u003c/h2\u003e\n\u003cp\u003eUse typical GF180 3.3 V MOS and poly models with statistical variation disabled.\nVSS is 0 V. Evaluate all 18 combinations of VDD = 2.7/3.0/3.3 V,\ntemperature = -20/27/100 C and supply rise time = 0.1/10 us.\nEach condition measures its DC operating point and a -20 to 100 C sweep in\n1 C steps. The temperature is then restored to the selected value before\nstartup simulation. The external output capacitance is exactly 100 fF.\u003c/p\u003e\n\u003cp\u003eFor startup, ramp VDD linearly from 0 to its selected value, then hold it.\nUse a zero-initial-state \u003ccode\u003euic\u003c/code\u003e transient through 100 us with no internal\ninitial-condition bias or auxiliary startup source. Gear order 2 and a\nmaximum timestep of 1 ns are declared. Measure final error, ripple and average\npower over 90–100 us. These are finite-window error and ripple observations with no settling-error\nacceptance threshold; they do not establish settling time or bound overshoot.\u003c/p\u003e\n\u003ch2 id=\"problem-physical-requirements\"\u003ePhysical Requirements\u003c/h2\u003e\n\u003cp\u003eSubmit top cell \u003ccode\u003etsn_002_ptat_classic\u003c/code\u003e, all named electrical ports, resolved\nhierarchy and at most 10 MiB. Artifact, GF180 variant-D DRC including antenna,\nstrict named-port LVS and geometry must pass with no DRC waivers. Chip-level\ndensity and seal-ring closure are outside this standalone-block scope.\u003c/p\u003e\n\u003cp\u003eThe functional bounding box must fit within 220 by 65 um. Its area includes\nall declared device and routing drawing layers: wells (including deep N-well\nand isolated P-well), implants, active, poly, contacts, metals/vias and device\nmarkers. Annotation and pin-purpose shapes are excluded. All functional\nrouting must use drawing layers. \u003ccode\u003e/protocol/task.json\u003c/code\u003e freezes the layer set.\u003c/p\u003e\n\u003cp\u003eIndependent candidate extraction retains MOS and resistor geometry and adds\ndistributed wiring RC. All scored simulation consumes that extracted DUT.\nThis does not include a distributed silicon substrate model. Larger output\nloads are unqualified and can cause oscillation; this is not a pF-load output\nbuffer. Brownout/restart, arbitrary supply ramps, process/statistical corners,\nnoise, absolute temperature accuracy, supply rejection, EM and fabrication\nsignoff are outside scope.\u003c/p\u003e\n\u003ch2 id=\"problem-electrical-requirements-and-scoring\"\u003eElectrical Requirements and Scoring\u003c/h2\u003e\n\u003cp\u003ePhysical checks and declared functional bounds remain mandatory. Quality has no\nfixed allowed-degradation threshold. Each \u003ccode\u003esource_*\u003c/code\u003e job simulates the declared\nsource circuit with exactly the same testbench, model resources, parameters,\nload and measurement window as its paired extracted-candidate job. A source\nobservation is the 100-point electrical baseline; it is independent of the\nsubmitted GDS. All individual pairs are retained in the evaluation report.\u003c/p\u003e\n\u003cp\u003eFor a post-layout observation x and its source observation b:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eMaximize: q = x/b; minimize: q = b/x. When a numerical scale s is declared,\nuse (x+s)/(b+s) or its inverse. This handles zero-valued error measurements;\ns is a normalization floor, not an allowed degradation or pass threshold.\u003c/li\u003e\n\u003cli\u003eAmplitude dB: q = 10^((x-b)/20) for maximize, its inverse for minimize.\u003c/li\u003e\n\u003cli\u003eTarget: q = 1/(1+abs(x-b)/s), with a declared physical scale s. Signed and\nzero-valued operating points are never divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eScoring uses \u003ccode\u003elayout\u003c/code\u003e. A metric uses its worst paired quality q. The score is\nS = 100 * product(q_i ** w_i), including area quality\nq_area = area_reference / candidate_functional_area. The weights below sum to\none. Dimensions describe measurements but do not determine their weights.\nPhysical or functional rejection scores zero; missing or invalid measurements\nproduce an unknown score, including measurements with zero weight.\nSource-equivalent performance at the area reference scores 100; improvements\ncan exceed 100. A weight expresses a tradeoff, not a hard acceptance limit.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eDefinition / observations\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eQuality rule\u003c/th\u003e\n\u003cth\u003eFunctional bounds\u003c/th\u003e\n\u003cth\u003eScale\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC output at the selected supply and temperature\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 3.3\u003c/td\u003e\n\u003ctd\u003e3.3\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC delivered supply power, -V(vdd)*I(VDD), including startup bias\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ecold_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eOutput at -20 C\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 3.3\u003c/td\u003e\n\u003ctd\u003e3.3\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ehot_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eOutput at 100 C\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 3.3\u003c/td\u003e\n\u003ctd\u003e3.3\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eslope_v_per_c\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e(hot_v - cold_v)/120 C\u003c/td\u003e\n\u003ctd\u003eV/C\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e0.00047\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ecurvature_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMaximum absolute deviation from the endpoint line at all 121 temperatures\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eminimum_slope\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMinimum ngspice deriv(output) over temperature\u003c/td\u003e\n\u003ctd\u003eV/C\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e0.00055\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emaximum_slope\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMaximum ngspice deriv(output) over temperature\u003c/td\u003e\n\u003ctd\u003eV/C\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e0.00055\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epeak_power_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMaximum delivered supply power over temperature\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estartup_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMaximum absolute output error against the selected DC operating point during 90–100 us\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eripple_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMaximum minus minimum output during 90–100 us\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efinal_power_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTime-average delivered supply power during 90–100 us\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eArea reference: \u003cstrong\u003e529.13 um2\u003c/strong\u003e. 8 expanded device instances; sum of device/contact envelopes 303.6200 um2, per-side envelope allowance 1 um, 50% routing allowance and total outer width/height allowance 2 um. Estimate = ceil(100 * (1.5 * envelope_sum + 2 * margin * sqrt(envelope_sum) + margin^2)) / 100. Here margin is the total allowance across two opposite sides; the envelope sum is displayed rounded to four decimals. MOS/passive envelopes use declared W/L (or resistor dimensions) and multiplicity; explicit tap areas and HBT emitter/contact envelopes are included. This is a frozen engineering estimate, not a foundry minimum or a feasibility claim.\u003c/p\u003e\n\u003cp\u003eThe capability coefficient remains \u003cstrong\u003e6\u003c/strong\u003e; it is independent of\nthe reference-relative task score.\u003c/p\u003e\n\u003ch3 id=\"problem-score-weights\"\u003eScore weights\u003c/h3\u003e\n\u003cp\u003eTemperature-slope cores: temperature slope 36%; curvature 27%; startup 13.5%; output endpoints 4.5%; power 9%; area 10%. Each objective's weight is divided equally among its metrics.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emaximum_slope\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.120000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eminimum_slope\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.120000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eslope_v_per_c\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.120000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ecurvature_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.270000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eripple_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.067500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estartup_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.067500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ecold_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.015000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ehot_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.015000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.015000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efinal_power_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.030000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epeak_power_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.030000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.030000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch2 id=\"problem-tools-and-submission\"\u003eTools and Submission\u003c/h2\u003e\n\u003cp\u003eSolve budget: \u003cstrong\u003e3 hours\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eUse the reviewed GF180 resources in \u003ccode\u003e/protocol/resources.json\u003c/code\u003e. KLayout checks\nphysical validity and geometry, Magic extracts RC and ngspice simulates the\ncircuit. \u003ccode\u003e/protocol/task.json\u003c/code\u003e provides frozen requirements and\n\u003ccode\u003e/protocol/harness.json\u003c/code\u003e describes the harness. When \u003ccode\u003eprocess-feedback\u003c/code\u003e is\nexposed, use its published helper for interim checks. Write\n\u003ccode\u003e/workspace/output/final.gds\u003c/code\u003e, then submit with \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eUse a GDS database unit of 0.001 um, as required by the GF180MCU DRC deck.\u003c/p\u003e\n12:T185d,\u003cp\u003ePhysical checks and declared functional bounds remain mandatory. Quality has no\nfixed allowed-degradation threshold. Each \u003ccode\u003esource_*\u003c/code\u003e job simulates the declared\nsource circuit with exactly the same testbench, model resources, parameters,\nload and measurement window as its paired extracted-candidate job. A source\nobservation is the 100-point electrical baseline; it is independent of the\nsubmitted GDS. All individual pairs are retained in the evaluation report.\u003c/p\u003e\n\u003cp\u003eFor a post-layout observation x and its source observation b:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eMaximize: q = x/b; minimize: q = b/x. When a numerical scale s is declared,\nuse (x+s)/(b+s) or its inverse. This handles zero-valued error measurements;\ns is a normalization floor, not an allowed degradation or pass threshold.\u003c/li\u003e\n\u003cli\u003eAmplitude dB: q = 10^((x-b)/20) for maximize, its inverse for minimize.\u003c/li\u003e\n\u003cli\u003eTarget: q = 1/(1+abs(x-b)/s), with a declared physical scale s. Signed and\nzero-valued operating points are never divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eScoring uses \u003ccode\u003elayout\u003c/code\u003e. A metric uses its worst paired quality q. The score is\nS = 100 * product(q_i ** w_i), including area quality\nq_area = area_reference / candidate_functional_area. The weights below sum to\none. Dimensions describe measurements but do not determine their weights.\nPhysical or functional rejection scores zero; missing or invalid measurements\nproduce an unknown score, including measurements with zero weight.\nSource-equivalent performance at the area reference scores 100; improvements\ncan exceed 100. A weight expresses a tradeoff, not a hard acceptance limit.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eDefinition / observations\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eQuality rule\u003c/th\u003e\n\u003cth\u003eFunctional bounds\u003c/th\u003e\n\u003cth\u003eScale\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC output at the selected supply and temperature\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 3.3\u003c/td\u003e\n\u003ctd\u003e3.3\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC delivered supply power, -V(vdd)*I(VDD), including startup bias\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ecold_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eOutput at -20 C\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 3.3\u003c/td\u003e\n\u003ctd\u003e3.3\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ehot_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eOutput at 100 C\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 3.3\u003c/td\u003e\n\u003ctd\u003e3.3\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eslope_v_per_c\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e(hot_v - cold_v)/120 C\u003c/td\u003e\n\u003ctd\u003eV/C\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e0.00047\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ecurvature_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMaximum absolute deviation from the endpoint line at all 121 temperatures\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eminimum_slope\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMinimum ngspice deriv(output) over temperature\u003c/td\u003e\n\u003ctd\u003eV/C\u00 TAT Core\"},\"schematic_url\":\"/ICLayout-Bench/assets/dfc9b7c37cb196083d817aad48a6eb7877f9a613f4aa0f66ca56a1284ff1554f.svg\",\"scoring\":{\"area_metric\":\"functional_area\",\"area_target\":529.13,\"method\":\"layout\",\"rationale\":\"Temperature-slope cores: temperature slope 36%; curvature 27%; startup 13.5%; output endpoints 4.5%; power 9%; area 10%. Each objective's weight is divided equally among its metrics.\",\"weights\":{\"cold_v\":0.015,\"curvature_v\":0.27,\"final_power_w\":0.03,\"functional_area\":0.1,\"hot_v\":0.015,\"maximum_slope\":0.12,\"minimum_slope\":0.12,\"output_v\":0.015,\"peak_power_w\":0.03,\"power_w\":0.03,\"ripple_v\":0.0675,\"slope_v_per_c\":0.12,\"startup_error_v\":0.0675}},\"sections\":{\"Electrical Requirements and Scoring\":\"$12\",\"Objective\":\"\u003cp\u003eImplement \u003ccode\u003etsn_002_ptat_classic\u003c/code\u003e in GF180MCU D and submit self-contained GDS.\\nThe resistor-degenerated four-MOS source core has a positive temperature slope;\\ncandidate slope is measured and source-paired without a positive-slope acceptance bound.\\nA maintained three-MOS startup branch establishes its operating state after\\npower-up. Supply sensitivity remains: this is not a precision temperature\\nreference or a calibrated thermometer.\u003c/p\u003e\\n\",\"Operating Conditions\":\"\u003cp\u003eUse typical GF180 3.3 V MOS and poly models with statistical variation disabled.\\nVSS is 0 V. Evaluate all 18 combinations of VDD = 2.7/3.0/3.3 V,\\ntemperature = -20/27/100 C and supply rise time = 0.1/10 us.\\nEach condition measures its DC operating point and a -20 to 100 C sweep in\\n1 C steps. The temperature is then restored to the selected value before\\nstartup simulation. The external output capacitance is exactly 100 fF.\u003c/p\u003e\\n\u003cp\u003eFor startup, ramp VDD linearly from 0 to its selected value, then hold it.\\nUse a zero-initial-state \u003ccode\u003euic\u003c/code\u003e transient through 100 us with no internal\\ninitial-condition bias or auxiliary startup source. Gear order 2 and a\\nmaximum timestep of 1 ns are declared. Measure final error, ripple and average\\npower over 90–100 us. These are finite-window error and ripple observations with no settling-error\\nacceptance threshold; they do not establish settling time or bound overshoot.\u003c/p\u003e\\n\",\"Physical Requirements\":\"$13\"},\"source_url\":\"https://github.com/MacAnalog/spicexplorer-release/tree/263d0322f8900dc331536fbbe6c0e804514fc454/analog-db/circuits/tsn_002_ptat_classic\",\"status\":\"qualified\",\"title\":\"Self-Starting Isolated-Body PTAT Core\"},\"catalog\":{\"boards\":[],\"contexts\":[],\"experiments\":[],\"runs\":[],\"tasks\":[]},\"evidenceError\":false}]}]\nc:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n14:I[27201,[\"/ICLayout-Bench/_next/static/chunks/3gll1ekbrh320.js\"],\"IconMark\"]\n9:null\ne:[[\"$\",\"title\",\"0\",{\"children\":\"ICLayout-Bench | Circuit layout intelligence\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Measured progress in AI-driven integrated circuit layout. Explore circuits, model conditions and reviewed experimental evidence.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/ICLayout-Bench/brand/iclayout-bench.svg\",\"type\":\"image/svg+xml\",\"sizes\":\"any\"}],[\"$\",\"$L14\",\"3\",{}]]\n"])</script></body></html>
