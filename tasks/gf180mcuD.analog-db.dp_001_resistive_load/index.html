5\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[\"$L6\",[[\"$\",\"script\",\"script-0\",{\"src\":\"/ICLayout-Bench/_next/static/chunks/3_2wwayut9q0b.js\",\"async\":true,\"nonce\":\"$undefined\"}]],[\"$\",\"$L7\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.MetadataOutlet\",\"children\":\"$@9\"}]}]]}],{},null,false,null]},null,false,\"$a\"]},null,false,null],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Lb\",null,{\"children\":\"$Lc\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Ld\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.Metadata\",\"children\":\"$Le\"}]}]}],null]}],false]],\"m\":\"$undefined\",\"G\":[\"$f\",[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/ICLayout-Bench/_next/static/chunks/25phisebeeifo.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]]],\"S\":true,\"h\":null,\"r\":\"$undefined\",\"s\":\"$undefined\",\"a\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"U2oZdoUjWqT_XfcDHuQ5i\"}\n10:I[1186,[\"/ICLayout-Bench/_next/static/chunks/3gll1ekbrh320.js\",\"/ICLayout-Bench/_next/static/chunks/3_2wwayut9q0b.js\"],\"default\"]\na:C\n11:T2767,\u003ch1 id=\"problem-resistively-loaded-differential-pair-layout-task\"\u003eResistively Loaded Differential Pair Layout Task\u003c/h1\u003e\n\u003ch2 id=\"problem-objective\"\u003eObjective\u003c/h2\u003e\n\u003cp\u003eImplement the fixed \u003ccode\u003edp_001_resistive_load\u003c/code\u003e circuit in GF180MCU D and submit self-contained GDS.\nFour NMOS devices form a differential input pair and tail-current mirror. Two physical GF180 ppolyf_u_1k loads each have width 2 um and length 44 um (22 squares, nominally 22 kohm). MOS dimensions and the resistor ratio follow the fixed binding; the ideal source resistors become process devices with substrate terminals at VSS.\u003c/p\u003e\n\u003ch2 id=\"problem-inputs-and-interface\"\u003eInputs and Interface\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003ematerials/circuit.spice\u003c/code\u003e is authoritative for LVS and source calibration;\n\u003ccode\u003ematerials/testbench.spice\u003c/code\u003e defines every electrical measurement. This problem\nis the description input. Ordered ports: \u003ccode\u003evdd voutp voutn vinp vinn ibias vss\u003c/code\u003e.\nIn order, these are: Supply, output on the vinp branch, output on the vinn branch, positive input, negative input, NMOS reference-current input, and return.\u003c/p\u003e\n\u003cp\u003ePreserve the netlist's device connectivity, dimensions, multiplicities and body\nconnections. Provide physical well/substrate contacts to the declared rails.\nPlacement, routing, splitting and source/drain interchange are permitted only\nwhere accepted by the declared LVS equivalence rules. No common-centroid or\nstatistical matching requirement is scored. Ideal external stimulus, bias and\nload devices remain testbench apparatus and must not be placed inside the DUT.\u003c/p\u003e\n\u003ch2 id=\"problem-operating-conditions\"\u003eOperating Conditions\u003c/h2\u003e\n\u003cp\u003eUse the typical GF180 3.3 V MOS models and physical poly models where present,\nwith statistical variation disabled. Unless swept explicitly, temperature is 27 C.\nVDD = 3.3 V, VSS = 0 V; 20 uA from VDD into ibias; input common mode = 1.2, 1.65 and 2.1 V; external 1 pF on each output. The input differential signal is split +0.5/-0.5 around common mode. AC differential amplitude is 1 V. DC transfer sweeps differential input from -10.1 to +10.1 mV in 0.1 mV increments; requirements use only -10 to +10 mV. Output differential voltage is V(voutn)-V(voutp).\u003c/p\u003e\n\u003cp\u003eAC uses 100 points per decade from 1 Hz to 1 GHz. Gain-stage transfer is\nV(vout) for unit AC injection; differential-pair transfer is V(voutn)-V(voutp)\nfor unit differential excitation; the OTA transfer is defined above.\u003c/p\u003e\n\u003ch2 id=\"problem-physical-requirements\"\u003ePhysical Requirements\u003c/h2\u003e\n\u003cp\u003eSubmit top cell \u003ccode\u003edp_001_resistive_load\u003c/code\u003e with every named electrical port, resolved hierarchy\nand a file size at most 10 MiB. Artifact, GF180 variant-D DRC including antenna,\nstrict named-port LVS and geometry must pass, without DRC waivers. Chip-level\ndensity and seal-ring closure are outside this standalone-block scope.\u003c/p\u003e\n\u003cp\u003eThe functional bounding box must fit within 160 by 160 um. Area includes all\nprocess device and routing drawing layers listed in runtime constraints:\nwells, implants, active, poly, contacts, metals/vias and passive/device markers.\nAnnotation and pin-purpose shapes are excluded; all functional routing must use\ndrawing layers. The complete layer list is frozen in \u003ccode\u003e/protocol/task.json\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eThe judge independently extracts distributed wiring resistance and capacitance\nfrom the submitted GDS, retaining candidate-derived MOS/passive geometry and\nexternal body connections. Every scored simulation consumes that extracted DUT.\nThis model boundary does not include a distributed silicon substrate network.\nThe output has a high common-mode level; it is not a rail-to-rail amplifier. Transient settling, mismatch, noise, PVT and EM are outside scope. Manufacturing signoff is not claimed.\u003c/p\u003e\n\u003ch2 id=\"problem-electrical-requirements-and-scoring\"\u003eElectrical Requirements and Scoring\u003c/h2\u003e\n\u003cp\u003eAll three operating conditions must complete and every observation must be finite\nand meet its inclusive band. Aggregation cannot hide a failing condition;\nmissing crossings or incomplete extraction/simulation cannot establish success.\nSaved waveforms provide the inputs for independently reconstructing observations.\u003c/p\u003e\n\u003cp\u003ePhysical checks and declared functional bounds remain mandatory. Quality has no\nfixed allowed-degradation threshold. Each \u003ccode\u003esource_*\u003c/code\u003e job simulates the declared\nsource circuit with exactly the same testbench, model resources, parameters,\nload and measurement window as its paired extracted-candidate job. A source\nobservation is the 100-point electrical baseline; it is independent of the\nsubmitted GDS. All individual pairs are retained in the evaluation report.\u003c/p\u003e\n\u003cp\u003eFor a post-layout observation x and its source observation b:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eMaximize: q = x/b; minimize: q = b/x. When a numerical scale s is declared,\nuse (x+s)/(b+s) or its inverse. This handles zero-valued error measurements;\ns is a normalization floor, not an allowed degradation or pass threshold.\u003c/li\u003e\n\u003cli\u003eAmplitude dB: q = 10^((x-b)/20) for maximize, its inverse for minimize.\u003c/li\u003e\n\u003cli\u003eTarget: q = 1/(1+abs(x-b)/s), with a declared physical scale s. Signed and\nzero-valued operating points are never divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eScoring uses \u003ccode\u003elayout\u003c/code\u003e. A metric uses its worst paired quality q. The score is\nS = 100 * product(q_i ** w_i), including area quality\nq_area = area_reference / candidate_functional_area. The weights below sum to\none. Dimensions describe measurements but do not determine their weights.\nPhysical or functional rejection scores zero; missing or invalid measurements\nproduce an unknown score, including measurements with zero weight.\nSource-equivalent performance at the area reference scores 100; improvements\ncan exceed 100. A weight expresses a tradeoff, not a hard acceptance limit.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eDefinition / observations\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eQuality rule\u003c/th\u003e\n\u003cth\u003eFunctional bounds\u003c/th\u003e\n\u003cth\u003eScale\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC output voltage; average of both outputs for the differential pair\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 3.3\u003c/td\u003e\n\u003ctd\u003e3.3\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eimbalance_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAbsolute DC difference between the two outputs\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebias_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC V(ibias)\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 3.3\u003c/td\u003e\n\u003ctd\u003e3.3\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC power delivered by VDD, -V(vdd)*I(VDD)\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003egain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e20 log10(abs(transfer)) at 10 Hz\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003emaximize / db20\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebandwidth_hz\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eFirst frequency where transfer gain falls 3 dB below its 10 Hz value\u003c/td\u003e\n\u003ctd\u003eHz\u003c/td\u003e\n\u003ctd\u003emaximize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003elinearity_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMaximum absolute differential-output deviation from the line joining the -10/+10 mV samples\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eslope\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDifferential-output endpoint difference divided by 20 mV\u003c/td\u003e\n\u003ctd\u003eV/V\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e5\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eArea reference: \u003cstrong\u003e925.98 um2\u003c/strong\u003e. 6 expanded device instances; sum of device/contact envelopes 552.0000 um2, per-side envelope allowance 1 um, 50% routing allowance and total outer width/height allowance 2 um. Estimate = ceil(100 * (1.5 * envelope_sum + 2 * margin * sqrt(envelope_sum) + margin^2)) / 100. Here margin is the total allowance across two opposite sides; the envelope sum is displayed rounded to four decimals. MOS/passive envelopes use declared W/L (or resistor dimensions) and multiplicity; explicit tap areas and HBT emitter/contact envelopes are included. This is a frozen engineering estimate, not a foundry minimum or a feasibility claim.\u003c/p\u003e\n\u003cp\u003eThe capability coefficient remains \u003cstrong\u003e4\u003c/strong\u003e; it is independent of\nthe reference-relative task score.\u003c/p\u003e\n\u003ch3 id=\"problem-score-weights\"\u003eScore weights\u003c/h3\u003e\n\u003cp\u003eLocal gain stages: signal transfer 38.6%; bandwidth 11.6%; balance and linearity 19.3%; operating points 3.86%; power 11.6%; area 15%. Each objective's weight is divided equally among its metrics.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.15\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003egain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.193181818182\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eslope\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.193181818182\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebandwidth_hz\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.115909090909\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eimbalance_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.096590909091\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003elinearity_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.096590909091\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebias_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.019318181818\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.019318181818\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.115909090909\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch2 id=\"problem-tools-and-submission\"\u003eTools and Submission\u003c/h2\u003e\n\u003cp\u003eSolve budget: \u003cstrong\u003e3 hours\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eUse the reviewed GF180 resources listed in \u003ccode\u003e/protocol/resources.json\u003c/code\u003e.\nKLayout checks the layout, Magic extracts RC and ngspice simulates the circuit.\n\u003ccode\u003e/protocol/task.json\u003c/code\u003e provides frozen constraints and evaluation requirements;\n\u003ccode\u003e/protocol/harness.json\u003c/code\u003e describes the harness. If \u003ccode\u003eprocess-feedback\u003c/code\u003e is\nexposed, use its published helper for interim checks. Write\n\u003ccode\u003e/workspace/output/final.gds\u003c/code\u003e, then explicitly submit with\n\u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eUse a GDS database unit of 0.001 um, as required by the GF180MCU DRC deck.\u003c/p\u003e\n12:T157a,\u003cp\u003eAll three operating conditions must complete and every observation must be finite\nand meet its inclusive band. Aggregation cannot hide a failing condition;\nmissing crossings or incomplete extraction/simulation cannot establish success.\nSaved waveforms provide the inputs for independently reconstructing observations.\u003c/p\u003e\n\u003cp\u003ePhysical checks and declared functional bounds remain mandatory. Quality has no\nfixed allowed-degradation threshold. Each \u003ccode\u003esource_*\u003c/code\u003e job simulates the declared\nsource circuit with exactly the same testbench, model resources, parameters,\nload and measurement window as its paired extracted-candidate job. A source\nobservation is the 100-point electrical baseline; it is independent of the\nsubmitted GDS. All individual pairs are retained in the evaluation report.\u003c/p\u003e\n\u003cp\u003eFor a post-layout observation x and its source observation b:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eMaximize: q = x/b; minimize: q = b/x. When a numerical scale s is declared,\nuse (x+s)/(b+s) or its inverse. This handles zero-valued error measurements;\ns is a normalization floor, not an allowed degradation or pass threshold.\u003c/li\u003e\n\u003cli\u003eAmplitude dB: q = 10^((x-b)/20) for maximize, its inverse for minimize.\u003c/li\u003e\n\u003cli\u003eTarget: q = 1/(1+abs(x-b)/s), with a declared physical scale s. Signed and\nzero-valued operating points are never divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eScoring uses \u003ccode\u003elayout\u003c/code\u003e. A metric uses its worst paired quality q. The score is\nS = 100 * product(q_i ** w_i), including area quality\nq_area = area_reference / candidate_functional_area. The weights below sum to\none. Dimensions describe measurements but do not determine their weights.\nPhysical or functional rejection scores zero; missing or invalid measurements\nproduce an unknown score, including measurements with zero weight.\nSource-equivalent performance at the area reference scores 100; improvements\ncan exceed 100. A weight expresses a tradeoff, not a hard acceptance limit.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eDefinition / observations\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eQuality rule\u003c/th\u003e\n\u003cth\u003eFunctional bounds\u003c/th\u003e\n\u003cth\u003eScale\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC output voltage; average of both outputs for the differential pair\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 3.3\u003c/td\u003e\n\u003ctd\u003e3.3\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eimbalance_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAbsolute DC difference between the two outputs\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebias_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC V(ibias)\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 3.3\u003c/td\u003e\n\u003ctd\u003e3.3\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC power delivered by VDD, -V(vdd)*I(VDD)\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003egain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e20 log10(abs(transfer)) at 10 Hz\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003emaximize / db20\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebandwidth_hz\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eFirst frequency where transfer gain falls 3 dB below its 10 Hz value\u003c/td\u003e\n\u003ctd\u003eHz\u003c/td\u003e\n\u003ctd\u003emaximize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003elinearity_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMaximum absolute differential-output deviation from the line joining the -10/+10 mV samples\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eslope\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDifferential-output endpoint difference divided by 20 mV\u003c/td\u003e\n\u003ctd\u003eV/V\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e5\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eArea reference: \u003cstrong\u003e925.98 um2\u003c/strong\u003e. 6 expanded device instances; sum of device/contact envelopes 552.0000 um2, per-side envelope allowance 1 um, 50% routing allowance and total outer width/height allowance 2 um. Estimate = ceil(100 * (1.5 * envelope_sum + 2 * margin * sqrt(envelope_sum) + margin^2)) / 100. Here margin is the total allowance across two opposite sides; the envelope sum is displayed rounded to four decimals. MOS/passive envelopes use declared W/L (or resistor dimensions) and multiplicity; explicit tap areas and HBT emitter/contact envelopes are included. This is a frozen engineering estimate, not a foundry minimum or a feasibility claim.\u003c/p\u003e\n\u003cp\u003eThe capability coefficient remains \u003cstrong\u003e4\u003c/strong\u003e; it is independent of\nthe reference-relative task score.\u003c/p\u003e\n\u003ch3\u003eScore weights\u003c/h3\u003e\n\u003cp\u003eLocal gain stages: signal transfer 38.6%; bandwidth 11.6%; balance and linearity 19.3%; operating points 3.86%; power 11.6%; area 15%. Each objective's weight is divided equally among its metrics.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.15\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003egain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.193181818182\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eslope\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.193181818182\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebandwidth_hz\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.115909090909\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eimbalance_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.096590909091\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003elinearity_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.096590909091\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebias_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.019318181818\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.019318181818\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.115909090909\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n13:T4e1,\u003cp\u003eSubmit top cell \u003ccode\u003edp_001_resistive_load\u003c/code\u003e with every named electrical port, resolved hierarchy\nand a file size at most 10 MiB. Artifact, GF180 variant-D DRC including antenna,\nstrict named-port LVS and geometry must pass, without DRC waivers. Chip-level\ndensity and seal-ring closure are outside this standalone-block scope.\u003c/p\u003e\n\u003cp\u003eThe functional bounding box must fit within 160 by 160 um. Area includes all\nprocess device and routing drawing layers listed in runtime constraints:\nwells, implants, active, poly, contacts, metals/vias and passive/device markers.\nAnnotation and pin-purpose shapes are excluded; all functional routing must use\ndrawing layers. The complete layer list is frozen in \u003ccode\u003e/protocol/task.json\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eThe judge independently extracts distributed wiring resistance and capacitance\nfrom the submitted GDS, retaining candidate-derived MOS/passive geometry and\nexternal body connections. Every scored simulation consumes that extracted DUT.\nThis model boundary does not include a distributed silicon substrate network.\nThe output has a high common-mode level; it is not a rail-to-rail amplifier. Transient settling, mismatch, noise, PVT and EM are outside scope. Manufacturing signoff is not claimed.\u003c/p\u003e\n6:[\"$\",\"$8\",null,{\"fallback\":[\"$\",\"p\",null,{\"children\":\"Loading published evidence…\"}],\"children\":[\"$\",\"$L10\",null,{\"task\":{\"case_path\":\"tasks/gf180mcuD/analog-db/cases/dp_001_resistive_load/case.toml\",\"coefficient\":4,\"collection\":\"analog-db\",\"configuration_url\":\"/ICLayout-Bench/assets/3731b97781f49826538972a11873f565a6888789bb4c0710206cd90234436ec7.txt\",\"description_html\":\"$11\",\"description_path\":\"tasks/gf180mcuD/analog-db/cases/dp_001_resistive_load/problem.md\",\"hours\":3,\"id\":\"gf180mcuD.analog-db.dp_001_resistive_load\",\"inputs\":{\"description\":{\"format\":\"text\",\"path\":\"problem.md\",\"sha256\":\"dd31b11683d05938f2a7a36a144ef7220bc5d2c2ca7c406ee1ed0d6a0367e7fd\"},\"netlist\":{\"format\":\"spice\",\"path\":\"materials/circuit.spice\",\"sha256\":\"15f8f3ea58d21ec06d4a72fb79abe6f7be80102d06ae9819a892ac0ab96e2c71\",\"subcircuit\":\"dp_001_resistive_load\"},\"performance\":{\"format\":\"spice\",\"path\":\"materials/testbench.spice\",\"sha256\":\"0844c14284ff4aad3556b61e8ac55981b1315ee1fccd639c56be004b6e23f5ef\"}},\"licenses\":[{\"name\":\"LICENSE\",\"path\":\"tasks/gf180mcuD/analog-db/LICENSE\",\"url\":\"/ICLayout-Bench/assets/d6c09a4fa902f192f05e697110788e520f294a97446ababab65986137c16fceb.txt\"},{\"name\":\"NOTICE\",\"path\":\"tasks/gf180mcuD/analog-db/NOTICE\",\"url\":\"/ICLayout-Bench/assets/75d61165620fd72b89f65e52c2b6c85b73d410bd293062873390b \"Produces differential gain with resistive loads and a fixed input pair.\",\"title\":\"Resistively Loaded Differential Pair\"},\"schematic_url\":\"/ICLayout-Bench/assets/0a9b8b8047ca604c4678f5f21881d8cedc806bb47888d1f0f8746e50ea9f0300.svg\",\"scoring\":{\"area_metric\":\"functional_area\",\"area_target\":925.98,\"method\":\"layout\",\"rationale\":\"Local gain stages: signal transfer 38.6%; bandwidth 11.6%; balance and linearity 19.3%; operating points 3.86%; power 11.6%; area 15%. Each objective's weight is divided equally among its metrics.\",\"weights\":{\"bandwidth_hz\":0.115909090909,\"bias_v\":0.019318181818,\"functional_area\":0.15,\"gain_db\":0.193181818182,\"imbalance_v\":0.096590909091,\"linearity_v\":0.096590909091,\"output_v\":0.019318181818,\"power_w\":0.115909090909,\"slope\":0.193181818182}},\"sections\":{\"Electrical Requirements and Scoring\":\"$12\",\"Objective\":\"\u003cp\u003eImplement the fixed \u003ccode\u003edp_001_resistive_load\u003c/code\u003e circuit in GF180MCU D and submit self-contained GDS.\\nFour NMOS devices form a differential input pair and tail-current mirror. Two physical GF180 ppolyf_u_1k loads each have width 2 um and length 44 um (22 squares, nominally 22 kohm). MOS dimensions and the resistor ratio follow the fixed binding; the ideal source resistors become process devices with substrate terminals at VSS.\u003c/p\u003e\\n\",\"Operating Conditions\":\"\u003cp\u003eUse the typical GF180 3.3 V MOS models and physical poly models where present,\\nwith statistical variation disabled. Unless swept explicitly, temperature is 27 C.\\nVDD = 3.3 V, VSS = 0 V; 20 uA from VDD into ibias; input common mode = 1.2, 1.65 and 2.1 V; external 1 pF on each output. The input differential signal is split +0.5/-0.5 around common mode. AC differential amplitude is 1 V. DC transfer sweeps differential input from -10.1 to +10.1 mV in 0.1 mV increments; requirements use only -10 to +10 mV. Output differential voltage is V(voutn)-V(voutp).\u003c/p\u003e\\n\u003cp\u003eAC uses 100 points per decade from 1 Hz to 1 GHz. Gain-stage transfer is\\nV(vout) for unit AC injection; differential-pair transfer is V(voutn)-V(voutp)\\nfor unit differential excitation; the OTA transfer is defined above.\u003c/p\u003e\\n\",\"Physical Requirements\":\"$13\"},\"source_url\":\"https://github.com/MacAnalog/spicexplorer-release/tree/263d0322f8900dc331536fbbe6c0e804514fc454/analog-db/circuits/dp_001_resistive_load\",\"status\":\"qualified\",\"title\":\"Resistively Loaded Differential Pair\"},\"catalog\":{\"boards\":[],\"contexts\":[],\"experiments\":[],\"runs\":[],\"tasks\":[]},\"evidenceError\":false}]}]\nc:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n14:I[27201,[\"/ICLayout-Bench/_next/static/chunks/3gll1ekbrh320.js\"],\"IconMark\"]\n9:null\ne:[[\"$\",\"title\",\"0\",{\"children\":\"ICLayout-Bench | Circuit layout intelligence\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Measured progress in AI-driven integrated circuit layout. Explore circuits, model conditions and reviewed experimental evidence.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/ICLayout-Bench/brand/iclayout-bench.svg\",\"type\":\"image/svg+xml\",\"sizes\":\"any\"}],[\"$\",\"$L14\",\"3\",{}]]\n"])</script></body></html>
