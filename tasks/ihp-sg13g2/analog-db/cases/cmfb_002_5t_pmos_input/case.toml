[toolchain]
schema_version = 1

[toolchain.bindings]
"layout.artifact" = "artifact"
"layout.drc" = "drc"
"layout.lvs" = "lvs"
"layout.geometry" = "geometry"
"layout.extract_rc" = "rc"
"circuit.simulate" = "simulation"

[toolchain.backends.artifact]
type = "klayout-docker"

[toolchain.backends.artifact.settings]
image = "iclayout-bench-tools:ngspice45"
check = "artifact"
timeout_seconds = 600

[toolchain.backends.drc]
type = "klayout-docker"

[toolchain.backends.drc.support_profiles]
support = "klayout"

[toolchain.backends.drc.settings]
image = "iclayout-bench-tools:ngspice45"
check = "drc"
support = "build/support/analog-db-klayout"
profile = "drc-upstream.json"
timeout_seconds = 600

[toolchain.backends.lvs]
type = "klayout-docker"

[toolchain.backends.lvs.support_profiles]
support = "klayout"

[toolchain.backends.lvs.settings]
image = "iclayout-bench-tools:ngspice45"
check = "lvs"
support = "build/support/analog-db-klayout"
profile = "lvs-upstream.json"
timeout_seconds = 600

[toolchain.backends.rc]
type = "magic-rc-docker"

[toolchain.backends.rc.support_profiles]
support = "magic"

[toolchain.backends.rc.settings]
image = "iclayout-bench-tools:ngspice45"
support = "build/support/analog-db-magic"
technology = "magic/ihp-sg13g2.tech"
tech_name = "ihp-sg13g2"
style = "ngspice()"
capacitance_threshold_ff = 0
timeout_seconds = 600

[toolchain.backends.geometry]
type = "klayout-geometry-docker"

[toolchain.backends.geometry.settings]
image = "iclayout-bench-tools:ngspice45"
timeout_seconds = 120

[toolchain.backends.simulation]
type = "ngspice-docker"

[toolchain.backends.simulation.support_profiles]
support = "analog-res-models"

[toolchain.backends.simulation.settings]
image = "iclayout-bench-tools:ngspice45"
support = "build/support/analog-db-analog-models"
timeout_seconds = 600

