[task.evaluation]
schema_version = 1
mode = "post_layout"

[task.evaluation.scoring]
method = "layout-v2"
area_metric = "functional_area"
area_target = 1326.32

[[task.evaluation.jobs]]
id = "artifact"
stage = "check"
operation = "layout.artifact"
gate = "artifact"

[task.evaluation.jobs.inputs]
layout = "candidate"
task = "task"

[[task.evaluation.jobs]]
id = "drc"
stage = "check"
operation = "layout.drc"
gate = "drc"

[task.evaluation.jobs.inputs]
layout = "candidate"
task = "task"

[[task.evaluation.jobs]]
id = "lvs"
stage = "check"
operation = "layout.lvs"
gate = "lvs"

[task.evaluation.jobs.inputs]
layout = "candidate"
task = "task"
netlist = "input:netlist"

[task.evaluation.jobs.outputs]
database = "klayout-lvs"
binding = "json"

[[task.evaluation.jobs]]
id = "geometry"
stage = "check"
operation = "layout.geometry"
gate = "constraint"
requires = [
    "artifact",
    "drc",
    "lvs",
]

[task.evaluation.jobs.inputs]
layout = "candidate"
task = "task"
constraints = "input:constraints"
database = "job:lvs:database"
binding = "job:lvs:binding"

[[task.evaluation.jobs]]
id = "parasitics"
stage = "extract"
operation = "layout.parasitics"
requires = [
    "artifact",
    "drc",
    "lvs",
    "geometry",
]

[task.evaluation.jobs.inputs]
layout = "candidate"
task = "task"

[task.evaluation.jobs.outputs]
netlist = "spice"

[task.evaluation.jobs.parameters]
top_cell = "LNA160_FOUR_STAGE"
ports = [
    "IN",
    "OUT",
    "VDD",
    "VSS",
    "VBIAS",
]

[[task.evaluation.jobs]]
id = "nominal"
stage = "simulate"
operation = "circuit.simulate"

[task.evaluation.jobs.inputs]
circuit = "job:parasitics:netlist"
deck = "input:performance"

[task.evaluation.jobs.outputs]
op = "ngspice-raw"
ac = "ngspice-raw"

[task.evaluation.jobs.parameters.values]
vin_dc = 0.8
vbias_dc = 0.76

[task.evaluation.jobs.parameters.measurements]
vin_bias = "V"
out_bias = "V"
i_vdd = "A"
i_vbias = "A"
gain_db = "dB"

[task.evaluation.jobs.parameters.exports]
op = "operating_point.raw"
ac = "frequency_response.raw"

[[task.evaluation.jobs]]
id = "source_nominal"
stage = "simulate"
operation = "circuit.simulate"

[task.evaluation.jobs.inputs]
circuit = "input:simulation"
deck = "input:performance"

[task.evaluation.jobs.outputs]
op = "ngspice-raw"
ac = "ngspice-raw"

[task.evaluation.jobs.parameters.values]
vin_dc = 0.8
vbias_dc = 0.76

[task.evaluation.jobs.parameters.measurements]
vin_bias = "V"
out_bias = "V"
i_vdd = "A"
i_vbias = "A"
gain_db = "dB"

[task.evaluation.jobs.parameters.exports]
op = "operating_point.raw"
ac = "frequency_response.raw"

[[task.evaluation.metrics]]
id = "functional_area"
category = "physical"
observations = [
    "geometry:area",
]
unit = "um2"
direction = "minimize"
aggregation = "max"

[[task.evaluation.metrics]]
id = "gain_db"
category = "performance"
observations = [
    "nominal:gain_db",
]
unit = "dB"
direction = "maximize"
aggregation = "min"
dimension = "response"
baseline = [
    "source_nominal:gain_db",
]
normalization = "db20"

[[task.evaluation.metrics]]
id = "output_bias"
category = "performance"
observations = [
    "nominal:out_bias",
]
unit = "V"
direction = "target"
aggregation = "min"
dimension = "bias"
baseline = [
    "source_nominal:out_bias",
]
normalization = "target"
scale = 1.2
lower = 0
upper = 1.2

[[task.evaluation.metrics]]
id = "supply_current"
category = "performance"
observations = [
    "nominal:i_vdd",
]
unit = "A"
direction = "minimize"
aggregation = "min"
dimension = "supply"
baseline = [
    "source_nominal:i_vdd",
]
normalization = "ratio"
scale = 1e-12
lower = 0

[toolchain]
schema_version = 1

[toolchain.bindings]
"layout.artifact" = "artifact"
"layout.drc" = "drc"
"layout.lvs" = "lvs"
"layout.geometry" = "geometry"
"layout.parasitics" = "parasitics"
"circuit.simulate" = "simulation"

[toolchain.backends.artifact]
type = "klayout-docker"

[toolchain.backends.artifact.settings]
image = "iclayout-bench-tools:local"
check = "artifact"
timeout_seconds = 600

[toolchain.backends.drc]
type = "klayout-docker"

[toolchain.backends.drc.support_profiles]
support = "klayout"

[toolchain.backends.drc.settings]
image = "iclayout-bench-tools:local"
check = "drc"
support = "build/support/lna160-klayout"
profile = "drc-upstream.json"
timeout_seconds = 600

[toolchain.backends.lvs]
type = "klayout-docker"

[toolchain.backends.lvs.support_profiles]
support = "klayout"

[toolchain.backends.lvs.settings]
image = "iclayout-bench-tools:local"
check = "lvs"
support = "build/support/lna160-klayout"
profile = "lvs-upstream.json"
timeout_seconds = 600

[toolchain.backends.geometry]
type = "klayout-geometry-docker"

[toolchain.backends.geometry.settings]
image = "iclayout-bench-tools:local"
timeout_seconds = 600

[toolchain.backends.parasitics]
type = "sg13g2-hbt-rc-docker"

[toolchain.backends.parasitics.support_profiles]
klayout_support = "klayout"
magic_support = "magic"

[toolchain.backends.parasitics.settings]
image = "iclayout-bench-tools:local"
klayout_support = "build/support/lna160-klayout"
klayout_profile = "lvs-upstream.json"
magic_support = "build/support/lna160-magic"
technology = "magic/ihp-sg13g2.tech"
tech_name = "ihp-sg13g2"
style = "ngspice()"
disable_tap_extraction = true
timeout_seconds = 600

[toolchain.backends.simulation]
type = "ngspice-docker"

[toolchain.backends.simulation.support_profiles]
support = "hbt-models"

[toolchain.backends.simulation.settings]
image = "iclayout-bench-tools:local"
support = "build/support/lna160-hbt-models"
timeout_seconds = 600

[qualification]
evidence = "README.md"
reference = "reference/LNA160_FOUR_STAGE.gds"

[origin]
url = "https://github.com/IHP-GmbH/TO_Apr2025/blob/63e203a0eccfb6028a1a0a8364553e4e979b55b3/160GHz_LNA/design_data/qucs-s/160GHz_LNA(MAIN).sch"
