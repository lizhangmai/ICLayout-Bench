schema_version = 2
kind = "layout_case"
id = "TO_Apr2025.97_GHZ_LINEAR_TIA"
title = "TO_Apr2025 97-derived multi-stage linear TIA"
status = "qualified"

[task]
coefficient = 6
kind = "netlist_to_gds"
family = "ihp_sg13g2_hbt_tia_physical"
environment = "ihp-sg13g2-to-97-derived-linear-tia"

[task.inputs.description]
path = "problem.md"
sha256 = "c03831618b2694d9a5de788e7e0c44576d725e5bf1fd9785bde719b6614f6f05"
format = "text"

[task.inputs.netlist]
path = "materials/circuit.cdl"
sha256 = "150ab19522eecccf2889ed62c07b14e15e29e97a75ce12563fcd95d846be9112"
format = "spice"
subcircuit = "FMD_QNC_01_LIN_TIA"

[task.inputs.simulation]
path = "materials/circuit.spice"
sha256 = "fc6c9d1a6ea884f20e7cbddee9c30b4feff18e4a70fbf729789101955a87c334"
format = "spice"

[task.inputs.performance]
path = "materials/testbench.spice"
sha256 = "759a7548f5ea81399322a73a10b58207d3ff28b2a5ed0ef7d55850b1a6b3959e"
format = "spice"

[task.constraints]
schema_version = 1

[[task.constraints.hard]]
id = "outline"
type = "bbox_max"
functional_layers = [
  [1, 0], [3, 0], [5, 0], [6, 0], [7, 0], [8, 0], [10, 0], [11, 0],
  [13, 0], [14, 0], [19, 0], [24, 0], [26, 0], [28, 0], [29, 0], [30, 0],
  [31, 0], [32, 0], [33, 0], [35, 0], [36, 0], [40, 0], [44, 0], [46, 0],
  [49, 0], [50, 0], [51, 0], [52, 0], [53, 0], [55, 0], [58, 0], [66, 0],
  [67, 0], [90, 0], [101, 0], [111, 0], [125, 0], [126, 0], [128, 0], [129, 0],
  [133, 0], [134, 0], [139, 0], [152, 0],
]
max_width_um = 720
max_height_um = 620

[[task.constraints.quality]]
id = "area"
type = "functional_bbox_area"
layers_from = "outline"

[task.output]
path = "output/final.gds"
format = "gds"
top_cell = "FMD_QNC_01_LIN_TIA"
max_bytes = 33554432

[task.evaluation]
schema_version = 1
mode = "post_layout"

[task.evaluation.scoring]
method = "layout-v1"
area_metric = "functional_area"
area_target = 420000
area_zero = 446400

[[task.evaluation.jobs]]
id = "artifact"
stage = "check"
operation = "layout.artifact"
gate = "artifact"
inputs = { layout = "candidate", task = "task" }

[[task.evaluation.jobs]]
id = "drc"
stage = "check"
operation = "layout.drc"
gate = "drc"
inputs = { layout = "candidate", task = "task" }

[[task.evaluation.jobs]]
id = "lvs"
stage = "check"
operation = "layout.lvs"
gate = "lvs"
inputs = { layout = "candidate", task = "task", netlist = "input:netlist" }
outputs = { database = "klayout-lvs", binding = "json" }

[[task.evaluation.jobs]]
id = "geometry"
stage = "check"
operation = "layout.geometry"
gate = "constraint"
requires = ["artifact", "drc", "lvs"]
inputs = { layout = "candidate", task = "task", constraints = "input:constraints", database = "job:lvs:database", binding = "job:lvs:binding" }

[[task.evaluation.metrics]]
id = "functional_area"
category = "physical"
observations = ["geometry:area"]
unit = "um2"
direction = "minimize"
aggregation = "max"

[[task.evaluation.jobs]]
id = "parasitics"
stage = "extract"
operation = "layout.parasitics"
requires = ["artifact", "drc", "lvs", "geometry"]
inputs = { layout = "candidate", task = "task" }
outputs = { netlist = "spice" }

[task.evaluation.jobs.parameters]
ports = ["RFIN", "RFOUT", "VCC1", "VCC2", "VCC3", "VSS"]

[[task.evaluation.jobs]]
id = "negative"
stage = "simulate"
operation = "circuit.simulate"
inputs = { circuit = "job:parasitics:netlist", deck = "input:performance" }
outputs = { op = "ngspice-raw", ac = "ngspice-raw", dc = "ngspice-raw" }

[task.evaluation.jobs.parameters.values]
input_current = -0.000005

[task.evaluation.jobs.parameters.measurements]
input_bias = "V"
output_bias = "V"
supply_power = "W"
supply1_current = "A"
supply2_current = "A"
supply3_current = "A"
transimpedance_low = "ohm"
transimpedance_high = "ohm"
linearity_error_pct = "percent"

[task.evaluation.jobs.parameters.exports]
op = "operating_point.raw"
ac = "frequency_response.raw"
dc = "dc_transfer.raw"

[[task.evaluation.jobs]]
id = "zero"
stage = "simulate"
operation = "circuit.simulate"
inputs = { circuit = "job:parasitics:netlist", deck = "input:performance" }
outputs = { op = "ngspice-raw", ac = "ngspice-raw", dc = "ngspice-raw" }

[task.evaluation.jobs.parameters.values]
input_current = 0

[task.evaluation.jobs.parameters.measurements]
input_bias = "V"
output_bias = "V"
supply_power = "W"
supply1_current = "A"
supply2_current = "A"
supply3_current = "A"
transimpedance_low = "ohm"
transimpedance_high = "ohm"
linearity_error_pct = "percent"

[task.evaluation.jobs.parameters.exports]
op = "operating_point.raw"
ac = "frequency_response.raw"
dc = "dc_transfer.raw"

[[task.evaluation.jobs]]
id = "positive"
stage = "simulate"
operation = "circuit.simulate"
inputs = { circuit = "job:parasitics:netlist", deck = "input:performance" }
outputs = { op = "ngspice-raw", ac = "ngspice-raw", dc = "ngspice-raw" }

[task.evaluation.jobs.parameters.values]
input_current = 0.000005

[task.evaluation.jobs.parameters.measurements]
input_bias = "V"
output_bias = "V"
supply_power = "W"
supply1_current = "A"
supply2_current = "A"
supply3_current = "A"
transimpedance_low = "ohm"
transimpedance_high = "ohm"
linearity_error_pct = "percent"

[task.evaluation.jobs.parameters.exports]
op = "operating_point.raw"
ac = "frequency_response.raw"
dc = "dc_transfer.raw"

[[task.evaluation.metrics]]
id = "transimpedance_low"
category = "performance"
observations = ["negative:transimpedance_low", "zero:transimpedance_low", "positive:transimpedance_low"]
unit = "ohm"
direction = "target"
aggregation = "min"
lower = 300
upper = 700
dimension = "response"
zero_lower = 0
zero_upper = 1000

[[task.evaluation.metrics]]
id = "transimpedance_high"
category = "performance"
observations = ["negative:transimpedance_high", "zero:transimpedance_high", "positive:transimpedance_high"]
unit = "ohm"
direction = "target"
aggregation = "min"
lower = 300
upper = 700
dimension = "response"
zero_lower = 0
zero_upper = 1000

[[task.evaluation.metrics]]
id = "linearity_error_pct"
category = "performance"
observations = ["negative:linearity_error_pct", "zero:linearity_error_pct", "positive:linearity_error_pct"]
unit = "percent"
direction = "target"
aggregation = "max"
lower = 0
upper = 2
dimension = "response"
zero_lower = 0
zero_upper = 4

[[task.evaluation.metrics]]
id = "input_bias"
category = "performance"
observations = ["negative:input_bias", "zero:input_bias", "positive:input_bias"]
unit = "V"
direction = "target"
aggregation = "min"
lower = 0.55
upper = 1.05
dimension = "bias"
zero_lower = 0.3
zero_upper = 1.3

[[task.evaluation.metrics]]
id = "output_bias"
category = "performance"
observations = ["negative:output_bias", "zero:output_bias", "positive:output_bias"]
unit = "V"
direction = "target"
aggregation = "min"
lower = 1.4
upper = 2.7
dimension = "bias"
zero_lower = 1.1
zero_upper = 3.0

[[task.evaluation.metrics]]
id = "supply_power"
category = "performance"
observations = ["negative:supply_power", "zero:supply_power", "positive:supply_power"]
unit = "W"
direction = "target"
aggregation = "max"
lower = 0.001
upper = 0.02
dimension = "supply"
zero_lower = 0.0005
zero_upper = 0.03

[[assets]]
path = "reference/FMD_QNC_01_LIN_TIA.gds"
role = "physical-witness"
