category = "physical"
observations = [
    "geometry:area",
]
unit = "um2"
direction = "minimize"
aggregation = "max"

[[task.evaluation.metrics]]
id = "output_gain"
category = "performance"
observations = [
    "nominal:output_gain",
]
unit = "V/V"
direction = "maximize"
aggregation = "min"
dimension = "response"
baseline = [
    "source_nominal:output_gain",
]
normalization = "ratio"
lower = 0

[[task.evaluation.metrics]]
id = "output_gain_high"
category = "performance"
observations = [
    "nominal:output_gain_high",
]
unit = "V/V"
direction = "maximize"
