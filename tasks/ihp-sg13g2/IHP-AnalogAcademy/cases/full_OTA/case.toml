area_metric = "functional_area"
area_target = 2936.48

[[task.evaluation.jobs]]
id = "artifact"
stage = "check"
operation = "layout.artifact"
gate = "artifact"

[task.evaluation.jobs.inputs]
layout = "candidate"
task = "task"

[[task.evaluation.jobs]]
id = "drc"
stage = "check"
operation = "layout.drc"
gate = "drc"

[task.evaluation.jobs.inputs]
layout = "candidate"
task = "task"

[[task.evaluation.jobs]]
id = "lvs"
stage = "check"
operation = "layout.lvs"
gate = "lvs"

[task.evaluation.jobs.inputs]
layout = "candidate"
task = "task"
netlist = "input:netlist"

[task.evaluation.jobs.outputs]
database = "klayout-lvs"
binding = "json"

[[task.evaluation.jobs]]
id = "geometry"
stage = "check"
operation = "layout.geometry"
gate = "constraint"
requires = [
    "artifact",
    "drc",
    "lvs",
]

[task.evaluation.jobs.inputs]
layout = "candidate"
task = "task"
constraints = "input:constraints"
database = "job:lvs:database"
binding = "job:lvs:binding"

[[task.evaluation.jobs]]
id = "parasitics"
stage = "extract"
operation = "layout.extract_rc"
requires = [
    "artifact",
    "drc",
    "lvs",
    "geometry",
]

[task.evaluation.jobs.inputs]
layout = "candidate"

[task.evaluation.jobs.outputs]
netlist = "spice"

[task.evaluation.jobs.parameters]
top_cell = "two_stage_OTA_layout"
ports = [
    "v-",
    "v+",
    "vss",
    "vdd",
    "iout",
    "vout",
]

[[task.evaluation.jobs]]
id = "nominal"
stage = "simulate"
operation = "circuit.simulate"

[task.evaluation.jobs.inputs]
deck = "input:performance"
dut = "job:parasitics:netlist"

[task.evaluation.jobs.outputs]
ac = "ngspice-raw"
op = "ngspice-raw"

[task.evaluation.jobs.parameters.exports]
ac = "ota-ac.raw"
op = "ota-op.raw"

[task.evaluation.jobs.parameters.measurements]
low_frequency_gain = "dB"
unity_gain_bandwidth = "Hz"
phase_margin = "deg"
supply_power = "W"
output_bias = "V"

[[task.evaluation.jobs]]
id = "source_nominal"
stage = "simulate"
operation = "circuit.simulate"

[task.evaluation.jobs.inputs]
deck = "input:performance"
dut = "input:simulation"

[task.evaluation.jobs.outputs]
ac = "ngspice-raw"
op = "ngspice-raw"

[task.evaluation.jobs.parameters.exports]
ac = "ota-ac.raw"
op = "ota-op.raw"

[task.evaluation.jobs.parameters.measurements]
low_frequency_gain = "dB"
unity_gain_bandwidth = "Hz"
phase_margin = "deg"
supply_power = "W"
output_bias = "V"

[[task.evaluation.metrics]]
id = "functional_area"
category = "physical"
observations = [
    "geometry:area",
]
unit = "um2"
direction = "minimize"
aggregation = "max"

[[task.evaluation.metrics]]
id = "low_frequency_gain"
category = "performance"
observations = [
    "nominal:low_frequency_gain",
]
unit = "dB"
direction = "maximize"
aggregation = "min"
dimension = "response"
baseline = [
    "source_nominal:low_frequency_gain",
]
normalization = "db20"

[[task.evaluation.metrics]]
id = "unity_gain_bandwidth"
category = "performance"
observations = [
    "nominal:unity_gain_bandwidth",
]
unit = "Hz"
direction = "maximize"
aggregation = "min"
dimension = "response"
baseline = [
    "source_nominal:unity_gain_bandwidth",
]
normalization = "ratio"
lower = 0

[[task.evaluation.metrics]]
id = "phase_margin"
category = "performance"
observations = [
    "nominal:phase_margin",
]
unit = "deg"
direction = "target"
aggregation = "min"
dimension = "response"
baseline = [
    "source_nominal:phase_margin",
]
normalization = "target"
scale = 180
lower = 0
upper = 180

[[task.evaluation.metrics]]
id = "supply_power"
category = "performance"
observations = [
    "nominal:supply_power",
]
unit = "W"
direction = "minimize"
aggregation = "max"
dimension = "supply"
baseline = [
    "source_nominal:supply_power",
]
normalization = "ratio"
lower = 0
scale = 1e-12

[[task.evaluation.metrics]]
id = "output_bias"
category = "performance"
observations = [
    "nominal:output_bias",
]
unit = "V"
direction = "target"
aggregation = "min"
dimension = "bias"
baseline = [
    "source_nominal:output_bias",
]
normalization = "target"
scale = 1.2
lower = 0
upper = 1.2

[toolchain]
schema_version = 1

[toolchain.backends.artifact]
type = "klayout-docker"

[toolchain.backends.artifact.settings]
image = "iclayout-bench-tools:local"
check = "artifact"

[toolchain.backends.drc]
type = "klayout-docker"

[toolchain.backends.drc.support_profiles]
support = "klayout"

[toolchain.backends.drc.settings]
image = "iclayout-bench-tools:local"
check = "drc"
support = "build/support/full-ota-klayout-spice"
profile = "drc-upstream.json"
timeout_seconds = 600

[toolchain.backends.lvs]
type = "klayout-docker"

[toolchain.backends.lvs.support_profiles]
support = "klayout"

[toolchain.backends.lvs.settings]
image = "iclayout-bench-tools:local"
check = "lvs"
support = "build/support/full-ota-klayout-spice"
profile = "lvs-upstream.json"
timeout_seconds = 600

[toolchain.backends.rc]
type = "magic-rc-docker"

[toolchain.backends.rc.support_profiles]
support = "magic"

[toolchain.backends.rc.settings]
image = "iclayout-bench-tools:local"
support = "build/support/full-ota-magic"
technology = "magic/ihp-sg13g2.tech"
tech_name = "ihp-sg13g2"
style = "ngspice()"
capacitance_threshold_ff = 0
timeout_seconds = 600

[toolchain.backends.geometry]
type = "klayout-geometry-docker"

[toolchain.backends.geometry.settings]
image = "iclayout-bench-tools:local"
timeout_seconds = 120

[toolchain.backends.simulation]
type = "ngspice-docker"

[toolchain.backends.simulation.support_profiles]
support = "analog-models"

[toolchain.backends.simulation.settings]
image = "iclayout-bench-tools:local"
support = "build/support/full-ota-models"
timeout_seconds = 600

[toolchain.bindings]
"layout.artifact" = "artifact"
"layout.drc" = "drc"
"layout.lvs" = "lvs"
"layout.geometry" = "geometry"
"layout.extract_rc" = "rc"
"circuit.simulate" = "simulation"

[qualification]
evidence = "README.md"
reference = "reference/two_stage_OTA_layout.gds"

