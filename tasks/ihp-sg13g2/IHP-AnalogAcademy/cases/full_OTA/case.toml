schema_version = 2
kind = "layout_case"
id = "module_1_bandgap_reference.part_3_layout.OTA_layout.full_OTA"
title = "IHP AnalogAcademy full_OTA"
status = "qualified"

# Solver inputs, answer contract, and nominal post-layout requirements.
[task]
coefficient = 6
kind = "netlist_to_gds"
family = "ihp_sg13g2_two_stage_ota"
environment = "ihp-sg13g2-full-ota-rc-tt"

[task.inputs.description]
path = "problem.md"
sha256 = "6fa91e90a344586542014e8fa2176731e0c01c87e1ceed6c13dd6718bf69b997"
format = "text"

[task.inputs.netlist]
path = "materials/circuit.cdl"
sha256 = "b26120b95af66cc4075ac9d12a25444b6badbe7e2c96b50d7a1bd7a15b0cf409"
format = "spice"
subcircuit = "two_stage_OTA_layout"

[task.inputs.simulation]
path = "materials/circuit.spice"
sha256 = "2c82bb396be0377ae24ee933e5402f87edf9e5da5f2c509774e6ff5c50705a20"
format = "spice"

[task.inputs.performance]
path = "materials/testbench.spice"
sha256 = "62851f9d9bf6754a4d9b70ca2d9d63a0fd6241ae5e65b289fc5e2e8882469bea"
format = "spice"

[task.constraints]
schema_version = 1

[[task.constraints.hard]]
id = "outline"
type = "bbox_max"
functional_layers = [
  [1, 0], [3, 0], [5, 0], [6, 0], [7, 0], [8, 0], [10, 0], [11, 0],
  [13, 0], [14, 0], [19, 0], [24, 0], [26, 0], [28, 0], [29, 0], [30, 0],
  [31, 0], [32, 0], [33, 0], [35, 0], [36, 0], [40, 0], [44, 0], [46, 0],
  [49, 0], [50, 0], [51, 0], [52, 0], [53, 0], [55, 0], [58, 0], [66, 0],
  [67, 0], [90, 0], [101, 0], [111, 0], [125, 0], [126, 0], [128, 0], [129, 0],
  [133, 0], [134, 0], [139, 0], [152, 0],
]
max_width_um = 80
max_height_um = 50

[[task.constraints.quality]]
id = "area"
type = "functional_bbox_area"
layers_from = "outline"

[task.output]
path = "output/final.gds"
format = "gds"
top_cell = "two_stage_OTA_layout"
max_bytes = 10485760

[task.evaluation]
schema_version = 1
mode = "post_layout"

[task.evaluation.scoring]
method = "layout-v1"
area_metric = "functional_area"
area_target = 2800
area_zero = 4000

[[task.evaluation.jobs]]
id = "artifact"
stage = "check"
operation = "layout.artifact"
gate = "artifact"
inputs = { layout = "candidate", task = "task" }

[[task.evaluation.jobs]]
id = "drc"
stage = "check"
operation = "layout.drc"
gate = "drc"
inputs = { layout = "candidate", task = "task" }

[[task.evaluation.jobs]]
id = "lvs"
stage = "check"
operation = "layout.lvs"
gate = "lvs"
inputs = { layout = "candidate", task = "task", netlist = "input:netlist" }
outputs = { database = "klayout-lvs", binding = "json" }

[[task.evaluation.jobs]]
id = "geometry"
stage = "check"
operation = "layout.geometry"
gate = "constraint"
requires = ["artifact", "drc", "lvs"]
inputs = { layout = "candidate", task = "task", constraints = "input:constraints", database = "job:lvs:database", binding = "job:lvs:binding" }

[[task.evaluation.jobs]]
id = "parasitics"
stage = "extract"
operation = "layout.extract_rc"
requires = ["artifact", "drc", "lvs", "geometry"]
inputs = { layout = "candidate" }
outputs = { netlist = "spice" }
parameters = { top_cell = "two_stage_OTA_layout", ports = ["v-", "v+", "vss", "vdd", "iout", "vout"] }

[[task.evaluation.jobs]]
id = "nominal"
stage = "simulate"
operation = "circuit.simulate"
inputs = { deck = "input:performance", dut = "job:parasitics:netlist" }
outputs = { ac = "ngspice-raw", op = "ngspice-raw" }
[task.evaluation.jobs.parameters]
exports = { ac = "ota-ac.raw", op = "ota-op.raw" }
[task.evaluation.jobs.parameters.measurements]
low_frequency_gain = "dB"
unity_gain_bandwidth = "Hz"
phase_margin = "deg"
supply_power = "W"
output_bias = "V"

[[task.evaluation.metrics]]
id = "functional_area"
category = "physical"
observations = ["geometry:area"]
unit = "um2"
direction = "minimize"
aggregation = "max"

[[task.evaluation.metrics]]
id = "low_frequency_gain"
category = "performance"
observations = ["nominal:low_frequency_gain"]
unit = "dB"
direction = "maximize"
aggregation = "min"
lower = 60
dimension = "response"
zero_lower = 0

[[task.evaluation.metrics]]
id = "unity_gain_bandwidth"
category = "performance"
observations = ["nominal:unity_gain_bandwidth"]
unit = "Hz"
direction = "maximize"
aggregation = "min"
lower = 3e6
dimension = "response"
zero_lower = 0

[[task.evaluation.metrics]]
id = "phase_margin"
category = "performance"
observations = ["nominal:phase_margin"]
unit = "deg"
direction = "maximize"
aggregation = "min"
lower = 55
dimension = "response"
zero_lower = 0

[[task.evaluation.metrics]]
id = "supply_power"
category = "performance"
observations = ["nominal:supply_power"]
unit = "W"
direction = "minimize"
aggregation = "max"
lower = 0
upper = 220e-6
dimension = "supply"
zero_lower = 0
zero_upper = 0.0003

[[task.evaluation.metrics]]
id = "output_bias"
category = "performance"
observations = ["nominal:output_bias"]
unit = "V"
direction = "target"
aggregation = "min"
lower = 0.55
upper = 0.65
dimension = "bias"
zero_lower = 0.4
zero_upper = 0.8

[toolchain]
schema_version = 1

[toolchain.backends.artifact]
type = "klayout-docker"
[toolchain.backends.artifact.settings]
image = "iclayout-bench-tools:local"
check = "artifact"

[toolchain.backends.drc]
type = "klayout-docker"
[toolchain.backends.drc.support_profiles]
support = "klayout"
[toolchain.backends.drc.settings]
image = "iclayout-bench-tools:local"
check = "drc"
support = "build/support/full-ota-klayout-spice"
profile = "drc-upstream.json"
timeout_seconds = 600

[toolchain.backends.lvs]
type = "klayout-docker"
[toolchain.backends.lvs.support_profiles]
support = "klayout"
[toolchain.backends.lvs.settings]
image = "iclayout-bench-tools:local"
check = "lvs"
support = "build/support/full-ota-klayout-spice"
profile = "lvs-upstream.json"
timeout_seconds = 600

[toolchain.backends.rc]
type = "magic-rc-docker"
support_profiles = { support = "magic" }
[toolchain.backends.rc.settings]
image = "iclayout-bench-tools:local"
support = "build/support/full-ota-magic"
technology = "magic/ihp-sg13g2.tech"
tech_name = "ihp-sg13g2"
style = "ngspice()"
capacitance_threshold_ff = 0
timeout_seconds = 600

[toolchain.backends.geometry]
type = "klayout-geometry-docker"
[toolchain.backends.geometry.settings]
image = "iclayout-bench-tools:local"
timeout_seconds = 120

[toolchain.backends.simulation]
type = "ngspice-docker"
support_profiles = { support = "analog-models" }
[toolchain.backends.simulation.settings]
image = "iclayout-bench-tools:local"
support = "build/support/full-ota-models"
timeout_seconds = 600

[toolchain.bindings]
"layout.artifact" = "artifact"
"layout.drc" = "drc"
"layout.lvs" = "lvs"
"layout.geometry" = "geometry"
"layout.extract_rc" = "rc"
"circuit.simulate" = "simulation"

# Maintainer-only reference assets, excluded from standard solver inputs.
[[assets]]
path = "reference/two_stage_OTA_layout.gds"
role = "physical-witness"
visibility = "maintainer"
format = "gds"
sha256 = "50fa39a6984b6f9d1bc0dda38b379861b981c10b85842cc64d9c0e020f7f15bc"

[qualification]
evidence = "README.md"
reference = "reference/two_stage_OTA_layout.gds"

[origin]
url = "https://github.com/IHP-GmbH/IHP-AnalogAcademy/blob/133ecf657572e021b5921b5a1b7693abfb209623/modules/module_1_bandgap_reference/part_3_layout/OTA_layout/full_OTA/schematic_mod/two_stage_OTA_layout.sch"
