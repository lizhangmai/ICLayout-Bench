ldren\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L5\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[\"$L6\",[[\"$\",\"script\",\"script-0\",{\"src\":\"/ICLayout-Bench/_next/static/chunks/27jip_2vcvnd5.js\",\"async\":true,\"nonce\":\"$undefined\"}]],[\"$\",\"$L7\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.MetadataOutlet\",\"children\":\"$@9\"}]}]]}],{},null,false,null]},null,false,\"$a\"]},null,false,null],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Lb\",null,{\"children\":\"$Lc\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Ld\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.Metadata\",\"children\":\"$Le\"}]}]}],null]}],false]],\"m\":\"$undefined\",\"G\":[\"$f\",[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/ICLayout-Bench/_next/static/chunks/3sa54_ghi1h2h.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]]],\"S\":true,\"h\":null,\"r\":\"$undefined\",\"s\":\"$undefined\",\"a\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"2hqB741EA4j7xWQVg6hu-\"}\n10:I[1186,[\"/ICLayout-Bench/_next/static/chunks/2h60meymns2z5.js\",\"/ICLayout-Bench/_next/static/chunks/27jip_2vcvnd5.js\"],\"default\"]\na:C\n11:T3230,\u003ch1 id=\"problem-mim-switched-capacitor-common-mode-sampler-layout-task\"\u003eMIM Switched-Capacitor Common-Mode Sampler Layout Task\u003c/h1\u003e\n\u003ch2 id=\"problem-objective\"\u003eObjective\u003c/h2\u003e\n\u003cp\u003eImplement \u003ccode\u003ecmfb_004_output_switched_cap\u003c/code\u003e in IHP SG13G2 and submit a self-contained GDS. Sixteen minimum-size MOS (W/L = 0.15/0.13 um) implement eight transmission paths. Four internal MIM capacitors retain the original connections: two separate vbias-to-vcm capacitors and two floating control-to-sense capacitors. Each is a 25.85 by 25.85 um cap_cmim, nominally about 1.00647 pF. Explicit physical substrate and well taps are included. The output samples common-mode displacement; this is a switched-capacitor sensing network with driven inputs, not a complete closed-loop amplifier or a loop-stability qualification.\u003c/p\u003e\n\u003ch3 id=\"problem-optimization-objective\"\u003eOptimization objective\u003c/h3\u003e\n\u003cp\u003eMaximize the declared quality score within the solve budget while satisfying all physical and necessary functional requirements. The first passing DRC, LVS and required electrical checks establish a feasible baseline. Continue improving the scored metrics from that baseline; a passing check or \u003ccode\u003etask_success = true\u003c/code\u003e does not mean that the quality objectives have been achieved.\u003c/p\u003e\n\u003ch2 id=\"problem-inputs-and-interface\"\u003eInputs and Interface\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003ematerials/circuit.cdl\u003c/code\u003e is the authoritative physical circuit; \u003ccode\u003ematerials/circuit.spice\u003c/code\u003e is its equivalent simulator representation. \u003ccode\u003ematerials/testbench.spice\u003c/code\u003e supplies measurement apparatus. This problem is the description input. The ordered ports are \u003ccode\u003evinp vinn vcmfb vcm vbias clk_phi clk_phi_not vdd vss\u003c/code\u003e: sensed positive/negative inputs, sampled control output, common-mode reference, control reference, two independent clock nets, supply and return.\u003c/p\u003e\n\u003cp\u003ePreserve connections, MOS W/L/m, capacitor dimensions and cell multiplicities, and body terminals/contacts. Placement and routing are free; device splitting/merging and source/drain exchange must follow declared native LVS equivalence rules. Common-centroid geometry and statistical matching are not scored; ideal external sources, loads and measurement fixtures remain outside the DUT.\u003c/p\u003e\n\u003ch2 id=\"problem-operating-conditions\"\u003eOperating Conditions\u003c/h2\u003e\n\u003cp\u003eUse typical IHP low-voltage MOS, resistor and capacitor models at 27 C, VDD=1.2 V, VSS=0 V, VCM=0.5 V and VBIAS=0.3 V. An external 50 fF actuator load connects vcmfb to ground. The fixed circuit, capacitor dimensions, physical contacts and the existing source/PEX body-model boundary are unchanged. Numerical conditioning is 1e12 ohm shunts and second-order Gear.\u003c/p\u003e\n\u003cp\u003eThe apparatus follows the upstream \u003ccode\u003ecmfb/tran_sc_cmfb_step\u003c/code\u003e template. Both sensed inputs receive the same common-mode step; exact-complement clocks have 50 ns edges and no added non-overlap gap. The four (clock frequency, common-mode step) conditions are (1 kHz,+50 mV), (1 kHz,-50 mV), (100 kHz,+50 mV), and (100 kHz,-50 mV). The 1 kHz conditions retain the upstream application; 100 kHz repeats the same apparatus to expose switching and routing cost.\u003c/p\u003e\n\u003cp\u003eIn units of clock periods, apply the step at 10 and release it at 20; stop at 30. The natural control level is averaged over periods 6–9, the plateau over 15–19, and the released level over 27–29. Every averaging window spans complete clock periods. Output print step is 0.005 periods and the maximum internal step is 0.0002 periods. Recovery uses the upstream last falling crossing of the absolute error from the released average, with a 20 mV threshold. This threshold exceeds the observed steady clock ripple; it is a measurement definition, not an acceptance budget. Statistical mismatch, noise, PVT, distributed substrate resistance and RF/EM are outside this task.\u003c/p\u003e\n\u003ch2 id=\"problem-physical-requirements\"\u003ePhysical Requirements\u003c/h2\u003e\n\u003cp\u003eThe GDS top cell is \u003ccode\u003ecmfb_004_output_switched_cap\u003c/code\u003e, with a 10 MiB maximum file size. Provide physical, correctly connected and accessible labeled interface metal; retain every named port. Pass IHP main and maximal DRC (density and antenna excluded for this standalone block), strict named-interface LVS and a functional bounding box no larger than 320 by 70 um. No DRC waivers are used. The functional footprint includes device, passive, implant, well and complete routing layers; excludes annotations/pin text and nonfunctional markers. Its explicit GDS layer/datatype set is \u003ccode\u003e[[1, 0], [3, 0], [5, 0], [6, 0], [7, 0], [8, 0], [10, 0], [11, 0], [13, 0], [14, 0], [19, 0], [24, 0], [26, 0], [28, 0], [29, 0], [30, 0], [31, 0], [32, 0], [33, 0], [35, 0], [36, 0], [40, 0], [44, 0], [46, 0], [49, 0], [50, 0], [51, 0], [52, 0], [53, 0], [55, 0], [58, 0], [66, 0], [67, 0], [90, 0], [101, 0], [111, 0], [125, 0], [126, 0], [128, 0], [129, 0], [133, 0], [134, 0], [139, 0], [152, 0]]\u003c/code\u003e. The area is the bounding-box area of those layers, not summed metal area.\u003c/p\u003e\n\u003cp\u003eCandidate GDS first passes file, DRC, LVS and hard geometry checks; Magic then extracts distributed interconnect RC with zero coupling-capacitance threshold and retains internal MIM. The supplied testbench uses the candidate extracted circuit; source simulation cannot replace acceptance. This is nominal module verification, not manufacturing signoff.\u003c/p\u003e\n\u003ch2 id=\"problem-electrical-requirements-and-scoring\"\u003eElectrical Requirements and Scoring\u003c/h2\u003e\n\u003cp\u003ePass artifact, geometry, DRC, named-interface LVS and complete candidate RC extraction. The natural control node must stay within 0–1.2 V, and the measured common-mode transfer slope must be nonnegative. These check the supply interface and response polarity. There is no minimum quality score or reference-layout performance requirement.\u003c/p\u003e\n\u003cp\u003eEvery electrical observation is paired with the same-condition pre-layout circuit. Define natural level \u003ccode\u003evcmfb_nat\u003c/code\u003e as the periods 6–9 average and \u003ccode\u003estep_delta_v\u003c/code\u003e as the plateau average minus that natural level. \u003ccode\u003ecmfb_slope\u003c/code\u003e is the signed step response divided by the signed input step. \u003ccode\u003ering_v\u003c/code\u003e is half the plateau peak-to-peak clock ripple. \u003ccode\u003et_cm_settle\u003c/code\u003e is the last falling crossing of the 20 mV released-level error minus the release time. \u003ccode\u003eclock_power_w\u003c/code\u003e averages the sum of nonnegative power supplied by the two independent clock sources over periods 15–19; returned energy is not credited. \u003ccode\u003ei_supply\u003c/code\u003e retains the upstream average VDD-current diagnostic.\u003c/p\u003e\n\u003cp\u003eThe integration objective is 3200 um2. Four fixed 25.85 um square MIM plates occupy 2672.89 um2, leaving 527.11 um2 of planar overhead. Legal overlap follows the PDK. This is an integration allocation, not a proven minimum or an acceptance bound.\u003c/p\u003e\n\u003cp\u003eFor each metric take the worst source/candidate pair. Area quality is 3200 divided by candidate functional area. Ripple uses \u003ccode\u003esaturating_ratio\u003c/code\u003e, q=2(b+s)/(b+x+2s), with s=0.1 mV. Recovery and clock power use q=(b+s)/(x+s), with scales 0.1 us and 0.01 pW. Here b is the source observation and x is the candidate observation; scales regularize measurement comparisons and are not functional cutoffs. The score is 100 times the product of each capped quality min(1,q) raised to its weight. Invalid candidates score zero; missing or invalid measurements remain evaluation errors. All zero-weight diagnostics must also be measured successfully.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.25\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ering_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.40\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003et_cm_settle\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eclock_power_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.35\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ecmfb_slope\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003evcmfb_nat\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estep_delta_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eThe capability coefficient is \u003cstrong\u003e5\u003c/strong\u003e, independent of this score.\u003c/p\u003e\n\u003ch2 id=\"problem-tools-and-submission\"\u003eTools and Submission\u003c/h2\u003e\n\u003cp\u003eSoft solve budget: \u003cstrong\u003e3 hours\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eRead \u003ccode\u003e/protocol/task.json\u003c/code\u003e for input/output paths, constraints and the \u003ccode\u003eresources\u003c/code\u003e object; \u003ccode\u003e/protocol/harness.json\u003c/code\u003e describes the active check and submission interface.\u003c/p\u003e\n\u003cp\u003eUse reviewed SG13G2 devices/rules/models from the \u003ccode\u003eresources\u003c/code\u003e field of \u003ccode\u003e/protocol/task.json\u003c/code\u003e and the task from \u003ccode\u003e/protocol/task.json\u003c/code\u003e. KLayout handles layout and physical checks, Magic extracts candidate RC, and ngspice runs declared decks. Discover feedback through the runtime protocol and explicitly submit workspace \u003ccode\u003eoutput/final.gds\u003c/code\u003e; reference layouts, the source repository and author scripts are not solver inputs.\u003c/p\u003e\n\u003ch3 id=\"problem-solve-workflow\"\u003eSolve workflow\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eRead the declared circuit and materials, \u003ccode\u003e/protocol/task.json\u003c/code\u003e for paths, constraints and reviewed resources, and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e for capabilities and helper commands. Task inputs under \u003ccode\u003e/task\u003c/code\u003e and resources under \u003ccode\u003e/resources\u003c/code\u003e are read-only; construct the layout in \u003ccode\u003e/workspace\u003c/code\u003e with the declared tools. With layout MCP, paths and commands refer to the remote EDA workspace. Create your own implementation with real devices, interconnect and pins, using your own tool loop without delegating to other agents; reference layouts and author code are not solver inputs.\u003c/li\u003e\n\u003cli\u003eInspect \u003ccode\u003eresources.external\u003c/code\u003e before using external tools. Each command starts a fresh shell: when tool modules are declared, source \u003ccode\u003e/usr/share/Modules/init/bash\u003c/code\u003e and load the selected tool's modules; export its declared \u003ccode\u003etool_environment\u003c/code\u003e settings in that same command. Repeat as needed and use batch or headless operation. Local manuals, command references, and release notes may be available within the declared EDA installation and PDK resource directories. Locate these resources through \u003ccode\u003e/protocol/task.json\u003c/code\u003e and consult the documentation for the installed tool version when diagnosing unfamiliar syntax or tool failures.\u003c/li\u003e\n\u003cli\u003eGenerate an initial candidate and submit a snapshot early. When \u003ccode\u003eprocess-feedback\u003c/code\u003e is available, check the current GDS with layout MCP \u003ccode\u003echeck\u003c/code\u003e or \u003ccode\u003epython -I /protocol/process_check.py\u003c/code\u003e before the final submission. This runs the final evaluator's complete plan and returns engineering diagnostics and candidate measurements, without scores or normalized quality factors. Checks have no count limit and consume the same wall-clock budget. Inspect the physical and functional results and all scored metrics; successful tool execution alone does not establish requirement satisfaction. Read paginated diagnostics with \u003ccode\u003ereport\u003c/code\u003e when using MCP. Local exploratory checks do not replace this complete check.\u003c/li\u003e\n\u003cli\u003eUse the remaining time for measured improvements to the declared quality objectives. Identify the limiting scored metrics, make targeted layout changes, regenerate and check the candidate, and compare measurements with the previous candidate and the stated scoring targets and trade-offs. Preserve the best valid candidate and revert changes that worsen the overall objective. Repeat while time and useful improvements remain; passing validity checks alone is not a stopping condition.\u003c/li\u003e\n\u003cli\u003eStop optimization when the budget expires, all declared quality objectives are achieved, or measured trials support convergence. If stopping early, explain the changes tried, the metric comparisons and the remaining limitations. Track remaining time through session status. At soft-budget expiry, finish or cancel already-started work and submit immediately; do not start another command, check or optimization round. If an MCP execution is running, use \u003ccode\u003epoll\u003c/code\u003e with its \u003ccode\u003eexecution_id\u003c/code\u003e and the returned \u003ccode\u003enext_offset\u003c/code\u003e as \u003ccode\u003eoffset\u003c/code\u003e until completion, or cancel it and wait for it to stop.\u003c/li\u003e\n\u003cli\u003eFinish or cancel outstanding work, restore your best candidate to the declared output path, and explicitly submit it before ending the session. With layout MCP \u003ccode\u003esubmit\u003c/code\u003e, remove the \u003ccode\u003e/workspace/\u003c/code\u003e prefix from \u003ccode\u003eoutput.path\u003c/code\u003e; with the container interface, run \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e. Wait for the receipt: only the last accepted snapshot is judged, and writing a file alone is not submission. Acceptance confirms delivery; the framework independently evaluates validity and quality after the session.\u003c/li\u003e\n\u003c/ol\u003e\n12:Tae2,\u003cp\u003ePass artifact, geometry, DRC, named-interface LVS and complete candidate RC extraction. The natural control node must stay within 0–1.2 V, and the measured common-mode transfer slope must be nonnegative. These check the supply interface and response polarity. There is no minimum quality score or reference-layout performance requirement.\u003c/p\u003e\n\u003cp\u003eEvery electrical observation is paired with the same-condition pre-layout circuit. Define natural level \u003ccode\u003evcmfb_nat\u003c/code\u003e as the periods 6–9 average and \u003ccode\u003estep_delta_v\u003c/code\u003e as the plateau average minus that natural level. \u003ccode\u003ecmfb_slope\u003c/code\u003e is the signed step response divided by the signed input step. \u003ccode\u003ering_v\u003c/code\u003e is half the plateau peak-to-peak clock ripple. \u003ccode\u003et_cm_settle\u003c/code\u003e is the last falling crossing of the 20 mV released-level error minus the release time. \u003ccode\u003eclock_power_w\u003c/code\u003e averages the sum of nonnegative power supplied by the two independent clock sources over periods 15–19; returned energy is not credited. \u003ccode\u003ei_supply\u003c/code\u003e retains the upstream average VDD-current diagnostic.\u003c/p\u003e\n\u003cp\u003eThe integration objective is 3200 um2. Four fixed 25.85 um square MIM plates occupy 2672.89 um2, leaving 527.11 um2 of planar overhead. Legal overlap follows the PDK. This is an integration allocation, not a proven minimum or an acceptance bound.\u003c/p\u003e\n\u003cp\u003eFor each metric take the worst source/candidate pair. Area quality is 3200 divided by candidate functional area. Ripple uses \u003ccode\u003esaturating_ratio\u003c/code\u003e, q=2(b+s)/(b+x+2s), with s=0.1 mV. Recovery and clock power use q=(b+s)/(x+s), with scales 0.1 us and 0.01 pW. Here b is the source observation and x is the candidate observation; scales regularize measurement comparisons and are not functional cutoffs. The score is 100 times the product of each capped quality min(1,q) raised to its weight. Invalid candidates score zero; missing or invalid measurements remain evaluation errors. All zero-weight diagnostics must also be measured successfully.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.25\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ering_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.40\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003et_cm_settle\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eclock_power_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.35\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ecmfb_slope\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003evcmfb_nat\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estep_delta_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eThe capability coefficient is \u003cstrong\u003e5\u003c/strong\u003e, independent of this score.\u003c/p\u003e\n13:T42a,\u003cp\u003eImplement \u003ccode\u003ecmfb_004_output_switched_cap\u003c/code\u003e in IHP SG13G2 and submit a self-contained GDS. Sixteen minimum-size MOS (W/L = 0.15/0.13 um) implement eight transmission paths. Four internal MIM capacitors retain the original connections: two separate vbias-to-vcm capacitors and two floating control-to-sense capacitors. Each is a 25.85 by 25.85 um cap_cmim, nominally about 1.00647 pF. Explicit physical substrate and well taps are included. The output samples common-mode displacement; this is a switched-capacitor sensing network with driven inputs, not a complete closed-loop amplifier or a loop-stability qualification.\u003c/p\u003e\n\u003ch3\u003eOptimization objective\u003c/h3\u003e\n\u003cp\u003eMaximize the declared quality score within the solve budget while satisfying all physical and necessary functional requirements. The first passing DRC, LVS and required electrical checks establish a feasible baseline. Continue improving the scored metrics from that baseline; a passing check or \u003ccode\u003etask_success = true\u003c/code\u003e does not mean that the quality objectives have been achieved.\u003c/p\u003e\n14:T5f7,\u003cp\u003eUse typical IHP low-voltage MOS, resistor and capacitor models at 27 C, VDD=1.2 V, VSS=0 V, VCM=0.5 V and VBIAS=0.3 V. An external 50 fF actuator load connects vcmfb to ground. The fixed circuit, capacitor dimensions, physical contacts and the existing source/PEX body-model boundary are unchanged. Numerical conditioning is 1e12 ohm shunts and second-order Gear.\u003c/p\u003e\n\u003cp\u003eThe apparatus follows the upstream \u003ccode\u003ecmfb/tran_sc_cmfb_step\u003c/code\u003e template. Both sensed inputs receive the same common-mode step; exact-complement clocks have 50 ns edges and no added non-overlap gap. The four (clock frequency, common-mode step) conditions are (1 kHz,+50 mV), (1 kHz,-50 mV), (100 kHz,+50 mV), and (100 kHz,-50 mV). The 1 kHz conditions retain the upstream application; 100 kHz repeats the same apparatus to expose switching and routing cost.\u003c/p\u003e\n\u003cp\u003eIn units of clock periods, apply the step at 10 and release it at 20; stop at 30. The natural control level is averaged over periods 6–9, the plateau over 15–19, and the released level over 27–29. Every averaging window spans complete clock periods. Output print step is 0.005 periods and the maximum internal step is 0.0002 periods. Recovery uses the upstream last falling crossing of the absolute error from the released average, with a 20 mV threshold. This threshold exceeds the observed steady clock ripple; it is a measurement definition, not an acceptance budget. Statistical mismatch, noise, PVT, distributed substrate resistance and RF/EM are outside this task.\u003c/p\u003e\n15:T5a4,\u003cp\u003eThe GDS top cell is \u003ccode\u003ecmfb_004_output_switched_cap\u003c/code\u003e, with a 10 MiB maximum file size. Provide physical, correctly connected and accessible labeled interface metal; retain every named port. Pass IHP main and maximal DRC (density and antenna excluded for this standalone block), strict named-interface LVS and a functional bounding box no larger than 320 by 70 um. No DRC waivers are used. The functional footprint includes device, passive, implant, well and complete routing layers; excludes annotations/pin text and nonfunctional markers. Its explicit GDS layer/datatype set is \u003ccode\u003e[[1, 0], [3, 0], [5, 0], [6, 0], [7, 0], [8, 0], [10, 0], [11, 0], [13, 0], [14, 0], [19, 0], [24, 0], [26, 0], [28, 0], [29, 0], [30, 0], [31, 0], [32, 0], [33, 0], [35, 0], [36, 0], [40, 0], [44, 0], [46, 0], [49, 0], [50, 0], [51, 0], [52, 0], [53, 0], [55, 0], [58, 0], [66, 0], [67, 0], [90, 0], [101, 0], [111, 0], [125, 0], [126, 0], [128, 0], [129, 0], [133, 0], [134, 0], [139, 0], [152, 0]]\u003c/code\u003e. The area is the bounding-box area of those layers, not summed metal area.\u003c/p\u003e\n\u003cp\u003eCandidate GDS first passes file, DRC, LVS and hard geometry checks; Magic then extracts distributed interconnect RC with zero coupling-capacitance threshold and retains internal MIM. The supplied testbench uses the candidate extracted circuit; source simulation cannot replace acceptance. This is nominal module verification, not manufacturing signoff.\u003c/p\u003e\n16:T11b5,\u003cp\u003eSoft solve budget: \u003cstrong\u003e3 hours\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eRead \u003ccode\u003e/protocol/task.json\u003c/code\u003e for input/output paths, constraints and the \u003ccode\u003eresources\u003c/code\u003e object; \u003ccode\u003e/protocol/harness.json\u003c/code\u003e describes the active check and submission interface.\u003c/p\u003e\n\u003cp\u003eUse reviewed SG13G2 devices/rules/models from the \u003ccode\u003eresources\u003c/code\u003e field of \u003ccode\u003e/protocol/task.json\u003c/code\u003e and the task from \u003ccode\u003e/protocol/task.json\u003c/code\u003e. KLayout handles layout and physical checks, Magic extracts candidate RC, and ngspice runs declared decks. Discover feedback through the runtime protocol and explicitly submit workspace \u003ccode\u003eoutput/final.gds\u003c/code\u003e; reference layouts, the source repository and author scripts are not solver inputs.\u003c/p\u003e\n\u003ch3\u003eSolve workflow\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eRead the declared circuit and materials, \u003ccode\u003e/protocol/task.json\u003c/code\u003e for paths, constraints and reviewed resources, and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e for capabilities and helper commands. Task inputs under \u003ccode\u003e/task\u003c/code\u003e and resources under \u003ccode\u003e/resources\u003c/code\u003e are read-only; construct the layout in \u003ccode\u003e/workspace\u003c/code\u003e with the declared tools. With layout MCP, paths and commands refer to the remote EDA workspace. Create your own implementation with real devices, interconnect and pins, using your own tool loop without delegating to other agents; reference layouts and author code are not solver inputs.\u003c/li\u003e\n\u003cli\u003eInspect \u003ccode\u003eresources.external\u003c/code\u003e before using external tools. Each command starts a fresh shell: when tool modules are declared, source \u003ccode\u003e/usr/share/Modules/init/bash\u003c/code\u003e and load the selected tool's modules; export its declared \u003ccode\u003etool_environment\u003c/code\u003e settings in that same command. Repeat as needed and use batch or headless operation. Local manuals, command references, and release notes may be available within the declared EDA installation and PDK resource directories. Locate these resources through \u003ccode\u003e/protocol/task.json\u003c/code\u003e and consult the documentation for the installed tool version when diagnosing unfamiliar syntax or tool failures.\u003c/li\u003e\n\u003cli\u003eGenerate an initial candidate and submit a snapshot early. When \u003ccode\u003eprocess-feedback\u003c/code\u003e is available, check the current GDS with layout MCP \u003ccode\u003echeck\u003c/code\u003e or \u003ccode\u003epython -I /protocol/process_check.py\u003c/code\u003e before the final submission. This runs the final evaluator's complete plan and returns engineering diagnostics and candidate measurements, without scores or normalized quality factors. Checks have no count limit and consume the same wall-clock budget. Inspect the physical and functional results and all scored metrics; successful tool execution alone does not establish requirement satisfaction. Read paginated diagnostics with \u003ccode\u003ereport\u003c/code\u003e when using MCP. Local exploratory checks do not replace this complete check.\u003c/li\u003e\n\u003cli\u003eUse the remaining time for measured improvements to the declared quality objectives. Identify the limiting scored metrics, make targeted layout changes, regenerate and check the candidate, and compare measurements with the previous candidate and the stated scoring targets and trade-offs. Preserve the best valid candidate and revert changes that worsen the overall objective. Repeat while time and useful improvements remain; passing validity checks alone is not a stopping condition.\u003c/li\u003e\n\u003cli\u003eStop optimization when the budget expires, all declared quality objectives are achieved, or measured trials support convergence. If stopping early, explain the changes tried, the metric comparisons and the remaining limitations. Track remaining time through session status. At soft-budget expiry, finish or cancel already-started work and submit immediately; do not start another command, check or optimization round. If an MCP execution is running, use \u003ccode\u003epoll\u003c/code\u003e with its \u003ccode\u003eexecution_id\u003c/code\u003e and the returned \u003ccode\u003enext_offset\u003c/code\u003e as \u003ccode\u003eoffset\u003c/code\u003e until completion, or cancel it and wait for it to stop.\u003c/li\u003e\n\u003cli\u003eFinish or cancel outstanding work, restore your best candidate to the declared output path, and explicitly submit it before ending the session. With layout MCP \u003ccode\u003esubmit\u003c/code\u003e, remove the \u003ccode\u003e/workspace/\u003c/code\u003e prefix from \u003ccode\u003eoutput.path\u003c/code\u003e; with the container interface, run \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e. Wait for the receipt: only the last accepted snapshot is judged, and writing a file alone is not submission. Acceptance confirms delivery; the framework independently evaluates validity and quality after the session.\u003c/li\u003e\n\u003c/ol\u003e\n6:[\"$\",\"$8\",null,{\"fallback\":[\"$\",\"p\",null,{\"children\":\"Loading published evidence…\"}],\"children\":[\"$\",\"$L10\",null,{\"task\":{\"case_path\":\"tasks/ihp-sg13g2/analog-db/cases/cmfb_004_output_switched_cap/case.toml\",\"coefficient\":5,\"collection\":\"analog-db\",\"configuration_url\":\"/ICLayout-Bench/assets/ebf056e05d744b0f0860516f23486715bf97730e9888f5841486188abe325d24.txt\",\"description_html\":\"$11\",\"description_path\":\"tasks/ihp-sg13g2/analog-db/cases/cmfb_004_output_switched_cap/problem.md\",\"hours\":3,\"id\":\"ihp-sg13g2.analog-db.cmfb_004_output_switched_cap\",\"inputs\":{\"description\":{\"format\":\"text\",\"path\":\"problem.md\",\"sha256\":\"8231249bed493b2a7a584fa6c6120ed5b3b8b0589170ee6b3e2d2cbe8987fa9c\"},\"netlist\":{\"format\":\"spice\",\"path\":\"materials/circuit.cdl\",\"sha256\":\"3a3ca59eef1a93dd54f0e78087fccb7e250f354833ec52950e1b0f425daef481\",\"subcircuit\":\"cmfb_004_output_switched_cap\"},\"performance\":{\"format\":\"spice\",\"path\":\"materials/testbench.spice\",\"sha256\":\"637c51fd5621aa12bf5bac72c0dbeebdbd97a39447508d87e7d8f375ffab302c\"},\"simulation\":{\"format\":\"spice\",\"path\":\"materials/circuit.spice\",\"sha256\":\"30effeca3d0300192851a604f3302b78a994c351bade58c076d73ad0d211c1ea\"}},\"licenses\":[{\"name\":\"LICENSE\",\"path\":\"tasks/ihp-sg13g2/analog-db/LICENSE\",\"url\":\"/ICLayout-Bench/assets/644dd511526bc2da77ee7c74714118315db91255376d0ea93a1975b4dbfbfb3d.txt\"},{\"name\":\"NOTICE\",\"path\":\"tasks/ihp-sg13g2/analog-db/NOTICE\",\"url\":\"/ICLayout-Bench/assets/69f7110d12f142806dfdd53f516082a82032da57d1ad47d0bc792d3a68329145.txt\"}],\"materials\":[{\"name\":\"problem.md\",\"role\":\"description\",\"url\":\"/ICLayout-Bench/assets/8231249bed493b2a7a584fa6c6120ed5b3b8b0589170ee6b3e2d2cbe8987fa9c.txt\"}
