rrorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L5\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[\"$L6\",[[\"$\",\"script\",\"script-0\",{\"src\":\"/ICLayout-Bench/_next/static/chunks/27jip_2vcvnd5.js\",\"async\":true,\"nonce\":\"$undefined\"}]],[\"$\",\"$L7\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.MetadataOutlet\",\"children\":\"$@9\"}]}]]}],{},null,false,null]},null,false,\"$a\"]},null,false,null],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Lb\",null,{\"children\":\"$Lc\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Ld\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.Metadata\",\"children\":\"$Le\"}]}]}],null]}],false]],\"m\":\"$undefined\",\"G\":[\"$f\",[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/ICLayout-Bench/_next/static/chunks/3sa54_ghi1h2h.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]]],\"S\":true,\"h\":null,\"r\":\"$undefined\",\"s\":\"$undefined\",\"a\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"2hqB741EA4j7xWQVg6hu-\"}\n10:I[1186,[\"/ICLayout-Bench/_next/static/chunks/2h60meymns2z5.js\",\"/ICLayout-Bench/_next/static/chunks/27jip_2vcvnd5.js\"],\"default\"]\na:C\n11:T39f1,\u003ch1 id=\"problem-five-transistor-ota-core-with-bias-mirror-layout-task\"\u003eFive-Transistor OTA Core with Bias Mirror Layout Task\u003c/h1\u003e\n\u003ch2 id=\"problem-objective\"\u003eObjective\u003c/h2\u003e\n\u003cp\u003eImplement the fixed six-MOS \u003ccode\u003eamp_001_5t\u003c/code\u003e circuit in IHP SG13G2 and submit a\nself-contained GDS. The circuit consists of a five-transistor OTA core and a\nsixth, diode-connected bias-reference MOS. Device dimensions are fixed.\u003c/p\u003e\n\u003ch3 id=\"problem-optimization-objective\"\u003eOptimization objective\u003c/h3\u003e\n\u003cp\u003eMaximize the declared quality score within the solve budget while satisfying all physical and necessary functional requirements. The first passing DRC, LVS and required electrical checks establish a feasible baseline. Continue improving the scored metrics from that baseline; a passing check or \u003ccode\u003etask_success = true\u003c/code\u003e does not mean that the quality objectives have been achieved.\u003c/p\u003e\n\u003ch2 id=\"problem-inputs-and-interface\"\u003eInputs and Interface\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003ematerials/circuit.cdl\u003c/code\u003e is authoritative for physical LVS;\n\u003ccode\u003ematerials/circuit.spice\u003c/code\u003e is its simulator representation.\n\u003ccode\u003ematerials/testbench.spice\u003c/code\u003e defines the AC/DC measurements. Port order is\n\u003ccode\u003evdd vout vinp vinn ibias vss\u003c/code\u003e: supply, single-ended output, non-inverting input,\ninverting input, reference-current input, and return. Supply 20 uA from \u003ccode\u003evdd\u003c/code\u003e\ninto \u003ccode\u003eibias\u003c/code\u003e; it is not an ideal voltage-bias input.\u003c/p\u003e\n\u003cp\u003eThe NMOS input pair has W/L = 10/10 um; the PMOS mirror pair 10/7 um;\nthe NMOS tail and reference devices 3.8/1 um, all with multiplicity 1.\nThe CDL also declares substrate and well taps. Retain all electrical connections,\nbody connections, sizes and tap devices. Placement and routing are free; normal\nsource/drain equivalence and electrically equivalent device splitting are allowed\nonly when the declared LVS checks accept them. No additional common-centroid or\nstatistical matching requirement is scored.\u003c/p\u003e\n\u003ch2 id=\"problem-operating-conditions\"\u003eOperating Conditions\u003c/h2\u003e\n\u003cp\u003eThe pinned \u003ccode\u003emos_tt\u003c/code\u003e/\u003ccode\u003eres_typ\u003c/code\u003e models run at 27 C, with VDD = 1.5 V, VSS = 0 V,\n20 uA reference current, 0.8 V non-inverting input bias, and an external 10 pF\noutput load. The 4 GH/4 GF feedback network closes the DC loop and opens the AC\nloop. It is testbench apparatus, not part of the submitted layout. AC sweeps\n1 Hz to 100 MHz at 100 points per decade. The power measurement includes the\nreference-current branch supplied from VDD. The 1e12 ohm numerical shunt is\npart of the declared simulation setup.\u003c/p\u003e\n\u003ch2 id=\"problem-physical-requirements\"\u003ePhysical Requirements\u003c/h2\u003e\n\u003cp\u003eSubmit top cell \u003ccode\u003eamp_001_5t\u003c/code\u003e, with all six named electrical ports, no unresolved\nhierarchy, and at most 10 MiB. Artifact, DRC, strict named-port LVS and geometry\nchecks must pass. DRC uses the pinned main and extra/maximal rules without\nwaivers; density and antenna are outside this standalone-block scope.\u003c/p\u003e\n\u003cp\u003eThe functional bounding box must fit within 120 by 70 um. Its area includes all\nprocess device and routing drawing layers enumerated in the published runtime\nconstraints, including wells, taps, implants, active, poly, contacts, all routing\nmetals/vias and passive/device markers. Annotation text and pin-purpose shapes\nare excluded from area; functional routing must use drawing layers.\u003c/p\u003e\n\u003cp\u003eThe judge extracts distributed RC from the submitted GDS and simulates that\nextracted DUT. Physical LVS retains explicit taps. Magic models the body\nconnection through its extracted network without the separate compact \u003ccode\u003eptap1\u003c/code\u003e\nand \u003ccode\u003entap1\u003c/code\u003e devices; source calibration records the effect of this boundary.\nThis task covers nominal deterministic AC/DC behavior, not statistical mismatch,\nPVT, noise, distortion, transient settling, EM or manufacturing signoff.\u003c/p\u003e\n\u003ch2 id=\"problem-electrical-requirements-and-scoring\"\u003eElectrical Requirements and Scoring\u003c/h2\u003e\n\u003cp\u003eArtifact, geometry, DRC, LVS and declared functional requirements must pass. Parasitic extraction is also mandatory: it must produce a complete, electrically consistent netlist usable by the required post-layout simulations. A completed candidate rejection scores zero; infrastructure errors do not establish candidate failure.\u003c/p\u003e\n\u003cp\u003ePhysical checks and the declared functional bounds must pass. Quality scoring imposes no fixed degradation allowance. Each \u003ccode\u003esource_*\u003c/code\u003e job and its corresponding candidate extracted circuit use exactly the same testbench, model resources, parameters, loads and measurement windows. Independent source observations define the 100-point electrical baseline without depending on the submitted GDS; reports retain every paired result.\u003c/p\u003e\n\u003cp\u003eLet x be the post-layout measurement and b the source-circuit measurement under the same conditions:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eRatio normalization: maximize with q = x/b and minimize with q = b/x. When a numerical scale s is declared, use (x+s)/(b+s) and its reciprocal, respectively. The scale handles zero values as a normalization floor; it is neither an allowed degradation nor an acceptance bound.\u003c/li\u003e\n\u003cli\u003eAmplitude in dB: maximize with q = 10^((x-b)/20) and minimize with its reciprocal.\u003c/li\u003e\n\u003cli\u003eTarget normalization: q = 1/(1+abs(x-b)/s), where s is the declared physical scale. Signed or zero-valued operating points are not divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eUse \u003ccode\u003elayout\u003c/code\u003e scoring. Each metric takes its worst paired quality q, and the total score is S = 100 * product(min(1, q_i) ** w_i), with area quality q_area = area_reference / candidate_functional_area. The weights below sum to 1; metric dimensions describe measurements and do not determine weights. Physical, extraction, or functional rejection scores zero; other missing or invalid measurements leave the score unknown, and zero-weight observations must also be valid. Matching source-circuit performance at the reference area scores 100 points; each metric is capped at quality 1, so scores cannot exceed 100. Weights express quality tradeoffs rather than hard bounds.\u003c/p\u003e\n\u003cp\u003eThe measurements below use the supplied SPICE node and source names. \u003ccode\u003ev(n)\u003c/code\u003e is a node voltage; \u003ccode\u003ei(V)\u003c/code\u003e is current flowing into a voltage source, so delivered power uses a negative sign. \u003ccode\u003edb(z)=20*log10(abs(z))\u003c/code\u003e; \u003ccode\u003emag/abs\u003c/code\u003e denote magnitude, and \u003ccode\u003ecph\u003c/code\u003e denotes continuous phase in radians. \u003ccode\u003efind\u003c/code\u003e, \u003ccode\u003ewhen\u003c/code\u003e, \u003ccode\u003efrom/to\u003c/code\u003e and \u003ccode\u003erise/fall\u003c/code\u003e follow the deck's interpolation, window and crossing conventions. SPICE suffixes p/n/u/m/meg/g mean pico/nano/micro/milli/mega/giga. Nested \u003ccode\u003eavg\u003c/code\u003e, \u003ccode\u003emin\u003c/code\u003e, \u003ccode\u003emax\u003c/code\u003e, \u003ccode\u003evecmin/vecmax\u003c/code\u003e and \u003ccode\u003ederiv\u003c/code\u003e represent window averages, extrema and sampled derivatives. Measure each operating condition independently, pair it with the source result under that condition, and take the worst paired quality within each metric group.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eDefinition / observation\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eQuality normalization\u003c/th\u003e\n\u003cth\u003eFunctional range\u003c/th\u003e\n\u003cth\u003eScale\u003c/th\u003e\n\u003cth\u003eDimension\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003elow_frequency_gain\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: Value of \u003ccode\u003e(db((v(vout)/(v(vinp)-v(vinn))))) at=1\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003emaximize / db20\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eunity_gain_bandwidth\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: Crossing coordinate where \u003ccode\u003e(db((v(vout)/(v(vinp)-v(vinn)))))=0 fall=1\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eHz\u003c/td\u003e\n\u003ctd\u003emaximize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ephase_margin\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: \u003ccode\u003e180+(find (180*cph((v(vout)/(v(vinp)-v(vinn))))/pi) when (db((v(vout)/(v(vinp)-v(vinn)))))=0 fall=1)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003edeg\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 180\u003c/td\u003e\n\u003ctd\u003e180\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_bias\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003ev(vout)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.5\u003c/td\u003e\n\u003ctd\u003e1.5\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebias_voltage\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003ev(ibias)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.5\u003c/td\u003e\n\u003ctd\u003e1.5\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003esupply_power\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003e-v(vdd)*i(VDD)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003ctd\u003esupply\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eArea reference: \u003cstrong\u003e1198.35 um2\u003c/strong\u003e. The expanded circuit has 8 device instances, a sum of device/contact envelopes 754.0020 um2, a one-sided envelope margin of 0.6 um, a routing allowance of 50%, and a total outer width/height allowance 1.2 um. Estimate = ceil(100 * (1.5 * envelope_sum + 2 * margin * sqrt(envelope_sum) + margin^2)) / 100. Here margin is the total allowance across both sides, and the envelope sum is displayed to four decimal places. MOS/passive envelopes use W/L (or resistor dimensions) and multiplicity, including explicit contacts and HBT emitter/contact envelopes. This is a frozen engineering estimate, not a process minimum or a proven achievable area.\u003c/p\u003e\n\u003cp\u003eThe capability coefficient is \u003cstrong\u003e4\u003c/strong\u003e, independent of this task's reference-normalized score.\u003c/p\u003e\n\u003ch3 id=\"problem-score-weights\"\u003eScore weights\u003c/h3\u003e\n\u003cp\u003eSmall-signal OTAs: gain 27%, bandwidth 22.5%, phase margin 22.5%, operating points 4.5%, power 13.5%, area 10%. Each objective's weight is divided equally among its metrics.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003elow_frequency_gain\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.270000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eunity_gain_bandwidth\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.225000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ephase_margin\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.225000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebias_voltage\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.022500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_bias\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.022500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003esupply_power\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.135000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch2 id=\"problem-tools-and-submission\"\u003eTools and Submission\u003c/h2\u003e\n\u003cp\u003eSoft solve budget: \u003cstrong\u003e3 hours\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eUse the reviewed IHP PDK/EDA resources exposed through the \u003ccode\u003eresources\u003c/code\u003e field of \u003ccode\u003e/protocol/task.json\u003c/code\u003e;\nKLayout and Magic support layout checking and extraction, and ngspice supports\nsimulation. \u003ccode\u003e/protocol/task.json\u003c/code\u003e provides the frozen constraints and evaluation\nrequirements; \u003ccode\u003e/protocol/harness.json\u003c/code\u003e describes the active harness.\nIf \u003ccode\u003eprocess-feedback\u003c/code\u003e is exposed, use its published helper for interim checks.\nWrite \u003ccode\u003e/workspace/output/final.gds\u003c/code\u003e, then explicitly submit it with\n\u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e. The final judge evaluates the submitted snapshot.\u003c/p\u003e\n\u003ch3 id=\"problem-solve-workflow\"\u003eSolve workflow\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eRead the declared circuit and materials, \u003ccode\u003e/protocol/task.json\u003c/code\u003e for paths, constraints and reviewed resources, and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e for capabilities and helper commands. Task inputs under \u003ccode\u003e/task\u003c/code\u003e and resources under \u003ccode\u003e/resources\u003c/code\u003e are read-only; construct the layout in \u003ccode\u003e/workspace\u003c/code\u003e with the declared tools. With layout MCP, paths and commands refer to the remote EDA workspace. Create your own implementation with real devices, interconnect and pins, using your own tool loop without delegating to other agents; reference layouts and author code are not solver inputs.\u003c/li\u003e\n\u003cli\u003eInspect \u003ccode\u003eresources.external\u003c/code\u003e before using external tools. Each command starts a fresh shell: when tool modules are declared, source \u003ccode\u003e/usr/share/Modules/init/bash\u003c/code\u003e and load the selected tool's modules; export its declared \u003ccode\u003etool_environment\u003c/code\u003e settings in that same command. Repeat as needed and use batch or headless operation. Local manuals, command references, and release notes may be available within the declared EDA installation and PDK resource directories. Locate these resources through \u003ccode\u003e/protocol/task.json\u003c/code\u003e and consult the documentation for the installed tool version when diagnosing unfamiliar syntax or tool failures.\u003c/li\u003e\n\u003cli\u003eGenerate an initial candidate and submit a snapshot early. When \u003ccode\u003eprocess-feedback\u003c/code\u003e is available, check the current GDS with layout MCP \u003ccode\u003echeck\u003c/code\u003e or \u003ccode\u003epython -I /protocol/process_check.py\u003c/code\u003e before the final submission. This runs the final evaluator's complete plan and returns engineering diagnostics and candidate measurements, without scores or normalized quality factors. Checks have no count limit and consume the same wall-clock budget. Inspect the physical and functional results and all scored metrics; successful tool execution alone does not establish requirement satisfaction. Read paginated diagnostics with \u003ccode\u003ereport\u003c/code\u003e when using MCP. Local exploratory checks do not replace this complete check.\u003c/li\u003e\n\u003cli\u003eUse the remaining time for measured improvements to the declared quality objectives. Identify the limiting scored metrics, make targeted layout changes, regenerate and check the candidate, and compare measurements with the previous candidate and the stated scoring targets and trade-offs. Preserve the best valid candidate and revert changes that worsen the overall objective. Repeat while time and useful improvements remain; passing validity checks alone is not a stopping condition.\u003c/li\u003e\n\u003cli\u003eStop optimization when the budget expires, all declared quality objectives are achieved, or measured trials support convergence. If stopping early, explain the changes tried, the metric comparisons and the remaining limitations. Track remaining time through session status. At soft-budget expiry, finish or cancel already-started work and submit immediately; do not start another command, check or optimization round. If an MCP execution is running, use \u003ccode\u003epoll\u003c/code\u003e with its \u003ccode\u003eexecution_id\u003c/code\u003e and the returned \u003ccode\u003enext_offset\u003c/code\u003e as \u003ccode\u003eoffset\u003c/code\u003e until completion, or cancel it and wait for it to stop.\u003c/li\u003e\n\u003cli\u003eFinish or cancel outstanding work, restore your best candidate to the declared output path, and explicitly submit it before ending the session. With layout MCP \u003ccode\u003esubmit\u003c/code\u003e, remove the \u003ccode\u003e/workspace/\u003c/code\u003e prefix from \u003ccode\u003eoutput.path\u003c/code\u003e; with the container interface, run \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e. Wait for the receipt: only the last accepted snapshot is judged, and writing a file alone is not submission. Acceptance confirms delivery; the framework independently evaluates validity and quality after the session.\u003c/li\u003e\n\u003c/ol\u003e\n12:T18a9,\u003cp\u003eArtifact, geometry, DRC, LVS and declared functional requirements must pass. Parasitic extraction is also mandatory: it must produce a complete, electrically consistent netlist usable by the required post-layout simulations. A completed candidate rejection scores zero; infrastructure errors do not establish candidate failure.\u003c/p\u003e\n\u003cp\u003ePhysical checks and the declared functional bounds must pass. Quality scoring imposes no fixed degradation allowance. Each \u003ccode\u003esource_*\u003c/code\u003e job and its corresponding candidate extracted circuit use exactly the same testbench, model resources, parameters, loads and measurement windows. Independent source observations define the 100-point electrical baseline without depending on the submitted GDS; reports retain every paired result.\u003c/p\u003e\n\u003cp\u003eLet x be the post-layout measurement and b the source-circuit measurement under the same conditions:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eRatio normalization: maximize with q = x/b and minimize with q = b/x. When a numerical scale s is declared, use (x+s)/(b+s) and its reciprocal, respectively. The scale handles zero values as a normalization floor; it is neither an allowed degradation nor an acceptance bound.\u003c/li\u003e\n\u003cli\u003eAmplitude in dB: maximize with q = 10^((x-b)/20) and minimize with its reciprocal.\u003c/li\u003e\n\u003cli\u003eTarget normalization: q = 1/(1+abs(x-b)/s), where s is the declared physical scale. Signed or zero-valued operating points are not divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eUse \u003ccode\u003elayout\u003c/code\u003e scoring. Each metric takes its worst paired quality q, and the total score is S = 100 * product(min(1, q_i) ** w_i), with area quality q_area = area_reference / candidate_functional_area. The weights below sum to 1; metric dimensions describe measurements and do not determine weights. Physical, extraction, or functional rejection scores zero; other missing or invalid measurements leave the score unknown, and zero-weight observations must also be valid. Matching source-circuit performance at the reference area scores 100 points; each metric is capped at quality 1, so scores cannot exceed 100. Weights express quality tradeoffs rather than hard bounds.\u003c/p\u003e\n\u003cp\u003eThe measurements below use the supplied SPICE node and source names. \u003ccode\u003ev(n)\u003c/code\u003e is a node voltage; \u003ccode\u003ei(V)\u003c/code\u003e is current flowing into a voltage source, so delivered power uses a negative sign. \u003ccode\u003edb(z)=20*log10(abs(z))\u003c/code\u003e; \u003ccode\u003emag/abs\u003c/code\u003e denote magnitude, and \u003ccode\u003ecph\u003c/code\u003e denotes continuous phase in radians. \u003ccode\u003efind\u003c/code\u003e, \u003ccode\u003ewhen\u003c/code\u003e, \u003ccode\u003efrom/to\u003c/code\u003e and \u003ccode\u003erise/fall\u003c/code\u003e follow the deck's interpolation, window and crossing conventions. SPICE suffixes p/n/u/m/meg/g mean pico/nano/micro/milli/mega/giga. Nested \u003ccode\u003eavg\u003c/code\u003e, \u003ccode\u003emin\u003c/code\u003e, \u003ccode\u003emax\u003c/code\u003e, \u003ccode\u003evecmin/vecmax\u003c/code\u003e and \u003ccode\u003ederiv\u003c/code\u003e represent window averages, extrema and sampled derivatives. Measure each operating condition independently, pair it with the source result under that condition, and take the worst paired quality within each metric group.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eDefinition / observation\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eQuality normalization\u003c/th\u003e\n\u003cth\u003eFunctional range\u003c/th\u003e\n\u003cth\u003eScale\u003c/th\u003e\n\u003cth\u003eDimension\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003elow_frequency_gain\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: Value of \u003ccode\u003e(db((v(vout)/(v(vinp)-v(vinn))))) at=1\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003emaximize / db20\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eunity_gain_bandwidth\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: Crossing coordinate where \u003ccode\u003e(db((v(vout)/(v(vinp)-v(vinn)))))=0 fall=1\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eHz\u003c/td\u003e\n\u003ctd\u003emaximize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ephase_margin\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: \u003ccode\u003e180+(find (180*cph((v(vout)/(v(vinp)-v(vinn))))/pi) when (db((v(vout)/(v(vinp)-v(vinn)))))=0 fall=1)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003edeg\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 180\u003c/td\u003e\n\u003ctd\u003e180\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_bias\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003ev(vout)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.5\u003c/td\u003e\n\u003ctd\u003e1.5\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebias_voltage\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003ev(ibias)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.5\u003c/td\u003e\n\u003ctd\u003e1.5\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003esupply_power\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003e-v(vdd)*i(VDD)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003ctd\u003esupply\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eArea reference: \u003cstrong\u003e1198.35 um2\u003c/strong\u003e. The expanded circuit has 8 device instances, a sum of device/contact envelopes 754.0020 um2, a one-sided envelope margin of 0.6 um, a routing allowance of 50%, and a total outer width/height allowance 1.2 um. Estimate = ceil(100 * (1.5 * envelope_sum + 2 * margin * sqrt(envelope_sum) + margin^2)) / 100. Here margin is the total allowance across both sides, and the envelope sum is displayed to four decimal places. MOS/passive envelopes use W/L (or resistor dimensions) and multiplicity, including explicit contacts and HBT emitter/contact envelopes. This is a frozen engineering estimate, not a process minimum or a proven achievable area.\u003c/p\u003e\n\u003cp\u003eThe capability coefficient is \u003cstrong\u003e4\u003c/strong\u003e, independent of this task's reference-normalized score.\u003c/p\u003e\n\u003ch3\u003eScore weights\u003c/h3\u003e\n\u003cp\u003eSmall-signal OTAs: gain 27%, bandwidth 22.5%, phase margin 22.5%, operating points 4.5%, power 13.5%, area 10%. Each objective's weight is divided equally among its metrics.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003elow_frequency_gain\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.270000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eunity_gain_bandwidth\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.225000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ephase_margin\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.225000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebias_voltage\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.022500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_bias\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.022500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003esupply_power\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.135000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n13:T4b6,\u003cp\u003eSubmit top cell \u003ccode\u003eamp_001_5t\u003c/code\u003e, with all six named electrical ports, no unresolved\nhierarchy, and at most 10 MiB. Artifact, DRC, strict named-port LVS and geometry\nchecks must pass. DRC uses the pinned main and extra/maximal rules without\nwaivers; density and antenna are outside this standalone-block scope.\u003c/p\u003e\n\u003cp\u003eThe functional bounding box must fit within 120 by 70 um. Its area includes all\nprocess device and routing drawing layers enumerated in the published runtime\nconstraints, including wells, taps, implants, active, poly, contacts, all routing\nmetals/vias and passive/device markers. Annotation text and pin-purpose shapes\nare excluded from area; functional routing must use drawing layers.\u003c/p\u003e\n\u003cp\u003eThe judge extracts distributed RC from the submitted GDS and simulates that\nextracted DUT. Physical LVS retains explicit taps. Magic models the body\nconnection through its extracted network without the separate compact \u003ccode\u003eptap1\u003c/code\u003e\nand \u003ccode\u003entap1\u003c/code\u003e devices; source calibration records the effect of this boundary.\nThis task covers nominal deterministic AC/DC behavior, not statistical mismatch,\nPVT, noise, distortion, transient settling, EM or manufacturing signoff.\u003c/p\u003e\n14:T1191,\u003cp\u003eSoft solve budget: \u003cstrong\u003e3 hours\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eUse the reviewed IHP PDK/EDA resources exposed through the \u003ccode\u003eresources\u003c/code\u003e field of \u003ccode\u003e/protocol/task.json\u003c/code\u003e;\nKLayout and Magic support layout checking and extraction, and ngspice supports\nsimulation. \u003ccode\u003e/protocol/task.json\u003c/code\u003e provides the frozen constraints and evaluation\nrequirements; \u003ccode\u003e/protocol/harness.json\u003c/code\u003e describes the active harness.\nIf \u003ccode\u003eprocess-feedback\u003c/code\u003e is exposed, use its published helper for interim checks.\nWrite \u003ccode\u003e/workspace/output/final.gds\u003c/code\u003e, then explicitly submit it with\n\u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e. The final judge evaluates the submitted snapshot.\u003c/p\u003e\n\u003ch3\u003eSolve workflow\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eRead the declared circuit and materials, \u003ccode\u003e/protocol/task.json\u003c/code\u003e for paths, constraints and reviewed resources, and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e for capabilities and helper commands. Task inputs under \u003ccode\u003e/task\u003c/code\u003e and resources under \u003ccode\u003e/resources\u003c/code\u003e are read-only; construct the layout in \u003ccode\u003e/workspace\u003c/code\u003e with the declared tools. With layout MCP, paths and commands refer to the remote EDA workspace. Create your own implementation with real devices, interconnect and pins, using your own tool loop without delegating to other agents; reference layouts and author code are not solver inputs.\u003c/li\u003e\n\u003cli\u003eInspect \u003ccode\u003eresources.external\u003c/code\u003e before using external tools. Each command starts a fresh shell: when tool modules are declared, source \u003ccode\u003e/usr/share/Modules/init/bash\u003c/code\u003e and load the selected tool's modules; export its declared \u003ccode\u003etool_environment\u003c/code\u003e settings in that same command. Repeat as needed and use batch or headless operation. Local manuals, command references, and release notes may be available within the declared EDA installation and PDK resource directories. Locate these resources through \u003ccode\u003e/protocol/task.json\u003c/code\u003e and consult the documentation for the installed tool version when diagnosing unfamiliar syntax or tool failures.\u003c/li\u003e\n\u003cli\u003eGenerate an initial candidate and submit a snapshot early. When \u003ccode\u003eprocess-feedback\u003c/code\u003e is available, check the current GDS with layout MCP \u003ccode\u003echeck\u003c/code\u003e or \u003ccode\u003epython -I /protocol/process_check.py\u003c/code\u003e before the final submission. This runs the final evaluator's complete plan and returns engineering diagnostics and candidate measurements, without scores or normalized quality factors. Checks have no count limit and consume the same wall-clock budget. Inspect the physical and functional results and all scored metrics; successful tool execution alone does not establish requirement satisfaction. Read paginated diagnostics with \u003ccode\u003ereport\u003c/code\u003e when using MCP. Local exploratory checks do not replace this complete check.\u003c/li\u003e\n\u003cli\u003eUse the remaining time for measured improvements to the declared quality objectives. Identify the limiting scored metrics, make targeted layout changes, regenerate and check the candidate, and compare measurements with the previous candidate and the stated scoring targets and trade-offs. Preserve the best valid candidate and revert changes that worsen the overall objective. Repeat while time and useful improvements remain; passing validity checks alone is not a stopping condition.\u003c/li\u003e\n\u003cli\u003eStop optimization when the budget expires, all declared quality objectives are achieved, or measured trials support convergence. If stopping early, explain the changes tried, the metric comparisons and the remaining limitations. Track remaining time through session status. At soft-budget expiry, finish or cancel already-started work and submit immediately; do not start another command, check or optimization round. If an MCP execution is running, use \u003ccode\u003epoll\u003c/code\u003e with its \u003ccode\u003eexecution_id\u003c/code\u003e and the returned \u003ccode\u003enext_offset\u003c/code\u003e as \u003ccode\u003eoffset\u003c/code\u003e until completion, or cancel it and wait for it to stop.\u003c/li\u003e\n\u003cli\u003eFinish or cancel outstanding work, restore your best candidate to the declared output path, and explicitly submit it before ending the session. With layout MCP \u003ccode\u003esubmit\u003c/code\u003e, remove the \u003ccode\u003e/workspace/\u003c/code\u003e prefix from \u003ccode\u003eoutput.path\u003c/code\u003e; with the container interface, run \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e. Wait for the receipt: only the last accepted snapshot is judged, and writing a file alone is not submission. Acceptance confirms delivery; the framework independently evaluates validity and quality after the session.\u003c/li\u003e\n\u003c/ol\u003e\n6:[\"$\",\"$8\",null,{\"fallback\":[\"$\",\"p\",null,{\"children\":\"Loading published evidence…\"}],\"children\":[\"$\",\"$L10\",null,{\"task\":{\"case_path\":\"tasks/ihp-sg13g2/analog-db/cases/amp_001_5t/case.toml\",\"coefficient\":4,\"collection\":\"analog-db\",\"configuration_url\":\"/ICLayout-Bench/assets/c45a1773477214bcd10a0b506bbc448c66ac79660b2847eb1ef7eb65d7c2b53d.txt\",\"description_html\":\"$11\",\"description_path\":\"tasks/ihp-sg13g2/analog-db/cases/amp_001_5t/problem.md\",\"hours\":3,\"id\":\"ihp-sg13g2.analog-db.amp_001_5t\",\"inputs\":{\"description\":{\"format\":\"text\",\"path\":\"problem.md\",\"sha256\":\"6ca88e00a16c8824af5fcca5b78f5eb83ea57654c438db23d876b126841841f5\"},\"netlist\":{\"format\":\"spice\",\"path\":\"materials/circuit.cdl\",\"sha256\":\"55016e668fdcbc3087c98af6d92f196225fd586da3a9a8e049200fd0419c119f\",\"subcircuit\":\"amp_001_5t\"},\"performance\":{\"format\":\"spice\",\"path\":\"materials/testbench.spice\",\"sha256\":\"b661d0d87ce39aac3222d2378bf1e8353f985f6aac729965e318d99882f92a19\"},\"simulation\":{\"format\":\"spice\",\"path\":\"materials/circuit.spice\",\"sha256\":\"08afdd756d9a1bb7409ddee1ef5a525ec1a0f0261eda6a49db150c1618cb853c\"}},\"licenses\":[{\"name\":\"LICENSE\",\"path\":\"tasks/ihp-sg13g2/analog-db/LICENSE\",\"url\":\"/ICLayout-Bench/assets/644dd511526bc2da77ee7c74714118315db91255376d0ea93a1975b4dbfbfb3d.txt\"},{\"name\":\"NOTICE\",\"path\":\"tasks/ihp-sg13g2/analog-db/NOTICE\",\"url\":\"/ICLayout-Bench/assets/69f7110d12f142806dfdd53f516082a82032da57d1ad47d0bc792d3a68329145.txt\"}],\"materials\":[{\"name\":\"problem.md\",\"role\":\"description\",\"url\":\"/ICLayout-Bench/assets/6ca88e00a16c8824af5fcca5b78f5eb83ea57654c438db23d876b126841841f5.txt\"},{\"name\":\"materials/circuit.cdl\",\"role\":\"netlist\",\"url\":\"/ICLayout-Bench/assets/55016e668fdcbc3087c98af6d92f196225fd586da3a9a8e049200fd0419c119f.txt\"},{\"name\":\"materials/circuit.spice\",\"role\":\"simulation\",\"url\":\"/ICLayout-Bench/assets/08afdd756d9a1bb7409ddee1ef5a525ec1a0f0261eda6a49db150c1618cb853c.txt\"},{\"name\":\"materials/testbench.spice\",\"role\":\"performance\",\"url\":\"/ICLayout-Bench/assets/b661d0d87ce39aac3222d2378bf1e8353f985f6aac729965e318d99882f92a19.txt\"}],\"metrics\":[{\"aggregation\":\"max\",\"category\":\"physical\",\"direction\":\"minimize\",\"id\":\"functional_area\",\"observations\":[\"geometry:area\"],\"unit\":\"um2\"},{\"aggregation\":\"min\",\"baseline\":[\"source_nominal:low_frequency_gain\"],\"category\":\"performance\",\"dimension\":\"response\",\"direction\":\"maximize\",\"id\":\"low_frequency_gain\",\"normalization\":\"db20\",\"observations\":[\"nominal:low_frequency_gain\"],\"unit\":\"dB\"},{\"aggregation\":\"min\",\"baseline\":[\"source_nominal:unity_gain_bandwidth\"],\"category\":\"performance\",\"dimension\":\"response\",\"direction\":\"maximize\",\"id\":\"unity_gain_bandwidth\",\"normalization\":\"ratio\",\"observations\":[\"nominal:unity_gain_bandwidth\"],\"requirement\":{\"lower\":0,\"rationale\":\"The observed frequency or ordered-event interval has a nonnegative measurement domain, and its required crossing must exist for a usable observation.\"},\"unit\":\"Hz\"},{\"aggregation\":\"min\",\"baseline\":[\"source_nominal:phase_margin\"],\"category\":\"performance\",\"dimension\":\"response\",\"direction\":\"target\",\"id\":\"phase_margin\",\"normalization\":\"target\",\"observations\":[\"nominal:phase_margin\"],\"requirement\":{\"lower\":0,\"rationale\":\"The declared negative-feedback loop must stay on the measured 0 to 180 degree stable-feedback branch at the required unity crossing; the amount of positive phase margin remains a scored objective.\",\"upper\":180},\"scale\":180,\"unit\":\"deg\"},{\"aggregation\":\"min\",\"baseline\":[\"source_nominal:output_bias\"],\"category\":\"performance\",\"dimension\":\"bias\",\"direction\":\"target\",\"id\":\"output_bias\",\"normalization\":\"target\",\"observations\":[\"nominal:output_bias\"],\"requirement\":{\"lower\":0,\"rationale\":\"The declared node voltage or voltage span must remain within its ground-to-supply operating envelope; precision relative to the source remains a scored objective.\",\"upper\":1.5},\"scale\":1.5,\"unit\":\"V\"},{\"aggregation\":\"min\",\"baseline\":[\"source_nominal:bias_voltage\"],\"category\":\"performance\",\"dimension\":\"bias\",\"direction\":\"target\",\"id\":\"bias_voltage\",\"normalization\":\"target\",\"observations\":[\"nominal:bias_voltage\"],\"requirement\":{\"lower\":0,\"rationale\":\"The declared node voltage or voltage span must remain within its ground-to-supply operating envelope; precision relative to the source remains a scored objective.\",\"upper\":1.5},\"scale\":1.5,\"unit\":\"V\"},{\"aggregation\":\"max\",\"baseline\":[\"source_nominal:supply_power\"],\"category\":\"performance\",\"dimension\":\"supply\",\"direction\":\"minimize\",\"id\":\"supply_power\",\"normalization\":\"ratio\",\"observations\":[\"nominal:supply_power\"],\"requirement\":{\"lower\":0,\"rationale\":\"The declared powered circuit or driven switching network must consume nonnegative net supply/driver energy or quiescent current under the complete stated observation.\"},\"scale\":1e-12,\"unit\":\"W\"}],\"pdk\":\"ihp-sg13g2\",\"reader\":{\"category\":\"Amplifiers \u0026 RF\",\"summary\":\"Amplifies a differential input using an NMOS pair, PMOS mirror load and a separate bias reference.\",\"title\":\"Five-Transistor OTA Core with Bias Mirror\"},\"scoring\":{\"area_metric\":\"functional_area\",\"area_target\":1198.35,\"method\":\"layout\",\"rationale\":\"Small-signal OTAs: gain 27%; bandwidth 22.5%; phase margin 22.5%; operating points 4.5%; power 13.5%; area 10%. Each objective's weight is divided equally among its metrics.\",\"weights\":{\"bias_voltage\":0.0225,\"functional_area\":0.1,\"low_frequency_gain\":0.27,\"output_bias\":0.0225,\"phase_margin\":0.225,\"supply_power\":0.135,\"unity_gain_bandwidth\":0.225}},\"sections\":{\"Electrical Requirements and Scoring\":\"$12\",\"Inputs and Interface\":\"\u003cp\u003e\u003ccode\u003ematerials/circuit.cdl\u003c/code\u003e is authoritative for physical LVS;\\n\u003ccode\u003ematerials/circuit.spice\u003c/code\u003e is its simulator representation.\\n\u003ccode\u003ematerials/testbench.spice\u003c/code\u003e defines the AC/DC measurements. Port order is\\n\u003ccode\u003evdd vout vinp vinn ibias vss\u003c/code\u003e: supply, single-ended output, non-inverting input,\\ninverting input, reference-current input, and return. Supply 20 uA from \u003ccode\u003evdd\u003c/code\u003e\\ninto \u003ccode\u003eibias\u003c/code\u003e; it is not an ideal voltage-bias input.\u003c/p\u003e\\n\u003cp\u003eThe NMOS input pair has W/L = 10/10 um; the PMOS mirror pair 10/7 um;\\nthe NMOS tail and reference devices 3.8/1 um, all with multiplicity 1.\\nThe CDL also declares substrate and well taps. Retain all electrical connections,\\nbody connections, sizes and tap devices. Placement and routing are free; normal\\nsource/drain equivalence and electrically equivalent device splitting are allowed\\nonly when the declared LVS checks accept them. No additional common-centroid or\\nstatistical matching requirement is scored.\u003c/p\u003e\\n\",\"Objective\":\"\u003cp\u003eImplement the fixed six-MOS \u003ccode\u003eamp_001_5t\u003c/code\u003e circuit in IHP SG13G2 and submit a\\nself-contained GDS. The circuit consists of a five-transistor OTA core and a\\nsixth, diode-connected bias-reference MOS. Device dimensions are fixed.\u003c/p\u003e\\n\u003ch3\u003eOptimization objective\u003c/h3\u003e\\n\u003cp\u003eMaximize the declared quality score within the solve budget while satisfying all physical and necessary functional requirements. The first passing DRC, LVS and required electrical checks establish a feasible baseline. Continue improving the scored metrics from that baseline; a passing check or \u003ccode\u003etask_success = true\u003c/code\u003e does not mean that the quality objectives have been achieved.\u003c/p\u003e\\n\",\"Operating Conditions\":\"\u003cp\u003eThe pinned \u003ccode\u003emos_tt\u003c/code\u003e/\u003ccode\u003eres_typ\u003c/code\u003e models run at 27 C, with VDD = 1.5 V, VSS = 0 V,\\n20 uA reference current, 0.8 V non-inverting input bias, and an external 10 pF\\noutput load. The 4 GH/4 GF feedback network closes the DC loop and opens the AC\\nloop. It is testbench apparatus, not part of the submitted layout. AC sweeps\\n1 Hz to 100 MHz at 100 points per decade. The power measurement includes the\\nreference-current branch supplied from VDD. The 1e12 ohm numerical shunt is\\npart of the declared simulation setup.\u003c/p\u003e\\n\",\"Physical Requirements\":\"$13\",\"Tools and Submission\":\"$14\"},\"source_url\":\"https://github.com/MacAnalog/spicexplorer-release/tree/263d0322f8900dc331536fbbe6c0e804514fc454/analog-db/circuits/amp_001_5t\",\"status\":\"qualified\",\"title\":\"Five-Transistor OTA Core with Bias Mirror\",\"core\":false},\"catalog\":{\"tasks\":[],\"runs\":[],\"experiments\":[],\"contexts\":[],\"boards\":[]},\"previewRun\":null,\"preview\":null,\"evidenceError\":false}]}]\nc:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n15:I[27201,[\"/ICLayout-Bench/_next/static/chunks/2h60meymns2z5.js\"],\"IconMark\"]\n9:null\ne:[[\"$\",\"title\",\"0\",{\"children\":\"ICLayout-Bench | Circuit layout intelligence\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Independent evaluation of AI for integrated circuit layout. Compare model scores, explore circuit performance and inspect generated layouts.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/ICLayout-Bench/brand/iclayout-bench.svg\",\"type\":\"image/svg+xml\",\"sizes\":\"any\"}],[\"$\",\"$L15\",\"3\",{}]]\n"])</script></body></html>
