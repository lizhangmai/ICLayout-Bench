mirror drives net057. XM23/XM24 drive net049; XM13/XM18 drive VOUT. The active compensation retains C0 (net063–VOUT), C1 (net051–vss), C2 (net043–vss), both resistors from net078 to net077/net082, and both resistors from net057 to net051/net043. The entire bias tree and all body relationships remain.\u003c/p\u003e\n\u003ch3 id=\"problem-optimization-objective\"\u003eOptimization objective\u003c/h3\u003e\n\u003cp\u003eMaximize the declared quality score within the solve budget while satisfying all physical and necessary functional requirements. The first passing DRC, LVS and required electrical checks establish a feasible baseline. Continue improving the scored metrics from that baseline; a passing check or \u003ccode\u003etask_success = true\u003c/code\u003e does not mean that the quality objectives have been achieved.\u003c/p\u003e\n\u003ch2 id=\"problem-inputs-and-interface\"\u003eInputs and Interface\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003ematerials/circuit.cdl\u003c/code\u003e is the authoritative physical circuit and \u003ccode\u003ematerials/circuit.spice\u003c/code\u003e its equivalent simulation representation; \u003ccode\u003ematerials/testbench.spice\u003c/code\u003e and \u003ccode\u003ematerials/ac.spice\u003c/code\u003e define transient/closed-loop AC and balanced open-loop AC, respectively. This statement is the description input. Ordered interface is \u003ccode\u003evss vdd vinn vinp vout vb1\u003c/code\u003e: \u003ccode\u003evss\u003c/code\u003e/\u003ccode\u003evdd\u003c/code\u003e are supply rails; all other signals, bias/reference and unloaded monitor ports retain netlist connections. Independent bias sources and loads remain outside the physical core.\u003c/p\u003e\n\u003cp\u003eThe integer-micrometre MOS dimensions are unchanged. Every resistor uses native rhigh segments of at most about 250 kOhm; every larger capacitor uses parallel native cap_cmim units of at most about 4 pF. Source and extraction use logical body nets. Native LVS checks actual body-contact connectivity. Distributed substrate behavior is outside this model boundary.\u003c/p\u003e\n\u003ch2 id=\"problem-operating-conditions\"\u003eOperating Conditions\u003c/h2\u003e\n\u003cp\u003eTT MOS, typical MIM/high-poly, 27 C, 1.5 V supply, 0.3 V input reference, 10 pF output load. The external current sink is i0 vb1 vss 1e-06. A direct unity follower receives a 100 mV step at 2 us with 100 ns edges and 8 us high width; falling starts at 10.1 us and completes at 10.2 us. Observe 0–20 us with 0.5 ns maximum step. Report high-window statistics at 8–10 us and return-window statistics at 18–20 us, not a settling time. The rail is adapted from the authored 1.8 V analysis to the actual IHP LV binding; no transistor sizing campaign is performed.\u003c/p\u003e\n\u003cp\u003eThe transient deck directly connects vinn to vout. The frequency-domain deck closes DC feedback through 1 TH, bypasses its far end to ground through 1 F and injects +0.5/−0.5 V AC at the inputs, isolating DC feedback at all measurement frequencies. AC common-mode residual and DC feedback error must both be at most 1 uV; do not infer open-loop gain from near-zero closed-loop input error.\u003c/p\u003e\n\u003cp\u003eBoth decks sweep 200 points per decade from 1 Hz to 1 GHz. AC linearizes a verified DC point and does not prove that equilibrium dynamically stable. Source and candidate both use \u003ccode\u003ershunt=1e12\u003c/code\u003e (1 TOhm) numerical shunts from each node to ground to handle floating extracted/series-capacitor nodes; sensitivity is checked at 10 TOhm. Power-up startup is not simulated: transient starts at the DC point, and an undisturbed interval checks whether it persists. Use the default sparse solver and deck-declared tolerances.\u003c/p\u003e\n\u003ch2 id=\"problem-physical-requirements\"\u003ePhysical Requirements\u003c/h2\u003e\n\u003cp\u003eSubmit a native SG13G2 GDS with top cell \u003ccode\u003eamp_013_qu2017_azc\u003c/code\u003e, at most 67108864 bytes, within 20000 × 2000 um. Native main and maximal DRC, named-interface LVS and geometry must pass without marker waivers. Keep every MOS, body connection and passive path. Unit multiplicities and the declared passive series/parallel realization are fixed in the materials.\u003c/p\u003e\n\u003cp\u003eFunctional area includes active regions, gates, contacts, metals, vias, MIM devices and all routing. Wells, text, annotations and nonfunctional markers cannot independently define functional area. Runtime task metadata supplies the exact layer set. After native connectivity and distributed wire-resistance/ground-capacitance extraction, simulate the candidate GDS with the same native MOS/MIM/high-poly models as the source. This task's nominal MOS/R/C scope excludes RF/coupling extraction, PVT, mismatch, noise and manufacturing signoff.\u003c/p\u003e\n\u003ch2 id=\"problem-electrical-requirements-and-scoring\"\u003eElectrical Requirements and Scoring\u003c/h2\u003e\n\u003cp\u003eArtifact, geometry, DRC, LVS and declared functional requirements must pass. Parasitic extraction is also mandatory: it must produce a complete, electrically consistent netlist usable by the required post-layout simulations. A completed candidate rejection scores zero; infrastructure errors do not establish candidate failure.\u003c/p\u003e\n\u003cp\u003ePhysical checks and the declared functional bounds must pass. Quality scoring imposes no fixed degradation allowance. Each \u003ccode\u003esource_*\u003c/code\u003e job and its corresponding candidate extracted circuit use exactly the same testbench, model resources, parameters, loads and measurement windows. Independent source observations define the 100-point electrical baseline without depending on the submitted GDS; reports retain every paired result.\u003c/p\u003e\n\u003cp\u003eLet x be the post-layout measurement and b the source-circuit measurement under the same conditions:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eRatio normalization: maximize with q = x/b and minimize with q = b/x. When a numerical scale s is declared, use (x+s)/(b+s) and its reciprocal, respectively. The scale handles zero values as a normalization floor; it is neither an allowed degradation nor an acceptance bound.\u003c/li\u003e\n\u003cli\u003eAmplitude in dB: maximize with q = 10^((x-b)/20) and minimize with its reciprocal.\u003c/li\u003e\n\u003cli\u003eTarget normalization: q = 1/(1+abs(x-b)/s), where s is the declared physical scale. Signed or zero-valued operating points are not divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eUse \u003ccode\u003elayout\u003c/code\u003e scoring. Each metric takes its worst paired quality q, and the total score is S = 100 * product(min(1, q_i) ** w_i), with area quality q_area = area_reference / candidate_functional_area. The weights below sum to 1; metric dimensions describe measurements and do not determine weights. Physical, extraction, or functional rejection scores zero; other missing or invalid measurements leave the score unknown, and zero-weight observations must also be valid. Matching source-circuit performance at the reference area scores 100 points; each metric is capped at quality 1, so scores cannot exceed 100. Weights express quality tradeoffs rather than hard bounds.\u003c/p\u003e\n\u003cp\u003eComplete every declared simulation, with finite measurements and complete raw records. Transient means use full-precision cumulative integration and interpolated endpoint corrections; incomplete windows are errors. PP is the range over the entire finite window, including oscillation or slow drift. It does not establish phase margin, loop gain, settling time or periodic steady state.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003elate_error_v\u003c/code\u003e, \u003ccode\u003ereturn_error_v\u003c/code\u003e, \u003ccode\u003eripple_v\u003c/code\u003e and \u003ccode\u003ereturn_ripple_v\u003c/code\u003e use \u003ccode\u003esaturating_ratio\u003c/code\u003e. Candidate error x, paired source error b and the positive scale s below define q = 2(b+s)/(b+x+2s). Source-equivalent error gives q=1; decreasing error approaches the upper quality limit 2 with diminishing returns. The scale retains its declared unit and numerical-floor meaning. Normalize each condition before taking the worst paired quality; other metrics retain their declared normalization and functional requirements.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eDefinition\u003c/th\u003e\n\u003cth\u003eQuality role / functional domain\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eDC follower output\u003c/td\u003e\n\u003ctd\u003ebias; target\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eDC rail power, -VDD*I(VDD); external current-sink implementation excluded\u003c/td\u003e\n\u003ctd\u003esupply; ratio; 0 ≤ value\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003egain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003eBalanced differential open AC gain at 1 Hz\u003c/td\u003e\n\u003ctd\u003eresponse; db20\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003egain_10khz_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003eBalanced differential open AC gain at 10 kHz\u003c/td\u003e\n\u003ctd\u003eresponse; db20\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eclosed_gain_10khz_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003eDirect follower output/signal AC gain at 10 kHz\u003c/td\u003e\n\u003ctd\u003eresponse; target\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003elate_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eMean absolute follower tracking error, 8–10 us\u003c/td\u003e\n\u003ctd\u003eresponse; saturating_ratio; 0 ≤ value\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ereturn_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eMean absolute follower tracking error, 18–20 us\u003c/td\u003e\n\u003ctd\u003eresponse; saturating_ratio; 0 ≤ value\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eripple_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eFull output peak-to-peak range, 8–10 us\u003c/td\u003e\n\u003ctd\u003eresponse; saturating_ratio; 0 ≤ value\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ereturn_ripple_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eFull output peak-to-peak range, 18–20 us\u003c/td\u003e\n\u003ctd\u003eresponse; saturating_ratio; 0 ≤ value\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emean_power_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eTime-weighted rail power over 2–20 us; external current-sink implementation excluded\u003c/td\u003e\n\u003ctd\u003esupply; ratio; 0 ≤ value\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebias_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eExternal current-bias port DC voltage\u003c/td\u003e\n\u003ctd\u003ediagnostic; unscored\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ehigh_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eMean follower output, 8–10 us\u003c/td\u003e\n\u003ctd\u003ediagnostic; unscored\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003elow_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eMean follower output, 18–20 us\u003c/td\u003e\n\u003ctd\u003ediagnostic; unscored\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_min_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eMinimum output over 0–20 us\u003c/td\u003e\n\u003ctd\u003ediagnostic; unscored\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_max_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eMaximum output over 0–20 us\u003c/td\u003e\n\u003ctd\u003ediagnostic; unscored\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efixture_cm_max\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eResidual common-mode excitation in the differential AC fixture\u003c/td\u003e\n\u003ctd\u003ediagnostic; unscored; 0 ≤ value ≤ 1e-06\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edc_feedback_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eDC voltage mismatch across the external feedback inductor\u003c/td\u003e\n\u003ctd\u003ediagnostic; unscored; 0 ≤ value ≤ 1e-06\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eObserve DC bias, differential gain at 1 Hz/10 kHz, closed-loop response at 10 kHz, tracking error, output bounds and supply power separately.\u003c/p\u003e\n\u003cp\u003ePerformance is continuously paired with the independently simulated source under exactly the same conditions. Gain quality is 10^((candidate−source)/20); target quality is 1/(1+abs(candidate−source)/scale); inverse-ratio quality is (source+floor)/(candidate+floor). Area quality is Q = 8079.11 um2 / functional area. The bias scale is 1.5 V; closed-response scale is 6 dB (factor two in amplitude). Error/range floors are 1 mV (1% of the 100 mV step); power floor is 1 pW. Physical/domain and fixture-validity gates are not upstream product targets.\u003c/p\u003e\n\u003cp\u003eThe compact area benchmark sums MOS envelopes m*((W+2.4)\u003cem\u003e(L+2.4)+3.2^2) um2, capacitor envelopes 1.2\u003c/em\u003eC/(1.5 fF/um2), and resistor envelopes 2*R/(1360 Ohm) um2, then adds 50% global routing allowance; this is an engineering estimate independent of reference GDS. Coefficient 8 accounts for multistage analog routing, active compensation/body connections and physical passive matching.\u003c/p\u003e\n\u003ch3 id=\"problem-score-weights\"\u003eScore weights\u003c/h3\u003e\n\u003cp\u003eFinite-window amplifier response: tracking error 36%, ripple 22.5%, AC transfer 18%, bias and offset 4.5%, power 9%, area 10%. Each objective's weight is divided equally among its metrics.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003elate_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.180000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ereturn_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.180000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ereturn_ripple_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.112500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eripple_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.112500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eclosed_gain_10khz_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.060000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003egain_10khz_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.060000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003egain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.060000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emean_power_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch2 id=\"problem-tools-and-submission\"\u003eTools and Submission\u003c/h2\u003e\n\u003cp\u003eSoft solve budget: \u003cstrong\u003e8 hours\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eRead \u003ccode\u003e/protocol/task.json\u003c/code\u003e for input/output paths, constraints and the \u003ccode\u003eresources\u003c/code\u003e object; \u003ccode\u003e/protocol/harness.json\u003c/code\u003e describes the active check and submission interface.\u003c/p\u003e\n\u003cp\u003eUse the reviewed SG13G2 resources and ngspice 45 environment. Frozen inputs, requirements and tool bindings are in \u003ccode\u003e/protocol/task.json\u003c/code\u003e. Explicitly submit \u003ccode\u003e/workspace/output/final.gds\u003c/code\u003e through the session submission tool; file generation alone is not submission. Evaluation performs native checks, candidate RC extraction and independent paired source/post-layout simulation. Reference GDS, maintainer README and development sources are not solver inputs.\u003c/p\u003e\n\u003cp\u003eThe authoritative MOS input preserves the original logical groups, W/L/m and all four terminal nets. Verified unit arrays, multiple fingers, shared diffusion and shared wells on the same body net are allowed. Native LVS checks connectivity and equivalent device parameters; native DRC checks actual well/substrate contacts. Contact count, dimensions, area/perimeter and the reference well partition are not circuit constraints. PEX uses actual diffusion geometry and interconnect RC, with logical body nets as its boundary; distributed substrate/well resistance is outside this extraction model.\u003c/p\u003e\n\u003ch3 id=\"problem-solve-workflow\"\u003eSolve workflow\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eRead the declared circuit and materials, \u003ccode\u003e/protocol/task.json\u003c/code\u003e for paths, constraints and reviewed resources, and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e for capabilities and helper commands. Task inputs under \u003ccode\u003e/task\u003c/code\u003e and resources under \u003ccode\u003e/resources\u003c/code\u003e are read-only; construct the layout in \u003ccode\u003e/workspace\u003c/code\u003e with the declared tools. With layout MCP, paths and commands refer to the remote EDA workspace. Create your own implementation with real devices, interconnect and pins, using your own tool loop without delegating to other agents; reference layouts and author code are not solver inputs.\u003c/li\u003e\n\u003cli\u003eInspect \u003ccode\u003eresources.external\u003c/code\u003e before using external tools. Each command starts a fresh shell: when tool modules are declared, source \u003ccode\u003e/usr/share/Modules/init/bash\u003c/code\u003e and load the selected tool's modules; export its declared \u003ccode\u003etool_environment\u003c/code\u003e settings in that same command. Repeat as needed and use batch or headless operation. Local manuals, command references, and release notes may be available within the declared EDA installation and PDK resource directories. Locate these resources through \u003ccode\u003e/protocol/task.json\u003c/code\u003e and consult the documentation for the installed tool version when diagnosing unfamiliar syntax or tool failures.\u003c/li\u003e\n\u003cli\u003eGenerate an initial candidate and submit a snapshot early. When \u003ccode\u003eprocess-feedback\u003c/code\u003e is available, check the current GDS with layout MCP \u003ccode\u003echeck\u003c/code\u003e or \u003ccode\u003epython -I /protocol/process_check.py\u003c/code\u003e before the final submission. This runs the final evaluator's complete plan and returns engineering diagnostics and candidate measurements, without scores or normalized quality factors. Checks have no count limit and consume the same wall-clock budget. Inspect the physical and functional results and all scored metrics; successful tool execution alone does not establish requirement satisfaction. Read paginated diagnostics with \u003ccode\u003ereport\u003c/code\u003e when using MCP. Local exploratory checks do not replace this complete check.\u003c/li\u003e\n\u003cli\u003eUse the remaining time for measured improvements to the declared quality objectives. Identify the limiting scored metrics, make targeted layout changes, regenerate and check the candidate, and compare measurements with the previous candidate and the stated scoring targets and trade-offs. Preserve the best valid candidate and revert changes that worsen the overall objective. Repeat while time and useful improvements remain; passing validity checks alone is not a stopping condition.\u003c/li\u003e\n\u003cli\u003eStop optimization when the budget expires, all declared quality objectives are achieved, or measured trials support convergence. If stopping early, explain the changes tried, the metric comparisons and the remaining limitations. Track remaining time through session status. At soft-budget expiry, finish or cancel already-started work and submit immediately; do not start another command, check or optimization round. If an MCP execution is running, use \u003ccode\u003epoll\u003c/code\u003e with its \u003ccode\u003eexecution_id\u003c/code\u003e and the returned \u003ccode\u003enext_offset\u003c/code\u003e as \u003ccode\u003eoffset\u003c/code\u003e until completion, or cancel it and wait for it to stop.\u003c/li\u003e\n\u003cli\u003eFinish or cancel outstanding work, restore your best candidate to the declared output path, and explicitly submit it before ending the session. With layout MCP \u003ccode\u003esubmit\u003c/code\u003e, remove the \u003ccode\u003e/workspace/\u003c/code\u003e prefix from \u003ccode\u003eoutput.path\u003c/code\u003e; with the container interface, run \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e. Wait for the receipt: only the last accepted snapshot is judged, and writing a file alone is not submission. Acceptance confirms delivery; the framework independently evaluates validity and quality after the session.\u003c/li\u003e\n\u003c/ol\u003e\n12:T2033,\u003cp\u003eArtifact, geometry, DRC, LVS and declared functional requirements must pass. Parasitic extraction is also mandatory: it must produce a complete, electrically consistent netlist usable by the required post-layout simulations. A completed candidate rejection scores zero; infrastructure errors do not establish candidate failure.\u003c/p\u003e\n\u003cp\u003ePhysical checks and the declared functional bounds must pass. Quality scoring imposes no fixed degradation allowance. Each \u003ccode\u003esource_*\u003c/code\u003e job and its corresponding candidate extracted circuit use exactly the same testbench, model resources, parameters, loads and measurement windows. Independent source observations define the 100-point electrical baseline without depending on the submitted GDS; reports retain every paired result.\u003c/p\u003e\n\u003cp\u003eLet x be the post-layout measurement and b the source-circuit measurement under the same conditions:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eRatio normalization: maximize with q = x/b and minimize with q = b/x. When a numerical scale s is declared, use (x+s)/(b+s) and its reciprocal, respectively. The scale handles zero values as a normalization floor; it is neither an allowed degradation nor an acceptance bound.\u003c/li\u003e\n\u003cli\u003eAmplitude in dB: maximize with q = 10^((x-b)/20) and minimize with its reciprocal.\u003c/li\u003e\n\u003cli\u003eTarget normalization: q = 1/(1+abs(x-b)/s), where s is the declared physical scale. Signed or zero-valued operating points are not divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eUse \u003ccode\u003elayout\u003c/code\u003e scoring. Each metric takes its worst paired quality q, and the total score is S = 100 * product(min(1, q_i) ** w_i), with area quality q_area = area_reference / candidate_functional_area. The weights below sum to 1; metric dimensions describe measurements and do not determine weights. Physical, extraction, or functional rejection scores zero; other missing or invalid measurements leave the score unknown, and zero-weight observations must also be valid. Matching source-circuit performance at the reference area scores 100 points; each metric is capped at quality 1, so scores cannot exceed 100. Weights express quality tradeoffs rather than hard bounds.\u003c/p\u003e\n\u003cp\u003eComplete every declared simulation, with finite measurements and complete raw records. Transient means use full-precision cumulative integration and interpolated endpoint corrections; incomplete windows are errors. PP is the range over the entire finite window, including oscillation or slow drift. It does not establish phase margin, loop gain, settling time or periodic steady state.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003elate_error_v\u003c/code\u003e, \u003ccode\u003ereturn_error_v\u003c/code\u003e, \u003ccode\u003eripple_v\u003c/code\u003e and \u003ccode\u003ereturn_ripple_v\u003c/code\u003e use \u003ccode\u003esaturating_ratio\u003c/code\u003e. Candidate error x, paired source error b and the positive scale s below define q = 2(b+s)/(b+x+2s). Source-equivalent error gives q=1; decreasing error approaches the upper quality limit 2 with diminishing returns. The scale retains its declared unit and numerical-floor meaning. Normalize each condition before taking the worst paired quality; other metrics retain their declared normalization and functional requirements.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eDefinition\u003c/th\u003e\n\u003cth\u003eQuality role / functional domain\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eDC follower output\u003c/td\u003e\n\u003ctd\u003ebias; target\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eDC rail power, -VDD*I(VDD); external current-sink implementation excluded\u003c/td\u003e\n\u003ctd\u003esupply; ratio; 0 ≤ value\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003egain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003eBalanced differential open AC gain at 1 Hz\u003c/td\u003e\n\u003ctd\u003eresponse; db20\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003egain_10khz_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003eBalanced differential open AC gain at 10 kHz\u003c/td\u003e\n\u003ctd\u003eresponse; db20\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eclosed_gain_10khz_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003eDirect follower output/signal AC gain at 10 kHz\u003c/td\u003e\n\u003ctd\u003eresponse; target\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003elate_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eMean absolute follower tracking error, 8–10 us\u003c/td\u003e\n\u003ctd\u003eresponse; saturating_ratio; 0 ≤ value\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ereturn_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eMean absolute follower tracking error, 18–20 us\u003c/td\u003e\n\u003ctd\u003eresponse; saturating_ratio; 0 ≤ value\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eripple_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eFull output peak-to-peak range, 8–10 us\u003c/td\u003e\n\u003ctd\u003eresponse; saturating_ratio; 0 ≤ value\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ereturn_ripple_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eFull output peak-to-peak range, 18–20 us\u003c/td\u003e\n\u003ctd\u003eresponse; saturating_ratio; 0 ≤ value\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emean_power_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eTime-weighted rail power over 2–20 us; external current-sink implementation excluded\u003c/td\u003e\n\u003ctd\u003esupply; ratio; 0 ≤ value\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebias_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eExternal current-bias port DC voltage\u003c/td\u003e\n\u003ctd\u003ediagnostic; unscored\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ehigh_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eMean follower output, 8–10 us\u003c/td\u003e\n\u003ctd\u003ediagnostic; unscored\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003elow_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eMean follower output, 18–20 us\u003c/td\u003e\n\u003ctd\u003ediagnostic; unscored\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_min_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eMinimum output over 0–20 us\u003c/td\u003e\n\u003ctd\u003ediagnostic; unscored\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_max_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eMaximum output over 0–20 us\u003c/td\u003e\n\u003ctd\u003ediagnostic; unscored\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efixture_cm_max\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eResidual common-mode excitation in the differential AC fixture\u003c/td\u003e\n\u003ctd\u003ediagnostic; unscored; 0 ≤ value ≤ 1e-06\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edc_feedback_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eDC voltage mismatch across the external feedback inductor\u003c/td\u003e\n\u003ctd\u003ediagnostic; unscored; 0 ≤ value ≤ 1e-06\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eObserve DC bias, differential gain at 1 Hz/10 kHz, closed-loop response at 10 kHz, tracking error, output bounds and supply power separately.\u003c/p\u003e\n\u003cp\u003ePerformance is continuously paired with the independently simulated source under exactly the same conditions. Gain quality is 10^((candidate−source)/20); target quality is 1/(1+abs(candidate−source)/scale); inverse-ratio quality is (source+floor)/(candidate+floor). Area quality is Q = 8079.11 um2 / functional area. The bias scale is 1.5 V; closed-response scale is 6 dB (factor two in amplitude). Error/range floors are 1 mV (1% of the 100 mV step); power floor is 1 pW. Physical/domain and fixture-validity gates are not upstream product targets.\u003c/p\u003e\n\u003cp\u003eThe compact area benchmark sums MOS envelopes m*((W+2.4)\u003cem\u003e(L+2.4)+3.2^2) um2, capacitor envelopes 1.2\u003c/em\u003eC/(1.5 fF/um2), and resistor envelopes 2*R/(1360 Ohm) um2, then adds 50% global routing allowance; this is an engineering estimate independent of reference GDS. Coefficient 8 accounts for multistage analog routing, active compensation/body connections and physical passive matching.\u003c/p\u003e\n\u003ch3\u003eScore weights\u003c/h3\u003e\n\u003cp\u003eFinite-window amplifier response: tracking error 36%, ripple 22.5%, AC transfer 18%, bias and offset 4.5%, power 9%, area 10%. Each objective's weight is divided equally among its metrics.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003elate_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.180000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ereturn_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.180000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ereturn_ripple_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.112500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eripple_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.112500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eclosed_gain_10khz_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.060000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003egain_10khz_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.060000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003egain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.060000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emean_power_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n13:T416,\u003cp\u003eImplement \u003ccode\u003eamp_013_qu2017_azc\u003c/code\u003e without changing the declared circuit. XM9/XM10 form the PMOS input pair with their bodies tied to the common source net019. XM14–XM17 form the active NMOS load around DM_2/net063; XM4/XM5 convert this to net050. XM11 drives net094 and XM12 with the XM6/XM7 mirror drives net057. XM23/XM24 drive net049; XM13/XM18 drive VOUT. The active compensation retains C0 (net063–VOUT), C1 (net051–vss), C2 (net043–vss), both resistors from net078 to net077/net082, and both resistors from net057 to net051/net043. The entire bias tree and all body relationships remain.\u003c/p\u003e\n\u003ch3\u003eOptimization objective\u003c/h3\u003e\n\u003cp\u003eMaximize the declared quality score within the solve budget while satisfying all physical and necessary functional requirements. The first passing DRC, LVS and required electrical checks establish a feasible baseline. Continue improving the scored metrics from that baseline; a passing check or \u003ccode\u003etask_success = true\u003c/code\u003e does not mean that the quality objectives have been achieved.\u003c/p\u003e\n14:T5e2,\u003cp\u003eTT MOS, typical MIM/high-poly, 27 C, 1.5 V supply, 0.3 V input reference, 10 pF output load. The external current sink is i0 vb1 vss 1e-06. A direct unity follower receives a 100 mV step at 2 us with 100 ns edges and 8 us high width; falling starts at 10.1 us and completes at 10.2 us. Observe 0–20 us with 0.5 ns maximum step. Report high-window statistics at 8–10 us and return-window statistics at 18–20 us, not a settling time. The rail is adapted from the authored 1.8 V analysis to the actual IHP LV binding; no transistor sizing campaign is performed.\u003c/p\u003e\n\u003cp\u003eThe transient deck directly connects vinn to vout. The frequency-domain deck closes DC feedback through 1 TH, bypasses its far end to ground through 1 F and injects +0.5/−0.5 V AC at the inputs, isolating DC feedback at all measurement frequencies. AC common-mode residual and DC feedback error must both be at most 1 uV; do not infer open-loop gain from near-zero closed-loop input error.\u003c/p\u003e\n\u003cp\u003eBoth decks sweep 200 points per decade from 1 Hz to 1 GHz. AC linearizes a verified DC point and does not prove that equilibrium dynamically stable. Source and candidate both use \u003ccode\u003ershunt=1e12\u003c/code\u003e (1 TOhm) numerical shunts from each node to ground to handle floating extracted/series-capacitor nodes; sensitivity is checked at 10 TOhm. Power-up startup is not simulated: transient starts at the DC point, and an undisturbed interval checks whether it persists. Use the default sparse solver and deck-declared tolerances.\u003c/p\u003e\n15:T141d,\u003cp\u003eSoft solve budget: \u003cstrong\u003e8 hours\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eRead \u003ccode\u003e/protocol/task.json\u003c/code\u003e for input/output paths, constraints and the \u003ccode\u003eresources\u003c/code\u003e object; \u003ccode\u003e/protocol/harness.json\u003c/code\u003e describes the active check and submission interface.\u003c/p\u003e\n\u003cp\u003eUse the reviewed SG13G2 resources and ngspice 45 environment. Frozen inputs, requirements and tool bindings are in \u003ccode\u003e/protocol/task.json\u003c/code\u003e. Explicitly submit \u003ccode\u003e/workspace/output/final.gds\u003c/code\u003e through the session submission tool; file generation alone is not submission. Evaluation performs native checks, candidate RC extraction and independent paired source/post-layout simulation. Reference GDS, maintainer README and development sources are not solver inputs.\u003c/p\u003e\n\u003cp\u003eThe authoritative MOS input preserves the original logical groups, W/L/m and all four terminal nets. Verified unit arrays, multiple fingers, shared diffusion and shared wells on the same body net are allowed. Native LVS checks connectivity and equivalent device parameters; native DRC checks actual well/substrate contacts. Contact count, dimensions, area/perimeter and the reference well partition are not circuit constraints. PEX uses actual diffusion geometry and interconnect RC, with logical body nets as its boundary; distributed substrate/well resistance is outside this extraction model.\u003c/p\u003e\n\u003ch3\u003eSolve workflow\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eRead the declared circuit and materials, \u003ccode\u003e/protocol/task.json\u003c/code\u003e for paths, constraints and reviewed resources, and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e for capabilities and helper commands. Task inputs under \u003ccode\u003e/task\u003c/code\u003e and resources under \u003ccode\u003e/resources\u003c/code\u003e are read-only; construct the layout in \u003ccode\u003e/workspace\u003c/code\u003e with the declared tools. With layout MCP, paths and commands refer to the remote EDA workspace. Create your own implementation with real devices, interconnect and pins, using your own tool loop without delegating to other agents; reference layouts and author code are not solver inputs.\u003c/li\u003e\n\u003cli\u003eInspect \u003ccode\u003eresources.external\u003c/code\u003e before using external tools. Each command starts a fresh shell: when tool modules are declared, source \u003ccode\u003e/usr/share/Modules/init/bash\u003c/code\u003e and load the selected tool's modules; export its declared \u003ccode\u003etool_environment\u003c/code\u003e settings in that same command. Repeat as needed and use batch or headless operation. Local manuals, command references, and release notes may be available within the declared EDA installation and PDK resource directories. Locate these resources through \u003ccode\u003e/protocol/task.json\u003c/code\u003e and consult the documentation for the installed tool version when diagnosing unfamiliar syntax or tool failures.\u003c/li\u003e\n\u003cli\u003eGenerate an initial candidate and submit a snapshot early. When \u003ccode\u003eprocess-feedback\u003c/code\u003e is available, check the current GDS with layout MCP \u003ccode\u003echeck\u003c/code\u003e or \u003ccode\u003epython -I /protocol/process_check.py\u003c/code\u003e before the final submission. This runs the final evaluator's complete plan and returns engineering diagnostics and candidate measurements, without scores or normalized quality factors. Checks have no count limit and consume the same wall-clock budget. Inspect the physical and functional results and all scored metrics; successful tool execution alone does not establish requirement satisfaction. Read paginated diagnostics with \u003ccode\u003ereport\u003c/code\u003e when using MCP. Local exploratory checks do not replace this complete check.\u003c/li\u003e\n\u003cli\u003eUse the remaining time for measured improvements to the declared quality objectives. Identify the limiting scored metrics, make targeted layout changes, regenerate and check the candidate, and compare measurements with the previous candidate and the stated scoring targets and trade-offs. Preserve the best valid candidate and revert changes that worsen the overall objective. Repeat while time and useful improvements remain; passing validity checks alone is not a stopping condition.\u003c/li\u003e\n\u003cli\u003eStop optimization when the budget expires, all declared quality objectives are achieved, or measured trials support convergence. If stopping early, explain the changes tried, the metric comparisons and the remaining limitations. Track remaining time through session status. At soft-budget expiry, finish or cancel already-started work and submit immediately; do not start another command, check or optimization round. If an MCP execution is running, use \u003ccode\u003epoll\u003c/code\u003e with its \u003ccode\u003eexecution_id\u003c/code\u003e and the returned \u003ccode\u003enext_offset\u003c/code\u003e as \u003ccode\u003eoffset\u003c/code\u003e until completion, or cancel it and wait for it to stop.\u003c/li\u003e\n\u003cli\u003eFinish or cancel outstanding work, restore your best candidate to the declared output path, and explicitly submit it before ending the session. With layout MCP \u003ccode\u003esubmit\u003c/code\u003e, remove the \u003ccode\u003e/workspace/\u003c/code\u003e prefix from \u003ccode\u003eoutput.path\u003c/code\u003e; with the container interface, run \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e. Wait for the receipt: only the last accepted snapshot is judged, and writing a file alone is not submission. Acceptance confirms delivery; the framework independently evaluates validity and quality after the session.\u003c/li\u003e\n\u003c/ol\u003e\n6:[\"$\",\"$8\",null,{\"fallback\":[\"$\",\"p\",null,{\"children\":\"Loading published evidence…\"}],\"chi 003e are supply rails; all other signals, bias/reference and unloaded monitor ports retain netlist connections. Independent bias sources and loads remain outside the physical core.\u003c/p\u003e\\n\u003cp\u003eThe integer-micrometre MOS dimensions are unchanged. Every resistor uses native rhigh segments of at most about 250 kOhm; every larger capacitor uses parallel native cap_cmim units of at most about 4 pF. Source and extraction use logical body nets. Native LVS checks actual body-contact connectivity. Distributed substrate behavior is outside this model boundary.\u003c/p\u003e\\n\",\"Objective\":\"$13\",\"Operating Conditions\":\"$14\",\"Physical Requirements\":\"\u003cp\u003eSubmit a native SG13G2 GDS with top cell \u003ccode\u003eamp_013_qu2017_azc\u003c/code\u003e, at most 67108864 bytes, within 20000 × 2000 um. Native main and maximal DRC, named-interface LVS and geometry must pass without marker waivers. Keep every MOS, body connection and passive path. Unit multiplicities and the declared passive series/parallel realization are fixed in the materials.\u003c/p\u003e\\n\u003cp\u003eFunctional area includes active regions, gates, contacts, metals, vias, MIM devices and all routing. Wells, text, annotations and nonfunctional markers cannot independently define functional area. Runtime task metadata supplies the exact layer set. After native connectivity and distributed wire-resistance/ground-capacitance extraction, simulate the candidate GDS with the same native MOS/MIM/high-poly models as the source. This task's nominal MOS/R/C scope excludes RF/coupling extraction, PVT, mismatch, noise and manufacturing signoff.\u003c/p\u003e\\n\",\"Tools and Submission\":\"$15\"},\"source_url\":\"https://github.com/MacAnalog/spicexplorer-release/tree/263d0322f8900dc331536fbbe6c0e804514fc454/analog-db/circuits/amp_013_qu2017_azc\",\"status\":\"qualified\",\"title\":\"Qu AZC Three-Stage Amplifier\",\"core\":false},\"catalog\":{\"tasks\":[],\"runs\":[],\"experiments\":[],\"con
