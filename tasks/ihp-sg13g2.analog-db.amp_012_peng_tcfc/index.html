ll,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[\"$L6\",[[\"$\",\"script\",\"script-0\",{\"src\":\"/ICLayout-Bench/_next/static/chunks/3_2wwayut9q0b.js\",\"async\":true,\"nonce\":\"$undefined\"}]],[\"$\",\"$L7\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.MetadataOutlet\",\"children\":\"$@9\"}]}]]}],{},null,false,null]},null,false,\"$a\"]},null,false,null],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Lb\",null,{\"children\":\"$Lc\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Ld\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.Metadata\",\"children\":\"$Le\"}]}]}],null]}],false]],\"m\":\"$undefined\",\"G\":[\"$f\",[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/ICLayout-Bench/_next/static/chunks/25phisebeeifo.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]]],\"S\":true,\"h\":null,\"r\":\"$undefined\",\"s\":\"$undefined\",\"a\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"U2oZdoUjWqT_XfcDHuQ5i\"}\n10:I[1186,[\"/ICLayout-Bench/_next/static/chunks/3gll1ekbrh320.js\",\"/ICLayout-Bench/_next/static/chunks/3_2wwayut9q0b.js\"],\"default\"]\na:C\n11:T3fcf,\u003ch1 id=\"problem-auxiliary-source-driven-output-control-ota-layout-task\"\u003eAuxiliary Source-Driven Output-Control OTA Layout Task\u003c/h1\u003e\n\u003ch2 id=\"problem-objective\"\u003eObjective\u003c/h2\u003e\n\u003cp\u003eLay out \u003ccode\u003eamp_012_peng_tcfc\u003c/code\u003e with its complete transistor signal and bias paths.\nThe PMOS-input folded stage produces \u003ccode\u003evoutp\u003c/code\u003e, driving the output PMOS and\n\u003ccode\u003enet043\u003c/code\u003e branch. The large PMOS path through \u003ccode\u003enet049\u003c/code\u003e feeds \u003ccode\u003enet10\u003c/code\u003e, while\n\u003ccode\u003enet043\u003c/code\u003e controls its NMOS pulldown. \u003ccode\u003enet10\u003c/code\u003e drives the output NMOS. Preserve\nboth original compensation branches and the added local output-control MIM.\nUnlike a direct \u003ccode\u003enet050/net049\u003c/code\u003e output stage, this circuit includes the\nsource-driven auxiliary PMOS and a separate \u003ccode\u003enet10\u003c/code\u003e control node.\u003c/p\u003e\n\u003ch2 id=\"problem-inputs-and-interface\"\u003eInputs and Interface\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003ematerials/circuit.cdl\u003c/code\u003e: authoritative native physical graph.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ematerials/circuit.spice\u003c/code\u003e: equivalent simulator graph with finite body taps.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ematerials/testbench.spice\u003c/code\u003e: DC, bilateral-loop and sustained-step measurements.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eOrdered ports: \u003ccode\u003evss vdd vinn vinp vout vb1\u003c/code\u003e. VSS/VDD are return/supply;\nVINN/VINP are inverting/noninverting inputs; VOUT is output; \u003ccode\u003evb1\u003c/code\u003e\nconnects to the external bias sink. Input PMOS bodies use the separate\n\u003ccode\u003enet31\u003c/code\u003e source-tied well; other PMOS use VDD and NMOS use the VSS substrate.\nPreserve all 32 MOS groups, 108 physical fingers,\nW/L/m, every body connection and all physical passive devices.\u003c/p\u003e\n\u003cp\u003eMOS dimensions are rounded to the 10 nm physical grid. Parallel regrouping\nwithin each original group preserves its rounded total W and L, with at most\n10 um single-finger width; individual width/multiplicity and diffusion perimeter\nchange. Distributed 2 × 2 um body contacts have at most 20 um pitch.\nAll internal capacitors use \u003ccode\u003ecap_cmim\u003c/code\u003e:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003ec0\u003c/code\u003e: \u003ccode\u003evoutp\u003c/code\u003e (top) to \u003ccode\u003evout\u003c/code\u003e (bottom), 1 parallel 35.325 × 35.325 um MIM units.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ec1\u003c/code\u003e: \u003ccode\u003enet049\u003c/code\u003e (top) to \u003ccode\u003evout\u003c/code\u003e (bottom), 1 parallel 41.2 × 41.2 um MIM units.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eclocal\u003c/code\u003e: \u003ccode\u003enet10\u003c/code\u003e (top) to \u003ccode\u003evout\u003c/code\u003e (bottom), 1 parallel 51.64 × 51.64 um MIM units.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eThe raw 1.29849 uA sink is calibrated to 0.16231125 uA. A real approximately\n4 pF \u003ccode\u003enet10–vout\u003c/code\u003e MIM is added to suppress the internal output-control\noscillation. Both original 1.87196 pF \u003ccode\u003evoutp–vout\u003c/code\u003e and 2.54606 pF\n\u003ccode\u003enet049–vout\u003c/code\u003e branches remain. There is no added output-to-ground capacitor.\nNo ideal servo, diagnostic clamp or hidden damping element is part of this DUT.\u003c/p\u003e\n\u003ch2 id=\"problem-operating-conditions\"\u003eOperating Conditions\u003c/h2\u003e\n\u003cp\u003eUse typical IHP LV MOS/MIM/poly models at 27 C and VDD=1.2 V, with a\n0.162311 uA sink from \u003ccode\u003evb1\u003c/code\u003e to VSS. All combinations of external\n5/10/15 pF load and 0.5/0.7 V DC input must pass. These external loads are\nadditional to every internal capacitor above.\u003c/p\u003e\n\u003cp\u003eA zero-volt source connects VINN (\u003ccode\u003evm\u003c/code\u003e) to VOUT. VINP is AC ground.\nUse series voltage and parallel current injection at that boundary, retaining\nthe complete DUT and loading. With voltage-injection \u003ccode\u003eb=-I(VPROBE)\u003c/code\u003e,\n\u003ccode\u003ed=V(vm)\u003c/code\u003e and current-injection \u003ccode\u003ea=-I(VPROBE)\u003c/code\u003e, \u003ccode\u003ec=V(vm)\u003c/code\u003e, set\n\u003ccode\u003edelta=a*d-b*c\u003c/code\u003e and \u003ccode\u003eT=(2*delta-a+d)/(1-2*delta+a-d)\u003c/code\u003e (Tian Eq. 30).\nBoth raw injections are exported for independent Y-matrix reconstruction.\nSweep 0.01 Hz–10 GHz at 300 points/decade. Continuous phase uses its natural\nlow-frequency branch without an offset correction. Check first and final\ndescending unity crossings, minimum sampled \u003ccode\u003eabs(1+T)\u003c/code\u003e, maximum absolute\ncontinuous phase of \u003ccode\u003e1+T\u003c/code\u003e across the entire sweep, and gain over 2–10 GHz.\nA good first crossover alone cannot establish acceptance.\u003c/p\u003e\n\u003cp\u003eVINP pulses 0.5→0.7→0.5 V with 20 ns edges, rising at 2 us and falling\nat 20.02 us, period 100 us. Transient starts at its own pulse-start operating\npoint, independently of the AC DC-input setting. Simulate 0–40 us with Gear2,\n2 ns maximum step, KLU, \u003ccode\u003eitl4=1000\u003c/code\u003e, \u003ccode\u003ershunt=1e12\u003c/code\u003e, \u003ccode\u003ereltol=1e-5\u003c/code\u003e,\n\u003ccode\u003eabstol=1e-12\u003c/code\u003e, \u003ccode\u003evntol=1e-8\u003c/code\u003e. The numerical shunt is not a physical device.\nQualification also checks half step, tighter tolerances/dense AC, trapezoidal\nintegration, long tails and finite stimulus/load boundaries.\nThese are finite external-loop and observable-recovery requirements, not an\ninternal pole inventory, arbitrary-load stability, PVT, noise, mismatch,\ndistortion, rail-to-rail behavior or supply-startup qualification.\u003c/p\u003e\n\u003cp\u003eFirst and final crossing phase margins must both lie in [0, 180] degrees.\nMinimum return distance and return-phase excursion have only nonnegative\ndomain bounds; high-frequency gain has no acceptance bound. These full-sweep\nmetrics affect continuous quality without adding a stability acceptance screen.\nMissing crossings or invalid observations are evaluator errors.\u003c/p\u003e\n\u003ch2 id=\"problem-physical-requirements\"\u003ePhysical Requirements\u003c/h2\u003e\n\u003cp\u003eSubmit GDSII top cell \u003ccode\u003eamp_012_peng_tcfc\u003c/code\u003e, at most 32 MiB. Native IHP main/maximal DRC\nmust pass without waivers (standalone scope, density/antenna off), together\nwith strict named-interface LVS and a 1400 × 160 um functional envelope.\nAll device/contact/interconnect drawing layers in the runtime \u003ccode\u003eoutline\u003c/code\u003e\nconstraint contribute to area; annotation/pin-purpose layers do not.\nPost-layout simulation uses the submitted GDS's complete Magic RC, with\nphysical MIM devices and interconnect resistances/capacitances. Half-grid\nimport is explicit. Magic retains only Metal3 interface labels in its isolated\nextraction copy to avoid repeated internal well-name aliases, while native LVS\nchecks the original GDS and its explicit tap devices. No resistance/capacitance threshold omits small parasitics.\nMagic idealizes well/substrate taps, whereas source simulation uses finite\nphysical tap models. Distributed substrate resistance/noise and fabrication\nsignoff remain unqualified. The long independent witness is a feasibility\nlayout, not an area optimum.\u003c/p\u003e\n\u003ch2 id=\"problem-electrical-requirements-and-scoring\"\u003eElectrical Requirements and Scoring\u003c/h2\u003e\n\u003cp\u003ePhysical checks and declared functional bounds remain mandatory. Quality has no\nfixed allowed-degradation threshold. Each \u003ccode\u003esource_*\u003c/code\u003e job simulates the declared\nsource circuit with exactly the same testbench, model resources, parameters,\nload and measurement window as its paired extracted-candidate job. A source\nobservation is the 100-point electrical baseline; it is independent of the\nsubmitted GDS. All individual pairs are retained in the evaluation report.\u003c/p\u003e\n\u003cp\u003eFor a post-layout observation x and its source observation b:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eMaximize: q = x/b; minimize: q = b/x. When a numerical scale s is declared,\nuse (x+s)/(b+s) or its inverse. This handles zero-valued error measurements;\ns is a normalization floor, not an allowed degradation or pass threshold.\u003c/li\u003e\n\u003cli\u003eAmplitude dB: q = 10^((x-b)/20) for maximize, its inverse for minimize.\u003c/li\u003e\n\u003cli\u003eTarget: q = 1/(1+abs(x-b)/s), with a declared physical scale s. Signed and\nzero-valued operating points are never divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eScoring uses \u003ccode\u003elayout\u003c/code\u003e. A metric uses its worst paired quality q. The score is\nS = 100 * product(q_i ** w_i), including area quality\nq_area = area_reference / candidate_functional_area. The weights below sum to\none. Dimensions describe measurements but do not determine their weights.\nPhysical or functional rejection scores zero; missing or invalid measurements\nproduce an unknown score, including measurements with zero weight.\nSource-equivalent performance at the area reference scores 100; improvements\ncan exceed 100. A weight expresses a tradeoff, not a hard acceptance limit.\u003c/p\u003e\n\u003cp\u003eMeasurement definitions below use the supplied SPICE node/source names.\n\u003ccode\u003ev(n)\u003c/code\u003e is node voltage and \u003ccode\u003ei(V)\u003c/code\u003e is current into a voltage source; delivered\npower therefore uses a minus sign. \u003ccode\u003edb(z)=20*log10(abs(z))\u003c/code\u003e, \u003ccode\u003emag/abs\u003c/code\u003e\ndenote magnitude, and \u003ccode\u003ecph\u003c/code\u003e is continuous phase in radians. \u003ccode\u003efind\u003c/code\u003e, \u003ccode\u003ewhen\u003c/code\u003e,\n\u003ccode\u003efrom/to\u003c/code\u003e, and \u003ccode\u003erise/fall\u003c/code\u003e retain the deck's interpolation, window and\ncrossing conventions; SPICE suffixes p/n/u/m/meg/g mean pico/nano/micro/\nmilli/mega/giga. Nested \u003ccode\u003eavg\u003c/code\u003e, \u003ccode\u003emin\u003c/code\u003e, \u003ccode\u003emax\u003c/code\u003e, \u003ccode\u003evecmin/vecmax\u003c/code\u003e and \u003ccode\u003ederiv\u003c/code\u003e\nmean the stated window average, extrema and sampled derivative. All\ndeclared conditions are measured separately and paired with the same\nsource condition; a group uses its worst paired quality.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eDefinition / observations\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eQuality rule\u003c/th\u003e\n\u003cth\u003eFunctional bounds\u003c/th\u003e\n\u003cth\u003eScale\u003c/th\u003e\n\u003cth\u003eDimension\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003ev(vout)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.2\u003c/td\u003e\n\u003ctd\u003e1.2\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003eabs(v(vout)-v(vp))\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebias_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003ev(vb1)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.2\u003c/td\u003e\n\u003ctd\u003e1.2\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003e-v(vdd)*i(VDD)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003ctd\u003esupply\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edc_gain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: Value of \u003ccode\u003e(db((T))) at=0.01\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003emaximize / db20\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eunity_hz\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: Crossing coordinate where \u003ccode\u003e(db((T)))=0 fall=1\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eHz\u003c/td\u003e\n\u003ctd\u003emaximize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ephase_margin_deg\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: \u003ccode\u003e180+(find (180*cph((T))/pi) when (db((T)))=0 fall=1)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003edeg\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 180\u003c/td\u003e\n\u003ctd\u003e180\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efinal_unity_hz\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: Crossing coordinate where \u003ccode\u003e(db((T)))=0 fall=last\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eHz\u003c/td\u003e\n\u003ctd\u003emaximize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efinal_phase_margin_deg\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: \u003ccode\u003e180+(find (180*cph((T))/pi) when (db((T)))=0 fall=last)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003edeg\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 180\u003c/td\u003e\n\u003ctd\u003e180\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eminimum_return_distance\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: \u003ccode\u003evecmin((mag(1+(T))))\u003c/code\u003e; sweep \u003ccode\u003edec 300 0.01 10g\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003e1\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1.0\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ereturn_phase_excursion_deg\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: \u003ccode\u003evecmax(abs(180*cph(1+(T))/pi))\u003c/code\u003e; sweep \u003ccode\u003edec 300 0.01 10g\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003edeg\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ehf_gain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: Maximum of \u003ccode\u003e(db((T))) from=2g to=10g\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003eminimize / db20\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003erecovery_up_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Maximum of \u003ccode\u003e(abs(v(vout)-v(vp))) from=15u to=19u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003erecovery_down_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Maximum of \u003ccode\u003e(abs(v(vout)-v(vp))) from=30u to=39u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estep_gain\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTransient: \u003ccode\u003e((avg v(vout) from=18u to=19u)-(avg v(vout) from=38u to=39u))/0.2\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV/V\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e1.0\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emean_power_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Mean of \u003ccode\u003e(-v(vdd)*i(VDD)) from=2u to=40u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003ctd\u003esupply\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epeak_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Maximum of \u003ccode\u003ev(vout) from=2u to=20u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.2\u003c/td\u003e\n\u003ctd\u003e1.2\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003etrough_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Minimum of \u003ccode\u003ev(vout) from=20.04u to=40u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.2\u003c/td\u003e\n\u003ctd\u003e1.2\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eArea reference: \u003cstrong\u003e14710.04 um2\u003c/strong\u003e. 180 expanded device instances; sum of device/contact envelopes 9648.5648 um2, per-side envelope allowance 0.6 um, 50% routing allowance and total outer width/height allowance 1.2 um. Estimate = ceil(100 * (1.5 * envelope_sum + 2 * margin * sqrt(envelope_sum) + margin^2)) / 100. Here margin is the total allowance across two opposite sides; the envelope sum is displayed rounded to four decimals. MOS/passive envelopes use declared W/L (or resistor dimensions) and multiplicity; explicit tap areas and HBT emitter/contact envelopes are included. This is a frozen engineering estimate, not a foundry minimum or a feasibility claim.\u003c/p\u003e\n\u003cp\u003eThe capability coefficient remains \u003cstrong\u003e8\u003c/strong\u003e; it is independent of\nthe reference-relative task score.\u003c/p\u003e\n\u003ch3 id=\"problem-score-weights\"\u003eScore weights\u003c/h3\u003e\n\u003cp\u003eMultiple-crossing feedback amplifiers: loaded recovery 28.6%; loop stability 24.5%; gain and bandwidth 12.3%; step transfer and extrema 8.18%; bias 4.09%; power 12.3%; area 10%. Each objective's weight is divided equally among its metrics.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.095454545449\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003erecovery_down_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.095454545455\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003erecovery_up_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.095454545455\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efinal_phase_margin_deg\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.061363636364\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eminimum_return_distance\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.061363636364\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ephase_margin_deg\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.061363636364\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ereturn_phase_excursion_deg\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.061363636364\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edc_gain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.030681818182\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efinal_unity_hz\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.030681818182\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ehf_gain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.030681818182\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eunity_hz\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.030681818182\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epeak_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.027272727273\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estep_gain\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.027272727273\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003etrough_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.027272727273\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebias_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.020454545455\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.020454545455\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emean_power_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.061363636364\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.061363636364\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch2 id=\"problem-tools-and-submission\"\u003eTools and Submission\u003c/h2\u003e\n\u003cp\u003eSolve budget: \u003cstrong\u003e3 hours\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eDiscover inputs/resources/feedback through \u003ccode\u003e/protocol/task.json\u003c/code\u003e,\n\u003ccode\u003e/protocol/resources.json\u003c/code\u003e and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e. Use supplied IHP\nprimitives with KLayout, Magic and ngspice. Write \u003ccode\u003e/workspace/output/final.gds\u003c/code\u003e\nand explicitly submit through the harness. Host configuration, source records\nand reference answers remain outside solver inputs.\u003c/p\u003e\n12:T24c1,\u003cp\u003ePhysical checks and declared functional bounds remain mandatory. Quality has no\nfixed allowed-degradation threshold. Each \u003ccode\u003esource_*\u003c/code\u003e job simulates the declared\nsource circuit with exactly the same testbench, model resources, parameters,\nload and measurement window as its paired extracted-candidate job. A source\nobservation is the 100-point electrical baseline; it is independent of the\nsubmitted GDS. All individual pairs are retained in the evaluation report.\u003c/p\u003e\n\u003cp\u003eFor a post-layout observation x and its source observation b:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eMaximize: q = x/b; minimize: q = b/x. When a numerical scale s is declared,\nuse (x+s)/(b+s) or its inverse. This handles zero-valued error measurements;\ns is a normalization floor, not an allowed degradation or pass threshold.\u003c/li\u003e\n\u003cli\u003eAmplitude dB: q = 10^((x-b)/20) for maximize, its inverse for minimize.\u003c/li\u003e\n\u003cli\u003eTarget: q = 1/(1+abs(x-b)/s), with a declared physical scale s. Signed and\nzero-valued operating points are never divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eScoring uses \u003ccode\u003elayout\u003c/code\u003e. A metric uses its worst paired quality q. The score is\nS = 100 * product(q_i ** w_i), including area quality\nq_area = area_reference / candidate_functional_area. The weights below sum to\none. Dimensions describe measurements but do not determine their weights.\nPhysical or functional rejection scores zero; missing or invalid measurements\nproduce an unknown score, including measurements with zero weight.\nSource-equivalent performance at the area reference scores 100; improvements\ncan exceed 100. A weight expresses a tradeoff, not a hard acceptance limit.\u003c/p\u003e\n\u003cp\u003eMeasurement definitions below use the supplied SPICE node/source names.\n\u003ccode\u003ev(n)\u003c/code\u003e is node voltage and \u003ccode\u003ei(V)\u003c/code\u003e is current into a voltage source; delivered\npower therefore uses a minus sign. \u003ccode\u003edb(z)=20*log10(abs(z))\u003c/code\u003e, \u003ccode\u003emag/abs\u003c/code\u003e\ndenote magnitude, and \u003ccode\u003ecph\u003c/code\u003e is continuous phase in radians. \u003ccode\u003efind\u003c/code\u003e, \u003ccode\u003ewhen\u003c/code\u003e,\n\u003ccode\u003efrom/to\u003c/code\u003e, and \u003ccode\u003erise/fall\u003c/code\u003e retain the deck's interpolation, window and\ncrossing conventions; SPICE suffixes p/n/u/m/meg/g mean pico/nano/micro/\nmilli/mega/giga. Nested \u003ccode\u003eavg\u003c/code\u003e, \u003ccode\u003emin\u003c/code\u003e, \u003ccode\u003emax\u003c/code\u003e, \u003ccode\u003evecmin/vecmax\u003c/code\u003e and \u003ccode\u003ederiv\u003c/code\u003e\nmean the stated window average, extrema and sampled derivative. All\ndeclared conditions are measured separately and paired with the same\nsource condition; a group uses its worst paired quality.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eDefinition / observations\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eQuality rule\u003c/th\u003e\n\u003cth\u003eFunctional bounds\u003c/th\u003e\n\u003cth\u003eScale\u003c/th\u003e\n\u003cth\u003eDimension\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003ev(vout)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.2\u003c/td\u003e\n\u003ctd\u003e1.2\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003eabs(v(vout)-v(vp))\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebias_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003ev(vb1)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.2\u003c/td\u003e\n\u003ctd\u003e1.2\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003e-v(vdd)*i(VDD)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003ctd\u003esupply\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edc_gain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: Value of \u003ccode\u003e(db((T))) at=0.01\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003emaximize / db20\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eunity_hz\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: Crossing coordinate where \u003ccode\u003e(db((T)))=0 fall=1\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eHz\u003c/td\u003e\n\u003ctd\u003emaximize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ephase_margin_deg\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: \u003ccode\u003e180+(find (180*cph((T))/pi) when (db((T)))=0 fall=1)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003edeg\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 180\u003c/td\u003e\n\u003ctd\u003e180\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efinal_unity_hz\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: Crossing coordinate where \u003ccode\u003e(db((T)))=0 fall=last\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eHz\u003c/td\u003e\n\u003ctd\u003emaximize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efinal_phase_margin_deg\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: \u003ccode\u003e180+(find (180*cph((T))/pi) when (db((T)))=0 fall=last)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003edeg\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 180\u003c/td\u003e\n\u003ctd\u003e180\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eminimum_return_distance\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: \u003ccode\u003evecmin((mag(1+(T))))\u003c/code\u003e; sweep \u003ccode\u003edec 300 0.01 10g\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003e1\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1.0\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ereturn_phase_excursion_deg\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: \u003ccode\u003evecmax(abs(180*cph(1+(T))/pi))\u003c/code\u003e; sweep \u003ccode\u003edec 300 0.01 10g\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003edeg\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ehf_gain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: Maximum of \u003ccode\u003e(db((T))) from=2g to=10g\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003eminimize / db20\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003erecovery_up_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Maximum of \u003ccode\u003e(abs(v(vout)-v(vp))) from=15u to=19u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003erecovery_down_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Maximum of \u003ccode\u003e(abs(v(vout)-v(vp))) from=30u to=39u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estep_gain\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTransient: \u003ccode\u003e((avg v(vout) from=18u to=19u)-(avg v(vout) from=38u to=39u))/0.2\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV/V\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e1.0\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emean_power_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Mean of \u003ccode\u003e(-v(vdd)*i(VDD)) from=2u to=40u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003ctd\u003esupply\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epeak_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Maximum of \u003ccode\u003ev(vout) from=2u to=20u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.2\u003c/td\u003e\n\u003ctd\u003e1.2\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003etrough_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Minimum of \u003ccode\u003ev(vout) from=20.04u to=40u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.2\u003c/td\u003e\n\u003ctd\u003e1.2\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eArea reference: \u003cstrong\u003e14710.04 um2\u003c/strong\u003e. 180 expanded device instances; sum of device/contact envelopes 9648.5648 um2, per-side envelope allowance 0.6 um, 50% routing allowance and total outer width/height allowance 1.2 um. Estimate = ceil(100 * (1.5 * envelope_sum + 2 * margin * sqrt(envelope_sum) + margin^2)) / 100. Here margin is the total allowance across two opposite sides; the envelope sum is displayed rounded to four decimals. MOS/passive envelopes use declared W/L (or resistor dimensions) and multiplicity; explicit tap areas and HBT emitter/contact envelopes are included. This is a frozen engineering estimate, not a foundry minimum or a feasibility claim.\u003c/p\u003e\n\u003cp\u003eThe capability coefficient remains \u003cstrong\u003e8\u003c/strong\u003e; it is independent of\nthe reference-relative task score.\u003c/p\u003e\n\u003ch3\u003eScore weights\u003c/h3\u003e\n\u003cp\u003eMultiple-crossing feedback amplifiers: loaded recovery 28.6%; loop stability 24.5%; gain and bandwidth 12.3%; step transfer and extrema 8.18%; bias 4.09%; power 12.3%; area 10%. Each objective's weight is divided equally among its metrics.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.095454545449\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003erecovery_down_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.095454545455\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003erecovery_up_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.095454545455\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efinal_phase_margin_deg\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.061363636364\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eminimum_return_distance\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.061363636364\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ephase_margin_deg\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.061363636364\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ereturn_phase_excursion_deg\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.061363636364\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edc_gain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.030681818182\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efinal_unity_hz\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.030681818182\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ehf_gain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.030681818182\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eunity_hz\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.030681818182\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epeak_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.027272727273\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estep_gain\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.027272727273\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003etrough_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.027272727273\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebias_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.020454545455\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.020454545455\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emean_power_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.061363636364\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.061363636364\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n13:T918,\u003cp\u003eUse typical IHP LV MOS/MIM/poly models at 27 C and VDD=1.2 V, with a\n0.162311 uA sink from \u003ccode\u003evb1\u003c/code\u003e to VSS. All combinations of external\n5/10/15 pF load and 0.5/0.7 V DC input must pass. These external loads are\nadditional to every internal capacitor above.\u003c/p\u003e\n\u003cp\u003eA zero-volt source connects VINN (\u003ccode\u003evm\u003c/code\u003e) to VOUT. VINP is AC ground.\nUse series voltage and parallel current injection at that boundary, retaining\nthe complete DUT and loading. With voltage-injection \u003ccode\u003eb=-I(VPROBE)\u003c/code\u003e,\n\u003ccode\u003ed=V(vm)\u003c/code\u003e and current-injection \u003ccode\u003ea=-I(VPROBE)\u003c/code\u003e, \u003ccode\u003ec=V(vm)\u003c/code\u003e, set\n\u003ccode\u003edelta=a*d-b*c\u003c/code\u003e and \u003ccode\u003eT=(2*delta-a+d)/(1-2*delta+a-d)\u003c/code\u003e (Tian Eq. 30).\nBoth raw injections are exported for independent Y-matrix reconstruction.\nSweep 0.01 Hz–10 GHz at 300 points/decade. Continuous phase uses its natural\nlow-frequency branch without an offset correction. Check first and final\ndescending unity crossings, minimum sampled \u003ccode\u003eabs(1+T)\u003c/code\u003e, maximum absolute\ncontinuous phase of \u003ccode\u003e1+T\u003c/code\u003e across the entire sweep, and gain over 2–10 GHz.\nA good first crossover alone cannot establish acceptance.\u003c/p\u003e\n\u003cp\u003eVINP pulses 0.5→0.7→0.5 V with 20 ns edges, rising at 2 us and falling\nat 20.02 us, period 100 us. Transient starts at its own pulse-start operating\npoint, independently of the AC DC-input setting. Simulate 0–40 us with Gear2,\n2 ns maximum step, KLU, \u003ccode\u003eitl4=1000\u003c/code\u003e, \u003ccode\u003ershunt=1e12\u003c/code\u003e, \u003ccode\u003ereltol=1e-5\u003c/code\u003e,\n\u003ccode\u003eabstol=1e-12\u003c/code\u003e, \u003ccode\u003evntol=1e-8\u003c/code\u003e. The numerical shunt is not a physical device.\nQualification also checks half step, tighter tolerances/dense AC, trapezoidal\nintegration, long tails and finite stimulus/load boundaries.\nThese are finite external-loop and observable-recovery requirements, not an\ninternal pole inventory, arbitrary-load stability, PVT, noise, mismatch,\ndistortion, rail-to-rail behavior or supply-startup qualification.\u003c/p\u003e\n\u003cp\u003eFirst and final crossing phase margins must both lie in [0, 180] degrees.\nMinimum return distance and return-phase excursion have only nonnegative\ndomain bounds; high-frequency gain has no acceptance bound. These full-sweep\nmetrics affect continuous quality without adding a stability acceptance screen.\nMissing crossings or invalid observations are evaluator errors.\u003c/p\u003e\n14:T437,\u003cp\u003eSubmit GDSII top cell \u003ccode\u003eamp_012_peng_tcfc\u003c/code\u003e, at most 32 MiB. Native IHP main/maximal DRC\nmust pass without waivers (standalone scope, density/antenna off), together\nwith strict named-interface LVS and a 1400 × 160 um functional envelope.\nAll device/contact/interconnect drawing layers in the runtime \u003ccode\u003eoutline\u003c/code\u003e\nconstraint contribute to area; annotation/pin-purpose layers do not.\nPost-layout simulation uses the submitted GDS's complete Magic RC, with\nphysical MIM devices and interconnect resistances/capacitances. Half-grid\nimport is explicit. Magic retains only Metal3 interface labels in its isolated\nextraction copy to avoid repeated internal well-name aliases, while native LVS\nchecks the original GDS and its explicit tap devices. No resistance/capacitance threshold omits small parasitics.\nMagic idealizes well/substrate taps, whereas source simulation uses finite\nphysical tap models. Distributed substrate resistance/noise and fabrication\nsignoff remain unqualified. The long independent witness is a feasibility\nlayout, not an area optimum.\u003c/p\u003e\n6:[\"$\",\"$8\",null,{\"fallback\":[\"$\",\"p\",null,{\"children\":\"Loading published evidence…\"}],\"children\":[\"$\",\"$L10\",null,{\"task\":{\"case_path\":\"tasks/ihp-sg13g2/analog-db/cases/amp_012_peng_tcfc/case.toml\",\"coefficient\":8,\"collection\":\"analog-db\",\"configuration_url\":\"/ICLayout-Bench/assets/207646009d3117d253c8f92935ff90e4e7fe6c555f6729a251f59252b9cf5237.txt\",\"description_html\":\"$11\",\"description_path\":\"tasks/ihp-sg13g2/analog-db/cases/amp_012_peng_tcfc/problem.md\",\"hours\":3,\"id\":\"ihp-sg13g2.analog-db.amp_012_peng_tcfc\",\"inputs\":{\"description\":{\"format\":\"text\",\"path\":\"problem.md\",\"sha256\":\"d
