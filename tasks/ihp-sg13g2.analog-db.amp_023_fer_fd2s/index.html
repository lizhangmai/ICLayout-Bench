efined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L5\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[\"$L6\",[[\"$\",\"script\",\"script-0\",{\"src\":\"/ICLayout-Bench/_next/static/chunks/27jip_2vcvnd5.js\",\"async\":true,\"nonce\":\"$undefined\"}]],[\"$\",\"$L7\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.MetadataOutlet\",\"children\":\"$@9\"}]}]]}],{},null,false,null]},null,false,\"$a\"]},null,false,null],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Lb\",null,{\"children\":\"$Lc\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Ld\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.Metadata\",\"children\":\"$Le\"}]}]}],null]}],false]],\"m\":\"$undefined\",\"G\":[\"$f\",[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/ICLayout-Bench/_next/static/chunks/3sa54_ghi1h2h.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]]],\"S\":true,\"h\":null,\"r\":\"$undefined\",\"s\":\"$undefined\",\"a\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"2hqB741EA4j7xWQVg6hu-\"}\n10:I[1186,[\"/ICLayout-Bench/_next/static/chunks/2h60meymns2z5.js\",\"/ICLayout-Bench/_next/static/chunks/27jip_2vcvnd5.js\"],\"default\"]\na:C\n11:T5e03,\u003ch1 id=\"problem-two-stage-fully-differential-ota-with-rc-common-mode-feedback-layout-task\"\u003eTwo-Stage Fully Differential OTA with RC Common-Mode Feedback Layout Task\u003c/h1\u003e\n\u003ch2 id=\"problem-objective\"\u003eObjective\u003c/h2\u003e\n\u003cp\u003eImplement \u003ccode\u003eamp_023_fer_fd2s\u003c/code\u003e: an NMOS-input folded first stage, two NMOS\ncommon-source output stages, dual series R/C compensation and transistor\ncommon-mode feedback sensing both outputs through physical R/C arms. Preserve\nall device groups and validate both differential and common-mode behavior in\nthe specified unity differential feedback connection.\u003c/p\u003e\n\u003ch3 id=\"problem-optimization-objective\"\u003eOptimization objective\u003c/h3\u003e\n\u003cp\u003eMaximize the declared quality score within the solve budget while satisfying all physical and necessary functional requirements. The first passing DRC, LVS and required electrical checks establish a feasible baseline. Continue improving the scored metrics from that baseline; a passing check or \u003ccode\u003etask_success = true\u003c/code\u003e does not mean that the quality objectives have been achieved.\u003c/p\u003e\n\u003ch2 id=\"problem-inputs-and-interface\"\u003eInputs and Interface\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003ematerials/circuit.cdl\u003c/code\u003e: authoritative physical circuit for native LVS.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ematerials/circuit.spice\u003c/code\u003e: equivalent process-model simulator representation.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ematerials/testbench.spice\u003c/code\u003e: nominal-temperature stimuli, differential feedback and measurements.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ematerials/performance_85c.spice\u003c/code\u003e: the same testbench at 85 °C for the selected temperature-stress subset.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eOrdered ports are \u003ccode\u003evinp vinn voutp voutn vdd vss ibias vcmr\u003c/code\u003e.\nVINP/VINN are differential inputs; VOUTP/VOUTN are differential outputs;\nVDD/VSS are supply/return; IBIAS receives 20 uA from VDD; VCMR receives the\ncommon-mode reference relative to VSS. The bias mirrors and common-mode\ncontroller stay in the DUT. Do not replace the internal controller with an\nideal servo or omit physical passive devices.\u003c/p\u003e\n\u003cp\u003eRetain all 28 MOS groups' fixed W/L/m (50 individual transistors), models and\nconnectivity. Equivalent parallel fingering/native merging is allowed if all\nchecks pass. NMOS and resistor bodies connect through the explicit substrate\ntap to VSS; PMOS bodies connect through the well tap to VDD. Keep supplies,\nbody connections and ordered ports faithful to the circuit.\u003c/p\u003e\n\u003cp\u003eEach output compensation path has a W=1 um, L=0.96 um \u003ccode\u003erhigh\u003c/code\u003e (nominally\n1.52 kohm at 27 C) between \u003ccode\u003eo1a\u003c/code\u003e/\u003ccode\u003eo1b\u003c/code\u003e and \u003ccode\u003eza\u003c/code\u003e/\u003ccode\u003ezb\u003c/code\u003e, followed by two parallel\n25.85 × 25.85 um \u003ccode\u003ecap_cmim\u003c/code\u003e units to the corresponding output (2.01294 pF).\nEach output-to-\u003ccode\u003evsen\u003c/code\u003e sensing arm contains eight series W=1 um, L=18 um\n\u003ccode\u003erhigh\u003c/code\u003e segments (nominally 205.28 kohm total), in parallel with a\n9.95 × 9.95 um MIM (150.096 fF). Resistors use m=1, b=0. These internal\ndevices are separate from external output loads; they must be physically\nimplemented with the same terminal mapping. Internal nodes are not bias ports.\u003c/p\u003e\n\u003ch2 id=\"problem-operating-conditions\"\u003eOperating Conditions\u003c/h2\u003e\n\u003cp\u003eUse typical MOS, capacitor and resistor models, 27 C, 1.2 V supply, 20 uA\nfrom VDD to IBIAS, and input common mode 0.5 V. Each output has an external\n1, 5 or 10 pF load. For each load, evaluate paired positive and negative\nstimuli: \u003ccode\u003estep_v\u003c/code\u003e is +0.1 or −0.1 V and \u003ccode\u003ekick_a\u003c/code\u003e is respectively +100 or\n−100 uA. All six conditions must pass.\u003c/p\u003e\n\u003cp\u003eDefine \u003ccode\u003ed=VOUTP−VOUTN\u003c/code\u003e and \u003ccode\u003ec=(VOUTP+VOUTN)/2\u003c/code\u003e. The external differential\nfeedback apparatus drives \u003ccode\u003eVINP=0.5+(VSIG−d)/2\u003c/code\u003e and\n\u003ccode\u003eVINN=0.5−(VSIG−d)/2\u003c/code\u003e, through zero-volt series probes. It holds input\ncommon mode and closes differential unity feedback. It does not force output\ncommon mode: the actual DUT controller, its two R/C sense arms and actual\noutput stages close that loop.\u003c/p\u003e\n\u003cp\u003eAt DC, VSIG=0 and VCMR=0.75 V. Differential AC uses opposite +0.5/−0.5 V\nseries probe excitations and sweeps 1 Hz–1 GHz at 150 points/decade. Measure\n\u003ccode\u003eA=d/(VINP−VINN)\u003c/code\u003e; its sign is retained. Low-frequency gain is dB magnitude\nat 1 Hz; unity frequency is the first falling 0 dB crossing; phase margin is\n180 degrees plus continuous phase there, without subtracting an arbitrary\nphase offset. A missing crossing is an error. This voltage-injection return\nratio is scoped to the high-impedance input and declared unity feedback.\u003c/p\u003e\n\u003cp\u003eCommon-mode AC sets both series probe AC magnitudes to zero and VCMR AC=1 V,\nkeeping differential feedback closed. Sweep 1 Hz–1 GHz at 100 points/decade.\nMeasure \u003ccode\u003eabs(c/VCMR)\u003c/code\u003e at 1 Hz and its maximum over the complete sweep.\nThis is closed-loop common-mode tracking/peaking, not an internal common-mode\nloop phase-margin measurement.\u003c/p\u003e\n\u003cp\u003eThe transient sequence runs 0–8 us using Gear order 2 with maximum step 1 ns.\nUse \u003ccode\u003ershunt=1e12\u003c/code\u003e, \u003ccode\u003ereltol=1e-5\u003c/code\u003e, \u003ccode\u003eabstol=1e-13\u003c/code\u003e, \u003ccode\u003evntol=1e-8\u003c/code\u003e.\nVSIG rises from zero to \u003ccode\u003estep_v\u003c/code\u003e during 1–1.005 us, holds for 4 us, and\nreturns during 5.005–5.010 us. VCMR rises 0.75→0.8 V during 3–3.005 us,\nholds for 1 us, and returns during 4.005–4.010 us. Thus reference tracking\nis tested while a nonzero differential output is present. Equal current\nsources inject \u003ccode\u003ekick_a\u003c/code\u003e into both outputs during a 6–6.060 us pulse:\n5 ns rise, 50 ns hold and 5 ns fall. Negative \u003ccode\u003ekick_a\u003c/code\u003e withdraws current.\nThe pulse periods are 20 us; only this finite 8 us sequence is measured.\nNo startup initialization is imposed; transient starts from the solved DC point.\u003c/p\u003e\n\u003cp\u003eA selected phase-margin and CMFB subset repeats at 85 °C with the same TT device models, supply, references, loads and step/kick conditions. This checks temperature sensitivity only; no process-corner, mismatch or yield result is claimed.\u003c/p\u003e\n\u003ch2 id=\"problem-physical-requirements\"\u003ePhysical Requirements\u003c/h2\u003e\n\u003cp\u003eSubmit GDSII top cell \u003ccode\u003eamp_023_fer_fd2s\u003c/code\u003e, at most 10 MiB. Pass native IHP\nmain/maximal DRC without waivers (standalone scope, density/antenna disabled),\nstrict named-port LVS with physical taps, and a 1200 × 400 um functional\noutline. Include all device, contact and routing drawing layers enumerated by\nthe runtime outline constraint. Pin-purpose and annotation layers do not\ncontribute to bounding-box area and cannot conceal functional geometry.\u003c/p\u003e\n\u003cp\u003ePost-layout measurements must consume the candidate-derived Magic RC netlist,\nincluding physical passives, transistor junction geometry and interconnect.\nThe extraction configuration subdivides Magic's initial grid by two before\nGDS import and imports its isolated copy with \u003ccode\u003egds_readonly=false\u003c/code\u003e; the submitted\nGDS remains immutable. No extraction error is waived. Device parameters,\ngeometry and port connectivity must survive extraction. Magic idealizes\nwell/substrate taps; source simulation retains their finite process models.\nDistributed substrate resistance/noise and fabrication signoff are outside scope.\u003c/p\u003e\n\u003ch2 id=\"problem-electrical-requirements-and-scoring\"\u003eElectrical Requirements and Scoring\u003c/h2\u003e\n\u003cp\u003eArtifact, geometry, DRC, LVS and declared functional requirements must pass. Parasitic extraction is also mandatory: it must produce a complete, electrically consistent netlist usable by the required post-layout simulations. A completed candidate rejection scores zero; infrastructure errors do not establish candidate failure.\u003c/p\u003e\n\u003cp\u003eFor \u003ccode\u003elayout\u003c/code\u003e scoring, cap every positively weighted raw quality at 1 before aggregation; the score ranges from 0 to 100. Reaching every weighted target scores 100, and no minimum score is required for validity.\u003c/p\u003e\n\u003cp\u003ePhysical checks and the declared functional bounds must pass. Quality scoring imposes no fixed degradation allowance. Each \u003ccode\u003esource_*\u003c/code\u003e job and its corresponding candidate extracted circuit use exactly the same testbench, model resources, parameters, loads and measurement windows. Independent source observations remain required evidence. The explicit quality targets below supply scoring anchors; otherwise the paired source value is used. Reports retain every paired result.\u003c/p\u003e\n\u003cp\u003eLet x be the post-layout measurement and b the declared quality target, or the same-condition source measurement when no target is declared:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eRatio normalization: maximize with q = x/b and minimize with q = b/x. When a numerical scale s is declared, use (x+s)/(b+s) and its reciprocal, respectively. The scale handles zero values as a normalization floor; it is neither an allowed degradation nor an acceptance bound.\u003c/li\u003e\n\u003cli\u003eAmplitude in dB: maximize with q = 10^((x-b)/20) and minimize with its reciprocal.\u003c/li\u003e\n\u003cli\u003eTarget normalization: q = 1/(1+abs(x-b)/s), where s is the declared physical scale. Signed or zero-valued operating points are not divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eUse \u003ccode\u003elayout\u003c/code\u003e scoring. First compute each metric's raw quality q from the worst paired condition, with raw area quality q_area = area_target / candidate_functional_area. Credit c_i = min(1, q_i) for every positively weighted metric, then compute S = 100 * product(c_i ** w_i). The weights sum to 1 and the score is bounded by 100. An improvement beyond one target cannot compensate for missing another target. Physical, extraction, or functional rejection scores zero; other missing or invalid measurements leave the score unknown, and zero-weight observations must also be valid. Reaching every positively weighted target scores 100; a feasible reference may score far below 100. Weights express quality tradeoffs, not acceptance bounds.\u003c/p\u003e\n\u003cp\u003eStatic common-mode accuracy is measured diagnostically, using three independently solved\nDC equilibria for each load/polarity condition. Dynamic common-mode recovery is\nmeasured relative to the corresponding circuit equilibrium, not the ideal\nreference, so a fixed offset cannot earn repeated recovery rewards. The return\nwindow ends at 4.95 us, before the differential input returns. The 100 uV scale\nfor static common-mode error, recovery and coupling equals 0.2% of the 50 mV\nreference step; it declares useful accuracy, not a pass/fail tolerance or a\nclaim of process robustness. The original typical-model, 27 C, 1.2 V scope remains.\u003c/p\u003e\n\u003cp\u003eThe measurements below use the supplied SPICE node and source names. \u003ccode\u003ev(n)\u003c/code\u003e is a node voltage; \u003ccode\u003ei(V)\u003c/code\u003e is current flowing into a voltage source, so delivered power uses a negative sign. \u003ccode\u003edb(z)=20*log10(abs(z))\u003c/code\u003e; \u003ccode\u003emag/abs\u003c/code\u003e denote magnitude, and \u003ccode\u003ecph\u003c/code\u003e denotes continuous phase in radians. \u003ccode\u003efind\u003c/code\u003e, \u003ccode\u003ewhen\u003c/code\u003e, \u003ccode\u003efrom/to\u003c/code\u003e and \u003ccode\u003erise/fall\u003c/code\u003e follow the deck's interpolation, window and crossing conventions. SPICE suffixes p/n/u/m/meg/g mean pico/nano/micro/milli/mega/giga. Nested \u003ccode\u003eavg\u003c/code\u003e, \u003ccode\u003emin\u003c/code\u003e, \u003ccode\u003emax\u003c/code\u003e, \u003ccode\u003evecmin/vecmax\u003c/code\u003e and \u003ccode\u003ederiv\u003c/code\u003e represent window averages, extrema and sampled derivatives. Measure each operating condition independently, pair it with the source result under that condition, and take the worst paired quality within each metric group.\u003c/p\u003e\n\u003cp\u003eFor metrics declaring \u003ccode\u003esaturating_ratio\u003c/code\u003e, q = 2(b+s)/(b+x+2*s), using the quality anchor b and the positive scale s in the metric’s units. Equality to the anchor gives raw quality 1; improvements approach raw quality 2 but credited quality stays at 1. Normalize each condition before selecting the worst quality. These scales and targets do not add acceptance cutoffs.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eDefinition / observation\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eQuality normalization\u003c/th\u003e\n\u003cth\u003eFunctional range\u003c/th\u003e\n\u003cth\u003eScale\u003c/th\u003e\n\u003cth\u003eDimension\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ecm_static_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC: Maximum absolute common-mode reference error across (VSIG, VCMR) = (0, 0.75 V), (step_v, 0.75 V), (step_v, 0.8 V).\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e0.005\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_cm_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003e(v(outp)+v(outn))/2\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.2\u003c/td\u003e\n\u003ctd\u003e1.2\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_dm_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003ev(outp)-v(outn)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e1.2\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebias_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003ev(ibias)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.2\u003c/td\u003e\n\u003ctd\u003e1.2\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003e-v(vdd)*i(VDD)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003ctd\u003esupply\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edm_gain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: Value of \u003ccode\u003e(db(((v(outp)-v(outn))/(v(inp)-v(inn))))) at=1\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003emaximize / db20\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eunity_hz\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: Crossing coordinate where \u003ccode\u003e(db(((v(outp)-v(outn))/(v(inp)-v(inn)))))=0 fall=1\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eHz\u003c/td\u003e\n\u003ctd\u003emaximize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ephase_margin_deg\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: \u003ccode\u003e180+(find (180*cph(((v(outp)-v(outn))/(v(inp)-v(inn))))/pi) when (db(((v(outp)-v(outn))/(v(inp)-v(inn)))))=0 fall=1)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003edeg\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 180\u003c/td\u003e\n\u003ctd\u003e10\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ecm_gain_vv\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: Value of \u003ccode\u003e(mag(((v(outp)+v(outn))/2))) at=1\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV/V\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e1\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ecm_peak_vv\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: Maximum of \u003ccode\u003e(mag(((v(outp)+v(outn))/2)))\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV/V\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e1\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edm_up_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Maximum of \u003ccode\u003e(abs((v(outp)-v(outn))-v(sig))) from=1.5u to=1.95u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-05\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edm_down_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Maximum of \u003ccode\u003e(abs((v(outp)-v(outn))-v(sig))) from=5.5u to=5.95u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-05\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ecm_up_recovery_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: max abs(c-c_high), 3.5–3.95 us; c_high is the independent DC output at (step_v, 0.8 V).\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e0.0001\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ecm_down_recovery_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: max abs(c-c_low), 4.5–4.95 us; c_low is the independent DC output at (step_v, 0.75 V).\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e0.0001\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ecm_kick_recovery_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: max abs(c-c_idle), 6.5–7.9 us; c_idle is the independent DC output at (0, 0.75 V).\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e0.0001\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ecm_kick_peak_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: max abs(c-c_idle), 6–6.5 us.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … 1.2\u003c/td\u003e\n\u003ctd\u003e0.005\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edm_peak_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Maximum of \u003ccode\u003e(abs((v(outp)-v(outn)))) from=1u to=5u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.2\u003c/td\u003e\n\u003ctd\u003e1.2\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emean_power_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Mean of \u003ccode\u003e(-v(vdd)*i(VDD)) from=0 to=8u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003ctd\u003esupply\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edm_cm_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Maximum of \u003ccode\u003e(abs((v(outp)-v(outn))-v(sig))) from=3.5u to=3.95u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ecm_dm_coupling_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: max abs(c-c_idle), 1.5–1.95 us; retains differential-to-common-mode coupling but removes the initial static reference offset.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-07\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edm_high_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Mean of \u003ccode\u003e(v(outp)-v(outn)) from=1.8u to=1.95u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eunscored diagnostic\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ecm_high_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Mean of \u003ccode\u003e((v(outp)+v(outn))/2) from=3.8u to=3.95u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eunscored diagnostic\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eThe capability coefficient is \u003cstrong\u003e9\u003c/strong\u003e, independent of this task's reference-normalized score.\u003c/p\u003e\n\u003ch3 id=\"problem-quality-targets-and-weights\"\u003eQuality targets and weights\u003c/h3\u003e\n\u003cp\u003eThe area quality target is \u003cstrong\u003e4000 um2\u003c/strong\u003e. It is an integration budget, not a hard limit or a proven process minimum.\u003c/p\u003e\n\u003cp\u003eThe fixed MIM plates occupy 2870.895 um2; the 4000 um2 integration budget leaves 1129.105 um2 for the amplifier, taps, enclosure and routing. Common-mode kick peak carries 40%, unity-gain bandwidth 20%, area 20%, phase-margin preservation 10% and common-mode-to-differential coupling 10%. The existing 50 mV kick and 1 uV coupling goals remain. Differential late errors, static common-mode offset and mean power become diagnostics; all nominal/hot conditions and functional requirements remain enforced.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eQuality anchor\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eScale\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e4000\u003c/td\u003e\n\u003ctd\u003eum2\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.2\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edm_down_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e0.0001\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e1e-05\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edm_up_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e0.0001\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e1e-05\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ecm_kick_peak_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e0.05\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e0.005\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.4\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ecm_dm_coupling_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e1e-07\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ephase_margin_deg\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003epaired source\u003c/td\u003e\n\u003ctd\u003edeg\u003c/td\u003e\n\u003ctd\u003e10\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eunity_hz\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003epaired source\u003c/td\u003e\n\u003ctd\u003eHz\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.2\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emean_power_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003epaired source\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ecm_static_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e0.05\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e0.005\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eZero-weight observations: \u003ccode\u003edm_down_error_v\u003c/code\u003e, \u003ccode\u003edm_peak_v\u003c/code\u003e, \u003ccode\u003edm_up_error_v\u003c/code\u003e, \u003ccode\u003ecm_down_recovery_v\u003c/code\u003e, \u003ccode\u003ecm_kick_recovery_v\u003c/code\u003e, \u003ccode\u003ecm_up_recovery_v\u003c/code\u003e, \u003ccode\u003edm_cm_error_v\u003c/code\u003e, \u003ccode\u003ecm_gain_vv\u003c/code\u003e, \u003ccode\u003ecm_peak_vv\u003c/code\u003e, \u003ccode\u003edm_gain_db\u003c/code\u003e, \u003ccode\u003ebias_v\u003c/code\u003e, \u003ccode\u003eoutput_cm_v\u003c/code\u003e, \u003ccode\u003eoutput_dm_v\u003c/code\u003e, \u003ccode\u003emean_power_w\u003c/code\u003e, \u003ccode\u003epower_w\u003c/code\u003e, \u003ccode\u003ecm_static_error_v\u003c/code\u003e. Every original functional requirement and measurement remains enforced.\u003c/p\u003e\n\u003cp\u003eThe targets affect continuous quality only. A complete feasible reference may miss them; there is no minimum qualifying score.\u003c/p\u003e\n\u003ch2 id=\"problem-tools-and-submission\"\u003eTools and Submission\u003c/h2\u003e\n\u003cp\u003eSoft solve budget: \u003cstrong\u003e1.5 hours\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eDiscover task inputs, frozen requirements, reviewed resources and harness\nfeedback through \u003ccode\u003e/protocol/task.json\u003c/code\u003e, the \u003ccode\u003eresources\u003c/code\u003e field of \u003ccode\u003e/protocol/task.json\u003c/code\u003e and\n\u003ccode\u003e/protocol/harness.json\u003c/code\u003e. Use the supplied IHP primitives and KLayout, Magic\nand ngspice. Write \u003ccode\u003e/workspace/output/final.gds\u003c/code\u003e and explicitly submit using\nthe harness protocol. Reference GDS, source records and host configuration\nremain outside standard solver inputs.\u003c/p\u003e\n\u003ch3 id=\"problem-solve-workflow\"\u003eSolve workflow\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eRead the declared circuit and materials, \u003ccode\u003e/protocol/task.json\u003c/code\u003e for paths, constraints and reviewed resources, and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e for capabilities and helper commands. Task inputs under \u003ccode\u003e/task\u003c/code\u003e and resources under \u003ccode\u003e/resources\u003c/code\u003e are read-only; construct the layout in \u003ccode\u003e/workspace\u003c/code\u003e with the declared tools. With layout MCP, paths and commands refer to the remote EDA workspace. Create your own implementation with real devices, interconnect and pins, using your own tool loop without delegating to other agents; reference layouts and author code are not solver inputs.\u003c/li\u003e\n\u003cli\u003eInspect \u003ccode\u003eresources.external\u003c/code\u003e before using external tools. Each command starts a fresh shell: when tool modules are declared, source \u003ccode\u003e/usr/share/Modules/init/bash\u003c/code\u003e and load the selected tool's modules; export its declared \u003ccode\u003etool_environment\u003c/code\u003e settings in that same command. Repeat as needed and use batch or headless operation. Local manuals, command references, and release notes may be available within the declared EDA installation and PDK resource directories. Locate these resources through \u003ccode\u003e/protocol/task.json\u003c/code\u003e and consult the documentation for the installed tool version when diagnosing unfamiliar syntax or tool failures.\u003c/li\u003e\n\u003cli\u003eGenerate an initial candidate and submit a snapshot early. When \u003ccode\u003eprocess-feedback\u003c/code\u003e is available, check the current GDS with layout MCP \u003ccode\u003echeck\u003c/code\u003e or \u003ccode\u003epython -I /protocol/process_check.py\u003c/code\u003e before the final submission. This runs the final evaluator's complete plan and returns engineering diagnostics and candidate measurements, without scores or normalized quality factors. Checks have no count limit and consume the same wall-clock budget. Inspect the physical and functional results and all scored metrics; successful tool execution alone does not establish requirement satisfaction. Read paginated diagnostics with \u003ccode\u003ereport\u003c/code\u003e when using MCP. Local exploratory checks do not replace this complete check.\u003c/li\u003e\n\u003cli\u003eUse the remaining time for measured improvements to the declared quality objectives. Identify the limiting scored metrics, make targeted layout changes, regenerate and check the candidate, and compare measurements with the previous candidate and the stated scoring targets and trade-offs. Preserve the best valid candidate and revert changes that worsen the overall objective. Repeat while time and useful improvements remain; passing validity checks alone is not a stopping condition.\u003c/li\u003e\n\u003cli\u003eStop optimization when the budget expires, all declared quality objectives are achieved, or measured trials support convergence. If stopping early, explain the changes tried, the metric comparisons and the remaining limitations. Track remaining time through session status. At soft-budget expiry, finish or cancel already-started work and submit immediately; do not start another command, check or optimization round. If an MCP execution is running, use \u003ccode\u003epoll\u003c/code\u003e with its \u003ccode\u003eexecution_id\u003c/code\u003e and the returned \u003ccode\u003enext_offset\u003c/code\u003e as \u003ccode\u003eoffset\u003c/code\u003e until completion, or cancel it and wait for it to stop.\u003c/li\u003e\n\u003cli\u003eFinish or cancel outstanding work, restore your best candidate to the declared output path, and explicitly submit it before ending the session. With layout MCP \u003ccode\u003esubmit\u003c/code\u003e, remove the \u003ccode\u003e/workspace/\u003c/code\u003e prefix from \u003ccode\u003eoutput.path\u003c/code\u003e; with the container interface, run \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e. Wait for the receipt: only the last accepted snapshot is judged, and writing a file alone is not submission. Acceptance confirms delivery; the framework independently evaluates validity and quality after the session.\u003c/li\u003e\n\u003c/ol\u003e\n12:T308f,\u003cp\u003eArtifact, geometry, DRC, LVS and declared functional requirements must pass. Parasitic extraction is also mandatory: it must produce a complete, electrically consistent netlist usable by the required post-layout simulations. A completed candidate rejection scores zero; infrastructure errors do not establish candidate failure.\u003c/p\u003e\n\u003cp\u003eFor \u003ccode\u003elayout\u003c/code\u003e scoring, cap every positively weighted raw quality at 1 before aggregation; the score ranges from 0 to 100. Reaching every weighted target scores 100, and no minimum score is required for validity.\u003c/p\u003e\n\u003cp\u003ePhysical checks and the declared functional bounds must pass. Quality scoring imposes no fixed degradation allowance. Each \u003ccode\u003esource_*\u003c/code\u003e job and its corresponding candidate extracted circuit use exactly the same testbench, model resources, parameters, loads and measurement windows. Independent source observations remain required evidence. The explicit quality targets below supply scoring anchors; otherwise the paired source value is used. Reports retain every paired result.\u003c/p\u003e\n\u003cp\u003eLet x be the post-layout measurement and b the declared quality target, or the same-condition source measurement when no target is declared:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eRatio normalization: maximize with q = x/b and minimize with q = b/x. When a numerical scale s is declared, use (x+s)/(b+s) and its reciprocal, respectively. The scale handles zero values as a normalization floor; it is neither an allowed degradation nor an acceptance bound.\u003c/li\u003e\n\u003cli\u003eAmplitude in dB: maximize with q = 10^((x-b)/20) and minimize with its reciprocal.\u003c/li\u003e\n\u003cli\u003eTarget normalization: q = 1/(1+abs(x-b)/s), where s is the declared physical scale. Signed or zero-valued operating points are not divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eUse \u003ccode\u003elayout\u003c/code\u003e scoring. First compute each metric's raw quality q from the worst paired condition, with raw area quality q_area = area_target / candidate_functional_area. Credit c_i = min(1, q_i) for every positively weighted metric, then compute S = 100 * product(c_i ** w_i). The weights sum to 1 and the score is bounded by 100. An improvement beyond one target cannot compensate for missing another target. Physical, extraction, or functional rejection scores zero; other missing or invalid measurements leave the score unknown, and zero-weight observations must also be valid. Reaching every positively weighted target scores 100; a feasible reference may score far below 100. Weights express quality tradeoffs, not acceptance bounds.\u003c/p\u003e\n\u003cp\u003eStatic common-mode accuracy is measured diagnostically, using three independently solved\nDC equilibria for each load/polarity condition. Dynamic common-mode recovery is\nmeasured relative to the corresponding circuit equilibrium, not the ideal\nreference, so a fixed offset cannot earn repeated recovery rewards. The return\nwindow ends at 4.95 us, before the differential input returns. The 100 uV scale\nfor static common-mode error, recovery and coupling equals 0.2% of the 50 mV\nreference step; it declares useful accuracy, not a pass/fail tolerance or a\nclaim of process robustness. The original typical-model, 27 C, 1.2 V scope remains.\u003c/p\u003e\n\u003cp\u003eThe measurements below use the supplied SPICE node and source names. \u003ccode\u003ev(n)\u003c/code\u003e is a node voltage; \u003ccode\u003ei(V)\u003c/code\u003e is current flowing into a voltage source, so delivered power uses a negative sign. \u003ccode\u003edb(z)=20*log10(abs(z))\u003c/code\u003e; \u003ccode\u003emag/abs\u003c/code\u003e denote magnitude, and \u003ccode\u003ecph\u003c/code\u003e denotes continuous phase in radians. \u003ccode\u003efind\u003c/code\u003e, \u003ccode\u003ewhen\u003c/code\u003e, \u003ccode\u003efrom/to\u003c/code\u003e and \u003ccode\u003erise/fall\u003c/code\u003e follow the deck's interpolation, window and crossing conventions. SPICE suffixes p/n/u/m/meg/g mean pico/nano/micro/milli/mega/giga. Nested \u003ccode\u003eavg\u003c/code\u003e, \u003ccode\u003emin\u003c/code\u003e, \u003ccode\u003emax\u003c/code\u003e, \u003ccode\u003evecmin/vecmax\u003c/code\u003e and \u003ccode\u003ederiv\u003c/code\u003e represent window averages, extrema and sampled derivatives. Measure each operating condition independently, pair it with the source result under that condition, and take the worst paired quality within each metric group.\u003c/p\u003e\n\u003cp\u003eFor metrics declaring \u003ccode\u003esaturating_ratio\u003c/code\u003e, q = 2(b+s)/(b+x+2*s), using the quality anchor b and the positive scale s in the metric’s units. Equality to the anchor gives raw quality 1; improvements approach raw quality 2 but credited quality stays at 1. Normalize each condition before selecting the worst quality. These scales and targets do not add acceptance cutoffs.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eDefinition / observation\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eQuality normalization\u003c/th\u003e\n\u003cth\u003eFunctional range\u003c/th\u003e\n\u003cth\u003eScale\u003c/th\u003e\n\u003cth\u003eDimension\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ecm_static_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC: Maximum absolute common-mode reference error across (VSIG, VCMR) = (0, 0.75 V), (step_v, 0.75 V), (step_v, 0.8 V).\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e0.005\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_cm_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003e(v(outp)+v(outn))/2\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.2\u003c/td\u003e\n\u003ctd\u003e1.2\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_dm_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003ev(outp)-v(outn)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e1.2\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebias_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003ev(ibias)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.2\u003c/td\u003e\n\u003ctd\u003e1.2\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003e-v(vdd)*i(VDD)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003ctd\u003esupply\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edm_gain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: Value of \u003ccode\u003e(db(((v(outp)-v(outn))/(v(inp)-v(inn))))) at=1\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003emaximize / db20\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eunity_hz\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: Crossing coordinate where \u003ccode\u003e(db(((v(outp)-v(outn))/(v(inp)-v(inn)))))=0 fall=1\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eHz\u003c/td\u003e\n\u003ctd\u003emaximize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ephase_margin_deg\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: \u003ccode\u003e180+(find (180*cph(((v(outp)-v(outn))/(v(inp)-v(inn))))/pi) when (db(((v(outp)-v(outn))/(v(inp)-v(inn)))))=0 fall=1)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003edeg\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 180\u003c/td\u003e\n\u003ctd\u003e10\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ecm_gain_vv\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: Value of \u003ccode\u003e(mag(((v(outp)+v(outn))/2))) at=1\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV/V\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e1\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ecm_peak_vv\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: Maximum of \u003ccode\u003e(mag(((v(outp)+v(outn))/2)))\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV/V\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e1\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edm_up_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Maximum of \u003ccode\u003e(abs((v(outp)-v(outn))-v(sig))) from=1.5u to=1.95u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-05\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edm_down_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Maximum of \u003ccode\u003e(abs((v(outp)-v(outn))-v(sig))) from=5.5u to=5.95u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-05\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ecm_up_recovery_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: max abs(c-c_high), 3.5–3.95 us; c_high is the independent DC output at (step_v, 0.8 V).\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e0.0001\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ecm_down_recovery_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: max abs(c-c_low), 4.5–4.95 us; c_low is the independent DC output at (step_v, 0.75 V).\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e0.0001\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ecm_kick_recovery_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: max abs(c-c_idle), 6.5–7.9 us; c_idle is the independent DC output at (0, 0.75 V).\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e0.0001\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ecm_kick_peak_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: max abs(c-c_idle), 6–6.5 us.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … 1.2\u003c/td\u003e\n\u003ctd\u003e0.005\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edm_peak_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Maximum of \u003ccode\u003e(abs((v(outp)-v(outn)))) from=1u to=5u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.2\u003c/td\u003e\n\u003ctd\u003e1.2\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emean_power_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Mean of \u003ccode\u003e(-v(vdd)*i(VDD)) from=0 to=8u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003ctd\u003esupply\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edm_cm_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Maximum of \u003ccode\u003e(abs((v(outp)-v(outn))-v(sig))) from=3.5u to=3.95u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ecm_dm_coupling_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: max abs(c-c_idle), 1.5–1.95 us; retains differential-to-common-mode coupling but removes the initial static reference offset.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-07\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edm_high_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Mean of \u003ccode\u003e(v(outp)-v(outn)) from=1.8u to=1.95u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eunscored diagnostic\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ecm_high_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Mean of \u003ccode\u003e((v(outp)+v(outn))/2) from=3.8u to=3.95u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eunscored diagnostic\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eThe capability coefficient is \u003cstrong\u003e9\u003c/strong\u003e, independent of this task's reference-normalized score.\u003c/p\u003e\n\u003ch3\u003eQuality targets and weights\u003c/h3\u003e\n\u003cp\u003eThe area quality target is \u003cstrong\u003e4000 um2\u003c/strong\u003e. It is an integration budget, not a hard limit or a proven process minimum.\u003c/p\u003e\n\u003cp\u003eThe fixed MIM plates occupy 2870.895 um2; the 4000 um2 integration budget leaves 1129.105 um2 for the amplifier, taps, enclosure and routing. Common-mode kick peak carries 40%, unity-gain bandwidth 20%, area 20%, phase-margin preservation 10% and common-mode-to-differential coupling 10%. The existing 50 mV kick and 1 uV coupling goals remain. Differential late errors, static common-mode offset and mean power become diagnostics; all nominal/hot conditions and functional requirements remain enforced.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eQuality anchor\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eScale\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e4000\u003c/td\u003e\n\u003ctd\u003eum2\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.2\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edm_down_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e0.0001\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e1e-05\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edm_up_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e0.0001\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e1e-05\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ecm_kick_peak_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e0.05\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e0.005\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.4\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ecm_dm_coupling_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e1e-07\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ephase_margin_deg\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003epaired source\u003c/td\u003e\n\u003ctd\u003edeg\u003c/td\u003e\n\u003ctd\u003e10\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eunity_hz\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003epaired source\u003c/td\u003e\n\u003ctd\u003eHz\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.2\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emean_power_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003epaired source\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ecm_static_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e0.05\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003e0.005\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eZero-weight observations: \u003ccode\u003edm_down_error_v\u003c/code\u003e, \u003ccode\u003edm_peak_v\u003c/code\u003e, \u003ccode\u003edm_up_error_v\u003c/code\u003e, \u003ccode\u003ecm_down_recovery_v\u003c/code\u003e, \u003ccode\u003ecm_kick_recovery_v\u003c/code\u003e, \u003ccode\u003ecm_up_recovery_v\u003c/code\u003e, \u003ccode\u003edm_cm_error_v\u003c/code\u003e, \u003ccode\u003ecm_gain_vv\u003c/code\u003e, \u003ccode\u003ecm_peak_vv\u003c/code\u003e, \u003ccode\u003edm_gain_db\u003c/code\u003e, \u003ccode\u003ebias_v\u003c/code\u003e, \u003ccode\u003eoutput_cm_v\u003c/code\u003e, \u003ccode\u003eoutput_dm_v\u003c/code\u003e, \u003ccode\u003emean_power_w\u003c/code\u003e, \u003ccode\u003epower_w\u003c/code\u003e, \u003ccode\u003ecm_static_error_v\u003c/code\u003e. Every original functional requirement and measurement remains enforced.\u003c/p\u003e\n\u003cp\u003eThe targets affect continuous quality only. A complete feasible reference may miss them; there is no minimum qualifying score.\u003c/p\u003e\n13:T78c,\u003cul\u003e\n\u003cli\u003e\u003ccode\u003ematerials/circuit.cdl\u003c/code\u003e: authoritative physical circuit for native LVS.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ematerials/circuit.spice\u003c/code\u003e: equivalent process-model simulator representation.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ematerials/testbench.spice\u003c/code\u003e: nominal-temperature stimuli, differential feedback and measurements.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ematerials/performance_85c.spice\u003c/code\u003e: the same testbench at 85 °C for the selected temperature-stress subset.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eOrdered ports are \u003ccode\u003evinp vinn voutp voutn vdd vss ibias vcmr\u003c/code\u003e.\nVINP/VINN are differential inputs; VOUTP/VOUTN are differential outputs;\nVDD/VSS are supply/return; IBIAS receives 20 uA from VDD; VCMR receives the\ncommon-mode reference relative to VSS. The bias mirrors and common-mode\ncontroller stay in the DUT. Do not replace the internal controller with an\nideal servo or omit physical passive devices.\u003c/p\u003e\n\u003cp\u003eRetain all 28 MOS groups' fixed W/L/m (50 individual transistors), models and\nconnectivity. Equivalent parallel fingering/native merging is allowed if all\nchecks pass. NMOS and resistor bodies connect through the explicit substrate\ntap to VSS; PMOS bodies connect through the well tap to VDD. Keep supplies,\nbody connections and ordered ports faithful to the circuit.\u003c/p\u003e\n\u003cp\u003eEach output compensation path has a W=1 um, L=0.96 um \u003ccode\u003erhigh\u003c/code\u003e (nominally\n1.52 kohm at 27 C) between \u003ccode\u003eo1a\u003c/code\u003e/\u003ccode\u003eo1b\u003c/code\u003e and \u003ccode\u003eza\u003c/code\u003e/\u003ccode\u003ezb\u003c/code\u003e, followed by two parallel\n25.85 × 25.85 um \u003ccode\u003ecap_cmim\u003c/code\u003e units to the corresponding output (2.01294 pF).\nEach output-to-\u003ccode\u003evsen\u003c/code\u003e sensing arm contains eight series W=1 um, L=18 um\n\u003ccode\u003erhigh\u003c/code\u003e segments (nominally 205.28 kohm total), in parallel with a\n9.95 × 9.95 um MIM (150.096 fF). Resistors use m=1, b=0. These internal\ndevices are separate from external output loads; they must be physically\nimplemented with the same terminal mapping. Internal nodes are not bias ports.\u003c/p\u003e\n14:Tae1,\u003cp\u003eUse typical MOS, capacitor and resistor models, 27 C, 1.2 V supply, 20 uA\nfrom VDD to IBIAS, and input common mode 0.5 V. Each output has an external\n1, 5 or 10 pF load. For each load, evaluate paired positive and negative\nstimuli: \u003ccode\u003estep_v\u003c/code\u003e is +0.1 or −0.1 V and \u003ccode\u003ekick_a\u003c/code\u003e is respectively +100 or\n−100 uA. All six conditions must pass.\u003c/p\u003e\n\u003cp\u003eDefine \u003ccode\u003ed=VOUTP−VOUTN\u003c/code\u003e and \u003ccode\u003ec=(VOUTP+VOUTN)/2\u003c/code\u003e. The external differential\nfeedback apparatus drives \u003ccode\u003eVINP=0.5+(VSIG−d)/2\u003c/code\u003e and\n\u003ccode\u003eVINN=0.5−(VSIG−d)/2\u003c/code\u003e, through zero-volt series probes. It holds input\ncommon mode and closes differential unity feedback. It does not force output\ncommon mode: the actual DUT controller, its two R/C sense arms and actual\noutput stages close that loop.\u003c/p\u003e\n\u003cp\u003eAt DC, VSIG=0 and VCMR=0.75 V. Differential AC uses opposite +0.5/−0.5 V\nseries probe excitations and sweeps 1 Hz–1 GHz at 150 points/decade. Measure\n\u003ccode\u003eA=d/(VINP−VINN)\u003c/code\u003e; its sign is retained. Low-frequency gain is dB magnitude\nat 1 Hz; unity frequency is the first falling 0 dB crossing; phase margin is\n180 degrees plus continuous phase there, without subtracting an arbitrary\nphase offset. A missing crossing is an error. This voltage-injection return\nratio is scoped to the high-impedance input and declared unity feedback.\u003c/p\u003e\n\u003cp\u003eCommon-mode AC sets both series probe AC magnitudes to zero and VCMR AC=1 V,\nkeeping differential feedback closed. Sweep 1 Hz–1 GHz at 100 points/decade.\nMeasure \u003ccode\u003eabs(c/VCMR)\u003c/code\u003e at 1 Hz and its maximum over the complete sweep.\nThis is closed-loop common-mode tracking/peaking, not an internal common-mode\nloop phase-margin measurement.\u003c/p\u003e\n\u003cp\u003eThe transient sequence runs 0–8 us using Gear order 2 with maximum step 1 ns.\nUse \u003ccode\u003ershunt=1e12\u003c/code\u003e, \u003ccode\u003ereltol=1e-5\u003c/code\u003e, \u003ccode\u003eabstol=1e-13\u003c/code\u003e, \u003ccode\u003evntol=1e-8\u003c/code\u003e.\nVSIG rises from zero to \u003ccode\u003estep_v\u003c/code\u003e during 1–1.005 us, holds for 4 us, and\nreturns during 5.005–5.010 us. VCMR rises 0.75→0.8 V during 3–3.005 us,\nholds for 1 us, and returns during 4.005–4.010 us. Thus reference tracking\nis tested while a nonzero differential output is present. Equal current\nsources inject \u003ccode\u003ekick_a\u003c/code\u003e into both outputs during a 6–6.060 us pulse:\n5 ns rise, 50 ns hold and 5 ns fall. Negative \u003ccode\u003ekick_a\u003c/code\u003e withdraws current.\nThe pulse periods are 20 us; only this finite 8 us sequence is measured.\nNo startup initialization is imposed; transient starts from the solved DC point.\u003c/p\u003e\n\u003cp\u003eA selected phase-margin and CMFB subset repeats at 85 °C with the same TT device models, supply, references, loads and step/kick conditions. This checks temperature sensitivity only; no process-corner, mismatch or yield result is claimed.\u003c/p\u003e\n15:T44c,\u003cp\u003eSubmit GDSII top cell \u003ccode\u003eamp_023_fer_fd2s\u003c/code\u003e, at most 10 MiB. Pass native IHP\nmain/maximal DRC without waivers (standalone scope, density/antenna disabled),\nstrict named-port LVS with physical taps, and a 1200 × 400 um functional\noutline. Include all device, contact and routing drawing layers enumerated by\nthe runtime outline constraint. Pin-purpose and annotation layers do not\ncontribute to bounding-box area and cannot conceal functional geometry.\u003c/p\u003e\n\u003cp\u003ePost-layout measurements must consume the candidate-derived Magic RC netlist,\nincluding physical passives, transistor junction geometry and interconnect.\nThe extraction configuration subdivides Magic's initial grid by two before\nGDS import and imports its isolated copy with \u003ccode\u003egds_readonly=false\u003c/code\u003e; the submitted\nGDS remains immutable. No extraction error is waived. Device parameters,\ngeometry and port connectivity must survive extraction. Magic idealizes\nwell/substrate taps; source simulation retains their finite process models.\nDistributed substrate resistance/noise and fabrication signoff are outside scope.\u003c/p\u003e\n16:T10fc,\u003cp\u003eSoft solve budget: \u003cstrong\u003e1.5 hours\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eDiscover task inputs, frozen requirements, reviewed resources and harness\nfeedback through \u003ccode\u003e/protocol/task.json\u003c/code\u003e, the \u003ccode\u003eresources\u003c/code\u003e field of \u003ccode\u003e/protocol/task.json\u003c/code\u003e and\n\u003ccode\u003e/protocol/harness.json\u003c/code\u003e. Use the supplied IHP primitives and KLayout, Magic\nand ngspice. Write \u003ccode\u003e/workspace/output/final.gds\u003c/code\u003e and explicitly submit using\nthe harness protocol. Reference GDS, source records and host configuration\nremain outside standard solver inputs.\u003c/p\u003e\n\u003ch3\u003eSolve workflow\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eRead the declared circuit and materials, \u003ccode\u003e/protocol/task.json\u003c/code\u003e for paths, constraints and reviewed resources, and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e for capabilities and helper commands. Task inputs under \u003ccode\u003e/task\u003c/code\u003e and resources under \u003ccode\u003e/resources\u003c/code\u003e are read-only; construct the layout in \u003ccode\u003e/workspace\u003c/code\u003e with the declared tools. With layout MCP, paths and commands refer to the remote EDA workspace. Create your own implementation with real devices, interconnect and pins, using your own tool loop without delegating to other agents; reference layouts and author code are not solver inputs.\u003c/li\u003e\n\u003cli\u003eInspect \u003ccode\u003eresources.external\u003c/code\u003e before using external tools. Each command starts a fresh shell: when tool modules are declared, source \u003ccode\u003e/usr/share/Modules/init/bash\u003c/code\u003e and load the selected tool's modules; export its declared \u003ccode\u003etool_environment\u003c/code\u003e settings in that same command. Repeat as needed and use batch or headless operation. Local manuals, command references, and release notes may be available within the declared EDA installation and PDK resource directories. Locate these resources through \u003ccode\u003e/protocol/task.json\u003c/code\u003e and consult the documentation for the installed tool version when diagnosing unfamiliar syntax or tool failures.\u003c/li\u003e\n\u003cli\u003eGenerate an initial candidate and submit a snapshot early. When \u003ccode\u003eprocess-feedback\u003c/code\u003e is available, check the current GDS with layout MCP \u003ccode\u003echeck\u003c/code\u003e or \u003ccode\u003epython -I /protocol/process_check.py\u003c/code\u003e before the final submission. This runs the final evaluator's complete plan and returns engineering diagnostics and candidate measurements, without scores or normalized quality factors. Checks have no count limit and consume the same wall-clock budget. Inspect the physical and functional results and all scored metrics; successful tool execution alone does not establish requirement satisfaction. Read paginated diagnostics with \u003ccode\u003ereport\u003c/code\u003e when using MCP. Local exploratory checks do not replace this complete check.\u003c/li\u003e\n\u003cli\u003eUse the remaining time for measured improvements to the declared quality objectives. Identify the limiting scored metrics, make targeted layout changes, regenerate and check the candidate, and compare measurements with the previous candidate and the stated scoring targets and trade-offs. Preserve the best valid candidate and revert changes that worsen the overall objective. Repeat while time and useful improvements remain; passing validity checks alone is not a stopping condition.\u003c/li\u003e\n\u003cli\u003eStop optimization when the budget expires, all declared quality objectives are achieved, or measured trials support convergence. If stopping early, explain the changes tried, the metric comparisons and the remaining limitations. Track remaining time through session status. At soft-budget expiry, finish or cancel already-started work and submit immediately; do not start another command, check or optimization round. If an MCP execution is running, use \u003ccode\u003epoll\u003c/code\u003e with its \u003ccode\u003eexecution_id\u003c/code\u003e and the returned \u003ccode\u003enext_offset\u003c/code\u003e as \u003ccode\u003eoffset\u003c/code\u003e until completion, or cancel it and wait for it to stop.\u003c/li\u003e\n\u003cli\u003eFinish or cancel outstanding work, restore your best candidate to the declared output path, and explicitly submit it before ending the session. With layout MCP \u003ccode\u003esubmit\u003c/code\u003e, remove the \u003ccode\u003e/workspace/\u003c/code\u003e prefix from \u003ccode\u003eoutput.path\u003c/code\u003e; with the container interface, run \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e. Wait for the receipt: only the last accepted snapshot is judged, and writing a file alone is not submission. Acceptance confirms delivery; the framework independently evaluates validity and quality after the session.\u003c/li\u003e\n\u003c/ol\u003e\n6:[\"$\",\"$8\",null,{\"fallback\":[\"$\",\"p\",null,{\"children\":\"Loading published evidence…\"}],\"children\":[\"$\",\"$L10\",null,{\"task\":{\"case_path\":\"tasks/ihp-sg13g2/analog-db/cases/amp_023_fer_fd2s/case.toml\",\"coefficient\":9,\"collection\":\"analog-db\",\"configuration_url\":\"/ICLayout-Bench/assets/be10df8d4cbfa8af65eec8f8a860469632f0a9fbbf3d8d019552b79c11590e58.txt\",\"description_html\":\"$11\",\"description_path\":\"tasks/ihp-sg13g2/analog-db/cases/amp_023_fer_fd2s/problem.md\",\"hours\":1.5,\"id\":\"ihp-sg13g2.analog-db.amp_023_fer_fd2s\",\"inputs\":{\"description\":{\"format\":\"text\",\"path\":\"problem.md\",\"sha256\":\"620f00d2b306b946bde64f82da8e105299efa197651f75bca29fa5440fcd884a\"},\"netlist\":{\"format\":\"spice\",\"path\":\"materials/circuit.cdl\",\"sha256\":\"4c52bdbbe491a400eff644efb33e0e97af38d50073ccb1a5a5a76964931f569c\",\"subcircuit\":\"amp_023_fer_fd2s\"},\"performance\":{\"format\":\"spice\",\"path\":\"materials/testbench.spice\",\"sha256\":\"f68bf56fc9bcc7c9beab729cc9daea0e2b242d3fd705cfb7e3287dc1ad30b2c1\"},\"performance_85c\":{\"format\":\"spice\",\"path\":\"materials/performance_85c.spice\",\"sha256\":\"99f3f9ab5792655ca9aeb165e7f8d3d78ee2133f10ef1916f6eb309dd814cc6b\"},\"simulation\":{\"format\":\"spice\",\"path\":\"materials/circuit.spice\",\"sha256\":\"8e4962faa96a876bdd66262cef8b12e8c803727b611f77b7e7804d22db58955c\"}},\"licenses\":[{\"name\":\"LICENSE\",\"path\":\"tasks/ihp-sg13g2/analog-db/LICENSE\",\"url\":\"/ICLayout-Bench/assets/644dd511526bc2da77ee7c74714118315db91255376d0ea93a1975b4dbfbfb3d.txt\"},{\"name\":\"NOTICE\",\"path\":\"tasks/ihp-sg13g2/analog-db/NOTICE\",\"url\":\"/ICLayout-Bench/assets/6
