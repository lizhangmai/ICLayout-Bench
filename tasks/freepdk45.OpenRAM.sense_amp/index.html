es\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L5\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[\"$L6\",[[\"$\",\"script\",\"script-0\",{\"src\":\"/ICLayout-Bench/_next/static/chunks/27jip_2vcvnd5.js\",\"async\":true,\"nonce\":\"$undefined\"}]],[\"$\",\"$L7\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.MetadataOutlet\",\"children\":\"$@9\"}]}]]}],{},null,false,null]},null,false,\"$a\"]},null,false,null],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Lb\",null,{\"children\":\"$Lc\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Ld\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.Metadata\",\"children\":\"$Le\"}]}]}],null]}],false]],\"m\":\"$undefined\",\"G\":[\"$f\",[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/ICLayout-Bench/_next/static/chunks/3sa54_ghi1h2h.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]]],\"S\":true,\"h\":null,\"r\":\"$undefined\",\"s\":\"$undefined\",\"a\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"2hqB741EA4j7xWQVg6hu-\"}\n10:I[1186,[\"/ICLayout-Bench/_next/static/chunks/2h60meymns2z5.js\",\"/ICLayout-Bench/_next/static/chunks/27jip_2vcvnd5.js\"],\"default\"]\na:C\n11:T35cd,\u003ch1 id=\"problem-clocked-sram-sense-amplifier-layout-task\"\u003eClocked SRAM Sense Amplifier Layout Task\u003c/h1\u003e\n\u003ch2 id=\"problem-objective\"\u003eObjective\u003c/h2\u003e\n\u003cp\u003eImplement the supplied clocked regenerative sense amplifier. Dout is low when sampled BL is below BR, and high for the opposite differential. Preserve authoritative netlist models, W/L, interface and connections; top cell is \u003ccode\u003esense_amp\u003c/code\u003e.\u003c/p\u003e\n\u003ch3 id=\"problem-optimization-objective\"\u003eOptimization objective\u003c/h3\u003e\n\u003cp\u003eMaximize the declared quality score within the solve budget while satisfying all physical and necessary functional requirements. The first passing DRC, LVS and required electrical checks establish a feasible baseline. Continue improving the scored metrics from that baseline; a passing check or \u003ccode\u003etask_success = true\u003c/code\u003e does not mean that the quality objectives have been achieved.\u003c/p\u003e\n\u003ch2 id=\"problem-inputs-and-interface\"\u003eInputs and Interface\u003c/h2\u003e\n\u003cp\u003eOrdered SPICE ports: \u003ccode\u003ebl br dout sclk vdd gnd\u003c/code\u003e. Names are case-insensitive, but different names are not interchangeable. Inputs are this description, \u003ccode\u003ematerials/circuit.spice\u003c/code\u003e and \u003ccode\u003ematerials/testbench.spice\u003c/code\u003e. The reviewed resource package supplies models and extraction resources; reference geometry and qualification evidence are not solver inputs.\u003c/p\u003e\n\u003ch2 id=\"problem-operating-conditions\"\u003eOperating Conditions\u003c/h2\u003e\n\u003cp\u003eUse nominal FreePDK45 BSIM4 models at \u003cstrong\u003e1.0 V and 27 C\u003c/strong\u003e, with ground at 0 V. Every transistor has channel length 50 nm; widths and model types follow the netlist.\u003c/p\u003e\n\u003cp\u003eFirst decision uses BL/BR=0.8/1.0 V, second 1.0/0.8 V. SCLK is low during sampling and rises at 500 ps and 1500 ps with 10 ps edges, remaining high for 480 ps. Dout load is 0.5 fF; sample at 610 ps and 1610 ps, and average supply power over 0–2 ns. This task tests a loaded 200 mV differential decision and does not claim 50 mV sensitivity.\u003c/p\u003e\n\u003cp\u003eThe deck precisely defines stimuli and observation times, testing only through external ports. Validation covers these nominal conditions, excluding PVT, mismatch, array integration, substrate noise and manufacturing signoff.\u003c/p\u003e\n\u003ch2 id=\"problem-physical-requirements\"\u003ePhysical Requirements\u003c/h2\u003e\n\u003cp\u003eSubmit a nonempty GDSII no larger than 10 MiB. Enable every check in the supplied KLayout DRC deck, including grid and antenna checks, without waivers. Strict LVS checks named ports, models, W/L and physical well/contact connectivity, with library-specific implicit or global power connections disabled. The upstream deck does not implement its documented spacing rule for wells at different potentials and does not provide complete foundry signoff.\u003c/p\u003e\n\u003cp\u003eThe hard functional-outline limit is 100 um × 100 um. Its bounding box includes all functional geometry on drawing layers 1/0–29/0: active regions, wells, implants, threshold markers, poly, contacts, ten metal layers and nine via layers. Area is scored in um2. Keep functional geometry on these layers, excluding pin-purpose and annotation geometry. Electrical labels use poly or metal drawing layers (9/0, 11/0, 13/0, …, 29/0); nonelectrical annotation text is not extracted.\u003c/p\u003e\n\u003cp\u003eTranslation, equivalent hierarchy and internal instance renaming are allowed. LVS permits source/drain exchange and equivalent parallel devices; the candidate must still pass the same RC electrical evaluation. Preserve top-level port identities and explicit body connections.\u003c/p\u003e\n\u003ch2 id=\"problem-electrical-requirements-and-scoring\"\u003eElectrical Requirements and Scoring\u003c/h2\u003e\n\u003cp\u003eArtifact, geometry, DRC, LVS and declared functional requirements must pass. Parasitic extraction is also mandatory: it must produce a complete, electrically consistent netlist usable by the required post-layout simulations. A completed candidate rejection scores zero; infrastructure errors do not establish candidate failure.\u003c/p\u003e\n\u003cp\u003eExtract the candidate GDS only after file, DRC, LVS and geometry checks pass. Simulate its Magic RC netlist directly, with independent source simulation supplying the scoring baseline. Independent LVS first checks VTG/VTL device types, then uses the matching extraction configuration. Extraction includes poly/metal sheet resistance, contacts/vias, geometry-dependent coupling and ground capacitance, and device junction areas/perimeters. Wells use lumped connectivity; BSIM4 describes device and junction behavior. Interconnect RC uses estimated coefficients and native capacitance placement from the fixed community FreePDK45 Magic technology. The adapter binds VTG/VTL models, preserves annotation layers and corrects dimension-unit conversion. This is a predictive approximation without field-solver signoff accuracy.\u003c/p\u003e\n\u003cp\u003ePhysical checks and the declared functional bounds must pass. Quality scoring imposes no fixed degradation allowance. Each \u003ccode\u003esource_*\u003c/code\u003e job and its corresponding candidate extracted circuit use exactly the same testbench, model resources, parameters, loads and measurement windows. Independent source observations define the 100-point electrical baseline without depending on the submitted GDS; reports retain every paired result.\u003c/p\u003e\n\u003cp\u003eLet x be the post-layout measurement and b the source-circuit measurement under the same conditions:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eRatio normalization: maximize with q = x/b and minimize with q = b/x. When a numerical scale s is declared, use (x+s)/(b+s) and its reciprocal, respectively. The scale handles zero values as a normalization floor; it is neither an allowed degradation nor an acceptance bound.\u003c/li\u003e\n\u003cli\u003eAmplitude in dB: maximize with q = 10^((x-b)/20) and minimize with its reciprocal.\u003c/li\u003e\n\u003cli\u003eTarget normalization: q = 1/(1+abs(x-b)/s), where s is the declared physical scale. Signed or zero-valued operating points are not divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eUse \u003ccode\u003elayout\u003c/code\u003e scoring. Each metric takes its worst paired quality q, and the total score is S = 100 * product(min(1, q_i) ** w_i), with area quality q_area = area_reference / candidate_functional_area. The weights below sum to 1; metric dimensions describe measurements and do not determine weights. Physical, extraction, or functional rejection scores zero; other missing or invalid measurements leave the score unknown, and zero-weight observations must also be valid. Matching source-circuit performance at the reference area scores 100 points; each metric is capped at quality 1, so scores cannot exceed 100. Weights express quality tradeoffs rather than hard bounds.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eDefinition / observation\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eQuality normalization\u003c/th\u003e\n\u003cth\u003eFunctional range\u003c/th\u003e\n\u003cth\u003eScale\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003elow\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003efind v(dout) at=610p\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003efunctional check\u003c/td\u003e\n\u003ctd\u003e−∞ … 0.1\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ehigh\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003efind v(dout) at=1610p\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003efunctional check\u003c/td\u003e\n\u003ctd\u003e0.9 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003esupply\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eavg par('-v(vdd)*i(Vdd)') from=0 to=2n\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edecision_delay_fall\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eSCLK 50% to Dout 50% decision delay; see testbench window.\u003c/td\u003e\n\u003ctd\u003es\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0.0 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eArea reference: \u003cstrong\u003e2.82 um2\u003c/strong\u003e. The expanded circuit has 7 device instances, a sum of device/contact envelopes 1.4529 um2, a one-sided envelope margin of 0.12 um, a routing allowance of 50%, and a total outer width/height allowance 0.24 um. Estimate = ceil(100 * (1.5 * envelope_sum + 2 * margin * sqrt(envelope_sum) + margin^2)) / 100. Here margin is the total allowance across both sides, and the envelope sum is displayed to four decimal places. MOS/passive envelopes use W/L (or resistor dimensions) and multiplicity, including explicit contacts and HBT emitter/contact envelopes. This is a frozen engineering estimate, not a process minimum or a proven achievable area.\u003c/p\u003e\n\u003cp\u003eThe capability coefficient is \u003cstrong\u003e5\u003c/strong\u003e, independent of this task's reference-normalized score.\u003c/p\u003e\n\u003ch3 id=\"problem-score-weights\"\u003eScore weights\u003c/h3\u003e\n\u003cp\u003eSRAM periphery: delay 68%, supply power 17%, area 15%; each objective weight is divided equally among its metrics.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.15\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edecision_delay_fall\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.680000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003esupply\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.170000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eOnly falling decision delay contributes to timing quality. Both decision polarities must pass final sampled-level checks; rising decision timing is outside this task's measurement objective.\u003c/p\u003e\n\u003ch2 id=\"problem-tools-and-submission\"\u003eTools and Submission\u003c/h2\u003e\n\u003cp\u003eSoft solve budget: \u003cstrong\u003e3 hours\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eRead \u003ccode\u003e/protocol/task.json\u003c/code\u003e for input/output paths, constraints and the \u003ccode\u003eresources\u003c/code\u003e object; \u003ccode\u003e/protocol/harness.json\u003c/code\u003e describes the active check and submission interface.\u003c/p\u003e\n\u003cp\u003eUse the reviewed FreePDK45 KLayout, Magic and ngspice resources in the \u003ccode\u003eresources\u003c/code\u003e field of \u003ccode\u003e/protocol/task.json\u003c/code\u003e. Magic RC extraction uses \u003ccode\u003e/resources/support/magic-vtg/freepdk45.tech\u003c/code\u003e, including model and unit adaptation. \u003ccode\u003e/protocol/task.json\u003c/code\u003e supplies consistent constraints, measurements and scoring; \u003ccode\u003e/task\u003c/code\u003e contains only declared inputs. Write \u003ccode\u003e/workspace/output/final.gds\u003c/code\u003e, then run \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e to submit explicitly. If \u003ccode\u003eprocess-feedback\u003c/code\u003e is provided, intermediate checks use the frozen plan and backend identities; their snapshots are not final submissions.\u003c/p\u003e\n\u003ch3 id=\"problem-solve-workflow\"\u003eSolve workflow\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eRead the declared circuit and materials, \u003ccode\u003e/protocol/task.json\u003c/code\u003e for paths, constraints and reviewed resources, and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e for capabilities and helper commands. Task inputs under \u003ccode\u003e/task\u003c/code\u003e and resources under \u003ccode\u003e/resources\u003c/code\u003e are read-only; construct the layout in \u003ccode\u003e/workspace\u003c/code\u003e with the declared tools. With layout MCP, paths and commands refer to the remote EDA workspace. Create your own implementation with real devices, interconnect and pins, using your own tool loop without delegating to other agents; reference layouts and author code are not solver inputs.\u003c/li\u003e\n\u003cli\u003eInspect \u003ccode\u003eresources.external\u003c/code\u003e before using external tools. Each command starts a fresh shell: when tool modules are declared, source \u003ccode\u003e/usr/share/Modules/init/bash\u003c/code\u003e and load the selected tool's modules; export its declared \u003ccode\u003etool_environment\u003c/code\u003e settings in that same command. Repeat as needed and use batch or headless operation. Local manuals, command references, and release notes may be available within the declared EDA installation and PDK resource directories. Locate these resources through \u003ccode\u003e/protocol/task.json\u003c/code\u003e and consult the documentation for the installed tool version when diagnosing unfamiliar syntax or tool failures.\u003c/li\u003e\n\u003cli\u003eGenerate an initial candidate and submit a snapshot early. When \u003ccode\u003eprocess-feedback\u003c/code\u003e is available, check the current GDS with layout MCP \u003ccode\u003echeck\u003c/code\u003e or \u003ccode\u003epython -I /protocol/process_check.py\u003c/code\u003e before the final submission. This runs the final evaluator's complete plan and returns engineering diagnostics and candidate measurements, without scores or normalized quality factors. Checks have no count limit and consume the same wall-clock budget. Inspect the physical and functional results and all scored metrics; successful tool execution alone does not establish requirement satisfaction. Read paginated diagnostics with \u003ccode\u003ereport\u003c/code\u003e when using MCP. Local exploratory checks do not replace this complete check.\u003c/li\u003e\n\u003cli\u003eUse the remaining time for measured improvements to the declared quality objectives. Identify the limiting scored metrics, make targeted layout changes, regenerate and check the candidate, and compare measurements with the previous candidate and the stated scoring targets and trade-offs. Preserve the best valid candidate and revert changes that worsen the overall objective. Repeat while time and useful improvements remain; passing validity checks alone is not a stopping condition.\u003c/li\u003e\n\u003cli\u003eStop optimization when the budget expires, all declared quality objectives are achieved, or measured trials support convergence. If stopping early, explain the changes tried, the metric comparisons and the remaining limitations. Track remaining time through session status. At soft-budget expiry, finish or cancel already-started work and submit immediately; do not start another command, check or optimization round. If an MCP execution is running, use \u003ccode\u003epoll\u003c/code\u003e with its \u003ccode\u003eexecution_id\u003c/code\u003e and the returned \u003ccode\u003enext_offset\u003c/code\u003e as \u003ccode\u003eoffset\u003c/code\u003e until completion, or cancel it and wait for it to stop.\u003c/li\u003e\n\u003cli\u003eFinish or cancel outstanding work, restore your best candidate to the declared output path, and explicitly submit it before ending the session. With layout MCP \u003ccode\u003esubmit\u003c/code\u003e, remove the \u003ccode\u003e/workspace/\u003c/code\u003e prefix from \u003ccode\u003eoutput.path\u003c/code\u003e; with the container interface, run \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e. Wait for the receipt: only the last accepted snapshot is judged, and writing a file alone is not submission. Acceptance confirms delivery; the framework independently evaluates validity and quality after the session.\u003c/li\u003e\n\u003c/ol\u003e\n12:T14fc,\u003cp\u003eArtifact, geometry, DRC, LVS and declared functional requirements must pass. Parasitic extraction is also mandatory: it must produce a complete, electrically consistent netlist usable by the required post-layout simulations. A completed candidate rejection scores zero; infrastructure errors do not establish candidate failure.\u003c/p\u003e\n\u003cp\u003eExtract the candidate GDS only after file, DRC, LVS and geometry checks pass. Simulate its Magic RC netlist directly, with independent source simulation supplying the scoring baseline. Independent LVS first checks VTG/VTL device types, then uses the matching extraction configuration. Extraction includes poly/metal sheet resistance, contacts/vias, geometry-dependent coupling and ground capacitance, and device junction areas/perimeters. Wells use lumped connectivity; BSIM4 describes device and junction behavior. Interconnect RC uses estimated coefficients and native capacitance placement from the fixed community FreePDK45 Magic technology. The adapter binds VTG/VTL models, preserves annotation layers and corrects dimension-unit conversion. This is a predictive approximation without field-solver signoff accuracy.\u003c/p\u003e\n\u003cp\u003ePhysical checks and the declared functional bounds must pass. Quality scoring imposes no fixed degradation allowance. Each \u003ccode\u003esource_*\u003c/code\u003e job and its corresponding candidate extracted circuit use exactly the same testbench, model resources, parameters, loads and measurement windows. Independent source observations define the 100-point electrical baseline without depending on the submitted GDS; reports retain every paired result.\u003c/p\u003e\n\u003cp\u003eLet x be the post-layout measurement and b the source-circuit measurement under the same conditions:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eRatio normalization: maximize with q = x/b and minimize with q = b/x. When a numerical scale s is declared, use (x+s)/(b+s) and its reciprocal, respectively. The scale handles zero values as a normalization floor; it is neither an allowed degradation nor an acceptance bound.\u003c/li\u003e\n\u003cli\u003eAmplitude in dB: maximize with q = 10^((x-b)/20) and minimize with its reciprocal.\u003c/li\u003e\n\u003cli\u003eTarget normalization: q = 1/(1+abs(x-b)/s), where s is the declared physical scale. Signed or zero-valued operating points are not divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eUse \u003ccode\u003elayout\u003c/code\u003e scoring. Each metric takes its worst paired quality q, and the total score is S = 100 * product(min(1, q_i) ** w_i), with area quality q_area = area_reference / candidate_functional_area. The weights below sum to 1; metric dimensions describe measurements and do not determine weights. Physical, extraction, or functional rejection scores zero; other missing or invalid measurements leave the score unknown, and zero-weight observations must also be valid. Matching source-circuit performance at the reference area scores 100 points; each metric is capped at quality 1, so scores cannot exceed 100. Weights express quality tradeoffs rather than hard bounds.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eDefinition / observation\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eQuality normalization\u003c/th\u003e\n\u003cth\u003eFunctional range\u003c/th\u003e\n\u003cth\u003eScale\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003elow\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003efind v(dout) at=610p\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003efunctional check\u003c/td\u003e\n\u003ctd\u003e−∞ … 0.1\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ehigh\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003efind v(dout) at=1610p\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003efunctional check\u003c/td\u003e\n\u003ctd\u003e0.9 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003esupply\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eavg par('-v(vdd)*i(Vdd)') from=0 to=2n\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edecision_delay_fall\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eSCLK 50% to Dout 50% decision delay; see testbench window.\u003c/td\u003e\n\u003ctd\u003es\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0.0 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eArea reference: \u003cstrong\u003e2.82 um2\u003c/strong\u003e. The expanded circuit has 7 device instances, a sum of device/contact envelopes 1.4529 um2, a one-sided envelope margin of 0.12 um, a routing allowance of 50%, and a total outer width/height allowance 0.24 um. Estimate = ceil(100 * (1.5 * envelope_sum + 2 * margin * sqrt(envelope_sum) + margin^2)) / 100. Here margin is the total allowance across both sides, and the envelope sum is displayed to four decimal places. MOS/passive envelopes use W/L (or resistor dimensions) and multiplicity, including explicit contacts and HBT emitter/contact envelopes. This is a frozen engineering estimate, not a process minimum or a proven achievable area.\u003c/p\u003e\n\u003cp\u003eThe capability coefficient is \u003cstrong\u003e5\u003c/strong\u003e, independent of this task's reference-normalized score.\u003c/p\u003e\n\u003ch3\u003eScore weights\u003c/h3\u003e\n\u003cp\u003eSRAM periphery: delay 68%, supply power 17%, area 15%; each objective weight is divided equally among its metrics.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.15\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edecision_delay_fall\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.680000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003esupply\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.170000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eOnly falling decision delay contributes to timing quality. Both decision polarities must pass final sampled-level checks; rising decision timing is outside this task's measurement objective.\u003c/p\u003e\n13:T4cd,\u003cp\u003eSubmit a nonempty GDSII no larger than 10 MiB. Enable every check in the supplied KLayout DRC deck, including grid and antenna checks, without waivers. Strict LVS checks named ports, models, W/L and physical well/contact connectivity, with library-specific implicit or global power connections disabled. The upstream deck does not implement its documented spacing rule for wells at different potentials and does not provide complete foundry signoff.\u003c/p\u003e\n\u003cp\u003eThe hard functional-outline limit is 100 um × 100 um. Its bounding box includes all functional geometry on drawing layers 1/0–29/0: active regions, wells, implants, threshold markers, poly, contacts, ten metal layers and nine via layers. Area is scored in um2. Keep functional geometry on these layers, excluding pin-purpose and annotation geometry. Electrical labels use poly or metal drawing layers (9/0, 11/0, 13/0, …, 29/0); nonelectrical annotation text is not extracted.\u003c/p\u003e\n\u003cp\u003eTranslation, equivalent hierarchy and internal instance renaming are allowed. LVS permits source/drain exchange and equivalent parallel devices; the candidate must still pass the same RC electrical evaluation. Preserve top-level port identities and explicit body connections.\u003c/p\u003e\n14:T1285,\u003cp\u003eSoft solve budget: \u003cstrong\u003e3 hours\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eRead \u003ccode\u003e/protocol/task.json\u003c/code\u003e for input/output paths, constraints and the \u003ccode\u003eresources\u003c/code\u003e object; \u003ccode\u003e/protocol/harness.json\u003c/code\u003e describes the active check and submission interface.\u003c/p\u003e\n\u003cp\u003eUse the reviewed FreePDK45 KLayout, Magic and ngspice resources in the \u003ccode\u003eresources\u003c/code\u003e field of \u003ccode\u003e/protocol/task.json\u003c/code\u003e. Magic RC extraction uses \u003ccode\u003e/resources/support/magic-vtg/freepdk45.tech\u003c/code\u003e, including model and unit adaptation. \u003ccode\u003e/protocol/task.json\u003c/code\u003e supplies consistent constraints, measurements and scoring; \u003ccode\u003e/task\u003c/code\u003e contains only declared inputs. Write \u003ccode\u003e/workspace/output/final.gds\u003c/code\u003e, then run \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e to submit explicitly. If \u003ccode\u003eprocess-feedback\u003c/code\u003e is provided, intermediate checks use the frozen plan and backend identities; their snapshots are not final submissions.\u003c/p\u003e\n\u003ch3\u003eSolve workflow\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eRead the declar e no count limit and consume the same wall-clock budget. Inspect the physical and functional results and all scored metrics; successful tool execution alone does not establish requirement satisfaction. Read paginated diagnostics with \u003ccode\u003ereport\u003c/code\u003e when using MCP. Local exploratory checks do not replace this complete check.\u003c/li\u003e\n\u003cli\u003eUse the remaining time for measured improvements to the declared quality objectives. Identify the limiting scored metrics, make targeted layout changes, regenerate and check the candidate, and compare measurements with the previous candidate and the stated scoring targets and trade-offs. Preserve the best valid candidate and revert changes that worsen the overall objective. Repeat while time and useful improvements remain; passing validity checks alone is not a stopping condition.\u003c/li\u003e\n\u003cli\u003eStop optimization when the budget expires, all declared quality objectives are achieved, or measured trials support convergence. If stopping early, explain the changes tried, the metric comparisons and the remaining limitations. Track remaining time through session status. At soft-budget expiry, finish or cancel already-started work and submit immediately; do not start another command, check or optimization round. If an MCP execution is running, use \u003ccode\u003epoll\u003c/code\u003e with its \u003ccode\u003eexecution_id\u003c/code\u003e and the returned \u003ccode\u003enext_offset\u003c/code\u003e as \u003ccode\u003eoffset\u003c/code\u003e until completion, or cancel it and wait for it to stop.\u003c/li\u003e\n\u003cli\u003eFinish or cancel outstanding work, restore your best candidate to the declared output path, and explicitly submit it before ending the session. With layout MCP \u003ccode\u003esubmit\u003c/code\u003e, remove the \u003ccode\u003e/workspace/\u003c/code\u003e prefix from \u003ccode\u003eoutput.path\u003c/code\u003e; with the container interface, run \u003ccode\u003e 27c5565f.txt\"},{\"name\":\"materials/testbench.spice\",\"role\":\"performance\",\"url\":\"/ICLayout-Bench/assets/1d96a4f3ff79ab3e154911210b637de1419e5572e31aabe6e98550f381edb761.txt\"}],\"metrics\":[{\"aggregation\":\"max\",\"category\":\"physical\",\"direction\":\"minimize\",\"id\":\"functional_area\",\"observations\":[\"geometry:area\"],\"unit\":\"um2\"},{\"aggregation\":\"max\",\"category\":\"performance\",\"direction\":\"minimize\",\"id\":\"low\",\"observations\":[\"nominal:low\"],\"requirement\":{\"rationale\":\"The declared truth-table, SRAM sense or polarity-correct comparator output must reach its stated CMOS logic level at every functional sample under the fixed supply and load.\",\"upper\":0.1},\"unit\":\"V\"},{\"aggregation\":\"min\",\"category\":\"performance\",\"direction\":\"maximize\",\"id\":\"high\",\"observations\":[\"nominal:high\"],\"requirement\":{\"lower\":0.9,\"rationale\":\"The declared truth-table, SRAM sense or polarity-correct comparator output must reach its stated CMOS logic level at every functional sample under the fixed supply and load.\"},\"unit\":\"V\"},{\"aggregation\":\"max\",\"baseline\":[\"source_nominal:supply\"],\"category\":\"performance\",\"dimension\":\"supply\",\"direction\":\"minimize\",\"id\":\"supply\",\"normalization\":\"ratio\",\"observations\":[\"nominal:supply\"],\"requirement\":{\"lower\":0,\"rationale\":\"The declared powered circuit must consume nonnegative net energy from its supplies and driven references over the stated observation; power magnitude remains a quality objective.\"},\"scale\":1e-12,\"unit\":\"W\"},{\"aggregation\":\"max\",\"baseline\":[\"source_nominal:decision_delay_fall\"],\"category\":\"performance\",\"dimension\":\"response\",\"direction\":\"minimize\",\"id\":\"decision_delay_fall\",\"normalization\":\"ratio\",\"observations\":[\"nominal:decision_delay_fall\"],\"requirement\":{\"lower\":0,\"rationale\":\"The declared ordered-event interval or crossing frequency has a nonnegative measurement domain, and its crossing must exist for a usable observation.\"},\"unit\":\"s\"}],\"pdk\":\"freepdk45\",\"reader\":{\"category\":\"Logic \u0026 memory\",\"summary\":\"Resolves a small bitline voltage difference into a clocked digital decision.\",\"title\":\"Clocked SRAM Sense Amplifier\"},\"scoring\":{\"area_metric\":\"functional_area\",\"area_target\":2.82,\"method\":\"layout\",\"rationale\":\"SRAM periphery: peripheral delay 68%; supply power 17%; area 15%. Each objective's weight is divided equally among its metrics.\",\"weights\":{\"decision_delay_fall\":0.68,\"functional_area\":0.15,\"supply\":0.17}},\"sections\":{\"Electrical Requirements and Scoring\":\"$12\",\"Inputs and Interface\":\"\u003cp\u003eOrdered SPICE ports: \u003ccode\u003ebl br dout sclk vdd gnd\u003c/code\u003e. Names are case-insensitive, but different names are not interchangeable. Inputs are this description, \u003ccode\u003ematerials/circuit.spice\u003c/code\u003e and \u003ccode\u003ematerials/testbench.spice\u003c/code\u003e. The reviewed resource package supplies models and extraction resources; reference geometry and qualification evidence are not solver inputs.\u003c/p\u003e\\n\",\"Objective\":\"\u003cp\u003eImplement the supplied clocked regenerative sense amplifier. Dout is low when sampled BL is below BR, and high for the opposite differential. Preserve authoritative netlist models, W/L, interface and connections; top cell is \u003ccode\u003esense_amp\u003c/code\u003e.\u003c/p\u003e\\n\u003ch3\u003eOptimization objective\u003c/h3\u003e\\n\u003cp\u003eMaximize the declared quality score within the solve budget while satisfying all physical and necessary functional requirements. The first passing DRC, LVS and required electrical checks establish a feasible baseline. Continue improving the scored metrics from that baseline; a passing check or \u003ccode\u003etask_success = true\u003c/code\u003e does not mean that the quality objectives have been achieved.\u003c/p\u003e\\n\",\"Operating Conditions\":\"\u003cp\u003eUse nominal FreePDK45 BSIM4 models at \u003cstrong\u003e1.0 V and 27 C\u003c/strong\u003e, with ground at 0 V. Every transistor has channel length 50 nm; widths and model types follow the netlist.\u003c/p\u003e\\n\u003cp\u003eFirst decision uses BL/BR=0.8/1.0 V, second 1.0/0.8 V. SCLK is low during sampling and rises at 500 ps and 1500 ps with 10 ps edges, remaining high for 480 ps. Dout load is 0.5 fF; sample at 610 ps and 1610 ps, and average supply power over 0–2 ns. This task tests a loaded 200 mV differential decision and does not claim 50 mV sensitivity.\u003c/p\u003e\\n\u003cp\u003eThe deck precisely defines stimuli and observation times, testing only through external ports. Validation covers these nominal conditions, excluding PVT, mismatch, array integration, substrate noise and manufacturing signoff.\u003c/p\u003e\\n\",\"Physical Requirements\":\"$13\",\"Tools and Submission\":\"$14\"},\"source_url\":\"https://github.com/ferdous313/OpenRAM/blob/420a33e731d7d80bf9c7cd54ffbeec3603259847/technology/freepdk45/sp_lib/sense_amp.sp\",\"status\":\"qualified\",\"title\":\"Clocked SRAM Sense Amplifier\",\"core\":false},\"catalog\":{\"tasks\":[],\"runs\":[],\"experiments\":[],\"contexts\":[],\"boards\":[]},\"previewRun\":null,\"preview\":null,\"evidenceError\":false}]}]\nc:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n15:I[27201,[\"/ICLayout-Bench/_next/static/chunks/2h60meymns2z5.js\"],\"IconMark\"]\n9:null\ne:[[\"$\",\"title\",\"0\",{\"children\":\"ICLayout-Bench | Circuit layout intelligence\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Independent evaluation of AI for integrated circuit layout. Compare model scores, explore circuit performance and inspect generated layouts.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/ICLayout-Bench/brand/iclayout-bench.svg\",\"type\":\"image/svg+xml\",\"sizes\":\"any\"}],
