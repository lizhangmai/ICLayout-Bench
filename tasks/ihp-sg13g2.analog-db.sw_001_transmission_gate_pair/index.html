hildren\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L5\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[\"$L6\",[[\"$\",\"script\",\"script-0\",{\"src\":\"/ICLayout-Bench/_next/static/chunks/27jip_2vcvnd5.js\",\"async\":true,\"nonce\":\"$undefined\"}]],[\"$\",\"$L7\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.MetadataOutlet\",\"children\":\"$@9\"}]}]]}],{},null,false,null]},null,false,\"$a\"]},null,false,null],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Lb\",null,{\"children\":\"$Lc\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Ld\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.Metadata\",\"children\":\"$Le\"}]}]}],null]}],false]],\"m\":\"$undefined\",\"G\":[\"$f\",[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/ICLayout-Bench/_next/static/chunks/3sa54_ghi1h2h.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]]],\"S\":true,\"h\":null,\"r\":\"$undefined\",\"s\":\"$undefined\",\"a\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"2hqB741EA4j7xWQVg6hu-\"}\n10:I[1186,[\"/ICLayout-Bench/_next/static/chunks/2h60meymns2z5.js\",\"/ICLayout-Bench/_next/static/chunks/27jip_2vcvnd5.js\"],\"default\"]\na:C\n11:T425d,\u003ch1 id=\"problem-bidirectional-cmos-transmission-gate-layout-task\"\u003eBidirectional CMOS Transmission Gate Layout Task\u003c/h1\u003e\n\u003ch2 id=\"problem-objective\"\u003eObjective\u003c/h2\u003e\n\u003cp\u003eImplement \u003ccode\u003esw_001_transmission_gate_pair\u003c/code\u003e with the complete fixed topology and minimize layout-induced degradation under the declared nominal observations. The fixed IHP binding has one NMOS and one PMOS, each W=2 um, L=0.13 um, m=1. Both connect the bidirectional signal terminals, with the NMOS body at vss and PMOS body at vdd. No internal clock generator is added.\u003c/p\u003e\n\u003ch3 id=\"problem-optimization-objective\"\u003eOptimization objective\u003c/h3\u003e\n\u003cp\u003eMaximize the declared quality score within the solve budget while satisfying all physical and necessary functional requirements. The first passing DRC, LVS and required electrical checks establish a feasible baseline. Continue improving the scored metrics from that baseline; a passing check or \u003ccode\u003etask_success = true\u003c/code\u003e does not mean that the quality objectives have been achieved.\u003c/p\u003e\n\u003ch2 id=\"problem-inputs-and-interface\"\u003eInputs and Interface\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003ematerials/circuit.cdl\u003c/code\u003e is the authoritative logical circuit netlist; \u003ccode\u003ematerials/circuit.spice\u003c/code\u003e is its simulator representation. \u003ccode\u003ematerials/testbench.spice\u003c/code\u003e, \u003ccode\u003ematerials/forward.spice\u003c/code\u003e, \u003ccode\u003ematerials/reverse.spice\u003c/code\u003e supply the performance stimuli and measurements. \u003ccode\u003eproblem.md\u003c/code\u003e is this contract. Ordered ports: \u003ccode\u003eport_a port_b vctl vctl_not vdd vss\u003c/code\u003e. The fixture supplies complementary controls externally. Both signal/control ports stay within 0–1.5 V. Native body taps remain physically checked; finite well/substrate resistances are outside the Magic RC compact-model boundary.\u003c/p\u003e\n\u003ch2 id=\"problem-operating-conditions\"\u003eOperating Conditions\u003c/h2\u003e\n\u003cp\u003e1.5 V supply. DC on/off conditions use signal common modes 0.15, 0.75 and 1.35 V and both signs of a 10 mV port difference. On controls are 1.5/0 V; off controls are 0/1.5 V. Ron is the absolute port drop divided by actual port-source current, accepted only above 1 nA and independently checked for the correct current direction. Off leakage uses held voltages at both terminals. Dynamic tests drive each direction separately through 100 ohm, with a 1 pF receiving load and 1 Mohm resistor to the selected common mode. Signal steps are common-mode ±50 mV with 1 ns edges starting at 20 ns; separate static-input runs isolate control feedthrough. Complementary controls turn off at 70 ns for 60 ns, with matched 1 ns edges, no extra overlap/dead interval. Runs start from DC and end at 110 ns with maximum 50 ps steps. The finite receiving resistance defines the off-node behavior physically. The isolated window-marker source only schedules exact time breakpoints; it connects to no DUT terminal.\u003c/p\u003e\n\u003cp\u003eSource and candidate jobs use exactly the same test apparatus, parameters, nominal TT models and 27 C temperature. Stimuli and measurements follow the testbench control block and frozen runtime parameters. Source simulation is independent of reference GDS; paper or datasheet performance is not an acceptance bound.\u003c/p\u003e\n\u003ch2 id=\"problem-physical-requirements\"\u003ePhysical Requirements\u003c/h2\u003e\n\u003cp\u003eSubmit a valid GDSII containing top cell \u003ccode\u003esw_001_transmission_gate_pair\u003c/code\u003e, at most 10485760 bytes. Pass the pinned native DRC profile, named-interface LVS and functional outline checks. Maximum functional width/height are 5000/1000 um. The complete functional layer set is \u003ccode\u003e[[1, 0], [3, 0], [5, 0], [6, 0], [7, 0], [8, 0], [10, 0], [11, 0], [13, 0], [14, 0], [19, 0], [24, 0], [26, 0], [28, 0], [29, 0], [30, 0], [31, 0], [32, 0], [33, 0], [35, 0], [36, 0], [40, 0], [44, 0], [46, 0], [49, 0], [50, 0], [51, 0], [52, 0], [53, 0], [55, 0], [58, 0], [66, 0], [67, 0], [90, 0], [101, 0], [111, 0], [125, 0], [126, 0], [128, 0], [129, 0], [133, 0], [134, 0], [139, 0], [152, 0]]\u003c/code\u003e (layer/datatype pairs); text/annotation geometry is excluded. There are no case-local DRC waivers. Geometry bounds are generous task/resource limits, not an area score anchor.\u003c/p\u003e\n\u003cp\u003ePost-layout simulation uses distributed wire RC from native candidate GDS and retains physical MOS, resistors and capacitors; LVS cannot replace PEX. Source and Magic extraction use logical well/substrate body nets; no distributed substrate resistance or noise accuracy is claimed.\u003c/p\u003e\n\u003ch2 id=\"problem-electrical-requirements-and-scoring\"\u003eElectrical Requirements and Scoring\u003c/h2\u003e\n\u003cp\u003eArtifact, geometry, DRC, LVS and declared functional requirements must pass. Parasitic extraction is also mandatory: it must produce a complete, electrically consistent netlist usable by the required post-layout simulations. A completed candidate rejection scores zero; infrastructure errors do not establish candidate failure.\u003c/p\u003e\n\u003cp\u003eThe on-state 10 mV port difference must produce a resolved current above the 1 nA observation floor so that an open or unresolved path cannot establish a usable resistance. Resistance, leakage and absolute voltage disturbances must be nonnegative by their measurement definitions. These bounds have explicit rationales in \u003ccode\u003ecase.toml\u003c/code\u003e; no upper resistance, leakage or tracking-error budget rejects an otherwise valid solution.\u003c/p\u003e\n\u003cp\u003ePhysical checks and the declared functional bounds must pass. Quality scoring imposes no fixed degradation allowance. Each \u003ccode\u003esource_*\u003c/code\u003e job and its corresponding candidate extracted circuit use exactly the same testbench, model resources, parameters, loads and measurement windows. Independent source observations define the 100-point electrical baseline without depending on the submitted GDS; reports retain every paired result.\u003c/p\u003e\n\u003cp\u003eLet x be the post-layout measurement and b the source-circuit measurement under the same conditions:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eRatio normalization: maximize with q = x/b and minimize with q = b/x. When a numerical scale s is declared, use (x+s)/(b+s) and its reciprocal, respectively. The scale handles zero values as a normalization floor; it is neither an allowed degradation nor an acceptance bound.\u003c/li\u003e\n\u003cli\u003eAmplitude in dB: maximize with q = 10^((x-b)/20) and minimize with its reciprocal.\u003c/li\u003e\n\u003cli\u003eTarget normalization: q = 1/(1+abs(x-b)/s), where s is the declared physical scale. Signed or zero-valued operating points are not divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eUse \u003ccode\u003elayout\u003c/code\u003e scoring. Each metric takes its worst paired quality q, and the total score is S = 100 * product(min(1, q_i) ** w_i), with area quality q_area = area_reference / candidate_functional_area. The weights below sum to 1; metric dimensions describe measurements and do not determine weights. Physical, extraction, or functional rejection scores zero; other missing or invalid measurements leave the score unknown, and zero-weight observations must also be valid. Matching source-circuit performance at the reference area scores 100 points; each metric is capped at quality 1, so scores cannot exceed 100. Weights express quality tradeoffs rather than hard bounds.\u003c/p\u003e\n\u003cp\u003eCoefficient 3 covers local bidirectional analog conduction and loaded control transitions. Tracking error is integrated over exactly 20–60 ns; control-edge excursion uses the inclusive 69–75 ns sample window; held mean shift compares 90–100 ns with 65–69 ns. These are loaded feedthrough/hold observations, not an intrinsic charge-injection constant or perfect floating-node retention. No energy score is claimed: body-rail current alone cannot measure control and signal-driver energy.\u003c/p\u003e\n\u003cp\u003eEvery required condition must produce finite, valid measurements and pass the functional bounds below. Missing or invalid extraction/measurements are evaluation errors and cannot be replaced by a low performance score.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003etracking_error_v\u003c/code\u003e, \u003ccode\u003efeedthrough_v\u003c/code\u003e use \u003ccode\u003esaturating_ratio\u003c/code\u003e: q = 2(b+s)/(b+x+2s), where x is candidate error, b is paired source error and s is the positive scale below. Source equivalence gives q=1; improvement approaches the upper limit 2 with diminishing returns. The scale retains its declared unit and numerical-floor meaning. Normalize each condition before taking the worst quality; other rules follow their declarations.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eDefinition\u003c/th\u003e\n\u003cth\u003eDimension / normalization\u003c/th\u003e\n\u003cth\u003eFunctional range\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eron_ohm\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eohm\u003c/td\u003e\n\u003ctd\u003e10 mV DC port drop divided by measured port current\u003c/td\u003e\n\u003ctd\u003eresponse / ratio; scale 1\u003c/td\u003e\n\u003ctd\u003elower=0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eon_current_a\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eA\u003c/td\u003e\n\u003ctd\u003eAbsolute DC on current; excludes numerical-noise division\u003c/td\u003e\n\u003ctd\u003eunscored / functional\u003c/td\u003e\n\u003ctd\u003elower=1e-09\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eleakage_a\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eA\u003c/td\u003e\n\u003ctd\u003eOff-state current with both ports held at defined voltages\u003c/td\u003e\n\u003ctd\u003ebias / ratio; scale 1e-12\u003c/td\u003e\n\u003ctd\u003elower=0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ekcl_a\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eA\u003c/td\u003e\n\u003ctd\u003eExternal KCL including control and body sources\u003c/td\u003e\n\u003ctd\u003ediagnostic; unscored\u003c/td\u003e\n\u003ctd\u003eProducer validity guard; see below\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003etracking_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eMean loaded dynamic tracking error, 20–60 ns\u003c/td\u003e\n\u003ctd\u003eresponse / saturating_ratio; scale 0.0001\u003c/td\u003e\n\u003ctd\u003elower=0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efeedthrough_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eOutput excursion during turn-off, 69–75 ns\u003c/td\u003e\n\u003ctd\u003eresponse / saturating_ratio; scale 0.0001\u003c/td\u003e\n\u003ctd\u003elower=0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ehold_shift_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eFinite loaded hold mean 90–100 ns minus 65–69 ns\u003c/td\u003e\n\u003ctd\u003eresponse / target; scale 0.1\u003c/td\u003e\n\u003ctd\u003eFinite measurement\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eTarget normalization uses declared voltage or gain scales to preserve the source operating point/transfer. Ratio floors prevent division by zero at zero error or the noise floor; they are numeric normalization units, not acceptance tolerances. Voltage bounds are the declared supply rails; measurement-generator validity checks distinguish measurements from numerical noise. No hard cutoff relative to source performance is imposed.\u003c/p\u003e\n\u003cp\u003eThe area anchor is \u003cstrong\u003e300 um²\u003c/strong\u003e: twice the sum of \u003ccode\u003e(W + 6 um) × (L + 8 um)\u003c/code\u003e over every expanded MOS and physical passive unit (2 units, sum 130.080000 um²), rounded upward to 100 um². Contact/well/tap/isolation envelopes are included in the 6/8 um allowances; the factor two allows routing. This is an engineering compact-footprint estimate, independent of measured witness area, not a foundry minimum or demonstrated optimum. Task coefficient: \u003cstrong\u003e3\u003c/strong\u003e.\u003c/p\u003e\n\u003ch3 id=\"problem-score-weights\"\u003eScore weights\u003c/h3\u003e\n\u003cp\u003eTransmission/chopper switches: on-state conduction 21.4%; off-state leakage 17.1%; transfer fidelity 25.7%; switching disturbance 25.7%; area 10%. Each objective's weight is divided equally among its metrics.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eron_ohm\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.214285714286\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eleakage_a\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.171428571429\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003etracking_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.257142857143\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efeedthrough_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.128571428571\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ehold_shift_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.128571428571\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch2 id=\"problem-tools-and-submission\"\u003eTools and Submission\u003c/h2\u003e\n\u003cp\u003eSoft solve budget: \u003cstrong\u003e8 hours\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eRead \u003ccode\u003e/protocol/task.json\u003c/code\u003e for input/output paths, constraints and the \u003ccode\u003eresources\u003c/code\u003e object; \u003ccode\u003e/protocol/harness.json\u003c/code\u003e describes the active check and submission interface.\u003c/p\u003e\n\u003cp\u003eUse the runtime task and reviewed PDK resources to complete the declared native checks, extraction and ngspice measurements. Write the required top cell to \u003ccode\u003eoutput/final.gds\u003c/code\u003e, then explicitly submit its path through the session interface; file generation alone is not submission. Reference GDS, qualification results and development sources are not standard solver inputs.\u003c/p\u003e\n\u003cp\u003eThe source and extracted-candidate decks require absolute external DC current\nconservation residual \u003ccode\u003ekcl_a \u0026lt;= 1e-09 A\u003c/code\u003e. A larger residual aborts\nsimulation and produces an evaluator error with unknown score, rather than a\nfunctional rejection. The reported residual is an unscored diagnostic.\u003c/p\u003e\n\u003cp\u003eThe authoritative MOS input preserves the original logical groups, W/L/m and all four terminal nets. Verified unit arrays, multiple fingers, shared diffusion and shared wells on the same body net are allowed. Native LVS checks connectivity and equivalent device parameters; native DRC checks actual well/substrate contacts. Contact count, dimensions, area/perimeter and the reference well partition are not circuit constraints. PEX uses actual diffusion geometry and interconnect RC, with logical body nets as its boundary; distributed substrate/well resistance is outside this extraction model.\u003c/p\u003e\n\u003ch3 id=\"problem-solve-workflow\"\u003eSolve workflow\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eRead the declared circuit and materials, \u003ccode\u003e/protocol/task.json\u003c/code\u003e for paths, constraints and reviewed resources, and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e for capabilities and helper commands. Task inputs under \u003ccode\u003e/task\u003c/code\u003e and resources under \u003ccode\u003e/resources\u003c/code\u003e are read-only; construct the layout in \u003ccode\u003e/workspace\u003c/code\u003e with the declared tools. With layout MCP, paths and commands refer to the remote EDA workspace. Create your own implementation with real devices, interconnect and pins, using your own tool loop without delegating to other agents; reference layouts and author code are not solver inputs.\u003c/li\u003e\n\u003cli\u003eInspect \u003ccode\u003eresources.external\u003c/code\u003e before using external tools. Each command starts a fresh shell: when tool modules are declared, source \u003ccode\u003e/usr/share/Modules/init/bash\u003c/code\u003e and load the selected tool's modules; export its declared \u003ccode\u003etool_environment\u003c/code\u003e settings in that same command. Repeat as needed and use batch or headless operation. Local manuals, command references, and release notes may be available within the declared EDA installation and PDK resource directories. Locate these resources through \u003ccode\u003e/protocol/task.json\u003c/code\u003e and consult the documentation for the installed tool version when diagnosing unfamiliar syntax or tool failures.\u003c/li\u003e\n\u003cli\u003eGenerate an initial candidate and submit a snapshot early. When \u003ccode\u003eprocess-feedback\u003c/code\u003e is available, check the current GDS with layout MCP \u003ccode\u003echeck\u003c/code\u003e or \u003ccode\u003epython -I /protocol/process_check.py\u003c/code\u003e before the final submission. This runs the final evaluator's complete plan and returns engineering diagnostics and candidate measurements, without scores or normalized quality factors. Checks have no count limit and consume the same wall-clock budget. Inspect the physical and functional results and all scored metrics; successful tool execution alone does not establish requirement satisfaction. Read paginated diagnostics with \u003ccode\u003ereport\u003c/code\u003e when using MCP. Local exploratory checks do not replace this complete check.\u003c/li\u003e\n\u003cli\u003eUse the remaining time for measured improvements to the declared quality objectives. Identify the limiting scored metrics, make targeted layout changes, regenerate and check the candidate, and compare measurements with the previous candidate and the stated scoring targets and trade-offs. Preserve the best valid candidate and revert changes that worsen the overall objective. Repeat while time and useful improvements remain; passing validity checks alone is not a stopping condition.\u003c/li\u003e\n\u003cli\u003eStop optimization when the budget expires, all declared quality objectives are achieved, or measured trials support convergence. If stopping early, explain the changes tried, the metric comparisons and the remaining limitations. Track remaining time through session status. At soft-budget expiry, finish or cancel already-started work and submit immediately; do not start another command, check or optimization round. If an MCP execution is running, use \u003ccode\u003epoll\u003c/code\u003e with its \u003ccode\u003eexecution_id\u003c/code\u003e and the returned \u003ccode\u003enext_offset\u003c/code\u003e as \u003ccode\u003eoffset\u003c/code\u003e until completion, or cancel it and wait for it to stop.\u003c/li\u003e\n\u003cli\u003eFinish or cancel outstanding work, restore your best candidate to the declared output path, and explicitly submit it before ending the session. With layout MCP \u003ccode\u003esubmit\u003c/code\u003e, remove the \u003ccode\u003e/workspace/\u003c/code\u003e prefix from \u003ccode\u003eoutput.path\u003c/code\u003e; with the container interface, run \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e. Wait for the receipt: only the last accepted snapshot is judged, and writing a file alone is not submission. Acceptance confirms delivery; the framework independently evaluates validity and quality after the session.\u003c/li\u003e\n\u003c/ol\u003e\n12:T1b82,\u003cp\u003eArtifact, geometry, DRC, LVS and declared functional requirements must pass. Parasitic extraction is also mandatory: it must produce a complete, electrically consistent netlist usable by the required post-layout simulations. A completed candidate rejection scores zero; infrastructure errors do not establish candidate failure.\u003c/p\u003e\n\u003cp\u003eThe on-state 10 mV port difference must produce a resolved current above the 1 nA observation floor so that an open or unresolved path cannot establish a usable resistance. Resistance, leakage and absolute voltage disturbances must be nonnegative by their measurement definitions. These bounds have explicit rationales in \u003ccode\u003ecase.toml\u003c/code\u003e; no upper resistance, leakage or tracking-error budget rejects an otherwise valid solution.\u003c/p\u003e\n\u003cp\u003ePhysical checks and the declared functional bounds must pass. Quality scoring imposes no fixed degradation allowance. Each \u003ccode\u003esource_*\u003c/code\u003e job and its corresponding candidate extracted circuit use exactly the same testbench, model resources, parameters, loads and measurement windows. Independent source observations define the 100-point electrical baseline without depending on the submitted GDS; reports retain every paired result.\u003c/p\u003e\n\u003cp\u003eLet x be the post-layout measurement and b the source-circuit measurement under the same conditions:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eRatio normalization: maximize with q = x/b and minimize with q = b/x. When a numerical scale s is declared, use (x+s)/(b+s) and its reciprocal, respectively. The scale handles zero values as a normalization floor; it is neither an allowed degradation nor an acceptance bound.\u003c/li\u003e\n\u003cli\u003eAmplitude in dB: maximize with q = 10^((x-b)/20) and minimize with its reciprocal.\u003c/li\u003e\n\u003cli\u003eTarget normalization: q = 1/(1+abs(x-b)/s), where s is the declared physical scale. Signed or zero-valued operating points are not divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eUse \u003ccode\u003elayout\u003c/code\u003e scoring. Each metric takes its worst paired quality q, and the total score is S = 100 * product(min(1, q_i) ** w_i), with area quality q_area = area_reference / candidate_functional_area. The weights below sum to 1; metric dimensions describe measurements and do not determine weights. Physical, extraction, or functional rejection scores zero; other missing or invalid measurements leave the score unknown, and zero-weight observations must also be valid. Matching source-circuit performance at the reference area scores 100 points; each metric is capped at quality 1, so scores cannot exceed 100. Weights express quality tradeoffs rather than hard bounds.\u003c/p\u003e\n\u003cp\u003eCoefficient 3 covers local bidirectional analog conduction and loaded control transitions. Tracking error is integrated over exactly 20–60 ns; control-edge excursion uses the inclusive 69–75 ns sample window; held mean shift compares 90–100 ns with 65–69 ns. These are loaded feedthrough/hold observations, not an intrinsic charge-injection constant or perfect floating-node retention. No energy score is claimed: body-rail current alone cannot measure control and signal-driver energy.\u003c/p\u003e\n\u003cp\u003eEvery required condition must produce finite, valid measurements and pass the functional bounds below. Missing or invalid extraction/measurements are evaluation errors and cannot be replaced by a low performance score.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003etracking_error_v\u003c/code\u003e, \u003ccode\u003efeedthrough_v\u003c/code\u003e use \u003ccode\u003esaturating_ratio\u003c/code\u003e: q = 2(b+s)/(b+x+2s), where x is candidate error, b is paired source error and s is the positive scale below. Source equivalence gives q=1; improvement approaches the upper limit 2 with diminishing returns. The scale retains its declared unit and numerical-floor meaning. Normalize each condition before taking the worst quality; other rules follow their declarations.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eDefinition\u003c/th\u003e\n\u003cth\u003eDimension / normalization\u003c/th\u003e\n\u003cth\u003eFunctional range\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eron_ohm\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eohm\u003c/td\u003e\n\u003ctd\u003e10 mV DC port drop divided by measured port current\u003c/td\u003e\n\u003ctd\u003eresponse / ratio; scale 1\u003c/td\u003e\n\u003ctd\u003elower=0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eon_current_a\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eA\u003c/td\u003e\n\u003ctd\u003eAbsolute DC on current; excludes numerical-noise division\u003c/td\u003e\n\u003ctd\u003eunscored / functional\u003c/td\u003e\n\u003ctd\u003elower=1e-09\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eleakage_a\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eA\u003c/td\u003e\n\u003ctd\u003eOff-state current with both ports held at defined voltages\u003c/td\u003e\n\u003ctd\u003ebias / ratio; scale 1e-12\u003c/td\u003e\n\u003ctd\u003elower=0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ekcl_a\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eA\u003c/td\u003e\n\u003ctd\u003eExternal KCL including control and body sources\u003c/td\u003e\n\u003ctd\u003ediagnostic; unscored\u003c/td\u003e\n\u003ctd\u003eProducer validity guard; see below\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003etracking_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eMean loaded dynamic tracking error, 20–60 ns\u003c/td\u003e\n\u003ctd\u003eresponse / saturating_ratio; scale 0.0001\u003c/td\u003e\n\u003ctd\u003elower=0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efeedthrough_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eOutput excursion during turn-off, 69–75 ns\u003c/td\u003e\n\u003ctd\u003eresponse / saturating_ratio; scale 0.0001\u003c/td\u003e\n\u003ctd\u003elower=0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ehold_shift_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eFinite loaded hold mean 90–100 ns minus 65–69 ns\u003c/td\u003e\n\u003ctd\u003eresponse / target; scale 0.1\u003c/td\u003e\n\u003ctd\u003eFinite measurement\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eTarget normalization uses declared voltage or gain scales to preserve the source operating point/transfer. Ratio floors prevent division by zero at zero error or the noise floor; they are numeric normalization units, not acceptance tolerances. Voltage bounds are the declared supply rails; measurement-generator validity checks distinguish measurements from numerical noise. No hard cutoff relative to source performance is imposed.\u003c/p\u003e\n\u003cp\u003eThe area anchor is \u003cstrong\u003e300 um²\u003c/strong\u003e: twice the sum of \u003ccode\u003e(W + 6 um) × (L + 8 um)\u003c/code\u003e over every expanded MOS and physical passive unit (2 units, sum 130.080000 um²), rounded upward to 100 um². Contact/well/tap/isolation envelopes are included in the 6/8 um allowances; the factor two allows routing. This is an engineering compact-footprint estimate, independent of measured witness area, not a foundry minimum or demonstrated optimum. Task coefficient: \u003cstrong\u003e3\u003c/strong\u003e.\u003c/p\u003e\n\u003ch3\u003eScore weights\u003c/h3\u003e\n\u003cp\u003eTransmission/chopper switches: on-state conduction 21.4%; off-state leakage 17.1%; transfer fidelity 25.7%; switching disturbance 25.7%; area 10%. Each objective's weight is divided equally among its metrics.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eron_ohm\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.214285714286\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eleakage_a\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.171428571429\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003etracking_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.257142857143\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efeedthrough_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.128571428571\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ehold_shift_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.128571428571\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n13:T530,\u003cp\u003e1.5 V supply. DC on/off conditions use signal common modes 0.15, 0.75 and 1.35 V and both signs of a 10 mV port difference. On controls are 1.5/0 V; off controls are 0/1.5 V. Ron is the absolute port drop divided by actual port-source current, accepted only above 1 nA and independently checked for the correct current direction. Off leakage uses held voltages at both terminals. Dynamic tests drive each direction separately through 100 ohm, with a 1 pF receiving load and 1 Mohm resistor to the selected common mode. Signal steps are common-mode ±50 mV with 1 ns edges starting at 20 ns; separate static-input runs isolate control feedthrough. Complementary controls turn off at 70 ns for 60 ns, with matched 1 ns edges, no extra overlap/dead interval. Runs start from DC and end at 110 ns with maximum 50 ps steps. The finite receiving resistance defines the off-node behavior physically. The isolated window-marker source only schedules exact time breakpoints; it connects to no DUT terminal.\u003c/p\u003e\n\u003cp\u003eSource and candidate jobs use exactly the same test apparatus, parameters, nominal TT models and 27 C temperature. Stimuli and measurements follow the testbench control block and frozen runtime parameters. Source simulation is independent of reference GDS; paper or datasheet performance is not an acceptance bound.\u003c/p\u003e\n14:T491,\u003cp\u003eSubmit a valid GDSII containing top cell \u003ccode\u003esw_001_transmission_gate_pair\u003c/code\u003e, at most 10485760 bytes. Pass the pinned native DRC profile, named-interface LVS and functional outline checks. Maximum functional width/height are 5000/1000 um. The complete functional layer set is \u003ccode\u003e[[1, 0], [3, 0], [5, 0], [6, 0], [7, 0], [8, 0], [10, 0], [11, 0], [13, 0], [14, 0], [19, 0], [24, 0], [26, 0], [28, 0], [29, 0], [30, 0], [31, 0], [32, 0], [33, 0], [35, 0], [36, 0], [40, 0], [44, 0], [46, 0], [49, 0], [50, 0], [51, 0], [52, 0], [53, 0], [55, 0], [58, 0], [66, 0], [67, 0], [90, 0], [101, 0], [111, 0], [125, 0], [126, 0], [128, 0], [129, 0], [133, 0], [134, 0], [139, 0], [152, 0]]\u003c/code\u003e (layer/datatype pairs); text/annotation geometry is excluded. There are no case-local DRC waivers. Geometry bounds are generous task/resource limits, not an area score anchor.\u003c/p\u003e\n\u003cp\u003ePost-layout simulation uses distributed wire RC from native candidate GDS and retains physical MOS, resistors and capacitors; LVS cannot replace PEX. Source and Magic extraction use logical well/substrate body nets; no distributed substrate resistance or noise accuracy is claimed.\u003c/p\u003e\n15:T14f8,\u003cp\u003eSoft solve budget: \u003cstrong\u003e8 hours\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eRead \u003ccode\u003e/protocol/task.json\u003c/code\u003e for input/output paths, constraints and the \u003ccode\u003eresources\u003c/code\u003e object; \u003ccode\u003e/protocol/harness.json\u003c/code\u003e describes the active check and submission interface.\u003c/p\u003e\n\u003cp\u003eUse the runtime task and reviewed PDK resources to complete the declared native checks, extraction and ngspice measurements. Write the required top cell to \u003ccode\u003eoutput/final.gds\u003c/code\u003e, then explicitly submit its path through the session interface; file generation alone is not submission. Reference GDS, qualification results and development sources are not standard solver inputs.\u003c/p\u003e\n\u003cp\u003eThe source and extracted-candidate decks require absolute external DC current\nconservation residual \u003ccode\u003ekcl_a \u0026lt;= 1e-09 A\u003c/code\u003e. A larger residual aborts\nsimulation and produces an evaluator error with unknown score, rather than a\nfunctional rejection. The reported residual is an unscored diagnostic.\u003c/p\u003e\n\u003cp\u003eThe authoritative MOS input preserves the original logical groups, W/L/m and all four terminal nets. Verified unit arrays, multiple fingers, shared diffusion and shared wells on the same body net are allowed. Native LVS checks connectivity and equivalent device parameters; native DRC checks actual well/substrate contacts. Contact count, dimensions, area/perimeter and the reference well partition are not circuit constraints. PEX uses actual diffusion geometry and interconnect RC, with logical body nets as its boundary; distributed substrate/well resistance is outside this extraction model.\u003c/p\u003e\n\u003ch3\u003eSolve workflow\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eRead the declared circuit and materials, \u003ccode\u003e/protocol/task.json\u003c/code\u003e for paths, constraints and reviewed resources, and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e for capabilities and helper commands. Task inputs under \u003ccode\u003e/task\u003c/code\u003e and resources under \u003ccode\u003e/resources\u003c/code\u003e are read-only; construct the layout in \u003ccode\u003e/workspace\u003c/code\u003e with the declared tools. With layout MCP, paths and commands refer to the remote EDA workspace. Create your own implementation with real devices, interconnect and pins, using your own tool loop without delegating to other agents; reference layouts and author code are not solver inputs.\u003c/li\u003e\n\u003cli\u003eInspect \u003ccode\u003eresources.external\u003c/code\u003e before using external tools. Each command starts a fresh shell: when tool modules are declared, source \u003ccode\u003e/usr/share/Modules/init/bash\u003c/code\u003e and load the selected tool's modules; export its declared \u003ccode\u003etool_environment\u003c/code\u003e settings in that same command. Repeat as needed and use batch or headless operation. Local manuals, command references, and release notes may be available within the declared EDA installation and PDK resource directories. Locate these resources through \u003ccode\u003e/protocol/task.json\u003c/code\u003e and consult the documentation for the installed tool version when diagnosing unfamiliar syntax or tool failures.\u003c/li\u003e\n\u003cli\u003eGenerate an initial candidate and submit a snapshot early. When \u003ccode\u003eprocess-feedback\u003c/code\u003e is available, check the current GDS with layout MCP \u003ccode\u003echeck\u003c/code\u003e or \u003ccode\u003epython -I /protocol/process_check.py\u003c/code\u003e before the final submission. This runs the final evaluator's complete plan and returns engineering diagnostics and candidate measurements, without scores or normalized quality factors. Checks have no count limit and consume the same wall-clock budget. Inspect the physical and functional results and all scored metrics; successful tool execution alone does not establish requirement satisfaction. Read paginated diagnostics with \u003ccode\u003ereport\u003c/code\u003e when using MCP. Local exploratory checks do not replace this complete check.\u003c/li\u003e\n\u003cli\u003eUse the remaining time for measured improvements to the declared quality objectives. Identify the limiting scored metrics, make targeted layout changes, regenerate and check the candidate, and compare measurements with the previous candidate and the stated scoring targets and trade-offs. Preserve the best valid candidate and revert changes that worsen the overall objective. Repeat while time and useful improvements remain; passing validity checks alone is not a stopping condition.\u003c/li\u003e\n\u003cli\u003eStop optimization when the budget expires, all declared quality objectives are achieved, or measured trials support convergence. If stopping early, explain the changes tried, the metric comparisons and the remaining limitations. Track remaining time through session status. At soft-budget expiry, finish or cancel already-started work and submit immediately; do not start another command, check or optimization round. If an MCP execution is running, use \u003ccode\u003epoll\u003c/code\u003e with its \u003ccode\u003eexecution_id\u003c/code\u003e and the returned \u003ccode\u003enext_offset\u003c/code\u003e as \u003ccode\u003eoffset\u003c/code\u003e until completion, or cancel it and wait for it to stop.\u003c/li\u003e\n\u003cli\u003eFinish or cancel outstanding work, restore your best candidate to the declared output path, and explicitly submit it before ending the session. With layout MCP \u003ccode\u003esubmit\u003c/code\u003e, remove the \u003ccode\u003e/workspace/\u003c/code\u003e prefix from \u003ccode\u003eoutput.path\u003c/code\u003e; with the container interface, run \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e. Wait for the receipt: only the last accepted snapshot is judged, and writing a file alone is not submission. Acceptance confirms delivery; the framework independently evaluates validity and quality after the session.\u003c/li\u003e\n\u003c/ol\u003e\n6:[\"$\",\"$8\",null,{\"fallback\":[\"$\",\"p\",null,{\"children\":\"Loading published evidence…\"}],\"children\":[\"$\",\"$L10\",null,{\"task\":{\"case_path\":\"tasks/ihp-sg13g2/analog-db/cases/sw_001_transmission_gate_pair/case.toml\",\"coefficient\":3,\"collection\":\"analog-db\",\"configuration_url\":\"/ICLayout-Bench/assets/608be9d20fa7a9aa3c19d742fc59003869acd9bf49a8e6ecd0c392f5f58f97f0.txt\",\"description_html\":\"$11\",\"description_path\":\"tasks/ihp-sg13g2/analog-db/cases/sw_001_transmission_gate_pair/problem.md\",\"hours\":8,\"id\":\"ihp-sg13g2.analog-db.sw_001_transmission_gate_pair\",\"inputs\":{\"description\":{\"format\":\"text\",\"path\":\"problem.md\",\"sha256\":\"abf4c21d0fb6ed699fc58c53ba332c84c6e765219b5ace3403bd4ab7645be0fe\"},\"forward\":{\"format\":\"spice\",\"path\":\"materials/forward.spice\",\"sha256\":\"d8ea737f5eb6ecf9db58db71c05a6dc11b214eaa01dec971b3526a9f55647d4c\"},\"netlist\":{\"format\":\"spice\",\"path\":\"materials/circuit.cdl\",\"sha256\":\"876abf23efe2510080ab3e623bc794339d8920bf8a7d30a476b80cdad91e027a\",\"subcircuit\":\"sw_001_transmission_gate_pair\"},\"performance\":{\"format\":\"spice\",\"path\":\"materials/testbench.spice\",\"sha256\":\"864061d38ce90c87d8f9d9dd0025a54bc4f7f2932a45828b1c5bb20f4c6d4c0c\"},\"reverse\":{\"format\":\"spice\",\"path\":\"materials/reverse.spice\",\"sha256\":\"6ddd7fbfd989ab09a10c4127ca4746a6b93f33e5469bb63375bf39c904ecafe2\"},\"simulation\":{\"format\":\"spice\",\"path\":\"materials/circuit.spice\",\"sha256\":\"c5a3d9b82ed9ee :ron_ohm\",\"condition_2:ron_ohm\",\"condition_3:ron_ohm\",\"condition_4:ron_ohm\",\"condition_5:ron_ohm\"],\"requirement\":{\"lower\":0,\"rationale\":\"On-state resistance is the absolute port drop divided by actual source current; a negative resistance cannot represent the declared passive transmission path.\"},\"scale\":1,\"unit\":\"ohm\"},{\"aggregation\":\"max\",\"category\":\"performance\",\"direction\":\"minimize\",\"id\":\"on_current_a\",\"observations\":[\"condition_0:on_current_a\",\"condition_1:on_current_a\",\"condition_2:on_current_a\",\"condition_3:on_current_a\",\"condition_4:on_current_a\",\"condition_5:on_current_a\"],\"requirement\":{\"lower\":1e-9,\"rationale\":\"The 10 mV on-state port difference must produce a resolved current above the declared 1 nA observation floor. An open or unresolved path cannot establish the on-state resistance measurement.\"},\"unit\":\"A\"},{\"aggregation\":\"max\",\"baseline\":[\"source_condition_0:leakage_a\",\"source_condition_1:leakage_a\",\"source_condition_2:leakage_a\",\"source_condition_3:leakage_a\",\"source_condition_4:leakage_a\",\"source_condition_5:leakage_a\"],\"category\":\"performance\",\"dimension\":\"bias\",\"direction\":\"minimize\",\"id\":\"leakage_a\",\"normalization\":\"ratio\",\"observations\":[\"condition_0:leakage_a\",\"condition_1:leakage_a\",\"condition_2:leakage_a\",\"condition_3:leakage_a\",\"condition_4:leakage_a\",\"condition_5:leakage_a\"],\"requirement\":{\"lower\":0,\"rationale\":\"Off-state leakage is an absolute current magnitude; a negative value cannot represent the declared leakage observation.\"},\"scale\":1e-12,\"unit\":\"A\"},{\"aggregation\":\"max\",\"category\":\"performance\",\"direction\":\"minimize\",\"id\":\"kcl_a\",\"observations\":[\"condition_0:kcl_a\",\"condition_1:kcl_a\",\"condition_2:kcl_a\",\"condition_3:kcl_a\",\"condition_4:kcl_a\",\"condition_5:kcl_a\"],\"unit\":\"A\"},{\"aggregation\":\"max\",\"baseline\":[\"source_condition_6:tracking_error_v\",\"source_condi gh_v\",\"condition_11:feedthrough_v\",\"condition_12:feedthrough_v\",\"condition_13:feedthrough_v\",\"condition_14:feedthrough_v\",\"condition_15:feedthrough_v\",\"condition_16:feedthrough_v\",\"condition_17:feedthrough_v\"],\"requirement\":{\"lower\":0,\"rationale\":\"Feedthrough is an absolute voltage disturbance; a negative value cannot represent the declared measurement.\"},\"scale\":0.0001,\"unit\":\"V\"},{\"aggregation\":\"max\",\"baseline\":[\"source_condition_6:hold_shift_v\",\"source_condition_7:hold_shift_v\",\"source_condition_8:hold_shift_v\",\"source_condition_9:hold_shift_v\",\"source_condition_10:hold_shift_v\",\"source_condition_11:hold_shift_v\",\"source_condition_12:hold_shift_v\",\"source_condition_13:hold_shift_v\",\"source_condition_14:hold_shift_v\",\"source_condition_15:hold_shift_v\",\"source_condition_16:hold_shift_v\",\"source_condition_17:hold_shift_v\"],\"category\":\"performance\",\"dimension\":\"response\",\"direction\":\"target\",\"id\":\"hold_shift_v\",\"normalization\":\"target\",\"observations\":[\"condition_6:hold_shift_v\",\"condition_7:hold_shift_v\",\"condition_8:hold_shift_v\",\"condition_9:hold_shift_v\",\"condition_10:hold_shift_v\",\"condition_11:hold_shift_v\",\"condition_12:hold_shift_v\",\"condition_13:hold_shift_v\",\"condition_14:hold_shift_v\",\"condition_15:hold_shift_v\",\"condition_16:hold_shift_v\",\"condition_17:hold_shift_v\"],\"scale\":0.1,\"unit\":\"V\"}],\"pdk\":\"ihp-sg13g2\",\"reader\":{\"category\":\"Mixed-signal\",\"summary\":\"Transfers analog signals bidirectionally through a CMOS transmission gate.\",\"title\":\"Bidirectional CMOS Transmission Gate\"},\"scoring\":{\"area_metric\":\"functional_area\",\"area_target\":300,\"method\":\"layout\",\"rationale\":\"Transmission/chopper switches: on-state conduction 21.4%; off-state leakage 17.1%; transfer fidelity 25.7%; switching disturbance 25.7%; area 10%. Each objective's weight is divided equally among its metrics.\",\"weights\":{\"feedthrough_v\":0.128571428571,\"functional_area\":0.1,\"hold_shift_v\":0.128571428571,\"leakage_a\":0.171428571429,\"ron_ohm\":0.214285714286,\"tracking_error_v\":0.257142857143}},\"sections\":{\"Electrical Requirements and Scoring\":\"$12\",\"Inputs and Interface\":\"\u003cp\u003e\u003ccode\u003ematerials/circuit.cdl\u003c/code\u003e is the authoritative logical circuit netlist; \u003ccode\u003ematerials/circuit.spice\u003c/code\u003e is its simulator representation. \u003ccode\u003ematerials/testbench.spice\u003c/code\u003e, \u003ccode\u003ematerials/forward.spice\u003c/code\u003e, \u003ccode\u003ematerials/reverse.spice\u003c/code\u003e supply the performance stimuli and measurements. \u003ccode\u003eproblem.md\u003c/code\u003e is this contract. Ordered ports: \u003ccode\u003eport_a port_b vctl vctl_not vdd vss\u003c/code\u003e. The fixture supplies complementary controls externally. Both signal/control ports stay within 0–1.5 V. Native body taps remain physically checked; finite well/substrate resistances are outside the Magic RC compact-model boundary.\u003c/p\u003e\\n\",\"Objective\":\"\u003cp\u003eImplement \u003ccode\u003esw_001_transmission_gate_pair\u003c/code\u003e with the complete fixed topology and minimize layout-induced degradation under the declared nominal observations. The fixed IHP binding has one NMOS and one PMOS, each W=2 um, L=0.13 um, m=1. Both connect the bidirectional signal terminals, with the NMOS body at vss and PMOS body at vdd. No internal clock generator is added.\u003c/p\u003e\\n\u003ch3\u003eOptimization objective\u003c/h3\u003e\\n\u003cp\u003eMaximize the declared quality score within the solve budget while satisfying all physical and necessary functional requirements. The first passing DRC, LVS and required electrical checks establish a feasible baseline. Continue improving the scored metrics from that baseline; a passing check or \u003ccode\u003etask_success = true\u003c/code\u003e does not mean that the quality objectives have been achieved.\u003c/p\u003e\\n\",\"Operating Conditions\":\"$13\",\"Physical Requirements\":\"$14\",\"Tools and Submission\":\"$15\"},\"source_url\":\"https://github.com/MacAnalog/spicexplorer-release/tree/263d0322f8900dc331536fbbe6c0e804514fc454/analog-db/circuits/sw_001_transmission_gate_pair\",\"status\":\"qualified\",\"title\":\"Bidirectional CMOS Transmission Gate\",\"core\":false},\"catalog\":{\"tasks\":[],\"runs\":[],\"experiments\":[],\"contexts\":[],\"boards\":[]},\"previewRun\":null,\"preview\":null,\"evidenceError\":false}]}]\nc:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n16:I[27201,[\"/ICLayout-Bench/_next/static/chunks/2h60meymns2z5.js\"],\"IconMark\"]\n9:null\ne:[[\"$\",\"title\",\"0\",{\"children\":\"ICLayout-Bench | Circuit layout intelligence\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Independent evaluation of AI for integrated circuit layout. Compare model scores, explore circuit performance and inspect generated layouts.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/ICLayout-Bench/brand/iclayout-bench.svg\",\"type\":\"image/svg+xml\",\"sizes\":\"any\"}],[\"$\",\"$L16\",\"3\",{}]]\n"])</script></body></html>
