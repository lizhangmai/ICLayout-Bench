,\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[\"$L6\",[[\"$\",\"script\",\"script-0\",{\"src\":\"/ICLayout-Bench/_next/static/chunks/3_2wwayut9q0b.js\",\"async\":true,\"nonce\":\"$undefined\"}]],[\"$\",\"$L7\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.MetadataOutlet\",\"children\":\"$@9\"}]}]]}],{},null,false,null]},null,false,\"$a\"]},null,false,null],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Lb\",null,{\"children\":\"$Lc\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Ld\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.Metadata\",\"children\":\"$Le\"}]}]}],null]}],false]],\"m\":\"$undefined\",\"G\":[\"$f\",[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/ICLayout-Bench/_next/static/chunks/25phisebeeifo.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]]],\"S\":true,\"h\":null,\"r\":\"$undefined\",\"s\":\"$undefined\",\"a\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"U2oZdoUjWqT_XfcDHuQ5i\"}\n10:I[1186,[\"/ICLayout-Bench/_next/static/chunks/3gll1ekbrh320.js\",\"/ICLayout-Bench/_next/static/chunks/3_2wwayut9q0b.js\"],\"default\"]\na:C\n11:T2044,\u003ch1 id=\"problem-two-nmos-temperature-response-core-layout-task\"\u003eTwo-NMOS Temperature-Response Core Layout Task\u003c/h1\u003e\n\u003ch2 id=\"problem-objective\"\u003eObjective\u003c/h2\u003e\n\u003cp\u003eThe fixed GF180 binding contains eight parallel 8/0.28 um upper NMOS with gates tied to their sources, and eight parallel 4/1 um diode-connected lower NMOS. Both groups have grounded bodies. This is a two-group temperature-response core; neither its PTAT name nor a successful simulator exit establishes a useful slope or a converged extracted operating point. Target top cell: \u003ccode\u003etsn_001_ptat_2t\u003c/code\u003e.\u003c/p\u003e\n\u003ch2 id=\"problem-inputs-and-interface\"\u003eInputs and Interface\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003ematerials/circuit.cdl\u003c/code\u003e is the authoritative physical netlist; \u003ccode\u003ematerials/circuit.spice\u003c/code\u003e is the same compact-device circuit for simulation. \u003ccode\u003ematerials/temperature.spice\u003c/code\u003e supplies the shared external fixture and bidirectional temperature sweep. Both source and extracted candidate use the exact same deck, bias, loads, excitation, initial-state procedure and measurement windows. Ordered ports: vdd (supply), vout (sense voltage), vss (both bodies and return).\u003c/p\u003e\n\u003ch2 id=\"problem-operating-conditions\"\u003eOperating Conditions\u003c/h2\u003e\n\u003cp\u003eGF180 nfet_03v3 TT, fixed 1.2 V supply, 1 Tohm probe resistance and 1 pF to ground. No external current bias changes with temperature. Ascending and descending temperature sweeps use 5 C steps. Output and power at -20 through 120 C in 10 C steps are sampled from the same ascending sweep used for slope and curvature. The fixed 50 mV nodeset is a Newton initial guess, not a voltage source or a per-temperature bias adjustment. Sparse 1.3, pivtol=1e-30 S, pivrel=0.001, reltol=1e-7, abstol=1e-18 A, vntol=1e-10 V and gmin=1e-18 S are explicit for both circuits; no rshunt is used.\u003c/p\u003e\n\u003ch2 id=\"problem-physical-requirements\"\u003ePhysical Requirements\u003c/h2\u003e\n\u003cp\u003eUse GF180 native KLayout main rule deck and named-interface LVS; Magic RC extraction with its reviewed 10-way grid subdivision. No case-specific waivers. Candidate extraction must preserve every model, multiplicity, size, resistor value, connection and ordered port. The functional outline includes devices, wells, contacts and all routing layers declared in the public task; annotation and pin labels do not add area. Maximum outline: 5000 by 1000 um. Maximum GDS size: 10485760 bytes. Every device and resistor must be physical; no ideal internal macro or auxiliary servo may be added. External sources, probe loads and storage capacitors belong to the testbench.\u003c/p\u003e\n\u003ch2 id=\"problem-electrical-requirements-and-scoring\"\u003eElectrical Requirements and Scoring\u003c/h2\u003e\n\u003cp\u003ePhysical checks and declared functional bounds remain mandatory. Quality has no\nfixed allowed-degradation threshold. Each \u003ccode\u003esource_*\u003c/code\u003e job simulates the declared\nsource circuit with exactly the same testbench, model resources, parameters,\nload and measurement window as its paired extracted-candidate job. A source\nobservation is the 100-point electrical baseline; it is independent of the\nsubmitted GDS. All individual pairs are retained in the evaluation report.\u003c/p\u003e\n\u003cp\u003eFor a post-layout observation x and its source observation b:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eMaximize: q = x/b; minimize: q = b/x. When a numerical scale s is declared,\nuse (x+s)/(b+s) or its inverse. This handles zero-valued error measurements;\ns is a normalization floor, not an allowed degradation or pass threshold.\u003c/li\u003e\n\u003cli\u003eAmplitude dB: q = 10^((x-b)/20) for maximize, its inverse for minimize.\u003c/li\u003e\n\u003cli\u003eTarget: q = 1/(1+abs(x-b)/s), with a declared physical scale s. Signed and\nzero-valued operating points are never divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eScoring uses \u003ccode\u003elayout\u003c/code\u003e. A metric uses its worst paired quality q. The score is\nS = 100 * product(q_i ** w_i), including area quality\nq_area = area_reference / candidate_functional_area. The weights below sum to\none. Dimensions describe measurements but do not determine their weights.\nPhysical or functional rejection scores zero; missing or invalid measurements\nproduce an unknown score, including measurements with zero weight.\nSource-equivalent performance at the area reference scores 100; improvements\ncan exceed 100. A weight expresses a tradeoff, not a hard acceptance limit.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eDefinition\u003c/th\u003e\n\u003cth\u003eBound\u003c/th\u003e\n\u003cth\u003eQuality\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eIndependent DC temperature-response output\u003c/td\u003e\n\u003ctd\u003e0 to 1.2\u003c/td\u003e\n\u003ctd\u003ebias: target, target, scale=0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eDC supply power at fixed 1.2 V\u003c/td\u003e\n\u003ctd\u003e0 to unbounded\u003c/td\u003e\n\u003ctd\u003esupply: ratio, minimize, scale=1e-15\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eslope_v_c\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV/C\u003c/td\u003e\n\u003ctd\u003eEndpoint temperature slope over -20 to 120 C\u003c/td\u003e\n\u003ctd\u003eunbounded to unbounded\u003c/td\u003e\n\u003ctd\u003eresponse: target, target, scale=0.001\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ecurvature_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eMaximum deviation from endpoint secant over -20 to 120 C\u003c/td\u003e\n\u003ctd\u003e0 to unbounded\u003c/td\u003e\n\u003ctd\u003eresponse: ratio, minimize, scale=1e-06\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eThe simulator uses an explicit branch-current formulation for constant parasitic resistors: a zero-volt current sensor and a current-controlled voltage source impose V=R*I exactly. Every resistance, terminal and extracted capacitance is retained. This avoids loss of tiny node conductances when added to the much larger metal conductance in conventional nodal stamping. The original extraction and the effective simulation netlist are both retained as evidence. Source and candidate use the same backend setting. This deterministic formulation does not model resistor thermal noise; noise is outside this task's scope. KCL and measurement-validity checks remain mandatory. No self-startup, precision temperature sensing or linear PTAT behavior is assumed.\u003c/p\u003e\n\u003cp\u003eStatic output bounds are physical rail-domain checks, nonnegative power/error bounds establish measurement domains, and KCL guards reject inconsistent DC solutions. All required conditions must be valid. No advertised upstream performance is a hard gate. The metric table specifies each target scale and normalization floor. Floors prevent zero-error ratios; scales and floors are normalization units, not acceptance tolerances.\u003c/p\u003e\n\u003cp\u003eFor each metric take the worst same-condition source-paired quality. Target quality is \u003ccode\u003e1/(1+abs(candidate-source)/scale)\u003c/code\u003e; minimizing ratio quality is \u003ccode\u003e(source+scale)/(candidate+scale)\u003c/code\u003e.  Missing/nonfinite/invalid source or candidate measurements and tool failures yield an unknown score; completed physical/functional rejection yields zero. Bounds apply to every observation.\u003c/p\u003e\n\u003cp\u003eCompact area anchor: 1600 um2 = 8 × 10 × 10 um2 upper-device/contact envelopes + 8 × 6 × 8 um2 lower-device/contact envelopes + 416 um2 routing/body-contact allowance, independent of witness area. Coefficient 3: local analog temperature-dependent bias and transfer. The circuit and these anchors are fixed before participant evaluation.\u003c/p\u003e\n\u003ch3 id=\"problem-score-weights\"\u003eScore weights\u003c/h3\u003e\n\u003cp\u003eTemperature-slope cores: temperature slope 42.4%; curvature 31.8%; output endpoints 5.29%; power 10.6%; area 10%. Each objective's weight is divided equally among its metrics.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eslope_v_c\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.423529411764\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ecurvature_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.317647058824\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.052941176471\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.105882352941\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch2 id=\"problem-tools-and-submission\"\u003eTools and Submission\u003c/h2\u003e\n\u003cp\u003eSolve budget: \u003cstrong\u003e6 hours\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eUse the runtime task/protocol and reviewed resource bundle to discover tools and feedback. Submit \u003ccode\u003e/workspace/output/final.gds\u003c/code\u003e explicitly through the protocol; merely writing it is not a submission. The reference and maintainer source records are excluded from solver inputs.\u003c/p\u003e\n12:T1455,\u003cp\u003ePhysical checks and declared functional bounds remain mandatory. Quality has no\nfixed allowed-degradation threshold. Each \u003ccode\u003esource_*\u003c/code\u003e job simulates the declared\nsource circuit with exactly the same testbench, model resources, parameters,\nload and measurement window as its paired extracted-candidate job. A source\nobservation is the 100-point electrical baseline; it is independent of the\nsubmitted GDS. All individual pairs are retained in the evaluation report.\u003c/p\u003e\n\u003cp\u003eFor a post-layout observation x and its source observation b:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eMaximize: q = x/b; minimize: q = b/x. When a numerical scale s is declared,\nuse (x+s)/(b+s) or its inverse. This handles zero-valued error measurements;\ns is a normalization floor, not an allowed degradation or pass threshold.\u003c/li\u003e\n\u003cli\u003eAmplitude dB: q = 10^((x-b)/20) for maximize, its inverse for minimize.\u003c/li\u003e\n\u003cli\u003eTarget: q = 1/(1+abs(x-b)/s), with a declared physical scale s. Signed and\nzero-valued operating points are never divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eScoring uses \u003ccode\u003elayout\u003c/code\u003e. A metric uses its worst paired quality q. The score is\nS = 100 * product(q_i ** w_i), including area quality\nq_area = area_reference / candidate_functional_area. The weights below sum to\none. Dimensions describe measurements but do not determine their weights.\nPhysical or functional rejection scores zero; missing or invalid measurements\nproduce an unknown score, including measurements with zero weight.\nSource-equivalent performance at the area reference scores 100; improvements\ncan exceed 100. A weight expresses a tradeoff, not a hard acceptance limit.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eDefinition\u003c/th\u003e\n\u003cth\u003eBound\u003c/th\u003e\n\u003cth\u003eQuality\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eIndependent DC temperature-response output\u003c/td\u003e\n\u003ctd\u003e0 to 1.2\u003c/td\u003e\n\u003ctd\u003ebias: target, target, scale=0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eDC supply power at fixed 1.2 V\u003c/td\u003e\n\u003ctd\u003e0 to unbounded\u003c/td\u003e\n\u003ctd\u003esupply: ratio, minimize, scale=1e-15\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eslope_v_c\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV/C\u003c/td\u003e\n\u003ctd\u003eEndpoint temperature slope over -20 to 120 C\u003c/td\u003e\n\u003ctd\u003eunbounded to unbounded\u003c/td\u003e\n\u003ctd\u003eresponse: target, target, scale=0.001\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ecurvature_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eMaximum deviation from endpoint secant over -20 to 120 C\u003c/td\u003e\n\u003ctd\u003e0 to unbounded\u003c/td\u003e\n\u003ctd\u003eresponse: ratio, minimize, scale=1e-06\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eThe simulator uses an explicit branch-current formulation for constant parasitic resistors: a zero-volt current sensor and a current-controlled voltage source impose V=R*I exactly. Every resistance, terminal and extracted capacitance is retained. This avoids loss of tiny node conductances when added to the much larger metal conductance in conventional nodal stamping. The original extraction and the effective simulation netlist are both retained as evidence. Source and candidate use the same backend setting. This deterministic formulation does not model resistor thermal noise; noise is outside this task's scope. KCL and measurement-validity checks remain mandatory. No self-startup, precision temperature sensing or linear PTAT behavior is assumed.\u003c/p\u003e\n\u003cp\u003eStatic output bounds are physical rail-domain checks, nonnegative power/error bounds establish measurement domains, and KCL guards reject inconsistent DC solutions. All required conditions must be valid. No advertised upstream performance is a hard gate. The metric table specifies each target scale and normalization floor. Floors prevent zero-error ratios; scales and floors are normalization units, not acceptance tolerances.\u003c/p\u003e\n\u003cp\u003eFor each metric take the worst same-condition source-paired quality. Target quality is \u003ccode\u003e1/(1+abs(candidate-source)/scale)\u003c/code\u003e; minimizing ratio quality is \u003ccode\u003e(source+scale)/(candidate+scale)\u003c/code\u003e.  Missing/nonfinite/invalid source or candidate measurements and tool failures yield an unknown score; completed physical/functional rejection yields zero. Bounds apply to every observation.\u003c/p\u003e\n\u003cp\u003eCompact area anchor: 1600 um2 = 8 × 10 × 10 um2 upper-device/contact envelopes + 8 × 6 × 8 um2 lower-device/contact envelopes + 416 um2 routing/body-contact allowance, independent of witness area. Coefficient 3: local analog temperature-dependent bias and transfer. The circuit and these anchors are fixed before participant evaluation.\u003c/p\u003e\n\u003ch3\u003eScore weights\u003c/h3\u003e\n\u003cp\u003eTemperature-slope cores: temperature slope 42.4%; curvature 31.8%; output endpoints 5.29%; power 10.6%; area 10%. Each objective's weight is divided equally among its metrics.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eslope_v_c\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.423529411764\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ecurvature_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.317647058824\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.052941176471\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.105882352941\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n6:[\"$\",\"$8\",null,{\"fallback\":[\"$\",\"p\",null,{\"children\":\"Loading published evidence…\"}],\"children\":[\"$\",\"$L10\",null,{\"task\":{\"case_path\":\"tasks/gf180mcuD/analog-db/cases/tsn_001_ptat_2t/case.toml\",\"coefficient\":3,\"collection\":\"analog-db\",\"configuration_url\":\"/ICLayout-Bench/assets/ae46695ccced40bea2ff56991b625536b0e5f297958c5f450d761d54b11135c6.txt\",\"description_html\":\"$11\",\"description_path\":\"tasks/gf180mcuD/analog-db/cases/tsn_001_ptat_2t/problem.md\",\"hours\":6,\"id\":\"gf180mcuD.analog-db.tsn_001_ptat_2t\",\"inputs\":{\"description\":{\"format\":\"text\",\"path\":\"problem.md\",\"sha256\":\"9b2ab97119c7c07e140721d1ab21da1af40e521f70bb6b1105e442659124b79e\"},\"netlist\":{\"format\":\"spice\",\"path\":\"materials/circuit.cdl\",\"sha256\":\"534d2b4bdfe4354bd80c0db81495c5d60a73fe20912ba79f3ccb749fadaf7efc\",\"subcircuit\":\"tsn_001_ptat_2t\"},\"simulation\":{\"format\":\"spice\",\"path\":\"materials/circuit.spice\",\"sha256\":\"659c035dbae30f070c26ddc944ba6d79737771d6b3f806d36fce8fcf21a88859\"},\"temperature\":{\"format\":\"spice\",\"path\":\"materials/temperature.spice\",\"sha256\":\"4d79f00df8ece04f2b7c2fca93538c4f1e64561915d78be69d4e86cf841d44ed\"}},\"licenses\":[{\"name\":\"LICENSE\",\"path\":\"tasks/gf180mcuD/analog-db/LICENSE\",\"url\":\"/ICLayout-Bench/assets/d6c09a4f ut_v_7\",\"condition_0:output_v_8\",\"condition_0:output_v_9\",\"condition_0:output_v_10\",\"condition_0:output_v_11\",\"condition_0:output_v_12\",\"condition_0:output_v_13\",\"condition_0:output_v_14\"],\"scale\":0.1,\"unit\":\"V\",\"upper\":1.2},{\"aggregation\":\"max\",\"baseline\":[\"source_condition_0:power_w_0\",\"source_condition_0:power_w_1\",\"source_condition_0:power_w_2\",\"source_condition_0:power_w_3\",\"source_condition_0:power_w_4\",\"source_condition_0:power_w_5\",\"source_condition_0:power_w_6\",\"source_condition_0:power_w_7\",\"source_condition_0:power_w_8\",\"source_condition_0:power_w_9\",\"source_condition_0:power_w_10\",\"source_condition_0:power_w_11\",\"source_condition_0:power_w_12\",\"source_condition_0:power_w_13\",\"source_condition_0:power_w_14\"],\"category\":\"performance\",\"dimension\":\"supply\",\"direction\":\"minimize\",\"id\":\"power_w\",\"lower\":0,\"normalization\":\"ratio\",\"observations\":[\"condition_0:power_w_0\",\"condition_0:power_w_1\",\"condition_0:power_w_2\",\"condition_0:power_w_3\",\"condition_0:power_w_4\",\"condition_0:power_w_5\",\"condition_0:power_w_6\",\"condition_0:power_w_7\",\"condition_0:power_w_8\",\"condition_0:power_w_9\",\"condition_0:power_w_10\",\"condition_0:power_w_11\",\"condition_0:power_w_12\",\"condition_0:power_w_13\",\"condition_0:power_w_14\"],\"scale\":1e-15,\"unit\":\"W\"},{\"aggregation\":\"max\",\"baseline\":[\"source_condition_0:slope_v_c\"],\"category\":\"performance\",\"dimension\":\"response\",\"direction\":\"target\",\"id\":\"slope_v_c\",\"normalization\":\"target\",\"observations\":[\"condition_0:slope_v_c\"],\"scale\":0.001,\"unit\":\"V/C\"},{\"aggregation\":\"max\",\"baseline\":[\"source_condition_0:curvature_v\"],\"category\":\"performance\",\"dimension\":\"response\",\"direction\":\"minimize\",\"id\":\"curvature_v\",\"lower\":0,\"normalization\":\"ratio\",\"observations\":[\"condition_0:curvature_v\"],\"scale\":0.000001,\"unit\":\"V\"}],\"pdk\":\"gf180mcuD\",\"reader\":{\"category\":\"Power \u0026 references\",\"summary\":\"Produces a temperature-dependent response whose slope and curvature are measured across the declared range.\",\"title\":\"Two-NMOS Temperature-Response Core\"},\"schematic_url\":\"/ICLayout-Bench/assets/e8b422f5c0b6260f5b19aeba4f038bd1a5dfa4f99028778bcd90effd27dd6e48.svg\",\"scoring\":{\"area_metric\":\"functional_area\",\"area_target\":1600,\"method\":\"layout\",\"rationale\":\"Temperature-slope cores: temperature slope 42.4%; curvature 31.8%; output endpoints 5.29%; power 10.6%; area 10%. Each objective's weight is divided equally among its metrics.\",\"weights\":{\"curvature_v\":0.317647058824,\"functional_area\":0.1,\"output_v\":0.052941176471,\"power_w\":0.105882352941,\"slope_v_c\":0.423529411764}},\"sections\":{\"Electrical Requirements and Scoring\":\"$12\",\"Objective\":\"\u003cp\u003eThe fixed GF180 binding contains eight parallel 8/0.28 um upper NMOS with gates tied to their sources, and eight parallel 4/1 um diode-connected lower NMOS. Both groups have grounded bodies. This is a two-group temperature-response core; neither its PTAT name nor a successful simulator exit establishes a useful slope or a converged extracted operating point. Target top cell: \u003ccode\u003etsn_001_ptat_2t\u003c/code\u003e.\u003c/p\u003e\\n\",\"Operating Conditions\":\"\u003cp\u003eGF180 nfet_03v3 TT, fixed 1.2 V supply, 1 Tohm probe resistance and 1 pF to ground. No external current bias changes with temperature. Ascending and descending temperature sweeps use 5 C steps. Output and power at -20 through 120 C in 10 C steps are sampled from the same ascending sweep used for slope and curvature. The fixed 50 mV nodeset is a Newton initial guess, not a voltage source or a per-temperature bias adjustment. Sparse 1.3, pivtol=1e-30 S, pivrel=0.001, reltol=1e-7, abstol=1e-18 A, vntol=1e-10 V and gmin=1e-18 S are explicit for both circuits; no rshunt is used.\u003c/p\u003e\\n\",\"Physical Requirements\":\"\u003cp\u003eUse GF180 native KLayout main rule deck and named-interface LVS; Magic RC extraction with its reviewed 10-way grid subdivision. No case-specific waivers. Candidate extraction must preserve every model, multiplicity, size, resistor value, connection and ordered port. The functional outline includes devices, wells, contacts and all routing layers declared in the public task; annotation and pin labels do not add area. Maximum outline: 5000 by 1000 um. Maximum GDS size: 10485760 bytes. Every device and resistor must be physical; no ideal internal macro or auxiliary servo may be added. External sources, probe loads and storage capacitors belong to the testbench.\u003c/p\u003e\\n\"},\"source_url\":\"https://github.com/MacAnalog/spicexplorer-release/tree/263d0322f8900dc331536fbbe6c0e804514fc454/analog-db/circuits/tsn_001_ptat_2t\",\"status\":\"qualified\",\"title\":\"Two-NMOS Temperature-Response Core\"},\"catalog\":{\"boards\":[],\"contexts\":[],\"experiments\":[],\"runs\":[],\"tasks\":[]},\"evidenceError\":false}]}]\nc:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n13:I[27201,[\"/ICLayout-Bench/_next/static/chunks/3gll1ekbrh320.js\"],\"IconMark\"]\n9:null\ne:[[\"$\",\"title\",\"0\",{\"children\":\"ICLayout-Bench | Circuit layout intelligence\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Measured progress in AI-driven integrated circuit layout. Explore circuits, model conditions and reviewed experimental evidence.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/ICLayout-Bench/brand/iclayout-bench.svg\",\"type\":\"image/svg+xml\",\"sizes\":\"any\"}],[\"$\",\"$L13\",\"3\",{}]]\n"])</script></body></html>
