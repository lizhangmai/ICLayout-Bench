efined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L5\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[\"$L6\",[[\"$\",\"script\",\"script-0\",{\"src\":\"/ICLayout-Bench/_next/static/chunks/27jip_2vcvnd5.js\",\"async\":true,\"nonce\":\"$undefined\"}]],[\"$\",\"$L7\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.MetadataOutlet\",\"children\":\"$@9\"}]}]]}],{},null,false,null]},null,false,\"$a\"]},null,false,null],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Lb\",null,{\"children\":\"$Lc\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Ld\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.Metadata\",\"children\":\"$Le\"}]}]}],null]}],false]],\"m\":\"$undefined\",\"G\":[\"$f\",[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/ICLayout-Bench/_next/static/chunks/3sa54_ghi1h2h.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]]],\"S\":true,\"h\":null,\"r\":\"$undefined\",\"s\":\"$undefined\",\"a\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"2hqB741EA4j7xWQVg6hu-\"}\n10:I[1186,[\"/ICLayout-Bench/_next/static/chunks/2h60meymns2z5.js\",\"/ICLayout-Bench/_next/static/chunks/27jip_2vcvnd5.js\"],\"default\"]\na:C\n11:T35c3,\u003ch1 id=\"problem-self-biased-cascode-common-source-gain-stage-layout-task\"\u003eSelf-Biased Cascode Common-Source Gain Stage Layout Task\u003c/h1\u003e\n\u003ch2 id=\"problem-objective\"\u003eObjective\u003c/h2\u003e\n\u003cp\u003eImplement the fixed \u003ccode\u003egs_001_cascode_cs\u003c/code\u003e circuit in GF180MCU D and submit self-contained GDS.\nNine MOS devices form a cascode common-source stage with PMOS and NMOS bias ladders. An external 20 uA sink biases the PMOS ladder. Total widths, lengths and multiplicities follow the fixed GF180 binding. Physical body contacts and an independently constructed reference complete the circuit.\u003c/p\u003e\n\u003ch3 id=\"problem-optimization-objective\"\u003eOptimization objective\u003c/h3\u003e\n\u003cp\u003eMaximize the declared quality score within the solve budget while satisfying all physical and necessary functional requirements. The first passing DRC, LVS and required electrical checks establish a feasible baseline. Continue improving the scored metrics from that baseline; a passing check or \u003ccode\u003etask_success = true\u003c/code\u003e does not mean that the quality objectives have been achieved.\u003c/p\u003e\n\u003ch2 id=\"problem-inputs-and-interface\"\u003eInputs and Interface\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003ematerials/circuit.spice\u003c/code\u003e is authoritative for LVS and source calibration;\n\u003ccode\u003ematerials/testbench.spice\u003c/code\u003e defines every electrical measurement. This problem\nis the description input. Ordered ports: \u003ccode\u003evdd vout vin ibias vss\u003c/code\u003e.\nIn order, these are: Supply, output, signal input, PMOS reference-current sink, and return.\u003c/p\u003e\n\u003cp\u003ePreserve netlist connectivity, dimensions, multiplicities and body terminals. Provide physical well/substrate contacts for the declared supplies. Placement, routing, splitting and source/drain exchange must satisfy the declared LVS equivalence rules. Common-centroid placement and statistical matching are unscored. Ideal external stimuli, biases and loads belong to the testbench, outside the DUT.\u003c/p\u003e\n\u003ch2 id=\"problem-operating-conditions\"\u003eOperating Conditions\u003c/h2\u003e\n\u003cp\u003eUse the typical GF180 3.3 V MOS models and physical poly models where present,\nwith statistical variation disabled. Unless swept explicitly, temperature is 27 C.\nVSS = 0 V; VDD = 2.7, 3.0 and 3.3 V; external 20 uA sink from ibias to VSS; external 1 pF output load. A 1 TH external inductor connects output to input for the DC trip-point solve. A 1 F external coupling capacitor injects a unit AC input through acin while isolating the DC fixture. This measures open-loop small-signal gain at each self-biased trip point; it does not prescribe a fixed DC input voltage.\u003c/p\u003e\n\u003cp\u003eAC sweeps 100 points per decade from 1 Hz to 1 GHz. Under unit AC injection, gain-stage transfer is V(vout); under unit differential excitation, differential-pair transfer is V(voutn)-V(voutp); OTA transfer is defined above.\u003c/p\u003e\n\u003ch2 id=\"problem-physical-requirements\"\u003ePhysical Requirements\u003c/h2\u003e\n\u003cp\u003eSubmit top cell \u003ccode\u003egs_001_cascode_cs\u003c/code\u003e with every named electrical port, resolved hierarchy\nand a file size at most 10 MiB. Artifact, GF180 variant-D DRC including antenna,\nstrict named-port LVS and geometry must pass, without DRC waivers. Chip-level\ndensity and seal-ring closure are outside this standalone-block scope.\u003c/p\u003e\n\u003cp\u003eThe functional bounding box must fit within 220 by 120 um. Area includes all\nprocess device and routing drawing layers listed in runtime constraints:\nwells, implants, active, poly, contacts, metals/vias and passive/device markers.\nAnnotation and pin-purpose shapes are excluded; all functional routing must use\ndrawing layers. The complete layer list is frozen in \u003ccode\u003e/protocol/task.json\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eThe judge independently extracts distributed wiring resistance and capacitance\nfrom the submitted GDS, retaining candidate-derived MOS/passive geometry and\nexternal body connections. Every scored simulation consumes that extracted DUT.\nThis model boundary does not include a distributed silicon substrate network.\nTransient settling, fixed-input bias robustness, noise, mismatch, PVT and EM are outside scope. Manufacturing signoff is not claimed.\u003c/p\u003e\n\u003ch2 id=\"problem-electrical-requirements-and-scoring\"\u003eElectrical Requirements and Scoring\u003c/h2\u003e\n\u003cp\u003eArtifact, geometry, DRC, LVS and declared functional requirements must pass. Parasitic extraction is also mandatory: it must produce a complete, electrically consistent netlist usable by the required post-layout simulations. A completed candidate rejection scores zero; infrastructure errors do not establish candidate failure.\u003c/p\u003e\n\u003cp\u003eComplete all three conditions, with every observation finite and within its inclusive interval. Aggregation must not hide a failed condition; missing crossings or incomplete extraction/simulation cannot establish success. Retain waveforms for independent reconstruction of observations.\u003c/p\u003e\n\u003cp\u003ePhysical checks and the declared functional bounds must pass. Quality scoring imposes no fixed degradation allowance. Each \u003ccode\u003esource_*\u003c/code\u003e job and its corresponding candidate extracted circuit use exactly the same testbench, model resources, parameters, loads and measurement windows. Independent source observations define the 100-point electrical baseline without depending on the submitted GDS; reports retain every paired result.\u003c/p\u003e\n\u003cp\u003eLet x be the post-layout measurement and b the source-circuit measurement under the same conditions:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eRatio normalization: maximize with q = x/b and minimize with q = b/x. When a numerical scale s is declared, use (x+s)/(b+s) and its reciprocal, respectively. The scale handles zero values as a normalization floor; it is neither an allowed degradation nor an acceptance bound.\u003c/li\u003e\n\u003cli\u003eAmplitude in dB: maximize with q = 10^((x-b)/20) and minimize with its reciprocal.\u003c/li\u003e\n\u003cli\u003eTarget normalization: q = 1/(1+abs(x-b)/s), where s is the declared physical scale. Signed or zero-valued operating points are not divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eUse \u003ccode\u003elayout\u003c/code\u003e scoring. Each metric takes its worst paired quality q, and the total score is S = 100 * product(min(1, q_i) ** w_i), with area quality q_area = area_reference / candidate_functional_area. The weights below sum to 1; metric dimensions describe measurements and do not determine weights. Physical, extraction, or functional rejection scores zero; other missing or invalid measurements leave the score unknown, and zero-weight observations must also be valid. Matching source-circuit performance at the reference area scores 100 points; each metric is capped at quality 1, so scores cannot exceed 100. Weights express quality tradeoffs rather than hard bounds.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eDefinition / observation\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eQuality normalization\u003c/th\u003e\n\u003cth\u003eFunctional range\u003c/th\u003e\n\u003cth\u003eScale\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC output voltage\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 3.3\u003c/td\u003e\n\u003ctd\u003e3.3\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebias_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC V(ibias)\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 3.3\u003c/td\u003e\n\u003ctd\u003e3.3\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC power delivered by VDD, -V(vdd)*I(VDD)\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003egain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e20 log10(abs(transfer)) at 10 Hz\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003emaximize / db20\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebandwidth_hz\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eFirst frequency where transfer gain falls 3 dB below its 10 Hz value\u003c/td\u003e\n\u003ctd\u003eHz\u003c/td\u003e\n\u003ctd\u003emaximize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eArea reference: \u003cstrong\u003e394.4 um2\u003c/strong\u003e. The expanded circuit has 9 device instances, a sum of device/contact envelopes 220.6500 um2, a one-sided envelope margin of 1 um, a routing allowance of 50%, and a total outer width/height allowance 2 um. Estimate = ceil(100 * (1.5 * envelope_sum + 2 * margin * sqrt(envelope_sum) + margin^2)) / 100. Here margin is the total allowance across both sides, and the envelope sum is displayed to four decimal places. MOS/passive envelopes use W/L (or resistor dimensions) and multiplicity, including explicit contacts and HBT emitter/contact envelopes. This is a frozen engineering estimate, not a process minimum or a proven achievable area.\u003c/p\u003e\n\u003cp\u003eThe capability coefficient is \u003cstrong\u003e4\u003c/strong\u003e, independent of this task's reference-normalized score.\u003c/p\u003e\n\u003ch3 id=\"problem-score-weights\"\u003eScore weights\u003c/h3\u003e\n\u003cp\u003eLocal gain stages: signal transfer 50%; bandwidth 15%; operating points 5%; power 15%; area 15%. Each objective's weight is divided equally among its metrics.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.15\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003egain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.500000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebandwidth_hz\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.150000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebias_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.025000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.025000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.150000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch2 id=\"problem-tools-and-submission\"\u003eTools and Submission\u003c/h2\u003e\n\u003cp\u003eSoft solve budget: \u003cstrong\u003e3 hours\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eUse the reviewed GF180 resources in the \u003ccode\u003eresources\u003c/code\u003e field of \u003ccode\u003e/protocol/task.json\u003c/code\u003e. KLayout checks the layout, Magic extracts RC and ngspice simulates. \u003ccode\u003e/protocol/task.json\u003c/code\u003e supplies frozen constraints and evaluation requirements; \u003ccode\u003e/protocol/harness.json\u003c/code\u003e describes the runtime protocol. If \u003ccode\u003eprocess-feedback\u003c/code\u003e is provided, its public helpers may be used for intermediate checks. Write \u003ccode\u003e/workspace/output/final.gds\u003c/code\u003e, then run \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e to submit explicitly.\u003c/p\u003e\n\u003cp\u003eUse a GDS database unit of 0.001 um as required by GF180MCU DRC rules.\u003c/p\u003e\n\u003ch3 id=\"problem-solve-workflow\"\u003eSolve workflow\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eRead the declared circuit and materials, \u003ccode\u003e/protocol/task.json\u003c/code\u003e for paths, constraints and reviewed resources, and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e for capabilities and helper commands. Task inputs under \u003ccode\u003e/task\u003c/code\u003e and resources under \u003ccode\u003e/resources\u003c/code\u003e are read-only; construct the layout in \u003ccode\u003e/workspace\u003c/code\u003e with the declared tools. With layout MCP, paths and commands refer to the remote EDA workspace. Create your own implementation with real devices, interconnect and pins, using your own tool loop without delegating to other agents; reference layouts and author code are not solver inputs.\u003c/li\u003e\n\u003cli\u003eInspect \u003ccode\u003eresources.external\u003c/code\u003e before using external tools. Each command starts a fresh shell: when tool modules are declared, source \u003ccode\u003e/usr/share/Modules/init/bash\u003c/code\u003e and load the selected tool's modules; export its declared \u003ccode\u003etool_environment\u003c/code\u003e settings in that same command. Repeat as needed and use batch or headless operation. Local manuals, command references, and release notes may be available within the declared EDA installation and PDK resource directories. Locate these resources through \u003ccode\u003e/protocol/task.json\u003c/code\u003e and consult the documentation for the installed tool version when diagnosing unfamiliar syntax or tool failures.\u003c/li\u003e\n\u003cli\u003eGenerate an initial candidate and submit a snapshot early. When \u003ccode\u003eprocess-feedback\u003c/code\u003e is available, check the current GDS with layout MCP \u003ccode\u003echeck\u003c/code\u003e or \u003ccode\u003epython -I /protocol/process_check.py\u003c/code\u003e before the final submission. This runs the final evaluator's complete plan and returns engineering diagnostics and candidate measurements, without scores or normalized quality factors. Checks have no count limit and consume the same wall-clock budget. Inspect the physical and functional results and all scored metrics; successful tool execution alone does not establish requirement satisfaction. Read paginated diagnostics with \u003ccode\u003ereport\u003c/code\u003e when using MCP. Local exploratory checks do not replace this complete check.\u003c/li\u003e\n\u003cli\u003eUse the remaining time for measured improvements to the declared quality objectives. Identify the limiting scored metrics, make targeted layout changes, regenerate and check the candidate, and compare measurements with the previous candidate and the stated scoring targets and trade-offs. Preserve the best valid candidate and revert changes that worsen the overall objective. Repeat while time and useful improvements remain; passing validity checks alone is not a stopping condition.\u003c/li\u003e\n\u003cli\u003eStop optimization when the budget expires, all declared quality objectives are achieved, or measured trials support convergence. If stopping early, explain the changes tried, the metric comparisons and the remaining limitations. Track remaining time through session status. At soft-budget expiry, finish or cancel already-started work and submit immediately; do not start another command, check or optimization round. If an MCP execution is running, use \u003ccode\u003epoll\u003c/code\u003e with its \u003ccode\u003eexecution_id\u003c/code\u003e and the returned \u003ccode\u003enext_offset\u003c/code\u003e as \u003ccode\u003eoffset\u003c/code\u003e until completion, or cancel it and wait for it to stop.\u003c/li\u003e\n\u003cli\u003eFinish or cancel outstanding work, restore your best candidate to the declared output path, and explicitly submit it before ending the session. With layout MCP \u003ccode\u003esubmit\u003c/code\u003e, remove the \u003ccode\u003e/workspace/\u003c/code\u003e prefix from \u003ccode\u003eoutput.path\u003c/code\u003e; with the container interface, run \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e. Wait for the receipt: only the last accepted snapshot is judged, and writing a file alone is not submission. Acceptance confirms delivery; the framework independently evaluates validity and quality after the session.\u003c/li\u003e\n\u003c/ol\u003e\n12:T13bd,\u003cp\u003eArtifact, geometry, DRC, LVS and declared functional requirements must pass. Parasitic extraction is also mandatory: it must produce a complete, electrically consistent netlist usable by the required post-layout simulations. A completed candidate rejection scores zero; infrastructure errors do not establish candidate failure.\u003c/p\u003e\n\u003cp\u003eComplete all three conditions, with every observation finite and within its inclusive interval. Aggregation must not hide a failed condition; missing crossings or incomplete extraction/simulation cannot establish success. Retain waveforms for independent reconstruction of observations.\u003c/p\u003e\n\u003cp\u003ePhysical checks and the declared functional bounds must pass. Quality scoring imposes no fixed degradation allowance. Each \u003ccode\u003esource_*\u003c/code\u003e job and its corresponding candidate extracted circuit use exactly the same testbench, model resources, parameters, loads and measurement windows. Independent source observations define the 100-point electrical baseline without depending on the submitted GDS; reports retain every paired result.\u003c/p\u003e\n\u003cp\u003eLet x be the post-layout measurement and b the source-circuit measurement under the same conditions:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eRatio normalization: maximize with q = x/b and minimize with q = b/x. When a numerical scale s is declared, use (x+s)/(b+s) and its reciprocal, respectively. The scale handles zero values as a normalization floor; it is neither an allowed degradation nor an acceptance bound.\u003c/li\u003e\n\u003cli\u003eAmplitude in dB: maximize with q = 10^((x-b)/20) and minimize with its reciprocal.\u003c/li\u003e\n\u003cli\u003eTarget normalization: q = 1/(1+abs(x-b)/s), where s is the declared physical scale. Signed or zero-valued operating points are not divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eUse \u003ccode\u003elayout\u003c/code\u003e scoring. Each metric takes its worst paired quality q, and the total score is S = 100 * product(min(1, q_i) ** w_i), with area quality q_area = area_reference / candidate_functional_area. The weights below sum to 1; metric dimensions describe measurements and do not determine weights. Physical, extraction, or functional rejection scores zero; other missing or invalid measurements leave the score unknown, and zero-weight observations must also be valid. Matching source-circuit performance at the reference area scores 100 points; each metric is capped at quality 1, so scores cannot exceed 100. Weights express quality tradeoffs rather than hard bounds.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eDefinition / observation\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eQuality normalization\u003c/th\u003e\n\u003cth\u003eFunctional range\u003c/th\u003e\n\u003cth\u003eScale\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC output voltage\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 3.3\u003c/td\u003e\n\u003ctd\u003e3.3\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebias_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC V(ibias)\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 3.3\u003c/td\u003e\n\u003ctd\u003e3.3\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC power delivered by VDD, -V(vdd)*I(VDD)\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003egain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e20 log10(abs(transfer)) at 10 Hz\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003emaximize / db20\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebandwidth_hz\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eFirst frequency where transfer gain falls 3 dB below its 10 Hz value\u003c/td\u003e\n\u003ctd\u003eHz\u003c/td\u003e\n\u003ctd\u003emaximize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eArea reference: \u003cstrong\u003e394.4 um2\u003c/strong\u003e. The expanded circuit has 9 device instances, a sum of device/contact envelopes 220.6500 um2, a one-sided envelope margin of 1 um, a routing allowance of 50%, and a total outer width/height allowance 2 um. Estimate = ceil(100 * (1.5 * envelope_sum + 2 * margin * sqrt(envelope_sum) + margin^2)) / 100. Here margin is the total allowance across both sides, and the envelope sum is displayed to four decimal places. MOS/passive envelopes use W/L (or resistor dimensions) and multiplicity, including explicit contacts and HBT emitter/contact envelopes. This is a frozen engineering estimate, not a process minimum or a proven achievable area.\u003c/p\u003e\n\u003cp\u003eThe capability coefficient is \u003cstrong\u003e4\u003c/strong\u003e, independent of this task's reference-normalized score.\u003c/p\u003e\n\u003ch3\u003eScore weights\u003c/h3\u003e\n\u003cp\u003eLocal gain stages: signal transfer 50%; bandwidth 15%; operating points 5%; power 15%; area 15%. Each objective's weight is divided equally among its metrics.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.15\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003egain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.500000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebandwidth_hz\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.150000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebias_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.025000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.025000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.150000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n13:T4ad,\u003cp\u003eSubmit top cell \u003ccode\u003egs_001_cascode_cs\u003c/code\u003e with every named electrical port, resolved hierarchy\nand a file size at most 10 MiB. Artifact, GF180 variant-D DRC including antenna,\nstrict named-port LVS and geometry must pass, without DRC waivers. Chip-level\ndensity and seal-ring closure are outside this standalone-block scope.\u003c/p\u003e\n\u003cp\u003eThe functional bounding box must fit within 220 by 120 um. Area includes all\nprocess device and routing drawing layers listed in runtime constraints:\nwells, implants, active, poly, contacts, metals/vias and passive/device markers.\nAnnotation and pin-purpose shapes are excluded; all functional routing must use\ndrawing layers. The complete layer list is frozen in \u003ccode\u003e/protocol/task.json\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eThe judge independently extracts distributed wiring resistance and capacitance\nfrom the submitted GDS, retaining candidate-derived MOS/passive geometry and\nexternal body connections. Every scored simulation consumes that extracted DUT.\nThis model boundary does not include a distributed silicon substrate network.\nTransient settling, fixed-input bias robustness, noise, mismatch, PVT and EM are outside scope. Manufacturing signoff is not claimed.\u003c/p\u003e\n14:T118c,\u003cp\u003eSoft solve budget: \u003cstrong\u003e3 hours\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eUse the reviewed GF180 resources in the \u003ccode\u003eresources\u003c/code\u003e field of \u003ccode\u003e/protocol/task.json\u003c/code\u003e. KLayout checks the layout, Magic extracts RC and ngspice simulates. \u003ccode\u003e/protocol/task.json\u003c/code\u003e supplies frozen constraints and evaluation requirements; \u003ccode\u003e/protocol/harness.json\u003c/code\u003e describes the runtime protocol. If \u003ccode\u003eprocess-feedback\u003c/code\u003e is provided, its public helpers may be used for intermediate checks. Write \u003ccode\u003e/workspace/output/final.gds\u003c/code\u003e, then run \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e to submit explicitly.\u003c/p\u003e\n\u003cp\u003eUse a GDS database unit of 0.001 um as required by GF180MCU DRC rules.\u003c/p\u003e\n\u003ch3\u003eSolve workflow\u003c/h3\u003e\n\u003 r normalized quality factors. Checks have no count limit and consume the same wall-clock budget. Inspect the physical and functional results and all scored metrics; successful tool execution alone does not establish requirement satisfaction. Read paginated diagnostics with \u003ccode\u003ereport\u003c/code\u003e when using MCP. Local exploratory checks do not replace this complete check.\u003c/li\u003e\n\u003cli\u003eUse the remaining time for measured improvements to the declared quality objectives. Identify the limiting scored metrics, make targeted layout changes, regenerate and check the candidate, and compare measurements with the previous candidate and the stated scoring targets and trade-offs. Preserve the best valid candidate and revert changes that worsen the overall objective. Repeat while time and useful improvements remain; passing validity checks alone is not a stopping condition.\u003c/li\u003e\n\u003cli\u003eStop optimization when the budget expires, all declared quality objectives are achieved, or measured trials support convergence. If stopping early, explain the changes tried, the metric comparisons and the remaining limitations. Track remaining time through session status. At soft-budget expiry, finish or cancel already-started work and submit immediately; do not start another command, check or optimization round. If an MCP execution is running, use \u003ccode\u003epoll\u003c/code\u003e with its \u003ccode\u003eexecution_id\u003c/code\u003e and the returned \u003ccode\u003enext_offset\u003c/code\u003e as \u003ccode\u003eoffset\u003c/code\u003e until completion, or cancel it and wait for it to stop.\u003c/li\u003e\n\u003cli\u003eFinish or cancel outstanding work, restore your best candidate to the declared output path, and explicitly submit it before ending the session. With layout MCP \u003ccode\u003esubmit\u003c/code\u003e, remove the \u003ccode\u003e/workspace/\u003c/code\u003e prefix from \u003ccode\u003eoutput.path\u003c/code\u003e; with the container interface, run \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e. Wait for the receipt: only the last accepted snapshot is judged, and writing a file alone is not submission. Acceptance confirms delivery; the framework independently evaluates validity and quality after the session.\u003c/li\u003e\n\u003c/ol\u003e\n6:[\"$\",\"$8\",null,{\"fallback\":[\"$\",\"p\",null,{\"children\":\"Loading published evidence…\"}],\"children\":[\"$\",\"$L10\",null,{\"task\":{\"case_path\":\"tasks/gf180mcuD/analog-db/cases/gs_001_cascode_cs/case.toml\",\"coefficient\":4,\"collection\":\"analog-db\",\"configuration_url\":\"/ICLayout-Bench/assets/a053ba1bf0970494a8ed8133fa07b045d87dbe264525e80efa279df0fa6cd773.txt\",\"description_html\":\"$11\",\"description_path\":\"tasks/gf180mcuD/analog-db/cases/gs_001_cascode_cs/problem.md\",\"hours\":3,\"id\":\"gf180mcuD.analog-db.gs_001_cascode_cs\",\"inputs\":{\"description\":{\"format\":\"text\",\"path\":\"problem.md\",\"sha256\":\"be1455e1763845da18e50bde529d7032fc55ea9cb4f2f9c0aa823a6f2b2e088c\"},\"netlist\":{\"format\":\"spice\",\"path\":\"materials/circuit.spice\",\"sha256\":\"59d815c21e17878429aab496b999cfcde2168c09f125d99e8b91644f5fd70299\",\"subcircuit\":\"gs_001_cascode_cs\"},\"performance\":{\"format\":\"spice\",\"path\":\"materials/testbench.spice\",\"sha256\":\"182498243211efc71f8506f7d21f790c78721cd4b334dae4afb20ad3ceef8d0a\"}},\"licenses\":[{\"name\":\"LICENSE\",\"path\":\"tasks/gf180mcuD/analog-db/LICENSE\",\"url\":\"/ICLayout-Bench/assets/d6c09a4fa902f192f05e697110788e520f294a97446ababab65986137c16fceb.txt\"},{\"name\":\"NOTICE\",\"path\":\"tasks/gf180mcuD/analog-db/NOTICE\",\"url\":\"/ICLayout-Bench/assets/75d61165620fd72b89f65e52c2b6c85b73d410bd293062873390bd20ab820a41.txt\"}],\"materials\":[{\"name\":\"problem.md\",\"role\":\"description\",\"url\":\"/ICLayout-Bench/assets/be1455e1763845da18e50bde529d7032fc55ea9cb4f2f9c0aa823a6f2b2e088c.txt\"},{\"name\":\"materials/circuit.spice\",\"role\":\"netlist\",\"url dition_2:power_w\"],\"requirement\":{\"lower\":0,\"rationale\":\"The declared powered circuit or passive driven network must consume nonnegative net supply/driver energy or quiescent current under the complete stated observation.\"},\"scale\":1e-12,\"unit\":\"W\"},{\"aggregation\":\"min\",\"baseline\":[\"source_condition_0:gain_db\",\"source_condition_1:gain_db\",\"source_condition_2:gain_db\"],\"category\":\"performance\",\"dimension\":\"response\",\"direction\":\"maximize\",\"id\":\"gain_db\",\"normalization\":\"db20\",\"observations\":[\"condition_0:gain_db\",\"condition_1:gain_db\",\"condition_2:gain_db\"],\"unit\":\"dB\"},{\"aggregation\":\"min\",\"baseline\":[\"source_condition_0:bandwidth_hz\",\"source_condition_1:bandwidth_hz\",\"source_condition_2:bandwidth_hz\"],\"category\":\"performance\",\"dimension\":\"response\",\"direction\":\"maximize\",\"id\":\"bandwidth_hz\",\"normalization\":\"ratio\",\"observations\":[\"condition_0:bandwidth_hz\",\"condition_1:bandwidth_hz\",\"condition_2:bandwidth_hz\"],\"requirement\":{\"lower\":0,\"rationale\":\"The observed frequency or ordered-event interval has a nonnegative measurement domain; the required crossing must exist for a usable observation.\"},\"unit\":\"Hz\"}],\"pdk\":\"gf180mcuD\",\"reader\":{\"category\":\"Amplifiers \u0026 RF\",\"summary\":\"Provides voltage gain through a self-biased cascode common-source stage.\",\"title\":\"Self-Biased Cascode Common-Source Gain Stage\"},\"scoring\":{\"area_metric\":\"functional_area\",\"area_target\":394.4,\"method\":\"layout\",\"rationale\":\"Local gain stages: signal transfer 50%; bandwidth 15%; operating points 5%; power 15%; area 15%. Each objective's weight is divided equally among its metrics.\",\"weights\":{\"bandwidth_hz\":0.15,\"bias_v\":0.025,\"functional_area\":0.15,\"gain_db\":0.5,\"output_v\":0.025,\"power_w\":0.15}},\"sections\":{\"Electrical Requirements and Scoring\":\"$12\",\"Inputs and Interface\":\"\u003cp\u003e\u003ccode\u003ematerials/circuit.spice\u003c/code\u003e is authoritative for LVS and source calibration;\\n\u003ccode\u003ematerials/testbench.spice\u003c/code\u003e defines every electrical measurement. This problem\\nis the description input. Ordered ports: \u003ccode\u003evdd vout vin ibias vss\u003c/code\u003e.\\nIn order, these are: Supply, output, signal input, PMOS reference-current sink, and return.\u003c/p\u003e\\n\u003cp\u003ePreserve netlist connectivity, dimensions, multiplicities and body terminals. Provide physical well/substrate contacts for the declared supplies. Placement, routing, splitting and source/drain exchange must satisfy the declared LVS equivalence rules. Common-centroid placement and statistical matching are unscored. Ideal external stimuli, biases and loads belong to the testbench, outside the DUT.\u003c/p\u003e\\n\",\"Objective\":\"\u003cp\u003eImplement the fixed \u003ccode\u003egs_001_cascode_cs\u003c/code\u003e circuit in GF180MCU D and submit self-contained GDS.\\nNine MOS devices form a cascode common-source stage with PMOS and NMOS bias ladders. An external 20 uA sink biases the PMOS ladder. Total widths, lengths and multiplicities follow the fixed GF180 binding. Physical body contacts and an independently constructed reference complete the circuit.\u003c/p\u003e\\n\u003ch3\u003eOptimization objective\u003c/h3\u003e\\n\u003cp\u003eMaximize the declared quality score within the solve budget while satisfying all physical and necessary functional requirements. The first passing DRC, LVS and required electrical checks establish a feasible baseline. Continue improving the scored metrics from that baseline; a passing check or \u003ccode\u003etask_success = true\u003c/code\u003e does not mean that the quality objectives have been achieved.\u003c/p\u003e\\n\",\"Operating Conditions\":\"\u003cp\u003eUse the typical GF180 3.3 V MOS models and physical poly models where present,\\nwith statistical variation disabled. Unless swept explicitly, temperature is 27 C.\\nVSS = 0 V; VDD = 2.7, 3.0 and 3.3 V; external 20 uA sink from ibias to VSS; external 1 pF output load. A 1 TH external inductor connects output to input for the DC trip-point solve. A 1 F external coupling capacitor injects a unit AC input through acin while isolating the DC fixture. This measures open-loop small-signal gain at each self-biased trip point; it does not prescribe a fixed DC input voltage.\u003c/p\u003e\\n\u003cp\u003eAC sweeps 100 points per decade from 1 Hz to 1 GHz. Under unit AC injection, gain-stage transfer is V(vout); under unit differential excitation, differential-pair transfer is V(voutn)-V(voutp); OTA transfer is defined above.\u003c/p\u003e\\n\",\"Physical Requirements\":\"$13\",\"Tools and Submission\":\"$14\"},\"source_url\":\"https://github.com/MacAnalog/spicexplorer-release/tree/263d0322f8900dc331536fbbe6c0e804514fc454/analog-db/circuits/gs_001_cascode_cs\",\"status\":\"qualified\",\"title\":\"Self-Biased Cascode Common-Source Gain Stage\",\"core\":false},\"catalog\":{\"tasks\":[],\"runs\":[],\"experiments\":[],\"contexts\":[],\"boards\":[]},\"previewRun\":null,\"preview\":null,\"evidenceError\":false}]}]\nc:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n15:I[27201,[\"/ICLayout-Bench/_next/static/chunks/2h60meymns2z5.js\"],\"IconMark\"]\n9:null\ne:[[\"$\",\"title\",\"0\",{\"children\":\"ICLayout-Bench | Circuit layout intelligence\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Independent evaluation of AI for integrated circuit layout. Compare model scores, explore circuit performance and inspect generated layouts.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/ICLayout-Bench/brand/iclayout-bench.svg\",\"type\":\"image/svg+xml\",\"sizes\":\"any\"}],[\"$\",\"$L15\",\"3\",{}]]\n"])</script></body></html>
