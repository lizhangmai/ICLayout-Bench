e within the solve budget while satisfying all physical and necessary functional requirements. The first passing DRC, LVS and required electrical checks establish a feasible baseline. Continue improving the scored metrics from that baseline; a passing check or \u003ccode\u003etask_success = true\u003c/code\u003e does not mean that the quality objectives have been achieved.\u003c/p\u003e\n\u003ch2 id=\"problem-inputs-and-interface\"\u003eInputs and Interface\u003c/h2\u003e\n\u003cp\u003eOrdered SPICE ports: \u003ccode\u003eA B1 B2 ZN VDD VSS\u003c/code\u003e. Names are case-insensitive, but different names are not interchangeable. Inputs are this description, \u003ccode\u003ematerials/circuit.spice\u003c/code\u003e and \u003ccode\u003ematerials/testbench.spice\u003c/code\u003e. The reviewed resource package supplies models and extraction resources; reference geometry and qualification evidence are not solver inputs.\u003c/p\u003e\n\u003ch2 id=\"problem-operating-conditions\"\u003eOperating Conditions\u003c/h2\u003e\n\u003cp\u003eUse nominal FreePDK45 BSIM4 models at \u003cstrong\u003e1.0 V and 27 C\u003c/strong\u003e, with ground at 0 V. Every transistor has channel length 50 nm; widths and model types follow the netlist.\u003c/p\u003e\n\u003cp\u003eZN load is 5 fF. Drive A/B1/B2 through the three-bit Gray cycle 000, 001, 011, 010, 110, 111, 101, 100, 000 and its reverse, using 500 ps slots and 10 ps edges. Sample +110 ps after each slot starts, covering the truth table and transitions in both directions around the cycle; average DUT supply power over 0–8.4 ns.\u003c/p\u003e\n\u003cp\u003eThe deck precisely defines stimuli and observation times, testing only through external ports. Validation covers these nominal conditions, excluding PVT, mismatch, array integration, substrate noise and manufacturing signoff.\u003c/p\u003e\n\u003ch2 id=\"problem-physical-requirements\"\u003ePhysical Requirements\u003c/h2\u003e\n\u003cp\u003eSubmit a nonempty GDSII no larger than 10 MiB. Enable every check in the supplied KLayout DRC deck, including grid and antenna checks, without waivers. Strict LVS checks named ports, models, W/L and physical well/contact connectivity, with library-specific implicit or global power connections disabled. The upstream deck does not implement its documented spacing rule for wells at different potentials and does not provide complete foundry signoff.\u003c/p\u003e\n\u003cp\u003eThe hard functional-outline limit is 100 um × 100 um. Its bounding box includes all functional geometry on drawing layers 1/0–29/0: active regions, wells, implants, threshold markers, poly, contacts, ten metal layers and nine via layers. Area is scored in um2. Keep functional geometry on these layers, excluding pin-purpose and annotation geometry. Electrical labels use poly or metal drawing layers (9/0, 11/0, 13/0, …, 29/0); nonelectrical annotation text is not extracted.\u003c/p\u003e\n\u003cp\u003eTranslation, equivalent hierarchy and internal instance renaming are allowed. LVS permits source/drain exchange and equivalent parallel devices; the candidate must still pass the same RC electrical evaluation. Preserve top-level port identities and explicit body connections.\u003c/p\u003e\n\u003cp\u003eThe standard-cell functional frame has fixed height 1.63 um and width on a 0.01 um grid. Coordinates below are relative to its lower-left corner; global translation is allowed. Supply rails are continuous on metal1 and bound to their corresponding named supplies by LVS.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eVDD\u003c/code\u003e: center y=1.515 um, thickness at least 0.07 um, extending from +0.115 um inside the left boundary to the right boundary −0.03 um.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eVSS\u003c/code\u003e: center y=0.115 um, thickness at least 0.07 um, with the same horizontal extent as above.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"problem-electrical-requirements-and-scoring\"\u003eElectrical Requirements and Scoring\u003c/h2\u003e\n\u003cp\u003eArtifact, geometry, DRC, LVS and declared functional requirements must pass. Parasitic extraction is also mandatory: it must produce a complete, electrically consistent netlist usable by the required post-layout simulations. A completed candidate rejection scores zero; infrastructure errors do not establish candidate failure.\u003c/p\u003e\n\u003cp\u003eExtract the candidate GDS only after file, DRC, LVS and geometry checks pass. Simulate its Magic RC netlist directly, with independent source simulation supplying the scoring baseline. Independent LVS first checks VTG/VTL device types, then uses the matching extraction configuration. Extraction includes poly/metal sheet resistance, contacts/vias, geometry-dependent coupling and ground capacitance, and device junction areas/perimeters. Wells use lumped connectivity; BSIM4 describes device and junction behavior. Interconnect RC uses estimated coefficients and native capacitance placement from the fixed community FreePDK45 Magic technology. The adapter binds VTG/VTL models, preserves annotation layers and corrects dimension-unit conversion. This is a predictive approximation without field-solver signoff accuracy.\u003c/p\u003e\n\u003cp\u003ePhysical checks and the declared functional bounds must pass. Quality scoring imposes no fixed degradation allowance. Each \u003ccode\u003esource_*\u003c/code\u003e job and its corresponding candidate extracted circuit use exactly the same testbench, model resources, parameters, loads and measurement windows. Independent source observations define the 100-point electrical baseline without depending on the submitted GDS; reports retain every paired result.\u003c/p\u003e\n\u003cp\u003eLet x be the post-layout measurement and b the source-circuit measurement under the same conditions:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eRatio normalization: maximize with q = x/b and minimize with q = b/x. When a numerical scale s is declared, use (x+s)/(b+s) and its reciprocal, respectively. The scale handles zero values as a normalization floor; it is neither an allowed degradation nor an acceptance bound.\u003c/li\u003e\n\u003cli\u003eAmplitude in dB: maximize with q = 10^((x-b)/20) and minimize with its reciprocal.\u003c/li\u003e\n\u003cli\u003eTarget normalization: q = 1/(1+abs(x-b)/s), where s is the declared physical scale. Signed or zero-valued operating points are not divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eUse \u003ccode\u003elayout\u003c/code\u003e scoring. Each metric takes its worst paired quality q, and the total score is S = 100 * product(min(1, q_i) ** w_i), with area quality q_area = area_reference / candidate_functional_area. The weights below sum to 1; metric dimensions describe measurements and do not determine weights. Physical, extraction, or functional rejection scores zero; other missing or invalid measurements leave the score unknown, and zero-weight observations must also be valid. Matching source-circuit performance at the reference area scores 100 points; each metric is capped at quality 1, so scores cannot exceed 100. Weights express quality tradeoffs rather than hard bounds.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eDefinition / observation\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eQuality normalization\u003c/th\u003e\n\u003cth\u003eFunctional range\u003c/th\u003e\n\u003cth\u003eScale\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estate_0\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003efind v(ZN) at=0.110n\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003efunctional check\u003c/td\u003e\n\u003ctd\u003e0.9 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estate_1\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003efind v(ZN) at=0.610n\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003efunctional check\u003c/td\u003e\n\u003ctd\u003e0.9 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estate_2\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003efind v(ZN) at=1.110n\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003efunctional check\u003c/td\u003e\n\u003ctd\u003e−∞ … 0.1\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estate_3\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003efind v(ZN) at=1.610n\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003efunctional check\u003c/td\u003e\n\u003ctd\u003e0.9 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estate_4\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003efind v(ZN) at=2.110n\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003efunctional check\u003c/td\u003e\n\u003ctd\u003e−∞ … 0.1\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estate_5\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003efind v(ZN) at=2.610n\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003efunctional check\u003c/td\u003e\n\u003ctd\u003e−∞ … 0.1\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estate_6\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003efind v(ZN) at=3.110n\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003efunctional check\u003c/td\u003e\n\u003ctd\u003e−∞ … 0.1\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u0 3e\n\u003ctd\u003e\u003ccode\u003estate_13\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003efind v(ZN) at=6.610n\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003efunctional check\u003c/td\u003e\n\u003ctd\u003e0.9 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estate_14\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003efind v(ZN) at=7.110n\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003efunctional check\u003c/td\u003e\n\u003ctd\u003e−∞ … 0.1\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estate_15\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003efind v(ZN) at=7.610n\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003efunctional check\u003c/td\u003e\n\u003ctd\u003e0.9 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estate_16\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003efind v(ZN) at=8.110n\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003efunctional check\u003c/td\u003e\n\u003ctd\u003e0.9 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003esupply\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eavg par('-v(vdd)*i(Vdd)') from=0 to=8.400n\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epropagation_delay\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eWorst paired quality over: delay_b1_fall_2, delay_b2_rise_3, delay_a_fall_4, delay_a_rise_8, delay_a_fall_9, delay_a_rise_13, delay_b2_fall_14, delay_b1_rise_15.\u003c/td\u003e\n\u003ctd\u003es\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_transition\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eWorst paired quality over: transition_b1_fall_2, transition_b2_rise_3, transition_a_fall_4, transition_a_rise_8, transition_a_fall_9, transition_a_rise_13, transition_b2_fall_14, transition_b1_rise_15.\u003c/td\u003e\n\u003ctd\u003es\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eArea reference: \u003cstrong\u003e2.0049 um2\u003c/strong\u003e, from the complete functional bounding box 1.23 × 1.63 um of the declared standard-cell reference GDS, including explicit contacts and routing.\u003c/p\u003e\n\u003cp\u003eThe capability coefficient is \u003cstrong\u003e2\u003c/strong\u003e, independent of this task's reference-normalized score.\u003c/p\u003e\n\u003ch3 id=\"problem-standard-cell-design-guidance\"\u003eStandard-cell design guidance\u003c/h3\u003e\n\u003cp\u003eYou may plan device rows, supply rails and signal access before routing. Represent pull-up/pull-down connections as transistor-edge graphs and explore compatible Euler paths and alternative orders to share diffusion and reduce breaks. Choose a legal arrangement considering routing length, parasitics and signal access. Keep fixed netlist sizes, models and connections; do not optimize sizing.\u003c/p\u003e\n\u003cp\u003eUse the declared row height, grid and supply-rail geometry. Keep local routing compact and signal pins accessible, avoiding routing layers with no benefit. Check DRC and named-port LVS, then extract the candidate and compare transitions in both directions and power against source simulation; iterate using parasitic measurements. These methods are optional and do not prescribe an algorithm or reference layout.\u003c/p\u003e\n\u003cp\u003eThese methods refer to Sections 2–3 of Xu et al., \u003cem\u003eStandard Cell Library Design and Optimization Methodology for ASAP7 PDK\u003c/em\u003e (https://arxiv.org/abs/1807.11396). Its FinFET sizing, track count and process-specific dimensions do not apply to this task.\u003c/p\u003e\n\u003ch3 id=\"problem-score-weights\"\u003eScore weights\u003c/h3\u003e\n\u003cp\u003eStandard-cell logic: propagation delay 48%, output transition 16%, supply power 16%, area 20%; each objective weight is divided equally among its metrics.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.2\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epropagation_delay\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.480000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_transition\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.160000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003esupply\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.160000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch2 id=\"problem-tools-and-submission\"\u003eTools and Submission\u003c/h2\u003e\n\u003cp\u003eSoft solve budget: \u003cstrong\u003e3 hours\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eRead \u003ccode\u003e/protocol/task.json\u003c/code\u003e for input/output paths, constraints and the \u003ccode\u003eresources\u003c/code\u003e object; \u003ccode\u003e/protocol/harness.json\u003c/code\u003e describes the active check and submission interface.\u003c/p\u003e\n\u003cp\u003eUse the reviewed FreePDK45 KLayout, Magic and ngspice resources in the \u003ccode\u003eresources\u003c/code\u003e field of \u003ccode\u003e/protocol/task.json\u003c/code\u003e. Magic RC extraction uses \u003ccode\u003e/resources/support/magic-vtl/freepdk45.tech\u003c/code\u003e, including model and unit adaptation. \u003ccode\u003e/protocol/task.json\u003c/code\u003e supplies consistent constraints, measurements and scoring; \u003ccode\u003e/task\u003c/code\u003e contains only declared inputs. Write \u003ccode\u003e/workspace/output/final.gds\u003c/code\u003e, then run \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e to submit explicitly. If \u003ccode\u003eprocess-feedback\u003c/code\u003e is provided, intermediate checks use the frozen plan and backend identities; their snapshots are not final submissions.\u003c/p\u003e\n\u003ch3 id=\"problem-solve-workflow\"\u003eSolve workflow\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eRead the declared circuit and materials, \u003ccode\u003e/protocol/task.json\u003c/code\u003e for paths, constraints and reviewed resources, and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e for capabilities and helper commands. Task inputs under \u003ccode\u003e/task\u003c/code\u003e and resources under \u003ccode\u003e/resources\u003c/code\u003e are read-only; construct the layout in \u003ccode\u003e/workspace\u003c/code\u003e with the declared tools. With layout MCP, paths and commands refer to the remote EDA workspace. Create your own implementation with real devices, interconnect and pins, using your own tool loop without delegating to other agents; reference layouts and author code are not solver inputs.\u003c/li\u003e\n\u003cli\u003eInspect \u003ccode\u003eresources.external\u003c/code\u003e before using external tools. Each command starts a fresh shell: when tool modules are declared, source \u003ccode\u003e/usr/share/Modules/init/bash\u003c/code\u003e and load the selected tool's modules; export its declared \u003ccode\u003etool_environment\u003c/code\u003e settings in that same command. Repeat as needed and use batch or headless operation. Local manuals, command references, and release notes may be available within the declared EDA installation and PDK resource directories. Locate these resources through \u003ccode\u003e/protocol/task.json\u003c/code\u003e and consult the documentation for the installed tool version when diagnosing unfamiliar syntax or tool failures.\u003c/li\u003e\n\u003cli\u003eGenerate an initial candidate and submit a snapshot early. When \u003ccode\u003eprocess-feedback\u003c/code\u003e is available, check the current GDS with layout MCP \u003ccode\u003echeck\u003c/code\u003e or \u003ccode\u003epython -I /protocol/process_check.py\u003c/code\u003e before the final submission. This runs the final evaluator's complete plan and returns engineering diagnostics and candidate measurements, without scores or normalized quality factors. Checks have no count limit and consume the same wall-clock budget. Inspect the physical and functional results and all scored metrics; successful tool execution alone does not establish requirement satisfaction. Read paginated diagnostics with \u003ccode\u003ereport\u003c/code\u003e when using MCP. Local exploratory checks do not replace this complete check.\u003c/li\u003e\n\u003cli\u003eUse the remaining time for measured improvements to the declared quality objectives. Identify the limiting scored metrics, make targeted layout changes, regenerate and check the candidate, and compare measurements with the previous candidate and the stated scoring targets and trade-offs. Preserve the best valid candidate and revert changes that worsen the overall objective. Repeat while time and useful improvements remain; passing validity checks alone is not a stopping condition.\u003c/li\u003e\n\u003cli\u003eStop optimization when the budget expires, all declared quality objectives are achieved, or measured trials support convergence. If stopping early, explain the changes tried, the metric comparisons and the remaining limitations. Track remaining time through session status. At soft-budget expiry, finish or cancel already-started work and submit immediately; do not start another command, check or optimization round. If an MCP execution is running, use \u003ccode\u003epoll\u003c/code\u003e with its \u003ccode\u003eexecution_id\u003c/code\u003e and the returned \u003ccode\u003enext_offset\u003c/code\u003e as \u003ccode\u003eoffset\u003c/code\u003e until completion, or cancel it and wait for it to stop.\u003c/li\u003e\n\u003cli\u003eFinish or cancel outstanding work, restore your best candidate to the declared output path, and explicitly submit it before ending the session. With layout MCP \u003ccode\u003esubmit\u003c/code\u003e, remove the \u003ccode\u003e/workspace/\u003c/code\u003e prefix from \u003ccode\u003eoutput.path\u003c/code\u003e; with the container interface, run \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e. Wait for the receipt: only the last accepted snapshot is judged, and writing a file alone is not submission. Acceptance confirms delivery; the framework independently evaluates validity and quality after the session.\u003c/li\u003e\n\u003c/ol\u003e\n12:T222a,\u003cp\u003eArtifact, geometry, DRC, LVS and declared functional requirements must pass. Parasitic extraction is also mandatory: it must produce a complete, electrically consistent netlist usable by the required post-layout simulations. A completed candidate rejection scores zero; infrastructure errors do not establish candidate failure.\u003c/p\u003e\n\u003cp\u003eExtract the candidate GDS only after file, DRC, LVS and geometry checks pass. Simulate its Magic RC netlist directly, with independent source simulation supplying the scoring baseline. Independent LVS first checks VTG/VTL device types, then uses the matching extraction configuration. Extraction includes poly/metal sheet resistance, contacts/vias, geometry-dependent coupling and ground capacitance, and device junction areas/perimeters. Wells use lumped connectivity; BSIM4 describes device and junction behavior. Interconnect RC uses estimated coefficients and native capacitance placement from the fixed community FreePDK45 Magic technology. The adapter binds VTG/VTL models, preserves annotation layers and corrects dimension-unit conversion. This is a predictive approximation without field-solver signoff accuracy.\u003c/p\u003e\n\u003cp\u003ePhysical checks and the declared functional bounds must pass. Quality scoring imposes no fixed degradation allowance. Each \u003ccode\u003esource_*\u003c/code\u003e job and its corresponding candidate extracted circuit use exactly the same testbench, model resources, parameters, loads and measurement windows. Independent source observations define the 100-point electrical baseline without depending on the submitted GDS; reports retain every paired result.\u003c/p\u003e\n\u003cp\u003eLet x be the post-layout measurement and b the source-circuit measurement under the same conditions:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eRatio normalization: maximize with q = x/b and minimize with q = b/x. When a numerical scale s is declared, use (x+s)/(b+s) and its reciprocal, respectively. The scale handles zero values as a normalization floor; it is neither an allowed degradation nor an acceptance bound.\u003c/li\u003e\n\u003cli\u003eAmplitude in dB: maximize with q = 10^((x-b)/20) and minimize with its reciprocal.\u003c/li\u003e\n\u003cli\u003eTarget normalization: q = 1/(1+abs(x-b)/s), where s is the declared physical scale. Signed or zero-valued operating points are not divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eUse \u003ccode\u003elayout\u003c/code\u003e scoring. Each metric takes its worst paired quality q, and the total score is S = 100 * product(min(1, q_i) ** w_i), with area quality q_area = area_reference / candidate_functional_area. The weights below sum to 1; metric dimensions describe measurements and do not determine weights. Physical, extraction, or functional rejection scores zero; other missing or invalid measurements leave the score unknown, and zero-weight observations must also be valid. Matching source-circuit performance at the reference area scores 100 points; each metric is capped at quality 1, so scores cannot exceed 100. Weights express quality tradeoffs rather than hard bounds.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eDefinition / observation\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eQuality normalization\u003c/th\u003e\n\u003cth\u003eFunctional range\u003c/th\u003e\n\u003cth\u003eScale\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estate_0\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003efind v(ZN) at=0.110n\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003efunctional check\u003c/td\u003e\n\u003ctd\u003e0.9 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estate_1\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003efind v(ZN) at=0.610n\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003efunctional check\u003c/td\u003e\n\u003ctd\u003e0.9 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estate_2\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003efind v(ZN) at=1.110n\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003efunctional check\u003c/td\u003e\n\u003ctd\u003e−∞ … 0.1\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estate_3\u003c/code\u003e\u003c/td\u003e\n\u 3e\u003ccode\u003estate_15\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003efind v(ZN) at=7.610n\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003efunctional check\u003c/td\u003e\n\u003ctd\u003e0.9 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estate_16\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003efind v(ZN) at=8.110n\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003efunctional check\u003c/td\u003e\n\u003ctd\u003e0.9 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003esupply\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eavg par('-v(vdd)*i(Vdd)') from=0 to=8.400n\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epropagation_delay\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eWorst paired quality over: delay_b1_fall_2, delay_b2_rise_3, delay_a_fall_4, delay_a_rise_8, delay_a_fall_9, delay_a_rise_13, delay_b2_fall_14, delay_b1_rise_15.\u003c/td\u003e\n\u003ctd\u003es\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_transition\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eWorst paired quality over: transition_b1_fall_2, transition_b2_rise_3, transition_a_fall_4, transition_a_rise_8, transition_a_fall_9, transition_a_rise_13, transition_b2_fall_14, transition_b1_rise_15.\u003c/td\u003e\n\u003ctd\u003es\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eArea reference: \u003cstrong\u003e2.0049 um2\u003c/strong\u003e, from the complete functional bounding box 1.23 × 1.63 um of the declared standard-cell reference GDS, including explicit contacts and routing.\u003c/p\u003e\n\u003cp\u003eThe capability coefficient is \u003cstrong\u003e2\u003c/strong\u003e, independent of this task's reference-normalized score.\u003c/p\u003e\n\u003ch3\u003eStandard-cell design guidance\u003c/h3\u003e\n\u003cp\u003eYou may plan device rows, supply rails and signal access before routing. Represent pull-up/pull-down connections as transistor-edge graphs and explore compatible Euler paths and alternative orders to share diffusion and reduce breaks. Choose a legal arrangement considering routing length, parasitics and signal access. Keep fixed netlist sizes, models and connections; do not optimize sizing.\u003c/p\u003e\n\u003cp\u003eUse the declared row height, grid and supply-rail geometry. Keep local routing compact and signal pins accessible, avoiding routing layers with no benefit. Check DRC and named-port LVS, then extract the candidate and compare transitions in both directions and power against source simulation; iterate using parasitic measurements. These methods are optional and do not prescribe an algorithm or reference layout.\u003c/p\u003e\n\u003cp\u003eThese methods refer to Sections 2–3 of Xu et al., \u003cem\u003eStandard Cell Library Design and Optimization Methodology for ASAP7 PDK\u003c/em\u003e (https://arxiv.org/abs/1807.11396). Its FinFET sizing, track count and process-specific dimensions do not apply to this task.\u003c/p\u003e\n\u003ch3\u003eScore weights\u003c/h3\u003e\n\u003cp\u003eStandard-cell logic: propagation delay 48%, output transition 16%, supply power 16%, area 20%; each objective weight is divided equally among its metrics.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.2\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epropagation_delay\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.480000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_transition\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.160000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003esupply\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.160000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n13:T700,\u003cp\u003eSubmit a nonempty GDSII no larger than 10 MiB. Enable every check in the supplied KLayout DRC deck, including grid and antenna checks, without waivers. Strict LVS checks named ports, models, W/L and physical well/contact connectivity, with library-specific implicit or global power connections disabled. The upstream deck does not implement its documented spacing rule for wells at different potentials and does not provide complete foundry signoff.\u003c/p\u003e\n\u003cp\u003eThe hard functional-outline limit is 100 um × 100 um. Its bounding box includes all functional geometry on drawing layers 1/0–29/0: active regions, wells, implants, threshold markers, poly, contacts, ten metal layers and nine via layers. Area is scored in um2. Keep functional geometry on these layers, excluding pin-purpose and annotation geometry. Electrical labels use poly or metal drawing layers (9/0, 11/0, 13/0, …, 29/0); nonelectrical annotation text is not extracted.\u003c/p\u003e\n\u003cp\u003eTranslation, equivalent hierarchy and internal instance renaming are allowed. LVS permits source/drain exchange and equivalent parallel devices; the candidate must still pass the same RC electrical evaluation. Preserve top-level port identities and explicit body connections.\u003c/p\u003e\n\u003cp\u003eThe standard-cell functional frame has fixed height 1.63 um and width on a 0.01 um grid. Coordinates below are relative to its lower-left corner; global translation is allowed. Supply rails are continuous on metal1 and bound to their corresponding named supplies by LVS.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eVDD\u003c/code\u003e: center y=1.515 um, thickness at least 0.07 um, extending from +0.115 um inside the left boundary to the right boundary −0.03 um.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eVSS\u003c/code\u003e: center y=0.115 um, thickness at least 0.07 um, with the same horizontal extent as above.\u003c/li\u003e\n\u003c/ul\u003e\n14:T1285,\u003cp\u003eSoft solve budget: \u003cstrong\u003e3 hours\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eRead \u003ccode\u003e/protocol/task.json\u003c/code\u003e for input/output paths, constraints and the \u003ccode\u003eresources\u003c/code\u003e object; \u003ccode\u003e/protocol/harness.json\u003c/code\u003e describes the active check and submission interface.\u003c/p\u003e\n\u003cp\u003eUse the reviewed FreePDK45 KLayout, Magic and ngspice resources in the \u003ccode\u003eresources\u003c/code\u003e field of \u003ccode\u003e/protocol/task.json\u003c/code\u003e. Magic RC extraction uses \u003ccode\u003e/resources/support/magic-vtl/freepdk45.tech\u003c/code\u003e, including model and unit adaptation. \u003ccode\u003e/protocol/task.json\u003c/code\u003e supplies consistent constraints, measurements and scoring; \u003ccode\u003e/task\u003c/code\u003e contains only declared inputs. Write \u003ccode\u003e/workspace/output/final.gds\u003c/code\u003e, then run \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e to submit explicitly. If \u003ccode\u003eprocess-feedback\u003c/code\u003e is provided, intermediate checks use the frozen plan and backend identities; their snapshots are not final submissions.\u003c/p\u003e\n\u003ch3\u003eSolve workflow\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eRead the declared circuit and materials, \u003ccode\u003e/protocol/task.json\u003c/code\u003e for paths, constraints and reviewed resources, and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e for capabilities and helper commands. Task inputs under \u003ccode\u003e/task\u003c/code\u003e and resources under \u003ccode\u003e/resources\u003c/code\u003e are read-only; construct the layout in \u003ccode\u003e/workspace\u003c/code\u003e with the declared tools. With layout MCP, paths and commands refer to the remote EDA workspace. Create your own implementation with real devices, interconnect and pins, using your own tool loop without delegating to other agents; reference layouts and author code are not solver inputs.\u003c/li\u003e\n\u003cli\u003eInspect \u003ccode\u003eresources.external\u003c/code\u003e before using external tools. Each command starts a fresh shell: when tool modules are declared, source \u003ccode\u003e/usr/share/Modules/init/bash\u003c/code\u003e and load the selected tool's modules; export its declared \u003ccode\u003etool_environment\u003c/code\u003e settings in that same command. Repeat as needed and use batch or headless operation. Local manuals, command references, and release notes may be available within the declared EDA installation and PDK resource directories. Locate these resources through \u003ccode\u003e/protocol/task.json\u003c/code\u003e and consult the documentation for the installed tool version when diagnosing unfamiliar syntax or tool failures.\u003c/li\u003e\n\u003cli\u003eGenerate an initial candidate and submit a snapshot early. When \u003ccode\u003eprocess-feedback\u003c/code\u003e is available, check the current GDS with layout MCP \u003ccode\u003echeck\u003c/code\u003e or \u003ccode\u003epython -I /protocol/process_check.py\u003c/code\u003e before the final submission. This runs the final evaluator's complete plan and returns engineering diagnostics and candidate measurements, without scores or normalized quality factors. Checks have no count limit and consume the same wall-clock budget. Inspect the physical and functional results and all scored metrics; successful tool execution alone does not establish requirement satisfaction. Read paginated diagnostics with \u003ccode\u003ereport\u003c/code\u003e when using MCP. Local exploratory checks do not replace this complete check.\u003c/li\u003e\n\u003cli\u003eUse the remaining time for measured improvements to the declared quality objectives. Identify the limiting scored metrics, make targeted layout changes, regenerate and check the candidate, and compare measurements with the previous candidate and the stated scoring targets and trade-offs. Preserve the best valid candidate and revert changes that worsen the overall objective. Repeat while time and useful improvements remain; passing validity checks alone is not a stopping condition.\u003c/li\u003e\n\u003cli\u003eStop optimization when the budget expires, all declared quality objectives are achieved, or measured trials support convergence. If stopping early, explain the changes tried, the metric comparisons and the remaining limitations. Track remaining time through session status. At soft-budget expiry, finish or cancel already-started work and submit immediately; do not start another command, check or optimization round. If an MCP execution is running, use \u003ccode\u003epoll\u003c/code\u003e with its \u003ccode\u003eexecution_id\u003c/code\u003e and the returned \u003ccode\u003enext_offset\u003c/code\u003e as \u003ccode\u003eoffset\u003c/code\u003e until completion, or cancel it and wait for it to stop.\u003c/li\u003e\n\u003cli\u003eFinish or cancel outstanding work, restore your best candidate to the declared output path, and explicitly submit it before ending the session. With layout MCP \u003ccode\u003esubmit\u003c/code\u003e, remove the \u003ccode\u003e/workspace/\u003c/code\u003e prefix from \u003ccode\u003eoutput.path\u003c/code\u003e; with the container interface, run \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e. Wait for the receipt: only the last accepted snapshot is judged, and writing a file alone is not submission. Acceptance confirms delivery; the framework independently evaluates validity and quality after the session.\u003c/li\u003e\n\u003c/ol\u003e\n6:[\"$\",\"$8\",null,{\"fallback\":[\"$\",\"p\",null,{\"children\":\"Loading published evidence…\"}],\"children\":[\"$\",\"$L10\",null,{\"task\":{\"case_path\":\"tasks/freepdk45/nangate45-pdk/cases/AOI21_X1/case.toml\",\"coefficient\":2,\"collection\":\"nangate45-pdk\",\"configuration_url\":\"/ICLayout-Bench/assets/da0b086993c43ffb6eb25a71b69f42c246c5c71ed3afb409dceabbba3f7c15bb.txt\",\"description_html\":\"$11\",\"description_path\":\"tasks/freepdk45/nangate45-pdk/cases/AOI21_X1/problem.md\",\"hours\":3,\"id\":\"freepdk45.nangate45-pdk.AOI21_X1\",\"inputs\":{\"description\":{\"format\":\"text\",\"path\":\"problem.md\",\"sha256\":\"c606273172f079978e7c3e62ef8feb0c3b67f587cb0545942921fd21987dc4c3\"},\"netlist\":{\"format\":\"spice\",\"path\":\"materials/circuit.spice\",\"sha256\":\"07d8b2857f5ecd7bde8d5b3e231b16b6819272db2d19c1ee4882094e04bc909e\",\"subcircuit\":\"AOI21_X1\"},\"performance\":{\"format\":\"spice\",\"path\":\"materials/testbench.spice\",\"sha256\":\"f8401ddcc740853f48b867b25e5bbf895409a9d1df90dfd5b013f31d236aa6b8\"}},\"licenses\":[{\"name\":\"LICENSE\",\"path\":\"tasks/freepdk45/nangate45-pdk/LICENSE\",\"url\":\"/ICLayout-Bench/assets/0d542e0c8804e39aa7f37eb00da5a762149dc682d7829451287e11b938e94594.txt\"},{\"name\":\"NOTICE\",\"path\":\"tasks/freepdk45/nangate45-pdk/NOTICE\",\"url\":\"/ICLayout-Bench/assets/9effab549be19dc2dd9368a81fc6fdc3e9e202a83533c852cfcd9b25f456ec29.txt\"}],\"materials\":[{\"name\":\"problem.md\",\"role\":\"description\",\"url\":\"/ICLayout-Bench/assets/c606273172f079978e7c3e62ef8feb0c3b67f587cb0545942 rection\":\"minimize\",\"id\":\"state_9\",\"observations\":[\"nominal:state_9\"],\"requirement\":{\"rationale\":\"The declared truth-table, SRAM sense or polarity-correct comparator output must reach its stated CMOS logic level at every functional sample under the fixed supply and load.\",\"upper\":0.1},\"unit\":\"V\"},{\"aggregation\":\"max\",\"category\":\"performance\",\"direction\":\"minimize\",\"id\":\"state_10\",\"observations\":[\"nominal:state_10\"],\"requirement\":{\"rationale\":\"The declared truth-table, SRAM sense or polarity-correct comparator output must reach its stated CMOS logic level at every functional sample under the fixed supply and load.\",\"upper\":0.1},\"unit\":\"V\"},{\"aggregation\":\"max\",\"category\":\"performance\",\"direction\":\"minimize\",\"id\":\"state_11\",\"observations\":[\"nominal:state_11\"],\"requirement\":{\"rationale\":\"The declared truth-table, SRAM sense or polarity-correct comparator output must reach its stated CMOS logic level at every functional sample under the fixed supply and load.\",\"upper\":0.1},\"unit\":\"V\"},{\"aggregation\":\"max\",\"category\":\"performance\",\"direction\":\"minimize\",\"id\":\"state_12\",\"observations\":[\"nominal:state_12\"],\"requirement\":{\"rationale\":\"The declared truth-table, SRAM sense or polarity-correct comparator output must reach its stated CMOS logic level at every functional sample under the fixed supply and load.\",\"upper\":0.1},\"unit\":\"V\"},{\"aggregation\":\"min\",\"category\":\"performance\",\"direction\":\"maximize\",\"id\":\"state_13\",\"observations\":[\"nominal:state_13\"],\"requirement\":{\"lower\":0.9,\"rationale\":\"The declared truth-table, SRAM sense or polarity-correct comparator output must reach its stated CMOS logic level at every functional sample under the fixed supply and load.\"},\"unit\":\"V\"},{\"aggregation\":\"max\",\"category\":\"performance\",\"direction\":\"minimize\",\"id\":\"state_14\",\"observations\":[\"nominal:state_14\"],\"requirement\":{\"rationale\":\"The declared truth-table, SRAM sense or polarity-correct comparator output must reach its stated CMOS logic level at every functional sample under the fixed supply and load.\",\"upper\":0.1},\"unit\":\"V\"},{\"aggregation\":\"min\",\"category\":\"performance\",\"direction\":\"maximize\",\"id\":\"state_15\",\"observations\":[\"nominal:state_15\"],\"requirement\":{\"lower\":0.9,\"rationale\":\"The declared truth-table, SRAM sense or polarity-correct comparator output must reach its stated CMOS logic level at every functional sample under the fixed supply and load.\"},\"unit\":\"V\"},{\"aggregation\":\"min\",\"category\":\"performance\",\"direction\":\"maximize\",\"id\":\"state_16\",\"observations\":[\"nominal:state_16\"],\"requirement\":{\"lower\":0.9,\"rationale\":\"The declared truth-table, SRAM sense or polarity-correct comparator output must reach its stated CMOS logic level at every functional sample under the fixed supply and load.\"},\"unit\":\"V\"},{\"aggregation\":\"max\",\"baseline\":[\"source_nominal:supply\"],\"category\":\"performance\",\"dimension\":\"supply\",\"direction\":\"minimize\",\"id\":\"supply\",\"normalization\":\"ratio\",\"observations\":[\"nominal:supply\"],\"requirement\":{\"lower\":0,\"rationale\":\"The declared powered circuit must consume nonnegative net energy from its supplies and driven references over the stated observation; power magnitude remains a quality objective.\"},\"scale\":1e-12,\"unit\":\"W\"},{\"aggregation\":\"max\",\"baseline\":[\"source_nominal:delay_b1_fall_2\",\"source_nominal:delay_b2_rise_3\",\"source_nominal:delay_a_fall_4\",\"source_nominal:delay_a_rise_8\",\"source_nominal:delay_a_fall_9\",\"source_nominal:delay_a_rise_13\",\"source_nominal:delay_b2_fall_14\",\"source_nominal:delay_b1_rise_15\"],\"category\":\"performance\",\"dimension\":\"response\",\"direction\":\"minimize\",\"id\":\"propagation_delay\",\"normalization\":\"ratio\",\"observations\":[\"nominal:delay_b1_fall_2\",\"nominal:delay_b2_rise_3\",\"nominal:delay_a_fall_4\",\"nominal:delay_a_rise_8\",\"nominal:delay_a_fall_9\",\"nominal:delay_a_rise_13\",\"nominal:delay_b2_fall_14\",\"nominal:delay_b1_rise_15\"],\"requirement\":{\"lower\":0,\"rationale\":\"The declared ordered-event interval or crossing frequency has a nonnegative measurement domain, and its crossing must exist for a usable observation.\"},\"unit\":\"s\"},{\"aggregation\":\"max\",\"baseline\":[\"source_nominal:transition_b1_fall_2\",\"source_nominal:transition_b2_rise_3\",\"source_nominal:transition_a_fall_4\",\"source_nominal:transition_a_rise_8\",\"source_nominal:transition_a_fall_9\",\"source_nominal:transition_a_rise_13\",\"source_nominal:transition_b2_fall_14\",\"source_nominal:transition_b1_rise_15\"],\"category\":\"performance\",\"dimension\":\"response\",\"direction\":\"minimize\",\"id\":\"output_transition\",\"normalization\":\"ratio\",\"observations\":[\"nominal:transition_b1_fall_2\",\"nominal:transition_b2_rise_3\",\"nominal:transition_a_fall_4\",\"nominal:transition_a_rise_8\",\"nominal:transition_a_fall_9\",\"nominal:transition_a_rise_13\",\"nominal:transition_b2_fall_14\",\"nominal:transition_b1_rise_15\"],\"requirement\":{\"lower\":0,\"rationale\":\"The declared ordered-event interval or crossing frequency has a nonnegative measurement domain, and its crossing must exist for a usable observation.\"},\"unit\":\"s\"}],\"pdk\":\"freepdk45\",\"reader\":{\"category\":\"Logic \u0026 memory\",\"summary\":\"Implements AND-OR-invert logic in a fixed-height standard cell.\",\"title\":\"AND-OR-Invert Gate\"},\"scoring\":{\"area_metric\":\"functional_area\",\"area_target\":2.0049,\"method\":\"layout\",\"rationale\":\"Standard-cell logic: propagation delay 48%; output transition 16%; supply power 16%; area 20%. Each objective's weight is divided equally among its metrics.\",\"weights\":{\"functional_area\":0.2,\"output_transition\":0.16,\"propagation_delay\":0.48,\"supply\":0.16}},\"sections\":{\"Electrical Requirements and Scoring\":\"$12\",\"Inputs and Interface\":\"\u003cp\u003eOrdered SPICE ports: \u003ccode\u003eA B1 B2 ZN VDD VSS\u003c/code\u003e. Names are case-insensitive, but different names are not interchangeable. Inputs are this description, \u003ccode\u003ematerials/circuit.spice\u003c/code\u003e and \u003ccode\u003ematerials/testbench.spice\u003c/code\u003e. The reviewed resource package supplies models and extraction resources; reference geometry and qualification evidence are not solver inputs.\u003c/p\u003e\\n\",\"Objective\":\"\u003cp\u003eImplement ZN = NOT (A OR (B1 AND B2)) with the supplied VTL transistors, preserving authoritative netlist models, W/L, interface and connections; top cell is \u003ccode\u003eAOI21_X1\u003c/code\u003e.\u003c/p\u003e\\n\u003ch3\u003eOptimization objective\u003c/h3\u003e\\n\u003cp\u003eMaximize the declared quality score within the solve budget while satisfying all physical and necessary functional requirements. The first passing DRC, LVS and required electrical checks establish a feasible baseline. Continue improving the scored metrics from that baseline; a passing check or \u003ccode\u003etask_success = true\u003c/code\u003e does not mean that the quality objectives have been achieved.\u003c/p\u003e\\n\",\"Operating Conditions\":\"\u003cp\u003eUse nominal FreePDK45 BSIM4 models at \u003cstrong\u003e1.0 V and 27 C\u003c/strong\u003e, with ground at 0 V. Every transistor has channel length 50 nm; widths and model types follow the netlist.\u003c/p\u003e\\n\u003cp\u003eZN load is 5 fF. Drive A/B1/B2 through the three-bit Gray cycle 000, 001, 011, 010, 110, 111, 101, 100, 000 and its reverse, using 500 ps slots and 10 ps edges. Sample +110 ps after each slot starts, covering the truth table and transitions in both directions around the cycle; average DUT supply power over 0–8.4 ns.\u003c/p\u003e\\n\u003cp\u003eThe deck precisely defines stimuli and observation times, testing only through external ports. Validation covers these nominal conditions, excluding PVT, mismatch, array integration, substrate noise and manufacturing signoff.\u003c/p\u003e\\n\",\"Physical Requirements\":\"$13\",\"Tools and Submission\":\"$14\"},\"source_url\":\"https://foss-eda-tools.googlesource.com/third_party/freepdk45/+/356e90646f5ef26ea09b1ed8ce4796871403a0c7/Back_End/spice/AOI21_X1.spi\",\"status\":\"qualified\",\"title\":\"AND-OR-Invert Gate\",\"core\":false},\"catalog\":{\"tasks\":[],\"runs\":[],\"experiments\":[],\"contexts\":[],\"boards\":[]},\"previewRun\":null,\"preview\":null,\"evidenceError\":false}]}]\nc:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n15:I[27201,[\"/ICLayout-Bench/_next/static/chunks/2h60meymns2z5.js\"],\"IconMark\"]\n9:null\ne:[[\"$\",\"title\",\"0\",{\"children\":\"ICLayout-Bench | Circuit layout intelligence\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Independent evaluation of AI for integrated circuit layout. Compare model scores, explore circuit performance and inspect generated layouts.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/ICLayout-Bench/brand/iclayout-bench.svg\",\"type\":\"image/svg+xml\",\"sizes\":\"any\"}],[\"$\",\"$L15\",\"3\",{}]]\n"])</script></body></html>
