plateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[\"$L6\",[[\"$\",\"script\",\"script-0\",{\"src\":\"/ICLayout-Bench/_next/static/chunks/3_2wwayut9q0b.js\",\"async\":true,\"nonce\":\"$undefined\"}]],[\"$\",\"$L7\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.MetadataOutlet\",\"children\":\"$@9\"}]}]]}],{},null,false,null]},null,false,\"$a\"]},null,false,null],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Lb\",null,{\"children\":\"$Lc\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Ld\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.Metadata\",\"children\":\"$Le\"}]}]}],null]}],false]],\"m\":\"$undefined\",\"G\":[\"$f\",[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/ICLayout-Bench/_next/static/chunks/25phisebeeifo.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]]],\"S\":true,\"h\":null,\"r\":\"$undefined\",\"s\":\"$undefined\",\"a\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"U2oZdoUjWqT_XfcDHuQ5i\"}\n10:I[1186,[\"/ICLayout-Bench/_next/static/chunks/3gll1ekbrh320.js\",\"/ICLayout-Bench/_next/static/chunks/3_2wwayut9q0b.js\"],\"default\"]\na:C\n11:T328b,\u003ch1 id=\"problem-and-or-invert-gate-layout-task\"\u003eAND-OR-Invert Gate Layout Task\u003c/h1\u003e\n\u003ch2 id=\"problem-objective\"\u003eObjective\u003c/h2\u003e\n\u003cp\u003eImplement ZN = NOT (A OR (B1 AND B2)) using the supplied VTL transistors. Preserve the authoritative netlist's model classes, W/L, interface and connectivity. Submit top cell \u003ccode\u003eAOI21_X1\u003c/code\u003e.\u003c/p\u003e\n\u003ch2 id=\"problem-inputs-and-interface\"\u003eInputs and Interface\u003c/h2\u003e\n\u003cp\u003eOrdered SPICE ports: \u003ccode\u003eA B1 B2 ZN VDD VSS\u003c/code\u003e. Names are case-insensitive; different names are not interchangeable. The delivered inputs are this problem, \u003ccode\u003ematerials/circuit.spice\u003c/code\u003e, and \u003ccode\u003ematerials/testbench.spice\u003c/code\u003e. The model and extraction resources are supplied as reviewed support bundles. Reference geometry and qualification evidence are maintainer materials, excluded from solver inputs.\u003c/p\u003e\n\u003ch2 id=\"problem-operating-conditions\"\u003eOperating Conditions\u003c/h2\u003e\n\u003cp\u003eUse the nominal FreePDK45 BSIM4 models at \u003cstrong\u003e1.0 V and 27 C\u003c/strong\u003e, with ground at 0 V. All transistor lengths are 50 nm; widths and model classes come from the netlist.\u003c/p\u003e\n\u003cp\u003eZN drives 5 fF. Apply the three-bit Gray cycle 000, 001, 011, 010, 110, 111, 101, 100, 000 and then its reverse to A/B1/B2 in 500 ps slots, with 10 ps edges. Sample ZN at slot start + 110 ps. This covers the truth table and both directions of every transition in that cycle. Average DUT supply power over 0–8.4 ns.\u003c/p\u003e\n\u003cp\u003eThe deck defines stimuli and observation times exactly. Tests use only external ports. Qualification covers these nominal conditions, not PVT, mismatch, array abutment, substrate noise or manufacturing signoff.\u003c/p\u003e\n\u003ch2 id=\"problem-physical-requirements\"\u003ePhysical Requirements\u003c/h2\u003e\n\u003cp\u003eSubmit a nonempty GDSII of at most 10 MiB. Enable all checks present in the supplied KLayout DRC deck, including grid and antenna checks, with no waivers. Strict LVS checks named ports, models, W/L and actual well/tap connectivity; library-specific implicit or global rail connections are disabled. The upstream deck does not implement its documented different-potential well-spacing rule; it is not a complete foundry signoff deck.\u003c/p\u003e\n\u003cp\u003eThe hard functional envelope is 100 um by 100 um. Its bounding rectangle includes every drawing layer 1/0 through 29/0: active, wells, implants, threshold markers, poly, contacts, all ten metals and all nine vias. It supplies the scored footprint in um2. Put functional geometry on these layers; pin-purpose and annotation geometry is excluded. Electrical labels use poly or metal drawing layers (9/0 and 11/0, 13/0, ..., 29/0). Non-electrical annotation text is ignored by extraction.\u003c/p\u003e\n\u003cp\u003eTranslation, equivalent hierarchy and internal instance renaming are allowed. LVS permits source/drain exchange and equivalent parallel devices; any such layout must also pass the same RC-based electrical requirements. Preserve top-level port identities and explicit body connections.\u003c/p\u003e\n\u003cp\u003eThe standard-cell functional frame has fixed height 1.63 um and width on a 0.01 um grid. Coordinates below are relative to its lower-left functional bound; global translation remains allowed. Supply rails must be continuous on metal1 and bound by LVS to the named supply.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eVDD\u003c/code\u003e: centre y = 1.515 um, thickness at least 0.07 um, from left + 0.115 um to right − 0.03 um.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eVSS\u003c/code\u003e: centre y = 0.115 um, thickness at least 0.07 um, from left + 0.115 um to right − 0.03 um.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"problem-electrical-requirements-and-scoring\"\u003eElectrical Requirements and Scoring\u003c/h2\u003e\n\u003cp\u003eArtifact, DRC, LVS and geometry gates precede candidate GDS extraction. Simulation consumes the candidate's Magic RC netlist unchanged; source simulation supplies the independent scoring baseline. VTG/VTL device classes are checked by independent LVS before the matching extraction profile is used. Extraction includes poly/metal sheet resistance, contacts/vias, geometry-dependent coupling and ground capacitance, and device junction area/perimeter. Wells are lumped connections; BSIM4 supplies device/junction behavior. Interconnect resistance and capacitance use the pinned community FreePDK45 Magic technology's estimated coefficients and native capacitance placement. The extraction adapter binds VTG/VTL models, preserves annotation layers and corrects the technology's dimensional unit conversion. This is a predictive approximation without field-solver signoff accuracy.\u003c/p\u003e\n\u003cp\u003ePhysical checks and declared functional bounds remain mandatory. Quality has no\nfixed allowed-degradation threshold. Each \u003ccode\u003esource_*\u003c/code\u003e job simulates the declared\nsource circuit with exactly the same testbench, model resources, parameters,\nload and measurement window as its paired extracted-candidate job. A source\nobservation is the 100-point electrical baseline; it is independent of the\nsubmitted GDS. All individual pairs are retained in the evaluation report.\u003c/p\u003e\n\u003cp\u003eFor a post-layout observation x and its source observation b:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eMaximize: q = x/b; minimize: q = b/x. When a numerical scale s is declared,\nuse (x+s)/(b+s) or its inverse. This handles zero-valued error measurements;\ns is a normalization floor, not an allowed degradation or pass threshold.\u003c/li\u003e\n\u003cli\u003eAmplitude dB: q = 10^((x-b)/20) for maximize, its inverse for minimize.\u003c/li\u003e\n\u003cli\u003eTarget: q = 1/(1+abs(x-b)/s), with a declared physical scale s. Signed and\nzero-valued operating points are never divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eScoring uses \u003ccode\u003elayout\u003c/code\u003e. A metric uses its worst paired quality q. The score is\nS = 100 * product(q_i ** w_i), including area quality\nq_area = area_reference / candidate_functional_area. The weights below sum to\none. Dimensions describe measurements but do not determine their weights.\nPhysical or functional rejection scores zero; missing or invalid measurements\nproduce an unknown score, including measurements with zero weight.\nSource-equivalent performance at the area reference scores 100; improvements\ncan exceed 100. A weight expresses a tradeoff, not a hard acceptance limit.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eDefinition / observations\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eQuality rule\u003c/th\u003e\n\u003cth\u003eFunctional bounds\u003c/th\u003e\n\u003cth\u003eScale\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estate_0\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003efind v(ZN) at=0.110n\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003efunctional check\u003c/td\u003e\n\u003ctd\u003e0.9 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estate_1\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003efind v(ZN) at=0.610n\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003efunctional check\u003c/td\u003e\n\u003ctd\u003e0.9 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estate_2\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003efind v(ZN) at=1.110n\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003efunctional check\u003c/td\u003e\n\u003ctd\u003e−∞ … 0.1\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estate_3\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003efind v(ZN) at=1.610n\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003efunctional check\u003c/td\u003e\n\u003ctd\u003e0.9 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estate_4\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003efind v(ZN) at=2.110n\u003c/c nt remains \u003cstrong\u003e2\u003c/strong\u003e; it is independent of\nthe reference-relative task score.\u003c/p\u003e\n\u003ch3 id=\"problem-standard-cell-design-guidance\"\u003eStandard-cell design guidance\u003c/h3\u003e\n\u003cp\u003ePlan the device rows, power rails and signal access before routing. Represent\npull-up and pull-down connectivity as transistor-edge graphs; explore compatible\nEuler trails and alternative orderings to share diffusion and reduce breaks.\nChoose among legal orderings using routing length, parasitic loading and signal\naccess, rather than diffusion sharing alone. Preserve the fixed netlist sizes,\nmodels and connectivity; size optimization is outside this task.\u003c/p\u003e\n\u003cp\u003eUse the task's declared row height, grid and rail geometry. Keep local routes\ncompact, leave signal pins accessible, and avoid consuming extra routing layers\nwithout benefit. Check DRC and named-port LVS, then extract the candidate and\ncompare both transition directions and power with the source simulation. Iterate\non measured parasitic effects rather than visual compactness alone. These are\noptional techniques, not a mandated algorithm or reference placement.\u003c/p\u003e\n\u003cp\u003eAdapted from Xu et al., \u003cem\u003eStandard Cell Library Design and Optimization Methodology\nfor ASAP7 PDK\u003c/em\u003e, Sections 2–3 (https://arxiv.org/abs/1807.11396). Its FinFET sizing,\ntrack counts and process-specific dimensions do not apply to this task.\u003c/p\u003e\n\u003ch3 id=\"problem-score-weights\"\u003eScore weights\u003c/h3\u003e\n\u003cp\u003eStandard-cell logic: propagation delay 48%; output transition 16%; supply power 16%; area 20%. Each objective's weight is divided equally among its metrics.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.2\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epropagation_delay\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.480000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_transition\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.160000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003esupply\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.160000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch2 id=\"problem-tools-and-submission\"\u003eTools and Submission\u003c/h2\u003e\n\u003cp\u003eSolve budget: \u003cstrong\u003e3 hours\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eUse the reviewed FreePDK45 KLayout, Magic and ngspice resources from \u003ccode\u003e/protocol/resources.json\u003c/code\u003e. For Magic RC extraction, use \u003ccode\u003e/resources/support/magic-vtl/freepdk45.tech\u003c/code\u003e, which includes the required model and unit adaptations. Runtime \u003ccode\u003e/protocol/task.json\u003c/code\u003e publishes the same constraints, measurements and scoring. Only declared inputs appear under \u003ccode\u003e/task\u003c/code\u003e. Write \u003ccode\u003e/workspace/output/final.gds\u003c/code\u003e, then explicitly submit with \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e. A harness that declares \u003ccode\u003eprocess-feedback\u003c/code\u003e uses the same frozen plan and backend identities for process checks; those snapshots do not count as final submissions.\u003c/p\u003e\n12:T214e,\u003cp\u003eArtifact, DRC, LVS and geometry gates precede candidate GDS extraction. Simulation consumes the candidate's Magic RC netlist unchanged; source simulation supplies the independent scoring baseline. VTG/VTL device classes are checked by independent LVS before the matching extraction profile is used. Extraction includes poly/metal sheet resistance, contacts/vias, geometry-dependent coupling and ground capacitance, and device junction area/perimeter. Wells are lumped connections; BSIM4 supplies device/junction behavior. Interconnect resistance and capacitance use the pinned community FreePDK45 Magic technology's estimated coefficients and native capacitance placement. The extraction adapter binds VTG/VTL models, preserves annotation layers and corrects the technology's dimensional unit conversion. This is a predictive approximation without field-solver signoff accuracy.\u003c/p\u003e\n\u003cp\u003ePhysical checks and declared functional bounds remain mandatory. Quality has no\nfixed allowed-degradation threshold. Each \u003ccode\u003esource_*\u003c/code\u003e job simulates the declared\nsource circuit with exactly the same testbench, model resources, parameters,\nload and measurement window as its paired extracted-candidate job. A source\nobservation is the 100-point electrical baseline; it is independent of the\nsubmitted GDS. All individual pairs are retained in the evaluation report.\u003c/p\u003e\n\u003cp\u003eFor a post-layout observation x and its source observation b:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eMaximize: q = x/b; minimize: q = b/x. When a numerical scale s is declared,\nuse (x+s)/(b+s) or its inverse. This handles zero-valued error measurements;\ns is a normalization floor, not an allowed degradation or pass threshold.\u003c/li\u003e\n\u003cli\u003eAmplitude dB: q = 10^((x-b)/20) for maximize, its inverse for minimize.\u003c/li\u003e\n\u003cli\u003eTarget: q = 1/(1+abs(x-b)/s), with a declared physical scale s. Signed and\nzero-valued operating points are never divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eScoring uses \u003ccode\u003elayout\u003c/code\u003e. A metric uses its worst paired quality q. The score is\nS = 100 * product(q_i ** w_i), including area quality\nq_area = area_reference / candidate_functional_area. The weights below sum to\none. Dimensions describe measurements but do not determine their weights.\nPhysical or functional rejection scores zero; missing or invalid measurements\nproduce an unknown score, including measurements with zero weight.\nSource-equivalent performance at the area reference scores 100; improvements\ncan exceed 100. A weight expresses a tradeoff, not a hard acceptance limit.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eDefinition / observations\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eQuality rule\u003c/th\u003e\n\u003cth\u003eFunctional bounds\u003c/th\u003e\n\u003cth\u003eScale\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estate_0\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003efind v(ZN) at=0.110n\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003efunctional check\u003c/td\u003e\n\u003ctd\u003e0.9 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estate_1\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003efind v(ZN) at=0.610n\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003efunctional check\u003c/td\u003e\n\u003ctd\u003e0.9 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estate_2\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003efind v(ZN) at=1.110n\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003efunctional check\u003c/td\u003e\n\u003ctd\u003e−∞ … 0.1\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estate_3\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u0 ode\u003estate_15\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003efind v(ZN) at=7.610n\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003efunctional check\u003c/td\u003e\n\u003ctd\u003e0.9 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estate_16\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003efind v(ZN) at=8.110n\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003efunctional check\u003c/td\u003e\n\u003ctd\u003e0.9 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003esupply\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eavg par('-v(vdd)*i(Vdd)') from=0 to=8.400n\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epropagation_delay\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eWorst paired quality over: delay_b1_fall_2, delay_b2_rise_3, delay_a_fall_4, delay_a_rise_8, delay_a_fall_9, delay_a_rise_13, delay_b2_fall_14, delay_b1_rise_15.\u003c/td\u003e\n\u003ctd\u003es\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_transition\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eWorst paired quality over: transition_b1_fall_2, transition_b2_rise_3, transition_a_fall_4, transition_a_rise_8, transition_a_fall_9, transition_a_rise_13, transition_b2_fall_14, transition_b1_rise_15.\u003c/td\u003e\n\u003ctd\u003es\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eArea reference: \u003cstrong\u003e2.0049 um2\u003c/strong\u003e. Complete functional bounding rectangle of the declared standard-cell reference GDS: 1.23 by 1.63 um = 2.0049 um2. Reference SHA-256: 1ebcc6f4d7a8f5c50846b5cdfd60f3039fb96caf455b89f2d7f30568c5a2af94. This footprint includes the maintained explicit taps and routing.\u003c/p\u003e\n\u003cp\u003eThe capability coefficient remains \u003cstrong\u003e2\u003c/strong\u003e; it is independent of\nthe reference-relative task score.\u003c/p\u003e\n\u003ch3\u003eStandard-cell design guidance\u003c/h3\u003e\n\u003cp\u003ePlan the device rows, power rails and signal access before routing. Represent\npull-up and pull-down connectivity as transistor-edge graphs; explore compatible\nEuler trails and alternative orderings to share diffusion and reduce breaks.\nChoose among legal orderings using routing length, parasitic loading and signal\naccess, rather than diffusion sharing alone. Preserve the fixed netlist sizes,\nmodels and connectivity; size optimization is outside this task.\u003c/p\u003e\n\u003cp\u003eUse the task's declared row height, grid and rail geometry. Keep local routes\ncompact, leave signal pins accessible, and avoid consuming extra routing layers\nwithout benefit. Check DRC and named-port LVS, then extract the candidate and\ncompare both transition directions and power with the source simulation. Iterate\non measured parasitic effects rather than visual compactness alone. These are\noptional techniques, not a mandated algorithm or reference placement.\u003c/p\u003e\n\u003cp\u003eAdapted from Xu et al., \u003cem\u003eStandard Cell Library Design and Optimization Methodology\nfor ASAP7 PDK\u003c/em\u003e, Sections 2–3 (https://arxiv.org/abs/1807.11396). Its FinFET sizing,\ntrack counts and process-specific dimensions do not apply to this task.\u003c/p\u003e\n\u003ch3\u003eScore weights\u003c/h3\u003e\n\u003cp\u003eStandard-cell logic: propagation delay 48%; output transition 16%; supply power 16%; area 20%. Each objective's weight is divided equally among its metrics.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.2\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epropagation_delay\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.480000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_transition\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.160000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003esupply\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.160000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n13:T6d9,\u003cp\u003eSubmit a nonempty GDSII of at most 10 MiB. Enable all checks present in the supplied KLayout DRC deck, including grid and antenna checks, with no waivers. Strict LVS checks named ports, models, W/L and actual well/tap connectivity; library-specific implicit or global rail connections are disabled. The upstream deck does not implement its documented different-potential well-spacing rule; it is not a complete foundry signoff deck.\u003c/p\u003e\n\u003cp\u003eThe hard functional envelope is 100 um by 100 um. Its bounding rectangle includes every drawing layer 1/0 through 29/0: active, wells, implants, threshold markers, poly, contacts, all ten metals and all nine vias. It supplies the scored footprint in um2. Put functional geometry on these layers; pin-purpose and annotation geometry is excluded. Electrical labels use poly or metal drawing layers (9/0 and 11/0, 13/0, ..., 29/0). Non-electrical annotation text is ignored by extraction.\u003c/p\u003e\n\u003cp\u003eTranslation, equivalent hierarchy and internal instance renaming are allowed. LVS permits source/drain exchange and equivalent parallel devices; any such layout must also pass the same RC-based electrical requirements. Preserve top-level port identities and explicit body connections.\u003c/p\u003e\n\u003cp\u003eThe standard-cell functional frame has fixed height 1.63 um and width on a 0.01 um grid. Coordinates below are relative to its lower-left functional bound; global translation remains allowed. Supply rails must be continuous on metal1 and bound by LVS to the named supply.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eVDD\u003c/code\u003e: centre y = 1.515 um, thickness at least 0.07 um, from left + 0.115 um to right − 0.03 um.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eVSS\u003c/code\u003e: centre y = 0.115 um, thickness at least 0.07 um, from left + 0.115 um to right − 0.03 um.\u003c/li\u003e\n\u003c/ul\u003e\n6:[\"$\",\"$8\",null,{\"fallback\":[\"$\",\"p\",null,{\"children\":\"Loading published evidence…\"}],\"children\":[\"$\",\"$L10\",null,{\"task\":{\"case_path\":\"tasks/freepdk45/nangate45-pdk/cases/AOI21_X1/case.toml\",\"coefficient\":2,\"collection\":\"nangate45-pdk\",\"configuration_url\":\"/ICLayout-Bench/assets/d9ce43cffb98fa1756ef7ba34c343716a1f413f55bef095b6f6dce04a4344ce5.txt\",\"description_html\":\"$11\",\"description_path\":\"tasks/freepdk45/nangate45-pdk/cases/AOI21_X1/problem.md\",\"hours\":3,\"id\":\"freepdk45.nangate45-pdk.AOI21_X1\",\"inputs\":{\"description\":{\"format\":\"text\",\"path\":\"problem.md\",\"sha256\":\"4ace260ca69cbe7c09224a583aaffcde13d68ad6fd81ad5bcb2ee9554fe19311\"},\"netlist\":{\"format\":\"spice\",\"path\":\"materials/circuit.spice\",\"sha256\":\"07d8b2857f5ecd7bde8d5b3e231b16b6819272db2d19c1ee4882094e04bc909e\",\"subcircuit\":\"AOI21_X1\"},\"performance\":{\"format\":\"spice\",\"path\":\"materials/testbench.spice\",\"sha256\":\"f8401ddcc740853f48b867
