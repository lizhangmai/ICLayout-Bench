ve\"\u003eOptimization objective\u003c/h3\u003e\n\u003cp\u003eMaximize the declared quality score within the solve budget while satisfying all physical and necessary functional requirements. The first passing DRC, LVS and required electrical checks establish a feasible baseline. Continue improving the scored metrics from that baseline; a passing check or \u003ccode\u003etask_success = true\u003c/code\u003e does not mean that the quality objectives have been achieved.\u003c/p\u003e\n\u003ch2 id=\"problem-inputs-and-interface\"\u003eInputs and Interface\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003ematerials/circuit.cdl\u003c/code\u003e is the complete physical core with four HBTs, eight resistors, three MIM decoupler banks and nine three-terminal RF MIM capacitors. Preserve every model, dimension, multiplier, connection and ordered top-level terminal. \u003ccode\u003ematerials/circuit.spice\u003c/code\u003e is its declared simulation representation. Native \u003ccode\u003erfcmim\u003c/code\u003e is an explicit parameter-preserving alias of the PDK \u003ccode\u003ecap_rfcmim\u003c/code\u003e, including each capacitor's actual feed width.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003ematerials/rf-macros.gds\u003c/code\u003e, \u003ccode\u003erf-macros.json\u003c/code\u003e and \u003ccode\u003erf-models.spice\u003c/code\u003e supply twelve fixed transmission-line cells, the BEOL ground context and the pinned upstream S2P conversions. The public amplifier ports are RF_INPUT, RF_OUTPUT, VCC, VBB1, VBB2 and GND; the core additionally exposes four choke, four emitter-degeneration and four shunt matching terminals named in its subcircuit declaration. Connect only at the declared physical landings.\u003c/p\u003e\n\u003ch2 id=\"problem-operating-conditions\"\u003eOperating Conditions\u003c/h2\u003e\n\u003cp\u003eUse typical HBT/resistor/capacitor models at 26.85 °C, VCC=1.35 V, VBB1=0.90 V and VBB2=0.93 V. Both ports have a 50 Ω reference and 5 µF fixture DC blocks. The paired source and candidate use the same 109-point linear sweep from 146 to 173 GHz, inside the supplied model coverage. The original independent sources with equal voltage are grouped onto the physical rails; all physical decouplers remain present. The fixture supplies a 1 TΩ numerical reference shunt.\u003c/p\u003e\n\u003ch2 id=\"problem-physical-requirements\"\u003ePhysical Requirements\u003c/h2\u003e\n\u003cp\u003eSubmit a single GDS top cell \u003ccode\u003eFMD_QNC_04_160GHz_LNA\u003c/code\u003e, at most 32 MiB, within a 1200×1200 µm functional outline. Native DRC, strict circuit/port LVS and fixed-macro checks must pass. Only individually enumerated inherited curved-edge and recommended package-exit markers are excepted; core spacing, enclosure and functional rules remain enforced. Exceptions retain their declared cell and coordinate scope, so a relocated assembly must still satisfy the complete DRC plan.\u003c/p\u003e\n\u003cp\u003ePlace exactly one instance of every supplied protected cell, preserving its per-layer geometry and the assembly's relative pose. A common grid-aligned translation, 90-degree rotation or mirror is allowed. Make free-core connections at declared landings; do not modify, duplicate, flatten-copy or bypass fixed RF bodies. Matching lines are shunt networks, not series replacements.\u003c/p\u003e\n\u003cp\u003eThe evaluator verifies macro geometry, then replaces each RF body with its existing terminal landings for native extraction. It retains all native devices and extracts nominal 2.5D coupling capacitance from candidate geometry using KPEX. Fixed RF line response comes from the upstream S2P models. This co-simulation includes candidate capacitance; it does not model free-wire R/L or new full-wave interactions. Physical boundaries were reconstructed from upstream GDS and native terminals; independent upstream EM port-plane calibration is unavailable. The task does not claim that additional accuracy.\u003c/p\u003e\n\u003ch2 id=\"problem-electrical-requirements-and-scoring\"\u003eElectrical Requirements and Scoring\u003c/h2\u003e\n\u003cp\u003eFinite completed operating-point and RF measurements are required. Squared reflections and peak-to-peak delay must be nonnegative; no quality-score floor or reference-relative performance cutoff determines feasibility.\u003c/p\u003e\n\u003cp\u003eFor each metric, degradation is measured against the frozen source under the same conditions. Quality is 1 for equal or better performance and \u003ccode\u003e1/(1+d/s)\u003c/code\u003e for positive degradation \u003ccode\u003ed\u003c/code\u003e at scale \u003ccode\u003es\u003c/code\u003e. The final score is 100 times the weighted geometric mean, after physical and execution validity checks.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eReduction over 146–173 GHz\u003c/th\u003e\n\u003cth\u003eScale\u003c/th\u003e\n\u003cth\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eband_gain\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMinimum \u003ccode\u003e20 log10(abs(S21))\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e3 dB loss\u003c/td\u003e\n\u003ctd\u003e60%\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003einput_reflection\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMaximum \u003ccode\u003eabs(S11)^2\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e0.05 increase\u003c/td\u003e\n\u003ctd\u003e25%\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_reflection\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMaximum \u003ccode\u003eabs(S22)^2\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e0.05 increase\u003c/td\u003e\n\u003ctd\u003e15%\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eGroup-delay ripple, DC power and functional area are diagnostics. Noise is not scored: the upstream pi and S2P implementations have not established equivalent noise accuracy. There are no easy bias, supply or area credits. Invalid physical or circuit submissions receive zero.\u003c/p\u003e\n\u003ch2 id=\"problem-tools-and-submission\"\u003eTools and Submission\u003c/h2\u003e\n\u003cp\u003eSolve budget: \u003cstrong\u003e1.5 hours\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eUse the declared open EDA environment and reviewed IHP resources. The supported flow uses KLayout for native DRC/LVS and layout work, KPEX for candidate capacitance and ngspice for the complete RF simulation. Submit \u003ccode\u003eoutput/final.gds\u003c/code\u003e; the evaluator freezes and independently checks it. Source code and author reference assets are not needed at evaluation time.\u003c/p\u003e\n\u003ch3 id=\"problem-solve-workflow\"\u003eSolve workflow\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eRead the declared circuit and materials, \u003ccode\u003e/protocol/task.json\u003c/code\u003e for paths, constraints and reviewed resources, and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e for capabilities and helper commands. Task inputs under \u003ccode\u003e/task\u003c/code\u003e and resources under \u003ccode\u003e/resources\u003c/code\u003e are read-only; construct the layout in \u003ccode\u003e/workspace\u003c/code\u003e with the declared tools. With layout MCP, paths and commands refer to the remote EDA workspace. Create your own implementation with real devices, interconnect and pins, using your own tool loop without delegating to other agents; reference layouts and author code are not solver inputs.\u003c/li\u003e\n\u003cli\u003eInspect \u003ccode\u003eresources.external\u003c/code\u003e before using external tools. Each command starts a fresh shell: when tool modules are declared, source \u003ccode\u003e/usr/share/Modules/init/bash\u003c/code\u003e and load the selected tool's modules; export its declared \u003ccode\u003etool_environment\u003c/code\u003e settings in that same command. Repeat as needed and use batch or headless operation. Local manuals, command references, and release notes may be available within the declared EDA installation and PDK resource directories. Locate these resources through \u003ccode\u003e/protocol/task.json\u003c/code\u003e and consult the documentation for the installed tool version when diagnosing unfamiliar syntax or tool failures.\u003c/li\u003e\n\u003cli\u003eGenerate an initial candidate and submit a snapshot early. When \u003ccode\u003eprocess-feedback\u003c/code\u003e is available, check the current GDS with layout MCP \u003ccode\u003echeck\u003c/code\u003e or \u003ccode\u003epython -I /protocol/process_check.py\u003c/code\u003e before the final submission. This runs the final evaluator's complete plan and returns engineering diagnostics and candidate measurements, without scores or normalized quality factors. Checks have no count limit and consume the same wall-clock budget. Inspect the physical and functional results and all scored metrics; successful tool execution alone does not establish requirement satisfaction. Read paginated diagnostics with \u003ccode\u003ereport\u003c/code\u003e when using MCP. Local exploratory checks do not replace this complete check.\u003c/li\u003e\n\u003cli\u003eUse the remaining time for measured improvements to the declared quality objectives. Identify the limiting scored metrics, make targeted layout changes, regenerate and check the candidate, and compare measurements with the previous candidate and the stated scoring targets and trade-offs. Preserve the best valid candidate and revert changes that worsen the overall objective. Repeat while time and useful improvements remain; passing validity checks alone is not a stopping condition.\u003c/li\u003e\n\u003cli\u003eStop optimization when the budget expires, all declared quality objectives are achieved, or measured trials support convergence. If stopping early, explain the changes tried, the metric comparisons and the remaining limitations. Track remaining time through session status. At soft-budget expiry, finish or cancel already-started work and submit immediately; do not start another command, check or optimization round. If an MCP execution is running, use \u003ccode\u003epoll\u003c/code\u003e with its \u003ccode\u003eexecution_id\u003c/code\u003e and the returned \u003ccode\u003enext_offset\u003c/code\u003e as \u003ccode\u003eoffset\u003c/code\u003e until completion, or cancel it and wait for it to stop.\u003c/li\u003e\n\u003cli\u003eFinish or cancel outstanding work, restore your best candidate to the declared output path, and explicitly submit it before ending the session. With layout MCP \u003ccode\u003esubmit\u003c/code\u003e, remove the \u003ccode\u003e/workspace/\u003c/code\u003e prefix from \u003ccode\u003eoutput.path\u003c/code\u003e; with the container interface, run \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e. Wait for the receipt: only the last accepted snapshot is judged, and writing a file alone is not submission. Acceptance confirms delivery; the framework independently evaluates validity and quality after the session.\u003c/li\u003e\n\u003c/ol\u003e\n12:T562,\u003cp\u003eFinite completed operating-point and RF measurements are required. Squared reflections and peak-to-peak delay must be nonnegative; no quality-score floor or reference-relative performance cutoff determines feasibility.\u003c/p\u003e\n\u003cp\u003eFor each metric, degradation is measured against the frozen source under the same conditions. Quality is 1 for equal or better performance and \u003ccode\u003e1/(1+d/s)\u003c/code\u003e for positive degradation \u003ccode\u003ed\u003c/code\u003e at scale \u003ccode\u003es\u003c/code\u003e. The final score is 100 times the weighted geometric mean, after physical and execution validity checks.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eReduction over 146–173 GHz\u003c/th\u003e\n\u003cth\u003eScale\u003c/th\u003e\n\u003cth\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eband_gain\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMinimum \u003ccode\u003e20 log10(abs(S21))\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e3 dB loss\u003c/td\u003e\n\u003ctd\u003e60%\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003einput_reflection\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMaximum \u003ccode\u003eabs(S11)^2\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e0.05 increase\u003c/td\u003e\n\u003ctd\u003e25%\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_reflection\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMaximum \u003ccode\u003eabs(S22)^2\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e0.05 increase\u003c/td\u003e\n\u003ctd\u003e15%\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eGroup-delay ripple, DC power and functional area are diagnostics. Noise is not scored: the upstream pi and S2P implementations have not established equivalent noise accuracy. There are no easy bias, supply or area credits. Invalid physical or circuit submissions receive zero.\u003c/p\u003e\n13:T5d1,\u003cp\u003eSubmit a single GDS top cell \u003ccode\u003eFMD_QNC_04_160GHz_LNA\u003c/code\u003e, at most 32 MiB, within a 1200×1200 µm functional outline. Native DRC, strict circuit/port LVS and fixed-macro checks must pass. Only individually enumerated inherited curved-edge and recommended package-exit markers are excepted; core spacing, enclosure and functional rules remain enforced. Exceptions retain their declared cell and coordinate scope, so a relocated assembly must still satisfy the complete DRC plan.\u003c/p\u003e\n\u003cp\u003ePlace exactly one instance of every supplied protected cell, preserving its per-layer geometry and the assembly's relative pose. A common grid-aligned translation, 90-degree rotation or mirror is allowed. Make free-core connections at declared landings; do not modify, duplicate, flatten-copy or bypass fixed RF bodies. Matching lines are shunt networks, not series replacements.\u003c/p\u003e\n\u003cp\u003eThe evaluator verifies macro geometry, then replaces each RF body with its existing terminal landings for native extraction. It retains all native devices and extracts nominal 2.5D coupling capacitance from candidate geometry using KPEX. Fixed RF line response comes from the upstream S2P models. This co-simulation includes candidate capacitance; it does not model free-wire R/L or new full-wave interactions. Physical boundaries were reconstructed from upstream GDS and native terminals; independent upstream EM port-plane calibration is unavailable. The task does not claim that additional accuracy.\u003c/p\u003e\n14:T1084,\u003cp\u003eSolve budget: \u003cstrong\u003e1.5 hours\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eUse the declared open EDA environment and reviewed IHP resources. The supported flow uses KLayout for native DRC/LVS and layout work, KPEX for candidate capacitance and ngspice for the complete RF simulation. Submit \u003ccode\u003eoutput/final.gds\u003c/code\u003e; the evaluator freezes and independently checks it. Source code and author reference assets are not needed at evaluation time.\u003c/p\u003e\n\u003ch3\u003eSolve workflow\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eRead the declared circuit and materials, \u003ccode\u003e/protocol/task.json\u003c/code\u003e for paths, constraints and reviewed resources, and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e for capabilities and helper commands. Task inputs under \u003ccode\u003e/task\u003c/code\u003e and resources under \u003ccode\u003e/resources\u003c/code\u003e are read-only; construct the layout in \u003ccode\u003e/workspace\u003c/code\u003e with the declared tools. With layout MCP, paths and commands refer to the remote EDA workspace. Create your own implementation with real devices, interconnect and pins, using your own tool loop without delegating to other agents; reference layouts and author code are not solver inputs.\u003c/li\u003e\n\u003cli\u003eInspect \u003ccode\u003eresources.external\u003c/code\u003e before using external tools. Each command starts a fresh shell: when tool modules are declared, source \u003ccode\u003e/usr/share/Modules/init/bash\u003c/code\u003e and load the selected tool's modules; export its declared \u003ccode\u003etool_environment\u003c/code\u003e settings in that same command. Repeat as needed and use batch or headless operation. Local manuals, command references, and release notes may be available within the declared EDA installation and PDK resource directories. Locate these resources through \u003ccode\u003e/protocol/task.json\u003c/code\u003e and consult the documentation for the installed tool version when diagnosing unfamiliar syntax or tool failures.\u003c/li\u003e\n\u003cli\u003eGenerate an initial candidate and submit a snapshot early. When \u003ccode\u003eprocess-feedback\u003c/code\u003e is available, check the current GDS with layout MCP \u003ccode\u003echeck\u003c/code\u003e or \u003ccode\u003epython -I /protocol/process_check.py\u003c/code\u003e before the final submission. This runs the final evaluator's complete plan and returns engineering diagnostics and candidate measurements, without scores or normalized quality factors. Checks have no count limit and consume the same wall-clock budget. Inspect the physical and functional results and all scored metrics; successful tool execution alone does not establish requirement satisfaction. Read paginated diagnostics with \u003ccode\u003ereport\u003c/code\u003e when using MCP. Local exploratory checks do not replace this complete check.\u003c/li\u003e\n\u003cli\u003eUse the remaining time for measured improvements to the declared quality objectives. Identify the limiting scored metrics, make targeted layout changes, regenerate and check the candidate, and compare measurements with the previous candidate and the stated scoring targets and trade-offs. Preserve the best valid candidate and revert changes that worsen the overall objective. Repeat while time and useful improvements remain; passing validity checks alone is not a stopping condition.\u003c/li\u003e\n\u003cli\u003eStop optimization when the budget expires, all declared quality objectives are achieved, or measured trials support convergence. If stopping early, explain the changes tried, the metric comparisons and the remaining limitations. Track remaining time through session status. At soft-budget expiry, finish or cancel already-started work and submit immediately; do not start another command, check or optimization round. If an MCP execution is running, use \u003ccode\u003epoll\u003c/code\u003e with its \u003ccode\u003eexecution_id\u003c/code\u003e and the returned \u003ccode\u003enext_offset\u003c/code\u003e as \u003ccode\u003eoffset\u003c/code\u003e until completion, or cancel it and wait for it to stop.\u003c/li\u003e\n\u003cli\u003eFinish or cancel outstanding work, restore your best candidate to the declared output path, and explicitly submit it before ending the session. With layout MCP \u003ccode\u003esubmit\u003c/code\u003e, remove the \u003ccode\u003e/workspace/\u003c/code\u003e prefix from \u003ccode\u003eoutput.path\u003c/code\u003e; with the container interface, run \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e. Wait for the receipt: only the last accepted snapshot is judged, and writing a file alone is not submission. Acceptance confirms delivery; the framework independently evaluates validity and quality after the session.\u003c/li\u003e\n\u003c/ol\u003e\n6:[\"$\",\"$8\",null,{\"fallback\":[\"$\",\"p\",null,{\"children\":\"Loading published evidence…\"}],\"children\":[\"$\",\"$L10\",null,{\"task\":{\"case_path\":\"tasks/ihp-sg13g2/TO_Apr2025/cases/160GHz_LNA/case.toml\",\"coefficient\":6,\"collection\":\"TO_Apr2025\",\"configuration_url\":\"/ICLayout-Bench/assets/a6ae78701575ff17f665371afb94fb1dc2d32e5de880f84d5dae43ca86258ca1.txt\",\"description_html\":\"$11\",\"description_path\":\"tasks/ihp-sg13g2/TO_Apr2025/cases/160GHz_LNA/problem.md\",\"hours\":1.5,\"id\":\"TO_Apr2025.160GHz_LNA\",\"inputs\":{\"description\":{\"format\":\"text\",\"path\":\"problem.md\",\"sha256\":\"0e68fad2eaec7b35aeef4cea062d52895c8f3310a1191721ba1687e65a2acc7c\"},\"macrolibrary\":{\"format\":\"gds\",\"path\":\"materials/rf-macros.gds\",\"sha256\":\"9e0ed664452aa800d1c053b08a136735a28bfd721c61f66eabeb44ebd28b4f2b\"},\"macros\":{\"format\":\"spice\",\"path\":\"materials/rf-models.spice\",\"sha256\":\"3e859f58343179cb7b030bb691ec887dbc1895e10c2fc8e3ba5749b7a8c445aa\"},\"macrospec\":{\"format\":\"json\",\"path\":\"materials/rf-macros.json\",\"sha256\":\"40b82bb91749d4dc168326c7f685068a99ffb3838a72c6c504281288675e5039\"},\"netlist\":{\"format\":\"spice\",\"path\":\"materials/circuit.cdl\",\"sha256\":\"00e866300b2c9d1018953b42777a5bc4ededde075018d3ad27a5dc5281110cbd\",\"subcircuit\":\"FMD_QNC_04_160GHz_LNA\"},\"performance\":{\"format\":\"spice\",\"path\":\"materials/testbench.spice\",\"sha256\":\"01f68e8b01aacc4d71fd875b19bc6d25c7e26c5ecbd0fb7998a706104abe2d77\"},\"simulation\":{\"format\":\"spice\",\"path\":\"materials/circuit.spice\",\"sha256\":\"3b387c0ffbf0dad0c5f21f112664e6a256a2254e7309747dfe8cc3e1992472f4\"}},\"licenses\":[{\"name\":\"LICENSE\",\"path\":\"tasks/ihp-sg13g2/TO_Apr2025/LICENSE\",\"url\":\"/ICLayout-Bench/assets/c71d239df91726fc519c6eb72d318ec65820627232b2f796219e87dcf35d0ab4.txt\"}],\"materials\":[{\"name\":\"problem.md\",\"role\":\"description\",\"url\":\"/ICLayout-Bench/assets/0e68fad2eaec7b35aeef4cea062d52895c8f3310a1191721ba1687e65a2acc7c.txt\"},{\"name\":\"materials/circuit.cdl\",\"role\":\"netlist\",\"url\":\"/ICLayout-Bench/assets/00e866300b2c9d1018953b42777a5bc4ededde075018d3ad27a5dc5281110cbd.txt\"},{\"name\":\"materials/circuit.spice\",\"role\":\"simulation\",\"url\":\"/ICLayout-Bench/assets/3b387c0ffbf0dad0c5f21f112664e6a256a2254e7309747dfe8cc3e1992472f4.txt\"},{\"name\":\"materials/testbench.spice\",\"role\":\"performance\",\"url\":\"/ICLayout-Bench/assets/01f68e8b01aacc4d71fd875b19bc6d25c7e26c5ecbd0fb7998a706104abe2d77.txt\"},{\"name\":\"materials/rf-macros.gds\",\"role\":\"macrolibrary\",\"url\":\"/ICLayout-Bench/assets/9e0ed664452aa800d1c053b08a136735a28bfd721c61f66eabeb44ebd28b4f2b.gds\"},{\"name\":\"materials/rf-macros.json\",\"role\":\"macrospec\",\"url\":\"/ICLayout-Bench/assets/40b82bb91749d4dc168326c7f685068a99ffb3838a72c6c504281288675e5039.txt\"},{\"name\":\"materials/rf-models.spice\",\"role\":\"macros\",\"url\":\"/ICLayout-Bench/assets/3e859f58343179cb7b030bb691ec887dbc1895e10c2fc8e3ba5749b7a8c445aa.txt\"}],\"metrics\":[{\"aggregation\":\"max\",\"category\":\"physical\",\"direction\":\"minimize\",\"id\":\"functional_area\",\"observations\":[\"geometry:area\"],\"unit\":\"um2\"},{\"aggregation\":\"max\",\"category\":\"performance\",\"direction\":\"minimize\",\"id\":\"delay_ripple\",\"observations\":[\"rf:delay_ripple\"],\"requirement\":{\"lower\":0,\"rationale\":\"A squared magnitude or peak-to-peak range must be nonnegative; its size is a quality target or diagnostic without a feasibility upper bound.\"},\"unit\":\"s\"},{\"aggregation\":\"max\",\"baseline\":[\"source_rf:input_reflection\"],\"category\":\"performance\",\"dimension\":\"response\",\"direction\":\"minimize\",\"id\":\"input_reflection\",\"normalization\":\"degradation\",\"observations\":[\"rf:input_reflection\"],\"requirement\":{\"lower\":0,\"rationale\":\"A squared magnitude or peak-to-peak range must be nonnegative; its size is a quality target or diagnostic without a feasibility upper bound.\"},\"scale\":0.05,\"unit\":\"1\"},{\"aggregation\":\"max\",\"baseline\":[\"source_rf:output_reflection\"],\"category\":\"performance\",\"dimension\":\"response\",\"direction\":\"minimize\",\"id\":\"output_reflection\",\"normalization\":\"degradation\",\"observations\":[\"rf:output_reflection\"],\"requirement\":{\"lower\":0,\"rationale\":\"A squared magnitude or peak-to-peak range must be nonnegative; its size is a quality target or diagnostic without a feasibility upper bound.\"},\"scale\":0.05,\"unit\":\"1\"},{\"aggregation\":\"min\",\"baseline\":[\"source_rf:band_gain\"],\"category\":\"performance\",\"dimension\":\"response\",\"direction\":\"maximize\",\"id\":\"band_gain\",\"normalization\":\"degradation\",\"observations\":[\"rf:band_gain\"],\"scale\":3,\"unit\":\"dB\"},{\"aggregation\":\"max\",\"category\":\"performance\",\"direction\":\"minimize\",\"id\":\"supply_power\",\"observations\":[\"rf:supply_power\"],\"unit\":\"W\"}],\"pdk\":\"ihp-sg13g2\",\"reader\":{\"category\":\"Amplifiers \u0026 RF\",\"summary\":\"Four-stage common-emitter RF amplifier with native RF capacitors and twelve fixed upstream transmission-line models.\",\"title\":\"160 GHz four-stage SiGe LNA with fixed upstream RF passives\"},\"scoring\":{\"area_metric\":\"functional_area\",\"area_target\":1440000,\"method\":\"layout\",\"rationale\":\"Worst in-band gain and the two port reflections assess RF quality against the same-condition source, with 3 dB and 0.05 reflected-power scales. Delay, bias, power and fixed-frame area are diagnostics. Quality does not impose a feasibility cutoff. Noise is excluded until model accuracy is established.\",\"weights\":{\"band_gain\":0.6,\"functional_area\":0,\"input_reflection\":0.25,\"output_reflection\":0.15}},\"sections\":{\"Electrical Requirements and Scoring\":\"$12\",\"Inputs and Interface\":\"\u003cp\u003e\u003ccode\u003ematerials/circuit.cdl\u003c/code\u003e is the complete physical core with four HBTs, eight resistors, three MIM decoupler banks and nine three-terminal RF MIM capacitors. Preserve every model, dimension, multiplier, connection and ordered top-level terminal. \u003ccode\u003ematerials/circuit.spice\u003c/code\u003e is its declared simulation representation. Native \u003ccode\u003erfcmim\u003c/code\u003e is an explicit parameter-preserving alias of the PDK \u003ccode\u003ecap_rfcmim\u003c/code\u003e, including each capacitor's actual feed width.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003ematerials/rf-macros.gds\u003c/code\u003e, \u003ccode\u003erf-macros.json\u003c/code\u003e and \u003ccode\u003erf-models.spice\u003c/code\u003e supply twelve fixed transmission-line cells, the BEOL ground context and the pinned upstream S2P conversions. The public amplifier ports are RF_INPUT, RF_OUTPUT, VCC, VBB1, VBB2 and GND; the core additionally exposes four choke, four emitter-degeneration and four shunt matching terminals named in its subcircuit declaration. Connect only at the declared physical landings.\u003c/p\u003e\\n\",\"Objective\":\"\u003cp\u003eImplement the supplied four-stage common-emitter LNA in IHP SG13G2. Preserve the complete circuit and supplied fixed RF passives. Optimize worst in-band gain and input/output matching against the paired source simulation. A physically valid reference establishes feasibility; it need not meet a performance target.\u003c/p\u003e\\n\u003ch3\u003eOptimization objective\u003c/h3\u003e\\n\u003cp\u003eMaximize the declared quality score within the solve budget while satisfying all physical and necessary functional requirements. The first passing DRC, LVS and required electrical checks establish a feasible baseline. Continue improving the scored metrics from that baseline; a passing check or \u003ccode\u003etask_success = true\u003c/code\u003e does not mean that the quality objectives have been achieved.\u003c/p\u003e\\n\",\"Operating Conditions\":\"\u003cp\u003eUse typical HBT/resistor/capacitor models at 26.85 °C, VCC=1.35 V, VBB1=0.90 V and VBB2=0.93 V. Both ports have a 50 Ω reference and 5 µF fixture DC blocks. The paired source and candidate use the same 109-point linear sweep from 146 to 173 GHz, inside the supplied model coverage. The original independent sources with equal voltage are grouped onto the physical rails; all physical decouplers remain present. The fixture supplies a 1 TΩ numerical reference shunt.\u003c/p\u003e\\n\",\"Physical Requirements\":\"$13\",\"Tools and Submission\":\"$14\"},\"source_url\":\"https://github.com/IHP-GmbH/TO_Apr2025/blob/63e203a0eccfb6028a1a0a8364553e4e979b55b3/160GHz_LNA/design_data/qucs-s/160GHz_LNA(MAIN).sch\",\"status\":\"qualified\",\"title\":\"160 GHz four-stage SiGe LNA with fixed upstream RF passives\",\"core\":false},\"catalog\":{\"tasks\":[],\"runs\":[],\"experiments\":[],\"contexts\":[],\"boards\":[]},\"previewRun\":null,\"preview\":null,\"evidenceError\":false}]}]\nc:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n15:I[27201,[\"/ICLayout-Bench/_next/static/chunks/2h60meymns2z5.js\"],\"IconMark\"]\n9:null\ne:[[\"$\",\"title\",\"0\",{\"children\":\"ICLayout-Bench | Circuit layout intelligence\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Independent evaluation of AI for integrated circuit layout. Compare model scores, explore circuit performance and inspect generated layouts.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/ICLayout-Bench/brand/iclayout-bench.svg\",\"type\":\"image/svg+xml\",\"sizes\":\"any\"}],[\"$\",\"$L15\",\"3\",{}]]\n"])</script></body></html>
