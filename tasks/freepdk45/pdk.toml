schema_version = 1

[agent]
schema_version = 1
id = "freepdk45"
support_profiles = [
    "models",
    "klayout",
    "magic-vtg",
    "magic-vtl",
]
checks = [
    [
        "python",
        "-c",
        "import pya; t=pya.Technology(); t.load('/resources/pdks/freepdk45/libs.tech/klayout/tech/freepdk45/freepdk45.lyt'); assert t.name; print('FreePDK45 technology loaded:', t.name)",
    ],
    [
        "python",
        "/resources/pdk-check.py",
        "models",
        "NMOS_VTL",
        "models.spice",
        "--length",
        "50n",
        "--width",
        "200n",
    ],
]

[agent.sources.freepdk45]
checkout = "third_party/freepdk45-open-pdks"
path = "freepdk45"
include = [
    "freepdk45/libs.tech/klayout/tech",
    "freepdk45/libs.tech/klayout/LICENSE",
    "freepdk45/libs.tech/klayout/README.md",
    "freepdk45/libs.tech/magic",
    "freepdk45/libs.tech/ngspice",
    "freepdk45/libs.tech/netgen",
]

[agent.environment]
ICLAYOUT_BENCH_PDK = "freepdk45"
PDK_ROOT = "/resources/pdks"
PDK_PATH = "/resources/pdks/freepdk45"
KLAYOUT_PATH = "/resources/pdks/freepdk45/libs.tech/klayout"

