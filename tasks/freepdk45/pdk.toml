[profiles.klayout.generated."freepdk45.drc"]
content = """
# Layout-Bench CLI adapter; original rules and switches are unchanged.
$output = $report
eval(RBA::Macro.new(\"/workspace/support/upstream/drc.lydrc\").text, binding)
"""
format = "text"

[profiles.klayout.generated."upstream.lvs"]
content = """
# Layout-Bench CLI adapter for the pinned BSD-3-Clause KLayout macro.
code = RBA::Macro.new(\"/workspace/support/upstream/lvs.lylvs\").text
code = code.sub(\"source($input)\", \"source($input, $topcell)\")
code = code.sub(\"report($report)\", \"report_lvs($report)\")
eval(code, binding)
"""
format = "text"

[profiles.klayout.generated."strict.lvs"]
content = """
# Layout-Bench strict candidate LVS; modified from the pinned BSD-3-Clause macro.
# Preserve device extraction and physical connectivity. Require real body taps,
# exact model/width/length and named ports; no cell-name shortcuts or pin swaps.
code = RBA::Macro.new(\"/workspace/support/upstream/lvs.lylvs\").text
# Promote geometry AND text labels through wrappers before reading DSL layers.
# The immutable original candidate remains available to all other gates.
flat_layout = RBA::Layout.new
flat_layout.read($input)
flat_layout.cell($topcell).flatten(true)
flat_layout.write(\"/workspace/flat-candidate.gds\")
code = code.sub(\"source($input)\", 'source(\"/workspace/flat-candidate.gds\", $topcell)')
code = code.sub(\"report($report)\", \"report_lvs($report)\")
# Flatten for candidate checks so an electrically empty wrapper cannot hide its child.
code = code.sub(\"\\ndeep\\n\", \"\\n\")
code = code.sub(/cheat\\([^
]+\\) \\{\\s*
/, \"\")
code = code.sub(\"\\n}\\n\\n# Define connectivity\", \"\\n# Define connectivity\")
code = code.sub(/# Global.*?# Actually performs the extraction/m, \"schematic.simplify\\n# Actually performs the extraction\")
code = code.sub(/# Tolerances for.*?max_branch_complexity/m, \"max_branch_complexity\")
raise \"Unexpected upstream shortcut remains\" if code.match?(/connect_global|connect_explicit|connect_implicit|equivalent_pins|cheat\\(/)
eval(code, binding)
"""
format = "text"

