schema_version = 2
kind = "layout_case"
id = "freepdk45.OpenRAM.cell_6t"
title = "Six-Transistor SRAM Bitcell"
status = "qualified"

[task]
kind = "netlist_to_gds"
family = "freepdk45_cell_6t"
coefficient = 6
environment = "freepdk45-nominal-predictive-rc"

[task.inputs.description]
path = "problem.md"
sha256 = "968b1b1a6e6466d85f91989459c4d807b8cfd6179d833f6c2dc754d7431acfa9"
format = "text"

[task.inputs.netlist]
path = "materials/circuit.spice"
sha256 = "18518f33516076c2bdca25c7036319734470c7757e3b1a2ab5c8e93b21fb4488"
format = "spice"
subcircuit = "cell_6t"

[task.inputs.performance]
path = "materials/testbench.spice"
format = "spice"
sha256 = "e5189d070fcb4bfd9d3910f299c8a2ec475d4047b3b5edbfd4cd244514816701"

[task.constraints]
schema_version = 1
quality = [
    { id = "area", type = "functional_bbox_area", layers_from = "outline" },
]

