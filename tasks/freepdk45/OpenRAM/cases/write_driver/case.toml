[task.output]
path = "output/final.gds"
format = "gds"
top_cell = "write_driver"
max_bytes = 10485760

[task.evaluation]
schema_version = 1
mode = "post_layout"

[[task.evaluation.jobs]]
id = "artifact"
stage = "check"
operation = "layout.artifact"
gate = "artifact"

[task.evaluation.jobs.inputs]
layout = "candidate"
task = "task"

[[task.evaluation.jobs]]
id = "drc"
stage = "check"
operation = "layout.drc"
gate = "drc"

[task.evaluation.jobs.inputs]
layout = "candidate"
task = "task"

[[task.evaluation.jobs]]
id = "lvs"
stage = "check"
operation = "layout.lvs"
gate = "lvs"

[task.evaluation.jobs.inputs]
layout = "candidate"
task = "task"
netlist = "input:netlist"

[task.evaluation.jobs.outputs]
database = "klayout-lvs"
binding = "json"

[[task.evaluation.jobs]]
id = "geometry"
stage = "check"
operation = "layout.geometry"
gate = "constraint"
requires = [
    "artifact",
    "drc",
    "lvs",
]

[task.evaluation.jobs.inputs]
layout = "candidate"
task = "task"
constraints = "input:constraints"
database = "job:lvs:database"
binding = "job:lvs:binding"

[[task.evaluation.jobs]]
id = "parasitics"
stage = "extract"
operation = "layout.extract_rc"
requires = [
    "artifact",
    "drc",
    "lvs",
    "geometry",
]

[task.evaluation.jobs.inputs]
layout = "candidate"
task = "task"

[task.evaluation.jobs.outputs]
netlist = "spice"

[task.evaluation.jobs.parameters]
ports = [
    "din",
    "bl",
    "br",
    "wen",
    "vdd",
    "gnd",
]

[[task.evaluation.jobs]]
id = "nominal"
stage = "simulate"
operation = "circuit.simulate"

[task.evaluation.jobs.inputs]
deck = "input:performance"
dut = "job:parasitics:netlist"

[task.evaluation.jobs.outputs]
waveform = "ngspice-raw"

[task.evaluation.jobs.parameters.exports]
waveform = "waveform.raw"

[task.evaluation.jobs.parameters.measurements]
bl_low = "V"
br_high = "V"
bl_high = "V"
br_low = "V"
z_bl = "V"
z_br = "V"
supply = "W"
data_delay_bl = "s"
data_delay_br = "s"

[[task.evaluation.jobs]]
id = "source_nominal"
stage = "simulate"
operation = "circuit.simulate"

[task.evaluation.jobs.inputs]
deck = "input:performance"
dut = "input:netlist"

[task.evaluation.jobs.outputs]
waveform = "ngspice-raw"

[task.evaluation.jobs.parameters.exports]
waveform = "waveform.raw"

[task.evaluation.jobs.parameters.measurements]
bl_low = "V"
br_high = "V"
bl_high = "V"
br_low = "V"
z_bl = "V"
z_br = "V"
supply = "W"
data_delay_bl = "s"
data_delay_br = "s"

[[task.evaluation.metrics]]
id = "functional_area"
category = "physical"
observations = [
    "geometry:area",
]
unit = "um2"
direction = "minimize"
aggregation = "max"

[[task.evaluation.metrics]]
id = "bl_low"
category = "performance"
observations = [
    "nominal:bl_low",
]
unit = "V"
direction = "minimize"
aggregation = "max"
upper = 0.1

[[task.evaluation.metrics]]
id = "br_high"
category = "performance"
observations = [
    "nominal:br_high",
]
unit = "V"
direction = "maximize"
aggregation = "min"
lower = 0.9

[[task.evaluation.metrics]]
id = "bl_high"
category = "performance"
observations = [
    "nominal:bl_high",
]
unit = "V"
direction = "maximize"
aggregation = "min"
lower = 0.9

[[task.evaluation.metrics]]
id = "br_low"
category = "performance"
observations = [
    "nominal:br_low",
]
unit = "V"
direction = "minimize"
aggregation = "max"
upper = 0.1

[[task.evaluation.metrics]]
id = "z_bl"
category = "performance"
observations = [
    "nominal:z_bl",
]
unit = "V"
direction = "target"
aggregation = "max"
lower = 0.45
upper = 0.55

[[task.evaluation.metrics]]
id = "z_br"
category = "performance"
observations = [
    "nominal:z_br",
]
unit = "V"
direction = "target"
aggregation = "max"
lower = 0.45
upper = 0.55

[[task.evaluation.metrics]]
id = "supply"
category = "performance"
observations = [
    "nominal:supply",
]
unit = "W"
direction = "minimize"
aggregation = "max"
dimension = "supply"
baseline = [
    "source_nominal:supply",
]
normalization = "ratio"
lower = 0
scale = 1e-12

[[task.evaluation.metrics]]
id = "data_delay"
category = "performance"
observations = [
    "nominal:data_delay_bl",
    "nominal:data_delay_br",
]
baseline = [
    "source_nominal:data_delay_bl",
    "source_nominal:data_delay_br",
]
unit = "s"
direction = "minimize"
aggregation = "max"
dimension = "response"
normalization = "ratio"
lower = 0.0

[task.evaluation.scoring]
method = "layout-v2"
area_metric = "functional_area"
area_target = 3.36

[toolchain]
schema_version = 1

[toolchain.backends.artifact]
type = "klayout-docker"

[toolchain.backends.artifact.settings]
image = "iclayout-bench-tools:local"
check = "artifact"
timeout_seconds = 120

[toolchain.backends.drc]
type = "klayout-docker"

[toolchain.backends.drc.settings]
image = "iclayout-bench-tools:local"
check = "drc"
timeout_seconds = 120
support = "build/support/freepdk45-klayout"
profile = "drc.json"

[toolchain.backends.drc.support_profiles]
support = "klayout"

[toolchain.backends.lvs]
type = "klayout-docker"

[toolchain.backends.lvs.settings]
image = "iclayout-bench-tools:local"
check = "lvs"
timeout_seconds = 120
support = "build/support/freepdk45-klayout"
profile = "strict-lvs.json"

[toolchain.backends.lvs.support_profiles]
support = "klayout"

[toolchain.backends.geometry]
type = "klayout-geometry-docker"

[toolchain.backends.geometry.settings]
image = "iclayout-bench-tools:local"
timeout_seconds = 60

[toolchain.backends.rc]
type = "magic-rc-docker"

[toolchain.backends.rc.settings]
image = "iclayout-bench-tools:local"
support = "build/support/freepdk45-magic-vtg"
technology = "freepdk45.tech"
tech_name = "freepdk45"
style = "spice3(sim)"
gds_readonly = false
case_insensitive_ports = true
label_layers = [
    [
        9,
        0,
    ],
    [
        11,
        0,
    ],
    [
        13,
        0,
    ],
    [
        15,
        0,
    ],
    [
        17,
        0,
    ],
    [
        19,
        0,
    ],
    [
        21,
        0,
    ],
    [
        23,
        0,
    ],
    [
        25,
        0,
    ],
    [
        27,
        0,
    ],
    [
        29,
        0,
    ],
]
timeout_seconds = 120

[toolchain.backends.rc.support_profiles]
support = "magic-vtg"

[toolchain.backends.ngspice]
type = "ngspice-docker"

[toolchain.backends.ngspice.settings]
image = "iclayout-bench-tools:local"
support = "build/support/freepdk45-models"
timeout_seconds = 120

[toolchain.backends.ngspice.support_profiles]
support = "models"

[toolchain.bindings]
"layout.artifact" = "artifact"
"layout.drc" = "drc"
"layout.lvs" = "lvs"
"layout.geometry" = "geometry"
"layout.extract_rc" = "rc"
"circuit.simulate" = "ngspice"

[qualification]
reference = "reference/write_driver.gds"
evidence = "README.md"

