schema_version = 2
kind = "layout_case"
id = "freepdk45.OpenRAM.write_driver"
title = "Complementary SRAM Write Driver"
status = "qualified"

[[assets]]
path = "materials/schematic.svg"
role = "schematic"
visibility = "maintainer"
format = "svg"
sha256 = "03d1aadfc9076f4c361878d2ccf8920ec987395dcab3699a95db4aa7173a79f0"

[[assets]]
path = "reference/write_driver.gds"
role = "reference"
visibility = "maintainer"
format = "gds"
sha256 = "2465c2b5293b138226ebc396cc13dd19bca4b8aba3268dfead8f83893316ba78"

[task]
hours = 3
kind = "netlist_to_gds"
family = "freepdk45_write_driver"
coefficient = 3
environment = "freepdk45-nominal-predictive-rc"

[task.inputs.description]
path = "problem.md"
sha256 = "925528aecb1b0cd13e29aab7fc092aadd62e7b08ad05d38e8577bc71a7af7638"
format = "text"

[task.inputs.netlist]
path = "materials/circuit.spice"
sha256 = "40cf5d0d27b138b06a7b6b0bbdffefbf6a0569fae6092f1fd6d64c5501a952b4"
format = "spice"
subcircuit = "write_driver"

[task.inputs.performance]
path = "materials/testbench.spice"
format = "spice"
sha256 = "a07fc802d7506c35db325b6aa8256ec558c5d606003547a22e9e8b5236a98ecf"

[task.constraints]
schema_version = 1
quality = [
    { id = "area", type = "functional_bbox_area", layers_from = "outline" },
]

