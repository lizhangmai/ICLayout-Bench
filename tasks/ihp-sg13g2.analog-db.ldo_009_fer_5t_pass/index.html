",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[\"$L6\",[[\"$\",\"script\",\"script-0\",{\"src\":\"/ICLayout-Bench/_next/static/chunks/3_2wwayut9q0b.js\",\"async\":true,\"nonce\":\"$undefined\"}]],[\"$\",\"$L7\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.MetadataOutlet\",\"children\":\"$@9\"}]}]]}],{},null,false,null]},null,false,\"$a\"]},null,false,null],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Lb\",null,{\"children\":\"$Lc\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Ld\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.Metadata\",\"children\":\"$Le\"}]}]}],null]}],false]],\"m\":\"$undefined\",\"G\":[\"$f\",[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/ICLayout-Bench/_next/static/chunks/25phisebeeifo.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]]],\"S\":true,\"h\":null,\"r\":\"$undefined\",\"s\":\"$undefined\",\"a\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"U2oZdoUjWqT_XfcDHuQ5i\"}\n10:I[1186,[\"/ICLayout-Bench/_next/static/chunks/3gll1ekbrh320.js\",\"/ICLayout-Bench/_next/static/chunks/3_2wwayut9q0b.js\"],\"default\"]\na:C\n11:T41b4,\u003ch1 id=\"problem-unity-feedback-regulator-with-internal-output-storage-layout-task\"\u003eUnity-Feedback Regulator with Internal Output Storage Layout Task\u003c/h1\u003e\n\u003ch2 id=\"problem-objective\"\u003eObjective\u003c/h2\u003e\n\u003cp\u003eLay out \u003ccode\u003eldo_009_fer_5t_pass\u003c/code\u003e with the complete physical error amplifier, pass array,\ncompensation, output storage, bleeder and reference path.\u003c/p\u003e\n\u003cp\u003eA five-transistor NMOS-input error amplifier drives a PMOS pass array;\nan on-chip diode-connected NMOS biases the tail mirror. The maintained circuit\nretains all seven source MOS groups (29 physical fingers), the output bleeder,\nreference-series resistor, Miller path and internal output capacitor. Unity\nfeedback senses output directly; there is no feedback divider. This adds\nphysical output storage, a reference impedance, explicit return ratio and\nzero-state startup to the existing externally loaded regulator coverage.\u003c/p\u003e\n\u003cp\u003eThe original 2 pF Miller compensation is deliberately retuned to five physical\n36.515 um square units, nominally 10.0293 pF. Thirteen 50.635 um square MIM\nunits retain the approximately 50 pF internal COUT. Four physical high-poly\nsegments implement the approximately 100 kohm bleeder and one implements\napproximately 10 kohm reference resistance. MOS dimensions and multiplicities\nare unchanged; explicit substrate/well taps are added. The 20 uA bias source\nand 0.9 V reference are external. The raw zero-volt loop measurement source\nbecomes an external zero-volt link between distinct output and sense ports;\nit is not a manufactured voltage-source device or an ideal common-mode servo.\u003c/p\u003e\n\u003ch2 id=\"problem-inputs-and-interface\"\u003eInputs and Interface\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003ematerials/circuit.cdl\u003c/code\u003e: authoritative native LVS circuit.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ematerials/circuit.spice\u003c/code\u003e: matching process-model representation.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ematerials/testbench.spice\u003c/code\u003e: operating point, return ratio and load steps.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ematerials/startup.spice\u003c/code\u003e: distinct zero-state resistive-load startup deck.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ematerials/sweeps.spice\u003c/code\u003e: distinct DC line/load and headroom sweeps.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eOrdered ports: \u003ccode\u003evdd vout vss nbias ref0 sense\u003c/code\u003e. VDD/VSS are supply/return;\nVOUT is regulated output; NBIAS receives an external 20 uA source \u003cstrong\u003efrom VDD\u003c/strong\u003e;\nREF0 receives an external 0.9 V reference; SENSE connects externally to VOUT\nthrough the zero-volt probe. Preserve this explicit high-impedance feedback\ninterface. No other drive is permitted on SENSE, and no extra internal servo\nor reference generator is part of the DUT. PMOS bodies connect to the VDD\nwell through its tap; NMOS/poly bodies connect through the VSS substrate tap.\nPreserve all W/L/m and internal connectivity; equivalent parallel fingers\nare permitted only when native LVS and all measurements pass.\u003c/p\u003e\n\u003cp\u003eAll following passives remain physical DUT devices, not external loads or\nparasitic annotations:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003ecmil\u003c/code\u003e: \u003ccode\u003evout\u003c/code\u003e to \u003ccode\u003eotao\u003c/code\u003e, 5 parallel 36.515 × 36.515 um MIM units, nominal total 10.029301 pF.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ecout\u003c/code\u003e: \u003ccode\u003evout\u003c/code\u003e to \u003ccode\u003evss\u003c/code\u003e, 13 parallel 50.635 × 50.635 um MIM units, nominal total 50.101434 pF.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003erbld\u003c/code\u003e: \u003ccode\u003evout\u003c/code\u003e to \u003ccode\u003evss\u003c/code\u003e, 4 series high-poly segments, each W=1 um / L=17.465 um, m=1 and b=0.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003erref\u003c/code\u003e: \u003ccode\u003eref0\u003c/code\u003e to \u003ccode\u003evref\u003c/code\u003e, 1 series high-poly segments, each W=1 um / L=6.94 um, m=1 and b=0.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"problem-operating-conditions\"\u003eOperating Conditions\u003c/h2\u003e\n\u003cp\u003eUse typical LV MOS, MIM and resistor models at 27 C. Qualification uses\nVDD=1.2/1.3 V and REF0=0.9 V. The main deck starts from a solved operating\npoint with 0.1/0.5 mA constant-current loads; each doubles at 2–2.02 us and\nreturns at 10.02–10.04 us. Run to 18 us with 1 ns maximum step, Gear order 2,\n\u003ccode\u003ershunt=1e12\u003c/code\u003e, \u003ccode\u003ereltol=1e-5\u003c/code\u003e, \u003ccode\u003eabstol=1e-14\u003c/code\u003e, \u003ccode\u003evntol=1e-8\u003c/code\u003e.\nThere is no external output capacitor: internal COUT remains in candidate RC.\u003c/p\u003e\n\u003cp\u003eAC injects 1 V in series with the zero-volt output-to-SENSE link. Reference,\nsupply and current sources have zero AC drive. At the high-impedance MOS input\nboundary, \u003ccode\u003eT=-V(vout)/V(sense)\u003c/code\u003e defines return ratio. Sweep 0.01 Hz–1 GHz\nat 150 points/decade. Gain uses \u003ccode\u003e20 log10(abs(T))\u003c/code\u003e; continuous phase has no\nfitted offset. Unity frequency is the first descending 0 dB crossing and phase\nmargin is 180 degrees plus phase there. Missing crossings are errors.\u003c/p\u003e\n\u003cp\u003eStartup separately uses 900/9000 ohm output loads, with supply, reference and\nbias ramped linearly together from zero over 1/10 us. Use \u003ccode\u003euic\u003c/code\u003e, no internal\nnode initial conditions and 2 ns maximum step to 30 us. The load is resistive\nthroughout startup; this is not constant-current startup qualification. All\neight supply/load/ramp combinations must pass. After startup, the main deck's\nconstant-current load contract and its finite recovery windows apply separately.\u003c/p\u003e\n\u003cp\u003eDC sweeps use the same numerical tolerances. Sweep supply downward from 1.3\nto 0.8 V in 1 mV steps at 0.1/1 mA; measure line span only over 1.2–1.3 V.\nThe \u003cstrong\u003eregulation floor\u003c/strong\u003e is the first rising crossing of\n\u003ccode\u003eabs(VOUT−0.9)=0.03 V\u003c/code\u003e on that downward sweep. \u003ccode\u003eheadroom_v\u003c/code\u003e is this supply\nminus 0.9 V. This includes error-amplifier headroom or pass-device limitation;\nit is not a pass-resistance-only dropout rating. The sweep below the floor is\na boundary probe and is not a qualified low-supply operating range. Separately,\nsweep load 0.1–1 mA in 10 uA steps at each qualified supply for load span.\u003c/p\u003e\n\u003ch2 id=\"problem-physical-requirements\"\u003ePhysical Requirements\u003c/h2\u003e\n\u003cp\u003eSubmit GDSII top cell \u003ccode\u003eldo_009_fer_5t_pass\u003c/code\u003e, at most 10 MiB. Pass native main/maximal\nDRC with no waivers (standalone scope, density/antenna disabled), strict\nnamed-interface LVS including taps, and a 1600 × 330 um functional envelope.\nThe runtime outline includes complete device/contact/routing drawing layers;\nannotation and pin-purpose layers do not contribute to bounding-box area.\nCandidate Magic RC must retain all physical MOS/MIM/poly and interconnect\nparasitics. Half-grid GDS import is explicit. Magic idealizes tap connections;\nsource simulation uses finite contact models. Distributed substrate resistance,\nnoise, PVT, mismatch, arbitrary startup/reference sequencing, brownout and\nfabrication signoff remain unqualified.\u003c/p\u003e\n\u003ch2 id=\"problem-electrical-requirements-and-scoring\"\u003eElectrical Requirements and Scoring\u003c/h2\u003e\n\u003cp\u003ePhysical checks and declared functional bounds remain mandatory. Quality has no\nfixed allowed-degradation threshold. Each \u003ccode\u003esource_*\u003c/code\u003e job simulates the declared\nsource circuit with exactly the same testbench, model resources, parameters,\nload and measurement window as its paired extracted-candidate job. A source\nobservation is the 100-point electrical baseline; it is independent of the\nsubmitted GDS. All individual pairs are retained in the evaluation report.\u003c/p\u003e\n\u003cp\u003eFor a post-layout observation x and its source observation b:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eMaximize: q = x/b; minimize: q = b/x. When a numerical scale s is declared,\nuse (x+s)/(b+s) or its inverse. This handles zero-valued error measurements;\ns is a normalization floor, not an allowed degradation or pass threshold.\u003c/li\u003e\n\u003cli\u003eAmplitude dB: q = 10^((x-b)/20) for maximize, its inverse for minimize.\u003c/li\u003e\n\u003cli\u003eTarget: q = 1/(1+abs(x-b)/s), with a declared physical scale s. Signed and\nzero-valued operating points are never divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eScoring uses \u003ccode\u003elayout\u003c/code\u003e. A metric uses its worst paired quality q. The score is\nS = 100 * product(q_i ** w_i), including area quality\nq_area = area_reference / candidate_functional_area. The weights below sum to\none. Dimensions describe measurements but do not determine their weights.\nPhysical or functional rejection scores zero; missing or invalid measurements\nproduce an unknown score, including measurements with zero weight.\nSource-equivalent performance at the area reference scores 100; improvements\ncan exceed 100. A weight expresses a tradeoff, not a hard acceptance limit.\u003c/p\u003e\n\u003cp\u003eMeasurement definitions below use the supplied SPICE node/source names.\n\u003ccode\u003ev(n)\u003c/code\u003e is node voltage and \u003ccode\u003ei(V)\u003c/code\u003e is current into a voltage source; delivered\npower therefore uses a minus sign. \u003ccode\u003edb(z)=20*log10(abs(z))\u003c/code\u003e, \u003ccode\u003emag/abs\u003c/code\u003e\ndenote magnitude, and \u003ccode\u003ecph\u003c/code\u003e is continuous phase in radians. \u003ccode\u003efind\u003c/code\u003e, \u003ccode\u003ewhen\u003c/code\u003e,\n\u003ccode\u003efrom/to\u003c/code\u003e, and \u003ccode\u003erise/fall\u003c/code\u003e retain the deck's interpolation, window and\ncrossing conventions; SPICE suffixes p/n/u/m/meg/g mean pico/nano/micro/\nmilli/mega/giga. Nested \u003ccode\u003eavg\u003c/code\u003e, \u003ccode\u003emin\u003c/code\u003e, \u003ccode\u003emax\u003c/code\u003e, \u003ccode\u003evecmin/vecmax\u003c/code\u003e and \u003ccode\u003ederiv\u003c/code\u003e\nmean the stated window average, extrema and sampled derivative. All\ndeclared conditions are measured separately and paired with the same\nsource condition; a group uses its worst paired quality.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eDefinition / observations\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eQuality rule\u003c/th\u003e\n\u003cth\u003eFunctional bounds\u003c/th\u003e\n\u003cth\u003eScale\u003c/th\u003e\n\u003cth\u003eDimension\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003ev(vout)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.3\u003c/td\u003e\n\u003ctd\u003e1.3\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebias_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003ev(nbias)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.3\u003c/td\u003e\n\u003ctd\u003e1.3\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003equiescent_a\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003e-i(VDD)-@iload[current]\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eA\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003ctd\u003esupply\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003e-v(vdd)*i(VDD)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003ctd\u003esupply\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edc_gain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: Value of \u003ccode\u003e(db((-v(vout)/v(sense)))) at=0.01\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003emaximize / db20\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eunity_hz\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: Crossing coordinate where \u003ccode\u003e(db((-v(vout)/v(sense))))=0 fall=1\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eHz\u003c/td\u003e\n\u003ctd\u003emaximize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ephase_margin_deg\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: \u003ccode\u003e180+(find (180*cph((-v(vout)/v(sense)))/pi) when (db((-v(vout)/v(sense))))=0 fall=1)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003edeg\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 180\u003c/td\u003e\n\u003ctd\u003e180\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eminimum_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Minimum of \u003ccode\u003ev(vout) from=2u to=18u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.3\u003c/td\u003e\n\u003ctd\u003e1.3\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emaximum_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Maximum of \u003ccode\u003ev(vout) from=2u to=18u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.3\u003c/td\u003e\n\u003ctd\u003e1.3\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003erecovery_load_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Maximum of \u003ccode\u003e(abs(v(vout)-0.9)) from=5u to=9.5u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003erecovery_release_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Maximum of \u003ccode\u003e(abs(v(vout)-0.9)) from=13u to=17.5u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emean_power_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Mean of \u003ccode\u003e(-v(vdd)*i(VDD)) from=2u to=18u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003ctd\u003esupply\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estartup_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Maximum of \u003ccode\u003e(abs(v(vout)-0.9)) from=25u to=30u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estartup_peak_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Maximum of \u003ccode\u003ev(vout) from=0 to=30u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.3\u003c/td\u003e\n\u003ctd\u003e1.3\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estartup_minimum_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Minimum of \u003ccode\u003ev(vout) from=0 to=30u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e1.3\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eregulation_floor_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC: Crossing coordinate where \u003ccode\u003e(abs(v(vout)-0.9))=0.03 rise=1\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.3\u003c/td\u003e\n\u003ctd\u003e1.3\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eheadroom_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC sweep: \u003ccode\u003e(when (abs(v(vout)-0.9))=0.03 rise=1)-0.9\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eline_span_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC sweep: \u003ccode\u003e(max v(vout) from=1.3 to=1.2)-(min v(vout) from=1.3 to=1.2)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eload_span_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC sweep: \u003ccode\u003e(max v(vout))-(min v(vout))\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eArea reference: \u003cstrong\u003e65470.09 um2\u003c/strong\u003e. 54 expanded device instances; sum of device/contact envelopes 43312.7759 um2, per-side envelope allowance 0.6 um, 50% routing allowance and total outer width/height allowance 1.2 um. Estimate = ceil(100 * (1.5 * envelope_sum + 2 * margin * sqrt(envelope_sum) + margin^2)) / 100. Here margin is the total allowance across two opposite sides; the envelope sum is displayed rounded to four decimals. MOS/passive envelopes use declared W/L (or resistor dimensions) and multiplicity; explicit tap areas and HBT emitter/contact envelopes are included. This is a frozen engineering estimate, not a foundry minimum or a feasibility claim.\u003c/p\u003e\n\u003cp\u003eThe capability coefficient remains \u003cstrong\u003e8\u003c/strong\u003e; it is independent of\nthe reference-relative task score.\u003c/p\u003e\n\u003ch3 id=\"problem-score-weights\"\u003eScore weights\u003c/h3\u003e\n\u003cp\u003eIHP regulators: regulation and headroom 22.5%; load recovery 22.5%; startup 13.5%; loop stability 13.5%; AC transfer and extrema 4.5%; internal bias 1.8%; quiescent current 7.2%; power 4.5%; area 10%. Each objective's weight is divided equally among its metrics.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eheadroom_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eline_span_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eload_span_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eregulation_floor_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003erecovery_load_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.112500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003erecovery_release_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.112500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estartup_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estartup_minimum_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estartup_peak_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ephase_margin_deg\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.135000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edc_gain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.011250000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emaximum_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.011250000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eminimum_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.011250000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eunity_hz\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.011250000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebias_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.018000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003equiescent_a\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.072000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emean_power_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.022500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.022500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch2 id=\"problem-tools-and-submission\"\u003eTools and Submission\u003c/h2\u003e\n\u003cp\u003eSolve budget: \u003cstrong\u003e3 hours\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eDiscover inputs, resources and feedback through \u003ccode\u003e/protocol/task.json\u003c/code\u003e,\n\u003ccode\u003e/protocol/resources.json\u003c/code\u003e and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e. Use the supplied IHP\nprimitives, KLayout, Magic and ngspice. Write \u003ccode\u003e/workspace/output/final.gds\u003c/code\u003e and\nexplicitly submit it through the harness. Host configuration, source records\nand reference layouts are outside the standard solver inputs.\u003c/p\u003e\n12:T25e8,\u003cp\u003ePhysical checks and declared functional bounds remain mandatory. Quality has no\nfixed allowed-degradation threshold. Each \u003ccode\u003esource_*\u003c/code\u003e job simulates the declared\nsource circuit with exactly the same testbench, model resources, parameters,\nload and measurement window as its paired extracted-candidate job. A source\nobservation is the 100-point electrical baseline; it is independent of the\nsubmitted GDS. All individual pairs are retained in the evaluation report.\u003c/p\u003e\n\u003cp\u003eFor a post-layout observation x and its source observation b:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eMaximize: q = x/b; minimize: q = b/x. When a numerical scale s is declared,\nuse (x+s)/(b+s) or its inverse. This handles zero-valued error measurements;\ns is a normalization floor, not an allowed degradation or pass threshold.\u003c/li\u003e\n\u003cli\u003eAmplitude dB: q = 10^((x-b)/20) for maximize, its inverse for minimize.\u003c/li\u003e\n\u003cli\u003eTarget: q = 1/(1+abs(x-b)/s), with a declared physical scale s. Signed and\nzero-valued operating points are never divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eScoring uses \u003ccode\u003elayout\u003c/code\u003e. A metric uses its worst paired quality q. The score is\nS = 100 * product(q_i ** w_i), including area quality\nq_area = area_reference / candidate_functional_area. The weights below sum to\none. Dimensions describe measurements but do not determine their weights.\nPhysical or functional rejection scores zero; missing or invalid measurements\nproduce an unknown score, including measurements with zero weight.\nSource-equivalent performance at the area reference scores 100; improvements\ncan exceed 100. A weight expresses a tradeoff, not a hard acceptance limit.\u003c/p\u003e\n\u003cp\u003eMeasurement definitions below use the supplied SPICE node/source names.\n\u003ccode\u003ev(n)\u003c/code\u003e is node voltage and \u003ccode\u003ei(V)\u003c/code\u003e is current into a voltage source; delivered\npower therefore uses a minus sign. \u003ccode\u003edb(z)=20*log10(abs(z))\u003c/code\u003e, \u003ccode\u003emag/abs\u003c/code\u003e\ndenote magnitude, and \u003ccode\u003ecph\u003c/code\u003e is continuous phase in radians. \u003ccode\u003efind\u003c/code\u003e, \u003ccode\u003ewhen\u003c/code\u003e,\n\u003ccode\u003efrom/to\u003c/code\u003e, and \u003ccode\u003erise/fall\u003c/code\u003e retain the deck's interpolation, window and\ncrossing conventions; SPICE suffixes p/n/u/m/meg/g mean pico/nano/micro/\nmilli/mega/giga. Nested \u003ccode\u003eavg\u003c/code\u003e, \u003ccode\u003emin\u003c/code\u003e, \u003ccode\u003emax\u003c/code\u003e, \u003ccode\u003evecmin/vecmax\u003c/code\u003e and \u003ccode\u003ederiv\u003c/code\u003e\nmean the stated window average, extrema and sampled derivative. All\ndeclared conditions are measured separately and paired with the same\nsource condition; a group uses its worst paired quality.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eDefinition / observations\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eQuality rule\u003c/th\u003e\n\u003cth\u003eFunctional bounds\u003c/th\u003e\n\u003cth\u003eScale\u003c/th\u003e\n\u003cth\u003eDimension\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003ev(vout)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.3\u003c/td\u003e\n\u003ctd\u003e1.3\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebias_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003ev(nbias)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.3\u003c/td\u003e\n\u003ctd\u003e1.3\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003equiescent_a\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003e-i(VDD)-@iload[current]\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eA\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003ctd\u003esupply\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003e-v(vdd)*i(VDD)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003ctd\u003esupply\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edc_gain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: Value of \u003ccode\u003e(db((-v(vout)/v(sense)))) at=0.01\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003emaximize / db20\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eunity_hz\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: Crossing coordinate where \u003ccode\u003e(db((-v(vout)/v(sense))))=0 fall=1\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eHz\u003c/td\u003e\n\u003ctd\u003emaximize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ephase_margin_deg\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: \u003ccode\u003e180+(find (180*cph((-v(vout)/v(sense)))/pi) when (db((-v(vout)/v(sense))))=0 fall=1)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003edeg\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 180\u003c/td\u003e\n\u003ctd\u003e180\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eminimum_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Minimum of \u003ccode\u003ev(vout) from=2u to=18u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.3\u003c/td\u003e\n\u003ctd\u003e1.3\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emaximum_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Maximum of \u003ccode\u003ev(vout) from=2u to=18u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.3\u003c/td\u003e\n\u003ctd\u003e1.3\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003erecovery_load_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Maximum of \u003ccode\u003e(abs(v(vout)-0.9)) from=5u to=9.5u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003erecovery_release_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Maximum of \u003ccode\u003e(abs(v(vout)-0.9)) from=13u to=17.5u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emean_power_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Mean of \u003ccode\u003e(-v(vdd)*i(VDD)) from=2u to=18u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003ctd\u003esupply\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estartup_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Maximum of \u003ccode\u003e(abs(v(vout)-0.9)) from=25u to=30u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estartup_peak_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Maximum of \u003ccode\u003ev(vout) from=0 to=30u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.3\u003c/td\u003e\n\u003ctd\u003e1.3\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estartup_minimum_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Minimum of \u003ccode\u003ev(vout) from=0 to=30u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e1.3\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eregulation_floor_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC: Crossing coordinate where \u003ccode\u003e(abs(v(vout)-0.9))=0.03 rise=1\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.3\u003c/td\u003e\n\u003ctd\u003e1.3\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eheadroom_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC sweep: \u003ccode\u003e(when (abs(v(vout)-0.9))=0.03 rise=1)-0.9\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eline_span_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC sweep: \u003ccode\u003e(max v(vout) from=1.3 to=1.2)-(min v(vout) from=1.3 to=1.2)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eload_span_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC sweep: \u003ccode\u003e(max v(vout))-(min v(vout))\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eArea reference: \u003cstrong\u003e65470.09 um2\u003c/strong\u003e. 54 expanded device instances; sum of device/contact envelopes 43312.7759 um2, per-side envelope allowance 0.6 um, 50% routing allowance and total outer width/height allowance 1.2 um. Estimate = ceil(100 * (1.5 * envelope_sum + 2 * margin * sqrt(envelope_sum) + margin^2)) / 100. Here margin is the total allowance across two opposite sides; the envelope sum is displayed rounded to four decimals. MOS/passive envelopes use declared W/L (or resistor dimensions) and multiplicity; explicit tap areas and HBT emitter/contact envelopes are included. This is a frozen engineering estimate, not a foundry minimum or a feasibility claim.\u003c/p\u003e\n\u003cp\u003eThe capability coefficient remains \u003cstrong\u003e8\u003c/strong\u003e; it is independent of\nthe reference-relative task score.\u003c/p\u003e\n\u003ch3\u003eScore weights\u003c/h3\u003e\n\u003cp\u003eIHP regulators: regulation and headroom 22.5%; load recovery 22.5%; startup 13.5%; loop stability 13.5%; AC transfer and extrema 4.5%; internal bias 1.8%; quiescent current 7.2%; power 4.5%; area 10%. Each objective's weight is divided equally among its metrics.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eheadroom_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eline_span_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eload_span_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eregulation_floor_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003erecovery_load_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.112500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003erecovery_release_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.112500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estartup_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estartup_minimum_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estartup_peak_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ephase_margin_deg\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.135000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edc_gain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.011250000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emaximum_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.011250000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eminimum_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.011250000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eunity_hz\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.011250000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebias_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.018000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003equiescent_a\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.072000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emean_power_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.022500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.022500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n13:T56e,\u003cp\u003eLay out \u003ccode\u003eldo_009_fer_5t_pass\u003c/code\u003e with the complete physical error amplifier, pass array,\ncompensation, output storage, bleeder and reference path.\u003c/p\u003e\n\u003cp\u003eA five-transistor NMOS-input error amplifier drives a PMOS pass array;\nan on-chip diode-connected NMOS biases the tail mirror. The maintained circuit\nretains all seven source MOS groups (29 physical fingers), the output bleeder,\nreference-series resistor, Miller path and internal output capacitor. Unity\nfeedback senses output directly; there is no feedback divider. This adds\nphysical output storage, a reference impedance, explicit return ratio and\nzero-state startup to the existing externally loaded regulator coverage.\u003c/p\u003e\n\u003cp\u003eThe original 2 pF Miller compensation is deliberately retuned to five physical\n36.515 um square units, nominally 10.0293 pF. Thirteen 50.635 um square MIM\nunits retain the approximately 50 pF internal COUT. Four physical high-poly\nsegments implement the approximately 100 kohm bleeder and one implements\napproximately 10 kohm reference resistance. MOS dimensions and multiplicities\nare unchanged; explicit substrate/well taps are added. The 20 uA bias source\nand 0.9 V reference are external. The raw zero-volt loop measurement source\nbecomes an external zero-volt link between distinct output and sense ports;\nit is not a manufactured voltage-source device or an ideal common-mode servo.\u003c/p\u003e\n14:T83d,\u003cp\u003eUse typical LV MOS, MIM and resistor models at 27 C. Qualification uses\nVDD=1.2/1.3 V and REF0=0.9 V. The main deck starts from a solved operating\npoint with 0.1/0.5 mA constant-current loads; each doubles at 2–2.02 us and\nreturns at 10.02–10.04 us. Run to 18 us with 1 ns maximum step, Gear order 2,\n\u003ccode\u003ershunt=1e12\u003c/code\u003e, \u003ccode\u003ereltol=1e-5\u003c/code\u003e, \u003ccode\u003eabstol=1e-14\u003c/code\u003e, \u003ccode\u003evntol=1e-8\u003c/code\u003e.\nThere is no external output capacitor: internal COUT remains in candidate RC.\u003c/p\u003e\n\u003cp\u003eAC injects 1 V in series with the zero-volt output-to-SENSE link. Reference,\nsupply and current sources have zero AC drive. At the high-impedance MOS input\nboundary, \u003ccode\u003eT=-V(vout)/V(sense)\u003c/code\u003e defines return ratio. Sweep 0.01 Hz–1 GHz\nat 150 points/decade. Gain uses \u003ccode\u003e20 log10(abs(T))\u003c/code\u003e; continuous phase has no\nfitted offset. Unity frequency is the first descending 0 dB crossing and phase\nmargin is 180 degrees plus phase there. Missing crossings are errors.\u003c/p\u003e\n\u003cp\u003eStartup separately uses 900/9000 ohm output loads, with supply, reference and\nbias ramped linearly together from zero over 1/10 us. Use \u003ccode\u003euic\u003c/code\u003e, no internal\nnode initial conditions and 2 ns maximum step to 30 us. The load is resistive\nthroughout startup; this is not constant-current startup qualification. All\neight supply/load/ramp combinations must pass. After startup, the main deck's\nconstant-current load contract and its finite recovery windows apply separately.\u003c/p\u003e\n\u003cp\u003eDC sweeps use the same numerical tolerances. Sweep supply downward from 1.3\nto 0.8 V in 1 mV steps at 0.1/1 mA; measure line span only over 1.2–1.3 V.\nThe \u003cstrong\u003eregulation floor\u003c/strong\u003e is the first rising crossing of\n\u003ccode\u003eabs(VOUT−0.9)=0.03 V\u003c/code\u003e on that downward sweep. \u003ccode\u003eheadroom_v\u003c/code\u003e is this supply\nminus 0.9 V. This includes error-amplifier headroom or pass-device limitation;\nit is not a pass-resistance-only dropout rating. The sweep below the floor is\na boundary probe and is not a qualified low-supply operating range. Separately,\nsweep load 0.1–1 mA in 10 uA steps at each qualified supply for load span.\u003c/p\u003e\n6:[\"$\",\"$8\",null,{\"fallback\":[\"$\",\"p\",null,{\"children\":\"Loading published evidence…\"}],\"children\":[\"$\",\"$L10\",null,{\"task\":{\"case_path\":\"tasks/ihp-sg13g2/analog-db/cases/ldo_009_fer_5t_pass/case.toml\",\"coefficient\":8,\"collection\":\"analog-db\",\"configuration_url\":\"/ICLayout-Bench/assets/774402d4f540f236c7e54b4eb60eba62f666693a84801777e06517d2eaeefcee.txt\",\"description_html\":\"$11\",\"description_path\":\"tasks/ihp-sg13g2/analog-db/cases/ldo_009_fer_5t_pass/problem.md\",\"hours\":3,\"id\":\"ihp-sg13g2.analog-db.ldo_009_fer_5t_pass\",\"inputs\":{\"description\":{\"format\":\"text\",\"path\":\"problem.md\",\"sha256\":\"c12dbc0a1d5ecd04385f67eb6fb1d0c6d08da88996514b2ad90a365cfe368609\"},\"netlist\":{\"format\":\"spice\",\"path\":\"materials/circuit.cdl\",\"sha256\":\"1788fa17f1811dd7e6596e6edc5c2edde837c878b590084fd239855c89ba50a4\",\"subcircuit\":\"ldo_009_fer_5t_pass\"},\"performance\":{\"format\":\"spice\",\"path\":\"materials/testbench.spice\",\"sha256\":\"c84213af26654bd33e11f941270548ecc5c2dd4a3e9dde78636967710c66e7a4\"},\"simulation\":{\"format\":\"spice\",\"path\":\"materials/circuit.spice\",\"sha256\":\"d92b6fe6a5f22380be4b7663ffcaaef72f5a0c76e79177a57801c24554157a54\"},\"startup\":{\"format\":\"spice\",\"path\":\"materials/startup.spice\",\"sha256\":\"baa06b4c3f35a5cc0c2254f0dc4d75f247c7f1c707449444d0cb266f053c57f3\"},\"sweeps\":{\"format\":\"spice\",\"path\":\"materials/sweeps.spice\",\"sha256\":\"d6c1c67a33cef7e7db4fc16929a88dc1abe4a445aab46cd7723dc5d6eb72b414\"}
