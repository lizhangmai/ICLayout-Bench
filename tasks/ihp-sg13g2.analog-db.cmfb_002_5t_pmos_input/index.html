\"$L5\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[\"$L6\",[[\"$\",\"script\",\"script-0\",{\"src\":\"/ICLayout-Bench/_next/static/chunks/3_2wwayut9q0b.js\",\"async\":true,\"nonce\":\"$undefined\"}]],[\"$\",\"$L7\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.MetadataOutlet\",\"children\":\"$@9\"}]}]]}],{},null,false,null]},null,false,\"$a\"]},null,false,null],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Lb\",null,{\"children\":\"$Lc\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Ld\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.Metadata\",\"children\":\"$Le\"}]}]}],null]}],false]],\"m\":\"$undefined\",\"G\":[\"$f\",[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/ICLayout-Bench/_next/static/chunks/25phisebeeifo.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]]],\"S\":true,\"h\":null,\"r\":\"$undefined\",\"s\":\"$undefined\",\"a\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"U2oZdoUjWqT_XfcDHuQ5i\"}\n10:I[1186,[\"/ICLayout-Bench/_next/static/chunks/3gll1ekbrh320.js\",\"/ICLayout-Bench/_next/static/chunks/3_2wwayut9q0b.js\"],\"default\"]\na:C\n11:T2923,\u003ch1 id=\"problem-pmos-input-common-mode-detector-and-controller-layout-task\"\u003ePMOS-Input Common-Mode Detector and Controller Layout Task\u003c/h1\u003e\n\u003ch2 id=\"problem-objective\"\u003eObjective\u003c/h2\u003e\n\u003cp\u003eImplement \u003ccode\u003ecmfb_002_5t_pmos_input\u003c/code\u003e with the complete fixed topology and minimize layout-induced degradation under the declared nominal observations. Seven MOS implement a PMOS-input five-transistor OTA plus the PMOS/NMOS diode bias branch. Two 1 Mohm sensing arms each use four series physical high-poly units. The pinned IHP widths/lengths are quantized to the 10 nm drawing grid, including the 0.29 um bias NMOS. Bodies and all sensing/bias devices are retained.\u003c/p\u003e\n\u003ch2 id=\"problem-inputs-and-interface\"\u003eInputs and Interface\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003ematerials/circuit.cdl\u003c/code\u003e is the authoritative physical netlist; \u003ccode\u003ematerials/circuit.spice\u003c/code\u003e is its simulator representation. \u003ccode\u003ematerials/testbench.spice\u003c/code\u003e supply the performance stimuli and measurements. \u003ccode\u003eproblem.md\u003c/code\u003e is this contract. Ordered ports: \u003ccode\u003evinp vinn vcmfb vref vdd vss\u003c/code\u003e. The resistor midpoint senses input common mode. Reference and input sources are external. This is a standalone detector/controller; it contains neither a controlled amplifier nor a complete common-mode feedback loop. Fixture dependent voltage sources only establish specified input voltages and are outside the DUT.\u003c/p\u003e\n\u003ch2 id=\"problem-operating-conditions\"\u003eOperating Conditions\u003c/h2\u003e\n\u003cp\u003e1.5 V supply; 0.5 and 0.7 V input common mode and equal reference. Output has 1 pF to ground and 10 Mohm to the common-mode source. At each bias, separate unit AC common-mode, reference and balanced differential excitations cover 1 Hz–100 MHz. Verify zero differential component in common-mode excitation and zero common-mode component in differential excitation. Centered 2 mV DC sweeps separately vary the common-mode or reference source. Separate 1 mV common-mode/reference or 100 mV differential steps start at 20 us, have 100 ns edges and last 40 us. The 100 us transient starts at DC, maximum step 20 ns. Rail power includes both diode bias devices, but excludes fixture driver losses. No external plant/servo, solver shunt or forced state.\u003c/p\u003e\n\u003cp\u003eAll source/candidate jobs share exactly the same fixtures, parameters, nominal TT models and 27 C temperature. Testbench control blocks and frozen runtime parameters define all stimulus and measurement details. Source simulation is independent of the reference GDS. No paper or data-sheet performance number is an acceptance threshold.\u003c/p\u003e\n\u003ch2 id=\"problem-physical-requirements\"\u003ePhysical Requirements\u003c/h2\u003e\n\u003cp\u003eSubmit a valid GDSII containing top cell \u003ccode\u003ecmfb_002_5t_pmos_input\u003c/code\u003e, at most 10485760 bytes. Pass the pinned native DRC profile, named-interface LVS and functional outline checks. Maximum functional width/height are 5000/1000 um. The complete functional layer set is \u003ccode\u003e[[1, 0], [3, 0], [5, 0], [6, 0], [7, 0], [8, 0], [10, 0], [11, 0], [13, 0], [14, 0], [19, 0], [24, 0], [26, 0], [28, 0], [29, 0], [30, 0], [31, 0], [32, 0], [33, 0], [35, 0], [36, 0], [40, 0], [44, 0], [46, 0], [49, 0], [50, 0], [51, 0], [52, 0], [53, 0], [55, 0], [58, 0], [66, 0], [67, 0], [90, 0], [101, 0], [111, 0], [125, 0], [126, 0], [128, 0], [129, 0], [133, 0], [134, 0], [139, 0], [152, 0]]\u003c/code\u003e (layer/datatype pairs); text/annotation geometry is excluded. There are no case-local DRC waivers. Geometry bounds are generous task/resource limits, not an area score anchor.\u003c/p\u003e\n\u003cp\u003ePost-layout simulation must consume native candidate-GDS-derived distributed wire RC, retaining every physical MOS, resistor and capacitor. Native LVS alone does not substitute for PEX. Magic uses ideal well/substrate tap connections; source simulation retains native finite tap models. This boundary does not establish distributed substrate resistance or substrate-noise accuracy.\u003c/p\u003e\n\u003ch2 id=\"problem-electrical-requirements-and-scoring\"\u003eElectrical Requirements and Scoring\u003c/h2\u003e\n\u003cp\u003ePhysical checks and declared functional bounds remain mandatory. Quality has no\nfixed allowed-degradation threshold. Each \u003ccode\u003esource_*\u003c/code\u003e job simulates the declared\nsource circuit with exactly the same testbench, model resources, parameters,\nload and measurement window as its paired extracted-candidate job. A source\nobservation is the 100-point electrical baseline; it is independent of the\nsubmitted GDS. All individual pairs are retained in the evaluation report.\u003c/p\u003e\n\u003cp\u003eFor a post-layout observation x and its source observation b:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eMaximize: q = x/b; minimize: q = b/x. When a numerical scale s is declared,\nuse (x+s)/(b+s) or its inverse. This handles zero-valued error measurements;\ns is a normalization floor, not an allowed degradation or pass threshold.\u003c/li\u003e\n\u003cli\u003eAmplitude dB: q = 10^((x-b)/20) for maximize, its inverse for minimize.\u003c/li\u003e\n\u003cli\u003eTarget: q = 1/(1+abs(x-b)/s), with a declared physical scale s. Signed and\nzero-valued operating points are never divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eScoring uses \u003ccode\u003elayout\u003c/code\u003e. A metric uses its worst paired quality q. The score is\nS = 100 * product(q_i ** w_i), including area quality\nq_area = area_reference / candidate_functional_area. The weights below sum to\none. Dimensions describe measurements but do not determine their weights.\nPhysical or functional rejection scores zero; missing or invalid measurements\nproduce an unknown score, including measurements with zero weight.\nSource-equivalent performance at the area reference scores 100; improvements\ncan exceed 100. A weight expresses a tradeoff, not a hard acceptance limit.\u003c/p\u003e\n\u003cp\u003eCoefficient 4 covers a compact gain/bias/passive network. Nonnegative common-mode and nonpositive reference DC slopes are functional sign-domain constraints. Both include zero and do not establish a minimum response magnitude. Reported response/ripple windows do not certify a closed-loop CM regulator or upstream optimization claims.\u003c/p\u003e\n\u003cp\u003eEvery required condition must yield finite, valid measurements and pass the functional bounds below. Missing or invalid extraction/measurements are evaluation errors, not low performance scores.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eDefinition\u003c/th\u003e\n\u003cth\u003eDimension / normalization\u003c/th\u003e\n\u003cth\u003eFunctional bounds\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eNatural loaded output with zero CM error\u003c/td\u003e\n\u003ctd\u003ebias / target; scale 1.5\u003c/td\u003e\n\u003ctd\u003elower=0; upper=1.5\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eRail power including dual-diode bias\u003c/td\u003e\n\u003ctd\u003esupply / ratio; scale 1e-12\u003c/td\u003e\n\u003ctd\u003elower=0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003esigned_gain\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e1\u003c/td\u003e\n\u003ctd\u003eReal transfer at 1 Hz, selected CM/reference/differential input\u003c/td\u003e\n\u003ctd\u003eresponse / target; scale 1\u003c/td\u003e\n\u003ctd\u003eFinite measurement\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003egain_1khz\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e1\u003c/td\u003e\n\u003ctd\u003eMagnitude at 1 kHz, selected excitation\u003c/td\u003e\n\u003ctd\u003eresponse / target; scale 1\u003c/td\u003e\n\u003ctd\u003eFinite measurement\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003egain_100khz\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e1\u003c/td\u003e\n\u003ctd\u003eMagnitude at 100 kHz, selected excitation\u003c/td\u003e\n\u003ctd\u003eresponse / target; scale 1\u003c/td\u003e\n\u003ctd\u003eFinite measurement\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estep_response_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eMean response 50–60 us minus 10–20 us\u003c/td\u003e\n\u003ctd\u003eresponse / target; scale 0.01\u003c/td\u003e\n\u003ctd\u003eFinite measurement\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eripple_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eRecovery window output variation\u003c/td\u003e\n\u003ctd\u003eresponse / ratio; scale 0.0001\u003c/td\u003e\n\u003ctd\u003elower=0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edc_cm_slope\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e1\u003c/td\u003e\n\u003ctd\u003eCentered 2 mV DC output slope for dc_cm_slope\u003c/td\u003e\n\u003ctd\u003eresponse / target; scale 1\u003c/td\u003e\n\u003ctd\u003elower=0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edc_ref_slope\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e1\u003c/td\u003e\n\u003ctd\u003eCentered 2 mV DC output slope for dc_ref_slope\u003c/td\u003e\n\u003ctd\u003eresponse / target; scale 1\u003c/td\u003e\n\u003ctd\u003eupper=0\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eTarget normalization preserves the source operating point/transfer using its declared voltage or gain scale. Ratio floors prevent zero-error/noise-floor division; they are numerical normalization units, not acceptance tolerances. Voltage bounds are the declared physical rails; current-validity and KCL bounds distinguish measurements from numerical noise. There is no source-relative performance hard cutoff.\u003c/p\u003e\n\u003cp\u003eThe area anchor is \u003cstrong\u003e10500 um²\u003c/strong\u003e: twice the sum of \u003ccode\u003e(W + 6 um) × (L + 8 um)\u003c/code\u003e over every expanded MOS and physical passive unit (15 units, sum 5245.926900 um²), rounded upward to 100 um². Contact/well/tap/isolation envelopes are included in the 6/8 um allowances; the factor two allows routing. This is an engineering compact-footprint estimate, independent of measured witness area, not a foundry minimum or demonstrated optimum. Task coefficient: \u003cstrong\u003e4\u003c/strong\u003e.\u003c/p\u003e\n\u003ch3 id=\"problem-score-weights\"\u003eScore weights\u003c/h3\u003e\n\u003cp\u003eCommon-mode sensing/controllers: signed transfer 45%; ripple 19.3%; output bias 6.43%; power 19.3%; area 10%. Each objective's weight is divided equally among its metrics.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edc_cm_slope\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.075000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edc_ref_slope\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.075000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003egain_100khz\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.075000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003egain_1khz\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.075000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003esigned_gain\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.075000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estep_response_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.075000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eripple_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.192857142857\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.064285714286\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.192857142857\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch2 id=\"problem-tools-and-submission\"\u003eTools and Submission\u003c/h2\u003e\n\u003cp\u003eSolve budget: \u003cstrong\u003e8 hours\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eUse the runtime task and reviewed PDK resource bundle for the declared native checks, extraction and ngspice measurements. Write \u003ccode\u003eoutput/final.gds\u003c/code\u003e with the required top cell, then explicitly submit its path through the session submission interface; creating a file alone is not submission. Reference GDS, qualification results and development sources are excluded from standard solver inputs.\u003c/p\u003e\n12:T177c,\u003cp\u003ePhysical checks and declared functional bounds remain mandatory. Quality has no\nfixed allowed-degradation threshold. Each \u003ccode\u003esource_*\u003c/code\u003e job simulates the declared\nsource circuit with exactly the same testbench, model resources, parameters,\nload and measurement window as its paired extracted-candidate job. A source\nobservation is the 100-point electrical baseline; it is independent of the\nsubmitted GDS. All individual pairs are retained in the evaluation report.\u003c/p\u003e\n\u003cp\u003eFor a post-layout observation x and its source observation b:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eMaximize: q = x/b; minimize: q = b/x. When a numerical scale s is declared,\nuse (x+s)/(b+s) or its inverse. This handles zero-valued error measurements;\ns is a normalization floor, not an allowed degradation or pass threshold.\u003c/li\u003e\n\u003cli\u003eAmplitude dB: q = 10^((x-b)/20) for maximize, its inverse for minimize.\u003c/li\u003e\n\u003cli\u003eTarget: q = 1/(1+abs(x-b)/s), with a declared physical scale s. Signed and\nzero-valued operating points are never divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eScoring uses \u003ccode\u003elayout\u003c/code\u003e. A metric uses its worst paired quality q. The score is\nS = 100 * product(q_i ** w_i), including area quality\nq_area = area_reference / candidate_functional_area. The weights below sum to\none. Dimensions describe measurements but do not determine their weights.\nPhysical or functional rejection scores zero; missing or invalid measurements\nproduce an unknown score, including measurements with zero weight.\nSource-equivalent performance at the area reference scores 100; improvements\ncan exceed 100. A weight expresses a tradeoff, not a hard acceptance limit.\u003c/p\u003e\n\u003cp\u003eCoefficient 4 covers a compact gain/bias/passive network. Nonnegative common-mode and nonpositive reference DC slopes are functional sign-domain constraints. Both include zero and do not establish a minimum response magnitude. Reported response/ripple windows do not certify a closed-loop CM regulator or upstream optimization claims.\u003c/p\u003e\n\u003cp\u003eEvery required condition must yield finite, valid measurements and pass the functional bounds below. Missing or invalid extraction/measurements are evaluation errors, not low performance scores.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eDefinition\u003c/th\u003e\n\u003cth\u003eDimension / normalization\u003c/th\u003e\n\u003cth\u003eFunctional bounds\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eNatural loaded output with zero CM error\u003c/td\u003e\n\u003ctd\u003ebias / target; scale 1.5\u003c/td\u003e\n\u003ctd\u003elower=0; upper=1.5\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eRail power including dual-diode bias\u003c/td\u003e\n\u003ctd\u003esupply / ratio; scale 1e-12\u003c/td\u003e\n\u003ctd\u003elower=0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003esigned_gain\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e1\u003c/td\u003e\n\u003ctd\u003eReal transfer at 1 Hz, selected CM/reference/differential input\u003c/td\u003e\n\u003ctd\u003eresponse / target; scale 1\u003c/td\u003e\n\u003ctd\u003eFinite measurement\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003egain_1khz\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e1\u003c/td\u003e\n\u003ctd\u003eMagnitude at 1 kHz, selected excitation\u003c/td\u003e\n\u003ctd\u003eresponse / target; scale 1\u003c/td\u003e\n\u003ctd\u003eFinite measurement\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003egain_100khz\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e1\u003c/td\u003e\n\u003ctd\u003eMagnitude at 100 kHz, selected excitation\u003c/td\u003e\n\u003ctd\u003eresponse / target; scale 1\u003c/td\u003e\n\u003ctd\u003eFinite measurement\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estep_response_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eMean response 50–60 us minus 10–20 us\u003c/td\u003e\n\u003ctd\u003eresponse / target; scale 0.01\u003c/td\u003e\n\u003ctd\u003eFinite measurement\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eripple_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eRecovery window output variation\u003c/td\u003e\n\u003ctd\u003eresponse / ratio; scale 0.0001\u003c/td\u003e\n\u003ctd\u003elower=0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edc_cm_slope\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e1\u003c/td\u003e\n\u003ctd\u003eCentered 2 mV DC output slope for dc_cm_slope\u003c/td\u003e\n\u003ctd\u003eresponse / target; scale 1\u003c/td\u003e\n\u003ctd\u003elower=0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edc_ref_slope\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e1\u003c/td\u003e\n\u003ctd\u003eCentered 2 mV DC output slope for dc_ref_slope\u003c/td\u003e\n\u003ctd\u003eresponse / target; scale 1\u003c/td\u003e\n\u003ctd\u003eupper=0\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eTarget normalization preserves the source operating point/transfer using its declared voltage or gain scale. Ratio floors prevent zero-error/noise-floor division; they are numerical normalization units, not acceptance tolerances. Voltage bounds are the declared physical rails; current-validity and KCL bounds distinguish measurements from numerical noise. There is no source-relative performance hard cutoff.\u003c/p\u003e\n\u003cp\u003eThe area anchor is \u003cstrong\u003e10500 um²\u003c/strong\u003e: twice the sum of \u003ccode\u003e(W + 6 um) × (L + 8 um)\u003c/code\u003e over every expanded MOS and physical passive unit (15 units, sum 5245.926900 um²), rounded upward to 100 um². Contact/well/tap/isolation envelopes are included in the 6/8 um allowances; the factor two allows routing. This is an engineering compact-footprint estimate, independent of measured witness area, not a foundry minimum or demonstrated optimum. Task coefficient: \u003cstrong\u003e4\u003c/strong\u003e.\u003c/p\u003e\n\u003ch3\u003eScore weights\u003c/h3\u003e\n\u003cp\u003eCommon-mode sensing/controllers: signed transfer 45%; ripple 19.3%; output bias 6.43%; power 19.3%; area 10%. Each objective's weight is divided equally among its metrics.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edc_cm_slope\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.075000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edc_ref_slope\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.075000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003egain_100khz\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.075000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003egain_1khz\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.075000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003esigned_gain\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.075000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estep_response_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.075000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eripple_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.192857142857\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.064285714286\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.192857142857\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n13:T44b,\u003cp\u003e1.5 V supply; 0.5 and 0.7 V input common mode and equal reference. Output has 1 pF to ground and 10 Mohm to the common-mode source. At each bias, separate unit AC common-mode, reference and balanced differential excitations cover 1 Hz–100 MHz. Verify zero differential component in common-mode excitation and zero common-mode component in differential excitation. Centered 2 mV DC sweeps separately vary the common-mode or reference source. Separate 1 mV common-mode/reference or 100 mV differential steps start at 20 us, have 100 ns edges and last 40 us. The 100 us transient starts at DC, maximum step 20 ns. Rail power includes both diode bias devices, but excludes fixture driver losses. No external plant/servo, solver shunt or forced state.\u003c/p\u003e\n\u003cp\u003eAll source/candidate jobs share exactly the same fixtures, parameters, nominal TT models and 27 C temperature. Testbench control blocks and frozen runtime parameters define all stimulus and measurement details. Source simulation is independent of the reference GDS. No paper or data-sheet performance number is an acceptance threshold.\u003c/p\u003e\n14:T4ee,\u003cp\u003eSubmit a valid GDSII containing top cell \u003ccode\u003ecmfb_002_5t_pmos_input\u003c/code\u003e, at most 10485760 bytes. Pass the pinned native DRC profile, named-interface LVS and functional outline checks. Maximum functional width/height are 5000/1000 um. The complete functional layer set is \u003ccode\u003e[[1, 0], [3, 0], [5, 0], [6, 0], [7, 0], [8, 0], [10, 0], [11, 0], [13, 0], [14, 0], [19, 0], [24, 0], [26, 0], [28, 0], [29, 0], [30, 0], [31, 0], [32, 0], [33, 0], [35, 0], [36, 0], [40, 0], [44, 0], [46, 0], [49, 0], [50, 0], [51, 0], [52, 0], [53, 0], [55, 0], [58, 0], [66, 0], [67, 0], [90, 0], [101, 0], [111, 0], [125, 0], [126, 0], [128, 0], [129, 0], [133, 0], [134, 0], [139, 0], [152, 0]]\u003c/code\u003e (layer/datatype pairs); text/annotation geometry is excluded. There are no case-local DRC waivers. Geometry bounds are generous task/resource limits, not an area score anchor.\u003c/p\u003e\n\u003cp\u003ePost-layout simulation must consume native candidate-GDS-derived distributed wire RC, retaining every physical MOS, resistor and capacitor. Native LVS alone does not substitute for PEX. Magic uses ideal well/substrate tap connections; source simulation retains native finite tap models. This boundary does not establish distributed substrate resistance or substrate-noise accuracy.\u003c/p\u003e\n6:[\"$\",\"$8\",null,{\"fallback\":[\"$\",\"p\",null,{\"children\":\"Loading published evidence…\"}],\"children\":[\"$\",\"$L10\",null,{\"task\":{\"case_path\":\"tasks/ihp-sg13g2/analog-db/cases/cmfb_002_5t_pmos_input/case.toml\",\"coefficient\":4,\"collection\":\"analog-db\",\"configuration_url\":\"/ICLayout-Bench/assets/e7c7ec054ba2113ab41ab9c43a845ac046c5c90136a5c3a3cb533254145e0435.txt\",\"description_html\":\"$11\",\"description_path\":\"tasks/ihp-sg13g2/analog-db/cases/cmfb_002_5t_pmos_input/problem.md\",\"hours\":8,\"id\":\"ihp-sg13g2.analog-db.cmfb_002_5t_pmos_input\",\"inputs\":{\"description\":{\"format\":\"text\",\"path\":\"problem.md\",\"sha256\":\"56e55e830880cc05a31b26b41b60791c064c904dcb7e98c88c1cb169a5b6dbbe\"},\"netlist\":{\"format\":\"spice\",\"path\":\"materials/circuit.cdl\",\"sha256\":\"9d0cf10dd16c7a3e2e929dc7fe72dbfb0dd5f4d53f52574e92414e293c903d45\",\"subcircuit\":\"cmfb_002_5t_pmos_input\"},\"performance\":{\"format\":\"spice\",\"path\":\"materials/testbench.spice\",\"sha256\":\"6c083bab7eed8d17118dbb5dd5cd7418675e74e47f26859d8924c4ef58666595\"},\"simulation\":{\"format\":\"spice\",\"path\":\"materials/circuit.spice\",\"sha256\":\"c2f813d8f9a239ef66cb9342df6818496a08dcf86bce12ff210770ac2ac811ef\"}},\"licenses\":[{\"nam
