,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[\"$L6\",[[\"$\",\"script\",\"script-0\",{\"src\":\"/ICLayout-Bench/_next/static/chunks/3_2wwayut9q0b.js\",\"async\":true,\"nonce\":\"$undefined\"}]],[\"$\",\"$L7\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.MetadataOutlet\",\"children\":\"$@9\"}]}]]}],{},null,false,null]},null,false,\"$a\"]},null,false,null],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Lb\",null,{\"children\":\"$Lc\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Ld\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.Metadata\",\"children\":\"$Le\"}]}]}],null]}],false]],\"m\":\"$undefined\",\"G\":[\"$f\",[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/ICLayout-Bench/_next/static/chunks/25phisebeeifo.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]]],\"S\":true,\"h\":null,\"r\":\"$undefined\",\"s\":\"$undefined\",\"a\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"U2oZdoUjWqT_XfcDHuQ5i\"}\n10:I[1186,[\"/ICLayout-Bench/_next/static/chunks/3gll1ekbrh320.js\",\"/ICLayout-Bench/_next/static/chunks/3_2wwayut9q0b.js\"],\"default\"]\na:C\n11:T21b6,\u003ch1 id=\"problem-strongarm-dynamic-comparator-layout-task\"\u003eStrongARM Dynamic Comparator Layout Task\u003c/h1\u003e\n\u003ch2 id=\"problem-objective\"\u003eObjective\u003c/h2\u003e\n\u003cp\u003eImplement \u003ccode\u003ecmp_002_strongarm\u003c/code\u003e as a GF180MCU D layout. Fifteen upstream MOS instances implement the clocked StrongARM latch: differential input pair, clocked tail, cross-coupled regenerative devices, four precharge devices and two output inverters. The input pair multiplicities expand the physical circuit to seventeen devices. The maintained GF180 3.3 V binding uses the fixed sizing defaults and authored ties from the pinned accession.\u003c/p\u003e\n\u003ch2 id=\"problem-inputs-and-interface\"\u003eInputs and Interface\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003ematerials/circuit.cdl\u003c/code\u003e is the physical authority; \u003ccode\u003ematerials/circuit.spice\u003c/code\u003e\ncontains matching native simulator wrappers. \u003ccode\u003ematerials/testbench.spice\u003c/code\u003e defines\nall measurements. Ordered ports: \u003ccode\u003evdd voutp voutn vinp vinn clk vss\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003evdd/vss\u003c/code\u003e: supply and return; \u003ccode\u003evinp/vinn\u003c/code\u003e: differential inputs; \u003ccode\u003eclk\u003c/code\u003e: evaluate high, precharge low; \u003ccode\u003evoutp/voutn\u003c/code\u003e: buffered differential outputs. Positive input difference produces positive output difference. Supply, clock, input drivers and output loads are external apparatus. No offset-trim variant or proprietary process deck is included.\u003c/p\u003e\n\u003ch2 id=\"problem-operating-conditions\"\u003eOperating Conditions\u003c/h2\u003e\n\u003cp\u003eTypical GF180 3.3 V MOS models at 3.3 V supply and 27 C, statistics disabled. Differential input is +20 or -20 mV at common modes 1.2 and 1.65 V, all four combinations. Each output has a 50 fF load. The 50 MHz clock first rises at 10 ns, uses 100 ps edges and 10 ns pulse width. Simulate to 100 ns at 10 ps requested steps; timing uses the fifth evaluation edge near 90 ns.\u003c/p\u003e\n\u003ch2 id=\"problem-physical-requirements\"\u003ePhysical Requirements\u003c/h2\u003e\n\u003cp\u003eGDS database unit 0.001 um, maximum 10 MiB, top cell \u003ccode\u003ecmp_002_strongarm\u003c/code\u003e.\nNative standalone DRC covers geometry, connectivity, manufacturing grid, dummy\nfill and antenna; chip-level density and seal-ring closure are excluded.\nLVS must match all devices, parameters and named ports. Metal1 labels identify\nports. The functional bounding rectangle includes the device, well, implant,\ncontact, passive and complete routing layers enumerated in the runtime outline;\ntext annotations are excluded. Maximum outline is 5000 by 1000 um.\u003c/p\u003e\n\u003cp\u003eKeep the 3.3 V models, 0.28 um channel length, fixed widths and multiplicities. Parallel equivalent fingers are permitted. All MOS dimensions lie on the native 5 nm construction grid. Body/well connections are explicit, with native guard-ring/tap geometry. The IHP binding has the same topology but different process sizing; it is not mixed into this GF180 task.\u003c/p\u003e\n\u003cp\u003eCandidate-derived native Magic coupling capacitance and distributed wire\nresistance feed post-layout simulation, with zero omission thresholds.\nPhysical MOS diffusion areas/perimeters come from the layout. Substrate/well\nconnections are ideal: distributed substrate resistance/noise and inductance\nare not represented. Four nominal input-polarity/common-mode combinations, reset, decision delay/slew and average supply power. Coefficient 6 reflects regenerative decisions with clocked reset and buffered loads. Offset distribution, metastability statistics, noise, PVT and RF/EM are outside this declared scope.\u003c/p\u003e\n\u003ch2 id=\"problem-electrical-requirements-and-scoring\"\u003eElectrical Requirements and Scoring\u003c/h2\u003e\n\u003cp\u003ePhysical checks and declared functional bounds remain mandatory. Quality has no\nfixed allowed-degradation threshold. Each \u003ccode\u003esource_*\u003c/code\u003e job simulates the declared\nsource circuit with exactly the same testbench, model resources, parameters,\nload and measurement window as its paired extracted-candidate job. A source\nobservation is the 100-point electrical baseline; it is independent of the\nsubmitted GDS. All individual pairs are retained in the evaluation report.\u003c/p\u003e\n\u003cp\u003eFor a post-layout observation x and its source observation b:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eMaximize: q = x/b; minimize: q = b/x. When a numerical scale s is declared,\nuse (x+s)/(b+s) or its inverse. This handles zero-valued error measurements;\ns is a normalization floor, not an allowed degradation or pass threshold.\u003c/li\u003e\n\u003cli\u003eAmplitude dB: q = 10^((x-b)/20) for maximize, its inverse for minimize.\u003c/li\u003e\n\u003cli\u003eTarget: q = 1/(1+abs(x-b)/s), with a declared physical scale s. Signed and\nzero-valued operating points are never divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eScoring uses \u003ccode\u003elayout\u003c/code\u003e. A metric uses its worst paired quality q. The score is\nS = 100 * product(q_i ** w_i), including area quality\nq_area = area_reference / candidate_functional_area. The weights below sum to\none. Dimensions describe measurements but do not determine their weights.\nPhysical or functional rejection scores zero; missing or invalid measurements\nproduce an unknown score, including measurements with zero weight.\nSource-equivalent performance at the area reference scores 100; improvements\ncan exceed 100. A weight expresses a tradeoff, not a hard acceptance limit.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eDefinition\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eDimension\u003c/th\u003e\n\u003cth\u003eNormalization\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edelay_s\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eClock 1.65 V crossing to signed output difference 1.65 V, fifth rising edge\u003c/td\u003e\n\u003ctd\u003es\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003ctd\u003eratio\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eslew_s\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eSigned differential output rise from 0.33 to 2.97 V, fifth decision\u003c/td\u003e\n\u003ctd\u003es\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003ctd\u003eratio\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMean supply power over 20–100 ns\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003esupply\u003c/td\u003e\n\u003ctd\u003eratio\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edecision_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eInput-polarity-adjusted output difference at 99 ns\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003ctd\u003etarget\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ereset_p_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003ePositive output at 89 ns in precharge\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003efunctional\u003c/td\u003e\n\u003ctd\u003eunscored\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ereset_n_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eNegative output at 89 ns in precharge\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003efunctional\u003c/td\u003e\n\u003ctd\u003eunscored\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eSigned decision must be 1.65–3.3 V; both reset outputs must be 0–1.65 V. Half-supply separates the required resolved/reset logic states, independent of any upstream speed target. Delay, slew and mean supply power must be nonnegative. Timing has no hard upper bound beyond the declared observation window; a missing crossing is an invalid measurement.\nEvery condition must complete; missing, nonfinite or wrong-unit observations\nproduce an evaluation error. Upstream advertised performance is not a\nqualification requirement.\u003c/p\u003e\n\u003cp\u003eScored observations pair with independent source jobs using the identical\nstimuli, parameters, models and backend. Target scales are 3.3 V; ratio floors\nuse 1 pW for power. These are normalization units, not allowed degradation.\nDelay/slew ratios have no floor.\u003c/p\u003e\n\u003cp\u003eArea anchor \u003cstrong\u003e490.86 um2\u003c/strong\u003e uses a 234.840000 um2 sum of expanded\n\u003ccode\u003e(W+2)*(L+2)\u003c/code\u003e device/contact envelopes, a 50% routing allowance and 2 um outer\nmargin: \u003ccode\u003eceil(100*(1.5*sum+8*sqrt(sum)+16))/100\u003c/code\u003e. It is independent of witness\narea and is an engineering estimate, not a foundry minimum. Coefficient \u003cstrong\u003e6\u003c/strong\u003e\nis independent of this score.\u003c/p\u003e\n\u003ch3 id=\"problem-score-weights\"\u003eScore weights\u003c/h3\u003e\n\u003cp\u003eClocked comparators: decision delay 61.4%; output transition 8.18%; decision amplitude 4.09%; supply power 16.4%; area 10%. Each objective's weight is divided equally among its metrics.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edelay_s\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.613636363637\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eslew_s\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.081818181818\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edecision_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.040909090909\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.163636363636\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch2 id=\"problem-tools-and-submission\"\u003eTools and Submission\u003c/h2\u003e\n\u003cp\u003eSolve budget: \u003cstrong\u003e3 hours\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eRead \u003ccode\u003e/protocol/task.json\u003c/code\u003e, \u003ccode\u003e/protocol/resources.json\u003c/code\u003e and\n\u003ccode\u003e/protocol/harness.json\u003c/code\u003e. KLayout performs physical checks, Magic extracts the\ncandidate, and ngspice measures it. Use \u003ccode\u003eprocess-feedback\u003c/code\u003e if exposed.\nWrite \u003ccode\u003e/workspace/output/final.gds\u003c/code\u003e, then explicitly submit using\n\u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e.\u003c/p\u003e\n12:T1215,\u003cp\u003ePhysical checks and declared functional bounds remain mandatory. Quality has no\nfixed allowed-degradation threshold. Each \u003ccode\u003esource_*\u003c/code\u003e job simulates the declared\nsource circuit with exactly the same testbench, model resources, parameters,\nload and measurement window as its paired extracted-candidate job. A source\nobservation is the 100-point electrical baseline; it is independent of the\nsubmitted GDS. All individual pairs are retained in the evaluation report.\u003c/p\u003e\n\u003cp\u003eFor a post-layout observation x and its source observation b:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eMaximize: q = x/b; minimize: q = b/x. When a numerical scale s is declared,\nuse (x+s)/(b+s) or its inverse. This handles zero-valued error measurements;\ns is a normalization floor, not an allowed degradation or pass threshold.\u003c/li\u003e\n\u003cli\u003eAmplitude dB: q = 10^((x-b)/20) for maximize, its inverse for minimize.\u003c/li\u003e\n\u003cli\u003eTarget: q = 1/(1+abs(x-b)/s), with a declared physical scale s. Signed and\nzero-valued operating points are never divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eScoring uses \u003ccode\u003elayout\u003c/code\u003e. A metric uses its worst paired quality q. The score is\nS = 100 * product(q_i ** w_i), including area quality\nq_area = area_reference / candidate_functional_area. The weights below sum to\none. Dimensions describe measurements but do not determine their weights.\nPhysical or functional rejection scores zero; missing or invalid measurements\nproduce an unknown score, including measurements with zero weight.\nSource-equivalent performance at the area reference scores 100; improvements\ncan exceed 100. A weight expresses a tradeoff, not a hard acceptance limit.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eDefinition\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eDimension\u003c/th\u003e\n\u003cth\u003eNormalization\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edelay_s\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eClock 1.65 V crossing to signed output difference 1.65 V, fifth rising edge\u003c/td\u003e\n\u003ctd\u003es\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003ctd\u003eratio\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eslew_s\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eSigned differential output rise from 0.33 to 2.97 V, fifth decision\u003c/td\u003e\n\u003ctd\u003es\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003ctd\u003eratio\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMean supply power over 20–100 ns\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003esupply\u003c/td\u003e\n\u003ctd\u003eratio\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edecision_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eInput-polarity-adjusted output difference at 99 ns\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003ctd\u003etarget\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ereset_p_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003ePositive output at 89 ns in precharge\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003efunctional\u003c/td\u003e\n\u003ctd\u003eunscored\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ereset_n_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eNegative output at 89 ns in precharge\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003efunctional\u003c/td\u003e\n\u003ctd\u003eunscored\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eSigned decision must be 1.65–3.3 V; both reset outputs must be 0–1.65 V. Half-supply separates the required resolved/reset logic states, independent of any upstream speed target. Delay, slew and mean supply power must be nonnegative. Timing has no hard upper bound beyond the declared observation window; a missing crossing is an invalid measurement.\nEvery condition must complete; missing, nonfinite or wrong-unit observations\nproduce an evaluation error. Upstream advertised performance is not a\nqualification requirement.\u003c/p\u003e\n\u003cp\u003eScored observations pair with independent source jobs using the identical\nstimuli, parameters, models and backend. Target scales are 3.3 V; ratio floors\nuse 1 pW for power. These are normalization units, not allowed degradation.\nDelay/slew ratios have no floor.\u003c/p\u003e\n\u003cp\u003eArea anchor \u003cstrong\u003e490.86 um2\u003c/strong\u003e uses a 234.840000 um2 sum of expanded\n\u003ccode\u003e(W+2)*(L+2)\u003c/code\u003e device/contact envelopes, a 50% routing allowance and 2 um outer\nmargin: \u003ccode\u003eceil(100*(1.5*sum+8*sqrt(sum)+16))/100\u003c/code\u003e. It is independent of witness\narea and is an engineering estimate, not a foundry minimum. Coefficient \u003cstrong\u003e6\u003c/strong\u003e\nis independent of this score.\u003c/p\u003e\n\u003ch3\u003eScore weights\u003c/h3\u003e\n\u003cp\u003eClocked comparators: decision delay 61.4%; output transition 8.18%; decision amplitude 4.09%; supply power 16.4%; area 10%. Each objective's weight is divided equally among its metrics.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edelay_s\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.613636363637\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eslew_s\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.081818181818\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edecision_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.040909090909\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.163636363636\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n13:T600,\u003cp\u003eGDS database unit 0.001 um, maximum 10 MiB, top cell \u003ccode\u003ecmp_002_strongarm\u003c/code\u003e.\nNative standalone DRC covers geometry, connectivity, manufacturing grid, dummy\nfill and antenna; chip-level density and seal-ring closure are excluded.\nLVS must match all devices, parameters and named ports. Metal1 labels identify\nports. The functional bounding rectangle includes the device, well, implant,\ncontact, passive and complete routing layers enumerated in the runtime outline;\ntext annotations are excluded. Maximum outline is 5000 by 1000 um.\u003c/p\u003e\n\u003cp\u003eKeep the 3.3 V models, 0.28 um channel length, fixed widths and multiplicities. Parallel equivalent fingers are permitted. All MOS dimensions lie on the native 5 nm construction grid. Body/well connections are explicit, with native guard-ring/tap geometry. The IHP binding has the same topology but different process sizing; it is not mixed into this GF180 task.\u003c/p\u003e\n\u003cp\u003eCandidate-derived native Magic coupling capacitance and distributed wire\nresistance feed post-layout simulation, with zero omission thresholds.\nPhysical MOS diffusion areas/perimeters come from the layout. Substrate/well\nconnections are ideal: distributed substrate resistance/noise and inductance\nare not represented. Four nominal input-polarity/common-mode combinations, reset, decision delay/slew and average supply power. Coefficient 6 reflects regenerative decisions with clocked reset and buffered loads. Offset distribution, metastability statistics, noise, PVT and RF/EM are outside this declared scope.\u003c/p\u003e\n6:[\"$\",\"$8\",null,{\"fallback\":[\"$\",\"p\",null,{\"children\":\"Loading published evidence…\"}],\"children\":[\"$\",\"$L10\",null,{\"task\":{\"case_path\":\"tasks/gf180mcuD/analog-db/cases/cmp_002_strongarm/case.toml\",\"coefficient\":6,\"collection\":\"analog-db\",\"configuration_url\":\"/ICLayout-Bench/assets/2a2e079b46db026858622975af955aefaf7f3e134282079fc257261a30befb62.txt\",\"description_html\":\"$11\",\"description_path\":\"tasks/gf180mcuD/analog-db/cases/cmp_002_strongarm/problem.md\",\"hours\":3,\"id\":\"gf180mcuD.analog-db.cmp_002_strongarm\",\"inputs\":{\"description\":{\"format\":\"text\",\"path\":\"problem.md\",\"sha256\":\"e4c8454024559ffda301e247bbb161307754235742e6b3d6e85f2cbd2f4659c9\"},\"netlist\":{\"format\":\"spice\",\"path\":\"materials/circuit.cdl\",\"sha256\":\"5b80e3a40ab19415481d51b8e6b4e4bcf45c4517ccc5071aa1b342038c94e14c\",\"subcircuit\":\"cmp_002_strongarm\"},\"performance\":{\"format\":\"spice\",\"path\":\"materia source_condition_2:slew_s\",\"source_condition_3:slew_s\"],\"category\":\"performance\",\"dimension\":\"response\",\"direction\":\"minimize\",\"id\":\"slew_s\",\"lower\":0,\"normalization\":\"ratio\",\"observations\":[\"condition_0:slew_s\",\"condition_1:slew_s\",\"condition_2:slew_s\",\"condition_3:slew_s\"],\"unit\":\"s\"},{\"aggregation\":\"max\",\"baseline\":[\"source_condition_0:power_w\",\"source_condition_1:power_w\",\"source_condition_2:power_w\",\"source_condition_3:power_w\"],\"category\":\"performance\",\"dimension\":\"supply\",\"direction\":\"minimize\",\"id\":\"power_w\",\"lower\":0,\"normalization\":\"ratio\",\"observations\":[\"condition_0:power_w\",\"condition_1:power_w\",\"condition_2:power_w\",\"condition_3:power_w\"],\"scale\":1e-12,\"unit\":\"W\"},{\"aggregation\":\"max\",\"baseline\":[\"source_condition_0:decision_v\",\"source_condition_1:decision_v\",\"source_condition_2:decision_v\",\"source_condition_3:decision_v\"],\"category\":\"performance\",\"dimension\":\"bias\",\"direction\":\"target\",\"id\":\"decision_v\",\"lower\":1.65,\"normalization\":\"target\",\"observations\":[\"condition_0:decision_v\",\"condition_1:decision_v\",\"condition_2:decision_v\",\"condition_3:decision_v\"],\"scale\":3.3,\"unit\":\"V\",\"upper\":3.3},{\"aggregation\":\"min\",\"category\":\"performance\",\"direction\":\"maximize\",\"id\":\"reset_p_v\",\"lower\":0,\"observations\":[\"condition_0:reset_p_v\",\"condition_1:reset_p_v\",\"condition_2:reset_p_v\",\"condition_3:reset_p_v\"],\"unit\":\"V\",\"upper\":1.65},{\"aggregation\":\"min\",\"category\":\"performance\",\"direction\":\"maximize\",\"id\":\"reset_n_v\",\"lower\":0,\"observations\":[\"condition_0:reset_n_v\",\"condition_1:reset_n_v\",\"condition_2:reset_n_v\",\"condition_3:reset_n_v\"],\"unit\":\"V\",\"upper\":1.65}],\"pdk\":\"gf180mcuD\",\"reader\":{\"category\":\"Mixed-signal\",\"summary\":\"Makes clocked differential decisions with a StrongARM regenerative latch.\",\"title\":\"StrongARM Dynamic Comparator\"},\"schematic_url\":\"/ICLayout-Bench/assets/b3bf262cffb4d9a97c8fd2fbe456c42914c80486ea067028f1ec36ccff2e80f8.svg\",\"scoring\":{\"area_metric\":\"functional_area\",\"area_target\":490.86,\"method\":\"layout\",\"rationale\":\"Clocked comparators: decision delay 61.4%; output transition 8.18%; decision amplitude 4.09%; supply power 16.4%; area 10%. Each objective's weight is divided equally among its metrics.\",\"weights\":{\"decision_v\":0.040909090909,\"delay_s\":0.613636363637,\"functional_area\":0.1,\"power_w\":0.163636363636,\"slew_s\":0.081818181818}},\"sections\":{\"Electrical Requirements and Scoring\":\"$12\",\"Objective\":\"\u003cp\u003eImplement \u003ccode\u003ecmp_002_strongarm\u003c/code\u003e as a GF180MCU D layout. Fifteen upstream MOS instances implement the clocked StrongARM latch: differential input pair, clocked tail, cross-coupled regenerative devices, four precharge devices and two output inverters. The input pair multiplicities expand the physical circuit to seventeen devices. The maintained GF180 3.3 V binding uses the fixed sizing defaults and authored ties from the pinned accession.\u003c/p\u003e\\n\",\"Operating Conditions\":\"\u003cp\u003eTypical GF180 3.3 V MOS models at 3.3 V supply and 27 C, statistics disabled. Differential input is +20 or -20 mV at common modes 1.2 and 1.65 V, all four combinations. Each output has a 50 fF load. The 50 MHz clock first rises at 10 ns, uses 100 ps edges and 10 ns pulse width. Simulate to 100 ns at 10 ps requested steps; timing uses the fifth evaluation edge near 90 ns.\u003c/p\u003e\\n\",\"Physical Requirements\":\"$13\"},\"source_url\":\"https://github.com/MacAnalog/spicexplorer-release/tree/263d0322f8900dc331536fbbe6c0e804514fc454/analog-db/circuits/cmp_002_strongarm\",\"status\":\"qualified\",\"title\":\"StrongARM Dynamic Comparator\"},\"catalog\":{\"boards\":[],\"contexts\":[],\"experiments\":[],\"runs\":[],\"tasks\":[]},\"evidenceError\":false}]}]\nc:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],
