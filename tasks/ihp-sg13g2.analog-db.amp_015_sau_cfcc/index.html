efined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L5\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[\"$L6\",[[\"$\",\"script\",\"script-0\",{\"src\":\"/ICLayout-Bench/_next/static/chunks/27jip_2vcvnd5.js\",\"async\":true,\"nonce\":\"$undefined\"}]],[\"$\",\"$L7\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.MetadataOutlet\",\"children\":\"$@9\"}]}]]}],{},null,false,null]},null,false,\"$a\"]},null,false,null],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Lb\",null,{\"children\":\"$Lc\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Ld\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.Metadata\",\"children\":\"$Le\"}]}]}],null]}],false]],\"m\":\"$undefined\",\"G\":[\"$f\",[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/ICLayout-Bench/_next/static/chunks/3sa54_ghi1h2h.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]]],\"S\":true,\"h\":null,\"r\":\"$undefined\",\"s\":\"$undefined\",\"a\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"2hqB741EA4j7xWQVg6hu-\"}\n10:I[1186,[\"/ICLayout-Bench/_next/static/chunks/2h60meymns2z5.js\",\"/ICLayout-Bench/_next/static/chunks/27jip_2vcvnd5.js\"],\"default\"]\na:C\n11:T5623,\u003ch1 id=\"problem-input-driven-active-feedforward-ota-layout-task\"\u003eInput-Driven Active-Feedforward OTA Layout Task\u003c/h1\u003e\n\u003ch2 id=\"problem-objective\"\u003eObjective\u003c/h2\u003e\n\u003cp\u003eLay out \u003ccode\u003eamp_015_sau_cfcc\u003c/code\u003e with its complete transistor signal and bias paths.\nThe PMOS-input folded stage produces \u003ccode\u003evoutn\u003c/code\u003e, controlling the mirror at\n\u003ccode\u003enet050\u003c/code\u003e and the auxiliary PMOS at \u003ccode\u003enet049\u003c/code\u003e. The \u003ccode\u003enet050 → net043 → net049\u003c/code\u003e\npath and direct input-driven PMOS feedforward jointly drive the output\nPMOS/NMOS at \u003ccode\u003enet050/net049\u003c/code\u003e. Preserve the original \u003ccode\u003enet063–vout\u003c/code\u003e compensation\nand both explicitly added physical capacitor arrays.\u003c/p\u003e\n\u003ch3 id=\"problem-optimization-objective\"\u003eOptimization objective\u003c/h3\u003e\n\u003cp\u003eMaximize the declared quality score within the solve budget while satisfying all physical and necessary functional requirements. The first passing DRC, LVS and required electrical checks establish a feasible baseline. Continue improving the scored metrics from that baseline; a passing check or \u003ccode\u003etask_success = true\u003c/code\u003e does not mean that the quality objectives have been achieved.\u003c/p\u003e\n\u003ch2 id=\"problem-inputs-and-interface\"\u003eInputs and Interface\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003ematerials/circuit.cdl\u003c/code\u003e: authoritative native physical connectivity.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ematerials/circuit.spice\u003c/code\u003e: equivalent simulation connectivity with logical body nets.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ematerials/testbench.spice\u003c/code\u003e: DC, bilateral-loop and sustained-step measurements.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eOrdered ports: \u003ccode\u003evss vdd vinn vinp vout net013\u003c/code\u003e. VSS/VDD are return/supply;\nVINN/VINP are inverting/noninverting inputs; VOUT is output; \u003ccode\u003enet013\u003c/code\u003e\nconnects to the external bias sink. Input PMOS bodies use the separate\n\u003ccode\u003enet31\u003c/code\u003e source-tied well; other PMOS use VDD and NMOS use the VSS substrate.\nPreserve all 24 MOS groups,\nW/L/m, every body connection and all physical passive devices.\u003c/p\u003e\n\u003cp\u003eMOS dimensions retain the declared grid adaptation. All internal capacitors use \u003ccode\u003ecap_cmim\u003c/code\u003e:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003ec0\u003c/code\u003e: \u003ccode\u003enet063\u003c/code\u003e (top) to \u003ccode\u003evout\u003c/code\u003e (bottom), 1 parallel 51.3 × 51.3 um MIM units.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eclocal\u003c/code\u003e: \u003ccode\u003enet050\u003c/code\u003e (top) to \u003ccode\u003evout\u003c/code\u003e (bottom), 4 parallel 51.64 × 51.64 um MIM units.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ecout\u003c/code\u003e: \u003ccode\u003evout\u003c/code\u003e (top) to \u003ccode\u003evss\u003c/code\u003e (bottom), 12 parallel 51.64 × 51.64 um MIM units.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eThe raw 10.0474 uA sink is calibrated to 1.255925 uA. The original\n3.94789 pF \u003ccode\u003enet063–vout\u003c/code\u003e compensation remains. Approximately 16 pF is added\nat \u003ccode\u003enet050–vout\u003c/code\u003e and another 48 pF at \u003ccode\u003evout–vss\u003c/code\u003e. These are physical\ncompensation/output-storage devices, included in the netlist, area and\nextracted simulation. This maintained circuit is explicitly not capless.\nNo ideal servo, diagnostic clamp or hidden damping element is part of this DUT.\u003c/p\u003e\n\u003ch2 id=\"problem-operating-conditions\"\u003eOperating Conditions\u003c/h2\u003e\n\u003cp\u003eUse typical IHP LV MOS/MIM/poly models at 27 C and VDD=1.2 V, with a\n1.25592 uA sink from \u003ccode\u003enet013\u003c/code\u003e to VSS. All combinations of external\n5/10/15 pF load and 0.5/0.7 V DC input must pass. These external loads are\nadditional to every internal capacitor above.\u003c/p\u003e\n\u003cp\u003eA zero-volt source connects VINN (\u003ccode\u003evm\u003c/code\u003e) to VOUT, while VINP is AC ground. Insert series voltage injection and parallel current injection at this boundary, retaining the complete DUT and load. Voltage injection uses \u003ccode\u003eb=-I(VPROBE)\u003c/code\u003e, \u003ccode\u003ed=V(vm)\u003c/code\u003e; current injection uses \u003ccode\u003ea=-I(VPROBE)\u003c/code\u003e, \u003ccode\u003ec=V(vm)\u003c/code\u003e; \u003ccode\u003edelta=a*d-b*c\u003c/code\u003e, \u003ccode\u003eT=(2*delta-a+d)/(1-2*delta+a-d)\u003c/code\u003e (Tian expression 30). Export both raw injections to independently reconstruct the Y matrix. Sweep 300 points per decade from 0.01 Hz to 10 GHz; continuous phase follows the natural low-frequency branch without offset correction. Check first and last descending unity-gain crossings, full-sweep minimum sampled \u003ccode\u003eabs(1+T)\u003c/code\u003e, maximum absolute continuous phase over \u003ccode\u003e1+T\u003c/code\u003e, and gain over 2–10 GHz; a good first crossing alone is insufficient.\u003c/p\u003e\n\u003cp\u003eVINP is a 0.5→0.7→0.5 V pulse with 20 ns edges, rising at 2 us and falling at 20.02 us with period 100 us. Transient starts at its own initial-pulse operating point, independently of the AC DC-input setting. Simulate 0–40 us with Gear2, maximum step 2 ns, KLU, \u003ccode\u003eitl4=1000\u003c/code\u003e, \u003ccode\u003ershunt=1e12\u003c/code\u003e, \u003ccode\u003ereltol=1e-5\u003c/code\u003e, \u003ccode\u003eabstol=1e-12\u003c/code\u003e, \u003ccode\u003evntol=1e-8\u003c/code\u003e; numerical shunts are not physical devices. Verification also covers half steps, tighter tolerances/denser AC, trapezoidal integration, long tails and finite excitation/load boundaries. These finite outer-loop and recovery observations do not prove internal poles, stability under arbitrary loads, PVT, noise, mismatch, distortion, rail-to-rail operation or power-up startup performance.\u003c/p\u003e\n\u003cp\u003eThe phase margins at the first and last crossings must both lie within [0, 180] degrees. Minimum return distance and return-phase excursion need only be nonnegative; high-frequency gain has no acceptance threshold. These full-sweep metrics affect continuous quality without adding stability acceptance conditions. Missing crossings or invalid observations are evaluation errors.\u003c/p\u003e\n\u003ch2 id=\"problem-physical-requirements\"\u003ePhysical Requirements\u003c/h2\u003e\n\u003cp\u003eSubmit GDSII top cell \u003ccode\u003eamp_015_sau_cfcc\u003c/code\u003e, at most 32 MiB. Native IHP main/maximal DRC\nmust pass without waivers (standalone scope, density/antenna off), together\nwith strict named-interface LVS and a 3600 × 150 um functional envelope.\nAll device/contact/interconnect drawing layers in the runtime \u003ccode\u003eoutline\u003c/code\u003e\nconstraint contribute to area; annotation/pin-purpose layers do not.\nPost-layout simulation uses the submitted GDS's complete Magic RC, with\nphysical MIM devices and interconnect resistances/capacitances. Half-grid\nimport is explicit. Magic retains only Metal3 interface labels in its isolated\nextraction copy to avoid repeated internal well-name aliases, while native LVS\nchecks the original GDS and its actual body-contact connectivity. No resistance/capacitance threshold omits small parasitics.\nSource simulation and extraction use the same logical body-net boundary. Distributed substrate resistance/noise and fabrication\nsignoff remain unqualified. The long independent witness is a feasibility\nlayout, not an area optimum.\u003c/p\u003e\n\u003ch2 id=\"problem-electrical-requirements-and-scoring\"\u003eElectrical Requirements and Scoring\u003c/h2\u003e\n\u003cp\u003eArtifact, geometry, DRC, LVS and declared functional requirements must pass. Parasitic extraction is also mandatory: it must produce a complete, electrically consistent netlist usable by the required post-layout simulations. A completed candidate rejection scores zero; infrastructure errors do not establish candidate failure.\u003c/p\u003e\n\u003cp\u003ePhysical checks and the declared functional bounds must pass. Quality scoring imposes no fixed degradation allowance. Each \u003ccode\u003esource_*\u003c/code\u003e job and its corresponding candidate extracted circuit use exactly the same testbench, model resources, parameters, loads and measurement windows. Independent source observations define the 100-point electrical baseline without depending on the submitted GDS; reports retain every paired result.\u003c/p\u003e\n\u003cp\u003eLet x be the post-layout measurement and b the source-circuit measurement under the same conditions:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eRatio normalization: maximize with q = x/b and minimize with q = b/x. When a numerical scale s is declared, use (x+s)/(b+s) and its reciprocal, respectively. The scale handles zero values as a normalization floor; it is neither an allowed degradation nor an acceptance bound.\u003c/li\u003e\n\u003cli\u003eAmplitude in dB: maximize with q = 10^((x-b)/20) and minimize with its reciprocal.\u003c/li\u003e\n\u003cli\u003eTarget normalization: q = 1/(1+abs(x-b)/s), where s is the declared physical scale. Signed or zero-valued operating points are not divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eUse \u003ccode\u003elayout\u003c/code\u003e scoring. Each metric takes its worst paired quality q, and the total score is S = 100 * product(min(1, q_i) ** w_i), with area quality q_area = area_reference / candidate_functional_area. The weights below sum to 1; metric dimensions describe measurements and do not determine weights. Physical, extraction, or functional rejection scores zero; other missing or invalid measurements leave the score unknown, and zero-weight observations must also be valid. Matching source-circuit performance at the reference area scores 100 points; each metric is capped at quality 1, so scores cannot exceed 100. Weights express quality tradeoffs rather than hard bounds.\u003c/p\u003e\n\u003cp\u003eThe measurements below use the supplied SPICE node and source names. \u003ccode\u003ev(n)\u003c/code\u003e is a node voltage; \u003ccode\u003ei(V)\u003c/code\u003e is current flowing into a voltage source, so delivered power uses a negative sign. \u003ccode\u003edb(z)=20*log10(abs(z))\u003c/code\u003e; \u003ccode\u003emag/abs\u003c/code\u003e denote magnitude, and \u003ccode\u003ecph\u003c/code\u003e denotes continuous phase in radians. \u003ccode\u003efind\u003c/code\u003e, \u003ccode\u003ewhen\u003c/code\u003e, \u003ccode\u003efrom/to\u003c/code\u003e and \u003ccode\u003erise/fall\u003c/code\u003e follow the deck's interpolation, window and crossing conventions. SPICE suffixes p/n/u/m/meg/g mean pico/nano/micro/milli/mega/giga. Nested \u003ccode\u003eavg\u003c/code\u003e, \u003ccode\u003emin\u003c/code\u003e, \u003ccode\u003emax\u003c/code\u003e, \u003ccode\u003evecmin/vecmax\u003c/code\u003e and \u003ccode\u003ederiv\u003c/code\u003e represent window averages, extrema and sampled derivatives. Measure each operating condition independently, pair it with the source result under that condition, and take the worst paired quality within each metric group.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003eoutput_error_v\u003c/code\u003e, \u003ccode\u003erecovery_up_v\u003c/code\u003e, \u003ccode\u003erecovery_down_v\u003c/code\u003e use \u003ccode\u003esaturating_ratio\u003c/code\u003e: q = 2(b+s)/(b+x+2s), where x is candidate error, b is paired source error and s is the positive scale below. Source-equivalent error gives q=1; improvement approaches the upper limit 2 with diminishing returns. s retains the declared units and numeric-floor meaning. Normalize each condition before taking the worst quality; other normalization and functional rules follow their own declarations.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eDefinition / observation\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eQuality normalization\u003c/th\u003e\n\u003cth\u003eFunctional range\u003c/th\u003e\n\u003cth\u003eScale\u003c/th\u003e\n\u003cth\u003eDimension\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003ev(vout)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.2\u003c/td\u003e\n\u003ctd\u003e1.2\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003eabs(v(vout)-v(vp))\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebias_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003ev(net013)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.2\u003c/td\u003e\n\u003ctd\u003e1.2\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003e-v(vdd)*i(VDD)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003ctd\u003esupply\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edc_gain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: Value of \u003ccode\u003e(db((T))) at=0.01\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003emaximize / db20\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003 003c/td\u003e\n\u003ctd\u003e1.0\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ereturn_phase_excursion_deg\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: \u003ccode\u003evecmax(abs(180*cph(1+(T))/pi))\u003c/code\u003e; sweep \u003ccode\u003edec 300 0.01 10g\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003edeg\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ehf_gain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAC: Maximum of \u003ccode\u003e(db((T))) from=2g to=10g\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003edB\u003c/td\u003e\n\u003ctd\u003eminimize / db20\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003erecovery_up_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Maximum of \u003ccode\u003e(abs(v(vout)-v(vp))) from=15u to=19u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003erecovery_down_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Maximum of \u003ccode\u003e(abs(v(vout)-v(vp))) from=30u to=39u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estep_gain\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTransient: \u003ccode\u003e((avg v(vout) from=18u to=19u)-(avg v(vout) from=38u to=39u))/0.2\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV/V\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e1.0\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emean_power_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Mean of \u003ccode\u003e(-v(vdd)*i(VDD)) from=2u to=40u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003ctd\u003esupply\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epeak_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Maximum of \u003ccode\u003ev(vout) from=2u to=20u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.2\u003c/td\u003e\n\u003ctd\u003e1.2\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003etrough_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTRAN: Minimum of \u003ccode\u003ev(vout) from=20.04u to=40u\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.2\u003c/td\u003e\n\u003ctd\u003e1.2\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eArea reference: \u003cstrong\u003e84393.45 um2\u003c/strong\u003e. The reference engineering estimate used 364 device instances, a sum of device/contact envelopes 55883.1016 um2, a one-sided envelope margin of 0.6 um, a routing allowance of 50%, and a total outer width/height allowance 1.2 um. Estimate = ceil(100 * (1.5 * envelope_sum + 2 * margin * sqrt(envelope_sum) + margin^2)) / 100. Here margin is the total allowance across both sides, and the envelope sum is displayed to four decimal places. Reference MOS/passive envelopes use W/L (or resistor dimensions) and multiplicity, including explicit contacts and HBT emitter/contact envelopes. This is a frozen engineering estimate, not a process minimum or a proven achievable area.\u003c/p\u003e\n\u003cp\u003eThe capability coefficient is \u003cstrong\u003e8\u003c/strong\u003e, independent of this task's reference-normalized score.\u003c/p\u003e\n\u003ch3 id=\"problem-score-weights\"\u003eScore weights\u003c/h3\u003e\n\u003cp\u003eMultiple-crossing feedback amplifier: loaded recovery 28.6%, loop stability 24.5%, gain and bandwidth 12.3%, step transfer and extrema 8.18%, bias 4.09%, power 12.3%, area 10%; each objective weight is divided equally among its metrics.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.095454545449\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003erecovery_down_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.095454545455\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003erecovery_up_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.095454545455\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efinal_phase_margin_deg\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.061363636364\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eminimum_return_distance\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.061363636364\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ephase_margin_deg\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.061363636364\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ereturn_phase_excursion_deg\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.061363636364\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edc_gain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.030681818182\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efinal_unity_hz\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.030681818182\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ehf_gain_db\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.030681818182\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eunity_hz\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.030681818182\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epeak_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.027272727273\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estep_gain\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.027272727273\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003etrough_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.027272727273\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebias_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.020454545455\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.020454545455\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emean_power_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.061363636364\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.061363636364\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch2 id=\"problem-tools-and-submission\"\u003eTools and Submission\u003c/h2\u003e\n\u003cp\u003eSoft solve budget: \u003cstrong\u003e3 hours\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eDiscover inputs, resources and feedback through \u003ccode\u003e/protocol/task.json\u003c/code\u003e (including its \u003ccode\u003eresources\u003c/code\u003e field) and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e. Use supplied IHP primitives and KLayout, Magic and ngspice; explicitly submit after writing \u003ccode\u003e/workspace/output/final.gds\u003c/code\u003e. Host configuration, source records and reference solutions are not solver inputs.\u003c/p\u003e\n\u003cp\u003eThe authoritative MOS input preserves the original logical groups, W/L/m and all four terminal nets. Verified unit arrays, multiple fingers, shared diffusion and shared wells on the same body net are allowed. Native LVS checks connectivity and equivalent device parameters; native DRC checks actual well/substrate contacts. Contact count, dimensions, area/perimeter and the reference well partition are not circuit constraints. PEX uses actual diffusion geometry and interconnect RC, with logical body nets as its boundary; distributed substrate/well resistance is outside this extraction model.\u003c/p\u003e\n\u003ch3 id=\"problem-solve-workflow\"\u003eSolve workflow\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eRead the declared circuit and materials, \u003ccode\u003e/protocol/task.json\u003c/code\u003e for paths, constraints and reviewed resources, and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e for capabilities and helper commands. Task inputs under \u003ccode\u003e/task\u003c/code\u003e and resources under \u003ccode\u003e/resources\u003c/code\u003e are read-only; construct the layout in \u003ccode\u003e/workspace\u003c/code\u003e with the declared tools. With layout MCP, paths and commands refer to the remote EDA workspace. Create your own implementation with real devices, interconnect and pins, using your own tool loop without delegating to other agents; reference layouts and author code are not solver inputs.\u003c/li\u003e\n\u003cli\u003eInspect \u003ccode\u003eresources.external\u003c/code\u003e before using external tools. Each command starts a fresh shell: when tool modules are declared, source \u003ccode\u003e/usr/share/Modules/init/bash\u003c/code\u003e and load the selected tool's modules; export its declared \u003ccode\u003etool_environment\u003c/code\u003e settings in that same command. Repeat as needed and use batch or headless operation. Local manuals, command references, and release notes may be available within the declared EDA installation and PDK resource directories. Locate these resources through \u003ccode\u003e/protocol/task.json\u003c/code\u003e and consult the documentation for the installed tool version when diagnosing unfamiliar syntax or tool failures.\u003c/li\u003e\n\u003cli\u003eGenerate an initial candidate and submit a snapshot early. When \u003ccode\u003eprocess-feedback\u003c/code\u003e is available, check the current GDS with layout MCP \u003ccode\u003echeck\u003c/code\u003e or \u003ccode\u003epython -I /protocol/process_check.py\u003c/code\u003e before the final submission. This runs the final evaluator's complete plan and returns engineering diagnostics and candidate measurements, without scores or normalized quality factors. Checks have no count limit and consume the same wall-clock budget. Inspect the physical and functional results and all scored metrics; successful tool execution alone does not establish requirement satisfaction. Read paginated diagnostics with \u003ccode\u003ereport\u003c/code\u003e when using MCP. Local exploratory checks do not replace this complete check.\u003c/li\u003e\n\u003cli\u003eUse the remaining time for measured improvements to the declared quality objectives. Identify the limiting scored metrics, make targeted layout changes, regenerate and check the candidate, and compare measurements with the previous candidate and the stated scoring targets and trade-offs. Preserve the best valid candidate and revert changes that worsen the overall objective. Repeat while time and useful improvements remain; passing validity checks alone is not a stopping condition.\u003c/li\u003e\n\u003cli\u003eStop optimization when the budget expires, all declared quality objectives are achieved, or measured trials support convergence. If stopping early, explain the changes tried, the metric comparisons and the remaining limitations. Track remaining time through session status. At soft-budget expiry, finish or cancel already-started work and submit immediately; do not start another command, check or optimization round. If an MCP execution is running, use \u003ccode\u003epoll\u003c/code\u003e with its \u003ccode\u003eexecution_id\u003c/code\u003e and the returned \u003ccode\u003enext_offset\u003c/code\u003e as \u003ccode\u003eoffset\u003c/code\u003e until completion, or cancel it and wait for it to stop.\u003c/li\u003e\n\u003cli\u003eFinish or cancel outstanding work, restore your best candidate to the declared output path, and explicitly submit it before ending the session. With layout MCP \u003ccode\u003esubmit\u003c/code\u003e, remove the \u003ccode\u003e/workspace/\u003c/code\u003e prefix from \u003ccode\u003eoutput.path\u003c/code\u003e; with the container interface, run \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e. Wait for the receipt: only the last accepted snapshot is judged, and writing a file alone is not submission. Acceptance confirms delivery; the framework independently evaluates validity and quality after the session.\u003c/li\u003e\n\u003c/ol\u003e\n12:T2931,\u003cp\u003eArtifact, geometry, DRC, LVS and declared functional requirements must pass. Parasitic extraction is also mandatory: it must produce a complete, electrically consistent netlist usable by the required post-layout simulations. A completed candidate rejection scores zero; infrastructure errors do not establish candidate failure.\u003c/p\u003e\n\u003cp\u003ePhysical checks and the declared functional bounds must pass. Quality scoring imposes no fixed degradation allowance. Each \u003ccode\u003esource_*\u003c/code\u003e job and its corresponding candidate extracted circuit use exactly the same testbench, model resources, parameters, loads and measurement windows. Independent source observations define the 100-point electrical baseline without depending on the submitted GDS; reports retain every paired result.\u003c/p\u003e\n\u003cp\u003eLet x be the post-layout measurement and b the source-circuit measurement under the same conditions:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eRatio normalization: maximize with q = x/b and minimize with q = b/x. When a numerical scale s is declared, use (x+s)/(b+s) and its reciprocal, respectively. The scale handles zero values as a normalization floor; it is neither an allowed degradation nor an acceptance bound.\u003c/li\u003e\n\u003cli\u003eAmplitude in dB: maximize with q = 10^((x-b)/20) and minimize with its reciprocal.\u003c/li\u003e\n\u003cli\u003eTarget normalization: q = 1/(1+abs(x-b)/s), where s is the declared physical scale. Signed or zero-valued operating points are not divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eUse \u003ccode\u003elayout\u003c/code\u003e scoring. Each metric takes its worst paired quality q, and the total score is S = 100 * product(min(1, q_i) ** w_i), with area quality q_area = area_reference / candidate_functional_area. The weights below sum to 1; metric dimensions describe measurements and do not determine weights. Physical, extraction, or functional rejection scores zero; other missing or invalid measurements leave the score unknown, and zero-weight observations must also be valid. Matching source-circuit performance at the reference area scores 100 points; each metric is capped at quality 1, so scores cannot exceed 100. Weights express quality tradeoffs rather than hard bounds.\u003c/p\u003e\n\u003cp\u003eThe measurements below use the supplied SPICE node and source names. \u003ccode\u003ev(n)\u003c/code\u003e is a node voltage; \u003ccode\u003ei(V)\u003c/code\u003e is current flowing into a voltage source, so delivered power uses a negative sign. \u003ccode\u003edb(z)=20*log10(abs(z))\u003c/code\u003e; \u003ccode\u003emag/abs\u003c/code\u003e denote magnitude, and \u003ccode\u003ecph\u003c/code\u003e denotes continuous phase in radians. \u003ccode\u003efind\u003c/code\u003e, \u003ccode\u003ewhen\u003c/code\u003e, \u003ccode\u003efrom/to\u003c/code\u003e and \u003ccode\u003erise/fall\u003c/code\u003e follow the deck's interpolation, window and crossing conventions. SPICE suffixes p/n/u/m/meg/g mean pico/nano/micro/milli/mega/giga. Nested \u003ccode\u003eavg\u003c/code\u003e, \u003ccode\u003emin\u003c/code\u003e, \u003ccode\u003emax\u003c/code\u003e, \u003ccode\u003evecmin/vecmax\u003c/code\u003e and \u003ccode\u003ederiv\u003c/code\u003e represent window averages, extrema and sampled derivatives. Measure each operating condition independently, pair it with the source result under that condition, and take the worst paired quality within each metric group.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003eoutput_error_v\u003c/code\u003e, \u003ccode\u003erecovery_up_v\u003c/code\u003e, \u003ccode\u003erecovery_down_v\u003c/code\u003e use \u003ccode\u003esaturating_ratio\u003c/code\u003e: q = 2(b+s)/(b+x+2s), where x is candidate error, b is paired source error and s is the positive scale below. Source-equivalent error gives q=1; improvement approaches the upper limit 2 with diminishing returns. s retains the declared units and numeric-floor meaning. Normalize each condition before taking the worst quality; other normalization and functional rules follow their own declarations.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eDefinition / observation\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eQuality normalization\u003c/th\u003e\n\u003cth\u003eFunctional range\u003c/th\u003e\n\u003cth\u003eScale\u003c/th\u003e\n\u003cth\u003eDimension\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003ev(vout)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.2\u003c/td\u003e\n\u003ctd\u003e1.2\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003eabs(v(vout)-v(vp))\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebias_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC operating point: \u003ccode\u003ev(net013)\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.2\u003c/td\u003e\n\u003ctd\u003e1.2\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u00 ed well; other PMOS use VDD and NMOS use the VSS substrate.\nPreserve all 24 MOS groups,\nW/L/m, every body connection and all physical passive devices.\u003c/p\u003e\n\u003cp\u003eMOS dimensions retain the declared grid adaptation. All internal capacitors use \u003ccode\u003ecap_cmim\u003c/code\u003e:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003ec0\u003c/code\u003e: \u003ccode\u003enet063\u003c/code\u003e (top) to \u003ccode\u003evout\u003c/code\u003e (bottom), 1 parallel 51.3 × 51.3 um MIM units.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eclocal\u003c/code\u003e: \u003ccode\u003enet050\u003c/code\u003e (top) to \u003ccode\u003evout\u003c/code\u003e (bottom), 4 parallel 51.64 × 51.64 um MIM units.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ecout\u003c/code\u003e: \u003ccode\u003evout\u003c/code\u003e (top) to \u003ccode\u003evss\u003c/code\u003e (bottom), 12 parallel 51.64 × 51.64 um MIM units.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eThe raw 10.0474 uA sink is calibrated to 1.255925 uA. The original\n3.94789 pF \u003ccode\u003enet063–vout\u003c/code\u003e compensation remains. Approximately 16 pF is added\nat \u003ccode\u003enet050–vout\u003c/code\u003e and another 48 pF at \u003ccode\u003evout–vss\u003c/code\u003e. These are physical\ncompensation/output-storage devices, included in the netlist, area and\nextracted simulation. This maintained circuit is explicitly not capless.\nNo ideal servo, diagnostic clamp or hidden damping element is part of this DUT.\u003c/p\u003e\n14:T922,\u003cp\u003eUse typical IHP LV MOS/MIM/poly models at 27 C and VDD=1.2 V, with a\n1.25592 uA sink from \u003ccode\u003enet013\u003c/code\u003e to VSS. All combinations of external\n5/10/15 pF load and 0.5/0.7 V DC input must pass. These external loads are\nadditional to every internal capacitor above.\u003c/p\u003e\n\u003cp\u003eA zero-volt source connects VINN (\u003ccode\u003evm\u003c/code\u003e) to VOUT, while VINP is AC ground. Insert series voltage injection and parallel current injection at this boundary, retaining the complete DUT and load. Voltage injection uses \u003ccode\u003eb=-I(VPROBE)\u003c/code\u003e, \u003ccode\u003ed=V(vm)\u003c/code\u003e; current injection uses \u003ccode\u003ea=-I(VPROBE)\u003c/code\u003e, \u003ccode\u003ec=V(vm)\u003c/code\u003e; \u003ccode\u003edelta=a*d-b*c\u003c/code\u003e, \u003ccode\u003eT=(2*delta-a+d)/(1-2*delta+a-d)\u003c/code\u003e (Tian expression 30). Export both raw injections to independently reconstruct the Y matrix. Sweep 300 points per decade from 0.01 Hz to 10 GHz; continuous phase follows the natural low-frequency branch without offset correction. Check first and last descending unity-gain crossings, full-sweep minimum sampled \u003ccode\u003eabs(1+T)\u003c/code\u003e, maximum absolute continuous phase over \u003ccode\u003e1+T\u003c/code\u003e, and gain over 2–10 GHz; a good first crossing alone is insufficient.\u003c/p\u003e\n\u003cp\u003eVINP is a 0.5→0.7→0.5 V pulse with 20 ns edges, rising at 2 us and falling at 20.02 us with period 100 us. Transient starts at its own initial-pulse operating point, independently of the AC DC-input setting. Simulate 0–40 us with Gear2, maximum step 2 ns, KLU, \u003ccode\u003eitl4=1000\u003c/code\u003e, \u003ccode\u003ershunt=1e12\u003c/code\u003e, \u003ccode\u003ereltol=1e-5\u003c/code\u003e, \u003ccode\u003eabstol=1e-12\u003c/code\u003e, \u003ccode\u003evntol=1e-8\u003c/code\u003e; numerical shunts are not physical devices. Verification also covers half steps, tighter tolerances/denser AC, trapezoidal integration, long tails and finite excitation/load boundaries. These finite outer-loop and recovery observations do not prove internal poles, stability under arbitrary loads, PVT, noise, mismatch, distortion, rail-to-rail operation or power-up startup performance.\u003c/p\u003e\n\u003cp\u003eThe phase margins at the first and last crossings must both lie within [0, 180] degrees. Minimum return distance and return-phase excursion need only be nonnegative; high-frequency gain has no acceptance threshold. These full-sweep metrics affect continuous quality without adding stability acceptance conditions. Missing crossings or invalid observations are evaluation errors.\u003c/p\u003e\n15:T42b,\u003cp\u003eSubmit GDSII top cell \u003ccode\u003eamp_015_sau_cfcc\u003c/code\u003e, at most 32 MiB. Native IHP main/maximal DRC\nmust pass without waivers (standalone scope, density/antenna off), together\nwith strict named-interface LVS and a 3600 × 150 um functional envelope.\nAll device/contact/interconnect drawing layers in the runtime \u003ccode\u003eoutline\u003c/code\u003e\nconstraint contribute to area; annotation/pin-purpose layers do not.\nPost-layout simulation uses the submitted GDS's complete Magic RC, with\nphysical MIM devices and interconnect resistances/capacitances. Half-grid\nimport is explicit. Magic retains only Metal3 interface labels in its isolated\nextraction copy to avoid repeated internal well-name aliases, while native LVS\nchecks the original GDS and its actual body-contact connectivity. No resistance/capacitance threshold omits small parasitics.\nSource simulation and extraction use the same logical body-net boundary. Distributed substrate resistance/noise and fabrication\nsignoff remain unqualified. The long independent witness is a feasibility\nlayout, not an area optimum.\u003c/p\u003e\n16:T12ec,\u003cp\u003eSoft solve budget: \u003cstrong\u003e3 hours\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eDiscover inputs, resources and feedback through \u003ccode\u003e/protocol/task.json\u003c/code\u003e (including its \u003ccode\u003eresources\u003c/code\u003e field) and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e. Use supplied IHP primitives and KLayout, Magic and ngspice; explicitly submit after writing \u003ccode\u003e/workspace/output/final.gds\u003c/code\u003e. Host configuration, source records and reference solutions are not solver inputs.\u003c/p\u003e\n\u003cp\u003eThe authoritative MOS input preserves the original logical groups, W/L/m and all four terminal nets. Verified unit arrays, multiple fingers, shared diffusion and shared wells on the same body net are allowed. Native LVS checks connectivity and equivalent device parameters; native DRC checks actual well/substrate contacts. Contact count, dimensions, area/perimeter and the reference well partition are not circuit constraints. PEX uses actual diffusion geometry and interconnect RC, with logical body nets as its boundary; distributed substrate/well resistance is outside this extraction model.\u003c/p\u003e\n\u003ch3\u003eSolve workflow\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eRead the declared circuit and materials, \u003ccode\u003e/protocol/task.json\u003c/code\u003e for paths, constraints and reviewed resources, and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e for capabilities and helper commands. Task inputs under \u003ccode\u003e/task\u003c/code\u003e and resources under \u003ccode\u003e/resources\u003c/code\u003e are read-only; construct the layout in \u003ccode\u003e/workspace\u003c/code\u003e with the declared tools. With layout MCP, paths and commands refer to the remote EDA workspace. Create your own implementation with real devices, interconnect and pins, using your own tool loop without delegating to other agents; reference layouts and author code are not solver inputs.\u003c/li\u003e\n\u003cli\u003eInspect \u003ccode\u003eresources.external\u003c/code\u003e before using external tools. Each command starts a fresh shell: when tool modules are declared, source \u003ccode\u003e/usr/share/Modules/init/bash\u003c/code\u003e and load the selected tool's modules; export its declared \u003ccode\u003etool_environment\u003c/code\u003e settings in that same command. Repeat as needed and use batch or headless operation. Local manuals, command references, and release notes may be available within the declared EDA installation and PDK resource directories. Locate these resources through \u003ccode\u003e/protocol/task.json\u003c/code\u003e and consult the documentation for the installed tool version when diagnosing unfamiliar syntax or tool failures.\u003c/li\u003e\n\u003cli\u003eGenerate an initial candidate and submit a snapshot early. When \u003ccode\u003eprocess-feedback\u003c/code\u003e is available, check the current GDS with layout MCP \u003ccode\u003echeck\u003c/code\u003e or \u003ccode\u003epython -I /protocol/process_check.py\u003c/code\u003e before the final submission. This runs the final evaluator's complete plan and returns engineering diagnostics and candidate measurements, without scores or normalized quality factors. Checks have no count limit and consume the same wall-clock budget. Inspect the physical and functional results and all scored metrics; successful tool execution alone does not establish requirement satisfaction. Read paginated diagnostics with \u003ccode\u003ereport\u003c/code\u003e when using MCP. Local exploratory checks do not replace this complete check.\u003c/li\u003e\n\u003cli\u003eUse the remaining time for measured improvements to the declared quality objectives. Identify the limiting scored metrics, make targeted layout changes, regenerate and check the candidate, and compare measurements with the previous candidate and the stated scoring targets and trade-offs. Preserve the best valid candidate and revert changes that worsen the overall objective. Repeat while time and useful improvements remain; passing validity checks alone is not a stopping condition.\u003c/li\u003e\n\u003cli\u003eStop optimization when the budget expires, all declared quality objectives are achieved, or measured trials support convergence. If stopping early, explain the changes tried, the metric comparisons and the remaining limitations. Track remaining time through session status. At soft-budget expiry, finish or cancel already-started work and submit immediately; do not start another command, check or optimization round. If an MCP execution is running, use \u003ccode\u003epoll\u003c/code\u003e with its \u003ccode\u003eexecution_id\u003c/code\u003e and the returned \u003ccode\u003enext_offset\u003c/code\u003e as \u003ccode\u003eoffset\u003c/code\u003e until completion, or cancel it and wait for it to stop.\u003c/li\u003e\n\u003cli\u003eFinish or cancel outstanding work, restore your best candidate to the declared output path, and explicitly submit it before ending the session. With layout MCP \u003ccode\u003esubmit\u003c/code\u003e, remove the \u003ccode\u003e/workspace/\u003c/code\u003e prefix from \u003ccode\u003eoutput.path\u003c/code\u003e; with the container interface, run \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e. Wait for the receipt: only the last accepted snapshot is judged, and writing a file alone is not submission. Acceptance confirms delivery; the framework independently evaluates validity and quality after the session.\u003c/li\u003e\n\u003c/ol\u003e\n6:[\"$\",\"$8\",null,{\"fallback\":[\"$\",\"p\",null,{\"children\":\"Loading published evidence…\"}],\"children\":[\"$\",\"$L10\",null,{\"task\":{\"case_path\":\"tasks/ihp-sg13g2/analog-db/cases/amp_015_sau_cfcc/case.toml\",\"coefficient\":8,\"collection\":\"analog-db\",\"configuration_url\":\"/ICLayout-Bench/assets/4a9ca839aad8024adfec7c342bc63151ed50216553096e8fa3867c9ac3245c9f.txt\",\"description_html\":\"$11\",\"description_path\":\"tasks/ihp-sg13g2/analog-db/cases/amp_015_sau_cfcc/problem.md\",\"hours\":3,\"id\":\"ihp-sg13g2.analog-db.amp_015_sau_cfcc\",\"inputs\":{\"description\":{\"format\":\"text\",\"path\":\"problem.md\",\"sha256\":\"f93ec430f5ae75db7cf5371311f80d26e7b09d22e93a1787701053e6ae9bfd73\"},\"netlist\":{\"format\":\"spice\",\"path\":\"materials/circuit.cdl\",\"sha256\":\"97d4a622ebdbebdeed5e1050e29ca4c1ab7496c39596180bec3270f7efc79901\",\"subcircuit\":\"amp_015_sau_cfcc\"},\"performance\":{\"format\":\"spice\",\"path\":\"materials/testbench.spice\",\"sha256\":\"180
