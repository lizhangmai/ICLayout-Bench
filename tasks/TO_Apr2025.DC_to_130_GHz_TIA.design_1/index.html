efined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L5\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[\"$L6\",[[\"$\",\"script\",\"script-0\",{\"src\":\"/ICLayout-Bench/_next/static/chunks/27jip_2vcvnd5.js\",\"async\":true,\"nonce\":\"$undefined\"}]],[\"$\",\"$L7\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.MetadataOutlet\",\"children\":\"$@9\"}]}]]}],{},null,false,null]},null,false,\"$a\"]},null,false,null],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Lb\",null,{\"children\":\"$Lc\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Ld\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.Metadata\",\"children\":\"$Le\"}]}]}],null]}],false]],\"m\":\"$undefined\",\"G\":[\"$f\",[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/ICLayout-Bench/_next/static/chunks/3sa54_ghi1h2h.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]]],\"S\":true,\"h\":null,\"r\":\"$undefined\",\"s\":\"$undefined\",\"a\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"2hqB741EA4j7xWQVg6hu-\"}\n10:I[1186,[\"/ICLayout-Bench/_next/static/chunks/2h60meymns2z5.js\",\"/ICLayout-Bench/_next/static/chunks/27jip_2vcvnd5.js\"],\"default\"]\na:C\n11:T28e3,\u003ch1 id=\"problem-dc130-ghz-sige-tia-layout\"\u003eDC–130 GHz SiGe TIA layout\u003c/h1\u003e\n\u003ch2 id=\"problem-objective\"\u003eObjective\u003c/h2\u003e\n\u003cp\u003eImplement the complete two-stage TIA with its four fixed RF transmission-line macros. Place the supplied passive assembly and implement the free HBT, resistor, MIM and substrate-tie circuit. Preserve device dimensions, multiplicities, topology and the macro geometry. The submitted top cell is \u003ccode\u003eFMD_QNC_03a_TIA_1\u003c/code\u003e.\u003c/p\u003e\n\u003ch3 id=\"problem-optimization-objective\"\u003eOptimization objective\u003c/h3\u003e\n\u003cp\u003eMaximize the declared quality score within the solve budget while satisfying all physical and necessary functional requirements. The first passing DRC, LVS and required electrical checks establish a feasible baseline. Continue improving the scored metrics from that baseline; a passing check or \u003ccode\u003etask_success = true\u003c/code\u003e does not mean that the quality objectives have been achieved.\u003c/p\u003e\n\u003ch2 id=\"problem-inputs-and-interface\"\u003eInputs and Interface\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003ematerials/circuit.cdl\u003c/code\u003e defines the free core and its seven ordered terminals; \u003ccode\u003ematerials/circuit.spice\u003c/code\u003e provides the same core's simulator model calls. \u003ccode\u003ematerials/rf-models.spice\u003c/code\u003e contains the pinned upstream two-port models and the complete \u003ccode\u003eRF_DUT INPUT OUTPUT VCC1 VCC2 VEE\u003c/code\u003e wrapper. \u003ccode\u003ematerials/rf-macros.gds\u003c/code\u003e and \u003ccode\u003ematerials/rf-macros.json\u003c/code\u003e define the fixed passive assembly, physical terminal landings and native label layers. \u003ccode\u003ematerials/testbench.spice\u003c/code\u003e is the complete RF fixture.\u003c/p\u003e\n\u003cp\u003eThe supplied assembly contains \u003ccode\u003eRF_INPUT\u003c/code\u003e, \u003ccode\u003eRF_OUTPUT\u003c/code\u003e, \u003ccode\u003eRF_SUPPLY1\u003c/code\u003e, \u003ccode\u003eRF_SUPPLY2\u003c/code\u003e and the retained \u003ccode\u003eRF_GROUND\u003c/code\u003e context, each exactly once. The four signal macros connect the external pads to \u003ccode\u003eRF_INPUT_INNER\u003c/code\u003e, \u003ccode\u003eRF_OUTPUT_INNER\u003c/code\u003e, \u003ccode\u003eRF_SUPPLY1_INNER\u003c/code\u003e and \u003ccode\u003eRF_SUPPLY2_INNER\u003c/code\u003e. Connect these named landing regions to the corresponding free-core nets. The two supply pads also connect to their respective 30 × 30 µm MIM decouplers. \u003ccode\u003eVCC1\u003c/code\u003e and \u003ccode\u003eVCC2\u003c/code\u003e are separate nets; \u003ccode\u003eVEE\u003c/code\u003e is the common return and HBT substrate.\u003c/p\u003e\n\u003cp\u003eQ1 has \u003ccode\u003eNx=5\u003c/code\u003e, Q2 has \u003ccode\u003eNx=4\u003c/code\u003e; all remaining physical dimensions are literal in the CDL. The core interface is \u003ccode\u003eRF_INPUT_INNER RF_OUTPUT_INNER VCC1 VCC2 VEE RF_SUPPLY1_INNER RF_SUPPLY2_INNER\u003c/code\u003e. The macro wrapper connects this core and all four inherited RF models; no active devices are supplied by the fixed library.\u003c/p\u003e\n\u003ch2 id=\"problem-operating-conditions\"\u003eOperating Conditions\u003c/h2\u003e\n\u003cp\u003eUse the declared typical HBT, resistor and capacitor model corners at 26.85 °C. Both independent supplies are 2 V. The original 50 Ω input/output ports are DC-blocked by 5 µF capacitors. Evaluate 551 equally spaced samples from 20 to 130 GHz. The inherited S2P tables cover through 150 GHz. Deterministic S-parameter simulation uses the declared SPARSE solver; no passive noise or transient capability is inferred from these tables. A 1 TΩ numerical shunt anchors floating PEX conductors in both front- and back-annotation runs.\u003c/p\u003e\n\u003ch2 id=\"problem-physical-requirements\"\u003ePhysical Requirements\u003c/h2\u003e\n\u003cp\u003ePass the full declared native DRC, strict named-port LVS and 720 × 860 µm functional outline check. The exact inherited non-Manhattan RF pad edges and listed recommended package exits have local marker exceptions; all free-circuit spacing, enclosure and connectivity rules remain enforced.\u003c/p\u003e\n\u003cp\u003eInstantiate the supplied macro cells without modifying their flattened geometry or text. Preserve their relative positions and ground context; the complete passive assembly can translate, turn by multiples of 90 degrees, or reflect together. The signal-body and contacting-via keepouts permit free wiring only at the declared extracted landings. External input/output fixture pads have no free-circuit attachment. Use the named metal text layers in the specification. Provide a native \u003ccode\u003eVEE\u003c/code\u003e label on its actual connected return metal.\u003c/p\u003e\n\u003cp\u003eThe evaluator verifies macro geometry before exposing its existing terminal landing shapes in a separate extraction copy. Strict LVS checks every free device and macro connection. Distributed local interconnect R/C comes from the submitted free circuit; fixed RF models retain upstream transmission-line inductive behavior. This is the declared RF macro co-simulation approximation. The physical boundaries are reconstructed from the upstream whole-chip layout and schematic; independent EM reference-plane calibration and arbitrary new passive geometry are outside this model's accuracy claim.\u003c/p\u003e\n\u003ch2 id=\"problem-electrical-requirements-and-scoring\"\u003eElectrical Requirements and Scoring\u003c/h2\u003e\n\u003cp\u003eAll declared measurements must be finite. Nonnegative physical-domain checks apply to squared reflection magnitudes and delay ranges. RF performance is quality, with no minimum score required for feasibility.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eDegradation scale\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eband_transimpedance\u003c/code\u003e: minimum \u003ccode\u003e20 log10(abs(50*S21/(1-S11)))\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e45%\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e3 dB\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edelay_ripple\u003c/code\u003e: peak-to-peak \u003ccode\u003e-d unwrap(arg(S21))/d(2*pi*f)\u003c/code\u003e group delay\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e15%\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.5 ps\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003einput_reflection\u003c/code\u003e: maximum input reflected-power fraction \u003ccode\u003eabs(S11)^2\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e10%\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.05\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_reflection\u003c/code\u003e: maximum output reflected-power fraction \u003ccode\u003eabs(S22)^2\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e30%\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.05\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eEach metric is paired with the identical source fixture. Improvements retain full credit; degradation \u003ccode\u003eL\u003c/code\u003e earns \u003ccode\u003escale/(scale+L)\u003c/code\u003e. The score is 100 times the weighted geometric mean. Band gain, supply power and the fixed-frame-dominated area are diagnostics with no score weight. A feasible reference layout establishes solvability; it does not define an easier performance target.\u003c/p\u003e\n\u003ch2 id=\"problem-tools-and-submission\"\u003eTools and Submission\u003c/h2\u003e\n\u003cp\u003eSolve budget: \u003cstrong\u003e1 hour\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eUse the declared SG13G2 resources and the existing open EDA image. Submit the complete candidate GDS at \u003ccode\u003eoutput/final.gds\u003c/code\u003e; no reference layout or author code is a solver input.\u003c/p\u003e\n\u003ch3 id=\"problem-solve-workflow\"\u003eSolve workflow\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eRead the declared circuit and materials, \u003ccode\u003e/protocol/task.json\u003c/code\u003e for paths, constraints and reviewed resources, and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e for capabilities and helper commands. Task inputs under \u003ccode\u003e/task\u003c/code\u003e and resources under \u003ccode\u003e/resources\u003c/code\u003e are read-only; construct the layout in \u003ccode\u003e/workspace\u003c/code\u003e with the declared tools. With layout MCP, paths and commands refer to the remote EDA workspace. Create your own implementation with real devices, interconnect and pins, using your own tool loop without delegating to other agents; reference layouts and author code are not solver inputs.\u003c/li\u003e\n\u003cli\u003eInspect \u003ccode\u003eresources.external\u003c/code\u003e before using external tools. Each command starts a fresh shell: when tool modules are declared, source \u003ccode\u003e/usr/share/Modules/init/bash\u003c/code\u003e and load the selected tool's modules; export its declared \u003ccode\u003etool_environment\u003c/code\u003e settings in that same command. Repeat as needed and use batch or headless operation. Local manuals, command references, and release notes may be available within the declared EDA installation and PDK resource directories. Locate these resources through \u003ccode\u003e/protocol/task.json\u003c/code\u003e and consult the documentation for the installed tool version when diagnosing unfamiliar syntax or tool failures.\u003c/li\u003e\n\u003cli\u003eGenerate an initial candidate and submit a snapshot early. When \u003ccode\u003eprocess-feedback\u003c/code\u003e is available, check the current GDS with layout MCP \u003ccode\u003echeck\u003c/code\u003e or \u003ccode\u003epython -I /protocol/process_check.py\u003c/code\u003e before the final submission. This runs the final evaluator's complete plan and returns engineering diagnostics and candidate measurements, without scores or normalized quality factors. Checks have no count limit and consume the same wall-clock budget. Inspect the physical and functional results and all scored metrics; successful tool execution alone does not establish requirement satisfaction. Read paginated diagnostics with \u003ccode\u003ereport\u003c/code\u003e when using MCP. Local exploratory checks do not replace this complete check.\u003c/li\u003e\n\u003cli\u003eUse the remaining time for measured improvements to the declared quality objectives. Identify the limiting scored metrics, make targeted layout changes, regenerate and check the candidate, and compare measurements with the previous candidate and the stated scoring targets and trade-offs. Preserve the best valid candidate and revert changes that worsen the overall objective. Repeat while time and useful improvements remain; passing validity checks alone is not a stopping condition.\u003c/li\u003e\n\u003cli\u003eStop optimization when the budget expires, all declared quality objectives are achieved, or measured trials support convergence. If stopping early, explain the changes tried, the metric comparisons and the remaining limitations. Track remaining time through session status. At soft-budget expiry, finish or cancel already-started work and submit immediately; do not start another command, check or optimization round. If an MCP execution is running, use \u003ccode\u003epoll\u003c/code\u003e with its \u003ccode\u003eexecution_id\u003c/code\u003e and the returned \u003ccode\u003enext_offset\u003c/code\u003e as \u003ccode\u003eoffset\u003c/code\u003e until completion, or cancel it and wait for it to stop.\u003c/li\u003e\n\u003cli\u003eFinish or cancel outstanding work, restore your best candidate to the declared output path, and explicitly submit it before ending the session. With layout MCP \u003ccode\u003esubmit\u003c/code\u003e, remove the \u003ccode\u003e/workspace/\u003c/code\u003e prefix from \u003ccode\u003eoutput.path\u003c/code\u003e; with the container interface, run \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e. Wait for the receipt: only the last accepted snapshot is judged, and writing a file alone is not submission. Acceptance confirms delivery; the framework independently evaluates validity and quality after the session.\u003c/li\u003e\n\u003c/ol\u003e\n12:T616,\u003cp\u003eAll declared measurements must be finite. Nonnegative physical-domain checks apply to squared reflection magnitudes and delay ranges. RF performance is quality, with no minimum score required for feasibility.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eDegradation scale\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eband_transimpedance\u003c/code\u003e: minimum \u003ccode\u003e20 log10(abs(50*S21/(1-S11)))\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e45%\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e3 dB\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003edelay_ripple\u003c/code\u003e: peak-to-peak \u003ccode\u003e-d unwrap(arg(S21))/d(2*pi*f)\u003c/code\u003e group delay\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e15%\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.5 ps\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003einput_reflection\u003c/code\u003e: maximum input reflected-power fraction \u003ccode\u003eabs(S11)^2\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e10%\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.05\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_reflection\u003c/code\u003e: maximum output reflected-power fraction \u003ccode\u003eabs(S22)^2\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e30%\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.05\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eEach metric is paired with the identical source fixture. Improvements retain full credit; degradation \u003ccode\u003eL\u003c/code\u003e earns \u003ccode\u003escale/(scale+L)\u003c/code\u003e. The score is 100 times the weighted geometric mean. Band gain, supply power and the fixed-frame-dominated area are diagnostics with no score weight. A feasible reference layout establishes solvability; it does not define an easier performance target.\u003c/p\u003e\n13:T629,\u003cp\u003e\u003ccode\u003ematerials/circuit.cdl\u003c/code\u003e defines the free core and its seven ordered terminals; \u003ccode\u003ematerials/circuit.spice\u003c/code\u003e provides the same core's simulator model calls. \u003ccode\u003ematerials/rf-models.spice\u003c/code\u003e contains the pinned upstream two-port models and the complete \u003ccode\u003eRF_DUT INPUT OUTPUT VCC1 VCC2 VEE\u003c/code\u003e wrapper. \u003ccode\u003ematerials/rf-macros.gds\u003c/code\u003e and \u003ccode\u003ematerials/rf-macros.json\u003c/code\u003e define the fixed passive assembly, physical terminal landings and native label layers. \u003ccode\u003ematerials/testbench.spice\u003c/code\u003e is the complete RF fixture.\u003c/p\u003e\n\u003cp\u003eThe supplied assembly contains \u003ccode\u003eRF_INPUT\u003c/code\u003e, \u003ccode\u003eRF_OUTPUT\u003c/code\u003e, \u003ccode\u003eRF_SUPPLY1\u003c/code\u003e, \u003ccode\u003eRF_SUPPLY2\u003c/code\u003e and the retained \u003ccode\u003eRF_GROUND\u003c/code\u003e context, each exactly once. The four signal macros connect the external pads to \u003ccode\u003eRF_INPUT_INNER\u003c/code\u003e, \u003ccode\u003eRF_OUTPUT_INNER\u003c/code\u003e, \u003ccode\u003eRF_SUPPLY1_INNER\u003c/code\u003e and \u003ccode\u003eRF_SUPPLY2_INNER\u003c/code\u003e. Connect these named landing regions to the corresponding free-core nets. The two supply pads also connect to their respective 30 × 30 µm MIM decouplers. \u003ccode\u003eVCC1\u003c/code\u003e and \u003ccode\u003eVCC2\u003c/code\u003e are separate nets; \u003ccode\u003eVEE\u003c/code\u003e is the common return and HBT substrate.\u003c/p\u003e\n\u003cp\u003eQ1 has \u003ccode\u003eNx=5\u003c/code\u003e, Q2 has \u003ccode\u003eNx=4\u003c/code\u003e; all remaining physical dimensions are literal in the CDL. The core interface is \u003ccode\u003eRF_INPUT_INNER RF_OUTPUT_INNER VCC1 VCC2 VEE RF_SUPPLY1_INNER RF_SUPPLY2_INNER\u003c/code\u003e. The macro wrapper connects this core and all four inherited RF models; no active devices are supplied by the fixed library.\u003c/p\u003e\n14:T5ae,\u003cp\u003ePass the full declared native DRC, strict named-port LVS and 720 × 860 µm functional outline check. The exact inherited non-Manhattan RF pad edges and listed recommended package exits have local marker exceptions; all free-circuit spacing, enclosure and connectivity rules remain enforced.\u003c/p\u003e\n\u003cp\u003eInstantiate the supplied macro cells without modifying their flattened geometry or text. Preserve their relative positions and ground context; the complete passive assembly can translate, turn by multiples of 90 degrees, or reflect together. The signal-body and contacting-via keepouts permit free wiring only at the declared extracted landings. External input/output fixture pads have no free-circuit attachment. Use the named metal text layers in the specification. Provide a native \u003ccode\u003eVEE\u003c/code\u003e label on its actual connected return metal.\u003c/p\u003e\n\u003cp\u003eThe evaluator verifies macro geometry before exposing its existing terminal landing shapes in a separate extraction copy. Strict LVS checks every free device and macro connection. Distributed local interconnect R/C comes from the submitted free circuit; fixed RF models retain upstream transmission-line inductive behavior. This is the declared RF macro co-simulation approximation. The physical boundaries are reconstructed from the upstream whole-chip layout and schematic; independent EM reference-plane calibration and arbitrary new passive geometry are outside this model's accuracy claim.\u003c/p\u003e\n15:Tfc9,\u003cp\u003eSolve budget: \u003cstrong\u003e1 hour\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eUse the declared SG13G2 resources and the existing open EDA image. Submit the complete candidate GDS at \u003ccode\u003eoutput/final.gds\u003c/code\u003e; no reference layout or author code is a solver input.\u003c/p\u003e\n\u003ch3\u003eSolve workflow\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eRead the declared circuit and materials, \u003ccode\u003e/protocol/task.json\u003c/code\u003e for paths, constraints and reviewed resources, and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e for capabilities and helper commands. Task inputs under \u003ccode\u003e/task\u003c/code\u003e and resources under \u003ccode\u003e/resources\u003c/code\u003e are read-only; construct the layout in \u003ccode\u003e/workspace\u003c/code\u003e with the declared tools. With layout MCP, paths and commands refer to the remote EDA workspace. Create your own implementation with real devices, interconnect and pins, using your own tool loop without delegating to other agents; reference layouts and author code are not solver inputs.\u003c/li\u003e\n\u003cli\u003eInspect \u003ccode\u003eresources.external\u003c/code\u003e before using external tools. Each command starts a fresh shell: when tool modules are declared, source \u003ccode\u003e/usr/share/Modules/init/bash\u003c/code\u003e and load the selected tool's modules; export its declared \u003ccode\u003etool_environment\u003c/code\u003e settings in that same command. Repeat as needed and use batch or headless operation. Local manuals, command references, and release notes may be available within the declared EDA installation and PDK resource directories. Locate these resources through \u003ccode\u003e/protocol/task.json\u003c/code\u003e and consult the documentation for the installed tool version when diagnosing unfamiliar syntax or tool failures.\u003c/li\u003e\n\u003cli\u003eGenerate an initial candidate and submit a snapshot early. When \u003ccode\u003eprocess-feedback\u003c/code\u003e is available, check the current GDS with layout MCP \u003ccode\u003echeck\u003c/code\u003e or \u003ccode\u003epython -I /protocol/process_check.py\u003c/code\u003e before the final submission. This runs the final evaluator's complete plan and returns engineering diagnostics and candidate measurements, without scores or normalized quality factors. Checks have no count limit and consume the same wall-clock budget. Inspect the physical and functional results and all scored metrics; successful tool execution alone does not establish requirement satisfaction. Read paginated diagnostics with \u003ccode\u003ereport\u003c/code\u003e when using MCP. Local exploratory checks do not replace this complete check.\u003c/li\u003e\n\u003cli\u003eUse the remaining time for measured improvements to the declared quality objectives. Identify the limiting scored metrics, make targeted layout changes, regenerate and check the candidate, and compare measurements with the previous candidate and the stated scoring targets and trade-offs. Preserve the best valid candidate and revert changes that worsen the overall objective. Repeat while time and useful improvements remain; passing validity checks alone is not a stopping condition.\u003c/li\u003e\n\u003cli\u003eStop optimization when the budget expires, all declared quality objectives are achieved, or measured trials support convergence. If stopping early, explain the changes tried, the metric comparisons and the remaining limitations. Track remaining time through session status. At soft-budget expiry, finish or cancel already-started work and submit immediately; do not start another command, check or optimization round. If an MCP execution is running, use \u003ccode\u003epoll\u003c/code\u003e with its \u003ccode\u003eexecution_id\u003c/code\u003e and the returned \u003ccode\u003enext_offset\u003c/code\u003e as \u003ccode\u003eoffset\u003c/code\u003e until completion, or cancel it and wait for it to stop.\u003c/li\u003e\n\u003cli\u003eFinish or cancel outstanding work, restore your best candidate to the declared output path, and explicitly submit it before ending the session. With layout MCP \u003ccode\u003esubmit\u003c/code\u003e, remove the \u003ccode\u003e/workspace/\u003c/code\u003e prefix from \u003ccode\u003eoutput.path\u003c/code\u003e; with the container interface, run \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e. Wait for the receipt: only the last accepted snapshot is judged, and writing a file alone is not submission. Acceptance confirms delivery; the framework independently evaluates validity and quality after the session.\u003c/li\u003e\n\u003c/ol\u003e\n6:[\"$\",\"$8\",null,{\"fallback\":[\"$\",\"p\",null,{\"children\":\"Loading published evidence…\"}],\"children\":[\"$\",\"$L10\",null,{\"task\":{\"case_path\":\"tasks/ihp-sg13g2/TO_Apr2025/cases/DC_to_130_GHz_TIA.design_1/case.toml\",\"coefficient\":4,\"collection\":\"TO_Apr2025\",\"configuration_url\":\"/ICLayout-Bench/assets/808aa47d5615727ea066b1fbd29c49de4075c6f652a5edfdf1a56039791fc07d.txt\",\"description_html\":\"$11\",\"description_path\":\"tasks/ihp-sg13g2/TO_Apr2025/cases/DC_to_130_GHz_TIA.design_1/problem.md\",\"hours\":1,\"id\":\"TO_Apr2025.DC_to_130_GHz_TIA.design_1\",\"inputs\":{\"description\":{\"format\":\"text\",\"path\":\"problem.md\",\"sha256\":\"10f40e1eb2ae801df926822a13ba828a8a50be4f294ee58883ad3faca2a16579\"},\"macrolibrary\":{\"format\":\"gds\",\"path\":\"materials/rf-macros.gds\",\"sha256\":\"2f3e1590fdedf35f72dba248fb090f11bb62a0d57ae28f433e481ca8b0d2a972\"},\"macros\":{\"format\":\"spice\",\"path\":\"materials/rf-models.spice\",\"sha256\":\"6d44dae9be613e6ba818b1f08e544f3265032e910f57f038e60699bc4fc8c1f2\"},\"macrospec\":{\"format\":\"json\",\"path\":\"materials \"category\":\"physical\",\"direction\":\"minimize\",\"id\":\"functional_area\",\"observations\":[\"geometry:area\"],\"unit\":\"um2\"},{\"aggregation\":\"min\",\"baseline\":[\"source_rf:band_transimpedance\"],\"category\":\"performance\",\"dimension\":\"response\",\"direction\":\"maximize\",\"id\":\"band_transimpedance\",\"normalization\":\"degradation\",\"observations\":[\"rf:band_transimpedance\"],\"scale\":3,\"unit\":\"dBohm\"},{\"aggregation\":\"max\",\"baseline\":[\"source_rf:delay_ripple\"],\"category\":\"performance\",\"dimension\":\"response\",\"direction\":\"minimize\",\"id\":\"delay_ripple\",\"normalization\":\"degradation\",\"observations\":[\"rf:delay_ripple\"],\"requirement\":{\"lower\":0,\"rationale\":\"A squared reflection magnitude or peak-to-peak delay range is nonnegative; its size is scored continuously.\"},\"scale\":5e-13,\"unit\":\"s\"},{\"aggregation\":\"max\",\"baseline\":[\"source_rf:input_reflection\"],\"category\":\"performance\",\"dimension\":\"response\",\"direction\":\"minimize\",\"id\":\"input_reflection\",\"normalization\":\"degradation\",\"observations\":[\"rf:input_reflection\"],\"requirement\":{\"lower\":0,\"rationale\":\"A squared reflection magnitude or peak-to-peak delay range is nonnegative; its size is scored continuously.\"},\"scale\":0.05,\"unit\":\"1\"},{\"aggregation\":\"max\",\"baseline\":[\"source_rf:output_reflection\"],\"category\":\"performance\",\"dimension\":\"response\",\"direction\":\"minimize\",\"id\":\"output_reflection\",\"normalization\":\"degradation\",\"observations\":[\"rf:output_reflection\"],\"requirement\":{\"lower\":0,\"rationale\":\"A squared reflection magnitude or peak-to-peak delay range is nonnegative; its size is scored continuously.\"},\"scale\":0.05,\"unit\":\"1\"},{\"aggregation\":\"min\",\"category\":\"performance\",\"direction\":\"maximize\",\"id\":\"band_gain\",\"observations\":[\"rf:band_gain\"],\"unit\":\"dB\"},{\"aggregation\":\"max\",\"category\":\"performance\",\"direction\":\"minimize\",\"id\":\"supply_power\",\"observations\":[\"rf:supply_power\"],\"unit\":\"W\"}],\"pdk\":\"ihp-sg13g2\",\"reader\":{\"category\":\"Amplifiers \u0026 RF\",\"summary\":\"Converts input current to voltage through two direct-coupled SiGe HBT stages with first-stage resistive feedback.\",\"title\":\"DC–130 GHz SiGe TIA with fixed upstream RF passives\"},\"scoring\":{\"area_metric\":\"functional_area\",\"area_target\":619200,\"method\":\"layout\",\"rationale\":\"Actual native post-layout controls show output matching is the hardest dimension: its quality is 0.109 versus 0.219 transimpedance, 0.223 delay and 0.311 input matching. Increase output-matching weight from 15% to 30%, retaining 45% for core transimpedance, 15% delay and 10% input matching. Bias, supply power and fixed-frame area remain diagnostics. No quality-score cutoff establishes feasibility.\",\"weights\":{\"band_transimpedance\":0.45,\"delay_ripple\":0.15,\"functional_area\":0,\"input_reflection\":0.1,\"output_reflection\":0.3}},\"sections\":{\"Electrical Requirements and Scoring\":\"$12\",\"Inputs and Interface\":\"$13\",\"Objective\":\"\u003cp\u003eImplement the complete two-stage TIA with its four fixed RF transmission-line macros. Place the supplied passive assembly and implement the free HBT, resistor, MIM and substrate-tie circuit. Preserve device dimensions, multiplicities, topology and the macro geometry. The submitted top cell is \u003ccode\u003eFMD_QNC_03a_TIA_1\u003c/code\u003e.\u003c/p\u003e\\n\u003ch3\u003eOptimization objective\u003c/h3\u003e\\n\u003cp\u003eMaximize the declared quality score within the solve budget while satisfying all physical and necessary functional requirements. The first passing DRC, LVS and required electrical checks establish a feasible baseline. Continue improving the scored metrics from that baseline; a passing check or \u003ccode\u003etask_success = true\u003c/code\u003e does not mean that the quality objectives have been achieved.\u003c/p\u003e\\n\",\"Operating Conditions\":\"\u003cp\u003eUse the declared typical HBT, resistor and capacitor model corners at 26.85 °C. Both independent supplies are 2 V. The original 50 Ω input/output ports are DC-blocked by 5 µF capacitors. Evaluate 551 equally spaced samples from 20 to 130 GHz. The inherited S2P tables cover through 150 GHz. Deterministic S-parameter simulation uses the declared SPARSE solver; no passive noise or transient capability is inferred from these tables. A 1 TΩ numerical shunt anchors floating PEX conductors in both front- and back-annotation runs.\u003c/p\u003e\\n\",\"Physical Requirements\":\"$14\",\"Tools and Submission\":\"$15\"},\"source_url\":\"https://github.com/IHP-GmbH/TO_Apr2025/blob/63e203a0eccfb6028a1a0a8364553e4e979b55b3/DC_to_130_GHz_TIA/design_1/design_data/qucs-s/DC_to_130_GHz_TIA.sch\",\"status\":\"qualified\",\"title\":\"DC–130 GHz SiGe TIA with fixed upstream RF passives\",\"core\":false},\"catalog\":{\"tasks\":[],\"runs\":[],\"experiments\":[],\"contexts\":[],\"boards\":[]},\"previewRun\":null,\"preview\":null,\"evidenceError\":false}]}]\nc:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n16:I[27201,[\"/ICLayout-Bench/_next/static/chunks/2h60meymns2z5.js\"],\"IconMark\"]\n9:null\ne:[[\"$\",\"title\",\"0\",{\"children\":\"ICLayout-Bench | Circuit layout intelligence\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Independent evaluation of AI for integrated circuit layout. Compare model scores, explore circuit performance and inspect generated layouts.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/ICLayout-Bench/brand/iclayout-bench.svg\",\"type\":\"image/svg+xml\",\"sizes\":\"any\"}],[\"$\",\"$L16\",\"3\",{}]]\n"])</script></body></html>
