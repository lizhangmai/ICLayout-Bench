 a demonstrated optimum or a mandatory topology; other aspect ratios and equivalent layouts remain allowed. Array sharing of wells or body contacts is not assumed for the standalone cell. Area carries 50%, complete-window supply power 40% and read delay 10%. Energy is the principal electrical layout cost; read timing retains a smaller independent weight. Both stored states, nondestructive reads and all declared measurements remain checked.12:T6bb,The eleven fixed MIM plates occupy 26941.7246 um2, or 89.8% of the 30000 um2 footprint objective, leaving 3058.2754 um2 of planar overhead for plate spacing, enclosures and interconnect. MOS and contact layers may share footprint with MIM only where native rules allow. The area objective remains a demanding integration budget, not a proven minimum or an acceptance bound. Area carries 30%, minimum sampled return-distance preservation 20%, worst bilateral 0.1%-of-commanded-step settling-time preservation 20%, DC power preservation 15% and DC tracking-error preservation 15%. Return-distance loss retains its 0.05 budget; around a source distance of 0.8, this loss raises sampled peak sensitivity by about 7%. Settling-time loss uses 20 ns, one declared input-ramp interval. Its 200 uV band is relative to each circuit's own late output plateau and is 0.1% of the commanded 0.2 V step. The finite observation window censors an unsettled response to the window duration without adding a quality rejection threshold. Power and tracking error use dimensionless units equal to their same-condition nominal source observations, independently remeasured in the frozen pre-layout characterization. Their 0.05 loss budgets penalize a 5% increase with half metric quality, expressing preservation of the fixed circuit's power and precision; matching or improving the paired source receives full credit. Raw watts, volts and the response integral remain diagnostics. Phase-margin, gain and high-frequency diagnostics retain zero weight. All electrical quality anchors are same-condition pre-layout observations. These budgets affect continuous quality only and do not claim complete internal-loop stability or asymptotic settling.13:T420,The 23 fixed MIM plates occupy 58539.3916 um2 within the 62000 um2 footprint objective. The remaining 3460.6084 um2 accommodates enclosures, spacing and routing with overlap only where native rules permit. Area carries 30%, minimum sampled return-distance preservation 50% and the worst bilateral offset-independent response integral 20%. Return-distance loss uses a budget of 0.05 in normalized loop units. At the source distance of about 0.8, losing 0.05 raises the sampled peak sensitivity 1/min(abs(1+T)) by about 7%; this merits a material quality penalty. The response-integral loss budget is 10 ns, one tenth of the 100 ns input ramp. Both metrics use degradation normalization against each paired source observation; equal or improved observations receive full credit. Tracking error, phase-margin summaries, gain and power remain diagnostics with all measurements and functional requirements retained. The fixed MIM footprint target is unchanged. These quality budgets do not impose acceptance thresholds or claim complete internal-loop stability.14:T514,Area carries 15%; S11 at 32 GHz and S22 at 50 GHz carry 25% and 35%; absolute LSB/MSB differential S21 at 50 GHz carry 10% and 15%. These use the upstream RF testbench conventions and same-condition pre-layout observations. High-frequency absolute gain retains delivered signal in the objective, so attenuation cannot improve matching without a cost. LF gain, binary weight, relative rolloff, fixed-bias power and 1 GHz tone swing remain diagnostics. The reference proves feasibility without a score minimum. Model scope is upstream kpex 2.5D CC plus native devices; inductance/full-wave accuracy is not claimed by the scoring extraction. Each scored RF metric uses one-sided degradation q=budget/(budget+loss), with q=1 for an improvement. Budgets are 0.5 dB for delivered gain and input reflection, and 1 dB for output reflection. A 0.5 dB gain budget represents about 5.6% amplitude loss. The input matching budget resolves the upstream physical design's roughly 1 dB return-loss margin; the broader output budget resolves a 1 dB loss within the source's roughly 4 dB margin. They set quality sensitivity, not functional cutoffs, and exceed numerical measurement noise. Ordinary db20 conversion would credit a 1 dB reflection degradation at about 0.89, obscuring these margins even at high weight.6:[\"$\",\"$8\",null,{\"fallback\":[\"$\",\"p\",null,{\"children\":\"Loading published evidence…\"}],\"children\":[\"$\",\"$L10\",null,{\"tasks\":[{\"category\":\"Amplifiers \u0026 RF\",\"coefficient\":8,\"collection\":\"CircuitOpt\",\"family\":\"freepdk45_fd_ota\",\"hours\":8,\"id\":\"freepdk45.CircuitOpt.fd_ota\",\"pdk\":\"freepdk45\",\"rationale\":\"The testbench measures differential gain and unity frequency at a 0.2 pF load and checks a 50 mV CMFB reference step. Gain 25%, bandwidth 25%, supply 15%, output bias/balance/tracking 20%, and physical area 15% reflect a small-signal OTA. The 1000 um2 area target is below the unoptimized reference and remains a quality target.\",\"status\":\"qualified\",\"summary\":\"Amplifies differential inputs with a telescopic cascode stage and transistor-level common-mode feedback.\",\"title\":\"Fully Differential Telescopic OTA\",\"published_runs\":0},{\"category\":\"Logic \u0026 memory\",\"coefficient\":6,\"collection\":\"OpenRAM\",\"family\":\"freepdk45_cell_6t\",\"hours\":1,\"id\":\"freepdk45.OpenRAM.cell_6t\",\"pdk\":\"freepdk45\",\"rationale\":\"$11\",\"status\":\"qualified\",\"summary\":\"Stores one bit using cross-coupled inverters and wordline-controlled access transistors.\",\"title\":\"Six-Transistor SRAM Bitcell\",\"published_runs\":26},{\"category\":\"Logic \u0026 memory\",\"coefficient\":5,\"collection\":\"OpenRAM\",\"family\":\"freepdk45_sense_amp\",\"hours\":3,\"id\":\"freepdk45 ion\",\"published_runs\":27},{\"category\":\"Amplifiers \u0026 RF\",\"coefficient\":4,\"collection\":\"analog-db\",\"family\":\"physical_core\",\"hours\":6,\"id\":\"gf180mcuD.analog-db.sup_001_vcm_detector\",\"pdk\":\"gf180mcuD\",\"rationale\":\"Common-mode sensing/controllers: recovery and error 40.5%; signed transfer 31.5%; output bias 4.5%; power 13.5%; area 10%. Each objective's weight is divided equally among its metrics.\",\"status\":\"qualified\",\"summary\":\"Averages two input voltages through a passive resistive common-mode network.\",\"title\":\"Passive Resistive Common-Mode Averager\",\"published_runs\":0},{\"category\":\"Power \u0026 references\",\"coefficient\":3,\"collection\":\"analog-db\",\"family\":\"physical_core\",\"hours\":6,\"id\":\"gf180mcuD.analog-db.tsn_001_ptat_2t\",\"pdk\":\"gf180mcuD\",\"rationale\":\"Temperature-slope cores: temperature slope 42.4%; curvature 31.8%; output endpoints 5.29%; power 10.6%; area 10%. Each objective's weight is divided equally among its metrics.\",\"status\":\"qualified\",\"summary\":\"Produces a temperature-dependent response whose slope and curvature are measured across the declared range.\",\"title\":\"Two-NMOS Temperature-Response Core\",\"published_runs\":0},{\"category\":\"Power \u0026 references\",\"coefficient\":6,\"collection\":\"analog-db\",\"family\":\"gf180mcuD_tsn_002_ptat_classic\",\"hours\":1,\"id\":\"gf180mcuD.analog-db.tsn_002_ptat_classic\",\"pdk\":\"gf180mcuD\",\"rationale\":\"The 300 um2 integration budget carries 50% for this fixed-device PTAT core. Curvature carries 20%. The worst paired mean/minimum/maximum temperature slope is scored as one 15% group with a 10 uV/C deviation scale, avoiding three correlated rewards for the same transfer law. Startup time carries 10% and peak power 5%. The 2 mV curvature budget over -20 to 100 C is close to the 1.9 mV worst source curvature. Repeated endpoint voltages, final ripple and repeated steady power observations remain diagnostics; fixed topology \",\"summary\":\"Converts an eight-bit digital code into an analog voltage through an R-2R network.\",\"title\":\"Eight-Bit R-2R DAC Core\",\"published_runs\":4},{\"category\":\"Mixed-signal\",\"coefficient\":8,\"collection\":\"tt_tnt_gf_vco\",\"family\":\"gf180_vco\",\"hours\":1.5,\"id\":\"gf180mcuD.tt_tnt_gf_vco.vco\",\"pdk\":\"gf180mcuD\",\"rationale\":\"The 250 um2 footprint carries 25%. The three relative phases together carry 45%, centered on exact quarter/half/three-quarter cycles with a one-degree deviation scale; a full-cycle scale hid useful routing asymmetry. The two frequencies retain temperature/load-specific source anchors with 5 and 10 MHz scales and 10% weight each. Tuning and supply power receive 5% each. Faster oscillation alone is not rewarded at the expense of the intended control law.\",\"status\":\"qualified\",\"summary\":\"Generates quadrature oscillation with a voltage-controlled tuning response.\",\"title\":\"Quadrature Voltage-Controlled Oscillator\",\"published_runs\":27},{\"category\":\"Logic \u0026 memory\",\"coefficient\":5,\"collection\":\"voidwalkers-scandff\",\"family\":\"gf180_scan_dff\",\"hours\":1.5,\"id\":\"gf180mcuD.voidwalkers-scandff.scan_dff\",\"pdk\":\"gf180mcuD\",\"rationale\":\"The 100 um2 area goal rewards compact latch, clock and scan-multiplexer placement. Area carries 50%, worst source-paired propagation delay 40% and supply power 10%. Output slew remains diagnostic. The 550 ps timing goal, both fixed setup/hold exercises, scan selection and asynchronous reset remain checked.\",\"status\":\"qualified\",\"summary\":\"Stores a clocked bit with scan selection and asynchronous active-low reset.\",\"title\":\"Scan D Flip-Flop with Active-Low Reset\",\"published_runs\":26},{\"category\":\"Mixed-signal\",\"coefficient\":6,\"collection\":\"IHP-AnalogAcademy\",\"family\":\"ihp_sg13g2_analog_comparator\",\"hours\":3,\"id\":\"module_3_8_bit_SAR_ADC.part_5_analog_layout.comparator\",\"pdk\":\"ihp-sg13g2\",\"rationale\":\"Clocked c cient\":5,\"collection\":\"analog-db\",\"family\":\"ihp-sg13g2_vgs_reference\",\"hours\":3,\"id\":\"ihp-sg13g2.analog-db.vref_001_vgs\",\"pdk\":\"ihp-sg13g2\",\"rationale\":\"VGS reference: line and temperature drift 31.5%; load regulation 22.5%; startup and disturbance recovery 18%; reference and extrema 9%; supply cost 9%; area 10%. Each objective's weight is divided equally among its metrics.\",\"status\":\"qualified\",\"summary\":\"Establishes a voltage reference using a mixed low/high-voltage two-transistor core.\",\"title\":\"Mixed LV/HV VGS Reference with Picoampere Load and Zero-State Recovery\",\"published_runs\":0},{\"category\":\"Power \u0026 references\",\"coefficient\":1,\"collection\":\"OpenFASOC\",\"family\":\"sky130_current_mirror\",\"hours\":1,\"id\":\"sky130A.OpenFASOC.current_mirror\",\"pdk\":\"sky130A\",\"rationale\":\"A 90 um2 functional footprint budgets 48 um2 for the eight fixed 3-by-2 um gate rectangles and 42 um2 for diffusion, spacing, contacts and routing. This is an integration allocation, not a process minimum. Area and worst current-ratio error each carry 50%; full quality requires compact placement and electrical accuracy together. The 3% current-transfer error goal applies across all three reference currents and the entire output-voltage sweep; a 0.5 percentage-point scale resolves meaningful changes. This deterministic compliance-and-routing metric makes no mismatch-yield claim. The feasible reference may miss both goals.\",\"status\":\"qualified\",\"summary\":\"Copies a reference current with a 1:1 interdigitated current mirror across the declared output-voltage range.\",\"title\":\"SKY130 1:1 Interdigitated Current Mirror\",\"published_runs\":6},{\"category\":\"Amplifiers \u0026 RF\",\"coefficient\":3,\"collection\":\"OpenFASOC\",\"family\":\"sky130_opamp\",\"hours\":8,\"id\":\"sky130A.OpenFASOC.two_stage_opamp\",\"pdk\":\"sky130A\",\"rationale\":\"Low-frequency voltage gain and noise-gain-10 loop bandwidth each carry 30%, supply power 20%, and physical area 20%. Source and extracted fixtures use 0.1/0.5/1 pF and 100 Mohm loads, TT at 27 C, 1.8 V supply, 0.9 V common mode and 20/100 uA biases. The loop must retain its stable 0 to 180 degree phase-margin branch at |A|=10; no fixed gain, bandwidth, power or 45 degree margin budget is a validity cutoff. Area target is the frozen reference functional footprint.\",\"status\":\"qualified\",\"summary\":\"Amplifies differential inputs with a two-stage Miller amplifier characterized at noise gain ten.\",\"title\":\"SKY130 Two-Stage Miller Operational Amplifier\",\"published_runs\":0},{\"category\":\"Mixed-signal\",\"coefficient\":3,\"collection\":\"sky130_ef_ip__ccomp3v\",\"family\":\"sky130_comparator\",\"hours\":3,\"id\":\"sky130A.sky130_ef_ip__ccomp3v.ccomp3v\",\"pdk\":\"sky130A\",\"rationale\":\"Rising and falling decision-delay preservation carry 30% each, switching-point preservation 20% and area 20%. The 10 ns additional-delay budget uses degradation normalization instead of dividing the loss by the intrinsic decision delay. The 100 uV switching-point scale is 0.5% of the 20 mV overdrive and is well above the verified DC search resolution. Every metric uses its worst same-condition source pair across the three common modes. Supply power remains diagnostic; targets are continuous quality objectives, not functional cutoffs.\",\"status\":\"qualified\",\"summary\":\"Compares differential inputs across three common-mode voltages with a complementary input load.\",\"title\":\"SKY130 Continuous Comparator with Complementary Input Load\",\"published_runs\":10},{\"category\":\"Amplifiers \u0026 RF\",\"coefficient\":3,\"collection\":\"sky130_ef_ip__opamp\",\"family\":\"sky130_opamp\",\"hours\":8,\"id\":\"sky130A.sky130_ef_ip__opamp.opamp\",\"pdk\":\"sky130A\",\"rationale\":\"The 1500 um2 footprint is a 30 by 50 um integration allocation, independent of the feasibility witness. Core dynamic response carries 45% through the upstream CACE output crossing intervals; loaded unity-gain bandwidth carries 25% and area 30%. DC gain and fixed-bias power remain diagnostics. Source-paired slew intervals retain the upstream unloaded fixture and add the existing 0.1/1 pF application loads. The actual 0.5-to-2.8 V interval is measured directly, avoiding the upstream hard-coded 2 V slew numerator.\",\"status\":\"qualified\",\"summary\":\"Amplifies differential inputs with a 3.3 V rail-to-rail operational amplifier under the declared capacitive loads.\",\"title\":\"SKY130 3.3 V Rail-to-Rail Operational Amplifier\",\"published_runs\":0},{\"category\":\"Mixed-signal\",\"coefficient\":4,\"collection\":\"sky130_ef_ip__rdac3v_8bit\",\"family\":\"sky130_dac\",\"hours\":4,\"id\":\"sky130A.sky130_ef_ip__rdac3v_8bit.rdac3v_8bit\",\"pdk\":\"sky130A\",\"rationale\":\"Retain the 9000 um2 integration allocation for the fixed ladder, decoder, level shifters and buffer. Upstream external-reference INL carries 35%, DNL 20%, area 30%, and rising/falling response 7.5% each. DC power is diagnostic. Precision scores use the original CACE definitions rather than endpoint-fit errors; paired same-condition source observations remain the electrical anchor. Directional quality budgets are 0.05 LSB for INL and 0.02 LSB for DNL, or 312.5 uV and 125 uV under the declared references. They resolve layout-induced transfer errors and are not acceptance cutoffs.\",\"status\":\"qualified\",\"summary\":\"Converts all 256 digital codes to buffered analog voltages within the characterized reference interval.\",\"title\":\"SKY130 8-Bit Buffered Resistor DAC\",\"published_runs\":27},{\"category\":\"Mixed-signal\",\"coefficient\":4,\"collection\":\"sky130_ef_ip__samplehold\",\"family\":\"sky130_samplehold\",\"hours\":1.5,\"id\":\"sky130A.sky130_ef_ip__samplehold.samplehold\",\"pdk\":\"sky130A\",\"rationale\":\"The 3000 um2 footprint is a compact buffered-sampler goal. Area receives 50%; held-value error after input reversal receives 25%, tracking 15%, and reacquisition and power 5% each. Tracking and reacquisition approach the same equilibrium, so their repeated observation no longer doubles the main accuracy reward. Error targets refer to the declared sampling times and do not claim faster acquisition or additional corners.\",\"status\":\"qualified\",\"summary\":\"Tracks, holds and reacquires an analog input using a buffered sample-and-hold circuit.\",\"title\":\"SKY130 Buffered Sample and Hold\",\"published_runs\":27},{\"category\":\"Power \u0026 references\",\"coefficient\":2,\"collection\":\"sky130_ef_ip__simple_por\",\"family\":\"sky130_power_on_reset\",\"hours\":1.5,\"id\":\"sky130A.sky130_ef_ip__simple_por.simple_por\",\"pdk\":\"sky130A\",\"rationale\":\"The 1500 um2 area goal rewards compact placement of the startup network. Release timing remains centered on each ramp-specific source crossing: earlier release is not automatically better. A 100 us deviation scale makes parasitic shifts visible without imposing a timing tolerance. Each domain-release metric carries 40%, with its worst source-paired quality over the three supply ramps; area carries 20%. Timing is centered on the ramp-specific source crossing, so early release is not automatically better. Startup power remains diagnostic. The 100 us timing scale and both domains' functional checks remain unchanged.\",\"status\":\"qualified\",\"summary\":\"Generates reset outputs during staggered dual-supply startup and releases them after the supply ramps.\",\"title\":\"SKY130 Dual-Supply Power-On Reset\",\"published_runs\":26}],\"evidenceAvailable\":true}]}]\nc:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n15:I[27201,[\"/ICLayout-Bench/_next/static/chunks/2h60meymns2z5.js\"],\"IconMark\"]\n9:null\ne:[[\"$\",\"title\",\"0\",{\"children\":\"ICLayout-Bench | Circuit layout intelligence\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Independent evaluation of
