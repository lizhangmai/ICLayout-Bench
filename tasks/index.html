ts with a telescopic cascode stage and transistor-level common-mode feedback.\",\"title\":\"Fully Differential Telescopic OTA\",\"published_runs\":0},{\"category\":\"Logic \u0026 memory\",\"coefficient\":6,\"collection\":\"OpenRAM\",\"family\":\"freepdk45_cell_6t\",\"hours\":1,\"id\":\"freepdk45.OpenRAM.cell_6t\",\"pdk\":\"freepdk45\",\"rationale\":\"The 0.4 um2 cell-area goal demands compact cross-coupled placement and shared diffusion. Equal 45% area and read-delay weights expose the density/read-access tradeoff; 10% supply power retains switching cost. The 14 ps read target leaves little parasitic margin beyond the approximately 13.2 ps source response and is not a functional deadline.\",\"status\":\"qualified\",\"summary\":\"Stores one bit using cross-coupled inverters and wordline-controlled access transistors.\",\"title\":\"Six-Transistor SRAM Bitcell\",\"published_runs\":4},{\"category\":\"Logic \u0026 memory\",\"coefficient\":5,\"collection\":\"OpenRAM\",\"family\":\"freepdk45_sense_amp\",\"hours\":3,\"id\":\"freepdk45.OpenRAM.sense_amp\",\"pdk\":\"freepdk45\",\"rationale\":\"SRAM periphery: peripheral delay 68%; supply power 17%; area 15%. Each objective's weight is divided equally among its metrics.\",\"status\":\"qualified\",\"summary\":\"Resolves a small bitline voltage difference into a clocked digital decision.\",\"title\":\"Clocked SRAM Sense Amplifier\",\"published_runs\":0},{\"category\":\"Logic \u0026 memory\",\"coefficient\":3,\"collection\":\"OpenRAM\",\"family\":\"freepdk45_write_driver\",\"hours\":1,\"id\":\"freepdk45.OpenRAM.write_driver\",\"pdk\":\"freepdk45\",\"rationale\":\"The 1.8 um2 area goal rewards sharing in the two complementary tristate branches, without changing their 12 transistors. Delay receives 50% because four loaded transitions expose routing imbalance; area receives 40% and supply power 10%. The 70 ps timing goal is close to the slowest source transition (about 68 ps); disabled high-impedance behavior remains a functional check.\",\"status\":\"qualified\",\"summary\":\"Drives complementary bitlines during a write and releases them when disabled.\",\"title\":\"Complementary SRAM Write Driver\",\"published_runs\":5},{\"category\":\"Logic \u0026 memory\",\"coefficient\":2,\"collection\":\"nangate45-pdk\",\"family\":\"freepdk45_aoi21_x1\",\"hours\":3,\"id\":\"freepdk45.nangate45-pdk.AOI21_X1\",\"pdk\":\"freepdk45\",\"rationale\":\"Standard-cell logic: propagation delay 48%; output transition 16%; supply power 16%; area 20%. Each objective's weight is divided equally among its metrics.\",\"status\":\"qualified\",\"summary\":\"Implements AND-OR-invert logic in a fixed-height standard cell.\",\"title\":\"AND-OR-Invert Gate\",\"published_runs\":0},{\"category\":\"Logic \u0026 memory\",\"coefficient\":1,\"collection\":\"nangate45-pdk\",\"family\":\"freepdk45_inv_x1\",\"hours\":3,\"id\":\"freepdk45.nangate45-pdk.INV_X1\",\"pdk\":\"freepdk45\",\"rationale\":\"Standard-cell logic: propagation delay 48%; output transition 16%; supply power 16%; area 20%. Each objective's weight is divided equally among its metrics.\",\"status\":\"qualified\",\"summary\":\"Inverts a digital input in a fixed-height standard cell.\",\"title\":\"Inverter\",\"published_runs\":0},{\"category\":\"Logic \u0026 memory\",\"coefficient\":1,\"collection\":\"nangate45-pdk\",\"family\":\"freepdk45_nand2_x1\",\"hours\":1,\"id\":\"freepdk45.nangate45-pdk.NAND2_X1\",\"pdk\":\"freepdk45\",\"rationale\":\"A 0.7 um2 footprint rewards a compact four-transistor NAND with shared series diffusion. Area 50%, propagation delay 35% and output transition 10% capture physical density and loaded path quality; power is 5%. The 16 ps delay goal is near the slowest source path (about 15.2 ps) and does not replace truth-table or logic-level checks.\",\"status\":\"qualified\",\"summary\":\"Implements two-input NAND logic in a fixed-height standard cell.\",\"title\":\"Two-Input NAND\",\"published_runs\":5},{\"category\":\"Logic \u0026 memory\",\"coefficient\":1,\"collection\":\"nangate45-pdk\",\"family\":\"freepdk45_nor2_x1\",\"hours\":3,\"id\":\"freepdk45.nangate45-pdk.NOR2_X1\",\"pdk\":\"freepdk45\",\"rationale\":\"Standard-cell logic: propagation delay 48%; output transition 16%; supply power 16%; area 20%. Each objective's weight is divided equally among its metrics.\",\"status\":\"qualified\",\"summary\":\"Implements two-input NOR logic in a fixed-height standard cell.\",\"title\":\"Two-Input NOR\",\"published_runs\":0},{\"category\":\"Logic \u0026 memory\",\"coefficient\":1,\"collection\":\"nangate45-pdk\",\"family\":\"freepdk45_xor2_x1\",\"hours\":3,\"id\":\"freepdk45.nangate45-pdk.XOR2_X1\",\"pdk\":\"freepdk45\",\"rationale\":\"Standard-cell logic: propagation delay 48%; output transition 16%; supply power 16%; area 20%. Each objective's weight is divided equally among its metrics.\",\"status\":\"qualified\",\"summary\":\"Implements two-input XOR logic in a fixed-height standard cell.\",\"title\":\"Two-Input XOR\",\"published_runs\":0},{\"category\":\"Mixed-signal\",\"coefficient\":4,\"collection\":\"2AMLogic-sar-adc\",\"family\":\"gf180_track_switch\",\"hours\":3,\"id\":\"gf180mcuD.2AMLogic-sar-adc.track_switch\",\"pdk\":\"gf180mcuD\",\"rationale\":\"Track/hold switches: acquisition 39.4%; hold fidelity 50.6%; area 10%. Each objective's weight is divided equally among its metrics.\",\"status\":\"qualified\",\"summary\":\"Tracks an analog input through a transmission gate with dummy compensation.\",\"title\":\"Dummy-Compensated Track Switch\",\"published_runs\":0},{\"category\":\"Mixed-signal\",\"coefficient\":6,\"collection\":\"Chipathon2023_ADC\",\"family\":\"gf180_comparator\",\"hours\":3,\"id\":\"gf180mcuD.Chipathon2023_ADC.comparator\",\"pdk\":\"gf180mcuD\",\"rationale\":\"Clocked comparators: decision delay 71.1%; supply power 18.9%; area 10%. Each objective's weight is divided equally among its metrics.\",\"status\":\"qualified\",\"summary\":\"Compares two input voltages using a clocked regenerative decision.\",\"title\":\"Dynamic Comparator\",\"published_runs\":0},{\"category\":\"Amplifiers \u0026 RF\",\"coefficient\":4,\"collection\":\"Jianxun-OTA\",\"family\":\"gf180_ota_5t\",\"hours\":1,\"id\":\"gf180mcuD.Jianxun-OTA.ota_5t\",\"pdk\":\"gf180mcuD\",\"rationale\":\"A 100 um2 functional footprint is a compact 10-by-10 um integration budget, not a percentage of the feasibility witness. Area (50%) and loaded bandwidth (30%) reward diffusion sharing and short sensitive interconnects with fixed device dimensions. Gain (8%), CMRR (7%), bias (3%) and power (2%) retain electrical quality without letting nearly fixed DC quantities dominate. The 26 MHz bandwidth goal retains nearly all nominal source bandwidth at 1 pF; the 10 mV bias scale resolves routing-induced shifts without imposing a rejection limit.\",\"status\":\"qualified\",\"summary\":\"Amplifies a differential input with a compact five-transistor OTA core and bias network.\",\"title\":\"Five-Transistor OTA with Bias and Dummies\",\"published_runs\":4},{\"category\":\"Amplifiers \u0026 RF\",\"coefficient\":5,\"collection\":\"analog-db\",\"family\":\"gf180_pmos_folded_cascode\",\"hours\":3,\"id\":\"gf180mcuD.analog-db.amp_004_folded_cascode\",\"pdk\":\"gf180mcuD\",\"rationale\":\"Small-signal OTAs: gain 27%; bandwidth 22.5%; phase margin 22.5%; operating points 4.5%; power 13.5%; area 10%. Each objective's weight is divided equally among its metrics.\",\"status\":\"qualified\",\"summary\":\"Amplifies differential inputs with an externally biased PMOS folded-cascode stage across three supply voltages.\",\"title\":\"Externally Biased PMOS-Input Folded-Cascode OTA\",\"published_runs\":0},{\"category\":\"Amplifiers \u0026 RF\",\"coefficient\":7,\"collection\":\"analog-db\",\"family\":\"multistage_compensated_ota\",\"hours\":8,\"id\":\"gf180mcuD.analog-db.amp_017_tan_clia\",\"pdk\":\"gf180mcuD\",\"rationale\":\"Finite-window amplifier response: tracking error 36%; ripple 22.5%; AC transfer 18%; bias and offset 4.5%; power 9%; area 10%. Each objective's weight is divided equally among its metrics.\",\"status\":\"qualified\",\"summary\":\"Amplifies differential signals through three stages with current inversion and physical R/C compensation.\",\"title\":\"Tan CLIA Three-Stage Amplifier\",\"published_runs\":0},{\"category\":\"Amplifiers \u0026 RF\",\"coefficient\":5,\"collection\":\"analog-db\",\"family\":\"gf180mcuD_amp_018_telescopic_cascode\",\"hours\":3,\"id\":\"gf180mcuD.analog-db.amp_018_telescopic_cascode\",\"pdk\":\"gf180mcuD\",\"rationale\":\"Small-signal OTAs: gain 27%; bandwidth 22.5%; phase margin 22.5%; operating points 4.5%; power 13.5%; area 10%. Each objective's weight is divided equally among its metrics.\",\"status\":\"qualified\",\"summary\":\"Amplifies differential inputs with an NMOS telescopic cascode and tail-referenced bias across three capacitive loads.\",\"title\":\"Tail-Referenced Telescopic Cascode Amplifier\",\"published_runs\":0},{\"category\":\"Amplifiers \u0026 RF\",\"coefficient\":6,\"collection\":\"analog-db\",\"family\":\"amp_physical_core\",\"hours\":8,\"id\":\"gf180mcuD.analog-db.amp_019_ti_ldo_error\",\"pdk\":\"gf180mcuD\",\"rationale\":\"Finite-window amplifier response: tracking error 36%; ripple 22.5%; AC transfer 18%; bias and offset 4.5%; power 9%; area 10%. Each objective's weight is divided equally among its metrics.\",\"status\":\"qualified\",\"summary\":\"Amplifies a differential error signal using external bias, level shifting and series Miller compensation.\",\"title\":\"Externally Biased TI-Architecture Error Amplifier\",\"published_runs\":0},{\"category\":\"Amplifiers \u0026 RF\",\"coefficient\":6,\"collection\":\"analog-db\",\"family\":\"gf180_selfbiased_miller_amplifier\",\"hours\":3,\"id\":\"gf180mcuD.analog-db.amp_032_ti_ldo_error_selfbias\",\"pdk\":\"gf180mcuD\",\"rationale\":\"Self-biased Miller buffers: tracking 36%; phase margin 22.5%; gain and bandwidth 18%; bias 4.5%; power 9%; area 10%. Each objective's weight is divided equally among its metrics.\",\"status\":\"qualified\",\"summary\":\"Amplifies an error signal with a self-biased two-stage core, level-shifted mirror and Miller compensation.\",\"title\":\"Self-Biased LDO Error Amplifier\",\"published_runs\":0},{\"category\":\"Amplifiers \u0026 RF\",\"coefficient\":6,\"collection\":\"analog-db\",\"family\":\"gf180_selfbiased_miller_amplifier\",\"hours\":3,\"id\":\"gf180mcuD.analog-db.amp_033_ti_ldo_ref_selfbias\",\"pdk\":\"gf180mcuD\",\"rationale\":\"Self-biased Miller buffers: tracking 36%; phase margin 22.5%; gain and bandwidth 18%; bias 4.5%; power 9%; area 10%. Each objective's weight is divided equally among its metrics.\",\"status\":\"qualified\",\"summary\":\"Buffers a reference through a self-biased two-stage Miller amplifier under external unity feedback.\",\"title\":\"Self-Biased LDO Reference Amplifier\",\"published_runs\":0},{\"category\":\"Amplifiers \u0026 RF\",\"coefficient\":6,\"collection\":\"analog-db\",\"family\":\"gf180mcuD_cmfb_003_5t_nmos_input\",\"hours\":3,\"id\":\"gf180mcuD.analog-db.cmfb_003_5t_nmos_input\",\"pdk\":\"gf180mcuD\",\"rationale\":\"Common-mode sensing/controllers: recovery and error 62.3%; output bias 6.92%; power 20.8%; area 10%. Each objective's weight is divided equally among its metrics.\",\"status\":\"qualified\",\"summary\":\"Controls common-mode voltage using an NMOS-input core and segmented resistors.\",\"title\":\"Segmented-Resistor NMOS Common-Mode Controller\",\"published_runs\":0},{\"category\":\"Mixed-signal\",\"coefficient\":5,\"collection\":\"analog-db\",\"family\":\"gf180_resistive_hysteretic_comparator\",\"hours\":3,\"id\":\"gf180mcuD.analog-db.cmp_001_hyst_diffpair\",\"pdk\":\"gf180mcuD\",\"rationale\":\"Hysteretic comparator: switching thresholds 49.5%; hysteresis 27%; supply power 13.5%; area 10%. Each objective's weight is divided equally among its metrics.\",\"status\":\"qualified\",\"summary\":\"Produces distinct rising and falling switching thresholds through resistive hysteresis.\",\"title\":\"Resistive-Feedback Hysteretic Comparator\",\"published_runs\":0},{\"category\":\"Mixed-signal\",\"coefficient\":6,\"collection\":\"analog-db\",\"family\":\"gf180_strongarm\",\"hours\":1,\"id\":\"gf180mcuD.analog-db.cmp_002_strongarm\",\"pdk\":\"gf180mcuD\",\"rationale\":\"Worst decision delay receives 55% because regenerative-node parasitics and branch routing directly affect the 16-condition decision sweep. A 100 um2 footprint receives 30%, power 10% and slew 5%. Rail decision amplitude remains checked but is not repeatedly rewarded. The 700 ps target is just beyond the slowest source decision (about 671 ps), and is independent of the much looser functional observation window.\",\"status\":\"qualified\",\"summary\":\"Makes clocked differential decisions with a StrongARM regenerative latch.\",\"title\":\"StrongARM Dynamic Comparator\",\"published_runs\":4},{\"category\":\"Amplifiers \u0026 RF\",\"coefficient\":4,\"collection\":\"analog-db\",\"family\":\"gf180_resistive_differential_pair\",\"hours\":3,\"id\":\"gf180mcuD.analog-db.dp_001_resistive_load\",\"pdk\":\"gf180mcuD\",\"rationale\":\"Local gain stages: signal transfer 38.6%; bandwidth 11.6%; balance and linearity 19.3%; operating points 3.86%; power 11.6%; area 15%. Each objective's weight is divided equally among its metrics.\",\"status\":\"qualified\",\"summary\":\"Produces differential gain with resistive loads and a fixed input pair.\",\"title\":\"Resistively Loaded Differential Pair\",\"published_runs\":0},{\"category\":\"Amplifiers \u0026 RF\",\"coefficient\":4,\"collection\":\"analog-db\",\"family\":\"gf180_cascode_common_source\",\"hours\":3,\"id\":\"gf180mcuD.analog-db.gs_001_cascode_cs\",\"pdk\":\"gf180mcuD\",\"rationale\":\"Local gain stages: signal transfer 50%; bandwidth 15%; operating points 5%; power 15%; area 15%. Each objective's weight is divided equally among its metrics.\",\"status\":\"qualified\",\"summary\":\"Provides voltage gain through a self-biased ca n-mode sampler: sample accuracy 45%; hold drift 27%; output bias 4.5%; clock power 13.5%; area 10%. Each objective's weight is divided equally among its metrics.\",\"status\":\"qualified\",\"summary\":\"Samples common-mode voltage using clocked switches and physical MIM capacitors.\",\"title\":\"MIM Switched-Capacitor Common-Mode Sampler\",\"published_runs\":0},{\"category\":\"Amplifiers \u0026 RF\",\"coefficient\":4,\"collection\":\"analog-db\",\"family\":\"ihp-sg13g2_pam4_driver\",\"hours\":1.5,\"id\":\"ihp-sg13g2.analog-db.drv_001_pam4_sige_dac\",\"pdk\":\"ihp-sg13g2\",\"rationale\":\"The 700 um2 area budget demands compact HBT/resistor placement while RF quality carries 80%. Binary weighting gets 20% with a 0.1 dB deviation scale (about 1.16% amplitude-ratio change), replacing the previous 6.02 dB scale that hid weighting error. Gain rolloff and port reflection retain distinct frequency measurements and source anchors. Supply power and fundamental swing retain 5% each; fixed DC bias does not dominate the score.\",\"status\":\"qualified\",\"summary\":\"Combines weighted current-steering cells into a SiGe PAM4 driver.\",\"title\":\"Upstream broadband SiGe PAM4 current-steering driver\",\"published_runs\":4},{\"category\":\"Amplifiers \u0026 RF\",\"coefficient\":8,\"collection\":\"analog-db\",\"family\":\"clocked_capacitive_instrumentation_amplifier\",\"hours\":10,\"id\":\"ihp-sg13g2.analog-db.ia_002_fan_chopper_simple\",\"pdk\":\"ihp-sg13g2\",\"rationale\":\"Clocked instrumentation amplifiers: signal fidelity 31.3%; drift and ripple 19.6%; input impedance 15.7%; common-mode behavior 15.7%; supply and clock power 7.83%; area 10%. Each objective's weight is divided equally among its metrics.\",\"status\":\"qualified\",\"summary\":\"Processes differential signals with a clocked, capacitively coupled instrumentation amplifier.\",\"title\":\"Fan Clocked Capacitive Instrumentation Amplifier\",\"published_runs\":0},{\"category\":\"Amplifiers \u0026 RF\",\"coefficient\":9,\"collection\":\"analog-db\",\"family\":\"clocked_capacitive_instrumentation_amplifier\",\"hours\":10,\"id\":\"ihp-sg13g2.analog-db.ia_003_fan_chopper_pf\",\"pdk\":\"ihp-sg13g2\",\"rationale\":\"Clocked instrumentation amplifiers: signal fidelity 31.3%; drift and ripple 19.6%; input impedance 15.7%; common-mode behavior 15.7%; supply and clock power 7.83%; area 10%. Each objective's weight is divided equally among its metrics.\",\"status\":\"qualified\",\"summary\":\"Combines clocked capacitive instrumentation amplification with positive feedback.\",\"title\":\"Fan Clocked Capacitive Instrumentation Amplifier with Positive Feedback\",\"published_runs\":0},{\"category\":\"Amplifiers \u0026 RF\",\"coefficient\":10,\"collection\":\"analog-db\",\"family\":\"ihp-sg13g2_ia_006_fan_chopper_cmfb\",\"hours\":1.5,\"id\":\"ihp-sg13g2.analog-db.ia_006_fan_chopper_cmfb\",\"pdk\":\"ihp-sg13g2\",\"rationale\":\"The 40000 um2 integration budget contains 28361.9667 um2 of fixed MIM plates plus physical high-poly chains, taps, MOS and routing, and carries 25%. Common-mode-to-differential rejection carries 20%; RMS and peak-to-peak clock ripple, gain preservation and clock power carry 10% each; baseline error, return error and mean supply power carry 5% each. The 8 mV RMS and 100 mV peak-to-peak goals are distinct: the source has about 7.9 mV RMS but 104 mV peak-to-peak ripple, so a crest budget is not a duplicate of average ripple energy. The 25 uV common-mode disturbance budget and 1 nW clock-drive budget apply to the declared 20 kHz continuously switching clock pairs. Drift and broad common-mode summaries remain diagnostics.\",\"status\":\"qualified\",\"summary\":\"Combines clocked capacitive instrumentation amplification with transistor common-mode feedback.\",\"title\":\"Clocked Capacitive Instrumentation Amplifier with Transistor CMFB\",\"published_runs\":5},{\"category\":\"Power \u0026 references\",\"coefficient\":9,\"collection\":\"analog-db\",\"family\":\"ihp-sg13g2_ldo_001_ r_5t_pass\",\"hours\":3,\"id\":\"ihp-sg13g2.analog-db.ldo_009_fer_5t_pass\",\"pdk\":\"ihp-sg13g2\",\"rationale\":\"IHP regulators: regulation and headroom 22.5%; load recovery 22.5%; startup 13.5%; loop stability 13.5%; AC transfer and extrema 4.5%; internal bias 1.8%; quiescent current 7.2%; power 4.5%; area 10%. Each objective's weight is divided equally among its metrics.\",\"status\":\"qualified\",\"summary\":\"Regulates a loaded output through the declared feedback loop, with layout-dependent recovery and power.\",\"title\":\"Unity-Feedback Regulator with Internal Output Storage\",\"published_runs\":0},{\"category\":\"Mixed-signal\",\"coefficient\":5,\"collection\":\"analog-db\",\"family\":\"ihp-sg13g2_smp_001_nmos_th\",\"hours\":1,\"id\":\"ihp-sg13g2.analog-db.smp_001_nmos_th\",\"pdk\":\"ihp-sg13g2\",\"rationale\":\"The fixed 18.2 um square storage plate occupies 331.24 um2, already exceeding the former 300 um2 goal. A 400 um2 integration budget leaves 68.76 um2 beyond that plate for enclosure, the sampling switch, body tap and routing and carries 30%. Held-value accuracy carries 25%; pedestal, off-state feedthrough, tracking and clock energy carry 10% each; reacquisition carries 5%. Hold drift is retained as a diagnostic decomposition of held-value error. Explicit physical goals avoid defining perfect accuracy from near-zero source samples, while the worst of all 16 sample/temperature/off-state conditions determines each quality factor.\",\"status\":\"qualified\",\"summary\":\"Samples and holds a voltage with an NMOS switch and an internal storage capacitor.\",\"title\":\"Physical NMOS Sample-and-Hold: Headroom and Retention\",\"published_runs\":5},{\"category\":\"Mixed-signal\",\"coefficient\":3,\"collection\":\"analog-db\",\"family\":\"sw_physical_core\",\"hours\":8,\"id\":\"ihp-sg13g2.analog-db.sw_001_transmission_gate_pair\",\"pdk\":\"ihp-sg13g2\",\"rationale\":\"Transmission/chopper switches: on-state conduction 21.4%; off-state leakage 17.1%; transfer fidelity 25.7%; switching disturbance 25.7%; area 10%. Each objective's weight is divided equally among its metrics.\",\"status\":\"qualified\",\"summary\":\"Transfers analog signals bidirectionally through a CMOS transmission gate.\",\"title\":\"Bidirectional CMOS Transmission Gate\",\"published_runs\":0},{\"category\":\"Mixed-signal\",\"coefficient\":5,\"collection\":\"analog-db\",\"family\":\"ihp-sg13g2_sw_002_chopper_diff\",\"hours\":3,\"id\":\"ihp-sg13g2.analog-db.sw_002_chopper_diff\",\"pdk\":\"ihp-sg13g2\",\"rationale\":\"Transmission/chopper switches: on-state conduction 23.7%; transfer fidelity 28.4%; switching disturbance 28.4%; clock power 9.47%; area 10%. Each objective's weight is divided equally among its metrics.\",\"status\":\"qualified\",\"summary\":\"Commutates differential signal polarity with a clock-controlled switch network.\",\"title\":\"Differential Polarity-Commutating Switch\",\"published_runs\":0},{\"category\":\"Mixed-signal\",\"coefficient\":5,\"collection\":\"analog-db\",\"family\":\"ihp-sg13g2_sw_003_binary_capbank\",\"hours\":3,\"id\":\"ihp-sg13g2.analog-db.sw_003_binary_capbank\",\"pdk\":\"ihp-sg13g2\",\"rationale\":\"Binary capacitor bank: code transfer accuracy 54%; recovery and 011-to-100 transition response 27%; phase 9%; area 10%. Within the 27% budget, return error is 13.5%, static settling error 4.5%, code midpoint time 4.5%, and transition settling error 4.5%. Redundant transfer and loading observations retain zero weight; their measurement validity and bounds still apply.\",\"status\":\"qualified\",\"summary\":\"Selects capacitive transfer using a three-bit bank of physical MIM capacitors.\",\"title\":\"Three-Bit MIM Capacitive Transfer Bank\",\"published_runs\":0},{\"category\":\"Mixed-signal\",\"coefficient\":4,\"collection\":\"analog-db\",\"family\":\"ihp-sg13g2_trm_001_vcr\",\"hours\":3,\"id\":\"ihp-sg13g2.analog-db.trm_001_vcr\",\"pdk\":\"ihp-sg13g2\",\"rationale\":\"Voltage-controlled trim element: control characteristic 36%; conductance 22.5%; loaded recovery 18%; operating range 4.5%; power 9%; area 10%. Each objective's weight is divided equally among its metrics.\",\"status\":\"qualified\",\"summary\":\"Controls a resistor-pulled output using an NMOS shunt driven by an analog voltage.\",\"title\":\"Resistor-Pullup NMOS Shunt Trim\",\"published_runs\":0},{\"category\":\"Power \u0026 references\",\"coefficient\":5,\"collection\":\"analog-db\",\"family\":\"ihp-sg13g2_vgs_reference\",\"hours\":3,\"id\":\"ihp-sg13g2.analog-db.vref_001_vgs\",\"pdk\":\"ihp-sg13g2\",\"rationale\":\"VGS reference: line and temperature drift 31.5%; load regulation 22.5%; startup and disturbance recovery 18%; reference and extrema 9%; supply cost 9%; area 10%. Each objective's weight is divided equally among its metrics.\",\"status\":\"qualified\",\"summary\":\"Establishes a voltage reference using a mixed low/high-voltage two-transistor core.\",\"title\":\"Mixed LV/HV VGS Reference with Picoampere Load and Zero-State Recovery\",\"published_runs\":0},{\"category\":\"Power \u0026 references\",\"coefficient\":1,\"collection\":\"OpenFASOC\",\"family\":\"sky130_current_mirror\",\"hours\":1,\"id\":\"sky130A.OpenFASOC.current_mirror\",\"pdk\":\"sky130A\",\"rationale\":\"A 100 um2 functional footprint is a compact 10-by-10 um integration budget. Area and worst current-ratio error each carry 50%, so a loose generator footprint cannot earn 100 from near-source electrical behavior alone. The 3% current-transfer error goal applies across all three reference currents and the entire output-voltage sweep; a 0.5 percentage-point scale resolves meaningful changes. This deterministic compliance-and-routing metric makes no mismatch-yield claim. The feasible reference may miss both goals.\",\"status\":\"qualified\",\"summary\":\"Copies a reference current with a 1:1 interdigitated current mirror across the declared output-voltage range.\",\"title\":\"SKY130 1:1 Interdigitated Current Mirror\",\"published_runs\":6},{\"category\":\"Amplifiers \u0026 RF\",\"coefficient\":3,\"collection\":\"OpenFASOC\",\"family\":\"sky130_opamp\",\"hours\":8,\"id\":\"sky130A.OpenFASOC.two_stage_opamp\",\"pdk\":\"sky130A\",\"rationale\":\"Low-frequency voltage gain and noise-gain-10 loop bandwidth each carry 30%, supply power 20%, and physical area 20%. Source and extracted fixtures use 0.1/0.5/1 pF and 100 Mohm loads, TT at 27 C, 1.8 V supply, 0.9 V common mode and 20/100 uA biases. The loop must retain its stable 0 to 180 degree phase-margin branch at |A|=10; no fixed gain, bandwidth, power or 45 degree margin budget is a validity cutoff. Area target is the frozen reference functional footprint.\",\"status\":\"qualified\",\"summary\":\"Amplifies differential inputs with a two-stage Miller amplifier characterized at noise gain ten.\",\"title\":\"SKY130 Two-Stage Miller Operational Amplifier\",\"published_runs\":0},{\"category\":\"Mixed-signal\",\"coefficient\":3,\"collection\":\"sky130_ef_ip__ccomp3v\",\"family\":\"sky130_comparator\",\"hours\":8,\"id\":\"sky130A.sky130_ef_ip__ccomp3v.ccomp3v\",\"pdk\":\"sky130A\",\"rationale\":\"Offset preservation, rising delay, falling delay, supply power and area each carry 20%. Timing uses +/-20 mV overdrive and 1 pF output load at three input common modes; CLOAD is held at the same common mode. A 1 mV offset scale, 10 ns timing scale and 100 uW power scale avoid singular error ratios. Output logic levels remain functional requirements; offset, propagation delay and supply power are continuous quality objectives without fixed budget cutoffs.\",\"status\":\"qualified\",\"summary\":\"Compares differential inputs across three common-mode voltages with a complementary input load.\",\"title\":\"SKY130 Continuous Comparator with Complementary Input Load\",\"published_runs\":0},{\"category\":\"Amplifiers \u0026 RF\",\"coefficient\":3,\"collection\":\"sky130_ef_ip__opamp\",\"family\":\"sky130_opamp\",\"hours\":8,\"id\":\"sky130A.sky130_ef_ip__opamp.opamp\",\"pdk\":\"sky130A\",\"rationale\":\"Voltage gain and unity-gain bandwidth carry 60%, supply power 20%, and area 20%. The same source and extracted fixtures use 0.1/0.5/1 pF and 100 Mohm loads at TT, 27 C, 3.3 V supply and 1.8 V enable. A stable 0 to 180 degree phase-margin branch and valid output bias are functional requirements; gain, bandwidth and power have no fixed design-budget cutoff. Area target is the frozen reference functional footprint.\",\"status\":\"qualified\",\"summary\":\"Amplifies differential inputs with a 3.3 V rail-to-rail operational amplifier under the declared capacitive loads.\",\"title\":\"SKY130 3.3 V Rail-to-Rail Operational Amplifier\",\"published_runs\":0},{\"category\":\"Mixed-signal\",\"coefficient\":4,\"collection\":\"sky130_ef_ip__rdac3v_8bit\",\"family\":\"sky130_dac\",\"hours\":4,\"id\":\"sky130A.sky130_ef_ip__rdac3v_8bit.rdac3v_8bit\",\"pdk\":\"sky130A\",\"rationale\":\"The 10000 um2 footprint rewards a compact resistor array and decoder/buffer interconnect. INL 40% and area 35% dominate; separate rising/falling full-scale delays each receive 10%, with 1 ns scales so parasitic delay is visible. The 0.15 LSB target is a precision goal, not a monotonicity cutoff. DC power carries 5% because fixed bias largely sets it.\",\"status\":\"qualified\",\"summary\":\"Converts all 256 digital codes to buffered analog voltages within the characterized reference interval.\",\"title\":\"SKY130 8-Bit Buffered Resistor DAC\",\"published_runs\":5},{\"category\":\"Mixed-signal\",\"coefficient\":4,\"collection\":\"sky130_ef_ip__samplehold\",\"family\":\"sky130_samplehold\",\"hours\":1.5,\"id\":\"sky130A.sky130_ef_ip__samplehold.samplehold\",\"pdk\":\"sky130A\",\"rationale\":\"The 3000 um2 footprint is a compact buffered-sampler goal. Area receives 50%; held-value error after input reversal receives 25%, tracking 15%, and reacquisition and power 5% each. Tracking and reacquisition approach the same equilibrium, so their repeated observation no longer doubles the main accuracy reward. Error targets refer to the declared sampling times and do not claim faster acquisition or additional corners.\",\"status\":\"qualified\",\"summary\":\"Tracks, holds and reacquires an analog input using a buffered sample-and-hold circuit.\",\"title\":\"SKY130 Buffered Sample and Hold\",\"published_runs\":5},{\"category\":\"Power \u0026 references\",\"coefficient\":2,\"collection\":\"sky130_ef_ip__simple_por\",\"family\":\"sky130_power_on_reset\",\"hours\":1.5,\"id\":\"sky130A.sky130_ef_ip__simple_por.simple_por\",\"pdk\":\"sky130A\",\"rationale\":\"The 1500 um2 area goal rewards compact placement of the startup network. Release timing remains centered on each ramp-specific source crossing: earlier release is not automatically better. A 100 us deviation scale makes parasitic shifts visible without imposing a timing tolerance. Area receives 45%, the two domain-release metrics 20% each, and startup energy rate 15%; both output domains remain functionally checked.\",\"status\":\"qualified\",\"summary\":\"Generates reset outputs during staggered dual-supply startup and releases them after the supply ramps.\",\"title\":\"SKY130 Dual-Supply Power-On Reset\",\"published_runs\":4}],\"evidenceAvailable\":true}]}]\nc:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n11:I[27201,[\"/ICLayout-Bench/_next/static/chunks/3gll1ekbrh320.js\"],\"IconMark\"]\n9:null\ne:[[\"$\",\"title\",\"0\",{\"children\":\"ICLayout-Bench | Circuit layout intelligence\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Independent evaluation of AI for integrated circuit layout. Compare model scores, explore circuit performance and inspect generated layouts.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/ICLayout-Bench/brand/iclayout-bench.svg\",\"type\":\"image/svg+xml\",\"sizes\":\"any\"}],[\"$\",\"$L11\",\"3\",{}]]\n"])</script></body></html>
