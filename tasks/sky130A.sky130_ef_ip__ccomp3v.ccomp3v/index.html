efined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L5\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[\"$L6\",[[\"$\",\"script\",\"script-0\",{\"src\":\"/ICLayout-Bench/_next/static/chunks/27jip_2vcvnd5.js\",\"async\":true,\"nonce\":\"$undefined\"}]],[\"$\",\"$L7\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.MetadataOutlet\",\"children\":\"$@9\"}]}]]}],{},null,false,null]},null,false,\"$a\"]},null,false,null],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Lb\",null,{\"children\":\"$Lc\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Ld\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.Metadata\",\"children\":\"$Le\"}]}]}],null]}],false]],\"m\":\"$undefined\",\"G\":[\"$f\",[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/ICLayout-Bench/_next/static/chunks/3sa54_ghi1h2h.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]]],\"S\":true,\"h\":null,\"r\":\"$undefined\",\"s\":\"$undefined\",\"a\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"2hqB741EA4j7xWQVg6hu-\"}\n10:I[1186,[\"/ICLayout-Bench/_next/static/chunks/2h60meymns2z5.js\",\"/ICLayout-Bench/_next/static/chunks/27jip_2vcvnd5.js\"],\"default\"]\na:C\n11:T2aa9,\u003ch1 id=\"problem-sky130-continuous-comparator-with-complementary-input-load-layout-task\"\u003eSKY130 Continuous Comparator with Complementary Input Load Layout Task\u003c/h1\u003e\n\u003ch2 id=\"problem-objective\"\u003eObjective\u003c/h2\u003e\n\u003cp\u003eImplement \u003ccode\u003esky130_ef_ip__ccomp3v_cl\u003c/code\u003e from the supplied transistor-level circuit, preserving topology, fixed device parameters, four-terminal body connections and the ordered interface. Submit a candidate GDS for electrical evaluation of its distributed RC extraction.\u003c/p\u003e\n\u003ch3 id=\"problem-optimization-objective\"\u003eOptimization objective\u003c/h3\u003e\n\u003cp\u003eMaximize the declared quality score within the solve budget while satisfying all physical and necessary functional requirements. The first passing DRC, LVS and required electrical checks establish a feasible baseline. Continue improving the scored metrics from that baseline; a passing check or \u003ccode\u003etask_success = true\u003c/code\u003e does not mean that the quality objectives have been achieved.\u003c/p\u003e\n\u003ch2 id=\"problem-inputs-and-interface\"\u003eInputs and Interface\u003c/h2\u003e\n\u003cp\u003eOrdered ports are \u003ccode\u003eVOUT DVDD DVSS VDD VSS VINP VINM CLOAD ENA\u003c/code\u003e. Declared inputs include \u003ccode\u003eproblem.md\u003c/code\u003e, \u003ccode\u003ematerials/circuit.spice\u003c/code\u003e and \u003ccode\u003ematerials/testbench.spice\u003c/code\u003e. The runtime provides models and process resources; reference layouts, author code and qualification evidence are maintainer-only materials.\u003c/p\u003e\n\u003ch2 id=\"problem-operating-conditions\"\u003eOperating Conditions\u003c/h2\u003e\n\u003cp\u003eUse the synchronized _cl circuit/layout variant from the source. Analog supply is 3.3 V, digital supply and enable 1.8 V, output load 1 pF. Input common modes are 0.5, 1.65, 2.8 V, with CLOAD connected to the same common mode. DC differential-input measurement first sweeps -50 to +50 mV in 0.25 mV steps to locate the first rising output crossing at 0.9 V, then independently resets and scans +/-0.5 mV around that crossing in 1 uV steps; transient uses ±20 mV overdrive and 2 ns edges. Measure switching point, rising/falling delay and logic levels separately. All electrical experiments use fixed TT models at 27 °C; delivered testbenches define interpolation, edges, loads, sweeps, observation times and power intervals.\u003c/p\u003e\n\u003ch2 id=\"problem-physical-requirements\"\u003ePhysical Requirements\u003c/h2\u003e\n\u003cp\u003eSubmit a nonempty GDS no larger than 10485760 bytes, with top cell \u003ccode\u003esky130_ef_ip__ccomp3v_cl\u003c/code\u003e. Functional geometry must fit within the 120 × 120 um envelope on the declared layer set. Pass complete Magic DRC without waivers and independent Netgen LVS checking named ports, models, dimensions, multiplicities and body/contact connections. After physical and geometric checks pass, extract the candidate's distributed interconnect resistance, capacitance and devices, then run every declared experiment.\u003c/p\u003e\n\u003ch2 id=\"problem-electrical-requirements-and-scoring\"\u003eElectrical Requirements and Scoring\u003c/h2\u003e\n\u003cp\u003eArtifact, geometry, DRC, LVS and declared functional requirements must pass. Parasitic extraction is also mandatory: it must produce a complete, electrically consistent netlist usable by the required post-layout simulations. A completed candidate rejection scores zero; infrastructure errors do not establish candidate failure.\u003c/p\u003e\n\u003cp\u003eAt all three common modes, high levels must be 1.6–1.9 V and low levels -0.1–0.2 V; required crossings in both directions must exist. Switching-point preservation and propagation delay are scored continuously; power is diagnostic. Power and absolute errors must be nonnegative; all required measurements must be complete, finite and in correct units.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eFunctional requirement or measurement domain\u003c/th\u003e\n\u003cth\u003eAggregation\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eScore weight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eNo fixed performance bound\u003c/td\u003e\n\u003ctd\u003emax\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e20%\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003etrip_voltage\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eNo fixed performance bound\u003c/td\u003e\n\u003ctd\u003emax\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e20%\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003erise_delay\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e0 … +∞ s\u003c/td\u003e\n\u003ctd\u003emax\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e30%\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efall_delay\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e0 … +∞ s\u003c/td\u003e\n\u003ctd\u003emax\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e30%\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003esupply_power\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e0 … +∞ W\u003c/td\u003e\n\u003ctd\u003emax\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0%\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ehigh_level\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e1.6 … 1.9 V\u003c/td\u003e\n\u003ctd\u003emax\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0%\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003elow_level\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e-0.1 … 0.2 V\u003c/td\u003e\n\u003ctd\u003emax\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0%\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003ePair every electrical observation with the independent source-netlist observation under the same conditions, then take the worst paired quality for each metric. Switching-point preservation uses \u003ccode\u003eq=1/(1+abs(x-b)/100 uV)\u003c/code\u003e. Rising and falling delay use \u003ccode\u003eq=10 ns/(10 ns+max(0,x-b))\u003c/code\u003e, with candidate observation \u003ccode\u003ex\u003c/code\u003e and paired source observation \u003ccode\u003eb\u003c/code\u003e. Each factor is capped at 1. Zero-weight observations still undergo measurement and functional checks.\u003c/p\u003e\n\u003cp\u003eArea quality is \u003ccode\u003e4542.708625 um² / candidate functional area\u003c/code\u003e; the area target is the original reference layout's functional-footprint soft target, and a separate envelope constraint controls functional bounds. Total score is \u003ccode\u003e100 × product(min(1, q_i)^w_i)\u003c/code\u003e, using the contract's \u003ccode\u003elayout\u003c/code\u003e method and declared weights. Source-equivalent performance at target area scores 100, and each metric is capped at quality 1, so scores cannot exceed 100. Physical or functional invalidity scores zero; missing or unusable measurements make the score unknown. Capability coefficient \u003ccode\u003e3\u003c/code\u003e is independent of this quality score.\u003c/p\u003e\n\u003cp\u003eRising and falling decision-delay preservation carry 30% each, switching-point preservation 20% and area 20%. The 10 ns additional-delay budget uses degradation normalization instead of dividing the loss by the intrinsic decision delay. The 100 uV switching-point scale is 0.5% of the 20 mV overdrive and is well above the verified DC search resolution. Every metric uses its worst same-condition source pair across the three common modes. Supply power remains diagnostic; targets are continuous quality objectives, not functional cutoffs.\u003c/p\u003e\n\u003ch2 id=\"problem-tools-and-submission\"\u003eTools and Submission\u003c/h2\u003e\n\u003cp\u003eSoft solve budget: \u003cstrong\u003e3 hours\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eRead \u003ccode\u003e/protocol/task.json\u003c/code\u003e for input/output paths, constraints and the \u003ccode\u003eresources\u003c/code\u003e object; \u003ccode\u003e/protocol/harness.json\u003c/code\u003e describes the active check and submission interface.\u003c/p\u003e\n\u003cp\u003eUse the task information, tools and SKY130 resources provided by the runtime protocol. Write only the final GDS to \u003ccode\u003eoutput/final.gds\u003c/code\u003e and explicitly submit through the declared interface. Source simulation serves characterization; accepted results come from complete physical and RC electrical evaluation of the candidate GDS. Conclusions cover only the declared conditions, excluding PVT, mismatch, reliability and product signoff.\u003c/p\u003e\n\u003ch3 id=\"problem-solve-workflow\"\u003eSolve workflow\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eRead the declared circuit and materials, \u003ccode\u003e/protocol/task.json\u003c/code\u003e for paths, constraints and reviewed resources, and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e for capabilities and helper commands. Task inputs under \u003ccode\u003e/task\u003c/code\u003e and resources under \u003ccode\u003e/resources\u003c/code\u003e are read-only; construct the layout in \u003ccode\u003e/workspace\u003c/code\u003e with the declared tools. With layout MCP, paths and commands refer to the remote EDA workspace. Create your own implementation with real devices, interconnect and pins, using your own tool loop without delegating to other agents; reference layouts and author code are not solver inputs.\u003c/li\u003e\n\u003cli\u003eInspect \u003ccode\u003eresources.external\u003c/code\u003e before using external tools. Each command starts a fresh shell: when tool modules are declared, source \u003ccode\u003e/usr/share/Modules/init/bash\u003c/code\u003e and load the selected tool's modules; export its declared \u003ccode\u003etool_environment\u003c/code\u003e settings in that same command. Repeat as needed and use batch or headless operation. Local manuals, command references, and release notes may be available within the declared EDA installation and PDK resource directories. Locate these resources through \u003ccode\u003e/protocol/task.json\u003c/code\u003e and consult the documentation for the installed tool version when diagnosing unfamiliar syntax or tool failures.\u003c/li\u003e\n\u003cli\u003eGenerate an initial candidate and submit a snapshot early. When \u003ccode\u003eprocess-feedback\u003c/code\u003e is available, check the current GDS with layout MCP \u003ccode\u003echeck\u003c/code\u003e or \u003ccode\u003epython -I /protocol/process_check.py\u003c/code\u003e before the final submission. This runs the final evaluator's complete plan and returns engineering diagnostics and candidate measurements, without scores or normalized quality factors. Checks have no count limit and consume the same wall-clock budget. Inspect the physical and functional results and all scored metrics; successful tool execution alone does not establish requirement satisfaction. Read paginated diagnostics with \u003ccode\u003ereport\u003c/code\u003e when using MCP. Local exploratory checks do not replace this complete check.\u003c/li\u003e\n\u003cli\u003eUse the remaining time for measured improvements to the declared quality objectives. Identify the limiting scored metrics, make targeted layout changes, regenerate and check the candidate, and compare measurements with the previous candidate and the stated scoring targets and trade-offs. Preserve the best valid candidate and revert changes that worsen the overall objective. Repeat while time and useful improvements remain; passing validity checks alone is not a stopping condition.\u003c/li\u003e\n\u003cli\u003eStop optimization when the budget expires, all declared quality objectives are achieved, or measured trials support convergence. If stopping early, explain the changes tried, the metric comparisons and the remaining limitations. Track remaining time through session status. At soft-budget expiry, finish or cancel already-started work and submit immediately; do not start another command, check or optimization round. If an MCP execution is running, use \u003ccode\u003epoll\u003c/code\u003e with its \u003ccode\u003eexecution_id\u003c/code\u003e and the returned \u003ccode\u003enext_offset\u003c/code\u003e as \u003ccode\u003eoffset\u003c/code\u003e until completion, or cancel it and wait for it to stop.\u003c/li\u003e\n\u003cli\u003eFinish or cancel outstanding work, restore your best candidate to the declared output path, and explicitly submit it before ending the session. With layout MCP \u003ccode\u003esubmit\u003c/code\u003e, remove the \u003ccode\u003e/workspace/\u003c/code\u003e prefix from \u003ccode\u003eoutput.path\u003c/code\u003e; with the container interface, run \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e. Wait for the receipt: only the last accepted snapshot is judged, and writing a file alone is not submission. Acceptance confirms delivery; the framework independently evaluates validity and quality after the session.\u003c/li\u003e\n\u003c/ol\u003e\n12:Td8a,\u003cp\u003eArtifact, geometry, DRC, LVS and declared functional requirements must pass. Parasitic extraction is also mandatory: it must produce a complete, electrically consistent netlist usable by the required post-layout simulations. A completed candidate rejection scores zero; infrastructure errors do not establish candidate failure.\u003c/p\u003e\n\u003cp\u003eAt all three common modes, high levels must be 1.6–1.9 V and low levels -0.1–0.2 V; required crossings in both directions must exist. Switching-point preservation and propagation delay are scored continuously; power is diagnostic. Power and absolute errors must be nonnegative; all required measurements must be complete, finite and in correct units.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eFunctional requirement or measurement domain\u003c/th\u003e\n\u003cth\u003eAggregation\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eScore weight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eNo fixed performance bound\u003c/td\u003e\n\u003ctd\u003emax\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e20%\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003etrip_voltage\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eNo fixed performance bound\u003c/td\u003e\n\u003ctd\u003emax\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e20%\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003erise_delay\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e0 … +∞ s\u003c/td\u003e\n\u003ctd\u003emax\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e30%\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efall_delay\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e0 … +∞ s\u003c/td\u003e\n\u003ctd\u003emax\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e30%\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003esupply_power\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e0 … +∞ W\u003c/td\u003e\n\u003ctd\u003emax\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0%\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ehigh_level\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e1.6 … 1.9 V\u003c/td\u003e\n\u003ctd\u003emax\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0%\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003elow_level\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e-0.1 … 0.2 V\u003c/td\u003e\n\u003ctd\u003emax\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0%\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003ePair every electrical observation with the independent source-netlist observation under the same conditions, then take the worst paired quality for each metric. Switching-point preservation uses \u003ccode\u003eq=1/(1+abs(x-b)/100 uV)\u003c/code\u003e. Rising and falling delay use \u003ccode\u003eq=10 ns/(10 ns+max(0,x-b))\u003c/code\u003e, with candidate observation \u003ccode\u003ex\u003c/code\u003e and paired source observation \u003ccode\u003eb\u003c/code\u003e. Each factor is capped at 1. Zero-weight observations still undergo measurement and functional checks.\u003c/p\u003e\n\u003cp\u003eArea quality is \u003ccode\u003e4542.708625 um² / candidate functional area\u003c/code\u003e; the area target is the original reference layout's functional-footprint soft target, and a separate envelope constraint controls functional bounds. Total score is \u003ccode\u003e100 × product(min(1, q_i)^w_i)\u003c/code\u003e, using the contract's \u003ccode\u003elayout\u003c/code\u003e method and declared weights. Source-equivalent performance at target area scores 100, and each metric is capped at quality 1, so scores cannot exceed 100. Physical or functional invalidity scores zero; missing or unusable measurements make the score unknown. Capability coefficient \u003ccode\u003e3\u003c/code\u003e is independent of this quality score.\u003c/p\u003e\n\u003cp\u003eRising and falling decision-delay preservation carry 30% each, switching-point preservation 20% and area 20%. The 10 ns additional-delay budget uses degradation normalization instead of dividing the loss by the intrinsic decision delay. The 100 uV switching-point scale is 0.5% of the 20 mV overdrive and is well above the verified DC search resolution. Every metric uses its worst same-condition source pair across the three common modes. Supply power remains diagnostic; targets are continuous quality objectives, not functional cutoffs.\u003c/p\u003e\n13:T119f,\u003cp\u003eSoft solve budget: \u003cstrong\u003e3 hours\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eRead \u003ccode\u003e/protocol/task.json\u003c/code\u003e for input/output paths, constraints and the \u003ccode\u003eresources\u003c/code\u003e object; \u003ccode\u003e/protocol/harness.json\u003c/code\u003e describes the active check and submission interface.\u003c/p\u003e\n\u003cp\u003eUse the task information, tools and SKY130 resources provided by the runtime protocol. Write only the final GDS to \u003ccode\u003eoutput/final.gds\u003c/code\u003e and explicitly submit through the declared interface. Source simulation serves characterization; accepted results come from complete physical and RC electrical evaluation of the candidate GDS. Conclusions cover only the declared conditions, excluding PVT, mismatch, reliability and product signoff.\u003c/p\u003e\n\u003ch3\u003eSolve workflow\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eRead the declared circuit and materials, \u003ccode\u003e/protocol/task.json\u003c/code\u003e for paths, constraints and reviewed resources, and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e for capabilities and helper commands. Task inputs under \u003ccode\u003e/task\u003c/code\u003e and resources under \u003ccode\u003e/resources\u003c/code\u003e are read-only; construct the layout in \u003ccode\u003e/workspace\u003c/code\u003e with the declared tools. With layout MCP, paths and commands refer to the remote EDA workspace. Create your own implementation with real devices, interconnect and pins, using your own tool loop without delegating to other agents; reference layouts and author code are not solver inputs.\u003c/li\u003e\n\u003cli\u003eInspect \u003ccode\u003eresources.external\u003c/code\u003e before using external tools. Each command starts a fresh shell: when tool modules are declared, source \u003ccode\u003e/usr/share/Modules/init/bash\u003c/code\u003e and load the selected tool's modules; export its declared \u003ccode\u003etool_environment\u003c/code\u003e settings in that same command. Repeat as needed and use batch or headless operation. Local manuals, command references, and release notes may be available within the declared EDA installation and PDK resource directories. Locate these resources through \u003ccode\u003e/protocol/task.json\u003c/code\u003e and consult the documentation for the installed tool version when diagnosing unfamiliar syntax or tool failures.\u003c/li\u003e\n\u003cli\u003eGenerate an initial candidate and submit a snapshot early. When \u003ccode\u003eprocess-feedback\u003c/code\u003e is available, check the current GDS with layout MCP \u003ccode\u003echeck\u003c/code\u003e or \u003ccode\u003epython -I /protocol/process_check.py\u003c/code\u003e before the final submission. This runs the final evaluator's complete plan and returns engineering diagnostics and candidate measurements, without scores or normalized quality factors. Checks have no count limit and consume the same wall-clock budget. Inspect the physical and functional results and all scored metrics; successful tool execution alone does not establish requirement satisfaction. Read paginated diagnostics with \u003ccode\u003ereport\u003c/code\u003e when using MCP. Local exploratory checks do not replace this complete check.\u003c/li\u003e\n\u003cli\u003eUse the remaining time for measured improvements to the declared quality objectives. Identify the limiting scored metrics, make targeted layout changes, regenerate and check the candidate, and compare measurements with the previous candidate and the stated scoring targets and trade-offs. Preserve the best valid candidate and revert changes that worsen the overall objective. Repeat while time and useful improvements remain; passing validity checks alone is not a stopping condition.\u003c/li\u003e\n\u003cli\u003eStop optimization when the budget expires, all declared quality objectives are achieved, or measured trials support convergence. If stopping early, explain the changes tried, the metric comparisons and the remaining limitations. Track remaining time through session status. At soft-budget expiry, finish or cancel already-started work and submit immediately; do not start another command, check or optimization round. If an MCP execution is running, use \u0 bias must stay in its specified operating or logic-level interval under the supplied rail, feedback or full-scale reference conditions; an out-of-range output violates that interface.\",\"upper\":0.2},\"unit\":\"V\"}],\"pdk\":\"sky130A\",\"reader\":{\"category\":\"Mixed-signal\",\"summary\":\"Compares differential inputs across three common-mode voltages with a complementary input load.\",\"title\":\"SKY130 Continuous Comparator with Complementary Input Load\"},\"scoring\":{\"area_metric\":\"functional_area\",\"area_target\":4542.708625,\"method\":\"layout\",\"rationale\":\"Rising and falling decision-delay preservation carry 30% each, switching-point preservation 20% and area 20%. The 10 ns additional-delay budget uses degradation normalization instead of dividing the loss by the intrinsic decision delay. The 100 uV switching-point scale is 0.5% of the 20 mV overdrive and is well above the verified DC search resolution. Every metric uses its worst same-condition source pair across the three common modes. Supply power remains diagnostic; targets are continuous quality objectives, not functional cutoffs.\",\"weights\":{\"fall_delay\":0.3,\"functional_area\":0.2,\"rise_delay\":0.3,\"supply_power\":0,\"trip_voltage\":0.2}},\"sections\":{\"Electrical Requirements and Scoring\":\"$12\",\"Inputs and Interface\":\"\u003cp\u003eOrdered ports are \u003ccode\u003eVOUT DVDD DVSS VDD VSS VINP VINM CLOAD ENA\u003c/code\u003e. Declared inputs include \u003ccode\u003eproblem.md\u003c/code\u003e, \u003ccode\u003ematerials/circuit.spice\u003c/code\u003e and \u003ccode\u003ematerials/testbench.spice\u003c/code\u003e. The runtime provides models and process resources; reference layouts, author code and qualification evidence are maintainer-only materials.\u003c/p\u003e\\n\",\"Objective\":\"\u003cp\u003eImplement \u003ccode\u003esky130_ef_ip__ccomp3v_cl\u003c/code\u003e from the supplied transistor-level circuit, preserving topology, fixed device parameters, four-terminal body connecti
