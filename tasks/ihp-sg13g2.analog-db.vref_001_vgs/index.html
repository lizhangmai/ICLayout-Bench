,\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L5\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[\"$L6\",[[\"$\",\"script\",\"script-0\",{\"src\":\"/ICLayout-Bench/_next/static/chunks/27jip_2vcvnd5.js\",\"async\":true,\"nonce\":\"$undefined\"}]],[\"$\",\"$L7\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.MetadataOutlet\",\"children\":\"$@9\"}]}]]}],{},null,false,null]},null,false,\"$a\"]},null,false,null],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Lb\",null,{\"children\":\"$Lc\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Ld\",null,{\"children\":[\"$\",\"$8\",null,{\"name\":\"Next.Metadata\",\"children\":\"$Le\"}]}]}],null]}],false]],\"m\":\"$undefined\",\"G\":[\"$f\",[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/ICLayout-Bench/_next/static/chunks/3sa54_ghi1h2h.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]]],\"S\":true,\"h\":null,\"r\":\"$undefined\",\"s\":\"$undefined\",\"a\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"2hqB741EA4j7xWQVg6hu-\"}\n10:I[1186,[\"/ICLayout-Bench/_next/static/chunks/2h60meymns2z5.js\",\"/ICLayout-Bench/_next/static/chunks/27jip_2vcvnd5.js\"],\"default\"]\na:C\n11:T4d3e,\u003ch1 id=\"problem-mixed-lvhv-vgs-reference-layout-task\"\u003eMixed LV/HV VGS Reference Layout Task\u003c/h1\u003e\n\u003ch2 id=\"problem-objective\"\u003eObjective\u003c/h2\u003e\n\u003cp\u003eImplement the two-transistor \u003ccode\u003evref_001_vgs\u003c/code\u003e reference with its original device\nsizes and connections. An upper LV NMOS has gate and source at VREF; a lower\nHV NMOS is diode-connected. The maintained function is a high-impedance,\napproximately 0.36 V reference for picoampere loads. It is not a bandgap,\nprecision reference, buffered supply or temperature sensor.\u003c/p\u003e\n\u003ch3 id=\"problem-optimization-objective\"\u003eOptimization objective\u003c/h3\u003e\n\u003cp\u003eMaximize the declared quality score within the solve budget while satisfying all physical and necessary functional requirements. The first passing DRC, LVS and required electrical checks establish a feasible baseline. Continue improving the scored metrics from that baseline; a passing check or \u003ccode\u003etask_success = true\u003c/code\u003e does not mean that the quality objectives have been achieved.\u003c/p\u003e\n\u003ch2 id=\"problem-inputs-and-interface\"\u003eInputs and Interface\u003c/h2\u003e\n\u003cp\u003eThe declared inputs are this description, \u003ccode\u003ematerials/circuit.cdl\u003c/code\u003e for native\nLVS, the equivalent \u003ccode\u003ematerials/circuit.spice\u003c/code\u003e, and \u003ccode\u003ematerials/testbench.spice\u003c/code\u003e.\nOrdered ports are \u003ccode\u003evdd vref vss\u003c/code\u003e: positive supply, reference output, and return.\nThe LV NMOS has W/L=2.5/2 um, D=VDD, G=S=VREF, B=VSS. The HV NMOS has\nW/L=1/2 um, D=G=VREF, S=B=VSS. Both multiplicities are one.\u003c/p\u003e\n\u003cp\u003eRetain the explicit 40 × 2 um marked substrate tap (A=80 um², P=84 um),\nwith both terminals on VSS. An unmarked substrate contact establishes that\nsame-net body boundary. Additional legal same-net contacts are permitted\nonly when native LVS and the declared checks pass. Do not replace the HV\ndevice with an LV device or change either gate/source connection. The source\nsimulator represents the marked tap with its finite 5.9756097561 ohm PDK\nequivalent; its two terminals are the same net. Parallel fingering is allowed\nonly if total dimensions, multiplicity, body mapping and all checks agree.\u003c/p\u003e\n\u003ch2 id=\"problem-operating-conditions\"\u003eOperating Conditions\u003c/h2\u003e\n\u003cp\u003eUse the pinned IHP typical LV/HV PSP models. Nine jobs combine VDD=1.0,\n1.2 and 1.5 V with temperatures −20, 27 and 85 °C. The only external\ncapacitance is 100 fF from VREF to VSS. No numerical \u003ccode\u003ershunt\u003c/code\u003e is added.\nUse \u003ccode\u003egmin=1e-16 S\u003c/code\u003e, \u003ccode\u003ereltol=1e-6\u003c/code\u003e, \u003ccode\u003eabstol=1e-18 A\u003c/code\u003e, \u003ccode\u003evntol=1e-10 V\u003c/code\u003e,\nGear order two and maximum transient step 1 us. These small currents require\nthe specified numerical conditioning; default simulator tolerances do not\nestablish this contract.\u003c/p\u003e\n\u003cp\u003eFor each job, the DC operating point has the declared supply and zero load.\nThe separate transient starts with VREF=0 and otherwise zero stored charge\n(\u003ccode\u003euic\u003c/code\u003e). VDD rises linearly from zero to its declared value over 100 us.\nThe run ends at 50 ms. ILOAD is positive when withdrawing current from VREF:\n0→+1 pA during 10–10.01 ms, +1→0 pA during 20–20.01 ms,\n0→−1 pA during 30–30.01 ms, and −1→0 pA during 40–40.01 ms.\nIt holds each value between edges. Negative load is an external current\ninjection, not on-chip power generation.\u003c/p\u003e\n\u003cp\u003eEach job also sweeps supply 1.0–1.5 V in 10 mV increments at its declared\ntemperature, load −1–+1 pA in 0.1 pA increments at its declared supply and\ntemperature, and temperature −20–85 °C in 5 °C increments at its declared\nsupply. DC sweeps have no time-varying stimulus; line and temperature sweeps\nuse zero load. All endpoints participate. These are finite sampled conditions,\nnot process-corner, mismatch or arbitrary temperature/load guarantees.\nThe DC load sweep uses a −1–+1 V external control in 0.1 V increments and\na 1 pA/V transconductance stimulus; it avoids a tiny-current sweep endpoint\ntolerance without changing the DUT or its actual −1–+1 pA load range.\u003c/p\u003e\n\u003ch2 id=\"problem-physical-requirements\"\u003ePhysical Requirements\u003c/h2\u003e\n\u003cp\u003eSubmit a GDSII with top cell \u003ccode\u003evref_001_vgs\u003c/code\u003e, at most 1 MiB. It must pass\nnative main/maximal SG13G2 DRC without waivers, strict named-port LVS, and a\n100 × 100 um functional outline. Density and antenna checks are outside\nthe declared standalone DRC scope. The footprint includes every device,\ncontact and routing drawing layer enumerated in the runtime constraints;\nannotation and pin-purpose layers cannot conceal functional geometry.\u003c/p\u003e\n\u003cp\u003eCandidate-derived Magic distributed RC must retain both LV/HV model calls,\ntheir dimensions and their actual junction/interconnect loading. Extraction\nidealizes well/substrate contacts and does not establish distributed substrate\nresistance or noise. Only Metal3 text layer 30/25 supplies extraction labels;\nnative DRC/LVS still inspect the complete original GDS and physical taps.\nThe external 100 fF load is additional to candidate capacitance.\u003c/p\u003e\n\u003ch2 id=\"problem-electrical-requirements-and-scoring\"\u003eElectrical Requirements and Scoring\u003c/h2\u003e\n\u003cp\u003eArtifact, geometry, DRC, LVS and declared functional requirements must pass. Parasitic extraction is also mandatory: it must produce a complete, electrically consistent netlist usable by the required post-layout simulations. A completed candidate rejection scores zero; infrastructure errors do not establish candidate failure.\u003c/p\u003e\n\u003cp\u003ePhysical checks and the declared functional bounds must pass. Quality scoring imposes no fixed degradation allowance. Each \u003ccode\u003esource_*\u003c/code\u003e job and its corresponding candidate extracted circuit use exactly the same testbench, model resources, parameters, loads and measurement windows. Independent source observations define the 100-point electrical baseline without depending on the submitted GDS; reports retain every paired result.\u003c/p\u003e\n\u003cp\u003eLet x be the post-layout measurement and b the source-circuit measurement under the same conditions:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eRatio normalization: maximize with q = x/b and minimize with q = b/x. When a numerical scale s is declared, use (x+s)/(b+s) and its reciprocal, respectively. The scale handles zero values as a normalization floor; it is neither an allowed degradation nor an acceptance bound.\u003c/li\u003e\n\u003cli\u003eAmplitude in dB: maximize with q = 10^((x-b)/20) and minimize with its reciprocal.\u003c/li\u003e\n\u003cli\u003eTarget normalization: q = 1/(1+abs(x-b)/s), where s is the declared physical scale. Signed or zero-valued operating points are not divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eUse \u003ccode\u003elayout\u003c/code\u003e scoring. Each metric takes its worst paired quality q, and the total score is S = 100 * product(min(1, q_i) ** w_i), with area quality q_area = area_reference / candidate_functional_area. The weights below sum to 1; metric dimensions describe measurements and do not determine weights. Physical, extraction, or functional rejection scores zero; other missing or invalid measurements leave the score unknown, and zero-weight observations must also be valid. Matching source-circuit performance at the reference area scores 100 points; each metric is capped at quality 1, so scores cannot exceed 100. Weights express quality tradeoffs rather than hard bounds.\u003c/p\u003e\n\u003cp\u003eThe measurements below use the supplied SPICE node and source names. \u003ccode\u003ev(n)\u003c/code\u003e is a node voltage; \u003ccode\u003ei(V)\u003c/code\u003e is current flowing into a voltage source, so delivered power uses a negative sign. \u003ccode\u003edb(z)=20*log10(abs(z))\u003c/code\u003e; \u003ccode\u003emag/abs\u003c/code\u003e denote magnitude, and \u003ccode\u003ecph\u003c/code\u003e denotes continuous phase in radians. \u003ccode\u003efind\u003c/code\u003e, \u003ccode\u003ewhen\u003c/code\u003e, \u003ccode\u003efrom/to\u003c/code\u003e and \u003ccode\u003erise/fall\u003c/code\u003e follow the deck's interpolation, window and crossing conventions. SPICE suffixes p/n/u/m/meg/g mean pico/nano/micro/milli/mega/giga. Nested \u003ccode\u003eavg\u003c/code\u003e, \u003ccode\u003emin\u003c/code\u003e, \u003ccode\u003emax\u003c/code\u003e, \u003ccode\u003evecmin/vecmax\u003c/code\u003e and \u003ccode\u003ederiv\u003c/code\u003e represent window averages, extrema and sampled derivatives. Measure each operating condition independently, pair it with the source result under that condition, and take the worst paired quality within each metric group.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003estartup_error_v\u003c/code\u003e, \u003ccode\u003eload_error_v\u003c/code\u003e, \u003ccode\u003erelease_error_v\u003c/code\u003e, \u003ccode\u003einjection_error_v\u003c/code\u003e, \u003ccode\u003ereturn_error_v\u003c/code\u003e, \u003ccode\u003eline_span_v\u003c/code\u003e, \u003ccode\u003etemperature_span_v\u003c/code\u003e use \u003ccode\u003esaturating_ratio\u003c/code\u003e: q = 2(b+s)/(b+x+2s), where x is candidate error, b is paired source error and s is the positive scale below. Source equivalence gives q=1; improvement approaches the upper limit 2 with diminishing returns. s retains the declared units and numeric-floor meaning; normalize each condition before taking the worst quality, and apply other rules as declared.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eDefinition / observation\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eQuality normalization\u003c/th\u003e\n\u003cth\u003eFunctional range\u003c/th\u003e\n\u003cth\u003eScale\u003c/th\u003e\n\u003cth\u003eDimension\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ereference_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eUnloaded DC VREF\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.5\u003c/td\u003e\n\u003ctd\u003e1.5\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003esupply_a\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eUnloaded DC −I(VDD)\u003c/td\u003e\n\u003ctd\u003eA\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eUnloaded DC −VDD·I(VDD)\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003ctd\u003esupply\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estartup_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMaximum absolute reference error, 8–9 ms\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eload_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eSame, 18–19 ms under +1 pA\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003erelease_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eSame, 28–29 ms\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003einjection_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eSame, 38–39 ms under −1 pA\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ereturn_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eSame, 48–49 ms\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eminimum_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMinimum VREF over the full 0–50 ms startup/load transient.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e1.5\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emaximum_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMaximum VREF over the full 0–50 ms startup/load transient.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.5\u003c/td\u003e\n\u003ctd\u003e1.5\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eline_min_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC sweep: \u003ccode\u003evecmin(v(vref))\u003c/code\u003e; sweep \u003ccode\u003eVDD 1.0 1.5 .01\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.5\u003c/td\u003e\n\u003ctd\u003e1.5\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eline_max_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC sweep: \u003ccode\u003evecmax(v(vref))\u003c/code\u003e; sweep \u003ccode\u003eVDD 1.0 1.5 .01\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.5\u003c/td\u003e\n\u003ctd\u003e1.5\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eline_span_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eSupply-sweep maximum minus minimum\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003etemperature_min_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC sweep: \u003ccode\u003evecmin(v(vref))\u003c/code\u003e; sweep \u003ccode\u003etemp -20 85 5\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.5\u003c/td\u003e\n\u003ctd\u003e1.5\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003etemperature_max_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC sweep: \u003ccode\u003evecmax(v(vref))\u003c/code\u003e; sweep \u003ccode\u003etemp -20 85 5\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.5\u003c/td\u003e\n\u003ctd\u003e1.5\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003etemperature_span_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTemperature-sweep maximum minus minimum\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_resistance_ohm\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e(Unloaded DC VREF − DC VREF at +1 pA)/1 pA\u003c/td\u003e\n\u003ctd\u003eohm\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eloaded_reference_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC VREF at +1 pA\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.5\u003c/td\u003e\n\u003ctd\u003e1.5\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eArea reference: \u003cstrong\u003e210.61 um2\u003c/strong\u003e. The expanded circuit has 3 device instances, a sum of device/contact envelopes 121.7863 um2, a one-sided envelope margin of 0.6 um, a routing allowance of 50%, and a total outer width/height allowance 1.2 um. Estimate = ceil(100 * (1.5 * envelope_sum + 2 * margin * sqrt(envelope_sum) + margin^2)) / 100. Here margin is the total allowance across both sides, and the envelope sum is displayed to four decimal places. MOS/passive envelopes use W/L (or resistor dimensions) and multiplicity, including explicit contacts and HBT emitter/contact envelopes. This is a frozen engineering estimate, not a process minimum or a proven achievable area.\u003c/p\u003e\n\u003cp\u003eThe capability coefficient is \u003cstrong\u003e5\u003c/strong\u003e, independent of this task's reference-normalized score.\u003c/p\u003e\n\u003ch3 id=\"problem-score-weights\"\u003eScore weights\u003c/h3\u003e\n\u003cp\u003eVGS reference: line and temperature drift 31.5%; load regulation 22.5%; startup and disturbance recovery 18%; reference and extrema 9%; supply cost 9%; area 10%. Each objective's weight is divided equally among its metrics.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003efunctional_area\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eline_span_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.157500000001\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003etemperature_span_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.157500000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eload_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.056250000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eloaded_reference_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.056250000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_resistance_ohm\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.056250000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003erelease_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.056250000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003einjection_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.060000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ereturn_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.060000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estartup_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.060000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eline_max_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.012857142857\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eline_min_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.012857142857\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emaximum_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.012857142857\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eminimum_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.012857142857\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ereference_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.012857142857\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003etemperature_max_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.012857142857\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003etemperature_min_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.012857142857\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003esupply_a\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch2 id=\"problem-tools-and-submission\"\u003eTools and Submission\u003c/h2\u003e\n\u003cp\u003eSoft solve budget: \u003cstrong\u003e3 hours\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eRead \u003ccode\u003e/protocol/task.json\u003c/code\u003e for input/output paths, constraints and the \u003ccode\u003eresources\u003c/code\u003e object; \u003ccode\u003e/protocol/harness.json\u003c/code\u003e describes the active check and submission interface.\u003c/p\u003e\n\u003cp\u003eUse the supplied task, process resources and runtime protocol. Write\n\u003ccode\u003e/workspace/output/final.gds\u003c/code\u003e and submit it through \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e.\nThe evaluator independently checks the frozen submitted GDS. Collection\nlicenses, reference layouts, research files and host configuration are not\nsolver inputs.\u003c/p\u003e\n\u003ch3 id=\"problem-solve-workflow\"\u003eSolve workflow\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eRead the declared circuit and materials, \u003ccode\u003e/protocol/task.json\u003c/code\u003e for paths, constraints and reviewed resources, and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e for capabilities and helper commands. Task inputs under \u003ccode\u003e/task\u003c/code\u003e and resources under \u003ccode\u003e/resources\u003c/code\u003e are read-only; construct the layout in \u003ccode\u003e/workspace\u003c/code\u003e with the declared tools. With layout MCP, paths and commands refer to the remote EDA workspace. Create your own implementation with real devices, interconnect and pins, using your own tool loop without delegating to other agents; reference layouts and author code are not solver inputs.\u003c/li\u003e\n\u003cli\u003eInspect \u003ccode\u003eresources.external\u003c/code\u003e before using external tools. Each command starts a fresh shell: when tool modules are declared, source \u003ccode\u003e/usr/share/Modules/init/bash\u003c/code\u003e and load the selected tool's modules; export its declared \u003ccode\u003etool_environment\u003c/code\u003e settings in that same command. Repeat as needed and use batch or headless operation. Local manuals, command references, and release notes may be available within the declared EDA installation and PDK resource directories. Locate these resources through \u003ccode\u003e/protocol/task.json\u003c/code\u003e and consult the documentation for the installed tool version when diagnosing unfamiliar syntax or tool failures.\u003c/li\u003e\n\u003cli\u003eGenerate an initial candidate and submit a snapshot early. When \u003ccode\u003eprocess-feedback\u003c/code\u003e is available, check the current GDS with layout MCP \u003ccode\u003echeck\u003c/code\u003e or \u003ccode\u003epython -I /protocol/process_check.py\u003c/code\u003e before the final submission. This runs the final evaluator's complete plan and returns engineering diagnostics and candidate measurements, without scores or normalized quality factors. Checks have no count limit and consume the same wall-clock budget. Inspect the physical and functional results and all scored metrics; successful tool execution alone does not establish requirement satisfaction. Read paginated diagnostics with \u003ccode\u003ereport\u003c/code\u003e when using MCP. Local exploratory checks do not replace this complete check.\u003c/li\u003e\n\u003cli\u003eUse the remaining time for measured improvements to the declared quality objectives. Identify the limiting scored metrics, make targeted layout changes, regenerate and check the candidate, and compare measurements with the previous candidate and the stated scoring targets and trade-offs. Preserve the best valid candidate and revert changes that worsen the overall objective. Repeat while time and useful improvements remain; passing validity checks alone is not a stopping condition.\u003c/li\u003e\n\u003cli\u003eStop optimization when the budget expires, all declared quality objectives are achieved, or measured trials support convergence. If stopping early, explain the changes tried, the metric comparisons and the remaining limitations. Track remaining time through session status. At soft-budget expiry, finish or cancel already-started work and submit immediately; do not start another command, check or optimization round. If an MCP execution is running, use \u003ccode\u003epoll\u003c/code\u003e with its \u003ccode\u003eexecution_id\u003c/code\u003e and the returned \u003ccode\u003enext_offset\u003c/code\u003e as \u003ccode\u003eoffset\u003c/code\u003e until completion, or cancel it and wait for it to stop.\u003c/li\u003e\n\u003cli\u003eFinish or cancel outstanding work, restore your best candidate to the declared output path, and explicitly submit it before ending the session. With layout MCP \u003ccode\u003esubmit\u003c/code\u003e, remove the \u003ccode\u003e/workspace/\u003c/code\u003e prefix from \u003ccode\u003eoutput.path\u003c/code\u003e; with the container interface, run \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e. Wait for the receipt: only the last accepted snapshot is judged, and writing a file alone is not submission. Acceptance confirms delivery; the framework independently evaluates validity and quality after the session.\u003c/li\u003e\n\u003c/ol\u003e\n12:T280e,\u003cp\u003eArtifact, geometry, DRC, LVS and declared functional requirements must pass. Parasitic extraction is also mandatory: it must produce a complete, electrically consistent netlist usable by the required post-layout simulations. A completed candidate rejection scores zero; infrastructure errors do not establish candidate failure.\u003c/p\u003e\n\u003cp\u003ePhysical checks and the declared functional bounds must pass. Quality scoring imposes no fixed degradation allowance. Each \u003ccode\u003esource_*\u003c/code\u003e job and its corresponding candidate extracted circuit use exactly the same testbench, model resources, parameters, loads and measurement windows. Independent source observations define the 100-point electrical baseline without depending on the submitted GDS; reports retain every paired result.\u003c/p\u003e\n\u003cp\u003eLet x be the post-layout measurement and b the source-circuit measurement under the same conditions:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eRatio normalization: maximize with q = x/b and minimize with q = b/x. When a numerical scale s is declared, use (x+s)/(b+s) and its reciprocal, respectively. The scale handles zero values as a normalization floor; it is neither an allowed degradation nor an acceptance bound.\u003c/li\u003e\n\u003cli\u003eAmplitude in dB: maximize with q = 10^((x-b)/20) and minimize with its reciprocal.\u003c/li\u003e\n\u003cli\u003eTarget normalization: q = 1/(1+abs(x-b)/s), where s is the declared physical scale. Signed or zero-valued operating points are not divided directly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eUse \u003ccode\u003elayout\u003c/code\u003e scoring. Each metric takes its worst paired quality q, and the total score is S = 100 * product(min(1, q_i) ** w_i), with area quality q_area = area_reference / candidate_functional_area. The weights below sum to 1; metric dimensions describe measurements and do not determine weights. Physical, extraction, or functional rejection scores zero; other missing or invalid measurements leave the score unknown, and zero-weight observations must also be valid. Matching source-circuit performance at the reference area scores 100 points; each metric is capped at quality 1, so scores cannot exceed 100. Weights express quality tradeoffs rather than hard bounds.\u003c/p\u003e\n\u003cp\u003eThe measurements below use the supplied SPICE node and source names. \u003ccode\u003ev(n)\u003c/code\u003e is a node voltage; \u003ccode\u003ei(V)\u003c/code\u003e is current flowing into a voltage source, so delivered power uses a negative sign. \u003ccode\u003edb(z)=20*log10(abs(z))\u003c/code\u003e; \u003ccode\u003emag/abs\u003c/code\u003e denote magnitude, and \u003ccode\u003ecph\u003c/code\u003e denotes continuous phase in radians. \u003ccode\u003efind\u003c/code\u003e, \u003ccode\u003ewhen\u003c/code\u003e, \u003ccode\u003efrom/to\u003c/code\u003e and \u003ccode\u003erise/fall\u003c/code\u003e follow the deck's interpolation, window and crossing conventions. SPICE suffixes p/n/u/m/meg/g mean pico/nano/micro/milli/mega/giga. Nested \u003ccode\u003eavg\u003c/code\u003e, \u003ccode\u003emin\u003c/code\u003e, \u003ccode\u003emax\u003c/code\u003e, \u003ccode\u003evecmin/vecmax\u003c/code\u003e and \u003ccode\u003ederiv\u003c/code\u003e represent window averages, extrema and sampled derivatives. Measure each operating condition independently, pair it with the source result under that condition, and take the worst paired quality within each metric group.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003estartup_error_v\u003c/code\u003e, \u003ccode\u003eload_error_v\u003c/code\u003e, \u003ccode\u003erelease_error_v\u003c/code\u003e, \u003ccode\u003einjection_error_v\u003c/code\u003e, \u003ccode\u003ereturn_error_v\u003c/code\u003e, \u003ccode\u003eline_span_v\u003c/code\u003e, \u003ccode\u003etemperature_span_v\u003c/code\u003e use \u003ccode\u003esaturating_ratio\u003c/code\u003e: q = 2(b+s)/(b+x+2s), where x is candidate error, b is paired source error and s is the positive scale below. Source equivalence gives q=1; improvement approaches the upper limit 2 with diminishing returns. s retains the declared units and numeric-floor meaning; normalize each condition before taking the worst quality, and apply other rules as declared.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth\u003eDefinition / observation\u003c/th\u003e\n\u003cth\u003eUnit\u003c/th\u003e\n\u003cth\u003eQuality normalization\u003c/th\u003e\n\u003cth\u003eFunctional range\u003c/th\u003e\n\u003cth\u003eScale\u003c/th\u003e\n\u003cth\u003eDimension\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ereference_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eUnloaded DC VREF\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.5\u003c/td\u003e\n\u003ctd\u003e1.5\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003esupply_a\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eUnloaded DC −I(VDD)\u003c/td\u003e\n\u003ctd\u003eA\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eUnloaded DC −VDD·I(VDD)\u003c/td\u003e\n\u003ctd\u003eW\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-12\u003c/td\u003e\n\u003ctd\u003esupply\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003estartup_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMaximum absolute reference error, 8–9 ms\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eload_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eSame, 18–19 ms under +1 pA\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003erelease_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eSame, 28–29 ms\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003einjection_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eSame, 38–39 ms under −1 pA\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ereturn_error_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eSame, 48–49 ms\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eminimum_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMinimum VREF over the full 0–50 ms startup/load transient.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e−∞ … +∞\u003c/td\u003e\n\u003ctd\u003e1.5\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emaximum_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMaximum VREF over the full 0–50 ms startup/load transient.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.5\u003c/td\u003e\n\u003ctd\u003e1.5\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eline_min_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC sweep: \u003ccode\u003evecmin(v(vref))\u003c/code\u003e; sweep \u003ccode\u003eVDD 1.0 1.5 .01\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.5\u003c/td\u003e\n\u003ctd\u003e1.5\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eline_max_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC sweep: \u003ccode\u003evecmax(v(vref))\u003c/code\u003e; sweep \u003ccode\u003eVDD 1.0 1.5 .01\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.5\u003c/td\u003e\n\u003ctd\u003e1.5\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eline_span_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eSupply-sweep maximum minus minimum\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003etemperature_min_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC sweep: \u003ccode\u003evecmin(v(vref))\u003c/code\u003e; sweep \u003ccode\u003etemp -20 85 5\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.5\u003c/td\u003e\n\u003ctd\u003e1.5\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003etemperature_max_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC sweep: \u003ccode\u003evecmax(v(vref))\u003c/code\u003e; sweep \u003ccode\u003etemp -20 85 5\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.5\u003c/td\u003e\n\u003ctd\u003e1.5\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003etemperature_span_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTemperature-sweep maximum minus minimum\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003eminimize / saturating_ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eoutput_resistance_ohm\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e(Unloaded DC VREF − DC VREF at +1 pA)/1 pA\u003c/td\u003e\n\u003ctd\u003eohm\u003c/td\u003e\n\u003ctd\u003eminimize / ratio\u003c/td\u003e\n\u003ctd\u003e0 … +∞\u003c/td\u003e\n\u003ctd\u003e1e-06\u003c/td\u003e\n\u003ctd\u003eresponse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eloaded_reference_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eDC VREF at +1 pA\u003c/td\u003e\n\u003ctd\u003eV\u003c/td\u003e\n\u003ctd\u003etarget / target\u003c/td\u003e\n\u003ctd\u003e0 … 1.5\u003c/td\u003e\n\u003ctd\u003e1.5\u003c/td\u003e\n\u003ctd\u003ebias\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eArea reference: \u003cstrong\u003e210.61 um2\u003c/strong\u003e. The expanded circuit has 3 device instances, a sum of device/contact envelopes 121.7863 um2, a one-sided envelope margin of 0.6 um, a routing allowance of 50%, and a total outer width/height allowance 1.2 um. Estimate = ceil(100 * (1.5 * envelope_sum + 2 * margin * sqrt(envelope_sum) + margin^2)) / 100. Here margin is the total allowance across both sides, and the envelope sum is displayed to four decimal places. MOS/passive envelopes use W/L (or resistor dimensions) and multiplicity, including explicit contacts and HBT emitter/contact envelopes. This is a frozen engineering estimate, not a process minimum or a proven achievable area.\u003c/p\u003e\n\u003cp\u003eThe capability coefficient is \u003cstrong\u003e5\u003c/strong\u003e, independent of this task's reference-normalized score.\u003c/p\u003e\n\u003ch3\u003eScore weights\u003c/h3\u003e\n\u003cp\u003eVGS reference: line and temperature drift 31.5%; load regulation 22.5%; startup and disturbance recovery 18%; reference and extrema 9%; supply cost 9%; area 10%. Each objective's weight is divided equally among its metrics.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMetric\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003eWeight\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u0 \n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eline_min_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.012857142857\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emaximum_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.012857142857\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eminimum_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.012857142857\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ereference_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.012857142857\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003etemperature_max_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.012857142857\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003etemperature_min_v\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.012857142857\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epower_w\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003esupply_a\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e0.045000000000\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n13:T6fd,\u003cp\u003eUse the pinned IHP typical LV/HV PSP models. Nine jobs combine VDD=1.0,\n1.2 and 1.5 V with temperatures −20, 27 and 85 °C. The only external\ncapacitance is 100 fF from VREF to VSS. No numerical \u003ccode\u003ershunt\u003c/code\u003e is added.\nUse \u003ccode\u003egmin=1e-16 S\u003c/code\u003e, \u003ccode\u003ereltol=1e-6\u003c/code\u003e, \u003ccode\u003eabstol=1e-18 A\u003c/code\u003e, \u003ccode\u003evntol=1e-10 V\u003c/code\u003e,\nGear order two and maximum transient step 1 us. These small currents require\nthe specified numerical conditioning; default simulator tolerances do not\nestablish this contract.\u003c/p\u003e\n\u003cp\u003eFor each job, the DC operating point has the declared supply and zero load.\nThe separate transient starts with VREF=0 and otherwise zero stored charge\n(\u003ccode\u003euic\u003c/code\u003e). VDD rises linearly from zero to its declared value over 100 us.\nThe run ends at 50 ms. ILOAD is positive when withdrawing current from VREF:\n0→+1 pA during 10–10.01 ms, +1→0 pA during 20–20.01 ms,\n0→−1 pA during 30–30.01 ms, and −1→0 pA during 40–40.01 ms.\nIt holds each value between edges. Negative load is an external current\ninjection, not on-chip power generation.\u003c/p\u003e\n\u003cp\u003eEach job also sweeps supply 1.0–1.5 V in 10 mV increments at its declared\ntemperature, load −1–+1 pA in 0.1 pA increments at its declared supply and\ntemperature, and temperature −20–85 °C in 5 °C increments at its declared\nsupply. DC sweeps have no time-varying stimulus; line and temperature sweeps\nuse zero load. All endpoints participate. These are finite sampled conditions,\nnot process-corner, mismatch or arbitrary temperature/load guarantees.\nThe DC load sweep uses a −1–+1 V external control in 0.1 V increments and\na 1 pA/V transconductance stimulus; it avoids a tiny-current sweep endpoint\ntolerance without changing the DUT or its actual −1–+1 pA load range.\u003c/p\u003e\n14:T1135,\u003cp\u003eSoft solve budget: \u003cstrong\u003e3 hours\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eRead \u003ccode\u003e/protocol/task.json\u003c/code\u003e for input/output paths, constraints and the \u003ccode\u003eresources\u003c/code\u003e object; \u003ccode\u003e/protocol/harness.json\u003c/code\u003e describes the active check and submission interface.\u003c/p\u003e\n\u003cp\u003eUse the supplied task, process resources and runtime protocol. Write\n\u003ccode\u003e/workspace/output/final.gds\u003c/code\u003e and submit it through \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e.\nThe evaluator independently checks the frozen submitted GDS. Collection\nlicenses, reference layouts, research files and host configuration are not\nsolver inputs.\u003c/p\u003e\n\u003ch3\u003eSolve workflow\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eRead the declared circuit and materials, \u003ccode\u003e/protocol/task.json\u003c/code\u003e for paths, constraints and reviewed resources, and \u003ccode\u003e/protocol/harness.json\u003c/code\u003e for capabilities and helper commands. Task inputs under \u003ccode\u003e/task\u003c/code\u003e and resources under \u003ccode\u003e/resources\u003c/code\u003e are read-only; construct the layout in \u003ccode\u003e/workspace\u003c/code\u003e with the declared tools. With layout MCP, paths and commands refer to the remote EDA workspace. Create your own implementation with real devices, interconnect and pins, using your own tool loop without delegating to other agents; reference layouts and author code are not solver inputs.\u003c/li\u003e\n\u003cli\u003eInspect \u003ccode\u003eresources.external\u003c/code\u003e before using external tools. Each command starts a fresh shell: when tool modules are declared, source \u003ccode\u003e/usr/share/Modules/init/bash\u003c/code\u003e and load the selected tool's modules; export its declared \u003ccode\u003etool_environment\u003c/code\u003e settings in that same command. Repeat as needed and use batch or headless operation. Local manuals, command references, and release notes may be available within the declared EDA installation and PDK resource directories. Locate these resources through \u003ccode\u003e/protocol/task.json\u003c/code\u003e and consult the documentation for the installed tool version when diagnosing unfamiliar syntax or tool failures.\u003c/li\u003e\n\u003cli\u003eGenerate an initial candidate and submit a snapshot early. When \u003ccode\u003eprocess-feedback\u003c/code\u003e is available, check the current GDS with layout MCP \u003ccode\u003echeck\u003c/code\u003e or \u003ccode\u003epython -I /protocol/process_check.py\u003c/code\u003e before the final submission. This runs the final evaluator's complete plan and returns engineering diagnostics and candidate measurements, without scores or normalized quality factors. Checks have no count limit and consume the same wall-clock budget. Inspect the physical and functional results and all scored metrics; successful tool execution alone does not establish requirement satisfaction. Read paginated diagnostics with \u003ccode\u003ereport\u003c/code\u003e when using MCP. Local exploratory checks do not replace this complete check.\u003c/li\u003e\n\u003cli\u003eUse the remaining time for measured improvements to the declared quality objectives. Identify the limiting scored metrics, make targeted layout changes, regenerate and check the candidate, and compare measurements with the previous candidate and the stated scoring targets and trade-offs. Preserve the best valid candidate and revert changes that worsen the overall objective. Repeat while time and useful improvements remain; passing validity checks alone is not a stopping condition.\u003c/li\u003e\n\u003cli\u003eStop optimization when the budget expires, all declared quality objectives are achieved, or measured trials support convergence. If stopping early, explain the changes tried, the metric comparisons and the remaining limitations. Track remaining time through session status. At soft-budget expiry, finish or cancel already-started work and submit immediately; do not start another command, check or optimization round. If an MCP execution is running, use \u003ccode\u003epoll\u003c/code\u003e with its \u003ccode\u003eexecution_id\u003c/code\u003e and the returned \u003ccode\u003enext_offset\u003c/code\u003e as \u003ccode\u003eoffset\u003c/code\u003e until completion, or cancel it and wait for it to stop.\u003c/li\u003e\n\u003cli\u003eFinish or cancel outstanding work, restore your best candidate to the declared output path, and explicitly submit it before ending the session. With layout MCP \u003ccode\u003esubmit\u003c/code\u003e, remove the \u003ccode\u003e/workspace/\u003c/code\u003e prefix from \u003ccode\u003eoutput.path\u003c/code\u003e; with the container interface, run \u003ccode\u003epython -I /protocol/submit.py\u003c/code\u003e. Wait for the receipt: only the last accepted snapshot is judged, and writing a file alone is not submission. Acceptance confirms delivery; the framework independently evaluates validity and quality after the session.\u003c/li\u003e\n\u003c/ol\u003e\n6:[\"$\",\"$8\",null,{\"fallback\":[\"$\",\"p\",null,{\"children\":\"Loading published evidence…\"}],\"children\":[\"$\",\"$L10\",null,{\"task\":{\"case_path\":\"tasks/ihp-sg13g2/analog-db/cases/vref_001_vgs/case.toml\",\"coefficient\":5,\"collection\":\"analog-db\",\"configuration_url\":\"/ICLayout-Bench/assets/7457587160e8a1f15af5e5a8489972634917dd6ddbde4cc71df4fa664dbf09f7.txt\",\"description_html\":\"$11\",\"description_path\":\"tasks/ihp-sg13g2/analog-db/cases/vref_001_vgs/problem.md\",\"hours\":3,\"id\":\"ihp-sg13g2.analog-db.vref_001_vgs\",\"inputs\":{\"description\":{\"format\":\"text\",\"path\":\"problem.md\",\"sha256\":\"36c3f3e28e40f495635830288941f685c62fdfaad18d0a08400904ccd93781c0\"},\"netlist\":{\"format\":\"spice\",\"path\":\"materials/circuit.cdl\",\"sha256\":\"4352aeb85c2a7bfb00181738a742d0ccbd5033b422393bafa6a82bd84c1e84b9\",\"subcircuit\":\"vref_001_vgs\"},\"performance\":{\"format\":\"spice\",\"path\":\"materials/testbench.spice\",\"sha256\":\"6b030a347f17808327f462bc90d6f2564f8d0953f7dd96c02da9e82b3fa9ad92\"},\"simulation\":{\"format\":\"spice\",\"path\":\"materials/circuit.spice\",\"sha256\":\"adf8fa7eabe990285cd2e7317bd93a5e7c749bc47881e92fdadb45ec5896fe26\"}},\"licenses\":[{\"name\":\"LICENSE\",\"path\":\"tasks/ihp-sg13g2/analog-db/LICENSE\",\"url\":\"/ICLayout-Bench/assets/644dd511526bc2da77ee7c74714118315 thin the 0 to 1.5 V operating supply envelope.\",\"upper\":1.5},\"scale\":1.5,\"unit\":\"V\"}],\"pdk\":\"ihp-sg13g2\",\"reader\":{\"category\":\"Power \u0026 references\",\"summary\":\"Establishes a voltage reference using a mixed low/high-voltage two-transistor core.\",\"title\":\"Mixed LV/HV VGS Reference with Picoampere Load and Zero-State Recovery\"},\"scoring\":{\"area_metric\":\"functional_area\",\"area_target\":210.61,\"method\":\"layout\",\"rationale\":\"VGS reference: line and temperature drift 31.5%; load regulation 22.5%; startup and disturbance recovery 18%; reference and extrema 9%; supply cost 9%; area 10%. Each objective's weight is divided equally among its metrics.\",\"weights\":{\"functional_area\":0.1,\"injection_error_v\":0.06,\"line_max_v\":0.012857142857,\"line_min_v\":0.012857142857,\"line_span_v\":0.157500000001,\"load_error_v\":0.05625,\"loaded_reference_v\":0.05625,\"maximum_v\":0.012857142857,\"minimum_v\":0.012857142857,\"output_resistance_ohm\":0.05625,\"power_w\":0.045,\"reference_v\":0.012857142857,\"release_error_v\":0.05625,\"return_error_v\":0.06,\"startup_error_v\":0.06,\"supply_a\":0.045,\"temperature_max_v\":0.012857142857,\"temperature_min_v\":0.012857142857,\"temperature_span_v\":0.1575}},\"sections\":{\"Electrical Requirements and Scoring\":\"$12\",\"Inputs and Interface\":\"\u003cp\u003eThe declared inputs are this description, \u003ccode\u003ematerials/circuit.cdl\u003c/code\u003e for native\\nLVS, the equivalent \u003ccode\u003ematerials/circuit.spice\u003c/code\u003e, and \u003ccode\u003ematerials/testbench.spice\u003c/code\u003e.\\nOrdered ports are \u003ccode\u003evdd vref vss\u003c/code\u003e: positive supply, reference output, and return.\\nThe LV NMOS has W/L=2.5/2 um, D=VDD, G=S=VREF, B=VSS. The HV NMOS has\\nW/L=1/2 um, D=G=VREF, S=B=VSS. Both multiplicities are one.\u003c/p\u003e\\n\u003cp\u003eRetain the explicit 40 × 2 um marked substrate tap (A=80 um², P=84 um),\\nwith both terminals on VSS. An unmarked substrate contact establishes that\\nsame-net body boundary. Additional legal same-net contacts are permitted\\nonly when native LVS and the declared checks pass. Do not replace the HV\\ndevice with an LV device or change either gate/source connection. The source\\nsimulator represents the marked tap with its finite 5.9756097561 ohm PDK\\nequivalent; its two terminals are the same net. Parallel fingering is allowed\\nonly if total dimensions, multiplicity, body mapping and all checks agree.\u003c/p\u003e\\n\",\"Objective\":\"\u003cp\u003eImplement the two-transistor \u003ccode\u003evref_001_vgs\u003c/code\u003e reference with its original device\\nsizes and connections. An upper LV NMOS has gate and source at VREF; a lower\\nHV NMOS is diode-connected. The maintained function is a high-impedance,\\napproximately 0.36 V reference for picoampere loads. It is not a bandgap,\\nprecision reference, buffered supply or temperature sensor.\u003c/p\u003e\\n\u003ch3\u003eOptimization objective\u003c/h3\u003e\\n\u003cp\u003eMaximize the declared quality score within the solve budget while satisfying all physical and necessary functional requirements. The first passing DRC, LVS and required electrical checks establish a feasible baseline. Continue improving the scored metrics from that baseline; a passing check or \u003ccode\u003etask_success = true\u003c/code\u003e does not mean that the quality objectives have been achieved.\u003c/p\u003e\\n\",\"Operating Conditions\":\"$13\",\"Physical Requirements\":\"\u003cp\u003eSubmit a GDSII with top cell \u003ccode\u003evref_001_vgs\u003c/code\u003e, at most 1 MiB. It must pass\\nnative main/maximal SG13G2 DRC without waivers, strict named-port LVS, and a\\n100 × 100 um functional outline. Density and antenna checks are outside\\nthe declared standalone DRC scope. The footprint includes every device,\\ncontact and routing drawing layer enumerated in the runtime constraints;\\nannotation and pin-purpose layers cannot conceal functional geometry.\u003c/p\u003e\\n\u003cp\u003eCandidate-derived Magic distributed RC must retain both LV/HV model calls,\\ntheir dimensions and their actual junction/interconnect loading. Extraction\\nidealizes well/substrate contacts and does not establish distributed substrate\\nresistance or noise. Only Metal3 text layer 30/25 supplies extraction labels;\\nnative DRC/LVS still inspect the complete original GDS and physical taps.\\nThe external 100 fF load is additional to candidate capacitance.\u003c/p\u003e\\n\",\"Tools and Submission\":\"$14\"},\"source_url\":\"https://github.com/MacAnalog/spicexplorer-release/blob/263d0322f8900dc331536fbbe6c0e804514fc454/analog-db/raw/vref_001_vgs/ihp-sg13g2/_dut.spice\",\"status\":\"qualified\",\"title\":\"Mixed LV/HV VGS Reference with Picoampere Load and Zero-State Recovery\",\"core\":false},\"catalog\":{\"tasks\":[],\"runs\":[],\"experiments\":[],\"contexts\":[],\"boards\":[]},\"previewRun\":null,\"preview\":null,\"evidenceError\":false}]}]\nc:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n15:I[27201,[\"/ICLayout-Bench/_next/static/chunks/2h60meymns2z5.js\"],\"IconMark\"]\n9:null\ne:[[\"$\",\"title\",\"0\",{\"children\":\"ICLayout-Bench | Circuit layout intelligence\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Independent evaluation of AI for integrated circuit layout. Compare model scores, explore circuit performance and inspect generated layouts.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/ICLayout-Bench/brand/iclayout-bench.svg\",\"type\":\"image/svg+xml\",\"sizes\":\"any\"}],[\"$\",\"$L15\",\"3\",{}]]\n"])</script></body></html>
