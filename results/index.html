:\"analog-db\",\"family\":\"gf180mcuD_tsn_002_ptat_classic\",\"hours\":1,\"id\":\"gf180mcuD.analog-db.tsn_002_ptat_classic\",\"pdk\":\"gf180mcuD\",\"rationale\":\"The 300 um2 integration budget carries 50% for this fixed-device PTAT core. Curvature carries 20%. The worst paired mean/minimum/maximum temperature slope is scored as one 15% group with a 10 uV/C deviation scale, avoiding three correlated rewards for the same transfer law. Startup time carries 10% and peak power 5%. The 2 mV curvature budget over -20 to 100 C is close to the 1.9 mV worst source curvature. Repeated endpoint voltages, final ripple and repeated steady power observations remain diagnostics; fixed topology is not presented as freely tunable temperature compensation.\",\"status\":\"qualified\",\"summary\":\"Produces a temperature-dependent response whose slope and curvature are measured across the declared range.\",\"title\":\"Self-Starting Isolated-Body PTAT Core\",\"published_runs\":26},{\"category\":\"Power \u0026 references\",\"coefficient\":3,\"collection\":\"analog-db\",\"family\":\"gf180_four_transistor_temperature_core\",\"hours\":3,\"id\":\"gf180mcuD.analog-db.tsn_003_ptat_4t_xcoupled\",\"pdk\":\"gf180mcuD\",\"rationale\":\"Temperature-slope cores: temperature slope 42.4%; curvature 31.8%; output endpoints 5.29%; power 10.6%; area 10%. Each objective's weight is divided equally among its metrics.\",\"status\":\"qualified\",\"summary\":\"Produces a temperature-dependent response whose slope and curvature are measured across the declared range.\",\"title\":\"Four-Transistor Positive-Temperature-Slope Core\",\"published_runs\":0},{\"category\":\"Mixed-signal\",\"coefficient\":4,\"collection\":\"gf-r2r-dac\",\"family\":\"gf180_r2r\",\"hours\":1,\"id\":\"gf180mcuD.gf-r2r-dac.r2r\",\"pdk\":\"gf180mcuD\",\"rationale\":\"The 4000 um2 footprint challenges the physical ladder and routing. Area carries 40%, INL 25%, DNL 20% and late-sample absolute accuracy 15%. The 1 uV absolute-error goal stays above the unchanged transient source residual of approximately 0.375 uV. The 0.00002 LSB INL and DNL goals each allocate approximately 0.258 uV to static differential routing error, well above the approximately 2e-12 LSB source sweep residual. Their scales are 0.5 uV and 0.00001 LSB, respectively, so small parasitic errors remain distinguishable. The metric named settling is a second late absolute-error sample at 1 us, while accuracy samples at 1.9 us; it retains zero weight to avoid counting the same equilibrium error twice. These are deterministic nominal-model goals, not a claim of mismatch yield, dynamic glitch suppression or measured settling time.\",\"status\":\"qualified\",\"summary\":\"Converts an eight-bit digital code into an analog voltage through an R-2R network.\",\"title\":\"Eight-Bit R-2R DAC Core\",\"published_runs\":4},{\"category\":\"Mixed-signal\",\"coefficient\":8,\"collection\":\"tt_tnt_gf_vco\",\"family\":\"gf180_vco\",\"hours\":1.5,\"id\":\"gf180mcuD.tt_tnt_gf_vco.vco\",\"pdk\":\"gf180mcuD\",\"rationale\":\"The 250 um2 footprint carries 25%. The three relative phases together carry 45%, centered on exact quarter/half/three-quarter cycles with a one-degree deviation scale; a full-cycle scale hid useful routing asymmetry. The two frequencies retain temperature/load-specific source anchors with 5 and 10 MHz scales and 10% weight each. Tuning and supply power receive 5% each. Faster oscillation alone is not rewarded at the expense of the intended control law.\",\"status\":\"qualified\",\"summary\":\"Generates quadrature oscillation with a voltage-controlled tuning response.\",\"title\":\"Quadrature Voltage-Controlled Oscillator\",\"published_runs\":27},{\"category\":\"Logic \u0026 memory\",\"coefficient\":5,\"collection\":\"voidwalkers-scandff\",\"family\":\"gf180_scan_dff\",\"hours\":1.5,\"id\":\"gf180mcuD.voidwalkers-scandff.scan_dff\",\"pdk\":\"gf180mcuD\",\"rationale\":\"The 100 um2 area goal rewards compact latch, clock and scan-multiplexer ontinuous quality objectives, not functional cutoffs.\",\"status\":\"qualified\",\"summary\":\"Compares differential inputs across three common-mode voltages with a complementary input load.\",\"title\":\"SKY130 Continuous Comparator with Complementary Input Load\",\"published_runs\":10},{\"category\":\"Amplifiers \u0026 RF\",\"coefficient\":3,\"collection\":\"sky130_ef_ip__opamp\",\"family\":\"sky130_opamp\",\"hours\":8,\"id\":\"sky130A.sky130_ef_ip__opamp.opamp\",\"pdk\":\"sky130A\",\"rationale\":\"The 1500 um2 footprint is a 30 by 50 um integration allocation, independent of the feasibility witness. Core dynamic response carries 45% through the upstream CACE output crossing intervals; loaded unity-gain bandwidth carries 25% and area 30%. DC gain and fixed-bias power remain diagnostics. Source-paired slew intervals retain the upstream unloaded fixture and add the existing 0.1/1 pF application loads. The actual 0.5-to-2.8 V interval is measured directly, avoiding the upstream hard-coded 2 V slew numerator.\",\"status\":\"qualified\",\"summary\":\"Amplifies differential inputs with a 3.3 V rail-to-rail operational amplifier under the declared capacitive loads.\",\"title\":\"SKY130 3.3 V Rail-to-Rail Operational Amplifier\",\"published_runs\":0},{\"category\":\"Mixed-signal\",\"coefficient\":4,\"collection\":\"sky130_ef_ip__rdac3v_8bit\",\"family\":\"sky130_dac\",\"hours\":4,\"id\":\"sky130A.sky130_ef_ip__rdac3v_8bit.rdac3v_8bit\",\"pdk\":\"sky130A\",\"rationale\":\"Retain the 9000 um2 integration allocation for the fixed ladder, decoder, level shifters and buffer. Upstream external-reference INL carries 35%, DNL 20%, area 30%, and rising/falling response 7.5% each. DC power is diagnostic. Precision scores use the original CACE definitions rather than endpoint-fit errors; paired same-condition source observations remain the electrical anchor. Directional quality budgets are 0.05 LSB for INL and 0.02 LSB for DNL, or 312.5 uV and 125 uV under the declared references. They resolve layout-induced transfer errors and are not acceptance cutoffs.\",\"status\":\"qualified\",\"summary\":\"Converts all 256 digital codes to buffered analog voltages within the characterized reference interval.\",\"title\":\"SKY130 8-Bit Buffered Resistor DAC\",\"published_runs\":27},{\"category\":\"Mixed-signal\",\"coefficient\":4,\"collection\":\"sky130_ef_ip__samplehold\",\"family\":\"sky130_samplehold\",\"hours\":1.5,\"id\":\"sky130A.sky130_ef_ip__samplehold.samplehold\",\"pdk\":\"sky130A\",\"rationale\":\"The 3000 um2 footprint is a compact buffered-sampler goal. Area receives 50%; held-value error after input reversal receives 25%, tracking 15%, and reacquisition and power 5% each. Tracking and reacquisition approach the same equilibrium, so their repeated observation no longer doubles the main accuracy reward. Error targets refer to the declared sampling times and do not claim faster acquisition or additional corners.\",\"status\":\"qualified\",\"summary\":\"Tracks, holds and reacquires an analog input using a buffered sample-and-hold circuit.\",\"title\":\"SKY130 Buffered Sample and Hold\",\"published_runs\":27},{\"category\":\"Power \u0026 references\",\"coefficient\":2,\"collection\":\"sky130_ef_ip__simple_por\",\"family\":\"sky130_power_on_reset\",\"hours\":1.5,\"id\":\"sky130A.sky130_ef_ip__simple_por.simple_por\",\"pdk\":\"sky130A\",\"rationale\":\"The 1500 um2 area goal rewards compact placement of the startup network. Release timing remains centered on each ramp-specific source crossing: earlier release is not automatically better. A 100 us deviation scale makes parasitic shifts visible without imposing a timing tolerance. Each domain-release metric carries 40%, with its worst source-paired quality over the three supply ramps; area carries 20%. Timing is centered on the ramp-specific source crossing, so early release is not automatically better. Startup power remains diagnostic. The 100 us timing scale and both domains' functional checks remain unchanged.\",\"status\":\"qualified\",\"summary\":\"Generates reset outputs during staggered dual-supply startup and releases them after the supply ramps.\",\"title\":\"SKY130 Dual-Supply Power-On Reset\",\"published_runs\":26}]}]}]\n15:I[27201,[\"/ICLayout-Bench/_next/static/chunks/2h60meymns2z5.js\"],\"IconMark\"]\nc:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n9:null\ne:[[\"$\",\"title\",\"0\",{\"children\":\"ICLayout-Bench | Circuit layout intelligence\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Independent evaluation of AI for integrated circuit layout. Compare model scores, explore circuit performance and inspect generated layouts.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/ICLayout-Bench/brand/iclayout-bench.svg\",\"type\":\"image/svg+xml\",\"sizes\":\"any\"}],[\"$\",\"$L15\",\"3\",{}]]\n"])</script></body></html>
