name: Publish tools image

# Reusable publisher. Callers decide when a commit has passed its checks; this
# workflow pushes the image by digest, checks that exact digest, and only then
# attaches the public tags.
on:
  workflow_call:
    inputs:
      ref:
        description: Full commit SHA to build and publish
        required: true
        type: string
      release_tag:
        description: Release tag to publish in addition to the commit tag
        required: false
        default: ''
        type: string
      update_latest:
        description: Point latest at this commit while it is still the head of main
        required: false
        default: false
        type: boolean
    secrets:
      DOCKERHUB_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
      REF: ${{ inputs.ref }}
    steps:
      - name: Validate inputs
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$REF" =~ ^[0-9a-f]{40}$ ]] || { echo "ref must be a full commit SHA" >&2; exit 1; }
          [[ -z "$RELEASE_TAG" || "$RELEASE_TAG" =~ ^v[0-9A-Za-z.+-]+$ ]] || { echo "invalid release tag" >&2; exit 1; }
          [ -n "$IMAGE" ] || { echo "DOCKERHUB_IMAGE is not configured" >&2; exit 1; }
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Validate Docker build context
        run: bash tests/integration/test_build_context.sh
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push untagged candidate by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: tools
          platforms: linux/amd64
          outputs: type=image,name=${{ vars.DOCKERHUB_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.revision=${{ inputs.ref }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.release_tag || format('sha-{0}', inputs.ref) }}
          cache-from: type=gha,scope=tools
          cache-to: type=gha,scope=tools,mode=max,ignore-error=true
          provenance: mode=min
          sbom: true
      - name: Check installed tools in the pushed digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker run --rm --network none "$IMAGE@$DIGEST" bash -euc '
            test "$(id -u)" != 0
            klayout -v
            ngspice --version
            magic --version
            openvaf --version
            for tool in xschem qucs-s qucsator qucsator_rf qucsconv; do
              command -v "$tool"
            done
            python -I -c "import klayout.db, klayout_pex, gdsfactory, psutil, numpy, scipy, pandas, matplotlib.pyplot, shapely, sympy, networkx, PIL, yaml"
          '
      - name: Tag the checked digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          UPDATE_LATEST: ${{ inputs.update_latest }}
        run: |
          tags=(--tag "$IMAGE:sha-$REF")
          if [ -n "$RELEASE_TAG" ]; then
            tags+=(--tag "$IMAGE:$RELEASE_TAG")
          fi
          if [ "$UPDATE_LATEST" = true ]; then
            head="$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" refs/heads/main | cut -f1)"
            if [ "$head" = "$REF" ]; then
              tags+=(--tag "$IMAGE:latest")
            else
              echo "main has moved to $head; leaving latest unchanged"
            fi
          fi
          docker buildx imagetools create "${tags[@]}" "$IMAGE@$DIGEST"
