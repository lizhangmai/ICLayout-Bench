name: Framework checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.11.2'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --extra results
      - run: uv run --locked ruff check .
      - run: uv run --locked pytest -m 'unit or acceptance_fast'
      - run: git diff --exit-code

  package:
    name: Build package
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.11.2'
          python-version: '3.12'
          enable-cache: true
      - name: Build distributions
        run: uv build --out-dir build/dist
      - name: Install wheel and sdist smoke test
        run: bash scripts/check_distributions.sh build/dist "$GITHUB_SHA"
      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: iclayout-bench-distributions-${{ github.sha }}
          path: build/dist/*
          if-no-files-found: error
          retention-days: 14
