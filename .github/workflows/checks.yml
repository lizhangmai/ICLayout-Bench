name: Framework checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.2'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --extra results
      - run: uv run --locked ruff check .
      - run: uv run --locked pytest -m 'unit or acceptance_fast'
      - run: git diff --exit-code

  package:
    name: Build package
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.2'
          python-version: '3.12'
          enable-cache: true
      - name: Build distributions
        run: uv build --out-dir build/dist
      - name: Install wheel and sdist smoke test
        run: bash scripts/check_distributions.sh build/dist "$GITHUB_SHA"
      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iclayout-bench-distributions-${{ github.sha }}
          path: build/dist/*
          if-no-files-found: error
          retention-days: 14
