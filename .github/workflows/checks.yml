name: Framework checks
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.11.2'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --extra results --group analysis
      - run: uv run --locked ruff check .
      - run: uv run --locked --group analysis pytest -m unit
      - run: git diff --exit-code

  package:
    name: Build package
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.11.2'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked --extra results
      - name: Build distributions
        run: uv build --out-dir build/dist
      - name: Install wheel smoke test
        run: |
          package_venv="$RUNNER_TEMP/iclayout-bench-package"
          python -m venv "$package_venv"
          for bench_wheel in build/dist/*.whl; do
            "$package_venv/bin/python" -m pip install "${bench_wheel}[results]"
          done
          "$package_venv/bin/python" -I - <<'PYCODE'
          import os
          import subprocess
          import sys
          from importlib.metadata import version
          from pathlib import Path

          import benchmarking
          from benchmarking.version import package_version

          assert Path(benchmarking.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          identity = package_version()
          assert identity["version"] == version("iclayout-bench")
          assert identity["commit"] == os.environ["GITHUB_SHA"]
          for name in ("benchmarking.run", "benchmarking.service", "benchmarking.engine.cli"):
              subprocess.run([sys.executable, "-I", "-m", name, "--help"], check=True)
          PYCODE
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: iclayout-bench-distributions-${{ github.sha }}
          path: build/dist/*
          if-no-files-found: error
          retention-days: 14
