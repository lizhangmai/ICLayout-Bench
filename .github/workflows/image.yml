name: Tools image

# Publish main only after Framework checks pass for that exact pushed commit.
# Release tags publish from the release workflow after its package checks.
on:
  workflow_run:
    workflows: [Framework checks]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tools-image-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      vars.DOCKERHUB_IMAGE != '' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    uses: ./.github/workflows/tools-image.yml
    with:
      ref: ${{ github.event.workflow_run.head_sha }}
      update_latest: true
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
