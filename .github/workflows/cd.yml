name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    name: Build Python distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.11.2'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked --extra results
      - run: uv run --locked ruff check .
      - run: uv run --locked pytest -m 'unit or acceptance_fast'
      - name: Check release tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(uv run --locked python -c 'from importlib.metadata import version; print(version("iclayout-bench"))')"
          test "$GITHUB_REF_NAME" = "v${version}" || {
            echo "Tag $GITHUB_REF_NAME does not match project version $version" >&2
            exit 1
          }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Tag $GITHUB_REF_NAME points to $GITHUB_SHA, which is not on main" >&2
            exit 1
          }
      - name: Build distributions
        run: uv build --out-dir build/dist
      - name: Install wheel and sdist smoke test
        run: bash scripts/check_distributions.sh build/dist "$GITHUB_SHA"
      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: iclayout-bench-release-${{ github.sha }}
          path: build/dist/*
          if-no-files-found: error
          retention-days: 14

  image:
    name: Publish release tools image
    needs: package
    if: >-
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
      vars.DOCKERHUB_IMAGE != ''
    uses: ./.github/workflows/tools-image.yml
    with:
      ref: ${{ github.sha }}
      release_tag: ${{ github.ref_name }}
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  pypi:
    name: Publish Python distributions to PyPI
    needs: [package, image]
    # The release image must exist before the package that defaults to it.
    if: >-
      !cancelled() &&
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
      needs.package.result == 'success' &&
      (needs.image.result == 'success' || needs.image.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/iclayout-bench/
    permissions:
      id-token: write
    steps:
      - name: Download checked distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: iclayout-bench-release-${{ github.sha }}
          path: build/dist
      - name: Publish with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: build/dist/
          skip-existing: true

  publish:
    name: Publish GitHub release
    needs: [package, image, pypi]
    if: >-
      !cancelled() &&
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
      needs.pypi.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: iclayout-bench-release-${{ github.sha }}
          path: build/dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" build/dist/* --verify-tag --generate-notes
