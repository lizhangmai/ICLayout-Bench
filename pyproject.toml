[build-system]
requires = ["setuptools>=80", "setuptools-scm>=8,<11", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iclayout-bench"
dynamic = ["version"]
description = "A benchmark for evaluating LLM agents on integrated circuit layout tasks."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "tomli-w>=1.2.0",
    "PyYAML>=6,<7",
    "ciel>=2.6.1,<3",
    "huggingface-hub>=1.0,<2",
    "datasets>=5,<6",
]

[project.optional-dependencies]
results = ["SQLAlchemy>=2.0,<3"]
postgres = ["psycopg[binary]>=3.2,<4"]

[dependency-groups]
eda = ["klayout==0.30.11", "psutil>=7.0", "gdsfactory==7.27.2", "klayout-pex==0.3.12"]
dev = [
    "pytest>=8.4.1",
    "httpx>=0.28,<1",
    "ruff>=0.11.4",
]
analysis = [
    "matplotlib>=3.10,<4",
]

[tool.setuptools]
packages = ["benchmarking", "benchmarking.engine", "benchmarking.service", "benchmarking.participants", "benchmarking.results"]

[tool.setuptools.package-data]
benchmarking = ["model_configs.yaml", "_build.json"]

[tool.ruff]
extend-exclude = ["third_party"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.setuptools_scm]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "setup.py" }, { git = { commit = true, tags = true } }]
